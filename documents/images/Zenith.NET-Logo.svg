<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80">
    <defs>
        <radialGradient id="bg-glow" cx="35%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#7CB8F2" />
            <stop offset="50%" stop-color="#4A90D9" />
            <stop offset="100%" stop-color="#3568B2" />
        </radialGradient>
        <linearGradient id="glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#D0E4F7" />
        </linearGradient>
        <radialGradient id="specular" cx="40%" cy="25%" r="35%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </radialGradient>
        <filter id="glass-blur" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="0.5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Icon: rounded square with crystal -->
    <g transform="translate(8, 8)">
        <rect width="64" height="64" rx="14" fill="url(#bg-glow)" />

        <!-- Crystal — Liquid Glass style -->
        <g filter="url(#glass-blur)">
            <polygon points="32,9 13,39 32,39" fill="url(#glass-fill)" fill-opacity="0.92" />
            <polygon points="32,9 51,39 32,39" fill="#FFFFFF" fill-opacity="0.45" />
            <polygon points="13,39 32,55 32,39" fill="#FFFFFF" fill-opacity="0.3" />
            <polygon points="51,39 32,55 32,39" fill="#B8D4EE" fill-opacity="0.2" />
        </g>

        <!-- Specular highlight -->
    </g>

    <!-- Text -->
    <text x="84" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600"
        fill="#3A7BD5">
        Zenith.NET
    </text>
</svg>