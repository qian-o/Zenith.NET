<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
    <defs>
        <!-- Background: luminous radial gradient (Liquid Glass feel) -->
        <radialGradient id="bg-glow" cx="35%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#7CB8F2" />
            <stop offset="50%" stop-color="#4A90D9" />
            <stop offset="100%" stop-color="#3568B2" />
        </radialGradient>

        <!-- Glass crystal fill: subtle blue-white -->
        <linearGradient id="glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#D0E4F7" />
        </linearGradient>

        <!-- Specular highlight -->
        <radialGradient id="specular" cx="40%" cy="25%" r="35%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </radialGradient>

        <filter id="glass-blur" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Background: rounded square -->
    <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg-glow)" />

    <!-- Crystal / Gem — Liquid Glass style -->
    <g filter="url(#glass-blur)">
        <!-- Upper-left face (brightest — lit side) -->
        <polygon points="128,38 54,156 128,156" fill="url(#glass-fill)" fill-opacity="0.92" />
        <!-- Upper-right face -->
        <polygon points="128,38 202,156 128,156" fill="#FFFFFF" fill-opacity="0.45" />
        <!-- Lower-left face -->
        <polygon points="54,156 128,218 128,156" fill="#FFFFFF" fill-opacity="0.3" />
        <!-- Lower-right face (darkest — refraction shadow) -->
        <polygon points="202,156 128,218 128,156" fill="#B8D4EE" fill-opacity="0.2" />
    </g>

    <!-- Specular highlight on crystal top -->
</svg>