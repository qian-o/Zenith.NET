        </clipPath>
        <linearGradient id="zenith-icon-rim-body" gradientUnits="userSpaceOnUse" x1="256" y1="12" x2="256" y2="500">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity=".075" />
            <stop offset=".42" stop-color="#FFFFFF" stop-opacity=".025" />
            <stop offset="1" stop-color="#FFFFFF" stop-opacity=".003" />
        </linearGradient>
        <linearGradient id="zenith-icon-rim-edge" gradientUnits="userSpaceOnUse" x1="256" y1="12" x2="256" y2="500">
