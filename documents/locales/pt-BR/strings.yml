concepts.resources.memory.title: 'Acesso pela CPU e localização na memória'
concepts.resources.textureUsages.description: 'Os indicadores de transferência descrevem se o recurso é a origem ou o destino de uma cópia na GPU. A possibilidade de acesso direto pela CPU é uma decisão separada, tomada ao escolher a localização da memória.'
concepts.resources.textureUsages.details: 'Os indicadores de uso declaram as funções que uma textura pode desempenhar; alternar entre essas funções exige aplicar as regras correspondentes de {link}.'
concepts.resources.textureUsages.details.link: 'layout e sincronização'
concepts.resources.textureUsages.table.colorAttachment.role: 'Um anexo de cor em uma passagem de renderização.'
concepts.resources.textureUsages.table.depthStencilAttachment.role: 'Um anexo de profundidade e estêncil em uma passagem de renderização.'
concepts.resources.textureUsages.table.headings.role: 'Função'
concepts.resources.textureUsages.table.headings.usage: 'Uso'
concepts.resources.textureUsages.table.none.role: 'Nenhum indicador de uso de textura é declarado.'
concepts.resources.textureUsages.table.sampled.role: 'Dados de textura lidos por uma vinculação de textura amostrada.'
concepts.resources.textureUsages.table.storage.role: 'Dados de textura acessados por uma vinculação de textura de armazenamento para leituras ou gravações de shaders.'
concepts.resources.textureUsages.table.transferDst.role: 'Armazenamento da imagem de destino para uma cópia de GPU.'
concepts.resources.textureUsages.table.transferSrc.role: 'Dados da imagem de origem para uma cópia de GPU.'
concepts.resources.textureUsages.title: 'Usos de textura'
concepts.resources.title: 'Gerenciamento de recursos'
concepts.resources.transfers.context: 'As transferências de textura gravadas no buffer de comandos não incluem transições de layout. Uploads exigem {copyDst}, e downloads exigem {copySrc}. Grave as transições para esses layouts antes da cópia e, depois dela, para o layout exigido pelo próximo uso.'
concepts.resources.transfers.description: 'Uploads copiam dados da CPU para um recurso da GPU; downloads copiam dados do recurso para a memória da CPU. Os métodos de buffers e texturas concluem essa transferência antes de retornar:'
concepts.resources.transfers.details: 'Antes de chamar esses métodos, resolva os acessos conflitantes em outras filas. A espera interna do método abrange sua própria transferência; ela não estabelece uma dependência de outra fila. Nas cópias diretas por memória mapeada, cabe inteiramente a quem chama esperar os acessos conflitantes da GPU.'
concepts.resources.transfers.guidance: 'Para incluir transferências no mesmo envio que outras operações da GPU, grave-as com {commandBufferUpload} ou {commandBufferDownload}. {commandBufferUpload} lê a memória de origem antes de retornar, portanto o ponteiro de origem só precisa permanecer válido durante a chamada. {commandBufferDownload} escreve na memória de destino quando {wait} é chamado no valor de conclusão do envio; mantenha a memória de destino alocada e a memória gerenciada fixada até que {wait} retorne.'
concepts.resources.transfers.notes: 'Nas transferências de textura, o passo de linha é a distância em bytes entre linhas consecutivas dos dados da CPU; o passo de fatia é a distância entre fatias de profundidade consecutivas. Esses valores orientam a cópia entre os dados da CPU e o armazenamento da textura na GPU.'
concepts.resources.transfers.table.bufferDownload.transfer: 'Para {cpuReadOnly}, copia diretamente da memória mapeada. Nos demais casos, envia o download à fila de transferência e espera sua conclusão.'
concepts.resources.transfers.table.bufferUpload.transfer: 'Para {cpuWriteOnly}, copia diretamente para a memória mapeada. Nos demais casos, envia o upload à fila de transferência e espera sua conclusão.'
concepts.resources.transfers.table.headings.method: 'Método'
concepts.resources.transfers.table.headings.transfer: 'Comportamento da transferência'
concepts.resources.transfers.table.textureTransfers.transfer: 'Envia a cópia e as transições de textura à fila gráfica e espera sua conclusão. O sub-recurso selecionado fica no layout final solicitado.'
concepts.resources.transfers.title: 'Transferências imediatas e por buffer de comandos'
concepts.resources.usages.description: '{bufferUsages} e {textureUsages} são enumerações de indicadores que declaram os usos de um recurso. Seus valores são atribuídos a {bufferDescUsages} e {textureDescUsages}, respectivamente. Para vários usos, combine os membros necessários com {bitwiseOr}.'
concepts.resources.usages.title: 'Usos de recursos'
concepts.resources.views.description: 'Uma {bufferView} seleciona um intervalo de bytes e um passo de elemento dentro de um buffer; uma {textureView} seleciona um tipo de textura, formato de pixel e intervalo de sub-recursos compatíveis. Ambas referenciam um armazenamento existente e herdam os usos declarados na sua criação.'
concepts.resources.views.details: 'O identificador do próprio recurso fornece sua visualização padrão. Crie uma visualização separada para escolher outra região ou uma interpretação compatível diferente. Mantenha vivos tanto a visualização quanto o recurso que a sustenta até a GPU terminar de utilizá-los; um identificador não mantém nenhum desses objetos vivo. Ao substituir qualquer um deles, atualize as constantes que contêm o {link} anterior.'
concepts.resources.views.details.link: 'identificador de recurso'
concepts.resources.views.title: 'Visualizações e recursos subjacentes'
concepts.shaders.binding.context: 'O exemplo de computação atribui {inputTextureSampledHandle} a {input} e {outputTextureStorageHandle} a {output}. Em Slang, o parâmetro de tipo de {descriptorHandle} define como o shader acessa cada recurso:'
concepts.shaders.binding.description: '{setConstantBuffer} seleciona um buffer existente e o deslocamento de byte a partir do qual o pipeline atual lê suas constantes. Faça o upload dos parâmetros para esse armazenamento antes de serem usados pelo shader. Se um trabalho anterior da GPU ainda estiver lendo os mesmos bytes, espere sua conclusão antes de atualizá-los.'
concepts.shaders.binding.details: 'Com o buffer de comandos, o pipeline de computação, o buffer de constantes preenchido e as quantidades de grupos de threads prontos, grave o despacho nesta ordem. Selecione primeiro o pipeline, pois a vinculação do buffer de constantes se aplica a ele:'
concepts.shaders.binding.guidance: 'O buffer de constantes precisa do uso {bufferUsagesConstant}. Se vários registros de constantes compartilharem um buffer, o deslocamento inicial de cada registro deve atender ao alinhamento exigido para a vinculação. Essa exigência é independente do layout dos campos internos de cada registro.'
concepts.shaders.binding.notes: '{resourceHandle} é um identificador opaco válido apenas no contexto em que o recurso foi criado.'
concepts.shaders.binding.reference: 'Mantenha o recurso e a visualização usada para obter seu identificador até a conclusão do último acesso do shader. Ao substituir uma textura ou visualização, atualize as constantes que ainda contenham o identificador antigo. O artigo {link} apresenta as regras de propriedade e tempo de vida.'
concepts.shaders.binding.reference.link: 'Gerenciamento de recursos'
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: 'Leitura de elementos estruturados do tipo {t} do shader'
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: 'Leitura e escrita de elementos estruturados do tipo {t} do shader'
concepts.shaders.binding.table.headings.access: 'Acesso pretendido'
concepts.shaders.binding.table.headings.cHandle: 'Identificador C#'
concepts.shaders.binding.table.headings.slangFieldType: 'Tipo de campo Slang'
concepts.shaders.binding.table.samplerHandle.access: 'Estado de amostragem de texturas'
concepts.shaders.binding.table.textureSampledHandle.access: 'Leitura de texturas'
concepts.shaders.binding.table.textureStorageHandle.access: 'Leitura e escrita de texturas de armazenamento'
concepts.shaders.binding.title: 'Buffers de constantes e identificadores de recursos'
concepts.shaders.compilation.description: '{zenithCompiler} compila um ponto de entrada Slang e retorna um {shaderDesc}. O {graphicsApi} do contexto seleciona o formato de saída: {dxil} para DirectX 12, {metallib} para Metal ou {spirv} para Vulkan.'
concepts.shaders.compilation.details: 'Com um contexto gráfico já criado e chamado {context}, compile o shader do triângulo a partir da cópia ao lado do executável:'
concepts.shaders.compilation.guidance: 'O nome do ponto de entrada {vSMain} deve corresponder à declaração no arquivo de shader. Compile os shaders e crie os pipelines na inicialização; depois, reutilize os pipelines durante a renderização. Após a criação dos pipelines, os objetos de shader podem ser liberados, como mostra {link}.'
concepts.shaders.compilation.guidance.link: 'Primeiro triângulo'
concepts.shaders.compilation.title: 'Compilação de shaders'
concepts.shaders.description: 'As declarações em C# e Slang precisam concordar quanto à posição de cada valor e ao acesso feito pelo shader. Layouts de entrada descrevem os atributos dos vértices; declarações de buffers do shader descrevem parâmetros e arrays; identificadores apontam para os recursos usados pelo shader.'
concepts.shaders.dispatch.description: '{dispatch} especifica quantos grupos de threads serão executados. O exemplo de computação declara {numthreads}, portanto cada grupo contém 16 × 16 threads. Para cobrir uma imagem, divida a largura e a altura por 16 e arredonde cada resultado para cima: uma imagem de 17 × 19 precisa de 2 × 2 grupos. O shader verifica as coordenadas de cada thread e ignora as que ficam fora da imagem.'
concepts.shaders.dispatch.details: 'O tamanho de grupo declarado está disponível em {shaderDescThreadGroupSize} e permite calcular as quantidades de grupos passadas a {dispatch}. {computeShaderRendererCs} mostra o cálculo completo. Depois do despacho, o acesso à imagem resultante deve seguir os requisitos descritos em {link}.'
concepts.shaders.dispatch.details.link: 'Sincronização'
concepts.shaders.dispatch.title: 'Grupos de threads'
concepts.shaders.layout.context: 'As {link} ilustram essa organização com as dimensões de uma imagem e dois identificadores de textura. Deslocamentos explícitos indicam onde cada campo começa. A declaração usa {systemRuntimeInteropServices} e {zenithNET}:'
concepts.shaders.layout.context.link: 'constantes C# do exemplo de computação'
concepts.shaders.layout.description: 'Para a entrada de vértices, {inputLayout} define o formato, a semântica e o deslocamento em bytes de cada atributo, além do passo entre vértices. No triângulo, uma posição {float3} precede uma cor {float4}, colocando a cor no deslocamento de byte 12 com passo de 28 bytes. {inputLayoutAdd} calcula essa disposição compacta a partir dos formatos dos elementos; se uma estrutura C# incluir preenchimento, defina os deslocamentos e o passo explicitamente.'
concepts.shaders.layout.details: 'Buffers de constantes contêm parâmetros do shader, e buffers estruturados contêm arrays de elementos tipados. Seus layouts seguem as declarações de Slang, e não {inputLayout}. Ajuste os deslocamentos dos campos, tamanhos dos elementos e preenchimento em C# ao layout do shader compilado. Um tipo não gerenciado de C# pode ser copiado byte a byte, mas seu layout na memória não corresponde necessariamente ao do shader; um {float3} armazenado sem preenchimento em um vértice pode exigir outro alinhamento em um buffer do shader.'
concepts.shaders.layout.guidance: 'Os parâmetros do shader podem incluir identificadores de recursos além de valores comuns. Um identificador aponta para armazenamento já existente, portanto copiá-lo para um buffer de constantes não copia o conteúdo do recurso.'
concepts.shaders.layout.notes: 'A declaração correspondente em {computeShaderSlang} é:'
concepts.shaders.layout.reference: 'Os campos C# ocupam os primeiros 24 bytes: oito para as dimensões e oito para cada identificador. O registro de 256 bytes deixa os bytes restantes como preenchimento. Para outro bloco de parâmetros, ajuste os deslocamentos dos campos ao layout de seu shader. Se vários registros compartilharem um buffer, inclua preenchimento suficiente entre eles para atender ao alinhamento exigido para a vinculação.'
concepts.shaders.layout.title: 'Layout de dados'
concepts.shaders.matrices.description: 'O compilador usa armazenamento de matrizes por linhas, mantendo cada linha contígua. O {link} armazena três valores {matrix4x4} nos deslocamentos 0, 64 e 128. Seu {detail} aplica {mulVectorMatrix} na ordem modelo, visão e projeção.'
concepts.shaders.matrices.description.detail: 'shader'
concepts.shaders.matrices.description.link: 'renderizador de cubo giratório'
concepts.shaders.matrices.details: 'A ordem de armazenamento determina a disposição dos elementos da matriz na memória; a ordem de multiplicação determina a transformação. C# e Slang devem adotar convenções compatíveis.'
concepts.shaders.matrices.title: 'Convenções de matrizes'
concepts.shaders.title: 'Dados de shaders e vinculação'
concepts.synchronization.barriers.context: 'Escolha etapas que incluam os acessos envolvidos e sejam compatíveis com a fila. {barrierStagesAll} inclui todas as etapas compatíveis; selecione um conjunto menor quando a dependência envolver apenas essas etapas.'
concepts.synchronization.barriers.description: 'Considere dois despachos de computação gravados no mesmo buffer de comandos: o primeiro escreve dados de simulação e o segundo os lê. Coloque uma barreira entre eles para que o segundo veja as escritas concluídas. Em um buffer de armazenamento, isso ordena os acessos sem uma transição de layout de textura:'
concepts.synchronization.barriers.details: 'O primeiro argumento identifica as etapas que produzem os dados; o segundo, as etapas que os consomem. Juntos, eles descrevem a ordem de execução e a visibilidade de memória necessárias entre os dois despachos.'
concepts.synchronization.barriers.guidance: 'A {link} usa esse padrão entre etapas da simulação.'
concepts.synchronization.barriers.guidance.link: 'simulação FluidTank'
concepts.synchronization.barriers.title: 'Barreiras do pipeline'
concepts.synchronization.dependencies.description: 'Para cada recurso, identifique os acessos aos mesmos dados. Se algum deles escrever, preserve a ordem necessária entre as operações. Duas leituras não entram em conflito, embora os requisitos de layout de textura e apresentação continuem válidos. Atualizações pela CPU e a liberação de recursos também precisam esperar a GPU terminar de usar o armazenamento afetado.'
concepts.synchronization.dependencies.details: 'O mecanismo adequado depende de onde as operações são executadas:'
concepts.synchronization.dependencies.guidance: 'Quando uma fila escreve em uma textura usada por outra, inclua uma dependência no envio da fila consumidora e grave a transição de layout necessária. Nenhuma dessas etapas bloqueia a CPU. Espere a conclusão do trabalho na GPU antes de a CPU acessar os dados ou liberar o recurso.'
concepts.synchronization.dependencies.table.cpuAccess.mechanism: 'Chame {wait} no valor de conclusão relevante.'
concepts.synchronization.dependencies.table.cpuAccess.situation: 'O acesso da CPU ou a liberação de recursos depende da conclusão na GPU'
concepts.synchronization.dependencies.table.crossQueue.mechanism: 'Passe o {timelineValue} do produtor para o {submit} do consumidor.'
concepts.synchronization.dependencies.table.crossQueue.situation: 'Uma fila consome dados produzidos em outra'
concepts.synchronization.dependencies.table.headings.mechanism: 'Mecanismo'
concepts.synchronization.dependencies.table.headings.situation: 'Situação'
concepts.synchronization.dependencies.table.layoutChange.mechanism: 'Chame {commandBufferTransition} com os layouts anterior e seguinte.'
concepts.synchronization.dependencies.table.layoutChange.situation: 'Um sub-recurso de textura altera como é usado'
concepts.synchronization.dependencies.table.pipelineStages.mechanism: 'Chame {commandBufferBarrier} com os estágios produtor e consumidor.'
concepts.synchronization.dependencies.table.pipelineStages.situation: 'Estágios dependentes da GPU em um fluxo de comandos'
concepts.synchronization.dependencies.title: 'Dependências de acesso'
concepts.synchronization.description: 'A sincronização estabelece a ordem de acesso aos dados compartilhados e garante que operações posteriores vejam os resultados necessários. Em uma dependência de escrita para leitura, quem escreve é o produtor e quem lê é o consumidor. Barreiras e transições de textura coordenam os acessos da GPU; linhas do tempo conectam envios e permitem que a CPU espere a conclusão do trabalho na GPU.'
concepts.synchronization.layouts.context: 'Use {undefined} como layout anterior quando o conteúdo existente puder ser descartado, como em uma imagem nova ou em um anexo que será limpo por completo. Para preservar o conteúdo para carregamento, amostragem ou acumulação, informe o layout do acesso anterior.'
concepts.synchronization.layouts.description: 'Os indicadores de uso declaram as funções permitidas da textura. {textureLayout} descreve o acesso a um sub-recurso, identificado pelo nível de mip e pela camada do array de texturas, em determinado ponto da sequência de comandos. Quando esse acesso mudar, grave uma transição. No exemplo de computação, a textura de saída é escrita em layout {storage} e depois preparada para amostragem em uma passagem gráfica:'
concepts.synchronization.layouts.details: 'Aqui, {outputTexture} foi criada com uso {sampledStorage}, e o sub-recurso selecionado está em {storage}. {default} seleciona o nível de mip 0 e a camada 0. A transição não afeta outros níveis ou camadas.'
concepts.synchronization.layouts.guidance: 'Em {transition}, informe o layout do uso anterior do sub-recurso. A aplicação acompanha esse estado ao gravar comandos e passar texturas entre as etapas de renderização.'
concepts.synchronization.layouts.title: 'Layouts de textura'
concepts.synchronization.reuse.description: 'O triângulo espera cada quadro terminar antes de reutilizar seus dados. Para sobrepor quadros, reserve armazenamento mutável próprio para cada quadro em andamento e acompanhe quando ele volta a estar disponível. Antes de modificar dados, espere o trabalho da GPU que ainda acessa os bytes afetados; antes de liberar um recurso, espere todos os seus usos pendentes.'
concepts.synchronization.reuse.details: 'Redimensionamento e encerramento seguem a mesma regra: impedir novos usos, esperar os existentes terminarem e então substituir ou liberar os recursos. Respeite essa ordem antes de chamar {swapChainResize} ou liberar recursos ou o contexto. Como o tutorial do triângulo já espera a cada quadro, o redimensionamento pode ocorrer entre os callbacks.'
concepts.synchronization.reuse.guidance: '{swapChainPresent} sinaliza e espera em {swapChainQueue} após apresentar. Como o tutorial do triângulo apresenta na fila gráfica, a apresentação continua esperando pelo quadro mesmo sem uma espera explícita no envio. O trabalho em outras filas — incluindo a renderização na fila gráfica quando a cadeia de troca usa a fila de apresentação — deve ser acompanhado separadamente.'
concepts.synchronization.reuse.title: 'Reutilização de recursos'
concepts.synchronization.timelines.context: 'Se a CPU precisar ler o resultado, sobrescrever os dados compartilhados ou liberar os recursos após o consumidor terminar, espere esse envio:'
concepts.synchronization.timelines.description: 'Uma linha do tempo identifica a conclusão na fila por valores crescentes. {submit} retorna um {timelineValue} contendo a linha do tempo e o valor do envio. Campos {value} de linhas do tempo distintas não são diretamente comparáveis.'
concepts.synchronization.timelines.details: 'Considere {producer} e {consumer}, buffers já gravados em duas filas do mesmo contexto, com o consumidor usando dados escritos pelo produtor. Envie-os com esta dependência:'
concepts.synchronization.timelines.guidance: 'A fila consumidora espera o valor de conclusão recebido antes de executar seus comandos. A CPU pode continuar sem chamar {producedWait}. Mantenha os recursos compartilhados vivos até a conclusão de {consumed} e grave as transições de textura necessárias ao acesso do consumidor.'
concepts.synchronization.timelines.notes: 'O valor retornado por {queueTimelineSignal} também pode ser usado para esperar com {wait} ou estabelecer uma dependência para outra fila. {signal} coloca esse ponto de conclusão depois do trabalho já enviado; a GPU o alcança quando esse trabalho termina.'
concepts.synchronization.timelines.title: 'Linhas do tempo e dependências entre filas'
concepts.synchronization.title: 'Sincronização'
