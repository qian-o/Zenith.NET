### YamlMime:Resources
concepts.execution.context.description: Um {graphicsContext} representa um dispositivo de backend e fornece suas filas de gráficos, computação e transferência. Crie os buffers, texturas, shaders e pipelines para uma carga de trabalho por meio do mesmo contexto. Um recurso ou handle criado por outro contexto não pode ser simplesmente vinculado aos buffers de comandos deste.
concepts.execution.context.details: Escolha o backend para a plataforma e a superfície de apresentação. A API permanece compartilhada, mas o suporte ao dispositivo ainda é importante. {capabilities} expõe o nome do dispositivo e os sinalizadores {rayTracingSupported} e {meshShadingSupported}. Verifique o sinalizador correspondente antes de criar uma carga de trabalho opcional, como fazem os exemplos {link} e {detail}. Esses sinalizadores não são uma lista completa de restrições de formato, memória ou plataforma.
concepts.execution.context.details.detail: sombreamento de malhas
concepts.execution.context.details.link: traçado de raios
concepts.execution.context.title: O contexto conecta recursos e filas
concepts.execution.description: Uma aplicação Zenith.NET cria recursos de GPU, grava comandos que os utilizam e envia esses comandos para uma fila. A CPU pode continuar enquanto a GPU executa o envio. Mantenha os recursos válidos até que esse trabalho seja concluído, mesmo após as chamadas de gravação terem retornado.
concepts.execution.ownership.description: "Aqui, propriedade significa responsabilidade de descarte. Uma referência C# mantém um objeto gerenciado acessível; ela não impede que um {dispose} explícito destrua o recurso nativo. Da mesma forma, enviar um comando que usa um buffer não transfere a propriedade desse buffer para a fila."
concepts.execution.ownership.details: No desligamento, pare de enviar novos trabalhos, aguarde os últimos usos em cada fila envolvida, libere os recursos da aplicação e, em seguida, descarte o contexto. O descarte do contexto libera suas próprias filas e auxiliares internos; ele não espera todo o trabalho da aplicação nem descarta todos os recursos criados por ela.
concepts.execution.ownership.guidance: Aplique as mesmas regras de tempo de vida durante a renderização. Guarde o valor de conclusão do último uso de um recurso para saber quando seus bytes podem ser sobrescritos ou quando o recurso pode ser substituído. Consulte {link} para visualizações e tempos de vida de recursos de suporte.
