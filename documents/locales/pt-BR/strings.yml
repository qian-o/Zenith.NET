concepts.resources.title: Gerenciamento de recursos
concepts.resources.transfers.context: Um download grava uma cópia de GPU no armazenamento interno de leitura. A biblioteca copia esses bytes para o destino de CPU fornecido quando redefine o buffer de comandos concluído para reutilização. Mantenha o destino alocado e mantenha a memória gerenciada fixada até que o {wait} do valor de envio retorne.
concepts.resources.transfers.description: "Um upload copia dados da CPU para um recurso de GPU; um download copia dados do recurso de volta para a memória da CPU. Os métodos do próprio recurso concluem essa transferência antes de retornar:"
concepts.resources.transfers.details: "Essas esperas cobrem apenas a transferência enviada pelos métodos. Elas não descobrem dependências de outra fila que já estivesse lendo ou gravando o recurso. Estabeleça essas dependências antes de chamar o método do recurso. Uma cópia direta por memória mapeada também depende de quem chama para garantir a conclusão do trabalho de GPU correspondente."
concepts.resources.transfers.guidance: "Use {commandBufferUpload} ou {commandBufferDownload} quando as cópias precisarem ser gravadas com outros trabalhos. O tempo de vida de seus ponteiros difere:"
concepts.resources.transfers.item: "Um upload copia a origem da CPU para um buffer interno de upload, também chamado de memória de staging, durante a chamada. O ponteiro de origem só precisa permanecer válido durante essa chamada."
concepts.resources.transfers.notes: "Para uma textura, o passo de linha é a distância em bytes entre linhas consecutivas dos dados da CPU, e o passo de fatia é a distância em bytes entre fatias de profundidade consecutivas. Eles não representam o layout interno da textura na memória da GPU. Consulte {link} para distinguir a conclusão da GPU da disponibilidade dos dados lidos."
concepts.resources.transfers.notes.link: Sincronização
concepts.resources.transfers.table.bufferDownload.transfer: Cópia direta da CPU para {cpuReadOnly}; caso contrário, envia um download na fila de transferência e aguarda.
concepts.resources.transfers.table.bufferUpload.transfer: Cópia direta da CPU para {cpuWriteOnly}; caso contrário, envia um upload na fila de transferência e aguarda.
concepts.resources.transfers.table.headings.method: Método
concepts.resources.transfers.table.headings.transfer: "Como os dados são transferidos"
concepts.resources.transfers.table.textureTransfers.method: "{textureUpload} / {textureDownload}"
concepts.resources.transfers.table.textureTransfers.transfer: "Usa a fila gráfica, faz a transição do sub-recurso escolhido para o layout de cópia, depois para o layout final solicitado, e aguarda a conclusão da transferência."
concepts.resources.transfers.title: "Escolher entre transferências imediatas e transferências gravadas"
concepts.resources.usages.description: "{bufferUsages} e {textureUsages} são enumerações de sinalizadores que declaram as funções pretendidas de um recurso. Elas são atribuídas a {bufferDescUsages} e {textureDescUsages}, respectivamente. Uma enumeração de sinalizadores permite que vários membros sejam combinados com {value} quando um recurso tem mais de uma função."
concepts.resources.usages.title: Declarar os usos necessários antes de criar um recurso
concepts.resources.views.description: Uma {bufferView} descreve uma região de buffer e sua interpretação. Uma {textureView} seleciona um tipo de textura compatível, formato e intervalo de sub-recursos. Uma visualização compartilha o armazenamento subjacente; ela não copia os dados nem adiciona usos que faltavam quando o recurso foi criado. Seu intervalo também não é uma garantia portátil de verificação de limites no shader.
concepts.resources.views.details: "Use o handle do próprio recurso para sua visualização padrão ou crie uma visualização quando precisar de outra região ou interpretação compatível. Mantenha referências C# à visualização e ao recurso subjacente enquanto o trabalho de GPU puder usá-los; um handle de recurso sozinho não mantém nenhum dos objetos vivo. Libere-os somente após seu último uso na GPU. Ao substituir qualquer um deles, atualize as constantes que contêm seu antigo {link}."
concepts.resources.views.details.link: "handle de recurso"
concepts.resources.views.guidance: O {link} mostra uma textura de profundidade substituída no redimensionamento. O {detail} mostra uma textura de entrada mantida separada de sua saída gravável. Ambos fazem o tempo de vida do recurso acompanhar o trabalho que realmente o utiliza.
concepts.resources.views.guidance.detail: exemplo de computação
concepts.resources.views.guidance.link: renderizador de cubo giratório
concepts.resources.views.title: "Manter visualizações e seus recursos subjacentes utilizáveis juntos"
concepts.shaders.binding.context: "No exemplo de computação, {input} é preenchido com {inputTextureSampledHandle} e {output} com {outputTextureStorageHandle}. O {descriptorHandle} tipado do Slang informa ao shader como acessar cada recurso:"
concepts.shaders.binding.description: "{setConstantBuffer} vincula um buffer e um deslocamento de bytes para os dados de constantes da pipeline atual. Ele vincula armazenamento visível pela GPU existente; não faz upload de um valor C#. Preencha o buffer primeiro e garanta que os leitores anteriores da GPU tenham terminado antes de sobrescrever seus bytes."
concepts.shaders.binding.details: "Defina a pipeline antes de seu buffer de constantes. Para uma carga de trabalho de computação com recursos já criados e carregados, a gravação usa esta ordem:"
concepts.shaders.binding.guidance: Este fragmento assume um {commandBuffer} em gravação, uma {computePipeline}, um {constantBuffer} carregado com uso {bufferUsagesConstant} e as contagens de grupos de threads para a carga de trabalho. O deslocamento 0 vincula o início do buffer. Se vários registros de dados de constantes compartilharem um buffer, o deslocamento inicial de cada registro deverá atender ao alinhamento de vinculação do backend. Esse requisito é independente do layout dos campos dentro do registro.
concepts.shaders.binding.notes: "{resourceHandle} armazena dois campos de 32 bits, mas sua interpretação pertence ao backend. Não o trate como um índice de descritor universal, endereço ou valor que possa ser transferido entre contextos. Um handle não cria um recurso, não adiciona um uso ausente nem realiza sincronização."
concepts.shaders.binding.reference: Mantenha referências ao recurso e a qualquer visualização usada para obter seu handle, e descarte-os apenas após a conclusão do último uso do shader. Ao substituir uma textura ou visualização, atualize as constantes que contêm seu handle antigo. O {link} explica essa relação de tempo de vida.
concepts.shaders.binding.reference.link: Gerenciamento de recursos
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: Ler elementos estruturados do tipo de shader {t}.
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: Ler ou gravar elementos estruturados do tipo de shader {t}.
concepts.shaders.binding.table.headings.access: Acesso pretendido
concepts.shaders.binding.table.headings.cHandle: "Handle C#"
concepts.shaders.binding.table.headings.slangFieldType: Tipo de campo Slang
concepts.shaders.binding.table.samplerHandle.access: Fornecer estado de amostragem de textura.
concepts.shaders.binding.table.textureSampledHandle.access: Ler uma textura.
concepts.shaders.binding.table.textureStorageHandle.access: Ler ou gravar uma textura de armazenamento.
concepts.shaders.binding.title: Vincular o buffer de constantes e os recursos que ele descreve
concepts.shaders.compilation.description: "O {zenithCompiler} compila um ponto de entrada nomeado do Slang e retorna uma {shaderDesc}. Use o {graphicsApi} do contexto para que o resultado seja direcionado ao backend que criará o shader: DXIL para DirectX 12, uma biblioteca Metal para Metal ou SPIR-V para Vulkan."
concepts.shaders.compilation.details: "Por exemplo, com um {context} existente e o shader do triângulo copiado ao lado do executável:"
concepts.shaders.compilation.guidance: "{vSMain} deve corresponder exatamente ao nome do ponto de entrada no arquivo de shader. Mantenha os objetos de shader válidos enquanto cria a pipeline e, em seguida, descarte-os após a criação da pipeline, como mostrado em {link}. Execute essa inicialização uma vez em vez de recompilar a cada quadro."
concepts.shaders.compilation.guidance.link: Primeiro triângulo
concepts.shaders.compilation.title: Compilar um ponto de entrada para o contexto selecionado
concepts.shaders.description: "Um shader recebe dados fornecidos pela aplicação. Atributos de vértice descrevem vértices individuais; buffers armazenam parâmetros ou arrays; handles de recursos identificam outros recursos que o shader acessará. As declarações C# e as declarações Slang devem concordar sobre o que esses valores significam. Fazer a correspondência de um nome de campo não é suficiente: layout, acesso a recursos e vinculação precisam coincidir."
concepts.shaders.dispatch.description: "{dispatch} recebe o número de grupos de threads. O ponto de entrada {numthreads} do exemplo de computação executa 16 × 16 threads por grupo. Divida as dimensões da imagem por 16 e arredonde para cima para encontrar as contagens de grupos. Por exemplo, uma imagem de 17 × 19 precisa de 2 × 2 grupos. O shader verifica suas coordenadas de pixel em relação às dimensões da imagem porque os últimos grupos podem conter threads fora da imagem."
concepts.shaders.dispatch.details: O compilador armazena o tamanho de grupo declarado do ponto de entrada em {shaderDescThreadGroupSize}; ele não converte as dimensões em pixels fornecidas ao {dispatch} em contagens de grupos. Use o {computeShaderRendererCs} com seu shader para o exemplo completo de vinculação e dispatch, e {link} antes que outra passagem consuma a saída.
concepts.shaders.dispatch.details.link: Sincronização
concepts.shaders.dispatch.title: Despachar grupos de threads, não pixels
concepts.shaders.layout.context: "As {link} tornam seus deslocamentos explícitos. Esta declaração precisa de {systemRuntimeInteropServices} e {zenithNET} no escopo:"
concepts.shaders.layout.context.link: "constantes C# do exemplo de computação"
concepts.shaders.layout.description: "Para a entrada de vértices, o {inputLayout} da pipeline descreve formatos, deslocamentos, stride e semânticas. A posição {float3} do triângulo seguida por uma cor {float4} ocupa 28 bytes, com a cor no byte 12. {inputLayoutAdd} calcula esse layout compactado; ele não inspeciona a struct C#. Se os campos C# contiverem padding, forneça um layout correspondente em vez de presumir que os campos estão compactados."
concepts.shaders.layout.details: "Buffers de constantes contêm parâmetros de shader, enquanto buffers estruturados contêm arrays de elementos de um tipo declarado. Ambos são lidos de acordo com suas declarações Slang. Eles não usam {inputLayout}. Verifique deslocamentos de campos e tamanhos de elementos para a representação de shader compilada, incluindo padding. Um tipo C# não gerenciado é adequado para cópia como bytes, mas isso por si só não prova que ele corresponda a um tipo de shader. Em particular, não aplique o layout {float3} compactado de um vértice a todos os buffers de shader."
concepts.shaders.layout.guidance: Um handle de recurso é um valor pequeno que faz referência a um recurso existente. Copiar o handle para um buffer de constantes não copia o conteúdo do recurso.
concepts.shaders.layout.notes: "A declaração correspondente em {computeShaderSlang} é:"
concepts.shaders.layout.reference: "As dimensões ocupam os primeiros oito bytes, seguidas por dois handles de recursos de oito bytes. O exemplo em C# reserva 256 bytes no total. Esse tamanho é o tamanho de armazenamento escolhido pelo exemplo, não uma regra de que todas as structs Slang ou cargas úteis de constantes devam ocupar 256 bytes. Preencher o tamanho total também não corrige um campo no deslocamento errado."
concepts.shaders.layout.title: A entrada de vértices e os dados de shaders têm regras de layout diferentes
concepts.shaders.matrices.description: "O compilador solicita armazenamento de matrizes por linhas (row-major), mantendo os elementos de cada linha contíguos. O {link} posiciona três valores {matrix4x4} nos deslocamentos 0, 64 e 128. Seu {detail} usa {mulVectorMatrix} na ordem modelo, visualização e projeção."
concepts.shaders.matrices.description.detail: shader
concepts.shaders.matrices.description.link: renderizador de cubo giratório
concepts.shaders.matrices.details: A ordem de armazenamento determina como os elementos da matriz ocupam a memória; a ordem de multiplicação determina a transformação. Mantenha ambos os lados consistentes. Adicionar uma transposição sem verificar essas duas opções pode ocultar uma inconsistência enquanto introduz outra.
concepts.shaders.matrices.title: Manter o armazenamento e a multiplicação de matrizes consistentes
concepts.shaders.title: Dados de shaders e vinculação
concepts.synchronization.backends.description: DirectX 12 e Vulkan codificam transições de textura com informações de layout e acesso. O Metal não tem nenhuma operação na implementação de {transition} do Zenith.NET. O Metal agrupa o trabalho gravado em codificadores de renderização e computação. O backend insere barreiras de visibilidade quando encerra esses grupos, disponibilizando gravações anteriores para trabalhos posteriores. Chamadas explícitas a {barrier} lidam com dependências como dispatches sucessivos de computação dentro do mesmo codificador.
concepts.synchronization.backends.details: Essa distinção é importante ao alterar uma carga de trabalho. No {link}, o dispatch é seguido por uma passagem de renderização gráfica, o que também cria um limite de codificador no Metal. Dois dispatches de computação dependentes não criam esse limite apenas alterando o layout declarado da textura. Mantenha as transições exigidas pela API compartilhada e identifique separadamente a dependência entre os comandos reais de produção e consumo.
concepts.synchronization.backends.details.link: exemplo de computação
concepts.synchronization.backends.title: Uma transição não é idêntica em todos os backends
concepts.synchronization.barriers.context: "{barrierStagesAll} é um escopo mais amplo, não um detector automático de dependências. Selecione estágios que realmente cubram o trabalho e use-os apenas em uma fila que suporte essas operações."
concepts.synchronization.barriers.description: "Considere dois dispatches de computação: o primeiro grava dados de simulação e o segundo lê esses dados para executar a etapa seguinte. Ambos usam buffers de armazenamento, portanto não há layout de textura a ser alterado. Insira isto entre os dispatches em seu buffer de comandos:"
concepts.synchronization.barriers.details: O primeiro argumento identifica o estágio produtor e o segundo o estágio consumidor. A barreira estabelece a dependência correspondente de execução e memória na GPU. O backend traduz esses estágios em suas regras de execução e acesso à memória. Esta barreira não altera o layout de uma textura nem espera por todo o trabalho no dispositivo.
concepts.synchronization.barriers.guidance: "A {link} usa esse padrão entre dispatches dependentes. Coloque a barreira onde ocorre a dependência. Uma barreira gravada depois do consumidor não pode ordenar esse consumidor após um produtor anterior."
concepts.synchronization.barriers.guidance.link: simulação FluidTank
concepts.synchronization.barriers.title: Ordenar comandos dependentes com uma barreira
concepts.synchronization.dependencies.description: Para cada recurso compartilhado, identifique a operação que o acessa primeiro, a operação seguinte e se algum dos acessos grava. Ler os mesmos dados duas vezes não requer ordenação para proteger seu conteúdo, embora alterações de layout ou apresentação possam impor outros requisitos. Uma gravação seguida por uma leitura, uma leitura seguida por uma sobrescrita ou duas gravações podem exigir uma dependência.
concepts.synchronization.dependencies.details: "Em seguida, escolha o mecanismo de acordo com onde essas operações são executadas:"
concepts.synchronization.dependencies.guidance: Esses mecanismos são relacionados, mas não intercambiáveis. Enviar comandos em ordem não substitui todas as dependências de memória. Uma espera de fila não declara um novo layout de textura, e uma barreira de comandos não aguarda na thread de CPU chamadora.
concepts.synchronization.dependencies.table.cpuAccess.mechanism: Chamar {wait} no valor de conclusão relevante.
concepts.synchronization.dependencies.table.cpuAccess.situation: A CPU deve esperar antes de acessar ou liberar dados
concepts.synchronization.dependencies.table.crossQueue.mechanism: Passar seu {timelineValue} para o {submit} do buffer de comandos consumidor.
concepts.synchronization.dependencies.table.crossQueue.situation: Um envio em outra fila produz os dados
concepts.synchronization.dependencies.table.headings.mechanism: Mecanismo
concepts.synchronization.dependencies.table.headings.situation: Situação
concepts.synchronization.dependencies.table.layoutChange.mechanism: "{commandBufferTransition} com seus layouts anterior e seguinte."
concepts.synchronization.dependencies.table.layoutChange.situation: Um sub-recurso de textura altera como é usado
concepts.synchronization.dependencies.table.pipelineStages.mechanism: "{commandBufferBarrier} com os estágios produtor e consumidor."
concepts.synchronization.dependencies.table.pipelineStages.situation: Estágios dependentes da GPU em um fluxo de comandos
concepts.synchronization.dependencies.title: Começar com o produtor e o consumidor
concepts.synchronization.description: Um comando que lê dados gravados por um comando anterior depende de que essas gravações estejam concluídas e visíveis para ele. Quem grava é o produtor; quem lê é o consumidor. A CPU também precisa de um ponto de conclusão antes de ler, sobrescrever ou liberar dados compartilhados. O Zenith.NET fornece barreiras, transições de textura e linhas do tempo para essas diferentes dependências.
concepts.synchronization.layouts.context: "{undefined} significa que o conteúdo anterior não precisa ser preservado. É adequado para uma nova imagem ou um anexo que será totalmente limpo. Não é uma forma de evitar rastrear o layout de uma imagem cujo conteúdo será carregado, amostrado ou acumulado."
concepts.synchronization.layouts.description: "Sinalizadores de uso descrevem quais funções uma textura suporta. {textureLayout} descreve como um sub-recurso específico será acessado para uma operação. Um sub-recurso é um nível mip e uma camada de array selecionados. Alterar seu layout prepara esse acesso; não converte a textura para um formato de pixel diferente. Por exemplo, o exemplo de computação grava uma textura de saída no layout {storage} e depois a amostra em uma passagem gráfica. Entre esses usos, ele grava:"
concepts.synchronization.layouts.details: Este fragmento assume que {outputTexture} foi criada com uso {sampledStorage} e que seu sub-recurso selecionado está no layout {storage}. {default} seleciona o nível mip 0 e a camada de array 0. A operação não faz a transição de cada mip ou camada de uma textura.
concepts.synchronization.layouts.guidance: A aplicação fornece o layout anterior. {transition} não mantém um rastreador de layout visível pela aplicação nem infere esse valor a partir de comandos anteriores. Rastreie o layout onde quer que um recurso passe entre estágios de renderização.
concepts.synchronization.layouts.title: Rastrear o layout de cada sub-recurso de textura
concepts.synchronization.readback.description: "{isCompleted} apenas consulta se a linha do tempo da GPU atingiu um valor. Ele não recupera buffers de comandos nem copia os dados de download armazenados temporariamente para o ponteiro de destino da aplicação."
concepts.synchronization.readback.details: "{commandBufferDownload} grava primeiro uma cópia no armazenamento interno de leitura. Ao redefinir o buffer de comandos concluído para reutilização, a CPU copia os dados para o ponteiro fornecido. Mantenha esse destino válido e a memória gerenciada fixada até que {wait} retorne para esse envio de download. Só então leia os dados ou libere a memória. Esperar por um envio posterior de outra fila não faz a sondagem da fila que gerencia o download."
concepts.synchronization.readback.guidance: É por isso que sondar {isCompleted} e ler imediatamente o destino de um download assíncrono é insuficiente. O {link} aborda os caminhos de cópia direta e transferência intermediária.
concepts.synchronization.readback.guidance.link: Gerenciamento de recursos
concepts.synchronization.readback.title: A conclusão na GPU e os dados baixados na CPU são etapas separadas
concepts.synchronization.reuse.description: Para um primeiro renderizador, uma espera imediata após cada quadro é direta. Para sobrepor o trabalho, forneça aos quadros pendentes dados mutáveis separados e guarde o valor de conclusão do uso final de cada quadro. Antes de atualizar um buffer de constantes, substituir uma textura ou descartar uma pipeline, conclua todos os acessos pendentes ao recurso afetado.
concepts.synchronization.reuse.details: No redimensionamento ou desligamento, pare novos usos antes de esperar pelos antigos. {swapChainResize}, descarte de recursos e descarte de contexto não servem como esperas gerais para o trabalho da aplicação. O triângulo pode redimensionar com segurança entre callbacks porque cada quadro precedente já concluiu seu envio.
concepts.synchronization.reuse.guidance: O {swapChainPresent} atual também sinaliza e aguarda na fila gráfica após sua operação de apresentação. Portanto, remover a espera de envio explícita do triângulo não estabelece por si só um loop de apresentação sobreposto. Uma espera na fila gráfica também não diz nada sobre trabalhos independentes ainda em execução em outra fila.
concepts.synchronization.reuse.title: Reutilizar dados somente após o seu acesso final
concepts.synchronization.timelines.context: "Antes que a CPU leia, sobrescreva ou libere esses recursos, aguarde seu uso final:"
concepts.synchronization.timelines.description: Uma linha do tempo rastreia a conclusão em uma fila usando valores crescentes. {submit} retorna um {timelineValue} contendo essa linha do tempo e o valor associado ao envio. Valores de conclusão de diferentes linhas do tempo não são comparáveis apenas por seus campos numéricos {value}.
concepts.synchronization.timelines.details: "Suponha que {producer} e {consumer} sejam buffers de comandos já gravados de duas filas do mesmo contexto. O produtor grava dados que o consumidor usa. Envie-os assim:"
concepts.synchronization.timelines.guidance: Passar o valor produzido faz com que a fila consumidora aguarde por ele na GPU. A CPU não chama {producedWait} aqui. Mantenha os recursos compartilhados válidos até que {consumed} seja concluído e grave quaisquer alterações de layout de textura exigidas pelo consumidor.
concepts.synchronization.timelines.notes: "{wait} aguarda o valor da linha do tempo e verifica a fila responsável em busca de envios concluídos. Os buffers de comandos finalizados são redefinidos para reutilização, e seus dados de download armazenados temporariamente são copiados para os destinos de CPU fornecidos. {queueTimelineSignal} também pode enfileirar um ponto de conclusão após o trabalho já enviado para essa fila. Chamar {signal} não significa que a GPU já atingiu o ponto."
concepts.synchronization.timelines.title: Usar uma linha do tempo para conclusão e transferências entre filas
concepts.synchronization.title: Sincronização
