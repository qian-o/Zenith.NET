samples.description: "Escolha um exemplo focado para o recurso que deseja estudar. Cada exemplo faz link com o renderizador em C# e seu respectivo shader em Slang. Comece com {link} se desejar uma aplicação completa explicada a partir de um projeto vazio."
samples.description.link: Primeiro triângulo
samples.execution.description: "{link} contém seis renderizadores independentes em uma única aplicação de desktop. Use o SDK do .NET 10 e um backend de desktop suportado, conforme descrito abaixo. Compile e execute a aplicação e, em seguida, escolha um exemplo no menu do console:"
samples.execution.description.link: ZenithTutorials
samples.execution.details: O host seleciona o DirectX 12 no Windows, Metal no macOS e Vulkan no Linux. Use um dispositivo, driver e ambiente de compilador de shader suportados pelo backend selecionado. O caminho de janelas do Linux requer X11 ou XWayland. O {link} declara as dependências de pacotes e copia os recursos de shader e textura necessários em tempo de execução.
samples.execution.details.link: arquivo de projeto
samples.execution.guidance: Os exemplos compartilham código de janelas e apresentação. Você pode escolher qualquer exemplo de forma independente com base no recurso que deseja estudar.
samples.execution.title: Executar os exemplos do tutorial
samples.host.description: "{appCs} cria o contexto, a janela e a cadeia de troca. Ele obtém um buffer de comandos, chama o renderizador selecionado, envia o quadro e o apresenta. {iRendererCs} define os métodos de atualização, renderização, redimensionamento e descarte do renderizador."
samples.host.details: Computação e traçado de raios produzem texturas fora da tela. {texturePresenterCs} e {presentTextureSlang} desenham essas texturas na textura de saída do quadro atual da janela. O host continua sendo o proprietário do envio e da apresentação da cadeia de troca.
samples.host.title: Host e apresentação compartilhados
samples.indirectDrawing.description: Desenha várias cópias de um cubo usando um buffer de argumentos indiretos indexados e dados por instância em um buffer estruturado. A CPU fornece os argumentos de desenho e atualiza as transformações. Use para compreender o layout de argumentos indiretos e o acesso de shaders a dados de instância antes de adicionar argumentos gerados pela GPU.
samples.indirectDrawing.details: "{indirectDrawingRendererCs} · {indirectDrawingSlang}"
samples.indirectDrawing.title: Desenho indireto
samples.meshShading.description: Usa um task shader para descartar instâncias de esferas e passar seus índices para um mesh shader que emite geometria. O renderizador verifica {contextCapabilitiesMeshShadingSupported} antes de criar sua pipeline. Use para rastrear handles de recursos e dados de payload através dos estágios de tarefa e malha.
samples.meshShading.details: "{meshShadingRendererCs} · {meshShadingSlang}"
samples.meshShading.title: Sombreamento de malhas
samples.rayTracing.description: Cria estruturas de aceleração de nível inferior e superior para um chão e esferas procedurais e, em seguida, executa consultas de raios em linha em um shader de computação. O renderizador verifica {contextCapabilitiesRayTracingSupported} antes de construir a carga de trabalho. Use este exemplo para entradas de estrutura de aceleração e travessia de raios no lado do shader.
samples.rayTracing.details: "{rayTracingRendererCs} · {rayTracingSlang}"
samples.rayTracing.title: Traçado de raios
samples.title: Exemplos
samples.triangle.description: Cria um buffer de vértices e um layout de entrada correspondente e, em seguida, desenha três vértices por meio de uma pipeline gráfica. Use para conectar a criação de recursos com os comandos em uma passagem de renderização.
samples.triangle.details: "{helloTriangleRendererCs} · {helloTriangleSlang} · {link}"
samples.triangle.details.link: Tutorial completo
samples.triangle.title: Olá triângulo
samples.workloads.description: "O {link} do repositório principal contém aplicações que combinam vários recursos. Seus projetos fazem referência ao código-fonte da biblioteca. A partir de um clone do Zenith.NET, execute o projeto escolhido, por exemplo:"
samples.workloads.description.link: diretório Experiments
samples.workloads.details: Os experimentos com janelas usam as mesmas opções de host para Windows, macOS e Linux/X11. Para desenhar dentro de Avalonia, WinForms, WPF, WinUI/Uno ou MAUI, consulte {link} para obter informações sobre o ciclo de vida do quadro do controle e links de implementação.
samples.workloads.details.link: Integração de plataforma
samples.workloads.table.cornellBox.example: "{link}"
samples.workloads.table.cornellBox.example.link: CornellBox
samples.workloads.table.cornellBox.whatItDemonstratesAndRequires: Traçado de caminhos, redução de ruído, mapeamento de tons, upscaling e controles ImGui. Requer suporte a traçado de raios e o ambiente de compilação de shaders para seu backend de desktop.
samples.workloads.table.fluidTank.example: "{link}"
samples.workloads.table.fluidTank.example.link: FluidTank
samples.workloads.table.fluidTank.whatItDemonstratesAndRequires: Simulação de fluidos por computação, dependências entre estágios de simulação e renderização de superfície em várias passagens. Requer seu backend de desktop e o ambiente de compilação de shaders.
samples.workloads.table.headings.example: Exemplo
samples.workloads.table.headings.whatItDemonstratesAndRequires: O que demonstra e o que requer
samples.workloads.table.inkCanvas.example: "{link}"
samples.workloads.table.inkCanvas.example.link: InkCanvas
samples.workloads.table.inkCanvas.whatItDemonstratesAndRequires: Desenho com Skia e tratamento de entrada em uma janela nativa. Requer o backend e a biblioteca nativa do Skia para a plataforma de destino.
samples.workloads.table.platformDetection.example: "{link}"
samples.workloads.table.platformDetection.example.link: PlatformDetection
samples.workloads.table.platformDetection.whatItDemonstratesAndRequires: Tenta a criação de contexto para cada backend e relata os recursos do dispositivo. Se a criação do contexto falhar, ela será relatada como não suportada; esse resultado também pode indicar um driver ausente ou dependência de tempo de execução não atendida.
samples.workloads.title: Explorar cargas de trabalho maiores
tutorial.context.description: A janela agora pode abrir, mas ainda não criamos os objetos de GPU que renderizarão nela. Um {graphicsContext} fornece acesso ao backend gráfico selecionado e às suas filas de comandos.
tutorial.context.details: "Insira este bloco {emphasis}:"
tutorial.context.details.emphasis: após as diretivas using, antes de {iWindowWindow}
tutorial.context.guidance: Os branches selecionam DirectX 12 no Windows, Metal no macOS e Vulkan no Linux. O código de renderização a seguir usa a API compartilhada do Zenith.NET. Solicitamos validação durante o desenvolvimento e exibimos as mensagens relatadas por meio de {validationMessage}. Os diagnósticos dependem do backend e dos componentes de validação disponíveis na máquina.
tutorial.context.title: Criar o contexto gráfico
tutorial.description: Crie uma aplicação de console .NET que abre uma janela e desenha um triângulo com um gradiente de cor suave. Você aprenderá como dados de vértices, shaders e estado de pipeline funcionam juntos e, em seguida, gravará e enviará os comandos que produzem a imagem.
tutorial.details: Siga as seções em ordem. Primeiro você abrirá uma janela vazia, depois exibirá uma cor de fundo e, finalmente, desenhará o triângulo. Cada ponto de verificação confirma uma parte da aplicação antes de você adicionar a próxima. A inicialização é executada uma vez; o callback de renderização grava um novo quadro a cada chamada.
tutorial.draw.context: "Os argumentos para {draw} são:"
tutorial.draw.description: "No callback {windowRender}, substitua {addTheTriangleDrawCommandsHereLater} por estes três comandos, entre {beginRenderPass} e {endRenderPass}:"
tutorial.draw.details: "{setPipeline} seleciona os shaders e o estado que acabamos de criar. Defina-o antes de vincular dados de vértices: o backend usa o layout de entrada da pipeline para interpretar a vinculação."
tutorial.draw.guidance: "{setVertexBufferVertexBuffer} vincula o buffer a partir do deslocamento de byte 0 ao slot de entrada 0. Esse slot corresponde à entrada única em {inputLayouts}. Ele não copia nem envia os dados novamente."
tutorial.draw.notes: Os comandos continuam sendo apenas gravados neste ponto. As chamadas {submitWait} e {present} já presentes no final do callback de renderização executam o trabalho e exibem o resultado. A limpeza continua necessária porque o triângulo cobre apenas parte da imagem; o fundo também deve receber uma cor definida a cada quadro.
tutorial.draw.table.firstInstance.meaning: Iniciar a numeração de instâncias em zero.
tutorial.draw.table.firstVertex.meaning: Começar com o primeiro vértice no buffer.
tutorial.draw.table.headings.argument: Argumento
tutorial.draw.table.headings.description: Valor
tutorial.draw.table.headings.meaning: Significado
tutorial.draw.table.instanceCount.meaning: Desenhar uma cópia do triângulo.
tutorial.draw.table.vertexCount.meaning: Ler três vértices.
tutorial.draw.title: Desenhar o triângulo dentro da passagem
tutorial.execution.description: "Compile e execute a partir do diretório {firstTriangle}:"
tutorial.execution.details: A janela deve exibir um triângulo com um canto superior vermelho, um canto inferior direito verde e um canto inferior esquerdo azul contra um fundo escuro. O interior deve exibir um gradiente suave entre essas cores.
tutorial.execution.guidance: Redimensione a janela. O callback de redimensionamento atualiza as dimensões do framebuffer e redimensiona a cadeia de troca. A passagem de renderização estabelece uma viewport que corresponde a essa imagem. Como as posições dos vértices permanecem em coordenadas normalizadas, o triângulo mantém a mesma fração da largura e altura da janela; alterar a proporção da tela pode esticar sua forma. Preservar a proporção de um objeto requer uma política de projeção ou viewport, o que está além deste primeiro desenho.
tutorial.execution.title: Executar, redimensionar e fechar
tutorial.frame.commands.context: Após {endRenderPass}, a segunda transição prepara a imagem para apresentação. {submit} conclui a gravação e envia o buffer de comandos; {wait} aguarda a GPU concluir esse envio. {present} então solicita a exibição da imagem renderizada.
tutorial.frame.commands.description: Uma passagem de renderização agrupa operações de desenho que usam os mesmos anexos. Aqui, o anexo de cor é a textura de saída da cadeia de troca, a imagem que recebe nosso desenho. {colorAttachmentClear} cria uma descrição instruindo a passagem a limpar para a cor RGBA especificada e manter o resultado quando a passagem terminar. {beginRenderPass} grava essas instruções; a GPU realiza a limpeza após o envio dos comandos.
tutorial.frame.commands.details: Os colchetes contêm nosso único anexo de cor. O argumento {null} significa que não há anexo de profundidade/estêncil, que armazenaria valores de profundidade e máscaras de estêncil para testes de profundidade e estêncil.
tutorial.frame.commands.guidance: "{beginRenderPass} define uma viewport e um retângulo de recorte (scissor) que cobrem o anexo. A viewport mapeia as coordenadas renderizadas para pixels, e o retângulo de recorte limita quais pixels podem ser gravados. Esses padrões cobrem toda a textura de saída, como necessário para este triângulo."
tutorial.frame.commands.title: Limpar, enviar e apresentar
tutorial.frame.description: Primeiro preencha a imagem com uma única cor de fundo. Essa operação é chamada de limpeza (clear). Se essa cor aparecer na janela, a superfície, o envio de comandos e o caminho de apresentação estão funcionando juntos. Esse ponto de verificação permite testar o loop de quadros antes de adicionar geometria e shaders.
tutorial.frame.details: "Um callback de renderização é um código que o Silk.NET chama quando é hora de desenhar um quadro. Esse callback não precisa do argumento de tempo decorrido do evento, portanto é chamado de {value}. Registre-o {emphasis}:"
tutorial.frame.details.emphasis: antes de {windowRun}
tutorial.frame.target.description: "{graphicsQueueCommandBuffer} obtém um buffer de comandos com a gravação já iniciada. A gravação descreve o trabalho para a GPU; ela não executa esse trabalho imediatamente."
tutorial.frame.target.details: A primeira {transition} prepara a textura de saída para acesso como anexo de cor. {default} seleciona o nível mip 0 e a camada de array 0. Usamos {undefined} como layout anterior porque limparemos toda a imagem e descartaremos seu conteúdo anterior. Uma passagem que precisa preservar o conteúdo existente deve usar seu layout anterior real.
tutorial.frame.target.guidance: Use a textura de saída atual da cadeia de troca a cada quadro. A apresentação pode alterar qual imagem está disponível, portanto uma textura salva de um quadro anterior não é um destino de renderização permanente da janela.
tutorial.frame.target.title: Preparar a textura de saída
tutorial.frame.title: Exibir uma cor de fundo
tutorial.geometry.data.description: Adicione este array {emphasis}. As seguintes etapas de criação de recursos também pertencem ao trecho anterior a esse callback, na ordem mostrada.
tutorial.geometry.data.description.emphasis: antes de {windowRender}
tutorial.geometry.data.details: "Cada entrada do array cria um {vertex}. As duas expressões {new} internas criam sua posição {vector3} e sua cor {vector4}. Os vértices descrevem os cantos superior, inferior direito e inferior esquerdo. O vertex shader fornecerá uma quarta coordenada de posição, {w}. Com w igual a 1, x e y descrevem diretamente coordenadas normalizadas do dispositivo: -1 e +1 são as bordas da imagem, e 0 é o centro. Essas coordenadas não dependem das dimensões em pixels da janela."
tutorial.geometry.data.guidance: Cada cor contém componentes vermelho, verde, azul e alfa. Alfa é 1 em todos os três cantos. Todas as três posições têm z = 0, colocando-as no mesmo plano. Essas posições não precisam de câmera ou matriz de transformação porque já descrevem as coordenadas que queremos renderizar. Para este triângulo plano único, também desativaremos a mesclagem e o teste de profundidade e omitiremos um buffer de profundidade.
tutorial.geometry.data.title: Escolher os cantos
tutorial.geometry.description: Um vértice é um ponto acompanhado dos dados usados para desenhá-lo. Nosso triângulo tem três vértices, um para cada canto. Cada um contém uma posição e uma cor. A GPU interpolará as cores, calculando valores intermediários ao longo do triângulo.
tutorial.geometry.format.description: "Anexe esta declaração {emphasis}:"
tutorial.geometry.format.description.emphasis: no final de {programCs}, após as instruções de limpeza
tutorial.geometry.format.details: "{file} limita este tipo a {programCs}, e o construtor inicializa seus campos de posição e cor. {layoutKindSequential} mantém os campos na ordem de declaração. {position} contém três floats de 32 bits e {color} contém quatro. Nesta struct, a posição começa no byte 0, a cor começa no byte 12 e o vértice completo ocupa 28 bytes. Descreveremos esse mesmo layout para a pipeline gráfica."
tutorial.geometry.format.title: Definir um vértice
tutorial.geometry.title: Fornecer três vértices à GPU
tutorial.geometry.upload.context: "{fixed} impede que o coletor de lixo mova o array enquanto seu endereço está sendo usado. Para este buffer gravável pela CPU, {upload} mapeia, copia e desmapeia a memória antes de retornar, para que o array não precise permanecer fixado posteriormente. O buffer deve permanecer ativo durante toda a renderização, e o envio só precisa ocorrer uma vez porque os vértices não mudam."
tutorial.geometry.upload.description: "O array gerenciado é dado da CPU. Um {buffer} fornece à GPU armazenamento do qual ela pode ler os vértices. Após o array, adicione:"
tutorial.geometry.upload.details: "O tamanho total é {sizeofVertexVerticesLength}: 28 bytes por vértice, três vértices, 84 bytes no total. {bufferUsagesVertex} permite o acesso de entrada de vértices. {cpuWriteOnly} permite que a CPU inicialize esse pequeno buffer diretamente. O stride do descritor registra o tamanho do elemento; o layout de entrada que criaremos a seguir informará ao fetch de vértices como ler os atributos individuais."
tutorial.geometry.upload.guidance: Criar um buffer não o preenche. {upload} copia o array para essa alocação a partir do deslocamento de byte de destino 0. Sua descrição de origem fornece um ponteiro e o número de bytes a serem copiados.
tutorial.geometry.upload.notes: Adicione {vertexBufferDispose} imediatamente antes de {swapChainDispose} na limpeza na parte inferior de {programCs}. Para geometrias estáticas maiores, {link} explica quando escolher armazenamento exclusivo de GPU e transferências de upload.
tutorial.geometry.upload.notes.link: Gerenciamento de recursos
tutorial.geometry.upload.title: Alocar um buffer e enviar o array
tutorial.input.description: "Os bytes dos vértices e os shaders estão prontos. A seguir, descreva como a GPU deve ler cada vértice. Um atributo é um valor único, como posição ou cor. O layout de entrada fornece a cada atributo um formato e um deslocamento de bytes; o stride fornece a distância em bytes de um vértice ao próximo. Adicione este bloco de inicialização após a criação do shader:"
tutorial.input.details: "{inputLayoutAdd} anexa um elemento no stride atual e aumenta esse stride pelo tamanho do elemento. Ele não inspeciona a struct C#. Aqui ele produz a seguinte correspondência entre a memória da CPU e as entradas do shader:"
tutorial.input.guidance: "Alterar a ordem dos campos C# ou o padding sem atualizar esta descrição faria com que a GPU lesse os bytes errados. O {semanticIndex} padrão é zero, correspondendo a {pOSITION0} e {cOLOR0}. Ambos os elementos pertencem ao mesmo buffer, portanto a pipeline conterá um layout de entrada e vincularemos esse buffer ao slot 0."
tutorial.input.table.headings.byteOffset: Deslocamento de bytes
tutorial.input.table.headings.cField: "Campo C#"
tutorial.input.table.headings.format: Formato
tutorial.input.table.headings.shaderInput: Entrada do shader
tutorial.input.table.nextVertex.cField: Próximo vértice
tutorial.input.table.nextVertex.format: "Stride total: 28 bytes"
tutorial.input.table.nextVertex.shaderInput: Próximo registro de entrada
tutorial.input.table.vertexColor.format: "{float4} (16 bytes)"
tutorial.input.table.vertexPosition.format: "{float3} (12 bytes)"
tutorial.input.title: Descrever o layout de entrada de vértices
tutorial.lifecycle.description: "A aplicação concluída repete esta sequência:"
tutorial.lifecycle.details: "Fechar a janela retorna de {run}. Cada quadro renderizado já aguardou a conclusão de seu trabalho de GPU, portanto agora podemos descartar os recursos usados. A limpeza após {windowRun} deve ser:"
tutorial.lifecycle.guidance: "Libere a cadeia de troca antes da janela nativa e o contexto depois de todos os seus recursos. A fila possui e recicla os buffers de comandos enviados; a cadeia de troca possui sua textura de saída. Esses buffers de comandos e essa textura não precisam de uma chamada {dispose} separada nesta aplicação."
tutorial.lifecycle.title: Acompanhar o ciclo de vida de um quadro
tutorial.pipeline.behavior: "Após o layout de entrada, adicione:"
tutorial.pipeline.context: "{cullNone} preenche o triângulo sem descartar nenhuma orientação de face. A ordem de seus vértices determina a orientação da face, portanto desativar o descarte impede que essa ordem oculte nosso primeiro triângulo."
tutorial.pipeline.description: Agora temos dados de vértices, um layout de entrada e dois shaders. A {graphicsPipeline} os conecta e especifica como a GPU monta os vértices em primitivas e grava o resultado em um anexo.
tutorial.pipeline.details: "Uma pipeline combina estágios de shader programáveis com configurações de função fixa, que controlam operações de GPU como montagem de triângulos, descarte de faces (culling) e mesclagem. Para este triângulo, escolha estas configurações:"
tutorial.pipeline.guidance: O formato de cor vem de {swapChainDescFormat}. Ele deve corresponder à imagem usada pela passagem de renderização. {count1} significa uma amostra por pixel.
tutorial.pipeline.item: "{triangleList} monta cada grupo consecutivo de três vértices em um triângulo. Forneceremos três vértices e desenharemos uma vez, portanto nenhum buffer de índices é necessário."
tutorial.pipeline.notes: "{depthNone} desativa os testes e a gravação de profundidade, correspondendo à passagem sem anexo de profundidade."
tutorial.pipeline.reference: "{opaque} desativa a mesclagem, portanto a cor do fragment shader substitui o fundo dentro do triângulo."
tutorial.pipeline.title: Conectar os shaders e o layout de vértices
tutorial.pipeline.usage: Os objetos de shader podem ser descartados após a criação da pipeline, como feito no renderizador de exemplo. Mantenha a pipeline em si ativa para cada quadro desenhado com ela. Adicione {pipelineDispose} antes de {vertexBufferDispose} na limpeza. A criação da pipeline é a etapa final de inicialização antes do callback de renderização.
tutorial.pipeline.validation: A descrição da pipeline declara a configuração do anexo; ela não cria outra imagem. {inputLayouts} tem uma entrada porque a posição e a cor são armazenadas juntas em um único buffer.
tutorial.presentation.title: Conectar a GPU à janela
tutorial.project.context: Habilite {emphasis} ({allowUnsafeBlocks}) nas configurações de compilação do projeto. Nós o usaremos para passar dados de vértices para a GPU e para as chamadas nativas do assistente de janela.
tutorial.project.context.emphasis: Permitir código não seguro
tutorial.project.description: "Crie o projeto e entre no diretório:"
tutorial.project.details: "Instale os pacotes:"
tutorial.project.guidance: O {zenithNET} fornece a API de renderização compartilhada. Os três pacotes de backend permitem que o mesmo programa selecione a implementação para sua plataforma. O {zenithNETCompiler} compila shaders Slang, os pequenos programas de GPU que escreveremos mais tarde, para essa implementação. O Silk.NET fornece a janela e o loop de eventos.
tutorial.project.title: Criar um projeto de console
tutorial.requirements.context: Você pode acompanhar esta página a partir de um projeto vazio. O {link} e seu {detail} estão disponíveis como referência para as APIs de renderização e janelas usadas aqui.
tutorial.requirements.context.detail: host compartilhado
tutorial.requirements.context.link: exemplo Olá triângulo
tutorial.requirements.description: "Você precisa do {emphasis}, de um editor de código ou IDE e de um desktop com uma GPU e driver suportados por um backend do Zenith.NET. Familiaridade básica com C# é suficiente; os conceitos gráficos são introduzidos conforme são usados. Este é um projeto de console {net10} comum. Um backend traduz as operações do Zenith.NET em chamadas a uma API gráfica, como DirectX 12, Metal ou Vulkan. A aplicação escolhe uma na inicialização:"
tutorial.requirements.description.emphasis: SDK do .NET 10
tutorial.requirements.details: O Linux precisa de uma sessão de janelas compatível com X11 para o caminho de janelas usado aqui. Recursos opcionais de traçado de raios e sombreamento de malhas não são necessários para este triângulo.
tutorial.requirements.guidance: O Zenith.NET renderiza em uma superfície fornecida pela aplicação. O Silk.NET.Windowing criará a janela de desktop e processará seus eventos. No macOS, o destino de apresentação é uma camada Metal ({cAMetalLayerCs}); o assistente de janela do tutorial anexa essa camada para nós.
tutorial.requirements.table.headings.graphicsBackend: Backend gráfico
tutorial.requirements.table.headings.platform: Plataforma
tutorial.requirements.table.headings.windowSurface: Superfície da janela
