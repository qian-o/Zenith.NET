tutorial.context.description: 'Um {graphicsContext} conecta a aplicação à GPU por meio da API gráfica escolhida e fornece métodos para criar recursos de renderização.'
tutorial.context.details: 'Insira a inicialização do contexto {emphasis}:'
tutorial.context.details.emphasis: 'após as diretivas using, antes de {iWindowWindow}'
tutorial.context.guidance: 'Cada ramo solicita a validação para sua API gráfica. O manipulador exibe no console os diagnósticos de {validationMessage} quando a implementação os fornece.'
tutorial.context.imports: 'Adicione as seguintes diretivas using no início de {programCs}:'
tutorial.context.title: 'Contexto gráfico'
tutorial.description: 'Neste tutorial, você criará uma aplicação de console .NET que abre uma janela e desenha um triângulo colorido, começando por um projeto vazio.'
tutorial.details: 'O tutorial tem três pontos de verificação: uma janela vazia, um fundo de cor uniforme e o triângulo colorido. Execute a aplicação em cada ponto antes de acrescentar a próxima parte.'
tutorial.draw.context: 'Os argumentos para {draw} são:'
tutorial.draw.description: 'No callback {windowRender}, substitua {addTheTriangleDrawCommandsHereLater} pelos comandos abaixo, entre {beginRenderPass} e {endRenderPass}:'
tutorial.draw.details: '{setPipeline} seleciona os shaders e o estado de renderização. Vincule o pipeline antes do buffer de vértices para que seu layout de entrada determine como os dados dos vértices serão lidos.'
tutorial.draw.guidance: '{setVertexBuffer} vincula o buffer de vértices já preenchido, a partir do deslocamento de byte 0, ao slot de entrada 0, correspondente à única entrada de {inputLayouts}.'
tutorial.draw.notes: 'Mantenha a limpeza no início da passagem para definir a cor de fundo na área externa ao triângulo.'
tutorial.draw.table.firstInstance.meaning: 'Iniciar a numeração de instâncias em zero.'
tutorial.draw.table.firstVertex.meaning: 'Começar com o primeiro vértice no buffer.'
tutorial.draw.table.headings.argument: 'Argumento'
tutorial.draw.table.headings.meaning: 'Significado'
tutorial.draw.table.headings.value: 'Valor'
tutorial.draw.table.instanceCount.meaning: 'Desenhar uma cópia do triângulo.'
tutorial.draw.table.vertexCount.meaning: 'Ler três vértices.'
tutorial.draw.title: 'Comandos de desenho'
tutorial.execution.context: 'Quando a janela fecha, {run} retorna e a execução continua no código de limpeza. Como o callback de renderização já aguardou a conclusão de todos os quadros enviados, os recursos usados pelos comandos podem ser liberados. O bloco completo de limpeza após {windowRun} é:'
tutorial.execution.description: 'Compile e execute o projeto {firstTriangle}.'
tutorial.execution.details: 'A janela deve exibir um triângulo sobre fundo escuro, vermelho no alto, verde embaixo à direita e azul embaixo à esquerda. A interpolação das cores dos vértices forma um gradiente suave em seu interior.'
tutorial.execution.guidance: 'O redimensionamento muda as dimensões da imagem em pixels, mas mantém as coordenadas dos vértices. O viewport ajusta essas coordenadas à nova largura e altura, por isso o triângulo se deforma quando a proporção da janela muda.'
tutorial.execution.notes: 'Libere a cadeia de troca antes de destruir sua janela nativa e o contexto depois de seus recursos. A fila recicla os buffers de comandos enviados, e a cadeia de troca gerencia a textura de saída; nenhum deles precisa de uma chamada separada a {dispose}.'
tutorial.execution.title: 'Execução da aplicação'
tutorial.frame.commands.context: 'Após {endRenderPass}, a segunda transição prepara a textura de saída para apresentação. {submit} encerra a gravação e envia o buffer de comandos; {wait} bloqueia a thread até a conclusão desse envio. Em seguida, {present} solicita a exibição da imagem renderizada.'
tutorial.frame.commands.description: 'Uma passagem de renderização reúne operações de desenho que escrevem nos mesmos anexos. Nesta passagem, o resultado de cor é escrito na textura de saída da cadeia de troca. {colorAttachmentClear} descreve como inicializar esse anexo com uma cor RGBA e preservar seu conteúdo ao encerrar a passagem. {beginRenderPass} grava o início da passagem com essas configurações.'
tutorial.frame.commands.details: 'A coleção contém um anexo de cor. {null} indica que a passagem não possui anexo de profundidade e estêncil.'
tutorial.frame.commands.guidance: '{beginRenderPass} ajusta o viewport e a região de recorte para todo o anexo. O viewport converte coordenadas de renderização em posições de pixels; o recorte limita os pixels que as operações de desenho podem afetar.'
tutorial.frame.commands.title: 'Limpeza, envio e apresentação'
tutorial.frame.description: 'Comece preenchendo a janela com uma cor uniforme. Essa operação é chamada de limpeza. Se a cor aparecer, o envio de comandos e a apresentação estão funcionando. Depois, acrescente os vértices e os shaders do triângulo.'
tutorial.frame.details: 'Silk.NET chama o callback de renderização quando há um quadro a renderizar. Registre o callback {emphasis}:'
tutorial.frame.details.emphasis: 'antes de {windowRun}'
tutorial.frame.target.description: 'Uma fila de comandos recebe o trabalho gravado para execução na GPU. {graphicsQueueCommandBuffer} retorna um buffer de comandos da fila gráfica cuja gravação já está em andamento. Os comandos gravados definem o trabalho da GPU; a execução só começa após o envio.'
tutorial.frame.target.details: 'O layout de uma textura descreve o acesso necessário a uma operação. A primeira chamada a {transition} prepara a textura de saída para uso como anexo de cor. Aqui, {default} seleciona o nível de mip 0 e a camada 0 do array, ou seja, a imagem base da textura. Como a passagem limpa a imagem inteira, {undefined} permite descartar o conteúdo anterior.'
tutorial.frame.target.guidance: 'Obtenha a textura de saída atual a cada quadro, pois a apresentação pode passar a usar outra imagem.'
tutorial.frame.target.title: 'Preparação da textura de saída'
tutorial.frame.title: 'O primeiro quadro'
tutorial.geometry.data.description: 'Adicione o array de vértices {emphasis}. Mantenha também as próximas inicializações de recursos antes desse callback, na ordem apresentada.'
tutorial.geometry.data.description.emphasis: 'antes de {windowRender}'
tutorial.geometry.data.details: 'As três posições formam os cantos superior, inferior direito e inferior esquerdo. Neste exemplo, a faixa de coordenadas da imagem vai de -1 a +1 em x e y: 0 é o centro, o sentido positivo de x aponta para a direita e o de y, para cima.'
tutorial.geometry.data.guidance: 'Cada cor tem componentes vermelho, verde, azul e alfa, com alfa igual a 1. Os três vértices têm z = 0 e estão no mesmo plano.'
tutorial.geometry.data.title: 'Posições e cores dos vértices'
tutorial.geometry.description: 'Cada um dos três vértices tem posição e cor. A GPU determina a forma do triângulo a partir das posições e interpola as cores em sua superfície.'
tutorial.geometry.format.description: 'Acrescente a declaração do tipo de vértice {emphasis}:'
tutorial.geometry.format.description.emphasis: 'no final de {programCs}, após as instruções de limpeza'
tutorial.geometry.format.details: '{layoutKindSequential} mantém os campos na ordem de declaração. {position} contém três valores de ponto flutuante de 32 bits e começa no deslocamento de byte 0; {color} contém quatro e começa no deslocamento de byte 12. Cada vértice ocupa, portanto, 28 bytes. O layout de entrada descreverá essa organização para que a GPU leia os campos corretamente.'
tutorial.geometry.format.imports: 'Adicione estas diretivas using no início de {programCs} para usar os tipos vetoriais e o atributo de layout da estrutura:'
tutorial.geometry.format.title: 'Representação dos vértices'
tutorial.geometry.title: 'Dados de vértices'
tutorial.geometry.upload.context: '{fixed} impede que o coletor de lixo mova o array enquanto seu endereço estiver em uso. Neste buffer gravável pela CPU, {upload} mapeia a memória, copia os bytes e desfaz o mapeamento antes de retornar. O array só precisa permanecer fixado durante a chamada. Faça o upload dos vértices uma vez na inicialização e mantenha o buffer vivo até o fim da renderização.'
tutorial.geometry.upload.description: 'Armazene os vértices em um {buffer} para que a GPU possa lê-los durante o desenho. Acrescente a alocação e o upload dos dados logo após o array:'
tutorial.geometry.upload.details: 'O tamanho da alocação é {sizeofVertexVerticesLength} (três vértices de 28 bytes, ou 84 bytes), e o passo da descrição registra o tamanho do elemento. {bufferUsagesVertex} habilita a vinculação como buffer de vértices, enquanto {cpuWriteOnly} permite escritas diretas pela CPU.'
tutorial.geometry.upload.guidance: 'A alocação não inicializa o conteúdo do buffer. {upload} copia o array para o deslocamento 0 do destino, usando o ponteiro de origem e a quantidade de bytes da descrição de dados.'
tutorial.geometry.upload.imports: 'Em {programCs}, adicione {bufferAlias} às diretivas using para distinguir o tipo de buffer do Zenith.NET de {systemBuffer}.'
tutorial.geometry.upload.notes: 'Na limpeza ao final de {programCs}, insira {vertexBufferDispose} imediatamente antes de {swapChainDispose}.'
tutorial.geometry.upload.title: 'Alocação do buffer e upload dos dados'
tutorial.input.description: 'Um layout de entrada descreve o formato, a semântica e o deslocamento em bytes de cada atributo de vértice, junto com o passo em bytes entre os vértices. Adicione este código após criar os shaders:'
tutorial.input.details: '{inputLayoutAdd} coloca cada atributo após o anterior e soma seu tamanho ao passo entre vértices, produzindo um passo de 28 bytes nos dois campos:'
tutorial.input.guidance: 'O valor padrão de {semanticIndex} é zero, correspondente a {pOSITION0} e {cOLOR0} no shader. Posição e cor ficam juntas em um buffer de vértices, portanto o pipeline utiliza um único layout de entrada no slot 0. Se a ordem dos campos ou o preenchimento da estrutura C# mudar, ajuste também esse layout.'
tutorial.input.table.headings.byteOffset: 'Deslocamento em bytes'
tutorial.input.table.headings.cField: 'Campo C#'
tutorial.input.table.headings.format: 'Formato'
tutorial.input.table.headings.shaderInput: 'Entrada do shader'
tutorial.input.table.vertexColor.format: '{float4} (16 bytes)'
tutorial.input.table.vertexPosition.format: '{float3} (12 bytes)'
tutorial.input.title: 'Layout de entrada dos vértices'
tutorial.pipeline.context: 'Os objetos de shader podem ser liberados após a criação do pipeline. Mantenha o pipeline durante a renderização e adicione {pipelineDispose} antes de {vertexBufferDispose} na limpeza.'
tutorial.pipeline.description: 'Um {graphicsPipeline} combina os estágios de shader, o layout de entrada dos vértices, a topologia de primitivas, os formatos dos anexos e o estado de renderização. Após o layout de entrada, crie o pipeline:'
tutorial.pipeline.details: '{triangleList} monta um triângulo a cada grupo de três vértices consecutivos. O formato de cor vem de {swapChainDescFormat} para corresponder ao anexo da passagem, e {count1} especifica uma amostra por pixel.'
tutorial.pipeline.guidance: '{cullNone} desativa o descarte de faces para que o triângulo seja desenhado independentemente da ordem de enrolamento. {depthNone} desativa teste e escrita de profundidade porque a passagem não possui anexo de profundidade, e {opaque} desativa a mesclagem para que a cor do fragmento substitua o fundo.'
tutorial.pipeline.title: 'Pipeline gráfico'
tutorial.presentation.title: 'Contexto gráfico e apresentação'
tutorial.project.context: 'Ative {emphasis} ({allowUnsafeBlocks}) nas opções de compilação do projeto. As chamadas nativas da classe auxiliar da janela e o upload dos vértices exigem código não seguro.'
tutorial.project.context.emphasis: 'Permitir código não seguro'
tutorial.project.description: 'Crie um projeto de console C# chamado {firstTriangle}, com .NET 10 como framework de destino.'
tutorial.project.details: 'Adicione os seguintes pacotes NuGet ao projeto:'
tutorial.project.guidance: '{zenithNET} fornece a API comum para gráficos e computação; os três pacotes de API gráfica a implementam. {zenithNETCompiler} compila shaders Slang para a API escolhida.'
tutorial.project.title: 'Configuração do projeto'
tutorial.requirements.description: 'São necessários o {emphasis} e conhecimentos básicos de C#. A GPU e o driver devem oferecer o suporte gráfico indicado para sua plataforma:'
tutorial.requirements.description.emphasis: 'SDK do .NET 10'
tutorial.requirements.guidance: 'Zenith.NET renderiza em uma superfície nativa fornecida pela aplicação. Silk.NET.Windowing cria a janela e processa seus eventos.'
tutorial.requirements.table.headings.graphicsSupport: 'Suporte gráfico'
tutorial.requirements.table.headings.platform: 'Plataforma'
tutorial.requirements.table.linux.graphicsSupport: 'Vulkan 1.4 com VK_EXT_descriptor_heap'
tutorial.requirements.table.linux.platform: 'Linux (X11 ou XWayland)'
tutorial.requirements.table.macOS.graphicsSupport: 'Metal 4'
tutorial.requirements.table.macOS.platform: 'macOS'
tutorial.requirements.table.windows.graphicsSupport: 'DirectX 12 com Shader Model 6.6'
tutorial.requirements.table.windows.platform: 'Windows'
tutorial.requirements.title: 'Pré-requisitos'
tutorial.resize.context: 'Compile e execute a aplicação novamente. O fundo deve continuar preenchendo a janela quando ela for redimensionada. Mantenha o callback de renderização; o triângulo será desenhado dentro dessa mesma passagem.'
tutorial.resize.description: 'A cadeia de troca precisa acompanhar as mudanças de tamanho do framebuffer. Registre um callback de {framebufferResize} depois do callback de renderização e antes de {windowRun}:'
tutorial.resize.details: 'Responda às {link}, expressas em pixels, e não às mudanças no tamanho lógico da janela. Se a largura ou a altura do framebuffer chegar a zero ao minimizar a janela, o callback de redimensionamento mantém a cadeia de troca como está. O callback de renderização também retorna enquanto alguma dimensão for zero, interrompendo a renderização até que o framebuffer volte a ter um tamanho utilizável.'
tutorial.resize.details.link: 'alterações no tamanho do framebuffer'
tutorial.resize.guidance: 'O callback de renderização espera cada quadro enviado terminar antes de chamar {present}. Assim, o callback de redimensionamento pode substituir as imagens da cadeia de troca sem interromper o trabalho de um quadro anterior. O artigo {link} detalha essa relação entre a conclusão do trabalho e o tempo de vida dos recursos.'
tutorial.resize.guidance.link: 'Sincronização'
tutorial.resize.title: 'Redimensionamento'
tutorial.shaders.compilation.context: '{appContextBaseDirectory} permite carregar a cópia do shader no diretório de saída da aplicação. Assim, iniciar a aplicação a partir de outro diretório de trabalho não altera o local em que ela procura o arquivo.'
tutorial.shaders.compilation.description: 'Nas propriedades de {triangleSlang}, defina {emphasis} como {detail}. A compilação copiará o shader para o diretório do executável.'
tutorial.shaders.compilation.description.detail: 'Copiar se mais recente'
tutorial.shaders.compilation.description.emphasis: 'Copiar para o Diretório de Saída'
tutorial.shaders.compilation.details: 'Em {programCs}, acrescente a inicialização dos shaders após o upload dos vértices e antes do callback de renderização:'
tutorial.shaders.compilation.guidance: '{zenithCompiler} compila o código-fonte para {contextGraphicsApi}, e {createShader} cria um objeto de shader a partir da descrição compilada. Os nomes de ponto de entrada {vSMain} e {fSMain} selecionam as duas funções definidas no arquivo Slang.'
tutorial.shaders.compilation.title: 'Compilação dos shaders'
tutorial.shaders.context: '{fSInput} conecta as duas etapas do shader. O shader de vértices escreve em {sVPOSITION} uma posição no espaço de recorte, que a GPU usa para determinar a parte visível do triângulo. O campo {cOLOR0} leva a cor do vértice, interpolada ao longo do triângulo antes de chegar ao shader de fragmentos. Seu tipo e sua semântica devem corresponder nas duas etapas.'
tutorial.shaders.description: 'O shader de vértices produz a posição no espaço de recorte de cada vértice, e o shader de fragmentos produz a cor de cada pixel coberto. Os dois estágios ficam em um único arquivo Slang com pontos de entrada separados.'
tutorial.shaders.details: 'Crie {triangleSlang} na raiz do projeto com estas estruturas de entrada e saída:'
tutorial.shaders.fragment.description: 'Acrescente o ponto de entrada de fragmentos ao mesmo arquivo:'
tutorial.shaders.fragment.details: 'A rasterização identifica as posições da imagem cobertas pelo triângulo e gera fragmentos para elas. Cada fragmento recebe uma cor interpolada a partir das cores dos três vértices. {fSMain} retorna essa cor, e {sVTARGET} direciona o resultado ao primeiro anexo de cor.'
tutorial.shaders.fragment.title: 'Sombreamento de fragmentos'
tutorial.shaders.guidance: '{vSInput} define as entradas do shader de vértices. {pOSITION0} e {cOLOR0} identificam os atributos por semântica; nomes de campos em C# não estabelecem sozinhos essa correspondência.'
tutorial.shaders.title: 'Estágios dos shaders'
tutorial.shaders.vertex.description: 'Acrescente o ponto de entrada de vértices a {triangleSlang}:'
tutorial.shaders.vertex.details: 'Este ponto de entrada é executado uma vez por vértice, definindo {w} para formar uma posição 4D no espaço de recorte e repassando a cor do vértice. A divisão em perspectiva por w mantém então x, y e z inalterados nas coordenadas normalizadas do dispositivo.'
tutorial.shaders.vertex.title: 'Sombreamento de vértices'
tutorial.surface.description: 'Baixe {cocoaHelperCs} para o diretório do projeto. Essa classe auxiliar conecta a camada Metal à janela do macOS.'
tutorial.surface.details: 'Especifique o destino nativo de apresentação {emphasis}:'
tutorial.surface.details.emphasis: 'após {windowCenter} e antes de {windowRun}'
tutorial.surface.guidance: 'O framebuffer é a imagem da janela em pixels, cujo {framebufferSize} pode diferir das dimensões lógicas da janela com a escala da tela. {surface} reúne essas dimensões em pixels e os identificadores nativos exigidos pela API gráfica: uma janela Win32 no Windows, a camada Metal associada no macOS ou um display e uma janela X11 no Linux.'
tutorial.surface.title: 'Superfície nativa'
tutorial.swapChain.context: 'A cadeia de troca depende do contexto e da janela. Substitua {windowDispose} no final de {programCs} por esta ordem de liberação:'
tutorial.swapChain.description: 'Crie a cadeia de troca logo após a descrição da superfície:'
tutorial.swapChain.details: 'A {swapChain} gerencia as imagens de apresentação da janela. {drawable} expõe o back buffer atual como uma {texture}, e {present} o exibe e avança para a próxima imagem.'
tutorial.swapChain.guidance: '{b8G8R8A8UNorm} armazena quatro canais de 8 bits na ordem azul, verde, vermelho e alfa. {uNorm} mapeia os valores inteiros de 0–255 para valores de 0–1. A saída do shader continua sendo um valor RGBA lógico; o formato especifica sua representação na memória.'
tutorial.swapChain.title: 'Cadeia de troca'
tutorial.title: 'Primeiro triângulo'
tutorial.window.description: 'Substitua o conteúdo de {programCs} pelo código abaixo:'
tutorial.window.details: '{graphicsAPINone} impede que Silk.NET crie um contexto gráfico próprio para a janela; a aplicação criará depois um contexto do Zenith.NET. {initialize} cria a janela nativa e disponibiliza os identificadores do sistema de janelas. {center} a coloca no centro da tela. {run} processa eventos até seu fechamento; depois, {dispose} libera a janela.'
tutorial.window.guidance: 'Compile e execute a aplicação. Verifique se a janela abre e fecha normalmente e se é possível movê-la e redimensioná-la. O conteúdo ainda não está definido, pois nenhum comando de renderização foi enviado. Feche a janela antes de continuar.'
tutorial.window.title: 'Criação da janela'
