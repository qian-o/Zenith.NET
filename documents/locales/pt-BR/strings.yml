tutorial.requirements.table.windows.graphicsBackend: DirectX 12
tutorial.requirements.table.windows.platform: Windows
tutorial.requirements.table.windows.windowSurface: Handle de janela Win32
tutorial.requirements.title: Antes de começar
tutorial.resize.context: "Execute {dotnetRun} novamente. A janela agora deve ter um fundo escuro uniforme que continua a preenchê-la após o redimensionamento. Mantenha este callback: o triângulo será desenhado dentro de sua passagem de renderização existente."
tutorial.resize.description: "As imagens da cadeia de troca devem seguir as dimensões do framebuffer. Use {framebufferResize} para responder a alterações no tamanho em pixels, incluindo alterações causadas por dimensionamento de tela. Após o callback de renderização, ainda antes de {windowRun}, adicione:"
tutorial.resize.details: "O Silk.NET distingue mudanças no tamanho da janela de {link}. Precisamos destas últimas porque a cadeia de troca armazena pixels. Uma janela minimizada pode ter um framebuffer de tamanho zero. Nesse caso, ambos os callbacks pulam o trabalho de GPU. Após o redimensionamento, a passagem de renderização usa as novas dimensões do anexo para a viewport e o retângulo de recorte."
tutorial.resize.details.link: alterações no tamanho do framebuffer
tutorial.resize.guidance: Aguardamos após cada envio, portanto nenhum quadro anterior continua usando as imagens quando o manipulador de redimensionamento as substitui. A implementação atual de {present} também aguarda na fila gráfica. Esse loop simples mantém o trabalho de um quadro concluído antes que o próximo comece; {link} aborda um agendamento mais avançado.
tutorial.resize.guidance.link: Sincronização
tutorial.resize.title: Responder ao redimensionamento
tutorial.shaders.compilation.context: A compilação ocorre uma vez durante a inicialização. {appContextBaseDirectory} localiza o shader copiado ao lado do executável, independentemente do diretório de trabalho atual. Esses shaders consomem apenas entrada de vértices, portanto ainda não há buffers de constantes, texturas ou handles de recursos para vincular.
tutorial.shaders.compilation.description: Nas propriedades de arquivo de {triangleSlang}, defina {emphasis} como {detail}. Isso torna o shader disponível ao lado do executável.
tutorial.shaders.compilation.description.detail: Copiar se mais recente
tutorial.shaders.compilation.description.emphasis: Copiar para o Diretório de Saída
tutorial.shaders.compilation.details: "Retorne a {programCs}. Após o envio de vértices, adicione estas instruções de inicialização antes do callback de renderização:"
tutorial.shaders.compilation.guidance: "{zenithCompiler} retorna uma descrição de shader contendo código para a API gráfica solicitada. {createShader} cria o objeto de backend correspondente. Tanto a API gráfica quanto os nomes dos pontos de entrada são importantes: use {contextGraphicsApi} e escreva {vSMain} e {fSMain} exatamente como no arquivo Slang."
tutorial.shaders.compilation.title: Compilar para o backend selecionado
tutorial.shaders.context: "{fSInput} conecta a saída do vertex shader à entrada do fragment shader. Quando gravado pelo vertex shader, {sVPOSITION} fornece uma posição no espaço de recorte: as quatro coordenadas que a GPU usa para determinar o que fica dentro da imagem visível. {cOLOR0} carrega a cor a ser interpolada entre os vértices. Os dois estágios devem concordar quanto ao tipo e semântica."
tutorial.shaders.description: Um shader é um programa executado pela GPU. Este desenho precisa de um vertex shader para posicionar os vértices e de um fragment shader para produzir as cores dentro do triângulo. Nós os escreveremos em Slang, uma linguagem de shader, e compilaremos dois pontos de entrada a partir do mesmo arquivo. Um ponto de entrada é a função onde a execução de um estágio de shader começa.
tutorial.shaders.details: "Crie {triangleSlang}, começando com estas duas estruturas:"
tutorial.shaders.fragment.description: "Anexe o ponto de entrada de fragmento ao mesmo arquivo:"
tutorial.shaders.fragment.details: A rasterização determina quais posições da imagem o triângulo cobre. Ela produz fragmentos (os dados processados pelo fragment shader) com cores de vértices interpoladas pela área coberta. {fSMain} retorna essa cor interpolada por meio de {sVTARGET}, que identifica o primeiro anexo de cor.
tutorial.shaders.fragment.guidance: A interpolação de cor dos vértices é separada da mesclagem de anexos. A mesclagem combina a saída de um fragmento com a cor já armazenada no anexo. Nosso estado de mesclagem opaco desativa essa combinação, de modo que a cor interpolada substitui o fundo dentro do triângulo.
tutorial.shaders.fragment.title: Colorir os fragmentos
tutorial.shaders.guidance: "{vSInput} descreve o que o vertex shader recebe do buffer de vértices. As semânticas {pOSITION0} e {cOLOR0} identificam as entradas; os nomes dos campos C# sozinhos não estabelecem esse mapeamento."
tutorial.shaders.title: Escrever os dois estágios de shader
tutorial.shaders.vertex.description: "Anexe o ponto de entrada de vértice a {triangleSlang}:"
tutorial.shaders.vertex.details: A GPU invoca este ponto de entrada para cada vértice de entrada. Ele adiciona a coordenada homogênea {w} à posição e encaminha a cor. Após o estágio de vértice, a posição é dividida por w; aqui, essa divisão mantém x, y e z inalterados. É por isso que as posições escolhidas acima podem ser compreendidas diretamente em coordenadas normalizadas do dispositivo.
tutorial.shaders.vertex.title: Posicionar cada vértice
tutorial.surface.description: "O contexto também precisa saber onde exibir sua saída. Adicione o seguinte {emphasis}:"
tutorial.surface.description.emphasis: após {windowCenter} e antes de {windowRun}
tutorial.surface.details: "{surface} descreve um destino de apresentação nativo e suas dimensões em pixels. O framebuffer é a imagem de pixels associada à janela. {framebufferSize} fornece suas dimensões em pixels; as dimensões lógicas da janela podem ser diferentes quando o dimensionamento de tela está ativado."
tutorial.surface.guidance: A superfície corresponde ao backend selecionado acima. O Windows fornece um handle de janela, o Linux fornece um display e janela X11, e o assistente do macOS fornece a camada Metal anexada. Esta é a única parte específica da plataforma para conectar nossa janela à renderização.
tutorial.surface.title: Descrever a superfície nativa
tutorial.swapChain.context: "A cadeia de troca usa tanto o contexto quanto a janela nativa. Substitua a linha {windowDispose} na parte inferior de {programCs} por esta ordem de limpeza:"
tutorial.swapChain.description: "Use a descrição da superfície para criar as imagens que serão apresentadas. Imediatamente após o bloco da superfície, adicione:"
tutorial.swapChain.details: A {swapChain} gerencia as imagens exibidas na janela. A cada quadro, {drawable} nos fornece a imagem atual como uma {texture}, o tipo de API para dados de imagem. Após o desenho, {present} solicita a exibição do resultado e avança para o próximo drawable.
tutorial.swapChain.guidance: "{b8G8R8A8UNorm} armazena quatro canais de cor de 8 bits na ordem azul, verde, vermelho e alfa. {uNorm} significa que valores inteiros de 0 a 255 representam valores de 0 a 1. O shader continuará retornando um valor RGBA lógico; esse formato determina como esses canais são armazenados na imagem. Mais tarde, a pipeline gráfica usará {swapChainDescFormat} para corresponder a esse anexo."
tutorial.swapChain.title: Criar a cadeia de troca
tutorial.title: Primeiro triângulo
tutorial.troubleshooting.description: "Leia primeiro qualquer erro no console e, em seguida, use os pontos de verificação anteriores para identificar o estágio que falhou:"
tutorial.troubleshooting.details: Use o {link} e o {detail} para comparar os dados dos vértices, o layout de entrada e a operação de desenho. Aquele exemplo coloca as janelas e o envio em um host compartilhado; este tutorial mantém o fluxo da aplicação em {programCs}. Continue com {context} para aprender sobre desenho indexado, transformações e testes de profundidade.
tutorial.troubleshooting.details.context: Cubo giratório
tutorial.troubleshooting.details.detail: shader Slang
tutorial.troubleshooting.details.link: renderizador de exemplo
tutorial.troubleshooting.table.backend.check: Verifique se o backend selecionado é suportado pelo dispositivo e pelo driver gráfico instalado.
tutorial.troubleshooting.table.backend.symptom: Falha na criação do backend
tutorial.troubleshooting.table.drawing.check: Verifique o tamanho do upload, o layout de entrada, a seleção de pipeline e o posicionamento dos comandos de desenho dentro da passagem de renderização.
tutorial.troubleshooting.table.drawing.symptom: O fundo aparece, mas o triângulo não
tutorial.troubleshooting.table.headings.check: Verificação
tutorial.troubleshooting.table.headings.symptom: Sintoma
tutorial.troubleshooting.table.input.check: Verifique o stride de 28 bytes e os deslocamentos de posição/cor de 0 e 12.
tutorial.troubleshooting.table.input.symptom: Posições ou cores dos vértices estão corrompidas
tutorial.troubleshooting.table.shaders.check: Verifique o {triangleSlang} copiado, a ortografia do ponto de entrada e o diagnóstico relatado pelo compilador.
tutorial.troubleshooting.table.shaders.symptom: A etapa de cor de limpeza funciona, mas o carregamento do shader falha
tutorial.troubleshooting.table.window.check: Confirme se o projeto .NET compila e se a etapa somente de janela é executada em uma sessão de desktop. No Linux, verifique se o X11 ou XWayland está disponível.
tutorial.troubleshooting.table.window.symptom: Nenhuma janela se abre
tutorial.troubleshooting.title: Verificar o estágio que falhou
tutorial.window.context: "{usingZenithTutorials} importa o namespace do assistente. Cada arquivo C# usa suas próprias diretivas using comuns, portanto a importação de interoperabilidade é necessária em ambos os arquivos. O alias {buffer} refere-se ao tipo de buffer do Zenith.NET e o distingue de {systemBuffer}."
tutorial.window.description: Adicione {cocoaHelperCs} ao projeto, mantendo seu namespace. Adicione {interopUsing} no topo desse arquivo, antes de sua declaração de namespace. O assistente anexa uma camada Metal à janela no macOS; os outros branches de plataforma não o chamam.
tutorial.window.details: "Substitua o arquivo {programCs} gerado pelo seguinte código. Ele usa instruções de nível superior, que são executadas em ordem sem um método {main} explícito. Seções posteriores indicarão onde adicionar código a este mesmo arquivo:"
tutorial.window.guidance: "{graphicsAPINone} solicita ao Silk.NET que crie uma janela sem seu próprio contexto gráfico. Criaremos esse contexto com o Zenith.NET. {initialize} cria a janela nativa e disponibiliza seus handles. Um handle é um identificador fornecido pelo sistema de janelas. {center} centraliza a janela e {run} processa eventos até que ela seja fechada. A execução continua então para {dispose}, que libera a janela."
tutorial.window.notes: Execute {dotnetRun}. Uma janela vazia deve abrir e responder a movimentação, redimensionamento e fechamento. Seu conteúdo ainda não está definido porque não enviamos comandos de renderização. Feche-a antes de continuar.
tutorial.window.title: Abrir uma janela
