### YamlMime:Resources
concepts.execution.context.description: 'Um {graphicsContext} conecta a aplicação a um dispositivo GPU por meio da API gráfica escolhida e fornece suas filas gráfica, de computação, de transferência e de apresentação. Recursos usados em conjunto devem pertencer ao mesmo contexto; buffers, texturas, shaders, pipelines e seus identificadores não podem ser vinculados entre contextos diferentes.'
concepts.execution.context.details: '{capabilities} informa o nome do dispositivo e as funcionalidades disponíveis. Consulte {rayTracingSupported} e {meshShadingSupported} antes de criar os recursos necessários a essas operações. Os exemplos de {link} e {detail} fazem essas verificações durante a inicialização.'
concepts.execution.context.details.detail: 'sombreamento de malha'
concepts.execution.context.details.link: 'traçado de raios'
concepts.execution.context.title: 'Contexto gráfico'
concepts.execution.description: 'O trabalho da GPU começa na CPU: a aplicação cria recursos, grava os comandos que os utilizam e os envia a uma fila. Após o envio, a CPU pode continuar enquanto a GPU executa os comandos. Os recursos precisam permanecer disponíveis até o fim dessa execução.'
concepts.execution.ownership.description: 'A propriedade define quem libera um objeto; a conclusão do trabalho na GPU determina quando isso pode ocorrer. Chamar {dispose} libera os recursos nativos mesmo que ainda existam referências C# ao objeto. Enviar comandos não transfere à fila a propriedade dos recursos utilizados.'
concepts.execution.ownership.details: 'Ao encerrar a aplicação, pare de enviar trabalho e espere o último uso dos recursos em cada fila envolvida. Libere primeiro os recursos da aplicação e depois o contexto, que libera suas filas.'
concepts.execution.ownership.guidance: 'Durante a renderização, acompanhe a conclusão do trabalho que utiliza dados a serem sobrescritos ou recursos a serem substituídos. Espere esses usos terminarem antes de modificar ou liberar o armazenamento afetado. O artigo {link} explica como esse modelo de tempo de vida se aplica às visualizações e aos recursos que as sustentam.'
concepts.execution.ownership.guidance.link: 'Gerenciamento de recursos'
concepts.execution.ownership.table.applicationResources.disposalResponsibility: 'A aplicação os libera após o último uso na GPU.'
concepts.execution.ownership.table.applicationResources.object: 'Recursos criados pela aplicação'
concepts.execution.ownership.table.commandBuffers.disposalResponsibility: 'A fila os gerencia e recicla.'
concepts.execution.ownership.table.commandBuffers.object: 'Buffers de comandos emprestados'
concepts.execution.ownership.table.headings.disposalResponsibility: 'Responsabilidade pela liberação'
concepts.execution.ownership.table.headings.object: 'Objeto'
concepts.execution.ownership.table.queues.disposalResponsibility: 'O contexto e as filas as gerenciam.'
concepts.execution.ownership.table.queues.object: 'Filas do contexto e suas linhas do tempo'
concepts.execution.ownership.table.swapChainDrawable.disposalResponsibility: 'A cadeia de troca o gerencia.'
concepts.execution.ownership.title: 'Propriedade e tempo de vida'
concepts.execution.pipelines.description: 'Um pipeline gráfico define os shaders, a disposição dos atributos de vértice, a montagem de primitivas, os formatos dos anexos e o estado usado nas operações de desenho. Selecione o pipeline antes de vincular dados de vértices, índices ou constantes. Os formatos dos anexos e a quantidade de amostras devem corresponder aos da passagem de renderização.'
concepts.execution.pipelines.details: 'Um pipeline de computação seleciona o ponto de entrada do shader executado por um despacho. Vincule o pipeline e suas constantes antes do despacho, fora de uma passagem de renderização gráfica.'
concepts.execution.pipelines.guidance: 'O {link} apresenta a sequência gráfica. O {detail} acrescenta um despacho de computação antes da passagem que exibe seu resultado.'
concepts.execution.pipelines.guidance.detail: 'exemplo de computação'
concepts.execution.pipelines.guidance.link: 'callback de renderização do triângulo'
concepts.execution.pipelines.title: 'Estado do pipeline'
concepts.execution.queues.description: 'A {graphicsQueue} costuma ser o ponto de partida para um quadro com desenho, computação e cópias. Manter operações dependentes na mesma fila simplifica a ordenação.'
concepts.execution.queues.details: 'Use filas adicionais para sobrepor cargas de trabalho independentes. Quando uma fila consumir dados produzidos por outra, estabeleça uma dependência explícita entre os envios.'
concepts.execution.queues.guidance: 'Dentro de uma fila, operações dependentes também podem precisar de barreiras ou transições de textura para que os acessos posteriores vejam as escritas anteriores. Essas dependências de memória são diferentes da ordem de envio; o artigo {link} explica como expressá-las.'
concepts.execution.queues.guidance.link: 'Sincronização'
concepts.execution.queues.table.computeQueue.supportedWork: 'Despachos de computação e trabalho de transferência compatível, sem passagens de renderização gráfica.'
concepts.execution.queues.table.graphicsQueue.supportedWork: 'Passagens de renderização, desenho, computação e transferências.'
concepts.execution.queues.table.headings.queue: 'Fila'
concepts.execution.queues.table.headings.supportedWork: 'Operações aceitas'
concepts.execution.queues.table.presentQueue.supportedWork: 'As mesmas operações da fila gráfica, usadas para escrever e apresentar texturas de saída quando {swapChainDescIsPresentQueueEnabled} é {true}.'
concepts.execution.queues.table.transferQueue.supportedWork: 'Uploads, downloads e cópias, sem desenho ou despachos de computação.'
concepts.execution.queues.title: 'Seleção de filas'
concepts.execution.recording.context: 'A fila recupera os buffers de comandos concluídos para reutilizá-los. Obtenha um com {queueCommandBuffer} para cada gravação, grave os comandos em uma thread por vez e envie o buffer uma única vez. Após o envio, deixe-o sob responsabilidade da fila: não o modifique, não o reenvie nem o libere.'
concepts.execution.recording.description: '{queueCommandBuffer} retorna um {commandBuffer} cuja gravação já começou. Grave as operações e suas dependências e chame {submit} uma vez. O envio encerra a gravação e retorna um {timelineValue}, que identifica o ponto de conclusão naquela fila.'
concepts.execution.recording.details: 'Após gravar os comandos do quadro em {commandBuffer}, o tutorial do triângulo os envia e aguarda a conclusão:'
concepts.execution.recording.guidance: '{submit} agenda a execução dos comandos gravados, e {wait} bloqueia a thread atual até esse envio terminar, fazendo com que cada quadro termine antes do início do próximo.'
concepts.execution.recording.title: 'Gravação e envio'
concepts.execution.title: 'Modelo de execução'
concepts.platforms.description: 'A apresentação pode ser gerenciada diretamente pela aplicação ou por um controle de renderização de interface. Essa escolha define quem obtém a textura de saída (drawable) de cada quadro, envia os comandos e apresenta o resultado.'
concepts.platforms.frame.context: 'Encerre qualquer passagem de renderização antes de o manipulador retornar e não envie nem libere o buffer de comandos ou a textura de saída recebidos. Se o manipulador alterar o layout da textura de saída, restaure {colorAttachment} antes de retornar.'
concepts.platforms.frame.description: 'Os controles implementam {iZenithView}. A aplicação atribui {graphicsContext}, atualiza a cena em {updateRequested} e grava comandos em {renderRequested} usando o {renderEventArgs} recebido.'
concepts.platforms.frame.details: 'A cada quadro, o controle obtém um buffer de comandos e uma textura de saída, faz a transição da textura de saída para {colorAttachment} e invoca os manipuladores de atualização e renderização antes de enviar e apresentar o quadro.'
concepts.platforms.frame.guidance: 'Adicione {usingZenithNET} ao arquivo. Para uma instância de {iZenithView} chamada {view}, já inicializada e com um contexto gráfico atribuído, registre este manipulador para limpar sua textura de saída:'
concepts.platforms.frame.notes: 'A transição inicial usa {undefined}, que permite descartar o conteúdo anterior da imagem. Desenhe ou limpe a imagem inteira a cada quadro. Mantenha resultados acumulados ou em cache em uma textura da aplicação e depois a desenhe na textura de saída do controle.'
concepts.platforms.frame.reference: 'Ao criar anexos compatíveis, use {descFormat}, {descWidth}, {descHeight} e {descSampleCount} da textura de saída fornecida pelo evento de renderização. Essa textura informa as dimensões reais do destino; não as deduza das dimensões do controle no layout nem da escala de exibição.'
concepts.platforms.frame.title: 'Renderização em controles de interface'
concepts.platforms.lifecycle.description: 'A cadeia de troca usa a largura e a altura do framebuffer em pixels, que podem diferir das dimensões lógicas da janela quando há escala de exibição. Adie a renderização e o redimensionamento da cadeia enquanto alguma dimensão for zero. Obtenha {swapChainDrawable} a cada quadro: a textura pertence à cadeia de troca, que pode substituí-la após apresentar ou redimensionar.'
concepts.platforms.lifecycle.details: 'Quando o tamanho do framebuffer mudar, espere o trabalho pendente da GPU que usa as imagens antigas terminar antes de chamar {swapChainResize}. Se o próprio destino nativo de apresentação for substituído, aguarde da mesma forma e passe a nova descrição da superfície a {swapChainRefresh}. No encerramento, libere a cadeia de troca antes de destruir seu destino nativo.'
concepts.platforms.lifecycle.guidance: 'Se a aplicação tiver texturas de profundidade ou fora da tela que acompanham o tamanho da janela, recrie-as quando esse tamanho mudar e atualize as constantes que contêm seus identificadores. O pipeline pode ser reutilizado enquanto os formatos e as quantidades de amostras dos anexos continuarem correspondentes. O {link} mostra essa separação entre as texturas redimensionadas e o pipeline reutilizável.'
concepts.platforms.lifecycle.guidance.link: 'renderizador de cubo giratório'
concepts.platforms.lifecycle.title: 'Dimensões e tempo de vida da cadeia de troca'
concepts.platforms.ownership.description: 'A aplicação possui o contexto atribuído e seus recursos de renderização, enquanto o controle possui seus recursos de apresentação. Quando {graphicsContext} muda, o controle recria seus recursos de apresentação; recrie também os buffers, texturas e pipelines da aplicação para o novo contexto.'
concepts.platforms.ownership.details: 'Antes de substituir recursos de renderização, interrompa o loop de quadros da visualização e espere o trabalho da GPU que os utiliza terminar. Depois, libere os recursos antigos. Libere o contexto somente depois que todas as visualizações tiverem liberado seus recursos de apresentação associados a esse contexto e todos os recursos da aplicação criados a partir dele tiverem sido liberados.'
concepts.platforms.ownership.guidance: 'O controle executa os manipuladores de quadro pelo dispatcher da interface. Concentre esses manipuladores na atualização da cena e na gravação de comandos: um processamento prolongado na CPU também atrasa a resposta da interface.'
concepts.platforms.ownership.title: 'Responsabilidades da aplicação e do controle'
concepts.platforms.presentQueue.context: '{swapChainPresent} espera apenas em {swapChainQueue}. Acompanhe separadamente os envios de renderização antes de reutilizar ou liberar seus recursos, e interrompa a apresentação antes de chamar {swapChainResize} ou liberar a cadeia de troca.'
concepts.platforms.presentQueue.description: 'Por padrão, uma cadeia de troca apresenta em {graphicsQueue}. Definir {swapChainDescIsPresentQueueEnabled} como {true} a atribui a {presentQueue}, desacoplando a apresentação do trabalho posterior em {graphicsQueue} para que uma thread dedicada controle o ritmo dos quadros renderizados e gerados de forma independente.'
concepts.platforms.presentQueue.details: '{swapChainQueue} retorna a fila de apresentação da cadeia de troca. Grave todas as escritas em {swapChainDrawable} nessa fila, envie-as com uma dependência do envio de renderização, espere a conclusão e apresente:'
concepts.platforms.presentQueue.guidance: 'Aqui, {rendered} é o valor de conclusão do envio que produziu {frame} no layout {copySrc}, e {extent} corresponde ao tamanho da textura de saída. Esperar pelo envio da cópia cobre tanto a dependência de renderização quanto a própria cópia, sem bloquear em trabalhos posteriores da fila gráfica.'
concepts.platforms.presentQueue.title: 'Uso da fila de apresentação'
concepts.platforms.surface.description: 'O {link} usa Silk.NET para criar a janela e processar seus eventos. O Zenith.NET recebe os identificadores nativos e as dimensões em uma descrição {surface}, usada para criar uma {swapChain}. A aplicação continua responsável pela janela do sistema operacional.'
concepts.platforms.surface.description.link: 'tutorial do triângulo'
concepts.platforms.surface.details: 'Os identificadores da superfície dependem da API gráfica e do sistema de janelas. Combinações comuns são:'
concepts.platforms.surface.guidance: 'O programa hospedeiro em {appCs} oferece suporte a Windows, macOS e X11. Sua janela Linux fornece identificadores Xlib, portanto uma sessão Wayland precisa de XWayland para executá-lo. Uma aplicação nativa de Wayland fornece os identificadores de display e superfície por meio de {surfaceWayland}.'
