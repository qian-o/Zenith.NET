concepts.platforms.integration.title: Escolher o caminho de apresentação bem como o framework
concepts.platforms.lifecycle.context: Para uma visualização de interface, use {descWidth}, {descHeight}, {descFormat} e {descSampleCount} da textura de saída do evento ao criar recursos de renderização correspondentes. O controle determina a resolução dessa textura de saída; não presuma que suas dimensões lógicas ou escala de tela sejam sempre iguais às dimensões da textura.
concepts.platforms.lifecycle.description: Para uma cadeia de troca nativa, passe as dimensões do framebuffer em pixels. Os tamanhos de janela expressos em unidades lógicas podem ser diferentes quando o dimensionamento de tela está ativado. Ignore framebuffers de tamanho zero, redimensione a cadeia de troca quando o tamanho em pixels mudar e obtenha {swapChainDrawable} para cada quadro. A textura de saída pertence à cadeia de troca e pode mudar após a apresentação ou o redimensionamento.
concepts.platforms.lifecycle.details: "{swapChainResize} altera as dimensões da superfície existente. {swapChainRefresh} substitui a descrição da superfície, incluindo seus handles nativos. Antes de qualquer operação, conclua os usos pendentes dos recursos afetados. Descarte a cadeia de troca antes de destruir seu destino de apresentação nativo."
concepts.platforms.lifecycle.guidance: Recrie texturas de profundidade ou fora da tela de propriedade da aplicação cujo tamanho segue a janela e atualize constantes contendo seus handles. Uma pipeline pode permanecer em uso durante uma mudança de tamanho quando seus formatos de anexos e contagem de amostras permanecerem compatíveis. O {link} mantém sua pipeline enquanto substitui sua textura de profundidade.
concepts.platforms.lifecycle.guidance.link: renderizador de cubo giratório
concepts.platforms.lifecycle.title: Manter o tamanho e o tempo de vida da textura de saída com seu host
concepts.platforms.ownership.description: A aplicação é proprietária do contexto que atribui e dos recursos que cria para renderização. O controle é proprietário de seus próprios recursos de apresentação. Alterar a propriedade {graphicsContext} da visualização faz com que o agendador recrie os recursos do controle; isso não recria as pipelines, buffers ou texturas da aplicação para o novo contexto.
concepts.platforms.ownership.details: Coordene a substituição de recursos com o ciclo de vida do quadro da visualização. Interrompa a atividade de quadros da visualização e conclua os usos pendentes da GPU antes de descartar recursos da aplicação ou o contexto atribuído. Remover uma visualização não transfere a propriedade do contexto para o controle.
concepts.platforms.ownership.guidance: O {frameSchedulerCs} compartilhado distribui o trabalho de quadros por meio do despachante de interface da visualização. Mantenha os manipuladores de quadro focados na atualização e gravação do quadro; trabalho prolongado da CPU ali também atrasa a interface.
concepts.platforms.ownership.title: Manter os recursos da aplicação fora da propriedade do controle
concepts.platforms.surface.context: Uma biblioteca de janelas ou framework de interface suportar um sistema operacional não garante que o backend de GPU selecionado esteja disponível nele. Recursos de dispositivo, drivers e suporte a superfícies nativas ainda devem corresponder. Verifique o traçado de raios e o sombreamento de malhas opcionais por meio de {contextCapabilities} antes de criar essas cargas de trabalho.
concepts.platforms.surface.description: O {link} usa o Silk.NET para criar uma janela e processar eventos. O Zenith.NET se conecta a essa janela por meio de uma descrição de {surface} e uma {swapChain}. Uma superfície contém handles e dimensões nativas; construir a descrição não cria nem possui a janela do sistema operacional.
concepts.platforms.surface.description.link: triângulo
concepts.platforms.surface.details: "O handle deve corresponder ao backend selecionado:"
concepts.platforms.surface.guidance: O arquivo {appCs} do tutorial mostra as opções do Windows, macOS e X11. Seu host Linux fornece handles Xlib; usá-lo em uma sessão Wayland requer o XWayland. Uma aplicação nativa Wayland forneceria handles diferentes por meio de {surfaceWayland}.
