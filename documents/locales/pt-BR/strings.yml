samples.computeShader.description: Converte uma imagem para escala de cinza com um dispatch de computação e exibe a textura resultante. Demonstra handles de recursos para uma textura de entrada amostrada e uma textura de saída gravável, contagens de grupos de threads arredondadas para cima e uma verificação de limites no shader. Mantenha o recurso {assetsTexturesShokoPng} incluído; o renderizador o processa uma vez e apresenta o resultado nos quadros subsequentes.
samples.computeShader.details: "{computeShaderRendererCs} · {computeShaderSlang}"
samples.computeShader.title: Shader de computação
samples.cube.description: Adiciona desenho indexado, matrizes de modelo, visualização e projeção em um buffer de constantes e teste de profundidade. A textura de profundidade é recriada no redimensionamento. Use ao passar de geometria em espaço de recorte para um objeto transformado; o renderizador usa um anexo de profundidade/estêncil {d32FloatS8UInt}.
