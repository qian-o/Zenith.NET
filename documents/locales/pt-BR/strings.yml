concepts.platforms.surface.table.win32.graphicsApiAndPlatform: 'DirectX 12 ou Vulkan no Windows.'
concepts.platforms.surface.table.xlib.graphicsApiAndPlatform: 'Vulkan no Linux com X11 ou XWayland.'
concepts.platforms.surface.table.xlib.handles: 'Display e janela X11'
concepts.platforms.surface.title: 'Superfícies nativas de apresentação'
concepts.platforms.title: 'Integração de plataforma'
concepts.platforms.verticalSync.description: 'A sincronização vertical alinha a apresentação ao ciclo de atualização da tela para evitar rasgos. {swapChainDescIsVerticalSyncEnabled} é {false} por padrão, permitindo que {swapChainPresent} apresente sem esperar a próxima atualização; defina-o como {true} para sincronizar a apresentação e ajustar {swapChainPresent} à taxa de atualização.'
concepts.platforms.verticalSync.details: 'Essa configuração é fixada na criação da cadeia de troca. Para alterá-la, espere o trabalho pendente da GPU nas texturas de saída terminar — como antes de {swapChainResize} —, libere a cadeia de troca e crie uma nova.'
concepts.platforms.verticalSync.title: 'Sincronização vertical'
concepts.resources.allocation.context: 'Os recursos colocados em um heap dependem de seu armazenamento durante todo o tempo de vida. Depois do último uso na GPU, libere os recursos antes de liberar o heap.'
concepts.resources.allocation.description: 'Use um {heap} quando a aplicação precisar gerenciar as alocações por conta própria. Um heap fornece armazenamento no qual os recursos são colocados em deslocamentos explícitos em bytes; a aplicação escolhe esses deslocamentos e acompanha as regiões ocupadas.'
concepts.resources.allocation.details: 'Para cada recurso, chame {contextGetSizeAndAlignment} com a descrição de buffer ou textura que será usada na criação. Reserve o tamanho retornado em um deslocamento múltiplo do alinhamento informado, dentro dos limites do heap e sem sobrepor outra alocação ainda em uso. A alocação de uma textura pode incluir preenchimento; por isso, a quantidade de pixels e os bytes por pixel não bastam para calcular seu tamanho.'
concepts.resources.allocation.guidance: 'Um buffer colocado em um heap deve declarar a mesma residência desse heap. Para armazenar texturas, use um heap exclusivo da GPU.'
concepts.resources.allocation.title: 'Alocação em heaps'
