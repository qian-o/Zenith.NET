concepts.resources.bufferUsages.title: Usos de buffer
concepts.resources.description: "Escolha a descrição do recurso de acordo com as operações que o usarão. Uma textura que recebe renderização, é amostrada por um shader e é lida pela CPU precisa declarar os três usos e estabelecer a sincronização entre eles. O posicionamento da memória e o tempo de vida do recurso são decisões adicionais."
concepts.resources.memory.context: Para um buffer acessível pela CPU, {map} fornece um endereço à CPU. Ele não espera que a GPU pare de acessar os mesmos bytes. {unmap} da mesma forma não envia trabalho nem espera pela conclusão. Antes de sobrescrever dados graváveis pela CPU, conclua as leituras de GPU que ainda precisam do conteúdo antigo.
concepts.resources.memory.description: "Um {bufferDesc} tem um campo {residency}. Escolha-o de acordo com a forma como a CPU e a GPU acessarão os dados:"
concepts.resources.memory.details: A residência descreve o acesso pretendido da CPU à alocação. Ela não implica que cada dispositivo tenha memórias físicas separadas de CPU e GPU. O triângulo usa {cpuWriteOnly} para inicializar um pequeno buffer de vértices diretamente. Uma malha estática grande pode, em vez disso, se beneficiar de armazenamento exclusivo de GPU com um upload único.
concepts.resources.memory.guidance: "{textureDesc} não tem campo de residência. Texturas comuns criadas por contexto usam armazenamento de GPU. Sua API pública fornece operações de upload e download para transferências de dados da CPU, sem expor um método de mapeamento direto. Heaps explícitos fornecem controle de posicionamento, descrito abaixo."
concepts.resources.memory.table.cpuReadOnly.cPUAccess: "Ler a memória mapeada após a conclusão da cópia de GPU."
concepts.resources.memory.table.cpuReadOnly.typicalRole: "Dados produzidos pela GPU para leitura na CPU"
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: "Gravar na memória mapeada após o término das leituras anteriores da GPU."
concepts.resources.memory.table.cpuWriteOnly.typicalRole: "Dados fornecidos ou atualizados pela CPU"
concepts.resources.memory.table.gpuOnly.cPUAccess: "Transferir bytes por meio de um buffer de upload ou de leitura da GPU."
concepts.resources.memory.table.gpuOnly.typicalRole: "Geometria estática e dados de trabalho da GPU"
concepts.resources.memory.table.headings.cPUAccess: Acesso da CPU
concepts.resources.memory.table.headings.residency: Residência
concepts.resources.memory.table.headings.typicalRole: Função típica
concepts.resources.memory.title: "Escolher a memória conforme o acesso necessário da CPU"
concepts.resources.textureUsages.description: "Os sinalizadores de uso de transferência descrevem a direção das cópias de GPU. O acesso da CPU é uma decisão separada de posicionamento de memória, descrita abaixo."
concepts.resources.textureUsages.details: "Combinar sinalizadores de uso declara várias funções; não executa as operações nem ordena seus acessos. As texturas ainda precisam de {link} adequados, e seus formatos devem oferecer suporte aos usos solicitados no dispositivo escolhido."
