concepts.resources.allocation.context: "Comece com recursos criados pelo contexto, a menos que precise de um alocador próprio. Ao usar um heap, aguarde a conclusão de todo o trabalho de GPU que usa seus recursos; depois libere os recursos posicionados e, por último, o próprio heap."
concepts.resources.allocation.description: "Um {heap} fornece memória na qual você posiciona recursos em deslocamentos explícitos em bytes. A aplicação escolhe esses deslocamentos e acompanha quais regiões estão em uso."
concepts.resources.allocation.details: "Antes de posicionar um recurso, use {contextGetSizeAndAlignment} com sua descrição exata de buffer ou textura. Escolha um deslocamento múltiplo do alinhamento retornado, reserve o tamanho retornado e mantenha o recurso dentro do tamanho total do heap. Alocações ainda em uso não devem se sobrepor. O armazenamento de texturas pode incluir preenchimento e alinhamento específicos do backend; multiplicar a quantidade de pixels pelos bytes por pixel não calcula o tamanho da alocação."
concepts.resources.allocation.guidance: "Para buffers posicionados, mantenha a residência do buffer consistente com a do heap. Use heaps exclusivos de GPU para as texturas de GPU comuns descritas aqui. Tamanho e alinhamento são requisitos de posicionamento, não uma garantia de que qualquer recurso possa ser colocado em qualquer heap em todos os backends."
concepts.resources.allocation.title: Posicionar recursos em um heap quando o controle de alocação for necessário
