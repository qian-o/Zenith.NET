concepts.execution.pipelines.description: Uma pipeline gráfica combina shaders, o layout de entrada de vértices, a regra para montar vértices em primitivas, formatos de anexo e estado de renderização. Defina-a antes de vincular dados de vértices, índices ou constantes e emitir comandos de desenho. Seus formatos de anexo e contagem de amostras devem corresponder aos anexos da passagem de renderização.
concepts.execution.pipelines.details: Uma pipeline de computação fornece o ponto de entrada do shader para um dispatch, que inicializa grupos de threads de GPU. Defina-a e defina suas constantes antes do dispatch. Dispatches de computação pertencem ao exterior das passagens de renderização gráfica. Mudar a pipeline é uma mudança em como os comandos subsequentes interpretam suas entradas; vincule os dados necessários para a pipeline selecionada antes de usá-la.
concepts.execution.pipelines.guidance: O {link} mostra a sequência gráfica completa. O {detail} grava um dispatch seguido por uma passagem gráfica que exibe o resultado.
concepts.execution.pipelines.guidance.detail: exemplo de computação
concepts.execution.pipelines.guidance.link: callback de renderização do triângulo
concepts.execution.pipelines.title: Uma pipeline determina como os comandos interpretam os dados
concepts.execution.queues.description: Comece com {graphicsQueue} quando um quadro combinar desenho, computação e cópias. Manter o trabalho dependente em uma única fila torna sua ordenação mais fácil de acompanhar.
concepts.execution.queues.details: Uma fila aceita lotes de comandos para execução. Filas separadas não correspondem necessariamente a mecanismos de hardware separados, portanto seus trabalhos podem não ser executados simultaneamente. Use outra fila quando a carga de trabalho puder se beneficiar da sobreposição e adicione uma dependência explícita quando uma fila consumir os resultados de outra fila.
concepts.execution.queues.guidance: Quando comandos posteriores dependem de gravações anteriores, a aplicação também deve garantir que essas gravações estejam disponíveis para os comandos posteriores. Enviar ambos os buffers de comandos para a mesma fila não estabelece automaticamente todas as dependências desse tipo. Comandos podem usar diferentes estágios de GPU, e acessos posteriores podem precisar de uma barreira ou transição de textura. {link} explica a distinção entre ordem de envio e visibilidade de recursos.
concepts.execution.queues.guidance.link: Sincronização
concepts.execution.queues.table.computeQueue.workToRecord: Dispatches de computação e trabalho de transferência compatível, sem passagens de renderização gráfica.
concepts.execution.queues.table.graphicsQueue.workToRecord: Passagens de renderização e desenho, além de operações de computação e transferência usadas pelo quadro.
concepts.execution.queues.table.headings.queue: Fila
concepts.execution.queues.table.headings.workToRecord: Trabalho a gravar
concepts.execution.queues.table.transferQueue.workToRecord: Trabalho de envio, download e cópia, sem desenho ou dispatches de computação.
concepts.execution.queues.title: Escolher uma fila para o trabalho que ela executará
concepts.execution.recording.context: A fila faz a sondagem de conclusão e recicla buffers de comandos finalizados. Chame {queueCommandBuffer} para cada nova gravação; ele pode retornar uma instância reciclada. Não descarte um buffer de comandos emprestado, não o envie duas vezes nem continue gravando nele após o envio. Grave um determinado buffer de comandos a partir de uma única thread por vez; o bloqueio interno da fila não protege contra edições simultâneas em um buffer de comandos.
concepts.execution.recording.description: "{queueCommandBuffer} retorna um {commandBuffer} com a gravação já iniciada. Grave os comandos e suas dependências, depois chame {submit} uma vez. O envio encerra a gravação e retorna um {timelineValue} identificando um ponto de conclusão nessa fila."
concepts.execution.recording.details: "Por exemplo, após gravar um quadro em {commandBuffer}, o triângulo o envia e aguarda a conclusão com:"
concepts.execution.recording.guidance: "{submit} agenda o trabalho; {wait} impede que a CPU continue até que esse envio seja concluído. Gravar um desenho, encerrar uma passagem de renderização e enviar um buffer de comandos são operações separadas. Nem gravar o desenho nem encerrar a passagem aguardam a GPU."
concepts.execution.recording.title: A gravação não executa comandos
concepts.execution.title: Modelo de execução
concepts.platforms.description: Escolha se sua aplicação possui a janela nativa e o loop de quadros ou se utiliza um controle de renderização de interface. Essa escolha determina quem obtém a textura de saída, envia comandos e apresenta o resultado. A textura de saída é a textura usada como saída do quadro atual. Tarefas gráficas e de computação fora da tela não precisam de janela ou cadeia de troca.
concepts.platforms.frame.context: Adicione suas vinculações de pipeline e comandos de desenho dentro dessa passagem. Encerre a passagem antes de retornar. Não envie o buffer de comandos fornecido nem apresente de forma independente, e não descarte o buffer de comandos ou a textura de saída. Se o seu manipulador usar a textura de saída em outro layout, retorne-a para {colorAttachment} para a transição final do controle.
concepts.platforms.frame.description: As integrações implementam {iZenithView}. A aplicação fornece seu {graphicsContext}, atualiza dados de cena em {updateRequested} e grava a renderização em {renderRequested} usando {renderEventArgs}.
concepts.platforms.frame.details: "O controle gerencia o ciclo completo de cada quadro. Ele obtém a textura de saída e o buffer de comandos, faz a transição da textura para {colorAttachment}, chama os manipuladores e executa o envio e a apresentação exigidos pelo framework."
concepts.platforms.frame.guidance: "Para uma {iZenithView} inicializada chamada {view}, com um contexto atribuído, este manipulador grava uma passagem de limpeza completa. Requer {usingZenithNET}:"
concepts.platforms.frame.notes: Os controles transitam de {undefined} no início de cada quadro, portanto as aplicações não podem confiar na preservação do conteúdo anterior da textura de saída. Limpe ou renderize a imagem necessária a cada quadro. Mantenha acumulação persistente ou renderização em cache em uma textura de propriedade da aplicação e, em seguida, exiba essa textura por meio da visualização.
concepts.platforms.frame.reference: "{zenithViewHelperDrawableFormat} fornece o formato de cor padrão das integrações. Verifique a textura de saída real do evento ao fazer a correspondência de formatos de anexos, contagens de amostras e dimensões."
concepts.platforms.frame.title: Gravar no quadro fornecido por um controle de interface
concepts.platforms.integration.context: WinForms, WPF e o caminho WinUI do Windows exigem Windows. Aplicações MAUI precisam da carga de trabalho de sua plataforma de destino e devem registrar o manipulador de controle com {useZenithView}; consulte {extensionsCs}. O suporte ao framework e o suporte ao backend devem ser atendidos.
concepts.platforms.integration.description: "Os controles compartilham a interface de eventos, mas nem todos apresentam da mesma maneira:"
concepts.platforms.integration.details: A leitura de bitmap (bitmap readback) copia os pixels renderizados para a memória da CPU antes que a interface os exiba. A interoperabilidade por textura compartilhada evita essa leitura, mas ainda pode exigir cópias e sincronização na GPU. A interface compartilhada {renderRequested}, portanto, não implica custos de apresentação idênticos ou requisitos de interoperabilidade nativa idênticos.
concepts.platforms.integration.guidance: "Use o pacote para o framework da aplicação; por exemplo:"
