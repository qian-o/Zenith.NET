### YamlMime:Resources
concepts.execution.context.description: '{graphicsContext} 通过特定后端连接应用程序与 GPU 设备，并提供图形、计算和传输队列。配合使用的资源必须属于同一上下文；缓冲区、纹理、着色器、管线及其句柄不能跨上下文绑定。'
concepts.execution.context.details: '{capabilities} 提供设备名称与支持的功能。创建光线追踪或网格着色所需的资源前，分别通过 {rayTracingSupported} 和 {meshShadingSupported} 检查支持情况。{link}与{detail}示例展示了初始化时的检查方式。'
concepts.execution.context.details.detail: '网格着色'
concepts.execution.context.details.link: '光线追踪'
concepts.execution.context.title: '图形上下文'
concepts.execution.description: 'GPU 工作从 CPU 端开始：应用程序创建资源，录制使用这些资源的命令，再将命令提交到队列。提交之后，CPU 可以继续处理其他任务，同时由 GPU 执行命令。相关资源必须保留到执行结束。'
concepts.execution.ownership.description: '所有权决定由谁释放对象，GPU 完成状态决定何时可以释放。即使仍保留对象的 C# 引用，调用 {dispose} 也会释放其原生资源。提交命令不会将资源所有权转交给队列。'
concepts.execution.ownership.details: '关闭程序时，先停止提交新工作，并等待所有相关队列完成最后一次资源访问。随后释放应用程序资源，最后释放上下文。上下文会释放自身的队列和内部辅助对象，因此这一步应在应用程序工作全部完成后进行。'
concepts.execution.ownership.guidance: '渲染期间，若准备覆盖数据或替换资源，应跟踪仍在使用它们的工作。等待这些访问完成后，再修改数据或释放存储。视图与底层资源如何遵循这一生命周期规则，见{link}。'
concepts.execution.ownership.guidance.link: '资源管理'
concepts.execution.ownership.table.applicationResources.object: '应用程序创建的资源'
concepts.execution.ownership.table.applicationResources.ownership: '最后一次 GPU 使用完成后，由应用程序释放。'
concepts.execution.ownership.table.commandBuffers.object: '借用的命令缓冲区'
concepts.execution.ownership.table.commandBuffers.ownership: '由队列管理和回收。'
concepts.execution.ownership.table.headings.object: '对象'
concepts.execution.ownership.table.headings.ownership: '释放责任'
concepts.execution.ownership.table.queues.object: '图形上下文的队列及其时间线'
concepts.execution.ownership.table.queues.ownership: '由上下文和队列管理。'
concepts.execution.ownership.table.swapChainDrawable.ownership: '由交换链管理。'
concepts.execution.ownership.title: '所有权与生命周期'
concepts.execution.pipelines.description: '图形管线规定绘制所用的着色器、顶点输入布局、图元组装方式、附件格式和渲染状态。绑定顶点、索引或常量数据之前，须先选择管线；管线声明的附件格式与采样数也必须与渲染通道一致。'
concepts.execution.pipelines.details: '计算管线选择分派所执行的着色器入口点。在图形渲染通道之外，先绑定管线及其常量，再执行分派。'
concepts.execution.pipelines.guidance: '{link}给出了完整的图形命令顺序。{detail}则先执行计算分派，再通过图形通道显示结果。'
concepts.execution.pipelines.guidance.detail: '计算示例'
concepts.execution.pipelines.guidance.link: '三角形的渲染回调'
concepts.execution.pipelines.title: '管线状态'
concepts.execution.queues.description: '一帧同时包含绘制、计算和复制时，通常从 {graphicsQueue} 开始。将有依赖的操作放在同一队列，有助于明确执行顺序。'
concepts.execution.queues.details: '不同队列可以分别接收独立的工作负载，但未必对应独立的硬件引擎。若工作能够从重叠执行中受益，再考虑增加队列。当一个队列使用另一个队列生成的数据时，需要在两次提交之间建立显式依赖。'
concepts.execution.queues.guidance: '即使位于同一队列，有依赖的操作也可能需要屏障或纹理转换，才能让后续访问读到此前写入的结果。这种内存依赖与提交顺序不同，具体表达方式见{link}。'
concepts.execution.queues.guidance.link: '同步'
concepts.execution.queues.table.computeQueue.workToRecord: '计算分派以及兼容的传输工作，不含图形渲染通道。'
concepts.execution.queues.table.graphicsQueue.workToRecord: '渲染通道、绘制、计算与传输操作。'
concepts.execution.queues.table.headings.queue: '队列'
concepts.execution.queues.table.headings.workToRecord: '支持的工作'
concepts.execution.queues.table.transferQueue.workToRecord: '上传、回读与复制工作，不含绘制或计算分派。'
concepts.execution.queues.title: '队列选择'
concepts.execution.recording.context: '队列会回收已完成的命令缓冲区以供复用。每次录制时，通过 {queueCommandBuffer} 获取缓冲区，同一时间只由一个线程录制，并且只提交一次。提交后，将缓冲区交由队列管理，不再修改、重复提交或自行释放。'
concepts.execution.recording.description: '{queueCommandBuffer} 返回的 {commandBuffer} 已处于录制状态。录制完操作及其依赖后，调用一次 {submit}。提交会结束录制，并返回标识该队列完成点的 {timelineValue}。'
concepts.execution.recording.details: '三角形教程将一帧录制到 {commandBuffer} 后，按如下方式提交并等待完成：'
concepts.execution.recording.guidance: '录制构造命令序列，{submit} 安排该序列执行。随后调用 {wait}，CPU 线程会等待本次提交完成。教程因此采用逐帧执行的流程：当前帧完成后，才开始下一帧。'
concepts.execution.recording.title: '录制与提交'
concepts.execution.title: '执行模型'
concepts.platforms.description: '呈现流程可以由应用程序管理，也可以交给 UI 渲染控件。这决定了谁来获取当前帧的输出纹理、录制和提交命令，以及显示渲染结果。'
concepts.platforms.frame.context: '在通道内绑定管线并录制绘制命令，处理程序返回前须结束通道。控件负责提交命令并呈现结果；处理程序不得自行提交命令缓冲区，也不得释放传入的命令缓冲区或输出纹理。若改变了输出纹理的布局，返回前须恢复为 {colorAttachment}，以便控件完成最后的转换。'
concepts.platforms.frame.description: '各控件实现 {iZenithView} 接口。应用程序设置 {graphicsContext}，在 {updateRequested} 中更新场景，并在 {renderRequested} 中通过传入的 {renderEventArgs} 录制命令。'
concepts.platforms.frame.details: '每帧，控件获取输出纹理与命令缓冲区，将输出纹理转换为 {colorAttachment}，再调用更新和渲染处理程序。之后，控件提交录制的工作，并通过对应框架的呈现机制显示图像。'
concepts.platforms.frame.guidance: '先在文件中添加 {usingZenithNET}。假定名为 {view} 的 {iZenithView} 实例已初始化并设置图形上下文，可注册以下处理程序清除其输出纹理：'
concepts.platforms.frame.notes: '初始转换使用 {undefined}，允许丢弃先前图像的内容。因此，每帧都应重新绘制或清除整张图像。需要累积或缓存的渲染结果，可保存在应用程序拥有的纹理中，再将该纹理绘制到控件的输出纹理上。'
concepts.platforms.frame.reference: '{zenithViewHelperDrawableFormat} 提供这些集成使用的默认颜色格式。'
concepts.platforms.frame.title: '通过 UI 控件渲染'
concepts.platforms.integration.context: 'WinForms、WPF 和 Windows 版 WinUI 集成运行于 Windows。使用 MAUI 时，安装目标平台的工作负载，并通过 {useZenithView} 注册控件处理程序，具体见 {extensionsCs}。'
concepts.platforms.integration.description: '控件共享事件接口，但呈现机制因框架而异：'
concepts.platforms.integration.details: '各实现将 GPU 图像送到 UI 的方式不同。位图回读先将像素复制到 CPU 内存，再显示图像；共享纹理互操作可以省去这次 CPU 复制，但仍可能需要 GPU 复制与同步。选择集成方式时，除了共用的 {renderRequested} 事件接口，也应考虑其呈现路径。'
concepts.platforms.integration.guidance: '通过 NuGet 添加所用 UI 框架的集成包。Avalonia 对应的包为 {avaloniaPackage}。'
concepts.platforms.integration.table.avalonia.integration: 'Avalonia'
concepts.platforms.integration.table.avalonia.presentation: '渲染到纹理后，将像素回读到 {writeableBitmap}，实现见 {zenithViewCs} 和 {surfaceCs}。'
concepts.platforms.integration.table.headings.integration: '集成'
concepts.platforms.integration.table.headings.presentation: '呈现机制'
concepts.platforms.integration.table.maui.integration: '.NET MAUI'
concepts.platforms.integration.table.maui.presentation: 'Android、iOS 和 Mac Catalyst 使用原生呈现目标；Windows 使用共享纹理合成，具体见{link}。'
concepts.platforms.integration.table.maui.presentation.link: '平台实现'
concepts.platforms.integration.table.uno.integration: 'Uno 路径'
concepts.platforms.integration.table.uno.presentation: '将像素回读到 {writeableBitmap}，实现见 {zenithViewUnoCs}。'
concepts.platforms.integration.table.winForms.integration: 'WinForms'
concepts.platforms.integration.table.winForms.presentation: '为控件的 {hWND} 创建 Zenith.NET 交换链，实现见 {zenithViewCs}。'
concepts.platforms.integration.table.winUI.integration: 'Windows 上的 WinUI'
concepts.platforms.integration.table.winUI.presentation: '渲染到导入的共享 Direct3D 11 纹理，再复制到与 {swapChainPanel} 连接的合成交换链，具体见 {zenithViewWinUICs}。'
concepts.platforms.integration.table.wpf.integration: 'WPF'
concepts.platforms.integration.table.wpf.presentation: '导入共享 Direct3D 11 纹理，再经 Direct3D 互操作复制到由 {d3DImage} 显示的表面，具体见 {surfaceCs}。'
concepts.platforms.integration.title: '框架与呈现路径'
concepts.platforms.lifecycle.context: '创建配套附件时，使用渲染事件传入的输出纹理的 {descWidth}、{descHeight}、{descFormat} 和 {descSampleCount}。该纹理给出了渲染目标的实际尺寸，不应根据控件的布局尺寸或显示缩放比例推算。'
concepts.platforms.lifecycle.description: '交换链使用以像素计量的帧缓冲区宽度和高度。启用显示缩放时，这些值可能不同于窗口的逻辑尺寸。任一尺寸为零时，暂停渲染和交换链尺寸调整。每帧重新获取 {swapChainDrawable}：这张纹理由交换链管理，可能在呈现或调整大小后被替换。'
concepts.platforms.lifecycle.details: '帧缓冲区尺寸变化时，先等待 GPU 完成对旧图像的访问，再调用 {swapChainResize}。替换原生呈现目标时，也应先等待这些访问结束，再将新的呈现目标描述与句柄传给 {swapChainRefresh}。关闭程序时，先释放交换链，再销毁其原生呈现目标。'
concepts.platforms.lifecycle.guidance: '应用程序的深度纹理或离屏纹理若随窗口尺寸变化，就需要在调整大小时重建，并更新包含其句柄的常量。只要附件格式与采样数仍然匹配，管线就可以复用。{link}展示了如何调整纹理尺寸并保留管线。'
concepts.platforms.lifecycle.guidance.link: '旋转立方体渲染器'
concepts.platforms.lifecycle.title: '交换链尺寸与生命周期'
concepts.platforms.ownership.description: '应用程序拥有所设置的上下文及其渲染资源，控件拥有呈现资源。视图的 {graphicsContext} 变化后，调度程序会为新上下文重建控件资源。应用程序也须为该上下文重建自己的管线、缓冲区和纹理。'
concepts.platforms.ownership.details: '替换渲染资源前，先停止视图的帧活动，并等待使用这些资源的 GPU 工作完成，再释放旧资源或上下文。移除视图后，所设置的上下文仍由应用程序负责释放。'
concepts.platforms.ownership.guidance: '共享的 {frameSchedulerCs} 通过视图的 UI 调度器运行帧处理程序。处理程序应集中于场景数据更新和命令录制，其中耗时的 CPU 工作也会延迟界面响应。'
concepts.platforms.ownership.title: '应用程序与控件的责任'
concepts.platforms.surface.description: '{link}使用 Silk.NET 创建窗口并处理事件。Zenith.NET 通过 {surface} 描述获取原生窗口句柄与尺寸，再据此创建 {swapChain}。操作系统窗口仍由应用程序负责管理。'
concepts.platforms.surface.description.link: '三角形教程'
concepts.platforms.surface.details: '原生句柄必须与所选后端匹配：'
concepts.platforms.surface.guidance: '{appCs} 中的示例宿主支持 Windows、macOS 和 X11。Linux 窗口提供 Xlib 句柄，因此在 Wayland 会话中需要 XWayland。原生 Wayland 应用程序则通过 {surfaceWayland} 提供显示与表面句柄。'
concepts.platforms.surface.table.android.backend: 'Android 上的 Vulkan。'
concepts.platforms.surface.table.apple.backend: 'Apple 平台上的 Metal。'
concepts.platforms.surface.table.headings.backend: '后端与平台'
concepts.platforms.surface.table.headings.factory: '呈现目标工厂方法'
concepts.platforms.surface.table.headings.handles: '宿主提供的句柄'
concepts.platforms.surface.table.wayland.backend: '带有原生 Wayland 宿主的 Vulkan。'
concepts.platforms.surface.table.wayland.handles: 'Wayland 显示与表面'
concepts.platforms.surface.table.win32.backend: 'Windows 上的 DirectX 12 或 Vulkan。'
concepts.platforms.surface.table.xlib.backend: 'Linux 上带有 X11 或 XWayland 的 Vulkan。'
concepts.platforms.surface.table.xlib.handles: 'X11 显示与窗口'
concepts.platforms.surface.title: '原生呈现目标'
concepts.platforms.title: '平台集成'
concepts.resources.allocation.context: '放置在堆中的资源在整个生命周期内都依赖堆的存储。最后一次 GPU 使用完成后，应先释放资源，再释放堆。'
concepts.resources.allocation.description: '应用程序需要自行管理内存分配时，可以使用 {heap}。堆为资源提供存储，应用程序选择明确的字节偏移量来放置资源，并记录各区域的占用情况。'
concepts.resources.allocation.details: '对每个资源，使用创建时所需的缓冲区或纹理描述调用 {contextGetSizeAndAlignment}。按返回的大小预留空间，起始偏移量须为返回对齐值的整数倍，且整个区域位于堆内，不与其他仍有效的分配重叠。纹理可能包含后端特有的填充，因此不能仅根据像素数量和每像素字节数计算分配大小。'
concepts.resources.allocation.guidance: '放置在堆中的缓冲区必须使用与堆相同的驻留设置。纹理存储使用 GPU 专用堆。'
concepts.resources.allocation.title: '堆分配'
concepts.resources.bufferUsages.table.constant.role: '通过常量缓冲区绑定读取的着色器参数。'
concepts.resources.bufferUsages.table.headings.role: '作用'
concepts.resources.bufferUsages.table.headings.usage: '用途'
concepts.resources.bufferUsages.table.index.role: '索引绘制所使用的索引。'
concepts.resources.bufferUsages.table.indirect.role: '间接绘制或分派命令读取的参数。'
concepts.resources.bufferUsages.table.none.role: '未声明任何缓冲区用途标志。'
concepts.resources.bufferUsages.table.storageReadOnly.role: '通过只读着色器绑定访问的缓冲区数据。'
concepts.resources.bufferUsages.table.storageReadWrite.role: '通过读写着色器绑定访问的缓冲区数据。'
concepts.resources.bufferUsages.table.transferDst.role: 'GPU 复制操作的目标存储。'
concepts.resources.bufferUsages.table.transferSrc.role: 'GPU 复制操作的源数据。'
concepts.resources.bufferUsages.table.vertex.role: '供绘制命令读取的顶点属性。'
concepts.resources.bufferUsages.title: '缓冲区用途'
concepts.resources.description: '资源描述规定应用程序如何使用其存储。例如，一张纹理若要作为渲染目标、供着色器采样，并将内容复制回 CPU，就需要声明这三种操作对应的用途。内存放置决定 CPU 的访问方式，同步与生命周期管理则决定何时可以访问数据或释放存储。'
concepts.resources.memory.context: '对于 CPU 可访问的缓冲区，{map} 提供 CPU 读写数据所用的地址。映射和 {unmap} 都不会等待 GPU 工作。CPU 读取 GPU 写入的结果前，应用程序须先等待写入完成；修改同一块内存前，也须等待 GPU 对这些字节的访问结束。'
concepts.resources.memory.description: '{bufferDesc} 的 {residency} 字段指定了 CPU 对分配内存的预期访问方式：'
concepts.resources.memory.details: '驻留设置表达 CPU 的访问需求，即使 CPU 与 GPU 共享物理内存也同样适用。三角形教程使用 {cpuWriteOnly} 直接初始化小型顶点缓冲区。对于较大的静态几何数据，上传到 GPU 专用存储可能更合适。'
concepts.resources.memory.guidance: '通过上下文直接创建的纹理使用 GPU 存储，因此 {textureDesc} 没有驻留字段。应用程序通过上传和回读，在纹理与 CPU 内存之间交换数据。'
concepts.resources.memory.table.cpuReadOnly.cPUAccess: '只读'
concepts.resources.memory.table.cpuReadOnly.typicalRole: 'GPU 生成的回读数据'
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: '只写'
concepts.resources.memory.table.cpuWriteOnly.typicalRole: 'CPU 提供或更新的数据'
concepts.resources.memory.table.gpuOnly.cPUAccess: '无'
concepts.resources.memory.table.gpuOnly.typicalRole: '静态几何体和 GPU 工作数据'
concepts.resources.memory.table.headings.cPUAccess: '预期 CPU 访问'
concepts.resources.memory.table.headings.residency: '内存驻留'
concepts.resources.memory.table.headings.typicalRole: '典型用途'
concepts.resources.memory.title: 'CPU 访问与内存放置'
concepts.resources.textureUsages.description: '传输标志声明资源在 GPU 复制中用作源还是目标。CPU 能否直接访问这块存储，则由内存放置方式决定。'
concepts.resources.textureUsages.details: '用途标志声明纹理可以承担的作用。在这些作用之间切换时，需要相应的{link}；所选设备也必须支持以该纹理格式执行所声明的操作。'
concepts.resources.textureUsages.details.link: '布局与同步'
concepts.resources.textureUsages.table.colorAttachment.role: '渲染通道中的颜色附件。'
concepts.resources.textureUsages.table.depthStencilAttachment.role: '渲染通道中的深度／模板附件。'
concepts.resources.textureUsages.table.headings.role: '作用'
concepts.resources.textureUsages.table.headings.usage: '用途'
concepts.resources.textureUsages.table.none.role: '未声明任何纹理用途标志。'
concepts.resources.textureUsages.table.sampled.role: '通过采样纹理绑定读取的纹理数据。'
concepts.resources.textureUsages.table.storage.role: '通过存储纹理绑定供着色器读取或写入的纹理数据。'
concepts.resources.textureUsages.table.transferDst.role: 'GPU 复制操作的目标图像存储。'
concepts.resources.textureUsages.table.transferSrc.role: 'GPU 复制操作的源图像数据。'
concepts.resources.textureUsages.title: '纹理用途'
concepts.resources.title: '资源管理'
concepts.resources.transfers.context: '回读先将 GPU 数据复制到内部回读存储。库回收已完成的命令缓冲区时，再将数据复制到指定的 CPU 目标。对本次回读提交的完成值调用 {wait}，可以完成这两个步骤。在调用返回前，目标内存须保持已分配状态，托管内存须保持固定。'
concepts.resources.transfers.description: '上传将 CPU 数据复制到 GPU 资源，回读则将资源数据复制到 CPU 内存。缓冲区和纹理上的这些方法会在传输完成后返回：'
concepts.resources.transfers.details: '调用这些方法前，先处理与其他队列访问之间的冲突。方法内部的等待只覆盖其自身的传输，不会建立与其他队列的依赖。直接通过映射内存复制时，则完全由调用方负责等待存在冲突的 GPU 访问。'
concepts.resources.transfers.guidance: '要将传输与其他 GPU 工作一同提交，可通过 {commandBufferUpload} 或 {commandBufferDownload} 录制。上传源与回读目标的内存生命周期要求不同：'
concepts.resources.transfers.item: '上传调用期间，库会将源数据复制到内部的临时上传存储，即暂存内存。GPU 随后从这块存储读取，因此应用程序的源指针只需保持有效到调用返回。'
concepts.resources.transfers.notes: '纹理传输中的行步幅是 CPU 数据相邻两行之间的字节距离；切片步幅则是相邻深度切片之间的字节距离。传输操作根据这些值，在 CPU 数据与纹理的 GPU 存储之间复制内容。GPU 完成与数据送达回读目标为何是两个步骤，见{link}。'
concepts.resources.transfers.notes.link: '同步'
concepts.resources.transfers.table.bufferDownload.transfer: '对于 {cpuReadOnly}，直接从映射内存复制；否则向传输队列提交回读，并等待完成。'
concepts.resources.transfers.table.bufferUpload.transfer: '对于 {cpuWriteOnly}，直接复制到映射内存；否则向传输队列提交上传，并等待完成。'
concepts.resources.transfers.table.headings.method: '方法'
concepts.resources.transfers.table.headings.transfer: '传输行为'
concepts.resources.transfers.table.textureTransfers.method: '{textureUpload} / {textureDownload}'
concepts.resources.transfers.table.textureTransfers.transfer: '将复制及其纹理转换提交到图形队列，并等待完成。操作结束后，所选子资源处于指定的最终布局。'
concepts.resources.transfers.title: '立即传输与命令录制'
concepts.resources.usages.description: '{bufferUsages} 和 {textureUsages} 是用于声明资源用途的标志枚举，分别设置在 {bufferDescUsages} 和 {textureDescUsages} 中。资源需要承担多种用途时，可通过 {value} 组合相应成员。'
concepts.resources.usages.title: '资源用途'
concepts.resources.views.description: '{bufferView} 描述缓冲区的一块区域及其数据解释方式。{textureView} 选择子资源范围，以及兼容的纹理类型和格式。二者都引用已有存储，并遵循创建该存储时声明的用途。视图范围用于描述访问范围，各后端并不因此提供一致的着色器边界检查。'
concepts.resources.views.details: '资源自身的句柄提供默认视图。需要其他区域或兼容的解释方式时，再创建独立视图。视图及其底层资源都必须保留到 GPU 使用结束；仅持有资源句柄不能使任一对象保持存活。替换其中任一对象时，还须更新包含旧{link}的常量。'
concepts.resources.views.details.link: '资源句柄'
concepts.resources.views.title: '视图与底层资源'
concepts.shaders.binding.context: '计算示例将 {inputTextureSampledHandle} 写入 {input}，将 {outputTextureStorageHandle} 写入 {output}。在 Slang 中，{descriptorHandle} 的类型参数规定了着色器访问资源的方式：'
concepts.shaders.binding.description: '{setConstantBuffer} 选择已有缓冲区及字节偏移量，当前管线从该位置读取常量。着色器使用这些参数前，先将数据上传到相应存储。如果此前提交的 GPU 工作仍在读取同一批字节，须等待该工作完成后再更新。'
concepts.shaders.binding.details: '准备好命令缓冲区、计算管线、已填入数据的常量缓冲区和线程组数量后，按以下顺序录制分派。常量缓冲区的绑定作用于当前管线，因此必须先选择管线：'
concepts.shaders.binding.guidance: '这里，{commandBuffer} 使用 {computePipeline} 及 {constantBuffer} 中的参数录制分派。缓冲区需要声明 {bufferUsagesConstant} 用途，偏移量 0 选择其起始位置。如果多条常量记录共用缓冲区，每条记录的起始偏移量还须满足后端绑定的对齐要求，这与记录内部的字段布局是两项独立要求。'
concepts.shaders.binding.notes: '{resourceHandle} 包含两个 32 位字段，含义由后端解释，其值仅在创建资源的上下文中有效。'
concepts.shaders.binding.reference: '保留资源及用于获取句柄的视图，直到着色器完成最后一次访问。替换纹理或视图后，应更新仍含旧句柄的常量。相关所有权规则见{link}。'
concepts.shaders.binding.reference.link: '资源管理'
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: '读取着色器类型 {t} 的结构化元素'
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: '读写着色器类型 {t} 的结构化元素'
concepts.shaders.binding.table.headings.access: '预期访问'
concepts.shaders.binding.table.headings.cHandle: 'C# 句柄'
concepts.shaders.binding.table.headings.slangFieldType: 'Slang 字段类型'
concepts.shaders.binding.table.samplerHandle.access: '纹理采样状态'
concepts.shaders.binding.table.textureSampledHandle.access: '纹理读取'
concepts.shaders.binding.table.textureStorageHandle.access: '存储纹理的读写'
concepts.shaders.binding.title: '常量缓冲区与资源句柄'
concepts.shaders.compilation.description: '{zenithCompiler} 将指定的 Slang 入口点编译为 {shaderDesc}。上下文的 {graphicsApi} 决定目标格式：DirectX 12 使用 DXIL，Metal 使用 Metal 库，Vulkan 使用 SPIR-V。'
concepts.shaders.compilation.details: '创建名为 {context} 的图形上下文后，可以编译已复制到可执行文件所在目录的三角形着色器：'
concepts.shaders.compilation.guidance: '入口点名称 {vSMain} 必须与着色器文件中的函数声明一致。在初始化阶段编译着色器并创建管线，渲染期间复用管线。管线创建完成后即可释放着色器对象，具体见{link}。'
concepts.shaders.compilation.guidance.link: '第一个三角形'
concepts.shaders.compilation.title: '着色器编译'
concepts.shaders.description: 'C# 与 Slang 声明必须约定一致的数据位置和访问方式。顶点输入布局描述顶点属性，着色器缓冲区声明描述参数与数组，资源句柄则标识着色器使用的资源。'
concepts.shaders.dispatch.description: '{dispatch} 指定执行多少个线程组。计算示例声明 {numthreads}，每组因此包含 16 × 16 个线程。将图像的宽和高分别除以 16 并向上取整，即可覆盖整张图像：17 × 19 的图像需要 2 × 2 组。着色器检查每个线程的坐标，并跳过位于图像范围以外的线程。'
concepts.shaders.dispatch.details: '{shaderDescThreadGroupSize} 提供声明的组大小，可用于计算传给 {dispatch} 的线程组数量。完整计算过程见 {computeShaderRendererCs}。分派完成后，访问输出图像时还须满足{link}中说明的要求。'
concepts.shaders.dispatch.details.link: '同步'
concepts.shaders.dispatch.title: '线程组'
concepts.shaders.layout.context: '{link}通过图像尺寸与两个纹理句柄展示了这种排列。各字段的起始位置由显式偏移量指定。以下声明使用 {systemRuntimeInteropServices} 和 {zenithNET} 命名空间：'
concepts.shaders.layout.context.link: '计算示例的 C# 常量'
concepts.shaders.layout.description: '对于顶点输入，{inputLayout} 描述各属性的格式、偏移量和语义，以及相邻顶点之间的步幅。三角形先存放 {float3} 位置，再存放 {float4} 颜色：颜色的字节偏移量为 12，每个顶点占 28 字节。{inputLayoutAdd} 根据元素格式计算这一紧密排列的布局。如果 C# 结构体包含填充，就需要在偏移量和步幅中计入这些空间。'
concepts.shaders.layout.details: '常量缓冲区存放着色器参数，结构化缓冲区存放指定类型的元素数组。它们的布局由 Slang 声明决定，不使用 {inputLayout}。C# 字段偏移量、元素大小和填充必须与编译后的着色器布局一致。即使某个 C# 类型是非托管类型，可以直接按字节复制，其内存排列也未必符合着色器要求；例如，顶点中紧密排列的 {float3}，在着色器缓冲区中可能需要不同的对齐方式。'
concepts.shaders.layout.guidance: '着色器参数除了普通数值，也可以包含资源句柄。句柄标识的是已有存储，因此将句柄复制到常量缓冲区并不会复制资源内容。'
concepts.shaders.layout.notes: '{computeShaderSlang} 中对应的声明为：'
concepts.shaders.layout.reference: '两个尺寸值占用前 8 字节，后面是两个各占 8 字节的句柄。C# 示例为整条记录预留 256 字节。其他记录的大小应根据各自字段以及所需的布局和对齐方式确定。'
concepts.shaders.layout.title: '数据布局'
concepts.shaders.matrices.description: '编译器采用行优先的矩阵存储方式，使同一行的元素连续排列。{link}在偏移量 0、64 和 128 处保存三个 {matrix4x4} 值，其{detail}按模型、视图和投影顺序执行 {mulVectorMatrix}。'
concepts.shaders.matrices.description.detail: '着色器'
concepts.shaders.matrices.description.link: '旋转立方体渲染器'
concepts.shaders.matrices.details: '存储顺序决定矩阵元素在内存中的排列，乘法顺序决定变换。C# 与 Slang 应采用相互匹配的约定。'
concepts.shaders.matrices.title: '矩阵约定'
concepts.shaders.title: '着色器数据与绑定'
concepts.synchronization.backends.description: 'DirectX 12 和 Vulkan 将纹理转换记录为布局与访问状态的变化。在 Zenith.NET 的 Metal 后端中，{transition} 没有对应的 GPU 操作。Metal 后端将命令组织为渲染与计算编码器，并在编码器结束时插入可见性屏障。同一编码器内存在依赖的操作，例如连续的计算分派，通过显式调用 {barrier} 协调。'
concepts.synchronization.backends.details: '{link}开始图形渲染通道时，会结束计算编码器，使计算输出对后续图形工作可见。连续两次计算分派仍位于同一编码器内，即使中间录制了纹理转换，也需要屏障来处理依赖。因此，可跨后端使用的命令序列既要考虑纹理布局，也要处理访问之间的依赖。'
concepts.synchronization.backends.details.link: '计算示例'
concepts.synchronization.backends.title: '后端行为'
concepts.synchronization.barriers.context: '选择包含相关访问、且受到当前队列支持的阶段。{barrierStagesAll} 涵盖所有受支持的阶段；若依赖只涉及其中一部分，可选择更小的范围。'
concepts.synchronization.barriers.description: '假设同一个命令缓冲区内有两次计算分派，第一次写入模拟数据，第二次读取这些数据。在两次分派之间设置屏障，让第二次分派读到已经完成的写入结果。对于存储缓冲区，这样即可安排访问顺序，无须进行纹理布局转换：'
concepts.synchronization.barriers.details: '第一个参数指定产生数据的阶段，第二个参数指定使用数据的阶段。二者共同描述两次分派之间所需的执行顺序和内存可见性。'
concepts.synchronization.barriers.guidance: '{link}在模拟步骤之间采用这一方式。每道屏障都位于产生数据的分派之后、使用数据的分派之前。'
concepts.synchronization.barriers.guidance.link: 'FluidTank 模拟'
concepts.synchronization.barriers.title: '管线屏障'
concepts.synchronization.dependencies.description: '逐个资源确认哪些访问涉及同一份数据。只要其中存在写入，就必须维持所需的先后顺序。两次读取本身没有冲突，但仍需满足纹理布局和呈现要求。CPU 更新数据或释放资源前，也须等待 GPU 完成对相应存储的使用。'
concepts.synchronization.dependencies.details: '应根据操作执行的位置选择机制：'
concepts.synchronization.dependencies.guidance: '一项工作可能同时需要多种同步机制。例如，纹理由另一队列生成时，除了提交依赖，还需为下一次使用设置正确的布局。这两项操作本身都不需要阻塞 CPU；只有 CPU 要访问或释放相关数据时，才需要在 CPU 端等待。'
concepts.synchronization.dependencies.table.cpuAccess.mechanism: '对相关的完成值调用 {wait}。'
concepts.synchronization.dependencies.table.cpuAccess.situation: 'CPU 访问或资源释放需要等待 GPU 完成'
concepts.synchronization.dependencies.table.crossQueue.mechanism: '将生产者的 {timelineValue} 传给消费者的 {submit}。'
concepts.synchronization.dependencies.table.crossQueue.situation: '一个队列使用另一个队列生成的数据'
concepts.synchronization.dependencies.table.headings.mechanism: '机制'
concepts.synchronization.dependencies.table.headings.situation: '情况'
concepts.synchronization.dependencies.table.layoutChange.mechanism: '调用 {commandBufferTransition}，指定先前布局与目标布局。'
concepts.synchronization.dependencies.table.layoutChange.situation: '纹理子资源更改其使用方式'
concepts.synchronization.dependencies.table.pipelineStages.mechanism: '调用 {commandBufferBarrier}，指定产生数据和使用数据的阶段。'
concepts.synchronization.dependencies.table.pipelineStages.situation: '命令流中存在依赖关系的 GPU 阶段'
concepts.synchronization.dependencies.title: '访问依赖'
concepts.synchronization.description: '同步确定多个操作访问共享数据的顺序，并确保后续操作能够读到所需结果。在写后读依赖中，写入方称为生产者，读取方称为消费者。屏障与纹理转换协调 GPU 访问；时间线连接不同提交，并让 CPU 等待 GPU 工作完成。'
concepts.synchronization.layouts.context: '现有内容可以丢弃时，可将先前布局设为 {undefined}，例如新建图像或即将完整清除的附件。若要保留内容以供加载、采样或累积，则应使用此前访问时的布局。'
concepts.synchronization.layouts.description: '纹理的用途标志声明允许的作用。{textureLayout} 描述命令序列中某一时刻对子资源的访问方式，子资源由 mip 级别和数组层确定。访问方式发生变化时，需要录制转换。例如，计算示例在 {storage} 布局中写入输出纹理，再为图形通道中的采样做准备：'
concepts.synchronization.layouts.details: '这里的 {outputTexture} 已声明 {sampledStorage} 用途，所选子资源处于 {storage} 布局。{default} 选择 mip 级别 0 和数组层 0，其他级别和层不受这次转换影响。'
concepts.synchronization.layouts.guidance: '调用 {transition} 时，提供子资源上一次使用的布局。应用程序在录制命令，以及在渲染阶段之间传递纹理时，负责跟踪这个状态。'
concepts.synchronization.layouts.title: '纹理布局'
concepts.synchronization.readback.description: '{isCompleted} 报告 GPU 的完成状态。通过命令录制的回读还需要一个步骤：将结果从内部回读存储复制到应用程序的目标内存。'
concepts.synchronization.readback.details: '{commandBufferDownload} 录制向内部回读存储复制数据的 GPU 命令。提交完成后，库在回收命令缓冲区时执行最后的 CPU 复制。对本次回读提交的完成值调用 {wait}，会等待 GPU 完成，并处理该队列已完成的缓冲区，从而完成这两个步骤。调用返回前，目标内存须保持已分配状态，托管内存须保持固定。'
concepts.synchronization.readback.guidance: '仅轮询 {isCompleted} 不会执行最后的 CPU 复制；等待其他队列，也不会回收回读队列中已完成的缓冲区。上传和回读在何时使用直接内存访问或暂存存储，见{link}。'
concepts.synchronization.readback.guidance.link: '资源管理'
concepts.synchronization.readback.title: '回读完成'
concepts.synchronization.reuse.description: '三角形教程在每帧完成后才复用数据。若要让帧重叠执行，应为每个尚未完成的帧准备独立的可变存储，并跟踪何时可以再次使用。修改数据前，须等待 GPU 完成对相关字节的访问；释放资源前，则须等待它的所有使用结束。'
concepts.synchronization.reuse.details: '调整大小与关闭程序遵循相同的顺序：先停止新的资源访问，等待已有访问结束，再替换或释放资源。调用 {swapChainResize} 或释放资源、上下文前，须先完成上述等待。三角形教程已经逐帧等待，因此可以在回调之间调整大小。'
concepts.synchronization.reuse.guidance: '{swapChainPresent} 在呈现后向图形队列发出信号并等待。因此，即使去掉显式的提交等待，三角形教程仍会在呈现时等待。独立提交到其他队列的工作，则需要单独跟踪其完成状态。'
concepts.synchronization.reuse.title: '资源复用'
concepts.synchronization.timelines.context: 'CPU 若要在消费者完成后读取结果、覆盖共享数据或释放资源，须先等待这次提交完成：'
concepts.synchronization.timelines.description: '时间线用递增值标识队列进度。{submit} 返回的 {timelineValue} 同时包含时间线和本次提交的值。不同时间线上的 {value} 数值不能直接比较。'
concepts.synchronization.timelines.details: '设 {producer} 和 {consumer} 是同一上下文中两个队列上已录制的命令缓冲区，后者使用前者写入的数据。提交时传入这项依赖：'
concepts.synchronization.timelines.guidance: '消费者所在的队列会先等待传入的完成值，再执行命令。CPU 无需调用 {producedWait}，可以继续处理其他工作。共享资源须保留到 {consumed} 完成，同时仍需录制消费者访问所要求的纹理转换。'
concepts.synchronization.timelines.notes: '{queueTimelineSignal} 返回的值同样可以通过 {wait} 等待，也可以作为另一个队列的依赖。{signal} 将完成点排在此前已提交的工作之后，GPU 完成这些工作后便会到达该点。'
concepts.synchronization.timelines.title: '时间线与队列依赖'
concepts.synchronization.title: '同步'
