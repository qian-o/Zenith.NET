### YamlMime:Resources
concepts.execution.context.description: "{graphicsContext} 代表一个后端设备，并提供其图形、计算和传输队列。同一工作负载所需的缓冲区、纹理、着色器和管线应通过同一个图形上下文创建。由另一个图形上下文创建的资源或句柄不能简单地绑定到该上下文的命令缓冲区中。"
concepts.execution.context.details: 根据平台和呈现表面选择后端。API 保持统一共享，但设备支持仍然至关重要。{capabilities} 公开了设备名称以及 {rayTracingSupported} 和 {meshShadingSupported} 标志。在创建可选工作负载之前，请像 {link} 和 {detail} 示例那样先检查对应的标志。这些标志并不构成格式、内存或平台限制的完整清单。
concepts.execution.context.details.detail: 网格着色（mesh shading）
concepts.execution.context.details.link: 光线追踪
concepts.execution.context.title: 图形上下文连接资源与队列
concepts.execution.description: Zenith.NET 应用程序创建 GPU 资源，录制使用这些资源的命令，并将这些命令提交给队列。在 GPU 执行提交的工作时，CPU 可以继续运行。即便录制命令的调用已返回，也必须保持资源有效，直到该工作完成。
concepts.execution.ownership.description: "在这里，所有权意味着释放资源的责任。C# 引用可以保持托管对象处于可达状态；但它无法阻止显式调用 {dispose} 销毁底层原生资源。同样，提交使用缓冲区的命令并不会将该缓冲区的所有权转移给队列。"
concepts.execution.ownership.details: "关闭时，停止提交新工作，等待涉及的每个队列完成对资源的最后一次使用，再释放应用程序创建的资源，最后释放图形上下文。释放上下文会释放它自身的队列和内部辅助对象；它不会等待所有应用程序工作，也不会释放应用程序创建的全部资源。"
concepts.execution.ownership.guidance: "渲染过程中也要遵循相同的生命周期规则。保留资源最后一次使用的完成值，以便判断何时可以覆盖其数据或替换资源。关于视图及其底层资源的生命周期，请参阅{link}。"
concepts.execution.ownership.guidance.link: 资源管理
concepts.execution.ownership.table.applicationResources.object: 应用程序创建的资源
concepts.execution.ownership.table.applicationResources.ownership: 应用程序在其最后一次 GPU 使用后释放它们。
