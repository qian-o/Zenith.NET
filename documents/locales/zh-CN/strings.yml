tutorial.execution.description: 从 {firstTriangle} 目录构建并运行：
tutorial.execution.details: 窗口中应显示一个三角形，在深色背景下具有红色的上顶点、绿色的右下角顶点和蓝色的左下角顶点。内部应显示这些颜色之间的平滑渐变。
tutorial.execution.guidance: 调整窗口大小。调整大小的回调会更新帧缓冲区尺寸并重设交换链的大小。渲染通道建立与该图像匹配的视口。由于顶点位置保持为归一化坐标，三角形保持窗口宽度和高度的相同比例；改变纵横比可能会拉伸其形状。保持对象的纵横比需要投影或视口策略，这超出了本次基础绘制的范围。
tutorial.execution.title: 运行、调整大小与关闭
tutorial.frame.commands.context: 在 {endRenderPass} 之后，第二次转换准备将图像用于呈现。{submit} 结束录制并提交命令缓冲区；{wait} 等待 GPU 完成该提交。然后 {present} 请求显示渲染出的图像。
tutorial.frame.commands.description: 渲染通道（render pass）将使用相同附件的绘制操作组合在一起。此处，颜色附件是交换链的输出纹理，即接收我们绘制内容的图像。{colorAttachmentClear} 创建一个描述，指示通道清除为给定的 RGBA 颜色，并在通道结束时保留结果。{beginRenderPass} 录制这些指令；GPU 在命令提交后执行清除。
tutorial.frame.commands.details: 方括号中包含我们唯一的颜色附件。{null} 参数表示没有深度／模板附件，该附件通常用于存储深度值和模板掩码以进行深度与模板测试。
tutorial.frame.commands.guidance: "{beginRenderPass} 设置覆盖附件的视口和裁剪区域。视口将渲染坐标映射到像素，裁剪区域限制可以写入的像素。这些默认设置覆盖整个输出纹理，这正是该三角形所需的。"
tutorial.frame.commands.title: 清除、提交与呈现
tutorial.frame.description: 首先用一种背景颜色填充图像。此操作称为清除（clear）。如果该颜色出现在窗口中，则说明原生呈现目标、命令提交和呈现路径工作正常。在添加几何体和着色器之前，此检查点可让您验证帧循环。
tutorial.frame.details: 渲染回调是 Silk.NET 在需要绘制帧时调用的代码。此回调不需要事件的流逝时间参数，因此将其命名为 {value}。在{emphasis}注册它：
tutorial.frame.details.emphasis: "{windowRun} 之前"
tutorial.frame.target.description: "{graphicsQueueCommandBuffer} 获取一个已开始录制的命令缓冲区。录制是为 GPU 描述工作；它不会立即执行该工作。"
tutorial.frame.target.details: 第一个 {transition} 为颜色附件访问准备输出纹理。{default} 选择 mip 级别 0 和数组层 0。我们使用 {undefined} 作为先前布局，因为我们将清除整个图像并丢弃其先前的内部数据。需要保留现有内容的通道必须改用其实际的先前布局。
tutorial.frame.target.guidance: 每帧都使用交换链当前的输出纹理。呈现操作可能会改变当前可用的图像，因此从较早帧保存的纹理并不是永久性的窗口渲染目标。
tutorial.frame.target.title: 准备输出纹理
tutorial.frame.title: 显示背景颜色
tutorial.geometry.data.description: 在{emphasis}添加此数组。接下来的资源创建步骤也按所示顺序位于该回调之前。
tutorial.geometry.data.description.emphasis: "{windowRender} 之前"
tutorial.geometry.data.details: 数组的每个元素创建一个 {vertex}。内部的两个 {new} 表达式创建其 {vector3} 位置和 {vector4} 颜色。各顶点描述了顶部、右下角和左下角。顶点着色器将提供第四个位置坐标 {w}。当 w 等于 1 时，x 和 y 直接描述归一化设备坐标：-1 和 +1 是图像边缘，0 是中心。这些坐标不依赖于窗口的像素尺寸。
tutorial.geometry.data.guidance: 每种颜色包含红、绿、蓝和阿尔法分量。三个顶点的阿尔法均为 1。所有三个位置的 z 坐标均为 0，将它们置于同一平面上。这些位置不需要相机或变换矩阵，因为它们已经直接描述了我们想要渲染的坐标。对于这个单一的平面三角形，我们还将禁用混合与深度测试，并省略深度缓冲区。
tutorial.geometry.data.title: 选择顶点坐标
tutorial.geometry.description: "顶点由一个位置以及绘制时使用的数据组成。我们的三角形有三个顶点，每个角一个。每个顶点都包含位置和颜色。GPU 会对颜色进行插值，计算三角形内部各处的中间值。"
tutorial.geometry.format.description: 在{emphasis}追加此声明：
tutorial.geometry.format.description.emphasis: "{programCs} 的末尾、清理语句之后"
tutorial.geometry.format.details: "{file} 将此类型限制在 {programCs} 内部，构造函数初始化其位置和颜色字段。{layoutKindSequential} 保持字段按照声明顺序排列。{position} 包含三个 32 位浮点数，{color} 包含四个。在该结构体中，位置从字节 0 开始，颜色从字节 12 开始，完整的顶点占用 28 个字节。我们将向图形管线描述这完全相同的布局。"
tutorial.geometry.format.title: 定义顶点
tutorial.geometry.title: 向 GPU 提供三个顶点
tutorial.geometry.upload.context: "{fixed} 防止垃圾回收器在使用数组地址时移动该数组。对于此 CPU 可写缓冲区，{upload} 在返回之前会映射、复制并取消映射内存，因此之后无需保持数组固定。缓冲区必须在整个渲染过程中保持有效，并且上传只需进行一次，因为顶点不会发生变化。"
tutorial.geometry.upload.description: 托管数组是 CPU 数据。{buffer} 为 GPU 提供存储空间，以便其可以从中读取顶点。在数组之后，添加：
tutorial.geometry.upload.details: 总大小为 {sizeofVertexVerticesLength}：每个顶点 28 字节，三个顶点，总共 84 字节。{bufferUsagesVertex} 允许顶点输入访问。{cpuWriteOnly} 允许 CPU 直接初始化这个小缓冲区。描述符的步幅（stride）记录了元素大小；我们稍后创建的输入布局将告知顶点获取机制如何读取各个属性。
tutorial.geometry.upload.guidance: 创建缓冲区并不会填充数据。{upload} 将数组复制到该分配中，从目标字节偏移量 0 开始。其源描述提供了指针和要复制的字节数。
tutorial.geometry.upload.notes: 在 {programCs} 底部的清理代码中，紧邻 {swapChainDispose} 之前添加 {vertexBufferDispose}。对于更大的静态几何体，{link}解释了何时应选择仅 GPU 内存并通过传输进行上传。
tutorial.geometry.upload.notes.link: 资源管理
tutorial.geometry.upload.title: 分配缓冲区并上传数组
tutorial.input.description: 顶点字节和着色器均已就绪。接下来描述 GPU 应该如何读取每个顶点。属性是一个单独的值，例如位置或颜色。输入布局为每个属性赋予格式和字节偏移量；步幅（stride）给出从一个顶点到下一个顶点的字节距离。在创建着色器之后添加此初始化块：
tutorial.input.details: "{inputLayoutAdd} 在当前步幅处追加一个元素，并将该步幅增加该元素的大小。它不会检查 C# 结构体。在此处它生成了 CPU 内存与着色器输入之间的以下契约："
tutorial.input.guidance: "更改 C# 字段顺序或填充而不更新此描述会导致 GPU 读取错误的字节。默认的 {semanticIndex} 为 0，匹配 {pOSITION0} 和 {cOLOR0}。这两个元素属于同一个缓冲区，因此管线将包含一个输入布局，并且我们将该缓冲区绑定到槽 0。"
