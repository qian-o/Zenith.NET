tutorial.context.guidance: 分支逻辑在 Windows 上选择 DirectX 12，在 macOS 上选择 Metal，在 Linux 上选择 Vulkan。接下来的渲染代码均使用共享的 Zenith.NET API。我们在开发期间请求启用验证层，并打印通过 {validationMessage} 报告的消息。诊断信息取决于后端以及机器上可用的验证组件。
tutorial.context.title: 创建图形上下文
tutorial.description: 构建一个 .NET 控制台应用程序，打开窗口并绘制一个具有平滑颜色渐变的三角形。您将学习顶点数据、着色器和管线状态是如何协同工作的，然后录制并提交生成该图像的命令。
tutorial.details: 请按顺序完成各个部分。您将首先打开一个空窗口，然后显示背景颜色，最后绘制三角形。在添加下一部分之前，每个检查点都会确认应用程序当前部分的正常运行。初始化只执行一次；每次调用渲染回调时都会录制新的一帧。
tutorial.draw.context: "{draw} 的参数如下："
tutorial.draw.description: 在 {windowRender} 回调中，在 {beginRenderPass} 和 {endRenderPass} 之间，将 {addTheTriangleDrawCommandsHereLater} 替换为以下三个命令：
tutorial.draw.details: "{setPipeline} 选择我们刚才创建的着色器和状态。在绑定顶点数据之前设置它：后端使用管线的输入布局来解释该绑定。"
tutorial.draw.guidance: "{setVertexBufferVertexBuffer} 将从字节偏移量 0 开始的缓冲区绑定到输入槽 0。该槽对应于 {inputLayouts} 中的单个条目。它不会再次复制或上传数据。"
tutorial.draw.notes: 此时命令仍仅处于已录制状态。位于渲染回调末尾的 {submitWait} 和 {present} 调用会执行工作并显示其结果。清除操作仍然是必要的，因为三角形只覆盖图像的一部分；背景在每帧中也必须接收到已定义的颜色。
