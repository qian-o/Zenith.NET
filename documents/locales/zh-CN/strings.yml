concepts.resources.allocation.context: "除非需要自行实现内存分配器，否则先使用图形上下文创建的资源。使用堆时，应先等待所有使用这些资源的 GPU 工作完成，再释放堆中放置的资源，最后释放堆本身。"
concepts.resources.allocation.description: "{heap} 提供内存，供您在指定的字节偏移量处放置资源。应用程序负责选择这些偏移量，并跟踪哪些区域正在使用。"
concepts.resources.allocation.details: "放置资源前，使用准确的缓冲区或纹理描述调用 {contextGetSizeAndAlignment}。所选偏移量必须是返回的对齐值的整数倍，预留空间必须满足返回的大小，资源也必须位于堆的总字节范围内。仍在使用的分配区域不得重叠。纹理存储可能包含后端特有的填充和对齐，因此不能用像素数量乘以每像素字节数来计算分配大小。"
concepts.resources.allocation.guidance: "对于放置在堆中的缓冲区，其内存驻留设置应与堆一致。这里介绍的常规 GPU 纹理应使用仅 GPU 堆。大小和对齐是放置资源的要求，并不保证所有后端都能将任意资源放入任意堆。"
concepts.resources.allocation.title: 在需要分配控制时将资源放置在堆中
concepts.resources.bufferUsages.table.constant.role: 通过常量缓冲区绑定读取的着色器参数。
