concepts.resources.bufferUsages.table.storageReadOnly.role: "通过只读着色器绑定访问的缓冲区数据。"
concepts.resources.bufferUsages.table.storageReadWrite.role: "通过读写着色器绑定访问的缓冲区数据。"
