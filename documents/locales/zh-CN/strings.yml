tutorial.requirements.title: '前置条件'
tutorial.resize.context: '再次构建并运行程序。调整窗口大小后，背景应继续填满整个窗口：每次开始新的渲染通道时，视口和裁剪区域都会按调整后的附件尺寸设置。保留渲染回调，后面将在这个通道内绘制三角形。'
tutorial.resize.description: '帧缓冲区尺寸变化时，交换链也要随之调整。在渲染回调之后、{windowRun} 之前注册 {framebufferResize} 回调：'
tutorial.resize.details: '这里监听的是以像素为单位的{link}，而非窗口逻辑尺寸的变化。窗口最小化时，帧缓冲区的宽度或高度可能变为零；此时，尺寸变化回调保留现有交换链，不执行调整。渲染回调也会在任一尺寸为零时直接返回，直到帧缓冲区恢复有效尺寸后再继续绘制。'
tutorial.resize.details.link: '帧缓冲区大小变化'
tutorial.resize.guidance: '渲染回调会等待当前帧的提交完成，再调用 {present}。因此，尺寸变化回调替换交换链图像时，此前帧的工作已经结束。关于完成状态与资源生命周期的要求，详见{link}。'
tutorial.resize.guidance.link: '同步'
tutorial.resize.title: '窗口尺寸变化'
tutorial.shaders.compilation.context: '{appContextBaseDirectory} 让程序从输出目录加载已复制的着色器。即使从其他工作目录启动程序，查找文件的位置也不会改变。'
tutorial.shaders.compilation.description: '将 {triangleSlang} 的文件属性{emphasis}设为{detail}，构建时便会将着色器复制到可执行文件所在目录。'
tutorial.shaders.compilation.description.detail: '如果较新则复制'
tutorial.shaders.compilation.description.emphasis: '复制到输出目录'
tutorial.shaders.compilation.details: '返回 {programCs}，在顶点上传之后、渲染回调之前添加着色器初始化：'
tutorial.shaders.compilation.guidance: '{zenithCompiler} 为 {contextGraphicsApi} 指定的后端编译源码，{createShader} 再根据编译后的描述创建着色器对象。入口点名称 {vSMain} 和 {fSMain} 分别选中 Slang 文件中定义的两个函数。'
tutorial.shaders.compilation.title: '编译着色器'
tutorial.shaders.context: '{fSInput} 连接两个着色器阶段。顶点着色器将裁剪空间位置写入 {sVPOSITION}，GPU 据此判断三角形的可见部分。{cOLOR0} 字段传递顶点颜色，颜色经过三角形内部的插值后到达片元着色器。两个阶段必须使用一致的颜色类型与语义。'
tutorial.shaders.description: '着色器是在 GPU 上运行的程序。顶点着色器确定每个顶点的位置，片元着色器则确定图像中被覆盖位置的颜色。我们将两个阶段写在同一个 Slang 文件中，并分别定义入口点，也就是各阶段开始执行的函数。'
tutorial.shaders.details: '创建 {triangleSlang}，先定义输入与输出结构：'
tutorial.shaders.fragment.description: '在同一文件中追加片元入口点：'
tutorial.shaders.fragment.details: '光栅化确定三角形在图像中的覆盖范围，并在这些位置生成片元。每个片元的颜色由三个顶点的颜色插值得到。{fSMain} 返回这个颜色，{sVTARGET} 则将结果送到第一个颜色附件。'
tutorial.shaders.fragment.title: '片元着色'
tutorial.shaders.guidance: '{vSInput} 定义顶点着色器输入。{pOSITION0} 和 {cOLOR0} 按语义标识属性，C# 字段名称本身不建立这一映射。'
tutorial.shaders.title: '着色器阶段'
tutorial.shaders.vertex.description: '在 {triangleSlang} 中追加顶点入口点：'
tutorial.shaders.vertex.details: 'GPU 为每个输入顶点调用这一入口点，补充齐次坐标 {w} 并传递颜色。顶点处理结束后，位置要除以 w。本例 w 为 1，x、y、z 保持不变，可直接解释为归一化设备坐标。'
tutorial.shaders.vertex.title: '顶点着色'
tutorial.surface.description: '在{emphasis}指定原生呈现目标：'
tutorial.surface.description.emphasis: '{windowCenter} 之后、{windowRun} 之前'
tutorial.surface.details: '帧缓冲区是窗口用于显示的像素图像。{surface} 描述原生呈现目标及其尺寸，{framebufferSize} 给出以像素为单位的大小。启用显示缩放时，这个大小可能与窗口的逻辑尺寸不同。'
tutorial.surface.guidance: '呈现目标提供后端所需的原生句柄：Windows 使用 Win32 窗口，Linux 使用 X11 显示与窗口，macOS 使用已连接的 Metal 图层。'
tutorial.surface.title: '原生呈现目标'
tutorial.swapChain.context: '交换链同时依赖上下文与窗口。将 {programCs} 末尾的 {windowDispose} 替换为以下释放顺序：'
tutorial.swapChain.description: '紧接呈现目标描述，创建交换链：'
tutorial.swapChain.details: '{swapChain} 管理窗口呈现的图像。{drawable} 以图像资源 {texture} 的形式提供当前图像。渲染后，{present} 请求显示该图像，并推进到下一个输出纹理。'
tutorial.swapChain.guidance: '{b8G8R8A8UNorm} 按蓝、绿、红和 alpha 顺序保存四个 8 位通道。{uNorm} 将整数 0–255 对应到 0–1。着色器仍输出逻辑 RGBA 值，格式只规定存储表示；管线通过 {swapChainDescFormat} 匹配附件。'
tutorial.swapChain.title: '交换链'
tutorial.title: '第一个三角形'
tutorial.troubleshooting.description: '结合控制台诊断与三个检查点定位失败阶段：'
tutorial.troubleshooting.details: '{link}与{detail}可用于核对顶点数据、输入布局和绘制操作。该示例将窗口与提交逻辑放入共享宿主，本教程则保留在 {programCs} 中。{context}进一步介绍索引绘制、变换与深度测试。'
tutorial.troubleshooting.details.context: '旋转立方体'
tutorial.troubleshooting.details.detail: 'Slang 着色器'
tutorial.troubleshooting.details.link: '示例渲染器'
tutorial.troubleshooting.table.backend.check: '检查所选后端是否受设备和已安装的图形驱动程序支持。'
tutorial.troubleshooting.table.backend.symptom: '后端创建失败'
tutorial.troubleshooting.table.drawing.check: '检查上传大小、输入布局、管线选择以及渲染通道内绘制命令的位置。'
tutorial.troubleshooting.table.drawing.symptom: '背景出现但三角形未出现'
tutorial.troubleshooting.table.headings.check: '检查项'
tutorial.troubleshooting.table.headings.symptom: '现象'
tutorial.troubleshooting.table.input.check: '检查步幅是否为 28 字节，位置和颜色是否分别从偏移 0 和 12 字节开始。'
tutorial.troubleshooting.table.input.symptom: '顶点位置或颜色异常'
tutorial.troubleshooting.table.shaders.check: '检查复制的 {triangleSlang}、入口点拼写以及编译器报告的诊断信息。'
tutorial.troubleshooting.table.shaders.symptom: '背景色正常显示，但着色器加载失败'
tutorial.troubleshooting.table.window.check: '确认 .NET 项目能够构建成功，并且仅包含窗口的步骤可以在桌面会话中运行。在 Linux 上，检查 X11 或 XWayland 是否可用。'
tutorial.troubleshooting.table.window.symptom: '窗口未打开'
tutorial.troubleshooting.title: '问题排查'
tutorial.window.description: '将 {cocoaHelperCs} 下载到项目中。该辅助类负责将 Metal 图层连接到 macOS 窗口。'
tutorial.window.details: '将自动生成的 {programCs} 内容替换为以下代码。它使用顶级语句，按书写顺序执行，不需要显式编写 {main} 方法。后续各节会指出新代码应放在哪里：'
tutorial.window.guidance: '{graphicsAPINone} 将图形上下文的创建交给 Zenith.NET。{initialize} 创建原生窗口，使窗口系统的句柄可供使用；{center} 把窗口放到屏幕中央。{run} 持续处理事件，直到窗口关闭，随后执行 {dispose} 释放窗口。'
tutorial.window.notes: '构建并运行程序，检查窗口能否打开、移动、调整大小和关闭。此时还没有提交渲染命令，窗口内容尚未定义。关闭窗口后再继续。'
tutorial.window.title: '创建窗口'
