### YamlMime:Resources
concepts.execution.context.description: '{graphicsContext} 通过所选图形 API 连接应用程序与 GPU 设备，并提供图形、计算、传输和呈现队列。配合使用的资源必须属于同一上下文；缓冲区、纹理、着色器、管线及其句柄不能跨上下文绑定。'
concepts.execution.context.details: '{capabilities} 提供设备名称与支持的功能。创建光线追踪或网格着色所需的资源前，分别通过 {rayTracingSupported} 和 {meshShadingSupported} 检查支持情况。{link}与{detail}示例展示了初始化时的检查方式。'
concepts.execution.context.details.detail: '网格着色'
concepts.execution.context.details.link: '光线追踪'
concepts.execution.context.title: '图形上下文'
concepts.execution.description: 'GPU 工作从 CPU 端开始：应用程序创建资源，录制使用这些资源的命令，再将命令提交到队列。提交之后，CPU 可以继续处理其他任务，同时由 GPU 执行命令。相关资源必须保留到执行结束。'
concepts.execution.ownership.description: '所有权决定由谁释放对象，GPU 完成状态决定何时可以释放。即使仍保留对象的 C# 引用，调用 {dispose} 也会释放其原生资源。提交命令不会将资源所有权转交给队列。'
concepts.execution.ownership.details: '关闭程序时，先停止提交新工作，并等待所有相关队列完成最后一次资源访问；随后释放应用程序资源，最后释放上下文及其队列。'
concepts.execution.ownership.guidance: '渲染期间，若准备覆盖数据或替换资源，应跟踪仍在使用它们的工作。等待这些访问完成后，再修改数据或释放存储。视图与底层资源如何遵循这一生命周期规则，见{link}。'
concepts.execution.ownership.guidance.link: '资源管理'
concepts.execution.ownership.table.applicationResources.disposalResponsibility: '最后一次 GPU 使用完成后，由应用程序释放。'
concepts.execution.ownership.table.applicationResources.object: '应用程序创建的资源'
concepts.execution.ownership.table.commandBuffers.disposalResponsibility: '由队列管理和回收。'
concepts.execution.ownership.table.commandBuffers.object: '借用的命令缓冲区'
concepts.execution.ownership.table.headings.disposalResponsibility: '释放责任'
concepts.execution.ownership.table.headings.object: '对象'
concepts.execution.ownership.table.queues.disposalResponsibility: '由上下文和队列管理。'
concepts.execution.ownership.table.queues.object: '图形上下文的队列及其时间线'
concepts.execution.ownership.table.swapChainDrawable.disposalResponsibility: '由交换链管理。'
concepts.execution.ownership.title: '所有权与生命周期'
concepts.execution.pipelines.description: '图形管线规定绘制所用的着色器、顶点输入布局、图元组装方式、附件格式和渲染状态。绑定顶点、索引或常量数据之前，须先选择管线；管线声明的附件格式与采样数也必须与渲染通道一致。'
concepts.execution.pipelines.details: '计算管线选择分派所执行的着色器入口点。在图形渲染通道之外，先绑定管线及其常量，再执行分派。'
concepts.execution.pipelines.guidance: '{link}给出了完整的图形命令顺序。{detail}则先执行计算分派，再通过图形通道显示结果。'
concepts.execution.pipelines.guidance.detail: '计算示例'
concepts.execution.pipelines.guidance.link: '三角形的渲染回调'
concepts.execution.pipelines.title: '管线状态'
concepts.execution.queues.description: '一帧同时包含绘制、计算和复制时，通常从 {graphicsQueue} 开始。将有依赖的操作放在同一队列，有助于明确执行顺序。'
concepts.execution.queues.details: '使用其他队列可以让独立的工作负载重叠执行。当一个队列使用另一队列产出的数据时，应在两次提交之间建立显式依赖。'
concepts.execution.queues.guidance: '即使位于同一队列，有依赖的操作也可能需要屏障或纹理转换，才能让后续访问读到此前写入的结果。这种内存依赖与提交顺序不同，具体表达方式见{link}。'
concepts.execution.queues.guidance.link: '同步'
concepts.execution.queues.table.computeQueue.supportedWork: '计算分派以及兼容的传输工作，不含图形渲染通道。'
concepts.execution.queues.table.graphicsQueue.supportedWork: '渲染通道、绘制、计算与传输操作。'
concepts.execution.queues.table.headings.queue: '队列'
concepts.execution.queues.table.headings.supportedWork: '支持的工作'
concepts.execution.queues.table.presentQueue.supportedWork: '支持与图形队列相同的操作，在 {swapChainDescIsPresentQueueEnabled} 为 {true} 时用于写入输出纹理并呈现。'
concepts.execution.queues.table.transferQueue.supportedWork: '上传、回读与复制工作，不含绘制或计算分派。'
concepts.execution.queues.title: '队列选择'
concepts.execution.recording.context: '队列会回收已完成的命令缓冲区以供复用。每次录制时，通过 {queueCommandBuffer} 获取缓冲区，同一时间只由一个线程录制，并且只提交一次。提交后，将缓冲区交由队列管理，不再修改、重复提交或自行释放。'
concepts.execution.recording.description: '{queueCommandBuffer} 返回的 {commandBuffer} 已处于录制状态。录制完操作及其依赖后，调用一次 {submit}。提交会结束录制，并返回标识该队列完成点的 {timelineValue}。'
concepts.execution.recording.details: '三角形教程将一帧录制到 {commandBuffer} 后，按如下方式提交并等待完成：'
concepts.execution.recording.guidance: '{submit} 将录制的命令提交执行，{wait} 则阻塞当前线程直至本次提交完成，使每一帧在下一帧开始前执行完毕。'
concepts.execution.recording.title: '录制与提交'
concepts.execution.title: '执行模型'
concepts.platforms.description: '呈现既可由应用程序直接管理，也可交给 UI 渲染控件托管，这决定了由谁获取每帧的输出纹理、提交命令并呈现结果。'
concepts.platforms.frame.context: '处理程序返回前须结束开启的渲染通道，且不得自行提交或释放传入的命令缓冲区与输出纹理。若期间更改了输出纹理布局，返回前需恢复为 {colorAttachment}。'
concepts.platforms.frame.description: '各控件实现 {iZenithView} 接口。应用程序设置 {graphicsContext}，在 {updateRequested} 中更新场景，并在 {renderRequested} 中通过传入的 {renderEventArgs} 录制命令。'
concepts.platforms.frame.details: '每帧，控件获取命令缓冲区和输出纹理，将输出纹理转换为 {colorAttachment}，依次调用更新与渲染处理程序，随后提交命令并完成呈现。'
concepts.platforms.frame.guidance: '先在文件中添加 {usingZenithNET}。假定名为 {view} 的 {iZenithView} 实例已初始化并设置图形上下文，可注册以下处理程序清除其输出纹理：'
concepts.platforms.frame.notes: '初始转换使用 {undefined}，允许丢弃先前图像的内容。因此，每帧都应重新绘制或清除整张图像。需要累积或缓存的渲染结果，可保存在应用程序拥有的纹理中，再将该纹理绘制到控件的输出纹理上。'
concepts.platforms.frame.reference: '创建配套附件时，使用渲染事件传入的输出纹理的 {descFormat}、{descWidth}、{descHeight} 和 {descSampleCount}。该纹理给出了渲染目标的实际尺寸，不应根据控件的布局尺寸或显示缩放比例推算。'
concepts.platforms.frame.title: '通过 UI 控件渲染'
concepts.platforms.lifecycle.description: '交换链使用以像素计量的帧缓冲区宽度和高度。启用显示缩放时，这些值可能不同于窗口的逻辑尺寸。任一尺寸为零时，暂停渲染和交换链尺寸调整。每帧重新获取 {swapChainDrawable}：这张纹理由交换链管理，可能在呈现或调整大小后被替换。'
concepts.platforms.lifecycle.details: '帧缓冲区尺寸变化时，先等待使用旧图像的 GPU 工作完成，再调用 {swapChainResize}。若原生呈现目标本身发生更换，同样先等待访问结束，再将新的呈现目标描述传给 {swapChainRefresh}。关闭程序时，先释放交换链，再销毁原生呈现目标。'
concepts.platforms.lifecycle.guidance: '应用程序的深度纹理或离屏纹理若随窗口尺寸变化，就需要在调整大小时重建，并更新包含其句柄的常量。只要附件格式与采样数仍然匹配，管线就可以复用。{link}展示了如何调整纹理尺寸并保留管线。'
concepts.platforms.lifecycle.guidance.link: '旋转立方体渲染器'
concepts.platforms.lifecycle.title: '交换链尺寸与生命周期'
concepts.platforms.ownership.description: '应用程序拥有所分配的上下文及其渲染资源，控件拥有自身的呈现资源。{graphicsContext} 变更时，控件会重建其呈现资源；应用程序也需为新上下文重建缓冲区、纹理和管线。'
concepts.platforms.ownership.details: '替换渲染资源前，先停止视图的帧循环，并等待使用这些资源的 GPU 工作完成，再释放旧资源。只有当所有视图都已释放该上下文对应的呈现资源，且应用程序通过它创建的资源也已全部释放后，才能释放上下文。'
concepts.platforms.ownership.guidance: '控件通过自身的 UI 调度器运行帧处理程序。处理程序应专注于场景数据更新和命令录制，其中耗时的 CPU 工作也会延迟界面响应。'
concepts.platforms.ownership.title: '应用程序与控件的责任'
concepts.platforms.presentQueue.context: '{swapChainPresent} 仅等待 {swapChainQueue}。复用或释放渲染资源前需单独跟踪渲染提交的完成状态；调用 {swapChainResize} 或释放交换链前应先停止呈现。'
concepts.platforms.presentQueue.description: '交换链默认在 {graphicsQueue} 上呈现。将 {swapChainDescIsPresentQueueEnabled} 设为 {true} 会改用 {presentQueue}，使呈现与 {graphicsQueue} 上的后续工作解耦，便于独立线程按自身节奏调度渲染帧与生成帧。'
concepts.platforms.presentQueue.details: '{swapChainQueue} 返回交换链的呈现队列。对 {swapChainDrawable} 的所有写入都应录制到该队列中，提交时传入所依赖的渲染完成值，等待写入完成后再执行呈现：'
concepts.platforms.presentQueue.guidance: '其中，{rendered} 是产出 {frame} 并将其置于 {copySrc} 布局的提交完成值，{extent} 与输出纹理尺寸一致。等待此次复制提交即可同时覆盖所依赖的渲染与复制操作，而不会被后续提交到图形队列的工作阻塞。'
concepts.platforms.presentQueue.title: '使用呈现队列'
concepts.platforms.surface.description: '{link}使用 Silk.NET 创建窗口并处理事件。Zenith.NET 通过 {surface} 描述获取原生窗口句柄与尺寸，再据此创建 {swapChain}。操作系统窗口仍由应用程序负责管理。'
concepts.platforms.surface.description.link: '三角形教程'
concepts.platforms.surface.details: '原生句柄取决于图形 API 和窗口系统。常见组合如下：'
concepts.platforms.surface.guidance: '{appCs} 中的示例宿主支持 Windows、macOS 和 X11。Linux 窗口提供 Xlib 句柄，因此在 Wayland 会话中需要 XWayland。原生 Wayland 应用程序则通过 {surfaceWayland} 提供显示与表面句柄。'
concepts.platforms.surface.table.android.graphicsApiAndPlatform: 'Android 上的 Vulkan。'
concepts.platforms.surface.table.apple.graphicsApiAndPlatform: 'Apple 平台上的 Metal。'
