tutorial.troubleshooting.description: 首先查看控制台中的任何错误，然后利用前面的检查点确定失败的阶段：
tutorial.troubleshooting.details: 使用{link}和{detail}来对比顶点数据、输入布局和绘制操作。该示例将窗口和提交逻辑放在共享宿主中；本教程将应用程序流程保留在 {programCs} 中。继续阅读{context}以学习索引绘制、变换和深度测试。
