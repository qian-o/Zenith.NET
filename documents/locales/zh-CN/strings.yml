concepts.platforms.surface.table.headings.handles: '宿主提供的句柄'
concepts.platforms.surface.table.wayland.graphicsApiAndPlatform: 'Vulkan，使用原生 Wayland 窗口。'
concepts.platforms.surface.table.wayland.handles: 'Wayland 显示与表面'
concepts.platforms.surface.table.win32.graphicsApiAndPlatform: 'Windows 上的 DirectX 12 或 Vulkan。'
concepts.platforms.surface.table.xlib.graphicsApiAndPlatform: 'Linux 上的 Vulkan，使用 X11 或 XWayland。'
concepts.platforms.surface.table.xlib.handles: 'X11 显示与窗口'
concepts.platforms.surface.title: '原生呈现目标'
concepts.platforms.title: '平台集成'
concepts.platforms.verticalSync.description: '垂直同步将呈现与显示器刷新周期对齐，以防止画面撕裂。{swapChainDescIsVerticalSyncEnabled} 默认为 {false}，允许 {swapChainPresent} 不等待下次刷新直接呈现；将其设为 {true} 可同步呈现并使 {swapChainPresent} 按显示器刷新率推进。'
concepts.platforms.verticalSync.details: '该设置在创建交换链时固定。如需更改，应像调用 {swapChainResize} 前一样，先等待访问输出纹理的 GPU 工作完成，再释放并重建交换链。'
concepts.platforms.verticalSync.title: '垂直同步'
concepts.resources.allocation.context: '放置在堆中的资源在整个生命周期内都依赖堆的存储。最后一次 GPU 使用完成后，应先释放资源，再释放堆。'
concepts.resources.allocation.description: '应用程序需要自行管理内存分配时，可以使用 {heap}。堆为资源提供存储，应用程序选择明确的字节偏移量来放置资源，并记录各区域的占用情况。'
concepts.resources.allocation.details: '对每个资源，使用创建时所需的缓冲区或纹理描述调用 {contextGetSizeAndAlignment}。按返回的大小预留空间，起始偏移量须为返回对齐值的整数倍，且整个区域位于堆内，不与其他仍有效的分配重叠。纹理分配可能含有填充，因此不能仅根据像素数量和每像素字节数计算分配大小。'
concepts.resources.allocation.guidance: '放置在堆中的缓冲区必须使用与堆相同的驻留设置。纹理存储使用 GPU 专用堆。'
concepts.resources.allocation.title: '堆分配'
