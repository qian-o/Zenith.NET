tutorial.context.description: '{graphicsContext} 让应用程序通过所选图形 API 使用 GPU，并提供创建渲染资源的方法。'
tutorial.context.details: '在{emphasis}插入上下文初始化代码：'
tutorial.context.details.emphasis: 'using 指令之后、{iWindowWindow} 之前'
tutorial.context.guidance: '各分支为所用图形 API 请求启用验证。处理程序将通过 {validationMessage} 报告的诊断消息输出到控制台。'
tutorial.context.imports: '在 {programCs} 顶部添加以下 using 指令：'
tutorial.context.title: '图形上下文'
tutorial.description: '本教程从一个空的 .NET 控制台项目开始，逐步完成窗口创建，并在窗口中绘制一个彩色三角形。'
tutorial.details: '本教程有三个检查点：空窗口、单色背景和彩色三角形。每完成一个检查点，先运行程序确认结果，再继续添加下一部分。'
tutorial.draw.context: '{draw} 的参数如下：'
tutorial.draw.description: '在 {windowRender} 回调中，用以下命令替换 {addTheTriangleDrawCommandsHereLater}，位置保持在 {beginRenderPass} 与 {endRenderPass} 之间：'
tutorial.draw.details: '{setPipeline} 选择着色器和渲染状态。管线的输入布局决定如何读取顶点数据，因此必须先设置管线，再绑定顶点缓冲区。'
tutorial.draw.guidance: '{setVertexBuffer} 从缓冲区的字节偏移 0 开始，将已上传的顶点数据绑定到输入槽 0，对应 {inputLayouts} 中唯一的条目。'
tutorial.draw.notes: '保留通道开始时的清除操作，让三角形以外的区域也有确定的背景色。'
tutorial.draw.table.firstInstance.meaning: '实例编号从零开始。'
tutorial.draw.table.firstVertex.meaning: '从缓冲区中的第一个顶点开始。'
tutorial.draw.table.headings.argument: '参数'
tutorial.draw.table.headings.meaning: '含义'
tutorial.draw.table.headings.value: '值'
tutorial.draw.table.instanceCount.meaning: '绘制一个三角形实例。'
tutorial.draw.table.vertexCount.meaning: '读取三个顶点。'
tutorial.draw.title: '绘制命令'
tutorial.execution.context: '关闭窗口后，{run} 返回，程序继续执行清理代码。渲染回调已等待每帧提交的工作完成，因此现在可以释放这些命令使用的资源。{windowRun} 之后完整的清理代码如下：'
tutorial.execution.description: '构建并运行 {firstTriangle} 项目。'
tutorial.execution.details: '窗口中应出现一个三角形：上方为红色，右下为绿色，左下为蓝色，背景为深色。三个顶点的颜色经过插值，在三角形内部形成平滑过渡。'
tutorial.execution.guidance: '调整窗口大小时，图像的像素尺寸会改变，顶点坐标保持不变。视口将这些坐标映射到新的宽度和高度，因此改变窗口的宽高比会拉伸三角形。'
tutorial.execution.notes: '先释放交换链，再销毁其原生窗口；先释放应用程序资源，再释放上下文。已提交的命令缓冲区由队列回收，输出纹理由交换链管理，二者都不需要单独调用 {dispose}。'
tutorial.execution.title: '运行应用程序'
tutorial.frame.commands.context: '{endRenderPass} 之后的第二次转换使输出纹理进入可呈现的布局。{submit} 结束录制并提交命令缓冲区，{wait} 阻塞至本次提交完成，随后 {present} 请求显示渲染结果。'
tutorial.frame.commands.description: '渲染通道将写入同一组附件的绘制操作组织在一起。本通道用交换链的输出纹理接收颜色输出。{colorAttachmentClear} 指定以 RGBA 颜色初始化该附件，并在通道结束时保留内容。{beginRenderPass} 按这些设置录制通道的开始命令。'
tutorial.frame.commands.details: '集合中有一个颜色附件。{null} 表示本通道不使用深度／模板附件。'
tutorial.frame.commands.guidance: '{beginRenderPass} 默认让视口和裁剪区域覆盖整个附件。视口把渲染坐标映射为像素位置，裁剪区域则限制绘制可写入的像素范围。'
tutorial.frame.commands.title: '清除、提交与呈现'
tutorial.frame.description: '先用一种背景色填满窗口，这称为清除。若颜色正常显示，说明命令提交和画面呈现已生效。接下来再加入三角形的顶点和着色器。'
tutorial.frame.details: 'Silk.NET 在需要绘制一帧时调用渲染回调。在{emphasis}注册回调：'
tutorial.frame.details.emphasis: '{windowRun} 之前'
tutorial.frame.target.description: '命令队列接收已录制的工作，交由 GPU 执行。{graphicsQueueCommandBuffer} 从图形队列取得一个已开始录制的命令缓冲区。录制描述 GPU 要执行的工作，提交后才开始执行。'
tutorial.frame.target.details: '纹理布局描述操作对纹理的访问方式。第一次 {transition} 将输出纹理准备为颜色附件。这里的 {default} 选择 mip 级别 0 和数组层 0，也就是输出纹理的基础子资源。由于这个通道会清除整张图像，可以指定 {undefined}，允许丢弃原有内容。'
tutorial.frame.target.guidance: '呈现后可能换用另一张图像，因此每一帧都要获取当前的输出纹理。'
tutorial.frame.target.title: '准备输出纹理'
tutorial.frame.title: '第一帧'
tutorial.geometry.data.description: '在{emphasis}添加顶点数组。后续资源初始化也放在该回调之前，顺序如下。'
tutorial.geometry.data.description.emphasis: '{windowRender} 之前'
tutorial.geometry.data.details: '三个位置分别构成三角形的上角、右下角和左下角。本例中，x、y 在图像内的范围都是 -1 到 +1：0 对应中心，x 的正方向向右，y 的正方向向上。'
tutorial.geometry.data.guidance: '每个颜色包含红、绿、蓝和 alpha 分量，alpha 设为 1。三个顶点的 z 坐标均为 0，位于同一平面。'
tutorial.geometry.data.title: '顶点位置与颜色'
tutorial.geometry.description: '三角形的每个顶点都有位置和颜色。GPU 根据三个位置确定三角形的形状，再对顶点颜色插值，得到内部各处的颜色。'
tutorial.geometry.format.description: '在{emphasis}追加顶点声明：'
tutorial.geometry.format.description.emphasis: '{programCs} 的末尾、清理语句之后'
tutorial.geometry.format.details: '{layoutKindSequential} 保留字段的声明顺序。{position} 包含三个 32 位浮点数，字节偏移量为 0；{color} 包含四个，字节偏移量为 12。因此，每个顶点占 28 字节。输入布局将描述这一排列，让 GPU 正确读取各字段。'
tutorial.geometry.format.imports: '在 {programCs} 顶部添加以下 using 指令，以使用向量类型和结构体布局特性：'
tutorial.geometry.format.title: '顶点表示'
tutorial.geometry.title: '顶点数据'
tutorial.geometry.upload.context: '{fixed} 防止垃圾回收器在地址使用期间移动数组。对于这个 CPU 可写缓冲区，{upload} 会映射内存、复制数据，并在返回前解除映射，因此只需在调用期间固定数组。顶点数据在初始化时上传一次即可；缓冲区则必须保留到渲染结束。'
tutorial.geometry.upload.description: '将顶点存入 {buffer}，供 GPU 在绘制时读取。在顶点数组之后紧接着添加分配与上传代码：'
tutorial.geometry.upload.details: '分配大小为 {sizeofVertexVerticesLength}（3 个 28 字节顶点，共 84 字节），描述中的步幅记录单个元素的大小。{bufferUsagesVertex} 声明顶点缓冲区用途，{cpuWriteOnly} 允许 CPU 直接写入。'
tutorial.geometry.upload.guidance: '分配不会初始化缓冲区内容。{upload} 使用数据描述中的源指针和字节数，将数组复制到目标字节偏移量 0。'
tutorial.geometry.upload.imports: '在 {programCs} 顶部的 using 指令中添加 {bufferAlias}，以区分 Zenith.NET 的缓冲区类型与 {systemBuffer}。'
tutorial.geometry.upload.notes: '在 {programCs} 末尾的清理代码中，紧接在 {swapChainDispose} 之前加入 {vertexBufferDispose}。'
tutorial.geometry.upload.title: '缓冲区分配与上传'
tutorial.input.description: '输入布局描述每个顶点属性的格式、语义和字节偏移量，以及相邻顶点之间的字节步幅。在创建着色器之后添加以下代码：'
tutorial.input.details: '{inputLayoutAdd} 将每个属性追加在前一个属性之后，并将其大小计入步幅，使这两个字段构成 28 字节的总步幅：'
tutorial.input.guidance: '{semanticIndex} 默认为 0，与着色器中的 {pOSITION0} 和 {cOLOR0} 对应。位置与颜色存放在同一个顶点缓冲区中，因此管线只需在槽 0 使用一个输入布局。如果 C# 结构体的字段顺序或填充发生变化，也要相应调整此布局。'
tutorial.input.table.headings.byteOffset: '字节偏移量'
tutorial.input.table.headings.cField: 'C# 字段'
tutorial.input.table.headings.format: '格式'
tutorial.input.table.headings.shaderInput: '着色器输入'
tutorial.input.table.vertexColor.format: '{float4}（16 字节）'
tutorial.input.table.vertexPosition.format: '{float3}（12 字节）'
tutorial.input.title: '顶点输入布局'
tutorial.pipeline.context: '管线创建完成后即可释放着色器对象。渲染期间保留管线，并在清理代码中将 {pipelineDispose} 放在 {vertexBufferDispose} 之前。'
tutorial.pipeline.description: '{graphicsPipeline} 将着色器阶段、顶点输入布局、图元拓扑、附件格式和渲染状态组合在一起。在输入布局之后创建管线：'
tutorial.pipeline.details: '{triangleList} 将每组连续的三个顶点组装成一个三角形。颜色格式取自 {swapChainDescFormat} 以匹配渲染通道附件，{count1} 指定每像素单次采样。'
tutorial.pipeline.guidance: '{cullNone} 关闭面剔除，使三角形不受顶点绕序影响。通道没有深度附件，因此用 {depthNone} 关闭深度测试与深度写入；{opaque} 关闭混合，使片元颜色直接替换背景。'
tutorial.pipeline.title: '图形管线'
tutorial.presentation.title: '图形上下文与呈现'
tutorial.project.context: '在项目构建设置中启用{emphasis}（{allowUnsafeBlocks}）。窗口辅助类中的原生调用和顶点上传需要不安全代码。'
tutorial.project.context.emphasis: '允许不安全代码'
tutorial.project.description: '创建名为 {firstTriangle} 的 C# 控制台项目，目标框架设为 .NET 10。'
tutorial.project.details: '为项目添加以下 NuGet 包：'
tutorial.project.guidance: '{zenithNET} 提供共用的图形与计算 API，三个图形 API 包分别实现它。{zenithNETCompiler} 为所选 API 编译 Slang 着色器。'
tutorial.project.title: '项目设置'
tutorial.requirements.description: '需要 {emphasis} 和基础 C# 知识。所用 GPU 与驱动程序还须具备下表中的图形能力：'
tutorial.requirements.description.emphasis: '.NET 10 SDK'
tutorial.requirements.guidance: 'Zenith.NET 渲染到应用程序提供的原生呈现目标。Silk.NET.Windowing 创建窗口并处理事件。'
tutorial.requirements.table.headings.graphicsSupport: '图形能力'
tutorial.requirements.table.headings.platform: '平台'
tutorial.requirements.table.linux.graphicsSupport: 'Vulkan 1.4 与 VK_EXT_descriptor_heap'
tutorial.requirements.table.linux.platform: 'Linux（X11 或 XWayland）'
tutorial.requirements.table.macOS.graphicsSupport: 'Metal 4'
tutorial.requirements.table.macOS.platform: 'macOS'
tutorial.requirements.table.windows.graphicsSupport: 'DirectX 12 与 Shader Model 6.6'
tutorial.requirements.table.windows.platform: 'Windows'
tutorial.requirements.title: '前置条件'
tutorial.resize.context: '再次构建并运行程序。调整窗口大小后，背景应继续填满整个窗口。保留渲染回调，后面将在这个通道内绘制三角形。'
tutorial.resize.description: '帧缓冲区尺寸变化时，交换链也要随之调整。在渲染回调之后、{windowRun} 之前注册 {framebufferResize} 回调：'
tutorial.resize.details: '这里监听的是以像素为单位的{link}，而非窗口逻辑尺寸的变化。窗口最小化时，帧缓冲区的宽度或高度可能变为零；此时，尺寸变化回调保留现有交换链，不执行调整。渲染回调也会在任一尺寸为零时直接返回，直到帧缓冲区恢复有效尺寸后再继续绘制。'
tutorial.resize.details.link: '帧缓冲区大小变化'
tutorial.resize.guidance: '渲染回调会等待当前帧的提交完成，再调用 {present}。因此，尺寸变化回调替换交换链图像时，此前帧的工作已经结束。关于完成状态与资源生命周期的要求，详见{link}。'
tutorial.resize.guidance.link: '同步'
tutorial.resize.title: '窗口尺寸变化'
tutorial.shaders.compilation.context: '{appContextBaseDirectory} 让程序从输出目录加载已复制的着色器。即使从其他工作目录启动程序，查找文件的位置也不会改变。'
tutorial.shaders.compilation.description: '将 {triangleSlang} 的文件属性{emphasis}设为{detail}，构建时便会将着色器复制到可执行文件所在目录。'
tutorial.shaders.compilation.description.detail: '如果较新则复制'
tutorial.shaders.compilation.description.emphasis: '复制到输出目录'
tutorial.shaders.compilation.details: '返回 {programCs}，在顶点上传之后、渲染回调之前添加着色器初始化：'
tutorial.shaders.compilation.guidance: '{zenithCompiler} 按 {contextGraphicsApi} 指定的图形 API 编译源码，{createShader} 再根据编译后的描述创建着色器对象。入口点名称 {vSMain} 和 {fSMain} 分别选中 Slang 文件中定义的两个函数。'
tutorial.shaders.compilation.title: '编译着色器'
tutorial.shaders.context: '{fSInput} 连接两个着色器阶段。顶点着色器将裁剪空间位置写入 {sVPOSITION}，GPU 据此判断三角形的可见部分。{cOLOR0} 字段传递顶点颜色，颜色经过三角形内部的插值后到达片元着色器。两个阶段必须使用一致的颜色类型与语义。'
tutorial.shaders.description: '顶点着色器输出每个顶点的裁剪空间位置，片元着色器输出所覆盖像素的颜色。两个阶段可写在同一个 Slang 文件中，并各自指定入口函数。'
tutorial.shaders.details: '在项目根目录中创建 {triangleSlang}，定义以下输入与输出结构：'
tutorial.shaders.fragment.description: '在同一文件中追加片元入口点：'
tutorial.shaders.fragment.details: '光栅化确定三角形在图像中的覆盖范围，并在这些位置生成片元。每个片元的颜色由三个顶点的颜色插值得到。{fSMain} 返回这个颜色，{sVTARGET} 则将结果送到第一个颜色附件。'
tutorial.shaders.fragment.title: '片元着色'
tutorial.shaders.guidance: '{vSInput} 定义顶点着色器输入。{pOSITION0} 和 {cOLOR0} 按语义标识属性，C# 字段名称本身不建立这一映射。'
tutorial.shaders.title: '着色器阶段'
tutorial.shaders.vertex.description: '在 {triangleSlang} 中追加顶点入口点：'
tutorial.shaders.vertex.details: '该函数对每个顶点执行一次，设置 {w} 构成四维裁剪空间坐标，并原样传递顶点颜色。随后按 w 执行透视除法时，归一化设备坐标中的 x、y、z 保持不变。'
tutorial.shaders.vertex.title: '顶点着色'
tutorial.surface.description: '将 {cocoaHelperCs} 下载到项目中。该辅助类负责将 Metal 图层连接到 macOS 窗口。'
tutorial.surface.details: '在{emphasis}指定原生呈现目标：'
tutorial.surface.details.emphasis: '{windowCenter} 之后、{windowRun} 之前'
tutorial.surface.guidance: '帧缓冲区是窗口的像素图像，启用显示缩放时其 {framebufferSize} 可能不同于窗口的逻辑尺寸。{surface} 将像素尺寸与所选图形 API 所需的原生句柄封装在一起：Windows 使用 Win32 窗口，macOS 使用已连接的 Metal 图层，Linux 使用 X11 显示与窗口。'
tutorial.surface.title: '原生呈现目标'
tutorial.swapChain.context: '交换链同时依赖上下文与窗口。将 {programCs} 末尾的 {windowDispose} 替换为以下释放顺序：'
tutorial.swapChain.description: '紧接呈现目标描述，创建交换链：'
tutorial.swapChain.details: '{swapChain} 管理窗口的呈现图像。{drawable} 将当前后备缓冲区表示为 {texture}，渲染完成后调用 {present} 显示图像并切换到下一帧的输出纹理。'
tutorial.swapChain.guidance: '{b8G8R8A8UNorm} 按蓝、绿、红和 alpha 顺序保存四个 8 位通道。{uNorm} 将整数 0–255 对应到 0–1。着色器仍输出逻辑 RGBA 值，格式只规定存储表示。'
tutorial.swapChain.title: '交换链'
tutorial.title: '第一个三角形'
tutorial.window.description: '将 {programCs} 的内容替换为以下代码：'
tutorial.window.details: '{graphicsAPINone} 告诉 Silk.NET 不创建图形上下文；应用程序稍后会创建 Zenith.NET 上下文。{initialize} 创建原生窗口，使窗口系统的句柄可供使用；{center} 把窗口放到屏幕中央。{run} 持续处理事件，直到窗口关闭，随后执行 {dispose} 释放窗口。'
tutorial.window.guidance: '构建并运行程序，检查窗口能否打开、移动、调整大小和关闭。此时还没有提交渲染命令，窗口内容尚未定义。关闭窗口后再继续。'
tutorial.window.title: '创建窗口'
