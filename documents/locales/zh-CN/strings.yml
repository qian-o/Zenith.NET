tutorial.window.context: "{usingZenithTutorials} 导入辅助类的命名空间。每个 C# 文件使用各自的常规 using 指令，因此互操作导入在两个文件中都是必需的。别名 {buffer} 指向 Zenith.NET 的缓冲区类型，以将其与 {systemBuffer} 区分开来。"
tutorial.window.description: 将 {cocoaHelperCs} 添加到项目中，保持其命名空间不变。在该文件顶部、其命名空间声明之前添加 {interopUsing}。该辅助类在 macOS 上为窗口附加 Metal 图层；其他平台分支不会调用它。
tutorial.window.details: 将生成的 {programCs} 替换为以下代码。它使用顶级语句，按顺序执行而无需显式的 {main} 方法。后续部分将告诉您在该文件的何处添加代码：
tutorial.window.guidance: "{graphicsAPINone} 要求 Silk.NET 创建一个没有自身图形上下文的窗口。我们将使用 Zenith.NET 创建该上下文。{initialize} 创建原生窗口并使其句柄可用。句柄是由窗口系统提供的标识符。{center} 使窗口居中，{run} 处理事件直到窗口关闭。然后执行进入 {dispose}，释放窗口。"
tutorial.window.notes: 运行 {dotnetRun}。应该会打开一个空窗口，并对移动、调整大小和关闭做出响应。由于我们尚未提交任何渲染命令，其内容尚未定义。在继续之前将其关闭。
tutorial.window.title: 打开窗口
