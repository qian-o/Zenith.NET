tutorial.lifecycle.description: 完成的应用程序重复执行以下序列：
tutorial.lifecycle.details: 关闭窗口将从 {run} 返回。每个渲染的帧都已经等待其 GPU 工作完成，因此我们现在可以安全释放它所使用的资源。{windowRun} 之后的清理代码应为：
tutorial.lifecycle.guidance: "在销毁原生窗口前释放交换链，并在释放所有资源后释放图形上下文。队列拥有并回收提交的命令缓冲区，交换链拥有其输出纹理。因此，本应用程序不需要单独对这些命令缓冲区或输出纹理调用 {dispose}。"
tutorial.lifecycle.title: 跟踪一帧的生命周期
tutorial.pipeline.behavior: 在输入布局之后，添加：
tutorial.pipeline.context: "{cullNone} 填充三角形，并且不因面的朝向而将其剔除。顶点顺序决定面的环绕方向；关闭剔除可以避免因这个顺序而使第一个三角形不可见。"
tutorial.pipeline.description: 我们现在拥有顶点数据、输入布局和两个着色器。{graphicsPipeline} 将它们连接起来，并指定 GPU 如何将顶点组装为图元并将结果写入附件。
tutorial.pipeline.details: 管线将可编程着色器阶段与固定功能设置相结合，后者控制诸如三角形组装、面剔除和混合等 GPU 操作。对于这个三角形，选择以下设置：
tutorial.pipeline.guidance: 颜色格式取自 {swapChainDescFormat}。它必须与渲染通道使用的图像匹配。{count1} 表示每像素一个采样点。
tutorial.pipeline.item: "{triangleList} 将每组连续的三个顶点组装成一个三角形。我们将提供三个顶点并绘制一次，因此不需要索引缓冲区。"
tutorial.pipeline.notes: "{depthNone} 禁用深度测试和写入，与没有深度附件的通道相匹配。"
tutorial.pipeline.reference: "{opaque} 禁用混合，因此片元着色器的颜色会替换三角形内部的背景。"
tutorial.pipeline.title: 连接着色器与顶点布局
tutorial.pipeline.usage: 着色器对象在创建管线后即可释放，正如示例渲染器中所做的那样。对于使用它进行绘制的每一帧，保持管线本身处于有效状态。在清理代码中将 {pipelineDispose} 添加到 {vertexBufferDispose} 之前。管线创建是渲染回调之前的最后一步初始化。
tutorial.pipeline.validation: 管线描述声明了附件配置；它不会创建另一个图像。{inputLayouts} 具有一个条目，因为位置和颜色一起存储在一个缓冲区中。
tutorial.presentation.title: 将 GPU 连接到窗口
tutorial.project.context: 在项目的构建设置中启用{emphasis}（{allowUnsafeBlocks}）。我们将使用它将顶点数据传递给 GPU，并用于窗口辅助类的原生调用。
tutorial.project.context.emphasis: 允许不安全代码
tutorial.project.description: 创建项目并进入其目录：
tutorial.project.details: 安装软件包：
tutorial.project.guidance: "{zenithNET} 提供共享的渲染 API。三个后端包允许同一个程序选择适合其平台的实现。{zenithNETCompiler} 负责为该实现编译 Slang 着色器（我们稍后将编写的小型 GPU 程序）。Silk.NET 提供窗口和事件循环。"
tutorial.project.title: 创建控制台项目
tutorial.requirements.context: 您可以从一个空项目开始跟随本页操作。{link}及其{detail}可作为此处使用的渲染和窗口 API 的参考。
tutorial.requirements.context.detail: 共享宿主
tutorial.requirements.context.link: Hello Triangle 示例
tutorial.requirements.description: "您需要 {emphasis}、代码编辑器或 IDE，以及配备了 Zenith.NET 后端支持的 GPU 和驱动程序的桌面设备。具备基本的 C# 知识即可；图形概念会在首次使用时予以介绍。这是一个普通的 {net10} 控制台项目。后端负责将 Zenith.NET 操作转换为对图形 API（例如 DirectX 12、Metal 或 Vulkan）的调用。应用程序在启动时选择其中之一："
tutorial.requirements.description.emphasis: .NET 10 SDK
tutorial.requirements.details: 对于此处使用的窗口路径，Linux 需要与 X11 兼容的窗口会话。对于本三角形而言，不需要可选的光线追踪和网格着色（mesh shading）特性。
tutorial.requirements.guidance: Zenith.NET 渲染到由应用程序提供的表面中。Silk.NET.Windowing 将创建桌面窗口并处理其事件。在 macOS 上，呈现目标是 Metal 图层（{cAMetalLayerCs}）；教程中的窗口辅助类会为我们附加该图层。
