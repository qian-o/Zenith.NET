concepts.execution.ownership.title: 将所有权与 GPU 完成区分开来
concepts.execution.pipelines.description: 图形管线结合了着色器、顶点输入布局、将顶点组装为图元的规则、附件格式和渲染状态。在绑定顶点、索引或常量数据以及发出绘制命令之前设置它。其附件格式和采样数必须与渲染通道的附件匹配。
concepts.execution.pipelines.details: 计算管线为分派提供着色器入口点，以启动 GPU 线程组。在分派之前设置它及其常量。计算分派属于图形渲染通道之外。更改管线意味着后续命令解释其输入的方式发生变化；在使用所选管线之前，请先绑定该管线所需的数据。
concepts.execution.pipelines.guidance: "{link}展示了完整的图形执行序列。{detail}录制了一次分派，随后通过图形通道显示其结果。"
concepts.execution.pipelines.guidance.detail: 计算示例
concepts.execution.pipelines.guidance.link: 三角形的渲染回调
concepts.execution.pipelines.title: 管线决定了命令如何解释数据
concepts.execution.queues.description: 当一个帧结合了绘制、计算和复制时，请从 {graphicsQueue} 开始。将存在依赖关系的工作保持在单个队列上可以让其执行顺序更容易理清。
concepts.execution.queues.details: 队列接收成批的命令以供执行。独立的队列并不一定对应独立的硬件引擎，因此它们的工作可能无法同时并行运行。当工作负载可以从重叠执行中获益时使用其他队列，并在一个队列消费另一个队列的结果时添加显式依赖关系。
concepts.execution.queues.guidance: 当后续命令依赖于先前的写入时，应用程序还必须确保这些写入对后续命令可见可用。将两个命令缓冲区提交到同一个队列并不会自动建立所有此类依赖。命令可以使用不同的 GPU 阶段，后续访问可能需要屏障或纹理布局转换。{link}解释了提交顺序与资源可见性之间的区别。
concepts.execution.queues.guidance.link: 同步
concepts.execution.queues.table.computeQueue.workToRecord: 计算分派以及兼容的传输工作，不含图形渲染通道。
concepts.execution.queues.table.graphicsQueue.workToRecord: 渲染通道与绘制，以及帧所使用的计算和传输操作。
concepts.execution.queues.table.headings.queue: 队列
concepts.execution.queues.table.headings.workToRecord: 录制的工作
concepts.execution.queues.table.transferQueue.workToRecord: 上传、回读与复制工作，不含绘制或计算分派。
concepts.execution.queues.title: 根据所要执行的工作选择队列
concepts.execution.recording.context: 队列会轮询完成状态并回收已完成的命令缓冲区。为每次新录制调用 {queueCommandBuffer}；它可能会返回回收的实例。请勿释放借用的命令缓冲区、请勿重复提交两次，也不要在提交后继续向其中录制。一次仅从一个线程录制给定的命令缓冲区；队列的内部锁无法保护对命令缓冲区的并发修改。
concepts.execution.recording.description: "{queueCommandBuffer} 返回一个已开始录制的 {commandBuffer}。录制命令及其依赖关系，然后调用一次 {submit}。提交操作结束录制，并返回一个标识该队列上完成点的 {timelineValue}。"
concepts.execution.recording.details: 例如，在将一帧录制到 {commandBuffer} 之后，三角形示例提交它并等待完成：
concepts.execution.recording.guidance: "{submit} 调度工作；{wait} 阻止 CPU 继续向下执行，直到该提交操作完成。录制绘制、结束渲染通道与提交命令缓冲区是互不相同的独立操作。录制绘制和结束渲染通道均不会等待 GPU。"
concepts.execution.recording.title: 录制命令并不等于执行命令
concepts.execution.title: 执行模型
concepts.platforms.description: 选择您的应用程序是自行拥有原生窗口和帧循环，还是使用 UI 渲染控件。该选择决定了谁来获取输出纹理、提交命令并呈现结果。输出纹理是用作当前帧输出的纹理。离屏图形和计算工作不需要窗口或交换链。
concepts.platforms.frame.context: 在该通道内部添加您的管线绑定和绘制命令。在返回之前结束通道。不要独立提交所提供的命令缓冲区或自行呈现，也不要释放命令缓冲区或输出纹理。如果您的处理程序在其他布局中使用了输出纹理，请将其恢复为 {colorAttachment} 以供控件进行最终转换。
concepts.platforms.frame.description: 这些集成实现了 {iZenithView}。应用程序提供其 {graphicsContext}，在 {updateRequested} 中更新场景数据，并在 {renderRequested} 中使用 {renderEventArgs} 录制渲染命令。
concepts.platforms.frame.details: "控件负责每帧的完整流程：获取输出纹理和命令缓冲区，将输出纹理转换为 {colorAttachment}，调用处理程序，然后执行该框架所需的提交和呈现步骤。"
concepts.platforms.frame.guidance: 对于名为 {view} 且已分配上下文的已初始化 {iZenithView}，此处理程序录制一个完整的清除通道。它需要 {usingZenithNET}：
concepts.platforms.frame.notes: 控件在每帧开始时均从 {undefined} 转换而来，因此应用程序不能依赖于输出纹理先前内容的保留。每帧都要清除或渲染所需的图像。将持久累积或缓存的渲染内容保存在应用程序自有的纹理中，然后通过视图显示该纹理。
concepts.platforms.frame.reference: "{zenithViewHelperDrawableFormat} 提供集成的默认颜色格式。在匹配附件格式、采样数和尺寸时，请检查实际事件中的输出纹理。"
concepts.platforms.frame.title: 录制到 UI 控件提供的帧中
concepts.platforms.integration.context: WinForms、WPF 和 Windows 的 WinUI 路径需要 Windows。MAUI 应用程序需要其目标平台的工作负载，并且必须使用 {useZenithView} 注册控件处理程序；参见 {extensionsCs}。框架支持和后端支持都必须满足。
concepts.platforms.integration.description: 控件共享事件接口，但呈现方式并非全都相同：
concepts.platforms.integration.details: 位图回读在 UI 显示之前将渲染的像素复制到 CPU 内存中。共享纹理互操作避免了这种回读，但仍可能需要 GPU 复制和同步。因此，共享的 {renderRequested} 接口并不意味着相同的呈现开销或原生互操作要求。
concepts.platforms.integration.guidance: 使用对应于应用程序框架的包；例如：
