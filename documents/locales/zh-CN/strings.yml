concepts.resources.textureUsages.table.sampled.role: '通过采样纹理绑定读取的纹理数据。'
concepts.resources.textureUsages.table.storage.role: '通过存储纹理绑定供着色器读取或写入的纹理数据。'
concepts.resources.textureUsages.table.transferDst.role: 'GPU 复制操作的目标图像存储。'
concepts.resources.textureUsages.table.transferSrc.role: 'GPU 复制操作的源图像数据。'
concepts.resources.textureUsages.title: '纹理用途'
concepts.resources.title: '资源管理'
concepts.resources.transfers.context: '录制纹理传输命令不会自动处理布局转换。上传要求 {copyDst} 布局，回读要求 {copySrc} 布局。应在复制之前录制向相应布局的转换，并在复制之后转换到下一次使用所需的布局。'
concepts.resources.transfers.description: '上传将 CPU 数据复制到 GPU 资源，回读则将资源数据复制到 CPU 内存。缓冲区和纹理上的这些方法会在传输完成后返回：'
concepts.resources.transfers.details: '调用这些方法前，先处理与其他队列访问之间的冲突。方法内部的等待只覆盖其自身的传输，不会建立与其他队列的依赖。直接通过映射内存复制时，则完全由调用方负责等待存在冲突的 GPU 访问。'
concepts.resources.transfers.guidance: '要将传输与其他 GPU 工作一同提交，可通过 {commandBufferUpload} 或 {commandBufferDownload} 录制。{commandBufferUpload} 会在返回前读取源内存，因此源指针只需在调用期间保持有效；{commandBufferDownload} 则在对本次提交的完成值调用 {wait} 时写入目标内存，在 {wait} 返回前须保持目标内存已分配且托管内存已固定。'
concepts.resources.transfers.notes: '纹理传输中的行步幅是 CPU 数据相邻两行之间的字节距离；切片步幅则是相邻深度切片之间的字节距离。传输操作根据这些值，在 CPU 数据与纹理的 GPU 存储之间复制内容。'
concepts.resources.transfers.table.bufferDownload.transfer: '对于 {cpuReadOnly}，直接从映射内存复制；否则向传输队列提交回读，并等待完成。'
concepts.resources.transfers.table.bufferUpload.transfer: '对于 {cpuWriteOnly}，直接复制到映射内存；否则向传输队列提交上传，并等待完成。'
concepts.resources.transfers.table.headings.method: '方法'
concepts.resources.transfers.table.headings.transfer: '传输行为'
concepts.resources.transfers.table.textureTransfers.transfer: '将复制及其纹理转换提交到图形队列，并等待完成。操作结束后，所选子资源处于指定的最终布局。'
concepts.resources.transfers.title: '即时传输与命令缓冲区传输'
concepts.resources.usages.description: '{bufferUsages} 和 {textureUsages} 是用于声明资源用途的标志枚举，分别设置在 {bufferDescUsages} 和 {textureDescUsages} 中。资源需要承担多种用途时，可通过 {bitwiseOr} 组合相应成员。'
concepts.resources.usages.title: '资源用途'
concepts.resources.views.description: '{bufferView} 选择缓冲区内的字节范围与元素步幅；{textureView} 选择兼容的纹理类型、像素格式和子资源范围。两者都直接引用已有存储，并沿用创建该存储时声明的用途。'
concepts.resources.views.details: '资源自身的句柄提供默认视图。需要其他区域或兼容的解释方式时，再创建独立视图。视图及其底层资源都必须保留到 GPU 使用结束；仅持有资源句柄不能使任一对象保持存活。替换其中任一对象时，还须更新包含旧{link}的常量。'
concepts.resources.views.details.link: '资源句柄'
concepts.resources.views.title: '视图与底层资源'
concepts.shaders.binding.context: '计算示例将 {inputTextureSampledHandle} 写入 {input}，将 {outputTextureStorageHandle} 写入 {output}。在 Slang 中，{descriptorHandle} 的类型参数规定了着色器访问资源的方式：'
concepts.shaders.binding.description: '{setConstantBuffer} 选择已有缓冲区及字节偏移量，当前管线从该位置读取常量。着色器使用这些参数前，先将数据上传到相应存储。如果此前提交的 GPU 工作仍在读取同一批字节，须等待该工作完成后再更新。'
concepts.shaders.binding.details: '准备好命令缓冲区、计算管线、已填入数据的常量缓冲区和线程组数量后，按以下顺序录制分派。常量缓冲区的绑定作用于当前管线，因此必须先选择管线：'
concepts.shaders.binding.guidance: '常量缓冲区需要声明 {bufferUsagesConstant} 用途。如果多条常量记录共用缓冲区，每条记录的起始偏移量必须满足绑定对齐要求；这与记录内部的字段布局是两项独立要求。'
concepts.shaders.binding.notes: '{resourceHandle} 是仅在创建资源的上下文中有效的不透明句柄。'
concepts.shaders.binding.reference: '保留资源及用于获取句柄的视图，直到着色器完成最后一次访问。替换纹理或视图后，应更新仍含旧句柄的常量。相关所有权规则见{link}。'
concepts.shaders.binding.reference.link: '资源管理'
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: '读取着色器类型 {t} 的结构化元素'
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: '读写着色器类型 {t} 的结构化元素'
concepts.shaders.binding.table.headings.access: '预期访问'
concepts.shaders.binding.table.headings.cHandle: 'C# 句柄'
concepts.shaders.binding.table.headings.slangFieldType: 'Slang 字段类型'
concepts.shaders.binding.table.samplerHandle.access: '纹理采样状态'
concepts.shaders.binding.table.textureSampledHandle.access: '纹理读取'
concepts.shaders.binding.table.textureStorageHandle.access: '存储纹理的读写'
concepts.shaders.binding.title: '常量缓冲区与资源句柄'
concepts.shaders.compilation.description: '{zenithCompiler} 编译 Slang 入口点并返回 {shaderDesc}。上下文的 {graphicsApi} 决定输出格式：DirectX 12 对应 {dxil}，Metal 对应 {metallib}，Vulkan 对应 {spirv}。'
concepts.shaders.compilation.details: '创建名为 {context} 的图形上下文后，可以编译已复制到可执行文件所在目录的三角形着色器：'
concepts.shaders.compilation.guidance: '入口点名称 {vSMain} 必须与着色器文件中的函数声明一致。在初始化阶段编译着色器并创建管线，渲染期间复用管线。管线创建完成后即可释放着色器对象，具体见{link}。'
concepts.shaders.compilation.guidance.link: '第一个三角形'
concepts.shaders.compilation.title: '着色器编译'
concepts.shaders.description: 'C# 与 Slang 声明必须约定一致的数据位置和访问方式。顶点输入布局描述顶点属性，着色器缓冲区声明描述参数与数组，资源句柄则标识着色器使用的资源。'
concepts.shaders.dispatch.description: '{dispatch} 指定执行多少个线程组。计算示例声明 {numthreads}，每组因此包含 16 × 16 个线程。将图像的宽和高分别除以 16 并向上取整，即可覆盖整张图像：17 × 19 的图像需要 2 × 2 组。着色器检查每个线程的坐标，并跳过位于图像范围以外的线程。'
concepts.shaders.dispatch.details: '{shaderDescThreadGroupSize} 提供声明的组大小，可用于计算传给 {dispatch} 的线程组数量。完整计算过程见 {computeShaderRendererCs}。分派完成后，访问输出图像时还须满足{link}中说明的要求。'
concepts.shaders.dispatch.details.link: '同步'
concepts.shaders.dispatch.title: '线程组'
concepts.shaders.layout.context: '{link}通过图像尺寸与两个纹理句柄展示了这种排列。各字段的起始位置由显式偏移量指定。以下声明使用 {systemRuntimeInteropServices} 和 {zenithNET} 命名空间：'
concepts.shaders.layout.context.link: '计算示例的 C# 常量'
concepts.shaders.layout.description: '对于顶点输入，{inputLayout} 定义各属性的格式、语义和字节偏移量，以及顶点步幅。三角形中 {float3} 位置在前、{float4} 颜色在后，颜色起始于字节偏移 12，顶点步幅为 28 字节。{inputLayoutAdd} 会按元素格式计算紧密排列的布局；若 C# 结构体含有填充字节，则需显式指定偏移量与步幅。'
concepts.shaders.layout.details: '常量缓冲区存放着色器参数，结构化缓冲区存放指定类型的元素数组。它们的布局由 Slang 声明决定，不使用 {inputLayout}。C# 字段偏移量、元素大小和填充必须与编译后的着色器布局一致。即使某个 C# 类型是非托管类型，可以直接按字节复制，其内存排列也未必符合着色器要求；例如，顶点中紧密排列的 {float3}，在着色器缓冲区中可能需要不同的对齐方式。'
concepts.shaders.layout.guidance: '着色器参数除了普通数值，也可以包含资源句柄。句柄标识的是已有存储，因此将句柄复制到常量缓冲区并不会复制资源内容。'
concepts.shaders.layout.notes: '{computeShaderSlang} 中对应的声明为：'
concepts.shaders.layout.reference: 'C# 字段占用前 24 字节：两个尺寸值合计 8 字节，每个句柄各占 8 字节。整条记录预留 256 字节，其余字节用于填充。其他参数块的字段偏移量也必须与着色器布局匹配。如果多条记录共用缓冲区，还需在记录之间留出足够的填充，以满足绑定对齐要求。'
concepts.shaders.layout.title: '数据布局'
concepts.shaders.matrices.description: '编译器采用行优先的矩阵存储方式，使同一行的元素连续排列。{link}在偏移量 0、64 和 128 处保存三个 {matrix4x4} 值，其{detail}按模型、视图和投影顺序执行 {mulVectorMatrix}。'
concepts.shaders.matrices.description.detail: '着色器'
concepts.shaders.matrices.description.link: '旋转立方体渲染器'
concepts.shaders.matrices.details: '存储顺序决定矩阵元素在内存中的排列，乘法顺序决定变换。C# 与 Slang 应采用相互匹配的约定。'
concepts.shaders.matrices.title: '矩阵约定'
concepts.shaders.title: '着色器数据与绑定'
concepts.synchronization.barriers.context: '选择包含相关访问、且受到当前队列支持的阶段。{barrierStagesAll} 涵盖所有受支持的阶段；若依赖只涉及其中一部分，可选择更小的范围。'
concepts.synchronization.barriers.description: '假设同一个命令缓冲区内有两次计算分派，第一次写入模拟数据，第二次读取这些数据。在两次分派之间设置屏障，让第二次分派读到已经完成的写入结果。对于存储缓冲区，这样即可安排访问顺序，无须进行纹理布局转换：'
concepts.synchronization.barriers.details: '第一个参数指定产生数据的阶段，第二个参数指定使用数据的阶段。二者共同描述两次分派之间所需的执行顺序和内存可见性。'
concepts.synchronization.barriers.guidance: '{link}在模拟步骤之间采用这一方式。'
concepts.synchronization.barriers.guidance.link: 'FluidTank 模拟'
concepts.synchronization.barriers.title: '管线屏障'
concepts.synchronization.dependencies.description: '逐个资源确认哪些访问涉及同一份数据。只要其中存在写入，就必须维持所需的先后顺序。两次读取本身没有冲突，但仍需满足纹理布局和呈现要求。CPU 更新数据或释放资源前，也须等待 GPU 完成对相应存储的使用。'
concepts.synchronization.dependencies.details: '应根据操作执行的位置选择机制：'
concepts.synchronization.dependencies.guidance: '一个队列写入的纹理被另一队列使用时，应在提交之间建立依赖，并录制所需的布局转换。这两步不会阻塞 CPU。CPU 要访问数据或释放资源前，才需等待相应工作完成。'
concepts.synchronization.dependencies.table.cpuAccess.mechanism: '对相关的完成值调用 {wait}。'
concepts.synchronization.dependencies.table.cpuAccess.situation: 'CPU 访问或资源释放需要等待 GPU 完成'
concepts.synchronization.dependencies.table.crossQueue.mechanism: '将生产者的 {timelineValue} 传给消费者的 {submit}。'
concepts.synchronization.dependencies.table.crossQueue.situation: '一个队列使用另一个队列生成的数据'
concepts.synchronization.dependencies.table.headings.mechanism: '机制'
concepts.synchronization.dependencies.table.headings.situation: '情况'
concepts.synchronization.dependencies.table.layoutChange.mechanism: '调用 {commandBufferTransition}，指定先前布局与目标布局。'
concepts.synchronization.dependencies.table.layoutChange.situation: '纹理子资源更改其使用方式'
concepts.synchronization.dependencies.table.pipelineStages.mechanism: '调用 {commandBufferBarrier}，指定产生数据和使用数据的阶段。'
concepts.synchronization.dependencies.table.pipelineStages.situation: '命令流中存在依赖关系的 GPU 阶段'
concepts.synchronization.dependencies.title: '访问依赖'
concepts.synchronization.description: '同步确定多个操作访问共享数据的顺序，并确保后续操作能够读到所需结果。在写后读依赖中，写入方称为生产者，读取方称为消费者。屏障与纹理转换协调 GPU 访问；时间线连接不同提交，并让 CPU 等待 GPU 工作完成。'
concepts.synchronization.layouts.context: '现有内容可以丢弃时，可将先前布局设为 {undefined}，例如新建图像或即将完整清除的附件。若要保留内容以供加载、采样或累积，则应使用此前访问时的布局。'
concepts.synchronization.layouts.description: '纹理的用途标志声明允许的作用。{textureLayout} 描述命令序列中某一时刻对子资源的访问方式，子资源由 mip 级别和数组层确定。访问方式发生变化时，需要录制转换。例如，计算示例在 {storage} 布局中写入输出纹理，再为图形通道中的采样做准备：'
concepts.synchronization.layouts.details: '这里的 {outputTexture} 已声明 {sampledStorage} 用途，所选子资源处于 {storage} 布局。{default} 选择 mip 级别 0 和数组层 0，其他级别和层不受这次转换影响。'
concepts.synchronization.layouts.guidance: '调用 {transition} 时，提供子资源上一次使用的布局。应用程序在录制命令，以及在渲染阶段之间传递纹理时，负责跟踪这个状态。'
concepts.synchronization.layouts.title: '纹理布局'
concepts.synchronization.reuse.description: '三角形教程在每帧完成后才复用数据。若要让帧重叠执行，应为每个尚未完成的帧准备独立的可变存储，并跟踪何时可以再次使用。修改数据前，须等待 GPU 完成对相关字节的访问；释放资源前，则须等待它的所有使用结束。'
concepts.synchronization.reuse.details: '调整大小与关闭程序遵循相同的顺序：先停止新的资源访问，等待已有访问结束，再替换或释放资源。调用 {swapChainResize} 或释放资源、上下文前，须先完成上述等待。三角形教程已经逐帧等待，因此可以在回调之间调整大小。'
concepts.synchronization.reuse.guidance: '{swapChainPresent} 会在呈现后向 {swapChainQueue} 发出信号并等待。三角形教程直接使用图形队列呈现，因此即便去掉显式的提交等待，呈现时仍会等待当前帧完成。其他队列上的工作（包括启用呈现队列时在图形队列上执行的渲染）则需单独跟踪完成状态。'
concepts.synchronization.reuse.title: '资源复用'
concepts.synchronization.timelines.context: 'CPU 若要在消费者完成后读取结果、覆盖共享数据或释放资源，须先等待这次提交完成：'
concepts.synchronization.timelines.description: '时间线用递增值标识队列进度。{submit} 返回的 {timelineValue} 同时包含时间线和本次提交的值。不同时间线上的 {value} 数值不能直接比较。'
concepts.synchronization.timelines.details: '设 {producer} 和 {consumer} 是同一上下文中两个队列上已录制的命令缓冲区，后者使用前者写入的数据。提交时传入这项依赖：'
concepts.synchronization.timelines.guidance: '消费者所在的队列会先等待传入的完成值，再执行命令。CPU 无需调用 {producedWait}，可以继续处理其他工作。共享资源须保留到 {consumed} 完成，同时仍需录制消费者访问所要求的纹理转换。'
concepts.synchronization.timelines.notes: '{queueTimelineSignal} 返回的值同样可以通过 {wait} 等待，也可以作为另一个队列的依赖。{signal} 将完成点排在此前已提交的工作之后，GPU 完成这些工作后便会到达该点。'
concepts.synchronization.timelines.title: '时间线与队列依赖'
concepts.synchronization.title: '同步'
