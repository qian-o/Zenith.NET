concepts.resources.title: 资源管理
concepts.resources.transfers.context: "回读操作会录制一条将 GPU 数据复制到内部回读存储的命令。当库重置已完成的命令缓冲区以供复用时，才会将这些字节复制到提供的 CPU 目标中。在该提交完成值的 {wait} 返回之前，目标内存必须保持已分配状态，托管内存也必须保持固定。"
concepts.resources.transfers.description: "上传将 CPU 数据复制到 GPU 资源，回读将资源数据复制回 CPU 内存。资源自身提供的方法会在返回前完成该次传输："
concepts.resources.transfers.details: "这些等待只涵盖方法自身提交的传输。它们不会发现另一个队列上已有读写操作对该资源的依赖关系。调用资源自身的传输方法前，应先建立这些依赖。直接通过映射内存复制数据时，也需要调用方确保相关 GPU 工作已经完成。"
concepts.resources.transfers.guidance: 当复制操作需要与其他工作一起录制时，请使用 {commandBufferUpload} 或 {commandBufferDownload}。它们的指针生命周期有所不同：
concepts.resources.transfers.item: "上传会在调用期间将 CPU 源数据复制到内部上传缓冲区，也称暂存内存。源指针只需在该次调用期间保持有效。"
concepts.resources.transfers.notes: "对于纹理，行步幅是 CPU 数据相邻两行之间的字节距离，切片步幅是相邻深度切片之间的字节距离。它们并不代表纹理内部的 GPU 内存布局。有关工作完成与数据回读的区别，请参阅{link}。"
concepts.resources.transfers.notes.link: 同步
concepts.resources.transfers.table.bufferDownload.transfer: 对 {cpuReadOnly} 进行直接 CPU 复制；否则在传输队列上提交下载并等待。
concepts.resources.transfers.table.bufferUpload.transfer: 对 {cpuWriteOnly} 进行直接 CPU 复制；否则在传输队列上提交上传并等待。
concepts.resources.transfers.table.headings.method: 方法
concepts.resources.transfers.table.headings.transfer: "数据传输方式"
concepts.resources.transfers.table.textureTransfers.method: "{textureUpload} / {textureDownload}"
concepts.resources.transfers.table.textureTransfers.transfer: "使用图形队列，将所选子资源转换为复制所需的布局，完成复制后转换为请求的最终布局，并等待传输完成。"
concepts.resources.transfers.title: "选择立即完成的传输或随命令录制的传输"
concepts.resources.usages.description: "{bufferUsages} 和 {textureUsages} 是声明资源预期角色的标志枚举。它们分别分配给 {bufferDescUsages} 和 {textureDescUsages}。当资源具有多个角色时，标志枚举允许使用 {value} 组合多个成员。"
concepts.resources.usages.title: 在创建资源之前声明所需的用途
concepts.resources.views.description: "{bufferView} 描述缓冲区区域及其解释方式。{textureView} 选择兼容的纹理类型、格式和子资源范围。视图共享底层存储，不会复制数据，也不会添加创建资源时遗漏的用途。指定视图范围也不意味着各后端都会进行着色器边界检查。"
concepts.resources.views.details: "默认视图可以直接使用资源自身的句柄；如果需要不同区域或兼容的解释方式，则创建视图。在 GPU 工作可能使用视图及其底层资源期间，应保留二者的 C# 引用；仅有资源句柄并不能保持任一对象存活。只有在最后一次 GPU 使用完成后才能释放它们。替换其中任一对象后，还应更新包含其旧{link}的常量。"
concepts.resources.views.details.link: "资源句柄"
concepts.resources.views.guidance: "{link}展示了在调整大小时替换深度纹理。{detail}展示了输入纹理与其可写输出保持分离。两者都让资源的生命周期跟随实际使用它的工作。"
concepts.resources.views.guidance.detail: 计算示例
concepts.resources.views.guidance.link: 旋转立方体渲染器
concepts.resources.views.title: "让视图及其底层资源在使用期间保持有效"
concepts.shaders.binding.context: 在计算示例中，{input} 填充为 {inputTextureSampledHandle}，{output} 填充为 {outputTextureStorageHandle}。Slang 的类型化 {descriptorHandle} 告知着色器如何访问每个资源：
concepts.shaders.binding.description: "{setConstantBuffer} 为当前管线的常量数据绑定缓冲区和字节偏移量。它绑定现有的 GPU 可见存储；它不会上传 C# 值。请先填充缓冲区，并确保先前的 GPU 读取操作已完成，然后再覆盖其字节。"
concepts.shaders.binding.details: 在设置常量缓冲区之前先设置管线。对于已创建并上传资源的计算工作负载，录制使用以下顺序：
concepts.shaders.binding.guidance: 此代码片段假定存在正在录制的 {commandBuffer}、{computePipeline}、具有 {bufferUsagesConstant} 用途的已上传 {constantBuffer}，以及工作负载的线程组计数。偏移量 0 绑定缓冲区的起始位置。如果多个常量数据记录共享一个缓冲区，则每个记录的起始偏移量必须满足后端的绑定对齐要求。该要求与记录内部的字段布局相互独立。
concepts.shaders.binding.notes: "{resourceHandle} 存储两个 32 位字段，但其解释归后端所有。不要将其视为可在上下文之间转移的通用描述符索引、地址或值。句柄不会创建资源，不会添加缺失的用途，也不会执行同步。"
concepts.shaders.binding.reference: 保留对资源及用于获取其句柄的任何视图的引用，并在着色器的最后一次使用完成后再释放它们。在替换纹理或视图时，更新包含其旧句柄的常量。{link}解释了这种生命周期关系。
concepts.shaders.binding.reference.link: 资源管理
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: 读取着色器类型 {t} 的结构化元素。
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: 读取或写入着色器类型 {t} 的结构化元素。
concepts.shaders.binding.table.headings.access: 预期访问
concepts.shaders.binding.table.headings.cHandle: "C# 句柄"
concepts.shaders.binding.table.headings.slangFieldType: Slang 字段类型
concepts.shaders.binding.table.samplerHandle.access: 提供纹理采样状态。
concepts.shaders.binding.table.textureSampledHandle.access: 读取纹理。
concepts.shaders.binding.table.textureStorageHandle.access: 读取或写入存储纹理。
concepts.shaders.binding.title: 绑定常量缓冲区及其描述的资源
concepts.shaders.compilation.description: "{zenithCompiler} 编译具名的 Slang 入口点并返回 {shaderDesc}。使用上下文的 {graphicsApi}，以便编译结果针对将创建着色器的后端：针对 DirectX 12 的 DXIL、针对 Metal 的 Metal 库，或针对 Vulkan 的 SPIR-V。"
concepts.shaders.compilation.details: 例如，在已有 {context} 且三角形着色器已复制到可执行文件旁的情况下：
concepts.shaders.compilation.guidance: "{vSMain} 必须与着色器文件中的入口点名称完全匹配。在创建管线期间保持着色器对象有效，然后在管线创建完成后将其释放，如{link}所示。执行一次此初始化，而不是在每帧中重新编译。"
concepts.shaders.compilation.guidance.link: 第一个三角形
concepts.shaders.compilation.title: 为所选上下文编译入口点
concepts.shaders.description: "着色器接收由应用程序提供的数据。顶点属性描述单个顶点；缓冲区保存参数或数组；资源句柄标识着色器将访问的其他资源。C# 声明与 Slang 声明必须在这些值的含义上达成一致。仅仅匹配字段名是不够的：内存布局、资源访问和绑定方式都必须匹配。"
concepts.shaders.dispatch.description: "{dispatch} 接收线程组的数量。计算示例的 {numthreads} 入口点每组运行 16 × 16 个线程。将图像尺寸除以 16 并向上取整以求得组数。例如，17 × 19 的图像需要 2 × 2 组。着色器会根据图像尺寸检查其像素坐标，因为最后一组可能包含位于图像外部的线程。"
concepts.shaders.dispatch.details: 编译器将入口点声明的组大小保存在 {shaderDescThreadGroupSize} 中；它不会将提供给 {dispatch} 的像素尺寸自动转换为组数。完整的绑定和分派示例请结合使用 {computeShaderRendererCs} 及其着色器，并在另一个通道消费输出之前参阅{link}。
concepts.shaders.dispatch.details.link: 同步
concepts.shaders.dispatch.title: 分派线程组，而非像素
concepts.shaders.layout.context: "{link}显式指定了它们的偏移量。此声明的作用域需要 {systemRuntimeInteropServices} 和 {zenithNET}："
concepts.shaders.layout.context.link: "计算示例的 C# 常量"
concepts.shaders.layout.description: "对于顶点输入，管线的 {inputLayout} 描述了格式、偏移量、步幅和语义。三角形的 {float3} 位置后跟 {float4} 颜色占用 28 字节，颜色位于字节 12 处。{inputLayoutAdd} 计算这个紧凑布局；它不会检查 C# 结构体。如果 C# 字段包含填充，请提供匹配的布局，而不要假定字段是紧凑排列的。"
concepts.shaders.layout.details: "常量缓冲区保存着色器参数，而结构化缓冲区保存声明类型的元素数组。两者都根据其 Slang 声明进行读取。它们不使用 {inputLayout}。请核实编译后着色器表示形式的字段偏移量和元素大小（包括填充）。非托管 C# 类型适合按字节复制，但这本身并不能证明它与着色器类型匹配。特别是，不要将顶点的紧凑 {float3} 布局应用于每个着色器缓冲区。"
concepts.shaders.layout.guidance: 资源句柄是引用现有资源的一个较小数值。将句柄复制到常量缓冲区中并不会复制该资源的内容。
concepts.shaders.layout.notes: "{computeShaderSlang} 中的相应声明为："
concepts.shaders.layout.reference: "尺寸占用前 8 个字节，后跟两个 8 字节的资源句柄。C# 示例总共保留了 256 字节。该大小是示例选择的存储大小，并非所有 Slang 结构体或常量有效负载都占用 256 字节的规则。填充总大小也不会修正处于错误偏移量处的字段。"
concepts.shaders.layout.title: 顶点输入与着色器数据具有不同的布局规则
concepts.shaders.matrices.description: 编译器请求行优先（row-major）矩阵存储，该存储将每行的元素保存在一起。{link}将三个 {matrix4x4} 值放置在偏移量 0、64 和 128 处。其{detail}按模型、视图和投影的顺序使用 {mulVectorMatrix}。
concepts.shaders.matrices.description.detail: 着色器
concepts.shaders.matrices.description.link: 旋转立方体渲染器
concepts.shaders.matrices.details: 存储顺序决定了矩阵元素如何占用内存；乘法顺序决定了变换。请保持两端一致。在不检查这两个选择的情况下添加转置可能会掩盖一个不匹配，同时引入另一个不匹配。
concepts.shaders.matrices.title: 保持矩阵存储与乘法顺序一致
concepts.shaders.title: 着色器数据与绑定
concepts.synchronization.backends.description: DirectX 12 和 Vulkan 对带有布局和访问信息的纹理转换进行编码。Metal 在 Zenith.NET 的 {transition} 实现中没有对应的显式操作。Metal 将录制的工作分组到渲染和计算编码器中。后端在结束这些组时插入可见性屏障，使先前的写入可供后续工作使用。显式的 {barrier} 调用处理诸如同一个编码器内连续计算分派等依赖关系。
concepts.synchronization.backends.details: 在更改工作负载时，这种区别非常重要。在{link}中，分派之后是图形渲染通道，这在 Metal 上也会创建编码器边界。仅仅更改纹理声明的布局并不能为两个依赖的计算分派创建该边界。保持共享 API 所需的转换，并单独识别实际生产命令与消费命令之间的依赖关系。
concepts.synchronization.backends.details.link: 计算示例
concepts.synchronization.backends.title: 布局转换在每个后端上并非完全相同
concepts.synchronization.barriers.context: "{barrierStagesAll} 是一个更宽的范围，而不是自动依赖项检测器。请选择实际覆盖该工作的阶段，并且仅在支持这些操作的队列上使用它们。"
concepts.synchronization.barriers.description: 考虑两个计算分派：第一个写入模拟数据，第二个读取该数据以执行下一步。两者都使用存储缓冲区，因此没有需要更改的纹理布局。在命令缓冲区中的两次分派之间插入以下内容：
concepts.synchronization.barriers.details: 第一个参数标识生产者阶段，第二个参数标识消费者阶段。屏障在 GPU 上建立对应的执行和内存依赖关系。后端将这些阶段转换为其执行和内存访问规则。该屏障不会更改纹理的布局，也不会等待设备上的所有工作。
concepts.synchronization.barriers.guidance: "{link}在依赖的分派之间使用了这种模式。在发生依赖关系的地方放置屏障。在消费者已经录制之后放置屏障，无法将该消费者排在较早的生产者之后。"
concepts.synchronization.barriers.guidance.link: FluidTank 模拟
concepts.synchronization.barriers.title: 使用屏障对有依赖关系的命令进行排序
concepts.synchronization.dependencies.description: 对于每个共享资源，确定首先访问它的操作、随后的操作，以及是否有任一访问执行写入。两次读取相同的数据不需要进行排序以保护其内容，尽管布局更改或呈现可能会施加其他要求。写后读、读后覆写或两次写入可能都需要建立依赖关系。
concepts.synchronization.dependencies.details: 然后根据这些操作执行的位置选择对应的机制：
concepts.synchronization.dependencies.guidance: 这些机制彼此相关，但不可互换。按顺序提交命令并不能取代所有的内存依赖。队列等待不会声明新的纹理布局，命令屏障也不会等待调用方的 CPU 线程。
concepts.synchronization.dependencies.table.cpuAccess.mechanism: 对相关的完成值调用 {wait}。
concepts.synchronization.dependencies.table.cpuAccess.situation: CPU 在访问或释放数据之前必须等待
concepts.synchronization.dependencies.table.crossQueue.mechanism: 将其 {timelineValue} 传递给消费方命令缓冲区的 {submit}。
concepts.synchronization.dependencies.table.crossQueue.situation: 另一个队列上的提交操作生成了数据
concepts.synchronization.dependencies.table.headings.mechanism: 机制
concepts.synchronization.dependencies.table.headings.situation: 情况
concepts.synchronization.dependencies.table.layoutChange.mechanism: 带有先前和后续布局的 {commandBufferTransition}。
concepts.synchronization.dependencies.table.layoutChange.situation: 纹理子资源更改其使用方式
concepts.synchronization.dependencies.table.pipelineStages.mechanism: 带有生产者和消费者阶段的 {commandBufferBarrier}。
concepts.synchronization.dependencies.table.pipelineStages.situation: 命令流中存在依赖关系的 GPU 阶段
concepts.synchronization.dependencies.title: 从生产者和消费者开始分析
concepts.synchronization.description: 读取先前命令写入数据的命令，依赖于这些写入操作已完成且对其可见。写入方是生产者（producer）；读取方是消费者（consumer）。CPU 在读取、覆写或释放共享数据之前也需要一个完成点。Zenith.NET 针对这些不同的依赖关系提供了屏障、纹理布局转换和时间线。
concepts.synchronization.layouts.context: "{undefined} 意味着不需要保留以前的内容。它适用于新图像或将被完全清除的附件。它不能用作避免跟踪需要加载、采样或累积内容的图像布局的手段。"
concepts.synchronization.layouts.description: 用途标志描述了纹理支持哪些角色。{textureLayout} 描述了某个特定操作将如何访问特定子资源。子资源是选定的 mip 级别和数组层。更改其布局是为此类访问做准备；它不会将纹理转换为不同的像素格式。例如，计算示例在 {storage} 布局中写入输出纹理，然后在图形通道中对其进行采样。在这些使用之间，它录制了：
concepts.synchronization.layouts.details: 此代码片段假定 {outputTexture} 是使用 {sampledStorage} 用途创建的，并且其选定的子资源处于 {storage} 布局中。{default} 选择 mip 级别 0 和数组层 0。该操作不会转换纹理的每个 mip 或层。
concepts.synchronization.layouts.guidance: 应用程序提供先前的布局。{transition} 不会维护应用程序可见的布局跟踪器，也不会从较早的命令推断该值。只要资源在渲染阶段之间传递，就应该显式跟踪布局。
concepts.synchronization.layouts.title: 跟踪每个纹理子资源的布局
concepts.synchronization.readback.description: "{isCompleted} 仅查询 GPU 时间线是否已达到某个值。它本身不会回收命令缓冲区，也不会将暂存的回读数据复制到应用程序的目标指针所指向的内存中。"
concepts.synchronization.readback.details: "{commandBufferDownload} 首先录制将数据复制到内部回读存储的命令。重置已完成的命令缓冲区以供复用时，才会由 CPU 将数据复制到提供的指针所指向的内存。在该次回读提交的 {wait} 返回之前，目标内存必须保持有效，托管内存必须保持固定；返回后才能读取数据或释放内存。等待另一个队列上的后续提交，本身不会轮询回读操作所属的队列。"
concepts.synchronization.readback.guidance: "因此，仅轮询 {isCompleted} 然后立即读取异步回读的目标内存是不够的。{link}介绍了直接复制与通过暂存内存传输的路径。"
concepts.synchronization.readback.guidance.link: 资源管理
concepts.synchronization.readback.title: GPU 完成与 CPU 下载数据是不同的步骤
concepts.synchronization.reuse.description: 对于第一个渲染器，在每帧之后立即等待是最直观的做法。要实现重叠工作，请为未决帧分配单独的可变数据，并保留每个帧最终用途的完成值。在更新常量缓冲区、替换纹理或释放管线之前，请完成对受影响资源的所有未决访问。
concepts.synchronization.reuse.details: 在调整大小或关闭时，在等待旧工作之前先停止新用途。{swapChainResize}、资源释放和上下文释放不能用作应用程序工作的通用等待机制。三角形示例可以在回调之间安全地调整大小，因为每个先前的帧都已经完成了其提交操作。
concepts.synchronization.reuse.guidance: 当前的 {swapChainPresent} 在其呈现操作之后也会在图形队列上发出信号并等待。因此，仅仅移除三角形显式的提交等待并不能自动建立起重叠的呈现循环。在图形队列上的等待对于仍在另一个队列上运行的独立工作也不起作用。
concepts.synchronization.reuse.title: 仅在最后一次访问完成后重用数据
concepts.synchronization.timelines.context: 在 CPU 读取、覆写或释放这些资源之前，请等待其最终使用：
concepts.synchronization.timelines.description: 时间线使用递增的值跟踪队列上的完成进度。{submit} 返回包含该时间线和与提交关联的值的 {timelineValue}。来自不同时间线的完成值不能仅通过其数字 {value} 字段进行比较。
concepts.synchronization.timelines.details: 假设 {producer} 和 {consumer} 是来自同一上下文的两个队列中已录制的命令缓冲区。生产者写入消费者使用的数据。像这样提交它们：
concepts.synchronization.timelines.guidance: 传递生成的值会使消费队列在 GPU 上等待该值。CPU 在此处不调用 {producedWait}。在 {consumed} 完成之前保持共享资源有效，并录制消费者所需的任何纹理布局更改。
concepts.synchronization.timelines.notes: "{wait} 等待该时间线值，然后检查其所属队列中已完成的提交。完成的命令缓冲区会被重置以供复用，其中暂存的回读数据会复制到提供的 CPU 目标中。{queueTimelineSignal} 也可以在已提交到该队列的工作之后排入一个完成点。调用 {signal} 不代表 GPU 已经到达该点。"
concepts.synchronization.timelines.title: 使用时间线进行完成通知与队列交接
concepts.synchronization.title: 同步
