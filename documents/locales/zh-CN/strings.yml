concepts.platforms.integration.title: 选择呈现路径以及框架
concepts.platforms.lifecycle.context: 对于 UI 视图，在创建匹配的渲染资源时，使用事件输出纹理的 {descWidth}、{descHeight}、{descFormat} 和 {descSampleCount}。控件决定该输出纹理的分辨率；不要假定其逻辑尺寸或显示缩放比例始终等于纹理尺寸。
concepts.platforms.lifecycle.description: 对于原生交换链，请以像素为单位传递帧缓冲区尺寸。启用显示缩放时，以逻辑单位表示的窗口大小可能会有所不同。跳过零尺寸的帧缓冲区，在像素大小变化时调整交换链大小，并为每帧获取 {swapChainDrawable}。输出纹理归交换链所有，并可能在呈现或调整大小后发生改变。
concepts.platforms.lifecycle.details: "{swapChainResize} 更改现有呈现目标的尺寸。{swapChainRefresh} 替换呈现目标描述，包括原生句柄。在执行任一操作前，应先完成对受影响资源的所有未完成访问。销毁原生呈现目标前，应先释放交换链。"
concepts.platforms.lifecycle.guidance: 重新创建尺寸跟随窗口变化的应用程序自有深度或离屏纹理，并更新包含其句柄的常量。当附件格式和采样数保持兼容时，管线可以在尺寸变化后继续使用。{link}在替换深度纹理的同时保留了其管线。
concepts.platforms.lifecycle.guidance.link: 旋转立方体渲染器
concepts.platforms.lifecycle.title: 输出纹理的尺寸和生命周期由宿主决定
concepts.platforms.ownership.description: 应用程序拥有其分配的图形上下文以及为渲染创建的资源。控件拥有其自身的呈现资源。更改视图的 {graphicsContext} 属性会使调度程序重新创建控件的资源；它不会为新上下文重新创建应用程序的管线、缓冲区或纹理。
concepts.platforms.ownership.details: 将资源替换与视图的帧生命周期协调一致。在释放应用程序资源或分配的上下文之前，停止视图的帧活动并完成未决的 GPU 使用。移除视图不会将上下文所有权转移给控件。
concepts.platforms.ownership.guidance: 共享的 {frameSchedulerCs} 通过视图的 UI 调度程序调度帧工作。使帧处理程序集中于更新和录制帧；在那里进行冗长的 CPU 任务也会使 UI 卡顿。
concepts.platforms.ownership.title: 将应用程序资源保留在控件所有权之外
concepts.platforms.surface.context: 窗口库或 UI 框架支持某种操作系统并不保证所选的 GPU 后端在其中可用。设备特性、驱动程序和原生呈现目标支持仍需匹配。在创建这些工作负载之前，通过 {contextCapabilities} 检查可选的光线追踪和网格着色（mesh shading）。
concepts.platforms.surface.description: "{link}使用 Silk.NET 创建窗口并处理事件。Zenith.NET 通过 {surface} 描述和交换链 {swapChain} 连接到该窗口。原生呈现目标包含原生句柄和尺寸；构造该描述不会创建或拥有操作系统窗口。"
concepts.platforms.surface.description.link: 三角形教程
concepts.platforms.surface.details: 句柄必须与所选后端匹配：
concepts.platforms.surface.guidance: 教程中的 {appCs} 显示了 Windows、macOS 和 X11 的选择。其 Linux 宿主提供 Xlib 句柄；在 Wayland 会话中使用它需要 XWayland。原生 Wayland 应用程序将通过 {surfaceWayland} 提供不同的句柄。
