tutorial.resize.context: 再次运行 {dotnetRun}。窗口现在应该具有均匀的暗色背景，并且在调整大小后继续填满窗口。保留此回调：三角形将在其现有的渲染通道内绘制。
tutorial.resize.description: 交换链的图像必须跟随帧缓冲区尺寸。使用 {framebufferResize} 响应像素大小的变化，包括由显示缩放引起的变化。在渲染回调之后、仍处于 {windowRun} 之前，添加：
tutorial.resize.details: Silk.NET 区分窗口大小变化与{link}。我们需要后者，因为交换链存储的是像素。最小化的窗口可以具有零大小的帧缓冲区。在那种情况下，两个回调都会跳过它们的 GPU 工作。调整大小后，渲染通道将为其视口和裁剪区域使用新的附件尺寸。
tutorial.resize.details.link: 帧缓冲区大小变化
tutorial.resize.guidance: 我们在每次提交后都会等待，因此当调整大小处理程序替换图像时，之前的帧不会继续使用这些图像。当前的 {present} 实现也会在图形队列上等待。这个简单的循环确保一帧的工作在下一帧开始前完成；{link}涵盖了更高级的调度方式。
tutorial.resize.guidance.link: 同步
tutorial.resize.title: 响应窗口大小调整
tutorial.shaders.compilation.context: 编译在初始化期间执行一次。{appContextBaseDirectory} 负责在可执行文件旁定位复制的着色器，而与当前工作目录无关。这些着色器仅使用顶点输入，因此目前还没有常量缓冲区、纹理或资源句柄需要绑定。
tutorial.shaders.compilation.description: 在 {triangleSlang} 的文件属性中，将{emphasis}设置为{detail}。这会使着色器在可执行文件旁可用。
tutorial.shaders.compilation.description.detail: 如果较新则复制
tutorial.shaders.compilation.description.emphasis: 复制到输出目录
tutorial.shaders.compilation.details: 返回 {programCs}。在顶点上传之后、渲染回调之前添加这些初始化语句：
tutorial.shaders.compilation.guidance: "{zenithCompiler} 返回包含所请求图形 API 代码的着色器描述。{createShader} 创建对应的后端对象。图形 API 和入口点名称都很关键：使用 {contextGraphicsApi}，并将 {vSMain} 和 {fSMain} 的拼写保持与 Slang 文件中完全一致。"
tutorial.shaders.compilation.title: 针对所选后端进行编译
tutorial.shaders.context: "{fSInput} 将顶点着色器的输出连接到片元着色器的输入。由顶点着色器写入时，{sVPOSITION} 提供裁剪空间位置，即 GPU 用来判断哪些内容位于可见图像范围内的四个坐标。{cOLOR0} 传递需要在顶点之间插值的颜色。两个阶段使用的类型与语义必须一致。"
tutorial.shaders.description: 着色器是由 GPU 执行的程序。本次绘制需要一个顶点着色器来确定顶点位置，以及一个片元着色器来生成三角形内部的颜色。我们将使用 Slang 着色器语言编写它们，并从同一文件中编译两个入口点。入口点是着色器阶段开始执行的函数。
tutorial.shaders.details: 创建 {triangleSlang}，从以下两个结构体开始：
tutorial.shaders.fragment.description: 将片元入口点追加到同一个文件中：
tutorial.shaders.fragment.details: 光栅化确定三角形覆盖了哪些图像位置。它生成片元（由片元着色器处理的数据），并在覆盖区域内插值顶点颜色。{fSMain} 通过 {sVTARGET} 返回此插值颜色，该语义标识第一个颜色附件。
tutorial.shaders.fragment.guidance: 顶点颜色插值与附件混合是相互独立的。混合是将片元的输出与附件中已存储的颜色相结合。我们设置的不透明混合状态禁用了该组合，因此插值得到的颜色将直接替换三角形内部的背景。
tutorial.shaders.fragment.title: 为片元着色
tutorial.shaders.guidance: "{vSInput} 描述顶点着色器从顶点缓冲区接收的内容。语义 {pOSITION0} 和 {cOLOR0} 标识输入；仅凭 C# 字段名称无法建立该映射。"
tutorial.shaders.title: 编写两个着色器阶段
tutorial.shaders.vertex.description: 将顶点入口点追加到 {triangleSlang} 中：
tutorial.shaders.vertex.details: GPU 对每个输入顶点调用此入口点。它为位置添加齐次坐标 {w} 并传递颜色。在顶点阶段之后，位置会被除以 w；在此处该除法保持 x、y 和 z 不变。这就是为什么上面选择的位置可以直接理解为归一化设备坐标的原因。
tutorial.shaders.vertex.title: 定位每个顶点
tutorial.surface.description: 图形上下文还需要知道在何处显示其输出。在{emphasis}添加以下内容：
tutorial.surface.description.emphasis: "{windowCenter} 之后、{windowRun} 之前"
tutorial.surface.details: "{surface} 描述了原生呈现目标及其像素尺寸。帧缓冲区是与窗口关联的像素图像。{framebufferSize} 以像素为单位给出其尺寸；启用显示缩放时，窗口的逻辑尺寸可能会有所不同。"
tutorial.surface.guidance: 该表面与上面选定的后端相匹配。Windows 提供窗口句柄，Linux 提供 X11 显示与窗口，macOS 辅助类提供附加的 Metal 图层。这是将我们的窗口连接到渲染流程中唯一与平台相关的部分。
tutorial.surface.title: 描述原生呈现目标
tutorial.swapChain.context: 交换链同时使用了图形上下文与原生窗口。将 {programCs} 底部的 {windowDispose} 行替换为以下清理顺序：
tutorial.swapChain.description: 使用表面描述来创建将要呈现的图像。紧随表面代码块之后，添加：
tutorial.swapChain.details: "{swapChain} 管理窗口中显示的图像。在每一帧中，{drawable} 为我们提供作为 {texture}（用于图像数据的 API 类型）的当前图像。绘制完成后，{present} 请求显示结果并前进到下一个 drawable。"
tutorial.swapChain.guidance: "{b8G8R8A8UNorm} 按蓝、绿、红和阿尔法通道的顺序存储四个 8 位颜色通道。{uNorm} 表示从 0 到 255 的整数值对应从 0 到 1 的值。着色器仍将返回逻辑 RGBA 值；此格式决定这些通道在图像中的存储方式。稍后，图形管线将使用 {swapChainDescFormat} 来匹配此附件。"
tutorial.swapChain.title: 创建交换链
