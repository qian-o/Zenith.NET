concepts.resources.bufferUsages.table.vertex.role: 为绘制提取的顶点属性。
concepts.resources.bufferUsages.title: 缓冲区用途
concepts.resources.description: "根据将要使用资源的操作选择资源描述。如果一个纹理既要接收渲染结果，又要被着色器采样，还要回读到 CPU，就需要声明这三种用途，并处理这些操作之间的同步。内存放置位置和资源生命周期则是另外需要考虑的问题。"
concepts.resources.memory.context: 对于 CPU 可访问的缓冲区，{map} 为 CPU 提供内存地址。它不会等待 GPU 停止访问相同的字节。{unmap} 同样不会提交工作或等待完成。在覆盖 CPU 可写数据之前，请先完成仍需要其旧内容的 GPU 读取。
concepts.resources.memory.description: "{bufferDesc} 具有 {residency} 字段。请根据 CPU 和 GPU 访问数据的方式进行选择："
concepts.resources.memory.details: 内存驻留描述了 CPU 对所分配内存的预期访问方式。它并不意味着每个设备都具有物理分离的 CPU 和 GPU 内存。三角形示例使用 {cpuWriteOnly} 直接初始化较小的顶点缓冲区。大型静态网格则可以从单次上传的仅 GPU 存储中获益。
concepts.resources.memory.guidance: "{textureDesc} 没有内存驻留字段。由图形上下文创建的常规纹理使用 GPU 存储。其公共 API 提供上传和回读操作来传输 CPU 数据，但不提供直接映射方法。显式堆提供内存放置控制，下文将介绍。"
concepts.resources.memory.table.cpuReadOnly.cPUAccess: "在 GPU 复制完成后读取映射的内存。"
concepts.resources.memory.table.cpuReadOnly.typicalRole: "GPU 生成的回读数据"
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: "在先前的 GPU 读取完成后写入映射的内存。"
concepts.resources.memory.table.cpuWriteOnly.typicalRole: "CPU 提供或更新的数据"
concepts.resources.memory.table.gpuOnly.cPUAccess: "通过上传缓冲区或回读缓冲区传输字节。"
concepts.resources.memory.table.gpuOnly.typicalRole: "静态几何体和 GPU 工作数据"
concepts.resources.memory.table.headings.cPUAccess: CPU 访问
concepts.resources.memory.table.headings.residency: 内存驻留
concepts.resources.memory.table.headings.typicalRole: "典型用途"
concepts.resources.memory.title: "根据所需的 CPU 访问方式选择内存"
concepts.resources.textureUsages.description: "传输用途标志描述 GPU 复制的方向。CPU 访问则是另一项内存放置选择，下文将介绍。"
concepts.resources.textureUsages.details: "组合用途标志只是声明多个作用，不会执行相应操作，也不会安排访问顺序。纹理仍然需要适当的{link}，而且其格式必须在所选设备上支持请求的用途。"
