concepts.resources.memory.table.headings.typicalRole: '典型用途'
concepts.resources.memory.title: 'CPU 访问与内存放置'
concepts.resources.textureUsages.description: '传输标志声明资源在 GPU 复制中用作源还是目标。CPU 能否直接访问这块存储，则由内存放置方式决定。'
concepts.resources.textureUsages.details: '用途标志声明纹理可承担的角色，在这些角色之间切换时需要执行相应的{link}。'
concepts.resources.textureUsages.details.link: '布局与同步'
