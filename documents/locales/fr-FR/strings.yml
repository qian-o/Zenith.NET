concepts.platforms.lifecycle.context: Pour une vue d’interface utilisateur, utilisez les propriétés {descWidth}, {descHeight}, {descFormat} et {descSampleCount} de la texture de sortie de l’événement lors de la création de ressources de rendu correspondantes. Le contrôle détermine la résolution de cette texture de sortie ; ne supposez pas que ses dimensions logiques ou son échelle d’affichage sont toujours égales aux dimensions de la texture.
concepts.platforms.lifecycle.description: Pour une chaîne d’échange native, transmettez les dimensions du tampon de trame en pixels. Les tailles de fenêtre exprimées en unités logiques peuvent différer lorsque la mise à l’échelle de l’affichage est activée. Ignorez les tampons de trame de taille zéro, redimensionnez la chaîne d’échange lorsque sa taille de pixel change et obtenez {swapChainDrawable} pour chaque image. La texture de sortie appartient à la chaîne d’échange et peut changer après la présentation ou le redimensionnement.
concepts.platforms.lifecycle.details: "{swapChainResize} modifie les dimensions de la surface existante. {swapChainRefresh} remplace la description de la surface, y compris ses handles natifs. Avant l’une ou l’autre opération, terminez les utilisations en cours des ressources affectées. Libérez la chaîne d’échange avant de détruire sa cible de présentation native."
concepts.platforms.lifecycle.guidance: Recréez les textures de profondeur ou hors écran appartenant à l’application dont la taille suit la fenêtre, et mettez à jour les constantes contenant leurs handles. Un pipeline peut rester utilisé à travers un changement de taille lorsque ses formats d’attachement et son nombre d’échantillons restent compatibles. Le {link} conserve son pipeline tout en remplaçant sa texture de profondeur.
concepts.platforms.lifecycle.guidance.link: moteur de rendu du cube en rotation
concepts.platforms.lifecycle.title: Conserver la taille et la durée de vie de la texture de sortie avec son hôte
concepts.platforms.ownership.description: L’application possède le contexte qu’elle assigne et les ressources qu’elle crée pour le rendu. Le contrôle possède ses propres ressources de présentation. La modification de la propriété {graphicsContext} de la vue amène le planificateur à recréer les ressources du contrôle ; cela ne recrée pas les pipelines, tampons ou textures de l’application pour le nouveau contexte.
concepts.platforms.ownership.details: Coordonnez le remplacement des ressources avec le cycle de vie de l’image de la vue. Arrêtez l’activité de trame de la vue et terminez les utilisations GPU en attente avant de libérer les ressources de l’application ou le contexte assigné. La suppression d’une vue ne transfère pas la propriété du contexte au contrôle.
concepts.platforms.ownership.guidance: Le fichier partagé {frameSchedulerCs} distribue le travail de trame via le dispatcher UI de la vue. Gardez les gestionnaires de trame concentrés sur la mise à jour et l’enregistrement de l’image ; un travail CPU prolongé à cet endroit retarde également l’interface utilisateur.
concepts.platforms.ownership.title: Conserver les ressources de l’application en dehors de la propriété du contrôle
concepts.platforms.surface.context: Une bibliothèque de fenêtrage ou un framework d’interface utilisateur prenant en charge un système d’exploitation ne garantit pas que le backend GPU sélectionné y soit disponible. Les fonctionnalités matérielles, les pilotes et la prise en charge des surfaces natives doivent toujours concorder. Vérifiez le lancer de rayons et le mesh shading optionnels via {contextCapabilities} avant de créer ces charges de travail.
concepts.platforms.surface.description: Le {link} utilise Silk.NET pour créer une fenêtre et traiter les événements. Zenith.NET se connecte à cette fenêtre via une description de {surface} et une {swapChain}. Une surface contient des handles et des dimensions natifs ; la construction de la description ne crée ni ne possède la fenêtre du système d’exploitation.
