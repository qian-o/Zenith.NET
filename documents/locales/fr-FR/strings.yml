concepts.resources.title: Gestion des ressources
concepts.resources.transfers.context: Un téléchargement enregistre une copie GPU dans un stockage interne de lecture. La bibliothèque copie ces octets dans la destination CPU fournie lorsqu’elle réinitialise le tampon de commandes terminé pour le réutiliser. Gardez la destination allouée, et gardez la mémoire managée épinglée, jusqu’à ce que le {wait} de la valeur de soumission revienne.
concepts.resources.transfers.description: "Un transfert vers le GPU copie les données CPU dans une ressource GPU ; une lecture depuis le GPU ramène les données de la ressource en mémoire CPU. Les méthodes de la ressource terminent ce transfert avant de rendre la main :"
concepts.resources.transfers.details: "Ces attentes couvrent uniquement le transfert soumis par ces méthodes. Elles ne détectent pas les dépendances envers une autre file qui lisait ou écrivait déjà la ressource. Établissez ces dépendances avant d’appeler la méthode de la ressource. Une copie directe via la mémoire mappée exige elle aussi que l’appelant s’assure de l’achèvement du travail GPU concerné."
concepts.resources.transfers.guidance: "Utilisez {commandBufferUpload} ou {commandBufferDownload} lorsque les copies doivent être enregistrées avec d’autres travaux. Les durées de vie de leurs pointeurs diffèrent :"
concepts.resources.transfers.item: "Un transfert vers le GPU copie les données sources du CPU dans un tampon interne de transfert, également appelé mémoire intermédiaire ou staging, pendant l’appel. Le pointeur source doit rester valide uniquement pendant cet appel."
concepts.resources.transfers.notes: "Pour une texture, le pas de ligne est la distance en octets entre deux lignes successives de données CPU ; le pas de tranche est la distance en octets entre deux tranches de profondeur successives. Ils ne décrivent pas l’organisation interne de la texture en mémoire GPU. Consultez {link} pour distinguer l’achèvement GPU de la disponibilité des données relues."
concepts.resources.transfers.notes.link: Synchronisation
concepts.resources.transfers.table.bufferDownload.transfer: Copie directe du CPU pour {cpuReadOnly} ; sinon, soumet un téléchargement sur la file de transfert et attend.
concepts.resources.transfers.table.bufferUpload.transfer: Copie directe du CPU pour {cpuWriteOnly} ; sinon, soumet un transfert sur la file de transfert et attend.
concepts.resources.transfers.table.headings.method: Méthode
concepts.resources.transfers.table.headings.transfer: "Mode de transfert des données"
concepts.resources.transfers.table.textureTransfers.method: "{textureUpload} / {textureDownload}"
concepts.resources.transfers.table.textureTransfers.transfer: "Utilise la file graphique, fait passer la sous-ressource sélectionnée au layout nécessaire à la copie, puis au layout final demandé, et attend la fin du transfert."
concepts.resources.transfers.title: "Choisir entre transferts immédiats et transferts enregistrés"
concepts.resources.usages.description: "{bufferUsages} et {textureUsages} sont des énumérations d’indicateurs qui déclarent les rôles prévus d’une ressource. Ils sont affectés respectivement à {bufferDescUsages} et {textureDescUsages}. Une énumération d’indicateurs permet de combiner plusieurs membres avec {value} lorsqu’une ressource a plus d’un rôle."
concepts.resources.usages.title: Déclarer les usages requis avant de créer une ressource
concepts.resources.views.description: Une {bufferView} décrit une région de tampon et son interprétation. Une {textureView} sélectionne un type de texture compatible, un format et une plage de sous-ressources. Une vue partage le stockage sous-jacent ; elle ne copie pas les données et n’ajoute pas d’usages qui manquaient lors de la création de la ressource. Sa plage n’est pas non plus une garantie portable de vérification des limites dans le shader.
concepts.resources.views.details: "Utilisez le handle de la ressource pour sa vue par défaut, ou créez une vue si une autre région ou une interprétation compatible différente est nécessaire. Conservez les références C# vers la vue et sa ressource sous-jacente tant que des travaux GPU peuvent les utiliser ; un handle de ressource seul ne maintient aucun des deux objets en vie. Libérez-les uniquement après leur dernière utilisation GPU. Après avoir remplacé l’un des objets, mettez à jour les constantes contenant son ancien {link}."
concepts.resources.views.details.link: "handle de ressource"
concepts.resources.views.guidance: Le {link} montre une texture de profondeur remplacée lors du redimensionnement. L’{detail} montre une texture d’entrée maintenue séparée de sa sortie accessible en écriture. Les deux font suivre la durée de vie de la ressource au travail qui l’utilise réellement.
concepts.resources.views.guidance.detail: exemple de calcul
concepts.resources.views.guidance.link: moteur de rendu du cube en rotation
concepts.resources.views.title: "Garder les vues et leurs ressources sous-jacentes utilisables ensemble"
concepts.shaders.binding.context: "Dans l’exemple de calcul, {input} est rempli avec {inputTextureSampledHandle} et {output} avec {outputTextureStorageHandle}. Le {descriptorHandle} typé de Slang indique au shader comment accéder à chaque ressource :"
concepts.shaders.binding.description: "{setConstantBuffer} lie un tampon et un décalage d’octets pour les données de constantes du pipeline actuel. Il lie un stockage existant visible par le GPU ; il ne transfère pas de valeur C#. Remplissez d’abord le tampon et assurez-vous que les lecteurs GPU antérieurs ont terminé avant d’écraser ses octets."
concepts.shaders.binding.details: "Définissez le pipeline avant son tampon de constantes. Pour une charge de travail de calcul avec des ressources déjà créées et transférées, l’enregistrement utilise cet ordre :"
concepts.shaders.binding.guidance: Ce fragment suppose un {commandBuffer} en cours d’enregistrement, un {computePipeline}, un {constantBuffer} transféré avec l’usage {bufferUsagesConstant} et les nombres de groupes de threads pour la charge de travail. Le décalage 0 lie le début du tampon. Si plusieurs enregistrements de données de constantes partagent un même tampon, le décalage de départ de chaque enregistrement doit respecter l’alignement de liaison du backend. Cette exigence est distincte de l’agencement des champs à l’intérieur de l’enregistrement.
concepts.shaders.binding.notes: "{resourceHandle} stocke deux champs de 32 bits, mais son interprétation appartient au backend. Ne le traitez pas comme un index de descripteur universel, une adresse ou une valeur pouvant être transférée entre contextes. Un handle ne crée pas de ressource, n’ajoute pas d’usage manquant et n’effectue aucune synchronisation."
concepts.shaders.binding.reference: Conservez des références à la ressource et à toute vue utilisée pour obtenir son handle, et libérez-les uniquement après la fin de la dernière utilisation par le shader. Lors du remplacement d’une texture ou d’une vue, mettez à jour les constantes qui contiennent son ancien handle. {link} explique cette relation de durée de vie.
concepts.shaders.binding.reference.link: Gestion des ressources
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: Lire des éléments structurés du type de shader {t}.
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: Lire ou écrire des éléments structurés du type de shader {t}.
concepts.shaders.binding.table.headings.access: Accès prévu
concepts.shaders.binding.table.headings.cHandle: "Handle C#"
concepts.shaders.binding.table.headings.slangFieldType: Type de champ Slang
concepts.shaders.binding.table.samplerHandle.access: Fournir l’état d’échantillonnage de texture.
concepts.shaders.binding.table.textureSampledHandle.access: Lire une texture.
concepts.shaders.binding.table.textureStorageHandle.access: Lire ou écrire une texture de stockage.
concepts.shaders.binding.title: Lier le tampon de constantes et les ressources qu’il décrit
concepts.shaders.compilation.description: "{zenithCompiler} compile un point d’entrée Slang nommé et renvoie un {shaderDesc}. Utilisez le {graphicsApi} du contexte afin que le résultat cible le backend qui créera le shader : DXIL pour DirectX 12, une bibliothèque Metal pour Metal ou SPIR-V pour Vulkan."
concepts.shaders.compilation.details: "Par exemple, avec un {context} existant et le shader du triangle copié à côté de l’exécutable :"
concepts.shaders.compilation.guidance: "{vSMain} doit correspondre exactement au nom du point d’entrée dans le fichier de shader. Gardez les objets de shader valides lors de la création du pipeline, puis libérez-les après la création du pipeline, comme indiqué dans {link}. Effectuez cette initialisation une seule fois plutôt que de recompiler à chaque image."
concepts.shaders.compilation.guidance.link: Premier triangle
concepts.shaders.compilation.title: Compiler un point d’entrée pour le contexte sélectionné
concepts.shaders.description: "Un shader reçoit des données fournies par l’application. Les attributs de sommets décrivent des sommets individuels ; les tampons contiennent des paramètres ou des tableaux ; les handles de ressources identifient d’autres ressources auxquelles le shader accédera. Les déclarations C# et les déclarations Slang doivent s’accorder sur la signification de ces valeurs. Faire correspondre un nom de champ ne suffit pas : l’agencement, l’accès aux ressources et la liaison doivent tous concorder."
concepts.shaders.dispatch.description: "{dispatch} prend le nombre de groupes de threads. Le point d’entrée {numthreads} de l’exemple de calcul exécute 16 × 16 threads par groupe. Divisez les dimensions de l’image par 16 et arrondissez au supérieur pour trouver le nombre de groupes. Par exemple, une image de 17 × 19 nécessite 2 × 2 groupes. Le shader vérifie ses coordonnées de pixel par rapport aux dimensions de l’image car les derniers groupes peuvent contenir des threads en dehors de l’image."
concepts.shaders.dispatch.details: Le compilateur stocke la taille de groupe déclarée du point d’entrée dans {shaderDescThreadGroupSize} ; il ne convertit pas les dimensions en pixels fournies à {dispatch} en nombres de groupes. Utilisez {computeShaderRendererCs} avec son shader pour l’exemple complet de liaison et de dispatch, et {link} avant qu’une autre passe ne consomme la sortie.
concepts.shaders.dispatch.details.link: Synchronisation
concepts.shaders.dispatch.title: Dispatcher des groupes de threads, pas des pixels
concepts.shaders.layout.context: "Les {link} rendent leurs décalages explicites. Cette déclaration nécessite {systemRuntimeInteropServices} et {zenithNET} dans la portée :"
concepts.shaders.layout.context.link: "constantes C# de l’exemple de calcul"
concepts.shaders.layout.description: "Pour l’entrée de sommets, l’{inputLayout} du pipeline décrit les formats, décalages, le stride et les sémantiques. La position {float3} du triangle suivie d’une couleur {float4} occupe 28 octets, la couleur étant à l’octet 12. {inputLayoutAdd} calcule cet agencement compacté ; il n’inspecte pas la structure C#. Si les champs C# contiennent du remplissage, fournissez un agencement correspondant au lieu de supposer que les champs sont compactés."
concepts.shaders.layout.details: "Les tampons de constantes contiennent des paramètres de shader, tandis que les tampons structurés contiennent des tableaux d’éléments d’un type déclaré. Tous deux sont lus conformément à leurs déclarations Slang. Ils n’utilisent pas {inputLayout}. Vérifiez les décalages de champs et les tailles d’éléments pour la représentation compilée du shader, y compris le remplissage. Un type C# non managé est adapté pour être copié en tant qu’octets, mais cela ne prouve pas à lui seul qu’il correspond à un type de shader. En particulier, n’appliquez pas l’agencement {float3} étroitement compacté d’un sommet à chaque tampon de shader."
concepts.shaders.layout.guidance: Un handle de ressource est une petite valeur qui fait référence à une ressource existante. Copier le handle dans un tampon de constantes ne copie pas le contenu de la ressource.
concepts.shaders.layout.notes: "La déclaration correspondante dans {computeShaderSlang} est :"
concepts.shaders.layout.reference: "Les dimensions occupent les huit premiers octets, suivies de deux handles de ressources de huit octets. L’exemple C# réserve 256 octets au total. Cette taille est la taille de stockage choisie par l’exemple, et non une règle selon laquelle toutes les structures Slang ou charges utiles de constantes occuperaient 256 octets. Remplir la taille totale ne corrige pas non plus un champ au mauvais décalage."
concepts.shaders.layout.title: L’entrée de sommets et les données de shaders ont des règles d’agencement différentes
concepts.shaders.matrices.description: "Le compilateur demande un stockage des matrices par lignes (row-major), où les éléments de chaque ligne sont contigus. Le {link} place trois valeurs {matrix4x4} aux décalages 0, 64 et 128. Son {detail} utilise {mulVectorMatrix} dans l’ordre modèle, vue et projection."
concepts.shaders.matrices.description.detail: shader
concepts.shaders.matrices.description.link: moteur de rendu du cube en rotation
concepts.shaders.matrices.details: L’ordre de stockage détermine la façon dont les éléments de la matrice occupent la mémoire ; l’ordre de multiplication détermine la transformation. Maintenez les deux côtés cohérents. Ajouter une transposition sans vérifier ces deux choix peut masquer une incohérence tout en en introduisant une autre.
concepts.shaders.matrices.title: Maintenir cohérents le stockage et la multiplication des matrices
concepts.shaders.title: Données de shaders et liaison
concepts.synchronization.backends.description: DirectX 12 et Vulkan encodent les transitions de texture avec des informations de layout et d’accès. Metal n’a aucune opération dans l’implémentation de {transition} de Zenith.NET. Metal regroupe le travail enregistré dans des encodeurs de rendu et de calcul. Le backend insère des barrières de visibilité lorsqu’il termine ces groupes, rendant les écritures antérieures disponibles pour le travail ultérieur. Des appels explicites à {barrier} gèrent des dépendances telles que des dispatches de calcul successifs au sein du même encodeur.
concepts.synchronization.backends.details: Cette distinction est importante lors de la modification d’une charge de travail. Dans l’{link}, le dispatch est suivi d’une passe de rendu graphique, ce qui crée également une limite d’encodeur sur Metal. Deux dispatches de calcul dépendants ne créent pas cette limite simplement en modifiant le layout déclaré de la texture. Conservez les transitions requises par l’API partagée et identifiez séparément la dépendance entre les commandes réelles de production et de consommation.
concepts.synchronization.backends.details.link: exemple de calcul
concepts.synchronization.backends.title: Une transition n’est pas identique sur chaque backend
concepts.synchronization.barriers.context: "{barrierStagesAll} est une portée plus large, pas un détecteur automatique de dépendances. Sélectionnez des étapes qui couvrent réellement le travail et utilisez-les uniquement sur une file qui prend en charge ces opérations."
concepts.synchronization.barriers.description: "Considérez deux dispatches de calcul : le premier écrit des données de simulation et le second lit ces données pour effectuer l’étape suivante. Les deux utilisent des tampons de stockage, il n’y a donc pas de layout de texture à modifier. Insérez ceci entre les dispatches sur leur tampon de commandes :"
concepts.synchronization.barriers.details: Le premier argument identifie l’étape productrice et le second l’étape consommatrice. La barrière établit la dépendance d’exécution et de mémoire correspondante sur le GPU. Le backend traduit ces étapes en ses règles d’exécution et d’accès mémoire. Cette barrière ne change pas le layout d’une texture et n’attend pas tout le travail sur le périphérique.
concepts.synchronization.barriers.guidance: "La {link} utilise ce modèle entre des dispatches dépendants. Placez la barrière là où se trouve la dépendance. Une barrière enregistrée après le consommateur ne peut pas ordonner ce consommateur après un producteur antérieur."
concepts.synchronization.barriers.guidance.link: simulation FluidTank
concepts.synchronization.barriers.title: Ordonner les commandes dépendantes avec une barrière
concepts.synchronization.dependencies.description: Pour chaque ressource partagée, identifiez l’opération qui y accède en premier, l’opération qui suit et si l’un des accès effectue une écriture. Lire les mêmes données deux fois ne nécessite aucun ordonnancement pour protéger leur contenu, bien que les changements de layout ou la présentation puissent imposer d’autres exigences. Une écriture suivie d’une lecture, une lecture suivie d’un écrasement ou deux écritures peuvent nécessiter une dépendance.
concepts.synchronization.dependencies.details: "Choisissez ensuite le mécanisme selon l’endroit où ces opérations s’exécutent :"
concepts.synchronization.dependencies.guidance: Ces mécanismes sont liés, mais ne sont pas interchangeables. La soumission de commandes dans l’ordre ne remplace pas chaque dépendance mémoire. Une attente de file ne déclare pas un nouveau layout de texture, et une barrière de commandes n’attend pas sur le thread CPU appelant.
concepts.synchronization.dependencies.table.cpuAccess.mechanism: Appeler {wait} sur la valeur d’achèvement pertinente.
concepts.synchronization.dependencies.table.cpuAccess.situation: Le CPU doit attendre avant d’accéder aux données ou de les libérer
concepts.synchronization.dependencies.table.crossQueue.mechanism: Passer sa {timelineValue} au {submit} du tampon de commandes consommateur.
concepts.synchronization.dependencies.table.crossQueue.situation: Une soumission sur une autre file produit les données
concepts.synchronization.dependencies.table.headings.mechanism: Mécanisme
concepts.synchronization.dependencies.table.headings.situation: Situation
concepts.synchronization.dependencies.table.layoutChange.mechanism: "{commandBufferTransition} avec ses layouts précédent et suivant."
concepts.synchronization.dependencies.table.layoutChange.situation: Une sous-ressource de texture modifie sa façon d’être utilisée
concepts.synchronization.dependencies.table.pipelineStages.mechanism: "{commandBufferBarrier} avec les étapes productrice et consommatrice."
concepts.synchronization.dependencies.table.pipelineStages.situation: Étapes GPU dépendantes dans un flux de commandes
concepts.synchronization.dependencies.title: Commencer par le producteur et le consommateur
concepts.synchronization.description: "Une commande qui lit des données écrites par une commande antérieure dépend de l’achèvement et de la visibilité de ces écritures. L’opération qui écrit est le producteur ; celle qui lit est le consommateur. Le CPU a aussi besoin d’un point d’achèvement avant de lire, d’écraser ou de libérer des données partagées. Zenith.NET fournit des barrières, des transitions de texture et des lignes de temps pour ces différentes dépendances."
concepts.synchronization.layouts.context: "{undefined} signifie que le contenu précédent n’a pas besoin d’être préservé. Il convient pour une nouvelle image ou un attachement qui sera entièrement effacé. Ce n’est pas un moyen d’éviter de suivre le layout d’une image dont le contenu sera chargé, échantillonné ou accumulé."
concepts.synchronization.layouts.description: "Les indicateurs d’usage décrivent les rôles pris en charge par une texture. {textureLayout} décrit comment une sous-ressource particulière sera accessible pour une opération. Une sous-ressource est un niveau mip et une couche de tableau sélectionnés. Changer son layout prépare cet accès ; cela ne convertit pas la texture en un format de pixel différent. Par exemple, l’exemple de calcul écrit une texture de sortie au layout {storage}, puis l’échantillonne dans une passe graphique. Entre ces usages, il enregistre :"
concepts.synchronization.layouts.details: Ce fragment suppose que {outputTexture} a été créée avec l’usage {sampledStorage} et que sa sous-ressource sélectionnée est au layout {storage}. {default} sélectionne le niveau mip 0 et la couche de tableau 0. L’opération ne fait pas la transition de chaque mip ou couche d’une texture.
concepts.synchronization.layouts.guidance: L’application fournit le layout précédent. {transition} ne maintient pas de suivi de layout visible par l’application et ne déduit pas cette valeur à partir de commandes antérieures. Suivez le layout partout où une ressource passe entre des étapes de rendu.
concepts.synchronization.layouts.title: Suivre le layout de chaque sous-ressource de texture
concepts.synchronization.readback.description: "{isCompleted} interroge uniquement si la ligne de temps du GPU a atteint une valeur. Il ne récupère pas lui-même les tampons de commandes et ne copie pas les téléchargements intermédiaires dans le pointeur de destination de l’application."
concepts.synchronization.readback.details: "{commandBufferDownload} enregistre d’abord une copie dans le stockage interne de lecture. Lorsque le tampon de commandes terminé est réinitialisé pour être réutilisé, le CPU copie les données vers le pointeur fourni. Gardez la destination valide et la mémoire managée épinglée jusqu’au retour de {wait} pour cette soumission de lecture. Lisez les données ou libérez la mémoire seulement ensuite. Attendre une soumission ultérieure d’une autre file n’interroge pas la file qui gère la lecture."
concepts.synchronization.readback.guidance: "Interroger {isCompleted} puis lire immédiatement la destination d’une lecture asynchrone ne suffit donc pas. Consultez {link} pour les chemins de copie directe et de transfert intermédiaire."
concepts.synchronization.readback.guidance.link: Gestion des ressources
concepts.synchronization.readback.title: L’achèvement GPU et les données CPU téléchargées sont des étapes distinctes
concepts.synchronization.reuse.description: Pour un premier moteur de rendu, une attente immédiate après chaque image est simple. Pour faire chevaucher le travail, donnez aux images en cours des données modifiables distinctes et conservez la valeur d’achèvement de l’utilisation finale de chaque image. Avant de mettre à jour un tampon de constantes, de remplacer une texture ou de libérer un pipeline, terminez chaque accès en attente à la ressource affectée.
concepts.synchronization.reuse.details: Lors d’un redimensionnement ou d’un arrêt, arrêtez les nouvelles utilisations avant d’attendre les anciennes. {swapChainResize}, la libération de ressources et la libération du contexte ne servent pas d’attentes générales pour le travail de l’application. Le triangle peut redimensionner en toute sécurité entre les rappels car chaque image précédente a déjà terminé sa soumission.
concepts.synchronization.reuse.guidance: Le {swapChainPresent} actuel signale et attend également sur la file graphique après son opération de présentation. La suppression de l’attente de soumission explicite du triangle n’établit donc pas à elle seule une boucle de présentation avec chevauchement. Une attente sur la file graphique ne dit rien non plus sur le travail indépendant qui s’exécute encore sur une autre file.
concepts.synchronization.reuse.title: Ne réutiliser les données qu’après leur accès final
concepts.synchronization.timelines.context: "Avant que le CPU ne lise, n’écrase ou ne libère ces ressources, attendez leur utilisation finale :"
concepts.synchronization.timelines.description: Une ligne de temps suit l’achèvement sur une file à l’aide de valeurs croissantes. {submit} renvoie une {timelineValue} contenant cette ligne de temps et la valeur associée à la soumission. Les valeurs d’achèvement de différentes lignes de temps ne sont pas comparables uniquement par leurs champs numériques {value}.
concepts.synchronization.timelines.details: "Supposons que {producer} et {consumer} sont des tampons de commandes déjà enregistrés provenant de deux files du même contexte. Le producteur écrit des données que le consommateur utilise. Soumettez-les comme ceci :"
concepts.synchronization.timelines.guidance: Passer la valeur produite amène la file consommatrice à l’attendre sur le GPU. Le CPU n’appelle pas {producedWait} ici. Gardez les ressources partagées valides jusqu’à ce que {consumed} soit terminé, et enregistrez tous les changements de layout de texture requis par le consommateur.
concepts.synchronization.timelines.notes: "{wait} attend cette valeur de ligne de temps, puis vérifie les soumissions terminées sur la file propriétaire. Les tampons de commandes terminés sont réinitialisés pour être réutilisés, et leurs téléchargements intermédiaires sont copiés dans les destinations CPU fournies. {queueTimelineSignal} peut également mettre en file d’attente un point d’achèvement après un travail déjà soumis à cette file. Appeler {signal} ne signifie pas que le GPU a déjà atteint ce point."
concepts.synchronization.timelines.title: Utiliser une ligne de temps pour l’achèvement et les transferts de files
concepts.synchronization.title: Synchronisation
