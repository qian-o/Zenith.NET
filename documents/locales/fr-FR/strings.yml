concepts.resources.textureUsages.description: "Les indicateurs d’usage de transfert décrivent le sens des copies GPU. L’accès CPU relève d’un choix distinct de placement mémoire, décrit plus bas."
concepts.resources.textureUsages.details: "Combiner des indicateurs d’usage déclare plusieurs rôles ; cela n’exécute pas les opérations et n’ordonne pas leurs accès. Les textures nécessitent toujours des choix adaptés de {link}, et leurs formats doivent prendre en charge les usages demandés sur le périphérique choisi."
