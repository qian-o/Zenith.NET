samples.workloads.table.cornellBox.example.link: CornellBox
samples.workloads.table.cornellBox.whatItDemonstratesAndRequires: "Tracé de chemins, débruitage, mappage tonal, agrandissement de l’image et contrôles ImGui. Nécessite la prise en charge du lancer de rayons et l’environnement de compilation de shaders pour le backend de bureau utilisé."
samples.workloads.table.fluidTank.example: "{link}"
samples.workloads.table.fluidTank.example.link: FluidTank
samples.workloads.table.fluidTank.whatItDemonstratesAndRequires: Simulation fluide par calcul, dépendances entre étapes de simulation et rendu de surface multipasse. Nécessite son backend de bureau et son environnement de compilation de shaders.
samples.workloads.table.headings.example: Exemple
