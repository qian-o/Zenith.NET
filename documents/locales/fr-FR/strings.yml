### YamlMime:Resources
concepts.execution.context.description: Un {graphicsContext} représente un périphérique backend et fournit ses files de graphisme, de calcul et de transfert. Créez les tampons, textures, shaders et pipelines pour une charge de travail via le même contexte. Une ressource ou un handle créé par un autre contexte ne peut pas simplement être lié aux tampons de commandes de celui-ci.
concepts.execution.context.details: Choisissez le backend pour la plateforme et la surface de présentation. L’API reste partagée, mais la prise en charge des périphériques compte toujours. {capabilities} expose le nom du périphérique et les indicateurs {rayTracingSupported} et {meshShadingSupported}. Vérifiez l’indicateur correspondant avant de créer une charge de travail optionnelle, comme le font les exemples {link} et {detail}. Ces indicateurs ne constituent pas une liste exhaustive des restrictions de format, de mémoire ou de plateforme.
concepts.execution.context.details.detail: mesh shading
concepts.execution.context.details.link: lancer de rayons
concepts.execution.context.title: Le contexte relie les ressources et les files
concepts.execution.description: Une application Zenith.NET crée des ressources GPU, enregistre des commandes qui les utilisent et soumet ces commandes à une file. Le CPU peut continuer pendant que le GPU exécute la soumission. Gardez les ressources valides jusqu’à ce que ce travail soit terminé, même après le retour des appels d’enregistrement.
concepts.execution.ownership.description: "Ici, la propriété signifie la responsabilité de la libération. Une référence C# maintient un objet managé accessible ; elle n’empêche pas un {dispose} explicite de détruire la ressource native. De même, la soumission d’une commande qui utilise un tampon ne transfère pas la propriété de ce tampon à la file."
concepts.execution.ownership.details: Lors de l’arrêt, cessez de soumettre de nouveaux travaux, attendez les dernières utilisations sur chaque file impliquée, libérez les ressources de l’application, puis libérez le contexte. La libération du contexte libère ses propres files et assistants internes ; elle n’attend pas tous les travaux de l’application et ne libère pas chaque ressource créée par l’application.
concepts.execution.ownership.guidance: Appliquez les mêmes règles de durée de vie pendant le rendu. Conservez la valeur d’achèvement pour la dernière utilisation d’une ressource afin de savoir quand ses octets peuvent être écrasés ou quand la ressource peut être remplacée. Consultez {link} pour les vues et les durées de vie des ressources sous-jacentes.
