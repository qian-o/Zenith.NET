samples.workloads.table.inkCanvas.example.link: InkCanvas
samples.workloads.table.inkCanvas.whatItDemonstratesAndRequires: Dessin Skia et gestion des entrées dans une fenêtre native. Nécessite le backend et la bibliothèque native Skia pour la plateforme cible.
samples.workloads.table.platformDetection.example: "{link}"
samples.workloads.table.platformDetection.example.link: PlatformDetection
samples.workloads.table.platformDetection.whatItDemonstratesAndRequires: Tente la création d’un contexte pour chaque backend et signale les fonctionnalités de l’appareil. Un échec de création de contexte est signalé comme non pris en charge ; ce résultat peut également indiquer un pilote manquant ou une dépendance d’exécution non satisfaite.
samples.workloads.title: Explorer des charges de travail plus vastes
tutorial.context.description: La fenêtre peut maintenant s’ouvrir, mais nous n’avons pas encore créé les objets GPU qui y effectueront le rendu. Un {graphicsContext} donne accès au backend graphique sélectionné et à ses files de commandes.
tutorial.context.details: "Insérez ce bloc {emphasis} :"
tutorial.context.details.emphasis: après les directives using, avant {iWindowWindow}
tutorial.context.guidance: Les branches sélectionnent DirectX 12 sous Windows, Metal sous macOS et Vulkan sous Linux. Le code de rendu qui suit utilise l’API partagée de Zenith.NET. Nous demandons la validation pendant le développement et affichons les messages signalés via {validationMessage}. Les diagnostics dépendent du backend et des composants de validation disponibles sur la machine.
tutorial.context.title: Créer le contexte graphique
tutorial.description: Créez une application console .NET qui ouvre une fenêtre et dessine un triangle avec un dégradé de couleurs fluide. Vous apprendrez comment les données de sommets, les shaders et l’état du pipeline fonctionnent ensemble, puis vous enregistrerez et soumettrez les commandes qui produisent l’image.
tutorial.details: Parcourez les sections dans l’ordre. Vous ouvrirez d’abord une fenêtre vide, puis afficherez une couleur d’arrière-plan, et enfin dessinerez le triangle. Chaque point de contrôle confirme une partie de l’application avant d’ajouter la suivante. L’initialisation s’exécute une fois ; le rappel de rendu enregistre une nouvelle image à chaque appel.
tutorial.draw.context: "Les arguments de {draw} sont :"
tutorial.draw.description: "Dans le rappel {windowRender}, remplacez {addTheTriangleDrawCommandsHereLater} par ces trois commandes, entre {beginRenderPass} et {endRenderPass} :"
tutorial.draw.details: "{setPipeline} sélectionne les shaders et l’état que nous venons de créer. Définissez-le avant de lier les données de sommets : le backend utilise l’agencement d’entrée du pipeline pour interpréter la liaison."
tutorial.draw.guidance: "{setVertexBufferVertexBuffer} lie le tampon en commençant au décalage d’octet 0 au slot d’entrée 0. Ce slot correspond à l’unique entrée dans {inputLayouts}. Il ne copie ni ne transfère à nouveau les données."
tutorial.draw.notes: Les commandes ne sont encore qu’enregistrées à ce stade. Les appels {submitWait} et {present} déjà présents à la fin du rappel de rendu exécutent le travail et affichent son résultat. L’effacement reste nécessaire car le triangle ne couvre qu’une partie de l’image ; l’arrière-plan doit également recevoir une couleur définie à chaque image.
tutorial.draw.table.firstInstance.meaning: Commencer la numérotation des instances à zéro.
tutorial.draw.table.firstVertex.meaning: Commencer avec le premier sommet dans le tampon.
tutorial.draw.table.headings.argument: Argument
tutorial.draw.table.headings.description: Valeur
tutorial.draw.table.headings.meaning: Signification
tutorial.draw.table.instanceCount.meaning: Dessiner une copie du triangle.
tutorial.draw.table.vertexCount.meaning: Lire trois sommets.
tutorial.draw.title: Dessiner le triangle à l’intérieur de la passe
tutorial.execution.description: "Compilez et exécutez depuis le répertoire {firstTriangle} :"
tutorial.execution.details: La fenêtre doit afficher un triangle avec un coin supérieur rouge, un coin inférieur droit vert et un coin inférieur gauche bleu sur un fond sombre. L’intérieur doit présenter un dégradé fluide entre ces couleurs.
tutorial.execution.guidance: Redimensionnez la fenêtre. Le rappel de redimensionnement met à jour les dimensions du tampon de trame et redimensionne la chaîne d’échange. La passe de rendu établit une fenêtre d’affichage correspondant à cette image. Étant donné que les positions des sommets restent en coordonnées normalisées, le triangle conserve la même fraction de la largeur et de la hauteur de la fenêtre ; changer le rapport d’aspect peut étirer sa forme. Préserver le rapport d’aspect d’un objet nécessite une stratégie de projection ou de fenêtre d’affichage, ce qui dépasse ce premier dessin.
tutorial.execution.title: Exécuter, redimensionner et fermer
tutorial.frame.commands.context: Après {endRenderPass}, la deuxième transition prépare l’image pour la présentation. {submit} termine l’enregistrement et soumet le tampon de commandes ; {wait} attend que le GPU termine cette soumission. {present} demande ensuite l’affichage de l’image rendue.
tutorial.frame.commands.description: Une passe de rendu regroupe les opérations de dessin qui utilisent les mêmes attachements. Ici, l’attachement de couleur est la texture de sortie de la chaîne d’échange, l’image qui reçoit notre dessin. {colorAttachmentClear} crée une description indiquant à la passe d’effacer à la couleur RGBA donnée et de conserver le résultat à la fin de la passe. {beginRenderPass} enregistre ces instructions ; le GPU effectue l’effacement après la soumission des commandes.
tutorial.frame.commands.details: Les crochets contiennent notre unique attachement de couleur. L’argument {null} signifie qu’il n’y a pas d’attachement de profondeur/stencil, qui stockerait les valeurs de profondeur et les masques de stencil pour les tests de profondeur et de stencil.
tutorial.frame.commands.guidance: "{beginRenderPass} définit une fenêtre d’affichage (viewport) et un découpage (scissor) couvrant l’attachement. La fenêtre d’affichage fait correspondre les coordonnées rendues aux pixels, et le découpage limite les pixels pouvant être écrits. Ces valeurs par défaut couvrent l’ensemble de la texture de sortie, ce dont ce triangle a besoin."
tutorial.frame.commands.title: Effacer, soumettre et présenter
tutorial.frame.description: Remplissez d’abord l’image avec une seule couleur d’arrière-plan. Cette opération s’appelle un effacement (clear). Si cette couleur apparaît dans la fenêtre, la surface, la soumission de commandes et le chemin de présentation fonctionnent ensemble. Ce point de contrôle vous permet de vérifier la boucle de trame avant d’ajouter de la géométrie et des shaders.
tutorial.frame.details: "Un rappel de rendu est du code que Silk.NET appelle lorsqu’il est temps de dessiner une image. Ce rappel n’a pas besoin de l’argument de temps écoulé de l’événement, il est donc nommé {value}. Enregistrez-le {emphasis} :"
tutorial.frame.details.emphasis: avant {windowRun}
tutorial.frame.target.description: "{graphicsQueueCommandBuffer} obtient un tampon de commandes dont l’enregistrement a déjà commencé. L’enregistrement décrit le travail pour le GPU ; il n’exécute pas ce travail immédiatement."
tutorial.frame.target.details: La première {transition} prépare la texture de sortie pour l’accès en attachement de couleur. {default} sélectionne le niveau mip 0 et la couche de tableau 0. Nous utilisons {undefined} comme layout précédent car nous allons effacer toute l’image et ignorer son contenu antérieur. Une passe qui doit préserver le contenu existant doit utiliser son layout précédent réel à la place.
tutorial.frame.target.guidance: Utilisez la texture de sortie actuelle de la chaîne d’échange à chaque image. La présentation peut modifier l’image disponible, de sorte qu’une texture enregistrée lors d’une image précédente n’est pas une cible de rendu de fenêtre permanente.
tutorial.frame.target.title: Préparer la texture de sortie
tutorial.frame.title: Afficher une couleur d’arrière-plan
tutorial.geometry.data.description: "Ajoutez ce tableau {emphasis}. Placez également les étapes suivantes de création des ressources avant ce rappel, dans l’ordre indiqué."
tutorial.geometry.data.description.emphasis: avant {windowRender}
tutorial.geometry.data.details: "Chaque entrée du tableau crée un {vertex}. Les deux expressions {new} internes créent sa position {vector3} et sa couleur {vector4}. Les sommets décrivent les coins supérieur, inférieur droit et inférieur gauche. Le shader de sommets fournira une quatrième coordonnée de position, {w}. Avec w égal à 1, x et y décrivent directement des coordonnées de périphérique normalisées : -1 et +1 sont les bords de l’image, et 0 est le centre. Ces coordonnées ne dépendent pas des dimensions en pixels de la fenêtre."
tutorial.geometry.data.guidance: Chaque couleur contient des composantes rouge, verte, bleue et alpha. Alpha vaut 1 aux trois coins. Les trois positions ont z = 0, ce qui les place dans le même plan. Ces positions n’ont pas besoin de caméra ni de matrice de transformation car elles décrivent déjà les coordonnées que nous voulons rendre. Pour ce triangle plat unique, nous désactiverons également le mélange et le test de profondeur et omettrons un tampon de profondeur.
tutorial.geometry.data.title: Choisir les coins
tutorial.geometry.description: Un sommet est un point associé aux données utilisées pour le dessiner. Notre triangle a trois sommets, un pour chaque coin. Chacun contient une position et une couleur. Le GPU interpolera les couleurs, calculant des valeurs intermédiaires à travers le triangle.
tutorial.geometry.format.description: "Ajoutez cette déclaration {emphasis} :"
tutorial.geometry.format.description.emphasis: à la fin de {programCs}, après les instructions de nettoyage
tutorial.geometry.format.details: "{file} limite ce type à {programCs}, et le constructeur initialise ses champs de position et de couleur. {layoutKindSequential} conserve les champs dans l’ordre de déclaration. {position} contient trois flottants 32 bits et {color} en contient quatre. Dans cette structure, la position commence à l’octet 0, la couleur commence à l’octet 12 et le sommet complet occupe 28 octets. Nous décrirons ce même agencement au pipeline graphique."
tutorial.geometry.format.title: Définir un sommet
tutorial.geometry.title: Fournir trois sommets au GPU
tutorial.geometry.upload.context: "{fixed} empêche le ramasse-miettes de déplacer le tableau pendant que son adresse est utilisée. Pour ce tampon accessible en écriture par le CPU, {upload} mappe, copie et démappe la mémoire avant de revenir, de sorte que le tableau n’a pas besoin de rester épinglé par la suite. Le tampon doit rester en vie tout au long du rendu, et le transfert ne doit avoir lieu qu’une seule fois car les sommets ne changent pas."
tutorial.geometry.upload.description: "Le tableau managé est constitué de données CPU. Un {buffer} donne au GPU un stockage dans lequel il peut lire les sommets. Après le tableau, ajoutez :"
tutorial.geometry.upload.details: "La taille totale est {sizeofVertexVerticesLength} : 28 octets par sommet, trois sommets, 84 octets en tout. {bufferUsagesVertex} autorise l’accès en entrée de sommets. {cpuWriteOnly} permet au CPU d’initialiser directement ce petit tampon. Le stride du descripteur enregistre la taille de l’élément ; l’agencement d’entrée que nous créons ci-dessous indiquera à la récupération des sommets comment lire les attributs individuels."
tutorial.geometry.upload.guidance: Créer un tampon ne le remplit pas. {upload} copie le tableau dans cette allocation en commençant au décalage d’octet de destination 0. Sa description source fournit un pointeur et le nombre d’octets à copier.
tutorial.geometry.upload.notes: Ajoutez {vertexBufferDispose} immédiatement avant {swapChainDispose} dans le nettoyage en bas de {programCs}. Pour une géométrie statique plus grande, {link} explique quand choisir un stockage réservé au GPU et des transferts à la place.
tutorial.geometry.upload.notes.link: Gestion des ressources
tutorial.geometry.upload.title: Allouer un tampon et transférer le tableau
tutorial.input.description: "Les octets de sommets et les shaders sont prêts. Décrivez ensuite comment le GPU doit lire chaque sommet. Un attribut est une valeur unique, telle que la position ou la couleur. L’agencement d’entrée donne à chaque attribut un format et un décalage d’octets ; le stride donne la distance en octets d’un sommet au suivant. Ajoutez ce bloc d’initialisation après la création du shader :"
tutorial.input.details: "{inputLayoutAdd} ajoute un élément au stride actuel et augmente ce stride de la taille de l’élément. Il n’inspecte pas la structure C#. Ici, il produit la correspondance suivante entre la mémoire CPU et les entrées du shader :"
tutorial.input.guidance: "Modifier l’ordre des champs C# ou le remplissage sans mettre à jour cette description amènerait le GPU à lire les mauvais octets. Le {semanticIndex} par défaut est zéro, correspondant à {pOSITION0} et {cOLOR0}. Les deux éléments appartiennent au même tampon, de sorte que le pipeline contiendra un agencement d’entrée et nous lierons ce tampon au slot 0."
tutorial.input.table.headings.byteOffset: Décalage d’octets
tutorial.input.table.headings.cField: "Champ C#"
tutorial.input.table.headings.format: Format
tutorial.input.table.headings.shaderInput: Entrée de shader
tutorial.input.table.nextVertex.cField: Sommet suivant
tutorial.input.table.nextVertex.format: "Stride total : 28 octets"
tutorial.input.table.nextVertex.shaderInput: Enregistrement d’entrée suivant
tutorial.input.table.vertexColor.format: "{float4} (16 octets)"
tutorial.input.table.vertexPosition.format: "{float3} (12 octets)"
tutorial.input.title: Décrire l’agencement d’entrée des sommets
tutorial.lifecycle.description: "L’application terminée répète cette séquence :"
tutorial.lifecycle.details: "Fermer la fenêtre met fin à {run}. Chaque image rendue a déjà attendu la fin de son travail GPU, nous pouvons donc maintenant libérer les ressources qu’elle a utilisées. Le nettoyage après {windowRun} doit être :"
tutorial.lifecycle.guidance: "Libérez la chaîne d’échange avant sa fenêtre native, et le contexte après toutes ses ressources. La file possède et recycle les tampons de commandes soumis ; la chaîne d’échange possède sa texture de sortie. Ces tampons de commandes et cette texture ne nécessitent donc pas d’appel {dispose} distinct dans cette application."
tutorial.lifecycle.title: Suivre le cycle de vie d’une image
tutorial.pipeline.behavior: "Après l’agencement d’entrée, ajoutez :"
tutorial.pipeline.context: "{cullNone} remplit le triangle sans éliminer aucune orientation de face. L’ordre de ses sommets détermine l’orientation de la face, donc la désactivation du culling empêche cet ordre de masquer notre premier triangle."
tutorial.pipeline.description: Nous avons maintenant des données de sommets, un agencement d’entrée et deux shaders. Le {graphicsPipeline} les connecte et spécifie comment le GPU assemble les sommets en primitives et écrit le résultat dans un attachement.
tutorial.pipeline.details: "Un pipeline combine des étapes de shader programmables avec des paramètres de fonction fixe, qui contrôlent les opérations GPU telles que l’assemblage de triangles, l’élimination des faces (culling) et le mélange. Pour ce triangle, choisissez ces paramètres :"
tutorial.pipeline.guidance: Le format de couleur provient de {swapChainDescFormat}. Il doit correspondre à l’image utilisée par la passe de rendu. {count1} signifie un échantillon par pixel.
tutorial.pipeline.item: "{triangleList} assemble chaque groupe consécutif de trois sommets en un triangle. Nous fournirons trois sommets et dessinerons une fois, de sorte qu’aucun tampon d’indices n’est nécessaire."
tutorial.pipeline.notes: "{depthNone} désactive les tests et l’écriture de profondeur, correspondant à la passe sans attachement de profondeur."
tutorial.pipeline.reference: "{opaque} désactive le mélange, de sorte que la couleur du shader de fragments remplace l’arrière-plan à l’intérieur du triangle."
tutorial.pipeline.title: Connecter les shaders et l’agencement de sommets
tutorial.pipeline.usage: Les objets de shader peuvent être libérés après la création du pipeline, comme dans le moteur de rendu d’exemple. Gardez le pipeline lui-même en vie pour chaque image qui dessine avec lui. Ajoutez {pipelineDispose} avant {vertexBufferDispose} dans le nettoyage. La création du pipeline est la dernière étape d’initialisation avant le rappel de rendu.
tutorial.pipeline.validation: La description du pipeline déclare la configuration d’attachement ; elle ne crée pas d’autre image. {inputLayouts} a une entrée car la position et la couleur sont stockées ensemble dans un seul tampon.
tutorial.presentation.title: Connecter le GPU à la fenêtre
tutorial.project.context: Activez {emphasis} ({allowUnsafeBlocks}) dans les paramètres de compilation du projet. Nous l’utiliserons pour transmettre des données de sommets au GPU et pour les appels natifs de l’assistant de fenêtre.
tutorial.project.context.emphasis: Autoriser le code non sécurisé
tutorial.project.description: "Créez le projet et accédez à son répertoire :"
tutorial.project.details: "Installez les paquets :"
tutorial.project.guidance: "{zenithNET} fournit l’API de rendu partagée. Les trois paquets de backend permettent au même programme de sélectionner l’implémentation adaptée à sa plateforme. {zenithNETCompiler} compile les shaders Slang – les petits programmes GPU que nous écrirons plus tard – pour cette implémentation. Silk.NET fournit la fenêtre et la boucle d’événements."
tutorial.project.title: Créer un projet console
tutorial.requirements.context: Vous pouvez suivre cette page à partir d’un projet vide. L’{link} et son {detail} sont disponibles comme référence pour les API de rendu et de fenêtrage utilisées ici.
tutorial.requirements.context.detail: hôte partagé
tutorial.requirements.context.link: exemple Bonjour triangle
tutorial.requirements.description: "Vous avez besoin du {emphasis}, d’un éditeur de code ou IDE et d’un ordinateur de bureau équipé d’un GPU et d’un pilote pris en charge par un backend de Zenith.NET. Une bonne connaissance de base de C# suffit ; les concepts graphiques sont introduits au fur et à mesure de leur utilisation. Il s’agit d’un projet console {net10} ordinaire. Un backend traduit les opérations de Zenith.NET en appels à une API graphique telle que DirectX 12, Metal ou Vulkan. L’application en choisit une au démarrage :"
tutorial.requirements.description.emphasis: SDK .NET 10
tutorial.requirements.details: Linux nécessite une session fenêtrée compatible X11 pour le chemin de gestion de fenêtre utilisé ici. Les fonctionnalités optionnelles de lancer de rayons et de mesh shading ne sont pas nécessaires pour ce triangle.
tutorial.requirements.guidance: Zenith.NET effectue le rendu dans une surface fournie par l’application. Silk.NET.Windowing créera la fenêtre de bureau et traitera ses événements. Sous macOS, la cible de présentation est une couche Metal ({cAMetalLayerCs}) ; l’assistant de fenêtre du tutoriel attache cette couche pour nous.
