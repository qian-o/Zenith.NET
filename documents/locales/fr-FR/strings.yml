concepts.resources.allocation.context: "Commencez par des ressources créées via le contexte, sauf si vous avez besoin de votre propre allocateur. Avec un tas, attendez la fin de tous les travaux GPU utilisant ses ressources, puis libérez les ressources placées avant de libérer le tas lui-même."
concepts.resources.allocation.description: "Un {heap} fournit de la mémoire dans laquelle vous placez les ressources à des décalages explicites en octets. L’application choisit ces décalages et suit les régions utilisées."
concepts.resources.allocation.details: "Avant de placer une ressource, utilisez {contextGetSizeAndAlignment} avec sa description exacte de tampon ou de texture. Choisissez un décalage multiple de l’alignement renvoyé, réservez la taille renvoyée et gardez la ressource dans les limites de la taille totale du tas. Les allocations encore utilisées ne doivent pas se chevaucher. Le stockage d’une texture peut inclure du remplissage et un alignement propres au backend ; multiplier le nombre de pixels par le nombre d’octets par pixel ne donne donc pas la taille de l’allocation."
concepts.resources.allocation.guidance: "Pour les tampons placés, faites correspondre la résidence du tampon à celle du tas. Utilisez des tas réservés au GPU pour les textures GPU ordinaires décrites ici. La taille et l’alignement sont des exigences de placement ; ils ne garantissent pas que toute ressource puisse être placée dans n’importe quel tas sur tous les backends."
concepts.resources.allocation.title: Placer des ressources dans un tas lorsqu’un contrôle d’allocation est requis
