reference.meta.description: Explorez les types et membres de Zenith.NET.
reference.navigation.core: Parcourir l’API principale.
reference.title: Référence de l’API
samples.computeShader.description: Convertit une image en niveaux de gris avec un dispatch de calcul et affiche la texture résultante. Il illustre les handles de ressources pour une texture d’entrée échantillonnée et une texture de sortie accessible en écriture, des nombres de groupes de threads arrondis au supérieur et une vérification des limites dans le shader. Conservez la ressource {assetsTexturesShokoPng} incluse ; le moteur de rendu la traite une fois et présente le résultat lors des images suivantes.
samples.computeShader.details: "{computeShaderRendererCs} · {computeShaderSlang}"
samples.computeShader.title: Shader de calcul
samples.cube.description: Ajoute le dessin indexé, les matrices de modèle, de vue et de projection dans un tampon de constantes, ainsi que le test de profondeur. La texture de profondeur est recréée lors du redimensionnement. Utilisez-le pour passer d’une géométrie dans l’espace de découpage à un objet transformé ; le moteur de rendu utilise un attachement de profondeur/stencil {d32FloatS8UInt}.
samples.cube.details: "{spinningCubeRendererCs} · {spinningCubeSlang}"
samples.cube.title: Cube en rotation
samples.description: "Choisissez un exemple ciblé pour la fonctionnalité que vous souhaitez étudier. Chaque exemple renvoie au moteur de rendu C# et à son shader Slang. Commencez par {link} si vous souhaitez une application complète expliquée à partir d’un projet vide."
samples.description.link: Premier triangle
samples.execution.description: "{link} contient six moteurs de rendu indépendants dans une seule application de bureau. Utilisez le SDK .NET 10 et un backend de bureau pris en charge, comme décrit ci-dessous. Compilez et exécutez l’application, puis choisissez un exemple dans le menu de la console :"
samples.execution.description.link: ZenithTutorials
samples.execution.details: L’hôte sélectionne DirectX 12 sous Windows, Metal sous macOS et Vulkan sous Linux. Utilisez un environnement de périphérique, pilote et compilateur de shaders pris en charge par le backend sélectionné. Le chemin de fenêtre Linux nécessite X11 ou XWayland. Le {link} déclare les dépendances de paquets et copie les ressources de shaders et de textures nécessaires au moment de l’exécution.
samples.execution.details.link: fichier de projet
samples.execution.guidance: Les exemples partagent le code de gestion des fenêtres et de présentation. Vous pouvez choisir n’importe quel exemple indépendamment selon la fonctionnalité que vous souhaitez étudier.
samples.execution.title: Exécuter les exemples du tutoriel
samples.host.description: "{appCs} crée le contexte, la fenêtre et la chaîne d’échange. Il obtient un tampon de commandes, appelle le moteur de rendu sélectionné, soumet l’image et la présente. {iRendererCs} définit les méthodes de mise à jour, de rendu, de redimensionnement et de libération du moteur de rendu."
samples.host.details: Le calcul et le lancer de rayons produisent des textures hors écran. {texturePresenterCs} et {presentTextureSlang} dessinent ces textures dans la texture de sortie de l’image en cours de rendu de la fenêtre. L’hôte conserve la propriété de la soumission et de la présentation de la chaîne d’échange.
samples.host.title: Hôte et présentation partagés
samples.indirectDrawing.description: Dessine plusieurs copies d’un cube à l’aide d’un tampon d’arguments indirects indexés et de données par instance dans un tampon structuré. Le CPU fournit les arguments de dessin et met à jour les transformations. Utilisez-le pour comprendre l’agencement des arguments indirects et l’accès du shader aux données d’instance avant d’ajouter des arguments générés par le GPU.
samples.indirectDrawing.details: "{indirectDrawingRendererCs} · {indirectDrawingSlang}"
samples.indirectDrawing.title: Dessin indirect
samples.meshShading.description: "Utilise un task shader pour écarter du rendu des instances de sphères et transmettre les indices des instances retenues à un mesh shader qui produit la géométrie. Le moteur de rendu vérifie {contextCapabilitiesMeshShadingSupported} avant de créer son pipeline. Cet exemple permet de suivre les handles de ressources et les données de charge utile entre les étapes de tâche et de maillage."
samples.meshShading.details: "{meshShadingRendererCs} · {meshShadingSlang}"
samples.meshShading.title: Mesh Shading
samples.rayTracing.description: Construit des structures d’accélération de bas et haut niveau pour un sol et des sphères procédurales, puis trace des requêtes de rayons en ligne dans un shader de calcul. Le moteur de rendu vérifie {contextCapabilitiesRayTracingSupported} avant de construire la charge de travail. Utilisez cet exemple pour les entrées de structure d’accélération et le parcours de rayons côté shader.
samples.rayTracing.details: "{rayTracingRendererCs} · {rayTracingSlang}"
samples.rayTracing.title: Lancer de rayons
samples.title: Exemples
samples.triangle.description: Crée un tampon de sommets et un agencement d’entrée correspondant, puis dessine trois sommets via un pipeline graphique. Utilisez-le pour relier la création de ressources aux commandes d’une passe de rendu.
samples.triangle.details: "{helloTriangleRendererCs} · {helloTriangleSlang} · {link}"
samples.triangle.details.link: Tutoriel complet
samples.triangle.title: Bonjour triangle
samples.workloads.description: "Le {link} du dépôt principal contient des applications qui combinent plusieurs fonctionnalités. Leurs projets font référence au code source de la bibliothèque. Depuis une copie locale de Zenith.NET, exécutez le projet choisi, par exemple :"
samples.workloads.description.link: répertoire Experiments
samples.workloads.details: Les expérimentations fenêtrées utilisent les mêmes choix d’hôtes pour Windows, macOS et Linux/X11. Pour dessiner au sein d’Avalonia, WinForms, WPF, WinUI/Uno ou MAUI, consultez {link} pour le cycle de vie des images du contrôle et les liens d’implémentation.
samples.workloads.details.link: Intégration de plateforme
