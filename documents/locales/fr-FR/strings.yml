concepts.platforms.surface.details: "Le handle doit correspondre au backend sélectionné :"
concepts.platforms.surface.guidance: Le fichier {appCs} du tutoriel montre les choix pour Windows, macOS et X11. Son hôte Linux fournit des handles Xlib ; l’utiliser dans une session Wayland nécessite XWayland. Une application Wayland native fournirait des handles différents via {surfaceWayland}.
