concepts.execution.recording.context: La file interroge l’achèvement et recycle les tampons de commandes terminés. Appelez {queueCommandBuffer} pour chaque nouvel enregistrement ; il peut renvoyer une instance recyclée. Ne libérez pas un tampon de commandes emprunté, ne le soumettez pas deux fois et ne continuez pas à y enregistrer après soumission. Enregistrez un tampon de commandes donné depuis un seul thread à la fois ; le verrouillage interne de la file ne protège pas contre les modifications simultanées d’un tampon de commandes.
concepts.execution.recording.description: "{queueCommandBuffer} renvoie un {commandBuffer} dont l’enregistrement a déjà commencé. Enregistrez les commandes et leurs dépendances, puis appelez {submit} une fois. La soumission met fin à l’enregistrement et renvoie une {timelineValue} identifiant un point d’achèvement sur cette file."
concepts.execution.recording.details: "Par exemple, après avoir enregistré une image dans {commandBuffer}, le tutoriel du triangle soumet ce tampon et attend son achèvement ainsi :"
concepts.execution.recording.guidance: "{submit} planifie le travail ; {wait} empêche le CPU de continuer jusqu’à ce que cette soumission soit terminée. L’enregistrement d’un dessin, la fin d’une passe de rendu et la soumission d’un tampon de commandes sont des opérations distinctes. Ni l’enregistrement du dessin ni la fin de la passe n’attendent le GPU."
concepts.execution.recording.title: L’enregistrement n’exécute pas les commandes
concepts.execution.title: Modèle d’exécution
concepts.platforms.description: Choisissez si votre application possède la fenêtre native et la boucle de trame ou si elle utilise un contrôle de rendu d’interface utilisateur. Ce choix détermine qui obtient la texture de sortie, soumet les commandes et présente le résultat. La texture de sortie est la texture utilisée comme sortie de l’image actuelle. Les travaux graphiques et de calcul hors écran ne nécessitent ni fenêtre ni chaîne d’échange.
concepts.platforms.frame.context: Ajoutez vos liaisons de pipeline et vos commandes de dessin à l’intérieur de cette passe. Terminez la passe avant de revenir. Ne soumettez pas le tampon de commandes fourni et ne présentez pas de manière indépendante, et ne libérez ni le tampon de commandes ni la texture de sortie. Si votre gestionnaire utilise la texture de sortie dans un autre layout, remettez-la en {colorAttachment} pour la transition finale du contrôle.
concepts.platforms.frame.description: Les intégrations implémentent {iZenithView}. L’application fournit son {graphicsContext}, met à jour les données de scène dans {updateRequested} et enregistre le rendu dans {renderRequested} à l’aide de {renderEventArgs}.
concepts.platforms.frame.details: "Le contrôle gère le déroulement complet de chaque image. Il obtient la texture de sortie et le tampon de commandes, fait passer la texture à {colorAttachment}, appelle les gestionnaires, puis effectue la soumission et la présentation requises par le framework."
concepts.platforms.frame.guidance: "Pour une {iZenithView} initialisée nommée {view}, avec un contexte attribué, ce gestionnaire enregistre une passe d’effacement complète. Il nécessite {usingZenithNET} :"
concepts.platforms.frame.notes: Les contrôles effectuent une transition depuis {undefined} au début de chaque image, de sorte que les applications ne peuvent pas compter sur la préservation du contenu précédent de la texture de sortie. Effacez ou rendez l’image requise à chaque image. Conservez l’accumulation persistante ou le rendu mis en cache dans une texture appartenant à l’application, puis affichez cette texture via la vue.
concepts.platforms.frame.reference: "{zenithViewHelperDrawableFormat} fournit le format de couleur par défaut des intégrations. Vérifiez la texture de sortie réelle de l’événement lors de la mise en correspondance des formats d’attachement, des nombres d’échantillons et des dimensions."
concepts.platforms.frame.title: Enregistrer dans l’image fournie par un contrôle d’interface utilisateur
concepts.platforms.integration.context: WinForms, WPF et la voie WinUI sous Windows nécessitent Windows. Les applications MAUI ont besoin de la charge de travail de leur plateforme cible et doivent enregistrer le gestionnaire de contrôle avec {useZenithView} ; voir {extensionsCs}. La prise en charge du framework et celle du backend doivent toutes deux être satisfaites.
concepts.platforms.integration.description: "Les contrôles partagent l’interface d’événements, mais ils ne présentent pas tous de la même manière :"
concepts.platforms.integration.details: La lecture de bitmap (bitmap readback) copie les pixels rendus dans la mémoire CPU avant que l’interface utilisateur ne les affiche. L’interopérabilité par texture partagée évite cette lecture, mais peut toujours nécessiter des copies et une synchronisation GPU. L’interface partagée {renderRequested} n’implique donc pas des coûts de présentation identiques ou des exigences d’interopérabilité native identiques.
concepts.platforms.integration.guidance: "Utilisez le paquet adapté au framework de l’application ; par exemple :"
