tutorial.requirements.title: Avant de commencer
tutorial.resize.context: "Exécutez à nouveau {dotnetRun}. La fenêtre devrait maintenant avoir un arrière-plan sombre uniforme qui continue de la remplir après le redimensionnement. Conservez ce rappel : le triangle sera dessiné à l’intérieur de sa passe de rendu existante."
tutorial.resize.description: "Les images de la chaîne d’échange doivent suivre les dimensions du tampon de trame. Utilisez {framebufferResize} pour répondre aux changements de taille de pixels, y compris les changements causés par la mise à l’échelle de l’affichage. Après le rappel de rendu, toujours avant {windowRun}, ajoutez :"
tutorial.resize.details: Silk.NET distingue les changements de taille de fenêtre des {link}. Nous avons besoin de ces derniers car la chaîne d’échange stocke des pixels. Une fenêtre réduite peut avoir un tampon de trame de taille zéro. Dans ce cas, les deux rappels ignorent leur travail GPU. Après un redimensionnement, la passe de rendu utilisera les nouvelles dimensions d’attachement pour sa fenêtre d’affichage et son découpage.
tutorial.resize.details.link: changements de taille du tampon de trame
tutorial.resize.guidance: Nous attendons après chaque soumission, de sorte qu’aucune image précédente n’utilise encore les images lorsque le gestionnaire de redimensionnement les remplace. L’implémentation actuelle de {present} attend également sur la file graphique. Cette boucle simple maintient le travail d’une image terminé avant que la suivante ne commence ; {link} couvre une planification plus avancée.
tutorial.resize.guidance.link: Synchronisation
tutorial.resize.title: Réagir au redimensionnement
tutorial.shaders.compilation.context: La compilation a lieu une fois lors de l’initialisation. {appContextBaseDirectory} localise le shader copié à côté de l’exécutable, indépendamment du répertoire de travail actuel. Ces shaders ne consomment que des entrées de sommets, il n’y a donc pas encore de tampons de constantes, de textures ou de handles de ressources à lier.
tutorial.shaders.compilation.description: Dans les propriétés du fichier pour {triangleSlang}, définissez {emphasis} sur {detail}. Cela rend le shader disponible à côté de l’exécutable.
tutorial.shaders.compilation.description.detail: Copier si plus récent
tutorial.shaders.compilation.description.emphasis: Copier dans le répertoire de sortie
tutorial.shaders.compilation.details: "Revenez à {programCs}. Après le transfert des sommets, ajoutez ces instructions d’initialisation avant le rappel de rendu :"
tutorial.shaders.compilation.guidance: "{zenithCompiler} renvoie une description de shader contenant le code pour l’API graphique demandée. {createShader} crée l’objet de backend correspondant. L’API graphique et les noms des points d’entrée sont tous deux importants : utilisez {contextGraphicsApi}, et écrivez {vSMain} et {fSMain} exactement comme dans le fichier Slang."
tutorial.shaders.compilation.title: Compiler pour le backend sélectionné
tutorial.shaders.context: "{fSInput} connecte la sortie du shader de sommets à l’entrée du shader de fragments. Lorsqu’il est écrit par le shader de sommets, {sVPOSITION} fournit une position dans l’espace de découpage : les quatre coordonnées que le GPU utilise pour déterminer ce qui se trouve à l’intérieur de l’image visible. {cOLOR0} transporte la couleur à interpoler entre les sommets. Les deux étapes doivent s’accorder sur son type et sa sémantique."
tutorial.shaders.description: Un shader est un programme exécuté par le GPU. Ce dessin a besoin d’un shader de sommets pour positionner les sommets et d’un shader de fragments pour produire les couleurs à l’intérieur du triangle. Nous les écrirons en Slang, un langage de shaders, et compilerons deux points d’entrée à partir du même fichier. Un point d’entrée est la fonction où l’exécution d’une étape de shader commence.
tutorial.shaders.details: "Créez {triangleSlang}, en commençant par ces deux structures :"
tutorial.shaders.fragment.description: "Ajoutez le point d’entrée de fragment au même fichier :"
tutorial.shaders.fragment.details: La rastérisation détermine les emplacements d’image que le triangle couvre. Elle produit des fragments (les données traitées par le shader de fragments) avec des couleurs de sommets interpolées sur la zone couverte. {fSMain} renvoie cette couleur interpolée via {sVTARGET}, qui identifie le premier attachement de couleur.
tutorial.shaders.fragment.guidance: L’interpolation de couleur des sommets est distincte du mélange d’attachement. Le mélange combine la sortie d’un fragment avec la couleur déjà stockée dans l’attachement. Notre état de mélange opaque désactive cette combinaison, de sorte que la couleur interpolée remplace l’arrière-plan à l’intérieur du triangle.
tutorial.shaders.fragment.title: Colorer les fragments
tutorial.shaders.guidance: "{vSInput} décrit ce que le shader de sommets reçoit depuis le tampon de sommets. Les sémantiques {pOSITION0} et {cOLOR0} identifient les entrées ; les noms de champs C# seuls n’établissent pas ce mappage."
tutorial.shaders.title: Écrire les deux étapes de shader
tutorial.shaders.vertex.description: "Ajoutez le point d’entrée de sommet à {triangleSlang} :"
tutorial.shaders.vertex.details: Le GPU appelle ce point d’entrée pour chaque sommet d’entrée. Il ajoute la coordonnée homogène {w} à la position et transmet la couleur. Après l’étape de sommet, la position est divisée par w ; ici, cette division laisse x, y et z inchangés. C’est pourquoi les positions choisies ci-dessus peuvent être comprises directement en coordonnées de périphérique normalisées.
tutorial.shaders.vertex.title: Positionner chaque sommet
tutorial.surface.description: "Le contexte doit également savoir où afficher sa sortie. Ajoutez ce qui suit {emphasis} :"
tutorial.surface.description.emphasis: après {windowCenter} et avant {windowRun}
tutorial.surface.details: "{surface} décrit une cible de présentation native et ses dimensions en pixels. Le tampon de trame (framebuffer) est l’image de pixels associée à la fenêtre. {framebufferSize} donne ses dimensions en pixels ; les dimensions logiques de la fenêtre peuvent différer lorsque la mise à l’échelle de l’affichage est activée."
tutorial.surface.guidance: La surface correspond au backend sélectionné ci-dessus. Windows fournit un handle de fenêtre, Linux fournit un affichage et une fenêtre X11, et l’assistant macOS fournit la couche Metal attachée. C’est la seule partie spécifique à la plateforme pour connecter notre fenêtre au rendu.
tutorial.surface.title: Décrire la surface native
tutorial.swapChain.context: "La chaîne d’échange utilise à la fois le contexte et la fenêtre native. Remplacez la ligne {windowDispose} en bas de {programCs} par cet ordre de nettoyage :"
tutorial.swapChain.description: "Utilisez la description de surface pour créer les images qui seront présentées. Immédiatement après le bloc de surface, ajoutez :"
tutorial.swapChain.details: La {swapChain} gère les images affichées dans la fenêtre. À chaque image, {drawable} nous donne l’image actuelle sous forme de {texture}, le type d’API pour les données d’image. Après le dessin, {present} demande l’affichage du résultat et passe au drawable suivant.
tutorial.swapChain.guidance: "{b8G8R8A8UNorm} stocke quatre canaux de couleur de 8 bits dans l’ordre bleu, vert, rouge et alpha. {uNorm} signifie que les valeurs entières de 0 à 255 représentent des valeurs de 0 à 1. Le shader renverra toujours une valeur RGBA logique ; ce format détermine la façon dont ces canaux sont stockés dans l’image. Plus tard, le pipeline graphique utilisera {swapChainDescFormat} pour correspondre à cet attachement."
tutorial.swapChain.title: Créer la chaîne d’échange
tutorial.title: Premier triangle
tutorial.troubleshooting.description: "Lisez d’abord toute erreur dans la console, puis utilisez les points de contrôle précédents pour identifier l’étape qui a échoué :"
tutorial.troubleshooting.details: Utilisez le {link} et le {detail} pour comparer les données de sommets, l’agencement d’entrée et l’opération de dessin. Cet exemple place la gestion des fenêtres et la soumission dans un hôte partagé ; ce tutoriel conserve le flux applicatif dans {programCs}. Poursuivez avec {context} pour apprendre le dessin indexé, les transformations et les tests de profondeur.
tutorial.troubleshooting.details.context: Cube en rotation
tutorial.troubleshooting.details.detail: shader Slang
tutorial.troubleshooting.details.link: moteur de rendu d’exemple
tutorial.troubleshooting.table.backend.check: Vérifiez que le backend sélectionné est pris en charge par l’appareil et le pilote graphique installé.
tutorial.troubleshooting.table.backend.symptom: La création du backend échoue
tutorial.troubleshooting.table.drawing.check: Vérifiez la taille du transfert, l’agencement d’entrée, la sélection du pipeline et le placement des commandes de dessin à l’intérieur de la passe de rendu.
tutorial.troubleshooting.table.drawing.symptom: L’arrière-plan apparaît mais pas le triangle
tutorial.troubleshooting.table.headings.check: Vérification
tutorial.troubleshooting.table.headings.symptom: Symptôme
tutorial.troubleshooting.table.input.check: Vérifiez le stride de 28 octets et les décalages de position/couleur de 0 et 12.
tutorial.troubleshooting.table.input.symptom: Les positions ou les couleurs des sommets sont corrompues
tutorial.troubleshooting.table.shaders.check: Vérifiez le fichier {triangleSlang} copié, l’orthographe du point d’entrée et le diagnostic signalé par le compilateur.
tutorial.troubleshooting.table.shaders.symptom: L’étape de couleur d’effacement fonctionne, mais le chargement des shaders échoue
tutorial.troubleshooting.table.window.check: Confirmez que le projet .NET se compile et que l’étape de fenêtre seule s’exécute dans une session de bureau. Sous Linux, vérifiez que X11 ou XWayland est disponible.
tutorial.troubleshooting.table.window.symptom: Aucune fenêtre ne s’ouvre
tutorial.troubleshooting.title: Vérifier l’étape qui a échoué
tutorial.window.context: "{usingZenithTutorials} importe l’espace de noms de l’assistant. Chaque fichier C# utilise ses propres directives using ordinaires, de sorte que l’importation d’interopérabilité est nécessaire dans les deux fichiers. L’alias {buffer} fait référence au type de tampon de Zenith.NET et le distingue de {systemBuffer}."
tutorial.window.description: Ajoutez {cocoaHelperCs} au projet, en conservant son espace de noms. Ajoutez {interopUsing} en haut de ce fichier, avant sa déclaration d’espace de noms. L’assistant attache une couche Metal à la fenêtre sous macOS ; les autres branches de plateforme ne l’appellent pas.
tutorial.window.details: "Remplacez le fichier {programCs} généré par le code suivant. Il utilise des instructions de niveau supérieur, qui s’exécutent dans l’ordre sans méthode {main} explicite. Les sections suivantes vous indiqueront où ajouter du code à ce même fichier :"
tutorial.window.guidance: "{graphicsAPINone} demande à Silk.NET de créer une fenêtre sans son propre contexte graphique. Nous allons créer ce contexte avec Zenith.NET. {initialize} crée la fenêtre native et rend ses handles disponibles. Un handle est un identifiant fourni par le système de fenêtrage. {center} centre la fenêtre et {run} traite les événements jusqu’à sa fermeture. L’exécution se poursuit ensuite vers {dispose}, qui libère la fenêtre."
tutorial.window.notes: Exécutez {dotnetRun}. Une fenêtre vide doit s’ouvrir et répondre au déplacement, au redimensionnement et à la fermeture. Son contenu n’est pas encore défini car nous n’avons soumis aucune commande de rendu. Fermez-la avant de continuer.
tutorial.window.title: Ouvrir une fenêtre
