concepts.execution.pipelines.description: Un pipeline graphique combine les shaders, l’agencement d’entrée des sommets, la règle d’assemblage des sommets en primitives, les formats d’attachement et l’état de rendu. Définissez-le avant de lier les données de sommets, d’indices ou de constantes et d’émettre des commandes de dessin. Ses formats d’attachement et son nombre d’échantillons doivent correspondre aux attachements de la passe de rendu.
concepts.execution.pipelines.details: Un pipeline de calcul fournit le point d’entrée de shader pour un dispatch, qui lance des groupes de threads GPU. Définissez-le ainsi que ses constantes avant le dispatch. Les dispatches de calcul appartiennent à l’extérieur des passes de rendu graphique. Changer de pipeline modifie la façon dont les commandes ultérieures interprètent leurs entrées ; liez les données requises par le pipeline sélectionné avant de l’utiliser.
concepts.execution.pipelines.guidance: Le {link} montre la séquence graphique complète. L’{detail} enregistre un dispatch suivi d’une passe graphique qui affiche le résultat.
concepts.execution.pipelines.guidance.detail: exemple de calcul
concepts.execution.pipelines.guidance.link: rappel de rendu du triangle
concepts.execution.pipelines.title: Un pipeline détermine comment les commandes interprètent les données
concepts.execution.queues.description: Commencez avec {graphicsQueue} lorsqu’une image combine dessin, calcul et copies. Conserver le travail dépendant sur une seule file rend son ordonnancement plus facile à suivre.
concepts.execution.queues.details: Une file accepte des lots de commandes pour exécution. Des files distinctes ne correspondent pas nécessairement à des moteurs matériels distincts, de sorte que leur travail peut ne pas s’exécuter simultanément. Utilisez une autre file lorsque la charge de travail peut bénéficier d’un chevauchement, et ajoutez une dépendance explicite lorsqu’une file consomme les résultats d’une autre file.
concepts.execution.queues.guidance: Lorsque des commandes ultérieures dépendent d’écritures antérieures, l’application doit également s’assurer que ces écritures sont disponibles pour les commandes ultérieures. La soumission des deux tampons de commandes à la même file n’établit pas automatiquement chaque dépendance de ce type. Les commandes peuvent utiliser différentes étapes de GPU, et les accès ultérieurs peuvent nécessiter une barrière ou une transition de texture. {link} explique la distinction entre ordre de soumission et visibilité des ressources.
