concepts.resources.description: "Choisissez la description d’une ressource selon les opérations qui l’utiliseront. Une texture qui reçoit un rendu, est échantillonnée par un shader et est relue par le CPU doit déclarer ces trois usages et assurer leur synchronisation. Le placement mémoire et la durée de vie de la ressource sont des décisions supplémentaires."
concepts.resources.memory.context: Pour un tampon accessible par le CPU, {map} fournit une adresse au CPU. Il n’attend pas que le GPU cesse d’accéder aux mêmes octets. {unmap} de même ne soumet aucun travail et n’attend pas l’achèvement. Avant d’écraser des données accessibles en écriture par le CPU, terminez les lectures GPU qui ont encore besoin de leur ancien contenu.
concepts.resources.memory.description: "Un {bufferDesc} possède un champ {residency}. Choisissez-le selon la manière dont le CPU et le GPU accèdent aux données :"
concepts.resources.memory.details: La résidence décrit l’accès CPU prévu à l’allocation. Elle n’implique pas que chaque périphérique dispose d’une mémoire physique CPU et GPU séparée. Le triangle utilise {cpuWriteOnly} pour initialiser directement un petit tampon de sommets. Un grand maillage statique peut plutôt bénéficier d’un stockage réservé au GPU avec un transfert unique.
concepts.resources.memory.guidance: "{textureDesc} ne possède aucun champ de résidence. Les textures ordinaires créées par le contexte utilisent un stockage GPU. Leur API publique fournit des opérations de transfert et de lecture pour les transferts de données CPU, sans exposer de méthode de mappage direct. Les tas explicites fournissent un contrôle de placement, décrit ci-dessous."
concepts.resources.memory.table.cpuReadOnly.cPUAccess: "Lire la mémoire mappée après la fin de la copie GPU."
concepts.resources.memory.table.cpuReadOnly.typicalRole: "Données produites par le GPU pour être relues par le CPU"
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: "Écrire dans la mémoire mappée après la fin des lectures GPU précédentes."
