concepts.platforms.integration.title: Elegir la ruta de presentación así como el marco de trabajo
concepts.platforms.lifecycle.context: Para una vista de interfaz de usuario, utilice {descWidth}, {descHeight}, {descFormat} y {descSampleCount} de la textura de salida del evento al crear recursos de renderizado coincidentes. El control determina la resolución de esa textura de salida; no asuma que sus dimensiones lógicas o escala de pantalla siempre son iguales a las dimensiones de la textura.
concepts.platforms.lifecycle.description: Para una cadena de intercambio nativa, pase las dimensiones del búfer de fotogramas en píxeles. Los tamaños de ventana expresados en unidades lógicas pueden diferir cuando la escala de pantalla está activada. Omita los búferes de fotogramas de tamaño cero, cambie el tamaño de la cadena de intercambio cuando cambie su tamaño de píxeles y obtenga {swapChainDrawable} para cada fotograma. La textura de salida es propiedad de la cadena de intercambio y puede cambiar después de la presentación o del cambio de tamaño.
concepts.platforms.lifecycle.details: "{swapChainResize} cambia las dimensiones de la superficie existente. {swapChainRefresh} reemplaza la descripción de la superficie, incluidos sus identificadores nativos. Antes de cualquiera de las operaciones, complete los usos pendientes de los recursos afectados. Libere la cadena de intercambio antes de destruir su destino de presentación nativo."
concepts.platforms.lifecycle.guidance: "Vuelva a crear texturas fuera de pantalla o de profundidad propiedad de la aplicación cuyo tamaño siga a la ventana y actualice las constantes que contengan sus identificadores. Una canalización puede seguir en uso a través de un cambio de tamaño cuando sus formatos de adjuntos y recuento de muestras siguen siendo compatibles. El {link} mantiene su canalización mientras reemplaza su textura de profundidad."
concepts.platforms.lifecycle.guidance.link: renderizador de cubo giratorio
concepts.platforms.lifecycle.title: Mantener el tamaño y el tiempo de vida de la textura de salida con su host
concepts.platforms.ownership.description: "La aplicación es propietaria del contexto que asigna y de los recursos que crea para renderizar. El control posee sus propios recursos de presentación. Cambiar la propiedad {graphicsContext} de la vista hace que el planificador recree los recursos del control; no recrea las canalizaciones, los búferes ni las texturas de la aplicación para el nuevo contexto."
concepts.platforms.ownership.details: Coordine el reemplazo de recursos con el ciclo de vida de los fotogramas de la vista. Detenga la actividad de fotogramas de la vista y finalice los usos pendientes de la GPU antes de liberar los recursos de la aplicación o el contexto asignado. Quitar una vista no transfiere la propiedad del contexto al control.
concepts.platforms.ownership.guidance: El archivo compartido {frameSchedulerCs} despacha el trabajo del fotograma a través del despachador de interfaz de usuario de la vista. Mantenga los controladores de fotogramas enfocados en actualizar y grabar el fotograma; el trabajo prolongado de la CPU allí también retrasa la interfaz de usuario.
concepts.platforms.ownership.title: Mantener los recursos de la aplicación fuera de la propiedad del control
concepts.platforms.surface.context: Que una biblioteca de ventanas o un marco de interfaz de usuario sea compatible con un sistema operativo no garantiza que el backend de GPU seleccionado esté disponible allí. Las funciones del dispositivo, los controladores y la compatibilidad con superficies nativas aún deben coincidir. Compruebe el trazado de rayos y el sombreado de mallas opcionales a través de {contextCapabilities} antes de crear esas cargas de trabajo.
concepts.platforms.surface.description: El {link} utiliza Silk.NET para crear una ventana y procesar eventos. Zenith.NET se conecta a esa ventana a través de una descripción de {surface} y una {swapChain}. Una superficie contiene identificadores y dimensiones nativas; construir la descripción no crea ni posee la ventana del sistema operativo.
concepts.platforms.surface.description.link: triángulo
concepts.platforms.surface.details: "El identificador debe coincidir con el backend seleccionado:"
concepts.platforms.surface.guidance: El archivo {appCs} del tutorial muestra las opciones de Windows, macOS y X11. Su host de Linux suministra identificadores Xlib; usarlo en una sesión Wayland requiere XWayland. Una aplicación nativa de Wayland suministraría diferentes identificadores a través de {surfaceWayland}.
