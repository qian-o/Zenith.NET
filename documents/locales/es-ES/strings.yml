tutorial.context.details: 'Inserte la inicialización del contexto {emphasis}:'
tutorial.context.details.emphasis: 'después de las directivas using, antes de {iWindowWindow}'
tutorial.context.guidance: 'Cada rama selecciona un backend para la plataforma actual y solicita la validación para ayudar a identificar usos incorrectos de la API. Los mensajes de {validationMessage} aparecen en la consola.'
tutorial.context.imports: 'Añada las siguientes directivas using al principio de {programCs}:'
tutorial.context.title: 'Contexto gráfico'
tutorial.description: 'Este tutorial parte de un proyecto de consola .NET vacío para crear una aplicación que abre una ventana y dibuja un triángulo de colores.'
tutorial.details: 'El tutorial tiene tres puntos de comprobación: una ventana vacía, un fondo de color uniforme y el triángulo de colores. Ejecute la aplicación en cada uno antes de continuar con el siguiente paso.'
tutorial.draw.context: 'Los argumentos para {draw} son:'
tutorial.draw.description: 'En {windowRender}, sustituya {addTheTriangleDrawCommandsHereLater} por estos comandos entre {beginRenderPass} y {endRenderPass}:'
tutorial.draw.details: '{setPipeline} selecciona sombreadores y estado. Debe preceder al enlace de vértices porque el backend lo interpreta según la disposición de entrada de la canalización.'
tutorial.draw.guidance: '{setVertexBufferVertexBuffer} enlaza los datos de vértices ya cargados desde el desplazamiento de byte 0 a la ranura de entrada 0, que corresponde a la única entrada de {inputLayouts}.'
tutorial.draw.notes: 'Conserve el borrado al inicio de la pasada para que la zona exterior al triángulo tenga un color de fondo definido.'
tutorial.draw.table.firstInstance.meaning: 'Comenzar la numeración de instancias en cero.'
tutorial.draw.table.firstVertex.meaning: 'Comenzar con el primer vértice en el búfer.'
tutorial.draw.table.headings.argument: 'Argumento'
tutorial.draw.table.headings.description: 'Valor'
tutorial.draw.table.headings.meaning: 'Significado'
tutorial.draw.table.instanceCount.meaning: 'Dibujar una copia del triángulo.'
tutorial.draw.table.vertexCount.meaning: 'Leer tres vértices.'
tutorial.draw.title: 'Comandos de dibujo'
tutorial.execution.description: 'Compile y ejecute el proyecto {firstTriangle}.'
tutorial.execution.details: 'Debería aparecer un triángulo sobre un fondo oscuro, rojo arriba, verde abajo a la derecha y azul abajo a la izquierda. La interpolación de los colores de los vértices forma un degradado suave en el interior.'
tutorial.execution.guidance: 'Al redimensionar, cambian las dimensiones de la imagen en píxeles, pero las coordenadas de los vértices permanecen iguales. El área de visualización adapta esas coordenadas al nuevo ancho y alto, por lo que el triángulo se deforma si cambia la relación de aspecto de la ventana.'
tutorial.execution.title: 'Ejecución de la aplicación'
tutorial.frame.commands.context: 'Después de {endRenderPass}, la segunda transición prepara la textura de salida para su presentación. {submit} termina la grabación y envía el búfer de comandos; {wait} bloquea el hilo hasta que termina ese envío. A continuación, {present} solicita que se muestre la imagen renderizada.'
tutorial.frame.commands.description: 'Una pasada de renderizado agrupa las operaciones de dibujo que escriben en los mismos adjuntos. En esta pasada, la textura de salida de la cadena de intercambio recibe el color. {colorAttachmentClear} indica cómo inicializar ese adjunto con un color RGBA y conservar su contenido al terminar la pasada. {beginRenderPass} graba el inicio de la pasada con estos ajustes.'
tutorial.frame.commands.details: 'La colección contiene un adjunto de color. {null} indica que la pasada no tiene adjunto de profundidad y plantilla.'
tutorial.frame.commands.guidance: '{beginRenderPass} configura el área de visualización y el rectángulo de recorte para cubrir todo el adjunto. El área de visualización transforma las coordenadas de renderizado en posiciones de píxeles; el rectángulo de recorte limita los píxeles a los que pueden afectar las operaciones de dibujo.'
tutorial.frame.commands.title: 'Borrado, envío y presentación'
tutorial.frame.description: 'Comience por rellenar la ventana con un color de fondo. Esta operación se llama borrado. Cuando el fondo aparece, la superficie, el envío y la presentación ya funcionan juntos y se pueden añadir los vértices y los sombreadores del triángulo.'
tutorial.frame.details: 'Silk.NET invoca el callback de renderizado cuando corresponde producir un fotograma. Registre el callback {emphasis}:'
tutorial.frame.details.emphasis: 'antes de {windowRun}'
tutorial.frame.target.description: 'Una cola de comandos recibe el trabajo grabado para ejecutarlo en la GPU. {graphicsQueueCommandBuffer} devuelve un búfer de comandos de la cola gráfica, listo para grabar un fotograma. La grabación define el trabajo de la GPU; la ejecución comienza solo después del envío.'
tutorial.frame.target.details: 'La disposición de una textura describe el acceso que necesita una operación. La primera llamada a {transition} prepara la textura de salida para usarla como adjunto de color. Aquí, {default} selecciona el nivel de mip 0 y la capa 0 del array, es decir, la imagen base de la textura. Como esta pasada borra toda la imagen, {undefined} permite descartar su contenido anterior.'
tutorial.frame.target.guidance: 'Obtenga la textura de salida en cada fotograma, ya que la presentación puede seleccionar una imagen distinta.'
tutorial.frame.target.title: 'Preparación de la salida'
tutorial.frame.title: 'Primer fotograma'
tutorial.geometry.data.description: 'Añada el array de vértices {emphasis}. Mantenga también las siguientes inicializaciones de recursos antes de este callback, en el orden indicado.'
tutorial.geometry.data.description.emphasis: 'antes de {windowRender}'
tutorial.geometry.data.details: 'Las tres posiciones forman los vértices superior, inferior derecho e inferior izquierdo. En este ejemplo, x e y abarcan el intervalo de -1 a +1 en la imagen: 0 es el centro, el sentido positivo de x apunta a la derecha y el de y, hacia arriba.'
tutorial.geometry.data.guidance: 'Cada color tiene componentes rojo, verde, azul y alfa, con alfa igual a 1. Los tres vértices tienen z = 0 y están en el mismo plano.'
tutorial.geometry.data.title: 'Posiciones y colores'
tutorial.geometry.description: 'Cada uno de los tres vértices tiene una posición y un color. La GPU determina la forma del triángulo a partir de las posiciones e interpola los colores por su superficie.'
tutorial.geometry.format.description: 'Añada la declaración del vértice {emphasis}:'
tutorial.geometry.format.description.emphasis: 'al final de {programCs}, después de las instrucciones de limpieza'
tutorial.geometry.format.details: '{layoutKindSequential} mantiene los campos en su orden de declaración. {position} contiene tres valores de coma flotante de 32 bits y comienza en el desplazamiento de byte 0; {color} contiene cuatro y comienza en el desplazamiento de byte 12. Cada vértice ocupa, por tanto, 28 bytes. La disposición de entrada describirá esta organización para que la GPU lea los campos correctamente.'
tutorial.geometry.format.imports: 'Añada estas directivas using al principio de {programCs} para utilizar los tipos vectoriales y el atributo que define la disposición de la estructura:'
tutorial.geometry.format.title: 'Representación del vértice'
tutorial.geometry.title: 'Datos de vértices'
tutorial.geometry.upload.context: '{fixed} impide que el recolector de basura mueva el array mientras se usa su dirección. En este búfer escribible por la CPU, {upload} mapea la memoria, copia los bytes y deshace el mapeo antes de retornar. El array solo debe permanecer anclado durante la llamada. Cargue los vértices una vez durante la inicialización y conserve el búfer hasta que termine el renderizado.'
tutorial.geometry.upload.description: 'Guarde los vértices en un {buffer} para que la GPU pueda leerlos al dibujar. Añada la asignación y la carga de datos justo después del array:'
tutorial.geometry.upload.details: '{sizeofVertexVerticesLength} equivale a tres vértices de 28 bytes, 84 bytes en total. {bufferUsagesVertex} declara acceso de entrada, y {cpuWriteOnly} permite inicialización directa por CPU. El paso del descriptor registra el tamaño del elemento; la disposición posterior define cada atributo.'
tutorial.geometry.upload.guidance: 'La asignación no inicializa el contenido del búfer. {upload} copia el array al desplazamiento de destino 0 utilizando el puntero de origen y el número de bytes de la descripción de datos.'
tutorial.geometry.upload.imports: 'En {programCs}, añada {bufferAlias} a las directivas using para distinguir el tipo de búfer de Zenith.NET de {systemBuffer}.'
tutorial.geometry.upload.notes: "En el código de limpieza al final de {programCs}, coloque {vertexBufferDispose} justo antes de {swapChainDispose}."
tutorial.geometry.upload.title: 'Asignación y carga del búfer'
tutorial.input.description: 'La GPU necesita saber dónde se guardan los atributos de cada vértice, como la posición y el color. La disposición de entrada indica su formato y desplazamiento, además del paso: la distancia en bytes hasta el siguiente vértice. Añada este código después de crear los sombreadores:'
tutorial.input.details: '{inputLayoutAdd} sitúa cada atributo a continuación del anterior y suma su tamaño al paso entre vértices. Calcula los desplazamientos a partir de los formatos indicados, sin inspeccionar la estructura de C#. Para estos dos campos, la disposición resultante es:'
tutorial.input.guidance: 'El valor predeterminado de {semanticIndex} es cero, que corresponde a {pOSITION0} y {cOLOR0} en el sombreador. La posición y el color se almacenan juntos en un búfer de vértices, por lo que la canalización utiliza una sola disposición de entrada en la ranura 0. Si cambia el orden de los campos o el relleno de la estructura de C#, ajuste también esta disposición.'
tutorial.input.table.headings.byteOffset: 'Desplazamiento de bytes'
tutorial.input.table.headings.cField: 'Campo de C#'
tutorial.input.table.headings.format: 'Formato'
tutorial.input.table.headings.shaderInput: 'Entrada del sombreador'
tutorial.input.table.nextVertex.cField: 'Siguiente vértice'
tutorial.input.table.nextVertex.format: 'Paso total: 28 bytes'
tutorial.input.table.nextVertex.shaderInput: 'Siguiente registro de entrada'
tutorial.input.table.vertexColor.format: '{float4} (16 bytes)'
tutorial.input.table.vertexPosition.format: '{float3} (12 bytes)'
tutorial.input.title: 'Disposición de entrada de vértices'
tutorial.lifecycle.description: 'Cada fotograma sigue esta secuencia:'
tutorial.lifecycle.details: 'Al cerrar la ventana, {run} retorna y la ejecución continúa en el código de limpieza. Como la función de renderizado ya ha esperado a que terminen todos los fotogramas enviados, los recursos utilizados por sus comandos se pueden liberar. El bloque completo de limpieza después de {windowRun} es:'
tutorial.lifecycle.guidance: 'Libere la cadena de intercambio antes de destruir su ventana nativa y el contexto después de sus recursos. La cola recicla los búferes de comandos enviados, y la cadena de intercambio gestiona la textura de salida; ninguno necesita una llamada independiente a {dispose}.'
tutorial.pipeline.behavior: 'Tras la disposición de entrada, cree la canalización:'
tutorial.pipeline.context: '{cullNone} desactiva el descarte de caras, de modo que el triángulo se dibuja tanto si sus vértices aparecen en sentido horario como antihorario.'
tutorial.pipeline.description: 'Una {graphicsPipeline} reúne la disposición de los vértices, los dos sombreadores y los ajustes para ensamblar primitivas y escribir en los adjuntos.'
tutorial.pipeline.guidance: 'El formato debe coincidir con el adjunto de la pasada, por lo que procede de {swapChainDescFormat}. {count1} especifica una muestra por píxel.'
tutorial.pipeline.item: '{triangleList} ensambla cada grupo de tres vértices consecutivos en un triángulo.'
tutorial.pipeline.notes: '{depthNone} desactiva pruebas y escrituras de profundidad, de acuerdo con la ausencia de ese adjunto.'
tutorial.pipeline.reference: '{opaque} desactiva la mezcla. El color del fragmento sustituye así el fondo dentro del triángulo.'
tutorial.pipeline.title: 'Canalización gráfica'
tutorial.pipeline.usage: 'Los objetos de sombreador pueden liberarse tras crear la canalización. Mantenga la canalización durante el renderizado y añada {pipelineDispose} antes de {vertexBufferDispose} en la limpieza.'
tutorial.presentation.title: 'Contexto gráfico y presentación'
tutorial.project.context: 'Active {emphasis} ({allowUnsafeBlocks}) en la configuración de compilación. Las llamadas nativas de la clase auxiliar de la ventana y la carga de vértices necesitan código no seguro.'
tutorial.project.context.emphasis: 'Permitir código no seguro'
tutorial.project.description: 'Cree un proyecto de consola C# llamado {firstTriangle} que tenga como destino .NET 10.'
tutorial.project.details: 'Añada los siguientes paquetes NuGet al proyecto:'
tutorial.project.guidance: '{zenithNET} proporciona la API común de renderizado, y los tres paquetes de backend aportan sus implementaciones para cada plataforma. {zenithNETCompiler} compila los sombreadores Slang que se presentan a continuación para el backend seleccionado.'
tutorial.project.title: 'Configuración del proyecto'
tutorial.requirements.description: "Necesita el {emphasis} y conocimientos básicos de C#. La GPU y el controlador deben admitir el backend elegido para su plataforma:"
tutorial.requirements.description.emphasis: 'SDK de .NET 10'
tutorial.requirements.guidance: 'Zenith.NET renderiza en una superficie nativa proporcionada por la aplicación. Silk.NET.Windowing crea la ventana y procesa sus eventos.'
tutorial.requirements.table.headings.graphicsBackend: 'Backend gráfico'
tutorial.requirements.table.headings.platform: 'Plataforma'
tutorial.requirements.table.linux.graphicsBackend: 'Vulkan 1.4'
tutorial.requirements.table.linux.platform: 'Linux (X11 o XWayland)'
tutorial.requirements.table.macOS.graphicsBackend: 'Metal 4'
tutorial.requirements.table.macOS.platform: 'macOS'
tutorial.requirements.table.windows.graphicsBackend: 'DirectX 12'
tutorial.requirements.table.windows.platform: 'Windows'
tutorial.requirements.title: 'Requisitos previos'
tutorial.resize.context: 'Compile y ejecute la aplicación de nuevo. El fondo debe seguir ocupando toda la ventana al cambiar su tamaño. Conserve la función de renderizado; el triángulo se dibujará dentro de esta misma pasada.'
tutorial.resize.description: 'La cadena de intercambio debe adaptarse a los cambios de tamaño del búfer de fotogramas. Registre una función para {framebufferResize} después de la función de renderizado y antes de {windowRun}:'
tutorial.resize.details: 'Responda a los {link}, que se miden en píxeles, en lugar de a los cambios de tamaño lógico de la ventana. Si al minimizar la ventana alguna dimensión pasa a ser cero, la función de redimensionamiento mantiene la cadena de intercambio tal como está. La función de renderizado también retorna mientras alguna dimensión sea cero, de modo que el renderizado se reanuda cuando el búfer de fotogramas vuelve a tener un tamaño válido.'
tutorial.resize.details.link: 'cambios de tamaño del búfer de fotogramas'
tutorial.resize.guidance: 'La función de renderizado espera a que termine cada fotograma enviado antes de llamar a {present}. Por ello, la función de redimensionamiento puede sustituir las imágenes de la cadena de intercambio sin interrumpir trabajo de un fotograma anterior. El artículo {link} explica la relación entre la finalización del trabajo y la vida útil de los recursos.'
tutorial.resize.guidance.link: 'Sincronización'
tutorial.resize.title: 'Redimensionamiento'
tutorial.shaders.compilation.context: '{appContextBaseDirectory} permite cargar la copia del sombreador situada en el directorio de salida de la aplicación. Así, el archivo se busca en el mismo lugar aunque la aplicación se inicie desde otro directorio de trabajo.'
tutorial.shaders.compilation.description: 'Para {triangleSlang}, establezca {emphasis} en {detail}. La compilación copiará el archivo junto al ejecutable.'
tutorial.shaders.compilation.description.detail: 'Copiar si es posterior'
tutorial.shaders.compilation.description.emphasis: 'Copiar en el directorio de salida'
tutorial.shaders.compilation.details: 'En {programCs}, añada la inicialización de sombreadores después de cargar los vértices y antes del callback:'
tutorial.shaders.compilation.guidance: '{zenithCompiler} compila el código fuente para {contextGraphicsApi}, y {createShader} crea un objeto sombreador a partir de la descripción compilada. Los nombres de punto de entrada {vSMain} y {fSMain} seleccionan las dos funciones definidas en el archivo Slang.'
tutorial.shaders.compilation.title: 'Compilación de sombreadores'
tutorial.shaders.context: '{fSInput} conecta las dos etapas del sombreador. El sombreador de vértices escribe en {sVPOSITION} una posición en el espacio de recorte, que la GPU utiliza para determinar qué parte del triángulo es visible. El campo {cOLOR0} transporta el color del vértice, que se interpola sobre el triángulo antes de llegar al sombreador de fragmentos. Su tipo y su semántica deben coincidir en ambas etapas.'
tutorial.shaders.description: 'Los sombreadores son programas que se ejecutan en la GPU. El sombreador de vértices determina la posición de cada vértice, y el sombreador de fragmentos determina el color en cada posición cubierta de la imagen. Ambos se escribirán en un mismo archivo Slang, con un punto de entrada propio para cada etapa: la función por la que comienza su ejecución.'
tutorial.shaders.details: 'Cree {triangleSlang} en la raíz del proyecto con estas estructuras de entrada y salida:'
tutorial.shaders.fragment.description: 'Añada el punto de entrada de fragmentos al mismo archivo:'
tutorial.shaders.fragment.details: 'La rasterización determina qué zonas de la imagen cubre el triángulo y genera fragmentos en esas posiciones. Cada fragmento recibe un color interpolado a partir de los colores de los tres vértices. {fSMain} devuelve ese color, y {sVTARGET} dirige el resultado al primer adjunto de color.'
tutorial.shaders.fragment.title: 'Sombreado de fragmentos'
tutorial.shaders.guidance: '{vSInput} define las entradas del sombreador de vértices. {pOSITION0} y {cOLOR0} identifican atributos por semántica; los nombres C# no establecen esa correspondencia.'
tutorial.shaders.title: 'Etapas de sombreado'
tutorial.shaders.vertex.description: 'Añada el punto de entrada de vértices a {triangleSlang}:'
tutorial.shaders.vertex.details: 'La GPU ejecuta esta función para cada vértice de entrada. La función añade un cuarto componente a la posición, {w}, y transmite el color. Tras procesar los vértices, la GPU divide x, y y z entre w para obtener las coordenadas normalizadas del dispositivo. Como w vale 1, estos valores no cambian.'
tutorial.shaders.vertex.title: 'Sombreado de vértices'
tutorial.surface.description: 'Defina el destino de presentación nativo {emphasis}:'
tutorial.surface.description.emphasis: 'después de {windowCenter} y antes de {windowRun}'
tutorial.surface.details: 'El búfer de fotogramas es la imagen de la ventana en píxeles. {surface} describe el destino nativo de presentación y sus dimensiones; {framebufferSize} proporciona el tamaño en píxeles. Con el escalado de pantalla, este puede diferir del tamaño lógico de la ventana.'
tutorial.surface.guidance: 'La superficie proporciona los identificadores nativos del backend: una ventana Win32 en Windows, una pantalla y una ventana X11 en Linux o la capa Metal conectada en macOS.'
tutorial.surface.title: 'Superficie nativa'
tutorial.swapChain.context: 'La cadena depende del contexto y de la ventana. Sustituya {windowDispose} al final de {programCs} por este orden de liberación:'
tutorial.swapChain.description: 'Cree la cadena inmediatamente después de describir la superficie:'
tutorial.swapChain.details: 'La {swapChain} gestiona las imágenes presentadas. {drawable} suministra la actual como {texture}, el recurso de imagen de la API. Tras renderizar, {present} solicita mostrarla y avanza a la siguiente.'
tutorial.swapChain.guidance: '{b8G8R8A8UNorm} almacena cuatro canales de 8 bits en orden azul, verde, rojo y alfa. {uNorm} hace corresponder los valores enteros de 0–255 con valores de 0–1. La salida del sombreador sigue siendo un valor RGBA lógico; el formato especifica su representación en memoria.'
tutorial.swapChain.title: 'Cadena de intercambio'
tutorial.title: 'Primer triángulo'
tutorial.window.description: 'Descargue {cocoaHelperCs} en el directorio del proyecto. Esta clase auxiliar conecta la capa Metal a la ventana de macOS.'
tutorial.window.details: "Sustituya el contenido de {programCs} por el código siguiente:"
tutorial.window.guidance: '{graphicsAPINone} deja la creación del contexto gráfico a Zenith.NET. {initialize} crea la ventana nativa y permite acceder a los identificadores del sistema de ventanas. {center} la coloca en el centro de la pantalla. {run} procesa los eventos hasta que se cierra; después se ejecuta {dispose} para liberarla.'
tutorial.window.notes: 'Compile y ejecute la aplicación. Compruebe que puede abrir, mover, redimensionar y cerrar la ventana. Su contenido aún no está definido porque no se han enviado comandos de renderizado. Cierre la ventana antes de continuar.'
tutorial.window.title: 'Creación de la ventana'
