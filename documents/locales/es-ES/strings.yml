concepts.resources.allocation.context: "Empiece con recursos creados por el contexto, salvo que necesite su propio asignador de memoria. Al usar un montículo, espere a que termine todo el trabajo de GPU que utiliza sus recursos; después libere los recursos ubicados y, por último, el propio montículo."
concepts.resources.allocation.description: "Un {heap} proporciona memoria en la que se ubican recursos en desplazamientos explícitos en bytes. La aplicación elige esos desplazamientos y lleva el control de las regiones en uso."
concepts.resources.allocation.details: "Antes de ubicar un recurso, utilice {contextGetSizeAndAlignment} con su descripción exacta de búfer o textura. Elija un desplazamiento múltiplo de la alineación devuelta, reserve el tamaño devuelto y mantenga el recurso dentro del tamaño total del montículo. Las asignaciones en uso no deben solaparse. El almacenamiento de texturas puede incluir relleno y alineación específicos del backend; multiplicar el número de píxeles por los bytes por píxel no permite calcular el tamaño de la asignación."
concepts.resources.allocation.guidance: "Para los búferes ubicados, mantenga la residencia del búfer coherente con la del montículo. Utilice montículos exclusivos de GPU para las texturas de GPU ordinarias descritas aquí. El tamaño y la alineación son requisitos de ubicación, no una garantía de que cualquier recurso pueda ubicarse en cualquier montículo en todos los backends."
concepts.resources.allocation.title: Ubicar recursos en un montículo cuando se necesita control de asignación
