concepts.resources.memory.title: 'Acceso de CPU y ubicación de memoria'
concepts.resources.textureUsages.description: 'Los indicadores de transferencia describen si el recurso actúa como origen o destino de una copia en la GPU. La posibilidad de acceder directamente desde la CPU se decide por separado al elegir la ubicación de memoria.'
concepts.resources.textureUsages.details: 'Los indicadores de uso declaran las funciones que puede desempeñar una textura. Para pasar de una a otra se deben cumplir los requisitos de {link}; además, el dispositivo elegido debe admitir esos usos para el formato de la textura.'
concepts.resources.textureUsages.details.link: 'disposición y sincronización'
