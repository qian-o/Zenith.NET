concepts.execution.pipelines.description: "Una canalización de gráficos combina sombreadores, el diseño de entrada de vértices, la regla para ensamblar vértices en primitivas, formatos de adjuntos y estado de renderizado. Establézcala antes de enlazar datos de vértices, índices o constantes y de emitir comandos de dibujo. Sus formatos de adjuntos y recuento de muestras deben coincidir con los adjuntos de la pasada de renderizado."
concepts.execution.pipelines.details: Una canalización de cálculo proporciona el punto de entrada del sombreador para un dispatch, que inicia grupos de subprocesos de GPU. Establézcala y configure sus constantes antes del dispatching. Los dispatches de cálculo pertenecen a fuera de las pasadas de renderizado gráfico. Cambiar la canalización es un cambio en la forma en que los comandos posteriores interpretan sus entradas; enlace los datos requeridos por la canalización seleccionada antes de usarla.
concepts.execution.pipelines.guidance: "La {link} muestra la secuencia gráfica completa. El {detail} graba un dispatch seguido de una pasada gráfica que muestra el resultado."
concepts.execution.pipelines.guidance.detail: ejemplo de cálculo
concepts.execution.pipelines.guidance.link: devolución de llamada de renderizado del triángulo
concepts.execution.pipelines.title: Una canalización determina cómo interpretan los datos los comandos
concepts.execution.queues.description: Comience con {graphicsQueue} cuando un fotograma combine dibujo, cálculo y copias. Mantener el trabajo dependiente en una cola facilita seguir su ordenación.
concepts.execution.queues.details: Una cola acepta lotes de comandos para su ejecución. Las colas separadas no corresponden necesariamente a motores de hardware independientes, por lo que su trabajo podría no ejecutarse simultáneamente. Utilice otra cola cuando la carga de trabajo pueda beneficiarse de la superposición y agregue una dependencia explícita cuando una cola consuma los resultados de otra cola.
concepts.execution.queues.guidance: Cuando los comandos posteriores dependen de escrituras anteriores, la aplicación también debe asegurarse de que esas escrituras estén disponibles para los comandos posteriores. Enviar ambos búferes de comandos a la misma cola no establece automáticamente cada dependencia de este tipo. Los comandos pueden usar diferentes etapas de GPU, y los accesos posteriores pueden necesitar una barrera o una transición de textura. {link} explica la distinción entre el orden de envío y la visibilidad de los recursos.
concepts.execution.queues.guidance.link: Sincronización
