concepts.resources.bufferUsages.title: Usos de búfer
concepts.resources.description: "Elija la descripción de un recurso según las operaciones que lo utilizarán. Una textura que recibe renderizado, se muestrea en un sombreador y se descarga a la CPU necesita declarar esos tres usos y sincronizar los accesos entre ellos. La ubicación de memoria y el tiempo de vida del recurso son decisiones adicionales."
concepts.resources.memory.context: Para un búfer accesible por la CPU, {map} proporciona a la CPU una dirección. No espera a que la GPU deje de acceder a los mismos bytes. {unmap} igualmente no envía trabajo ni espera a que se complete. Antes de sobrescribir datos editables por la CPU, finalice las lecturas de GPU que aún necesiten su contenido anterior.
concepts.resources.memory.description: "Un {bufferDesc} tiene un campo {residency}. Elíjalo según cómo accederán a los datos la CPU y la GPU:"
concepts.resources.memory.details: La residencia describe el acceso previsto de la CPU a la asignación. No implica que cada dispositivo tenga memoria física de CPU y GPU separada. El triángulo utiliza {cpuWriteOnly} para inicializar un pequeño búfer de vértices directamente. Una malla estática grande puede beneficiarse en cambio del almacenamiento exclusivo de GPU con una carga única.
concepts.resources.memory.guidance: "{textureDesc} no tiene campo de residencia. Las texturas ordinarias creadas por el contexto utilizan almacenamiento de GPU. Su API pública proporciona operaciones de carga y descarga para transferir datos de CPU, sin exponer un método de mapeo directo. Los montículos explícitos permiten controlar la ubicación, como se explica más abajo."
concepts.resources.memory.table.cpuReadOnly.cPUAccess: "Leer la memoria mapeada después de que termine la copia de GPU."
concepts.resources.memory.table.cpuReadOnly.typicalRole: "Datos producidos por la GPU para su lectura en la CPU"
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: "Escribir la memoria mapeada cuando hayan terminado los lectores anteriores de GPU."
concepts.resources.memory.table.cpuWriteOnly.typicalRole: "Datos proporcionados o actualizados por la CPU"
concepts.resources.memory.table.gpuOnly.cPUAccess: "Transferir bytes mediante un búfer de carga o de lectura desde la GPU."
concepts.resources.memory.table.gpuOnly.typicalRole: "Geometría estática y datos de trabajo de la GPU"
