concepts.resources.title: Administración de recursos
concepts.resources.transfers.context: Una descarga graba una copia de GPU en el almacenamiento interno de lectura. La biblioteca copia esos bytes en el destino de CPU suministrado cuando restablece el búfer de comandos completado para su reutilización. Mantenga el destino asignado y mantenga la memoria administrada anclada hasta que regrese el {wait} del valor de envío.
concepts.resources.transfers.description: "Una carga copia datos de CPU a un recurso de GPU; una descarga copia datos del recurso a la memoria de CPU. Los métodos del propio recurso completan esa transferencia antes de devolver el control:"
concepts.resources.transfers.details: "Estas esperas cubren la transferencia que envían esos métodos. No descubren dependencias con otra cola que ya estuviera leyendo o escribiendo el recurso. Establezca esas dependencias antes de llamar al método del recurso. Una copia directa mediante memoria mapeada también exige que quien llama garantice la finalización del trabajo de GPU correspondiente."
concepts.resources.transfers.guidance: "Utilice {commandBufferUpload} o {commandBufferDownload} cuando las copias deban grabarse con otro trabajo. Los tiempos de vida de sus punteros difieren:"
concepts.resources.transfers.item: "Durante la llamada, una carga copia los datos de origen de CPU en un búfer de carga interno, también llamado memoria provisional o staging. El puntero de origen solo debe permanecer válido durante esa llamada."
concepts.resources.transfers.notes: "Para una textura, el paso de fila es la distancia en bytes entre filas consecutivas de datos de CPU, y el paso de corte es la distancia en bytes entre cortes de profundidad consecutivos. No describen la distribución interna de la textura en memoria de GPU. Consulte {link} para distinguir la finalización de GPU de la disponibilidad de los datos leídos."
concepts.resources.transfers.notes.link: Sincronización
concepts.resources.transfers.table.bufferDownload.transfer: Copia directa de CPU para {cpuReadOnly}; de lo contrario, envía una descarga en la cola de transferencia y espera.
concepts.resources.transfers.table.bufferUpload.transfer: Copia directa de CPU para {cpuWriteOnly}; de lo contrario, envía una carga en la cola de transferencia y espera.
concepts.resources.transfers.table.headings.method: Método
concepts.resources.transfers.table.headings.transfer: "Cómo transfiere los datos"
concepts.resources.transfers.table.textureTransfers.method: "{textureUpload} / {textureDownload}"
concepts.resources.transfers.table.textureTransfers.transfer: "Utiliza la cola gráfica, cambia el layout del subrecurso seleccionado para realizar la copia, lo cambia al layout final solicitado y espera a que termine la transferencia."
concepts.resources.transfers.title: "Elegir entre transferencias inmediatas y transferencias grabadas"
concepts.resources.usages.description: "{bufferUsages} y {textureUsages} son enumeraciones de indicadores que declaran los roles previstos de un recurso. Se asignan a {bufferDescUsages} y {textureDescUsages}, respectivamente. Una enumeración de indicadores permite combinar varios miembros con {value} cuando un recurso tiene más de un rol."
concepts.resources.usages.title: Declarar los usos requeridos antes de crear un recurso
concepts.resources.views.description: Una {bufferView} describe una región de búfer y su interpretación. Una {textureView} selecciona un tipo de textura compatible, un formato y un rango de subrecursos. Una vista comparte el almacenamiento de respaldo; no copia los datos ni añade usos que faltaban cuando se creó el recurso. Su rango tampoco es una garantía portátil de comprobación de límites en el sombreador.
concepts.resources.views.details: "Utilice el handle del propio recurso para su vista predeterminada, o cree una vista cuando necesite otra región o una interpretación compatible distinta. Mantenga referencias de C# a la vista y al recurso subyacente mientras el trabajo de GPU pueda utilizarlos; un handle de recurso por sí solo no mantiene vivo ninguno de los dos objetos. Libérelos únicamente tras su último uso en la GPU. Después de reemplazar cualquiera de ellos, actualice las constantes que contengan su antiguo {link}."
concepts.resources.views.details.link: "handle de recurso"
concepts.resources.views.guidance: El {link} muestra una textura de profundidad reemplazada al cambiar el tamaño. El {detail} muestra una textura de entrada que se mantiene separada de su salida editable. Ambos hacen que el tiempo de vida del recurso siga al trabajo que realmente lo utiliza.
concepts.resources.views.guidance.detail: ejemplo de cálculo
concepts.resources.views.guidance.link: renderizador de cubo giratorio
concepts.resources.views.title: "Mantener disponibles las vistas y sus recursos subyacentes durante su uso"
concepts.shaders.binding.context: "En el ejemplo de cálculo, {input} se llena con {inputTextureSampledHandle} y {output} con {outputTextureStorageHandle}. El {descriptorHandle} con tipo de Slang indica al sombreador cómo acceder a cada recurso:"
concepts.shaders.binding.description: "{setConstantBuffer} enlaza un búfer y un desplazamiento de bytes para los datos de constantes de la canalización actual. Enlaza el almacenamiento visible por GPU existente; no carga un valor de C#. Llene el búfer primero y asegúrese de que los lectores de GPU anteriores hayan finalizado antes de sobrescribir sus bytes."
concepts.shaders.binding.details: "Establezca la canalización antes de su búfer de constantes. Para una carga de trabajo de cálculo con recursos ya creados y cargados, la grabación utiliza este orden:"
concepts.shaders.binding.guidance: Este fragmento asume un {commandBuffer} de grabación, una {computePipeline}, un {constantBuffer} cargado con uso {bufferUsagesConstant} y los recuentos de grupos de subprocesos para la carga de trabajo. El desplazamiento 0 enlaza el inicio del búfer. Si varios registros de datos de constantes comparten un búfer, el desplazamiento inicial de cada registro debe cumplir con la alineación de enlace del backend. Ese requisito es independiente del diseño de campos dentro del registro.
concepts.shaders.binding.notes: "{resourceHandle} almacena dos campos de 32 bits, pero su interpretación pertenece al backend. No lo trate como un índice de descriptor universal, dirección o valor que se pueda transferir entre contextos. Un identificador no crea un recurso, no añade un uso faltante ni realiza sincronización."
concepts.shaders.binding.reference: Conserve referencias al recurso y a cualquier vista utilizada para obtener su identificador, y libérelos solo después de que se complete el último uso del sombreador. Al reemplazar una textura o vista, actualice las constantes que contengan su identificador anterior. {link} explica esa relación de tiempo de vida.
concepts.shaders.binding.reference.link: Administración de recursos
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: Leer elementos estructurados del tipo de sombreador {t}.
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: Leer o escribir elementos estructurados del tipo de sombreador {t}.
concepts.shaders.binding.table.headings.access: Acceso previsto
concepts.shaders.binding.table.headings.cHandle: "Identificador de C#"
concepts.shaders.binding.table.headings.slangFieldType: Tipo de campo Slang
concepts.shaders.binding.table.samplerHandle.access: Suministrar estado de muestreo de textura.
concepts.shaders.binding.table.textureSampledHandle.access: Leer una textura.
concepts.shaders.binding.table.textureStorageHandle.access: Leer o escribir una textura de almacenamiento.
concepts.shaders.binding.title: Enlazar el búfer de constantes y los recursos que describe
concepts.shaders.compilation.description: "{zenithCompiler} compila un punto de entrada de Slang con nombre y devuelve un {shaderDesc}. Utilice el {graphicsApi} del contexto para que el resultado se dirija al backend que creará el sombreador: DXIL para DirectX 12, una biblioteca Metal para Metal o SPIR-V para Vulkan."
concepts.shaders.compilation.details: "Por ejemplo, con un {context} existente y el sombreador del triángulo copiado junto al ejecutable:"
concepts.shaders.compilation.guidance: "{vSMain} debe coincidir exactamente con el nombre del punto de entrada en el archivo del sombreador. Mantenga válidos los objetos de sombreador mientras crea la canalización, luego libérelos después de la creación de la canalización, como se muestra en {link}. Realice esta inicialización una vez en lugar de recompilar en cada fotograma."
concepts.shaders.compilation.guidance.link: Primer triángulo
concepts.shaders.compilation.title: Compilar un punto de entrada para el contexto seleccionado
concepts.shaders.description: "Un sombreador recibe datos suministrados por la aplicación. Los atributos de vértice describen vértices individuales; los búferes contienen parámetros o matrices; los identificadores de recursos identifican otros recursos a los que accederá el sombreador. Las declaraciones de C# y las declaraciones de Slang deben coincidir en lo que significan esos valores. Hacer coincidir un nombre de campo no es suficiente: el diseño, el acceso a recursos y el enlace deben coincidir."
concepts.shaders.dispatch.description: "{dispatch} toma el número de grupos de subprocesos. El punto de entrada {numthreads} del ejemplo de cálculo ejecuta 16 × 16 subprocesos por grupo. Divida las dimensiones de la imagen entre 16 y redondee hacia arriba para encontrar los recuentos de grupos. Por ejemplo, una imagen de 17 × 19 necesita 2 × 2 grupos. El sombreador comprueba sus coordenadas de píxeles con las dimensiones de la imagen porque los últimos grupos pueden contener subprocesos fuera de la imagen."
concepts.shaders.dispatch.details: El compilador almacena el tamaño de grupo declarado del punto de entrada en {shaderDescThreadGroupSize}; no convierte las dimensiones en píxeles suministradas a {dispatch} en recuentos de grupos. Utilice {computeShaderRendererCs} con su sombreador para el ejemplo completo de enlace y dispatch, y {link} antes de que otra pasada consuma la salida.
concepts.shaders.dispatch.details.link: Sincronización
concepts.shaders.dispatch.title: Despachar grupos de subprocesos, no píxeles
concepts.shaders.layout.context: "Las {link} hacen explícitos sus desplazamientos. Esta declaración necesita {systemRuntimeInteropServices} y {zenithNET} en el ámbito:"
concepts.shaders.layout.context.link: "constantes de C# del ejemplo de cálculo"
concepts.shaders.layout.description: "Para la entrada de vértices, el {inputLayout} de la canalización describe formatos, desplazamientos, stride y semánticas. La posición {float3} del triángulo seguida de un color {float4} ocupa 28 bytes, con el color en el byte 12. {inputLayoutAdd} calcula este diseño empaquetado; no inspecciona la estructura de C#. Si los campos de C# contienen relleno, proporcione un diseño coincidente en lugar de asumir que los campos están empaquetados."
concepts.shaders.layout.details: "Los búferes de constantes contienen parámetros de sombreador, mientras que los búferes estructurados contienen matrices de elementos de un tipo declarado. Ambos se leen de acuerdo con sus declaraciones de Slang. No utilizan {inputLayout}. Verifique los desplazamientos de campos y los tamaños de elementos para la representación de sombreador compilada, incluido el relleno. Un tipo de C# no administrado es adecuado para copiarlo como bytes, pero eso por sí solo no demuestra que coincida con un tipo de sombreador. En particular, no aplique el diseño {float3} estrechamente empaquetado de un vértice a cada búfer de sombreador."
concepts.shaders.layout.guidance: Un identificador de recurso es un valor pequeño que hace referencia a un recurso existente. Copiar el identificador en un búfer de constantes no copia el contenido del recurso.
concepts.shaders.layout.notes: "La declaración correspondiente en {computeShaderSlang} es:"
concepts.shaders.layout.reference: "Las dimensiones ocupan los primeros ocho bytes, seguidas de dos identificadores de recursos de ocho bytes. El ejemplo de C# reserva 256 bytes en total. Ese tamaño es el tamaño de almacenamiento elegido por el ejemplo, no una regla de que todas las estructuras de Slang o cargas útiles de constantes deban ocupar 256 bytes. Rellenar el tamaño total tampoco corrige un campo en el desplazamiento incorrecto."
concepts.shaders.layout.title: La entrada de vértices y los datos de sombreadores tienen reglas de diseño diferentes
concepts.shaders.matrices.description: El compilador solicita almacenamiento de matrices en orden principal de filas (row-major), que almacena juntos los elementos de cada fila. El {link} coloca tres valores {matrix4x4} en los desplazamientos 0, 64 y 128. Su {detail} utiliza {mulVectorMatrix} en orden de modelo, vista y proyección.
concepts.shaders.matrices.description.detail: sombreador
concepts.shaders.matrices.description.link: renderizador de cubo giratorio
concepts.shaders.matrices.details: El orden de almacenamiento determina cómo ocupan memoria los elementos de la matriz; el orden de multiplicación determina la transformación. Mantenga ambos lados coherentes. Agregar una transposición sin verificar esas dos opciones puede ocultar una falta de coincidencia mientras introduce otra.
concepts.shaders.matrices.title: Mantener coherentes el almacenamiento y la multiplicación de matrices
concepts.shaders.title: Datos de sombreadores y enlace
concepts.synchronization.backends.description: DirectX 12 y Vulkan codifican transiciones de textura con información de layout y acceso. Metal no tiene ninguna operación en la implementación de {transition} de Zenith.NET. Metal agrupa el trabajo grabado en codificadores de renderizado y cálculo. El backend inserta barreras de visibilidad cuando finaliza estos grupos, haciendo que las escrituras anteriores estén disponibles para el trabajo posterior. Las llamadas explícitas a {barrier} manejan dependencias como dispatches de cálculo sucesivos dentro del mismo codificador.
concepts.synchronization.backends.details: Esta distinción es importante al cambiar una carga de trabajo. En el {link}, el dispatch va seguido de una pasada de renderizado gráfico, que también crea un límite de codificador en Metal. Dos dispatches de cálculo dependientes no crean ese límite simplemente cambiando el layout declarado de la textura. Conserve las transiciones requeridas por la API compartida e identifique por separado la dependencia entre los comandos reales de producción y consumo.
concepts.synchronization.backends.details.link: ejemplo de cálculo
concepts.synchronization.backends.title: Una transición no es idéntica en todos los backends
concepts.synchronization.barriers.context: "{barrierStagesAll} es un ámbito más amplio, no un detector automático de dependencias. Seleccione etapas que realmente cubran el trabajo y utilícelas solo en una cola que admita esas operaciones."
concepts.synchronization.barriers.description: "Considere dos dispatches de cálculo: el primero escribe datos de simulación y el segundo lee esos datos para realizar el siguiente paso. Ambos usan búferes de almacenamiento, por lo que no hay un layout de textura que cambiar. Inserte esto entre los dispatches en su búfer de comandos:"
concepts.synchronization.barriers.details: El primer argumento identifica la etapa productora y el segundo la etapa consumidora. La barrera establece la dependencia de ejecución y memoria correspondiente en la GPU. El backend traduce esas etapas a sus reglas de ejecución y acceso a memoria. Esta barrera no cambia el layout de una textura ni espera todo el trabajo en el dispositivo.
concepts.synchronization.barriers.guidance: "La {link} utiliza este patrón entre dispatches dependientes. Coloque la barrera donde se produce la dependencia. Una barrera grabada después del consumidor no puede ordenar ese consumidor después de un productor anterior."
concepts.synchronization.barriers.guidance.link: simulación FluidTank
concepts.synchronization.barriers.title: Ordenar comandos dependientes con una barrera
concepts.synchronization.dependencies.description: Para cada recurso compartido, identifique la operación que accede a él primero, la operación que le sigue y si alguno de los accesos escribe. Leer los mismos datos dos veces no requiere ordenación para proteger su contenido, aunque los cambios de layout o la presentación pueden imponer otros requisitos. Una escritura seguida de una lectura, una lectura seguida de una sobrescritura o dos escrituras pueden requerir una dependencia.
concepts.synchronization.dependencies.details: "Luego elija el mecanismo según dónde se ejecuten esas operaciones:"
concepts.synchronization.dependencies.guidance: Estos mecanismos están relacionados, pero no son intercambiables. Enviar comandos en orden no reemplaza cada dependencia de memoria. Una espera de cola no declara un nuevo layout de textura, y una barrera de comandos no espera en el subproceso de CPU que llama.
concepts.synchronization.dependencies.table.cpuAccess.mechanism: Llamar a {wait} en el valor de finalización correspondiente.
concepts.synchronization.dependencies.table.cpuAccess.situation: La CPU debe esperar antes de acceder a los datos o liberarlos
concepts.synchronization.dependencies.table.crossQueue.mechanism: Pasar su {timelineValue} al {submit} del búfer de comandos consumidor.
concepts.synchronization.dependencies.table.crossQueue.situation: Un envío en otra cola produce los datos
concepts.synchronization.dependencies.table.headings.mechanism: Mecanismo
concepts.synchronization.dependencies.table.headings.situation: Situación
concepts.synchronization.dependencies.table.layoutChange.mechanism: "{commandBufferTransition} con sus layouts anterior y siguiente."
concepts.synchronization.dependencies.table.layoutChange.situation: Un subrecurso de textura cambia cómo se utiliza
concepts.synchronization.dependencies.table.pipelineStages.mechanism: "{commandBufferBarrier} con las etapas productora y consumidora."
concepts.synchronization.dependencies.table.pipelineStages.situation: Etapas de GPU dependientes en un flujo de comandos
concepts.synchronization.dependencies.title: Comenzar con el productor y el consumidor
concepts.synchronization.description: Un comando que lee datos escritos por un comando anterior depende de que esas escrituras estén finalizadas y sean visibles para él. El escritor es el productor; el lector es el consumidor. La CPU también necesita un punto de finalización antes de leer, sobrescribir o liberar datos compartidos. Zenith.NET proporciona barreras, transiciones de textura y líneas de tiempo para estas diferentes dependencias.
concepts.synchronization.layouts.context: "{undefined} significa que no es necesario conservar el contenido anterior. Es adecuado para una nueva imagen o un adjunto que se borrará por completo. No es una forma de evitar rastrear el layout de una imagen cuyo contenido se cargará, muestreará o acumulará."
concepts.synchronization.layouts.description: "Los indicadores de uso describen qué roles admite una textura. {textureLayout} describe cómo se accederá a un subrecurso determinado para una operación. Un subrecurso es un nivel mip y una capa de matriz seleccionados. Cambiar su layout prepara ese acceso; no convierte la textura a un formato de píxeles diferente. Por ejemplo, el ejemplo de cálculo escribe una textura de salida en el layout {storage} y luego la muestrea en una pasada gráfica. Entre esos usos graba:"
concepts.synchronization.layouts.details: "Este fragmento supone que {outputTexture} se creó con el uso {sampledStorage} y que el subrecurso seleccionado está en el layout {storage}. {default} selecciona el nivel mip 0 y la capa de matriz 0. La operación no cambia el layout de todos los niveles mip ni de todas las capas de una textura."
concepts.synchronization.layouts.guidance: La aplicación proporciona el layout anterior. {transition} no mantiene un rastreador de layouts visible para la aplicación ni infiere ese valor a partir de comandos anteriores. Rastree el layout dondequiera que un recurso pase entre etapas de renderizado.
concepts.synchronization.layouts.title: Rastrear el layout de cada subrecurso de textura
concepts.synchronization.readback.description: "{isCompleted} solo consulta si la línea de tiempo de la GPU ha alcanzado un valor. No reclama por sí mismo los búferes de comandos ni copia descargas intermedias en el puntero de destino de la aplicación."
concepts.synchronization.readback.details: "{commandBufferDownload} graba primero una copia en el almacenamiento interno de lectura. Al restablecer el búfer de comandos completado para reutilizarlo, la CPU copia los datos al puntero suministrado. Mantenga ese destino válido y la memoria administrada anclada hasta que retorne {wait} para el envío de descarga. Solo entonces lea los datos o libere la memoria. Esperar a un envío posterior de otra cola no sondea la cola que gestiona la descarga."
concepts.synchronization.readback.guidance: "Por eso no basta con sondear {isCompleted} y leer inmediatamente el destino de una descarga asíncrona. En {link} se explican la copia directa y las transferencias mediante almacenamiento provisional."
concepts.synchronization.readback.guidance.link: Administración de recursos
concepts.synchronization.readback.title: La finalización en la GPU y los datos descargados en la CPU son pasos independientes
concepts.synchronization.reuse.description: Para un primer renderizador, una espera inmediata después de cada fotograma es sencilla. Para superponer trabajo, proporcione a los fotogramas pendientes datos mutables separados y conserve el valor de finalización del uso final de cada fotograma. Antes de actualizar un búfer de constantes, reemplazar una textura o liberar una canalización, finalice cada acceso pendiente al recurso afectado.
concepts.synchronization.reuse.details: Al cambiar el tamaño o apagar, detenga los nuevos usos antes de esperar los antiguos. {swapChainResize}, la liberación de recursos y la liberación del contexto no sirven como esperas generales para el trabajo de la aplicación. El triángulo puede cambiar de tamaño de forma segura entre devoluciones de llamada porque cada fotograma anterior ya ha completado su envío.
concepts.synchronization.reuse.guidance: El {swapChainPresent} actual también envía señales y espera en la cola de gráficos después de su operación de presentación. Por lo tanto, quitar la espera de envío explícita del triángulo no establece por sí sola un bucle de presentación superpuesto. Una espera en la cola de gráficos tampoco dice nada sobre el trabajo independiente que aún se está ejecutando en otra cola.
concepts.synchronization.reuse.title: Reutilizar datos solo después de su acceso final
concepts.synchronization.timelines.context: "Antes de que la CPU lea, sobrescriba o libere esos recursos, espere su uso final:"
concepts.synchronization.timelines.description: Una línea de tiempo realiza un seguimiento de la finalización en una cola mediante valores crecientes. {submit} devuelve un {timelineValue} que contiene esa línea de tiempo y el valor asociado con el envío. Los valores de finalización de diferentes líneas de tiempo no son comparables únicamente por sus campos numéricos {value}.
concepts.synchronization.timelines.details: "Supongamos que {producer} y {consumer} son búferes de comandos ya grabados de dos colas del mismo contexto. El productor escribe datos que utiliza el consumidor. Envíelos de esta manera:"
concepts.synchronization.timelines.guidance: Pasar el valor producido hace que la cola consumidora espere por él en la GPU. La CPU no llama a {producedWait} aquí. Mantenga válidos los recursos compartidos hasta que se complete {consumed} y grabe cualquier cambio de layout de textura requerido por el consumidor.
concepts.synchronization.timelines.notes: "{wait} espera ese valor de línea de tiempo y luego comprueba la cola propietaria en busca de envíos completados. Los búferes de comandos terminados se restablecen para su reutilización y sus descargas intermedias se copian en los destinos de CPU suministrados. {queueTimelineSignal} también puede poner en cola un punto de finalización después del trabajo ya enviado a esa cola. Llamar a {signal} no significa que la GPU ya haya alcanzado el punto."
concepts.synchronization.timelines.title: Usar una línea de tiempo para la finalización y transferencias de colas
concepts.synchronization.title: Sincronización
