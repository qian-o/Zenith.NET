### YamlMime:Resources
concepts.execution.context.description: Un {graphicsContext} representa un dispositivo de backend y proporciona sus colas de gráficos, cálculo y transferencia. Cree los búferes, texturas, sombreadores y canalizaciones para una carga de trabajo a través del mismo contexto. Un recurso o identificador creado por otro contexto no se puede vincular simplemente a los búferes de comandos de este.
concepts.execution.context.details: Elija el backend para la plataforma y la superficie de presentación. La API sigue siendo compartida, pero la compatibilidad del dispositivo sigue siendo importante. {capabilities} expone el nombre del dispositivo y los indicadores {rayTracingSupported} y {meshShadingSupported}. Compruebe el indicador correspondiente antes de crear una carga de trabajo opcional, como hacen los ejemplos {link} y {detail}. Estos indicadores no son una lista completa de restricciones de formato, memoria o plataforma.
concepts.execution.context.details.detail: sombreado de mallas
concepts.execution.context.details.link: trazado de rayos
concepts.execution.context.title: El contexto conecta recursos y colas
concepts.execution.description: Una aplicación de Zenith.NET crea recursos de GPU, graba comandos que los utilizan y envía esos comandos a una cola. La CPU puede continuar mientras la GPU ejecuta el envío. Mantenga los recursos válidos hasta que finalice ese trabajo, incluso después de que las llamadas de grabación hayan regresado.
concepts.execution.ownership.description: "Aquí, la propiedad significa responsabilidad de liberación. Una referencia de C# mantiene accesible un objeto administrado; no evita que un {dispose} explícito destruya el recurso nativo. Del mismo modo, enviar un comando que utiliza un búfer no transfiere la propiedad de ese búfer a la cola."
concepts.execution.ownership.details: Al apagar, deje de enviar nuevo trabajo, espere los últimos usos en cada cola involucrada, libere los recursos de la aplicación y luego libere el contexto. La liberación del contexto libera sus propias colas y asistentes internos; no espera todo el trabajo de la aplicación ni libera cada recurso que la aplicación creó.
concepts.execution.ownership.guidance: Aplique las mismas reglas de tiempo de vida durante el renderizado. Conserve el valor de finalización del último uso de un recurso para saber cuándo se pueden sobrescribir sus bytes o reemplazar el recurso. Consulte {link} para obtener información sobre vistas y tiempos de vida de recursos de respaldo.
