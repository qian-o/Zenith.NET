tutorial.requirements.title: Antes de comenzar
tutorial.resize.context: "Ejecute {dotnetRun} nuevamente. La ventana ahora debería tener un fondo oscuro uniforme que continúe llenándola después de cambiar el tamaño. Conserve esta devolución de llamada: el triángulo se dibujará dentro de su pasada de renderizado existente."
tutorial.resize.description: "Las imágenes de la cadena de intercambio deben seguir las dimensiones del búfer de fotogramas. Utilice {framebufferResize} para responder a los cambios en el tamaño de píxeles, incluidos los cambios causados por la escala de pantalla. Después de la devolución de llamada de renderizado, aún antes de {windowRun}, agregue:"
tutorial.resize.details: "Silk.NET distingue los cambios de tamaño de ventana de los {link}. Necesitamos estos últimos porque la cadena de intercambio almacena píxeles. Una ventana minimizada puede tener un búfer de fotogramas de tamaño cero. En ese caso, ambas devoluciones de llamada omiten su trabajo de GPU. Después de cambiar el tamaño, la pasada de renderizado utilizará las nuevas dimensiones del adjunto para su ventana gráfica y recorte."
tutorial.resize.details.link: cambios de tamaño del búfer de fotogramas
tutorial.resize.guidance: Esperamos después de cada envío, por lo que ningún fotograma anterior sigue utilizando las imágenes cuando el controlador de cambio de tamaño las reemplaza. La implementación actual de {present} también espera en la cola de gráficos. Este bucle simple mantiene completo el trabajo de un fotograma antes de que comience el siguiente; {link} cubre una programación más avanzada.
tutorial.resize.guidance.link: Sincronización
tutorial.resize.title: Responder al cambio de tamaño
tutorial.shaders.compilation.context: La compilación se realiza una vez durante la inicialización. {appContextBaseDirectory} localiza el sombreador copiado junto al ejecutable, independientemente del directorio de trabajo actual. Estos sombreadores solo consumen entrada de vértices, por lo que aún no hay búferes de constantes, texturas ni identificadores de recursos para enlazar.
tutorial.shaders.compilation.description: En las propiedades del archivo para {triangleSlang}, establezca {emphasis} en {detail}. Esto hace que el sombreador esté disponible junto al ejecutable.
tutorial.shaders.compilation.description.detail: Copiar si es posterior
tutorial.shaders.compilation.description.emphasis: Copiar en el directorio de salida
tutorial.shaders.compilation.details: "Regrese a {programCs}. Después de la carga de vértices, agregue estas instrucciones de inicialización antes de la devolución de llamada de renderizado:"
tutorial.shaders.compilation.guidance: "{zenithCompiler} devuelve una descripción de sombreador que contiene código para la API gráfica solicitada. {createShader} crea el objeto de backend correspondiente. Tanto la API gráfica como los nombres de los puntos de entrada son importantes: use {contextGraphicsApi} y escriba {vSMain} y {fSMain} exactamente como en el archivo Slang."
tutorial.shaders.compilation.title: Compilar para el backend seleccionado
tutorial.shaders.context: "{fSInput} conecta la salida del sombreador de vértices con la entrada del sombreador de fragmentos. Cuando lo escribe el sombreador de vértices, {sVPOSITION} suministra una posición en espacio de recorte: las cuatro coordenadas que utiliza la GPU para determinar qué queda dentro de la imagen visible. {cOLOR0} transporta el color para interpolar entre vértices. Las dos etapas deben coincidir en su tipo y semántica."
tutorial.shaders.description: Un sombreador es un programa ejecutado por la GPU. Este dibujo necesita un sombreador de vértices para posicionar los vértices y un sombreador de fragmentos para producir los colores dentro del triángulo. Los escribiremos en Slang, un lenguaje de sombreadores, y compilaremos dos puntos de entrada desde el mismo archivo. Un punto de entrada es la función donde comienza a ejecutarse una etapa de sombreador.
tutorial.shaders.details: "Cree {triangleSlang}, comenzando con estas dos estructuras:"
tutorial.shaders.fragment.description: "Agregue el punto de entrada de fragmentos al mismo archivo:"
tutorial.shaders.fragment.details: "La rasterización determina qué ubicaciones de imagen cubre el triángulo. Produce fragmentos (los datos procesados por el sombreador de fragmentos) con los colores de los vértices interpolados en el área cubierta. {fSMain} devuelve este color interpolado a través de {sVTARGET}, que identifica el primer adjunto de color."
tutorial.shaders.fragment.guidance: "La interpolación del color de los vértices es independiente de la mezcla del adjunto. La mezcla combina la salida de un fragmento con el color ya almacenado en el adjunto. Nuestro estado de mezcla opaco desactiva esa combinación, por lo que el color interpolado reemplaza el fondo dentro del triángulo."
tutorial.shaders.fragment.title: Colorear los fragmentos
tutorial.shaders.guidance: "{vSInput} describe lo que recibe el sombreador de vértices desde el búfer de vértices. Las semánticas {pOSITION0} y {cOLOR0} identifican las entradas; los nombres de campos de C# por sí solos no establecen esa asignación."
tutorial.shaders.title: Escribir las dos etapas del sombreador
tutorial.shaders.vertex.description: "Agregue el punto de entrada de vértices a {triangleSlang}:"
tutorial.shaders.vertex.details: La GPU invoca este punto de entrada para cada vértice de entrada. Agrega la coordenada homogénea {w} a la posición y reenvía el color. Después de la etapa de vértices, la posición se divide por w; aquí esa división deja x, y y z sin cambios. Es por eso que las posiciones elegidas anteriormente se pueden entender directamente en coordenadas de dispositivo normalizadas.
tutorial.shaders.vertex.title: Posicionar cada vértice
tutorial.surface.description: "El contexto también necesita saber dónde mostrar su salida. Agregue lo siguiente {emphasis}:"
tutorial.surface.description.emphasis: después de {windowCenter} y antes de {windowRun}
tutorial.surface.details: "{surface} describe un destino de presentación nativo y sus dimensiones en píxeles. El búfer de fotogramas es la imagen de píxeles asociada a la ventana. {framebufferSize} proporciona sus dimensiones en píxeles; las dimensiones lógicas de la ventana pueden diferir cuando la escala de pantalla está activada."
tutorial.surface.guidance: La superficie coincide con el backend seleccionado anteriormente. Windows suministra un identificador de ventana, Linux suministra una pantalla y ventana X11, y el asistente de macOS suministra la capa Metal conectada. Esta es la única parte específica de la plataforma para conectar nuestra ventana al renderizado.
tutorial.surface.title: Describir la superficie nativa
tutorial.swapChain.context: "La cadena de intercambio utiliza tanto el contexto como la ventana nativa. Reemplace la línea {windowDispose} al final de {programCs} por este orden de limpieza:"
tutorial.swapChain.description: "Utilice la descripción de la superficie para crear las imágenes que se presentarán. Inmediatamente después del bloque de superficie, agregue:"
tutorial.swapChain.details: La {swapChain} gestiona las imágenes mostradas en la ventana. En cada fotograma, {drawable} nos proporciona la imagen actual como una {texture}, el tipo de API para datos de imagen. Después de dibujar, {present} solicita mostrar el resultado y avanza al siguiente drawable.
tutorial.swapChain.guidance: "{b8G8R8A8UNorm} almacena cuatro canales de color de 8 bits en orden azul, verde, rojo y alfa. {uNorm} significa que los valores enteros de 0 a 255 representan valores de 0 a 1. El sombreador seguirá devolviendo un valor RGBA lógico; este formato determina cómo se almacenan esos canales en la imagen. Más adelante, la canalización de gráficos utilizará {swapChainDescFormat} para coincidir con este adjunto."
tutorial.swapChain.title: Crear la cadena de intercambio
tutorial.title: Primer triángulo
tutorial.troubleshooting.description: "Lea primero cualquier error en la consola y luego use los puntos de comprobación anteriores para identificar la etapa que falló:"
tutorial.troubleshooting.details: Utilice el {link} y el {detail} para comparar los datos de vértices, el diseño de entrada y la operación de dibujo. Ese ejemplo coloca las ventanas y el envío en un host compartido; este tutorial mantiene el flujo de la aplicación en {programCs}. Continúe con {context} para aprender dibujo indexado, transformaciones y pruebas de profundidad.
tutorial.troubleshooting.details.context: Cubo giratorio
tutorial.troubleshooting.details.detail: sombreador Slang
tutorial.troubleshooting.details.link: renderizador de ejemplo
tutorial.troubleshooting.table.backend.check: Compruebe que el backend seleccionado sea compatible con el dispositivo y el controlador de gráficos instalado.
tutorial.troubleshooting.table.backend.symptom: Falla la creación del backend
tutorial.troubleshooting.table.drawing.check: Compruebe el tamaño de carga, el diseño de entrada, la selección de canalización y la ubicación de los comandos de dibujo dentro de la pasada de renderizado.
tutorial.troubleshooting.table.drawing.symptom: Aparece el fondo pero no el triángulo
tutorial.troubleshooting.table.headings.check: Comprobación
tutorial.troubleshooting.table.headings.symptom: Síntoma
tutorial.troubleshooting.table.input.check: Compruebe el stride de 28 bytes y los desplazamientos de posición/color de 0 y 12.
tutorial.troubleshooting.table.input.symptom: Las posiciones o colores de los vértices están dañados
tutorial.troubleshooting.table.shaders.check: Compruebe el archivo {triangleSlang} copiado, la ortografía del punto de entrada y el diagnóstico notificado por el compilador.
tutorial.troubleshooting.table.shaders.symptom: El paso del color de borrado funciona, pero la carga del sombreador falla
tutorial.troubleshooting.table.window.check: Confirme que el proyecto .NET se compila y que el paso de solo ventana se ejecuta en una sesión de escritorio. En Linux, compruebe que X11 o XWayland estén disponibles.
tutorial.troubleshooting.table.window.symptom: No se abre ninguna ventana
tutorial.troubleshooting.title: Comprobar la etapa que falló
tutorial.window.context: "{usingZenithTutorials} importa el espacio de nombres del asistente. Cada archivo de C# usa sus propias directivas using habituales, por lo que la importación de interoperabilidad es necesaria en ambos archivos. El alias {buffer} se refiere al tipo de búfer de Zenith.NET y lo distingue de {systemBuffer}."
tutorial.window.description: Agregue {cocoaHelperCs} al proyecto, conservando su espacio de nombres. Agregue {interopUsing} en la parte superior de ese archivo, antes de su declaración de espacio de nombres. El asistente conecta una capa Metal a la ventana en macOS; las ramas de otras plataformas no lo llaman.
tutorial.window.details: "Reemplace el archivo {programCs} generado por el siguiente código. Utiliza instrucciones de nivel superior, que se ejecutan en orden sin un método {main} explícito. Las secciones posteriores le indicarán dónde agregar código a este mismo archivo:"
tutorial.window.guidance: "{graphicsAPINone} solicita a Silk.NET que cree una ventana sin su propio contexto gráfico. Crearemos ese contexto con Zenith.NET. {initialize} crea la ventana nativa y pone a disposición sus identificadores. Un identificador es proporcionado por el sistema de ventanas. {center} centra la ventana y {run} procesa eventos hasta que se cierra. La ejecución continúa luego hacia {dispose}, que libera la ventana."
tutorial.window.notes: Ejecute {dotnetRun}. Debería abrirse una ventana vacía y responder a mover, cambiar de tamaño y cerrar. Su contenido aún no está definido porque no hemos enviado ningún comando de renderizado. Ciérrela antes de continuar.
tutorial.window.title: Abrir una ventana
