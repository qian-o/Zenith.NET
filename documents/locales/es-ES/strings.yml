samples.computeShader.description: Convierte una imagen a escala de grises con un dispatch de cálculo y muestra la textura resultante. Muestra identificadores de recursos para una textura de entrada muestreada y una textura de salida editable, recuentos de grupos de subprocesos redondeados hacia arriba y una comprobación de límites en el sombreador. Conserve el recurso {assetsTexturesShokoPng} incluido; el renderizador lo procesa una vez y presenta el resultado en los fotogramas subsiguientes.
samples.computeShader.details: "{computeShaderRendererCs} · {computeShaderSlang}"
samples.computeShader.title: Sombreador de cálculo
samples.cube.description: "Agrega dibujo indexado, matrices de modelo, vista y proyección en un búfer de constantes y prueba de profundidad. La textura de profundidad se vuelve a crear al cambiar el tamaño. Úselo al pasar de geometría en espacio de recorte a un objeto transformado; el renderizador utiliza un adjunto de profundidad/plantilla {d32FloatS8UInt}."
samples.cube.details: "{spinningCubeRendererCs} · {spinningCubeSlang}"
samples.cube.title: Cubo giratorio
samples.description: "Elija un ejemplo enfocado para la característica que desea estudiar. Cada ejemplo se vincula al renderizador de C# y a su sombreador Slang. Comience con {link} si desea una aplicación completa explicada desde un proyecto vacío."
samples.description.link: Primer triángulo
samples.execution.description: "{link} contiene seis renderizadores independientes en una aplicación de escritorio. Utilice el SDK de .NET 10 y un backend de escritorio compatible, como se describe a continuación. Compile y ejecute la aplicación, luego elija un ejemplo del menú de la consola:"
samples.execution.description.link: ZenithTutorials
samples.execution.details: El host selecciona DirectX 12 en Windows, Metal en macOS y Vulkan en Linux. Utilice un entorno de dispositivo, controlador y compilador de sombreadores compatible con el backend seleccionado. La ruta de ventana de Linux requiere X11 o XWayland. El {link} declara las dependencias de paquetes y copia los recursos de sombreador y textura necesarios en tiempo de ejecución.
samples.execution.details.link: archivo de proyecto
samples.execution.guidance: Los ejemplos comparten código de ventanas y presentación. Puede elegir cualquier ejemplo de forma independiente según la característica que desee estudiar.
samples.execution.title: Ejecutar los ejemplos del tutorial
samples.host.description: "{appCs} crea el contexto, la ventana y la cadena de intercambio. Obtiene un búfer de comandos, llama al renderizador seleccionado, envía el fotograma y lo presenta. {iRendererCs} define los métodos de actualización, renderizado, cambio de tamaño y liberación del renderizador."
samples.host.details: El cálculo y el trazado de rayos producen texturas fuera de pantalla. {texturePresenterCs} y {presentTextureSlang} dibujan esas texturas en la textura de salida del fotograma actual de la ventana. El host sigue siendo el propietario del envío y de la presentación de la cadena de intercambio.
samples.host.title: Host y presentación compartidos
samples.indirectDrawing.description: Dibuja varias copias de un cubo utilizando un búfer de argumentos indirectos indexados y datos por instancia en un búfer estructurado. La CPU suministra los argumentos de dibujo y actualiza las transformaciones. Úselo para comprender el diseño de argumentos indirectos y el acceso de sombreadores a datos de instancia antes de agregar argumentos generados por GPU.
samples.indirectDrawing.details: "{indirectDrawingRendererCs} · {indirectDrawingSlang}"
samples.indirectDrawing.title: Dibujo indirecto
samples.meshShading.description: Utiliza un sombreador de tareas para descartar instancias de esferas y pasar sus índices a un sombreador de mallas que emite geometría. El renderizador comprueba {contextCapabilitiesMeshShadingSupported} antes de crear su canalización. Úselo para seguir los identificadores de recursos y los datos de carga útil a través de las etapas de tarea y malla.
samples.meshShading.details: "{meshShadingRendererCs} · {meshShadingSlang}"
samples.meshShading.title: Sombreado de mallas
samples.rayTracing.description: Crea estructuras de aceleración de nivel inferior y superior para un suelo y esferas procedimentales, y luego traza consultas de rayos en línea en un sombreador de cálculo. El renderizador comprueba {contextCapabilitiesRayTracingSupported} antes de construir la carga de trabajo. Utilice este ejemplo para entradas de estructuras de aceleración y recorrido de rayos del lado del sombreador.
samples.rayTracing.details: "{rayTracingRendererCs} · {rayTracingSlang}"
samples.rayTracing.title: Trazado de rayos
samples.title: Ejemplos
samples.triangle.description: Crea un búfer de vértices y un diseño de entrada coincidente, y luego dibuja tres vértices a través de una canalización de gráficos. Úselo para conectar la creación de recursos con los comandos en una pasada de renderizado.
samples.triangle.details: "{helloTriangleRendererCs} · {helloTriangleSlang} · {link}"
samples.triangle.details.link: Tutorial completo
samples.triangle.title: Hola triángulo
samples.workloads.description: "El {link} del repositorio principal contiene aplicaciones que combinan varias características. Sus proyectos hacen referencia al código fuente de la biblioteca. Desde una copia de Zenith.NET, ejecute el proyecto elegido, por ejemplo:"
samples.workloads.description.link: directorio Experiments
samples.workloads.details: Los experimentos con ventanas utilizan las mismas opciones de host para Windows, macOS y Linux/X11. Para dibujar dentro de Avalonia, WinForms, WPF, WinUI/Uno o MAUI, consulte {link} para obtener información sobre el ciclo de vida de los fotogramas del control y los vínculos de implementación.
samples.workloads.details.link: Integración de plataforma
samples.workloads.table.cornellBox.example: "{link}"
samples.workloads.table.cornellBox.example.link: CornellBox
samples.workloads.table.cornellBox.whatItDemonstratesAndRequires: "Trazado de caminos, reducción de ruido, asignación de tonos, aumento de resolución y controles ImGui. Requiere compatibilidad con trazado de rayos y el entorno de compilación de sombreadores para su backend de escritorio."
samples.workloads.table.fluidTank.example: "{link}"
samples.workloads.table.fluidTank.example.link: FluidTank
samples.workloads.table.fluidTank.whatItDemonstratesAndRequires: Simulación de fluidos por cálculo, dependencias entre etapas de simulación y renderizado de superficies multipasada. Requiere su backend de escritorio y el entorno de compilación de sombreadores.
samples.workloads.table.headings.example: Ejemplo
samples.workloads.table.headings.whatItDemonstratesAndRequires: Qué demuestra y qué requiere
samples.workloads.table.inkCanvas.example: "{link}"
samples.workloads.table.inkCanvas.example.link: InkCanvas
samples.workloads.table.inkCanvas.whatItDemonstratesAndRequires: Dibujo con Skia y control de entrada en una ventana nativa. Requiere el backend y la biblioteca nativa de Skia para la plataforma de destino.
samples.workloads.table.platformDetection.example: "{link}"
samples.workloads.table.platformDetection.example.link: PlatformDetection
samples.workloads.table.platformDetection.whatItDemonstratesAndRequires: Intenta la creación de contexto para cada backend e informa de las funcionalidades del dispositivo. Si la creación del contexto falla, se informa como no compatible; ese resultado también puede indicar la falta de un controlador o una dependencia en tiempo de ejecución.
samples.workloads.title: Explorar cargas de trabajo más amplias
tutorial.context.description: La ventana ahora puede abrirse, pero aún no hemos creado los objetos de GPU que renderizarán en ella. Un {graphicsContext} proporciona acceso al backend gráfico seleccionado y a sus colas de comandos.
tutorial.context.details: "Inserte este bloque {emphasis}:"
tutorial.context.details.emphasis: después de las directivas using, antes de {iWindowWindow}
tutorial.context.guidance: Las ramas seleccionan DirectX 12 en Windows, Metal en macOS y Vulkan en Linux. El código de renderizado que sigue utiliza la API compartida de Zenith.NET. Solicitamos validación durante el desarrollo e imprimimos los mensajes notificados a través de {validationMessage}. Los diagnósticos dependen del backend y de los componentes de validación disponibles en el equipo.
tutorial.context.title: Crear el contexto gráfico
tutorial.description: Cree una aplicación de consola .NET que abra una ventana y dibuje un triángulo con un degradado de color suave. Aprenderá cómo interactúan los datos de vértices, los sombreadores y el estado de la canalización, y luego grabará y enviará los comandos que producen la imagen.
tutorial.details: Siga las secciones en orden. Primero abrirá una ventana vacía, luego mostrará un color de fondo y finalmente dibujará el triángulo. Cada punto de comprobación confirma una parte de la aplicación antes de agregar la siguiente. La inicialización se ejecuta una vez; la devolución de llamada de renderizado graba un nuevo fotograma cada vez que se invoca.
tutorial.draw.context: "Los argumentos para {draw} son:"
tutorial.draw.description: "En la devolución de llamada {windowRender}, reemplace {addTheTriangleDrawCommandsHereLater} por estos tres comandos, entre {beginRenderPass} y {endRenderPass}:"
tutorial.draw.details: "{setPipeline} selecciona los sombreadores y el estado que acabamos de crear. Establézcalo antes de enlazar datos de vértices: el backend utiliza el diseño de entrada de la canalización para interpretar el enlace."
tutorial.draw.guidance: "{setVertexBufferVertexBuffer} enlaza el búfer comenzando en el desplazamiento de bytes 0 a la ranura de entrada 0. Esa ranura corresponde a la única entrada en {inputLayouts}. No vuelve a copiar ni a cargar los datos."
tutorial.draw.notes: Los comandos aún solo están grabados en este punto. Las llamadas a {submitWait} y {present} que ya están al final de la devolución de llamada de renderizado ejecutan el trabajo y muestran su resultado. El borrado sigue siendo necesario porque el triángulo cubre solo una parte de la imagen; el fondo también debe recibir un color definido en cada fotograma.
tutorial.draw.table.firstInstance.meaning: Comenzar la numeración de instancias en cero.
tutorial.draw.table.firstVertex.meaning: Comenzar con el primer vértice en el búfer.
tutorial.draw.table.headings.argument: Argumento
tutorial.draw.table.headings.description: Valor
tutorial.draw.table.headings.meaning: Significado
tutorial.draw.table.instanceCount.meaning: Dibujar una copia del triángulo.
tutorial.draw.table.vertexCount.meaning: Leer tres vértices.
tutorial.draw.title: Dibujar el triángulo dentro de la pasada
tutorial.execution.description: "Compile y ejecute desde el directorio {firstTriangle}:"
tutorial.execution.details: La ventana debería mostrar un triángulo con una esquina superior roja, una esquina inferior derecha verde y una esquina inferior izquierda azul contra un fondo oscuro. El interior debe mostrar un degradado suave entre esos colores.
tutorial.execution.guidance: Cambie el tamaño de la ventana. La devolución de llamada de cambio de tamaño actualiza las dimensiones del búfer de fotogramas y cambia el tamaño de la cadena de intercambio. La pasada de renderizado establece una ventana gráfica que coincide con esa imagen. Debido a que las posiciones de los vértices permanecen en coordenadas normalizadas, el triángulo conserva la misma fracción del ancho y alto de la ventana; cambiar la relación de aspecto puede estirar su forma. Conservar la relación de aspecto de un objeto requiere una directiva de proyección o ventana gráfica, lo cual va más allá de este primer dibujo.
tutorial.execution.title: Ejecutar, cambiar tamaño y cerrar
tutorial.frame.commands.context: Después de {endRenderPass}, la segunda transición prepara la imagen para su presentación. {submit} finaliza la grabación y envía el búfer de comandos; {wait} espera a que la GPU complete ese envío. Luego, {present} solicita la visualización de la imagen renderizada.
tutorial.frame.commands.description: "Una pasada de renderizado agrupa operaciones de dibujo que utilizan los mismos adjuntos. Aquí, el adjunto de color es la textura de salida de la cadena de intercambio, la imagen que recibe nuestro dibujo. {colorAttachmentClear} crea una descripción que indica a la pasada que borre al color RGBA indicado y conserve el resultado cuando termine la pasada. {beginRenderPass} graba esas instrucciones; la GPU realiza el borrado después de que se envían los comandos."
tutorial.frame.commands.details: "Los corchetes contienen nuestro único adjunto de color. El argumento {null} significa que no hay un adjunto de profundidad/plantilla, que almacenaría valores de profundidad y máscaras de plantilla para pruebas de profundidad y plantilla."
tutorial.frame.commands.guidance: "{beginRenderPass} establece una ventana gráfica (viewport) y un recorte (scissor) que cubren el adjunto. La ventana gráfica asigna las coordenadas renderizadas a píxeles, y el recorte limita qué píxeles se pueden escribir. Estos valores predeterminados cubren toda la textura de salida, que es lo que necesita este triángulo."
tutorial.frame.commands.title: Borrar, enviar y presentar
tutorial.frame.description: Primero llene la imagen con un único color de fondo. Esta operación se denomina borrado (clear). Si ese color aparece en la ventana, la superficie, el envío de comandos y la ruta de presentación están funcionando juntos. Este punto de comprobación le permite verificar el bucle de fotogramas antes de agregar geometría y sombreadores.
tutorial.frame.details: "Una devolución de llamada de renderizado es código que Silk.NET llama cuando es hora de dibujar un fotograma. Esta devolución de llamada no necesita el argumento de tiempo transcurrido del evento, por lo que se denomina {value}. Regístrela {emphasis}:"
tutorial.frame.details.emphasis: antes de {windowRun}
tutorial.frame.target.description: "{graphicsQueueCommandBuffer} obtiene un búfer de comandos con la grabación ya iniciada. La grabación describe trabajo para la GPU; no ejecuta ese trabajo de inmediato."
tutorial.frame.target.details: "La primera {transition} prepara la textura de salida para el acceso como adjunto de color. {default} selecciona el nivel mip 0 y la capa de matriz 0. Usamos {undefined} como layout anterior porque borraremos toda la imagen y descartaremos su contenido anterior. Una pasada que deba conservar el contenido existente debe usar su layout anterior real en su lugar."
tutorial.frame.target.guidance: Utilice la textura de salida actual de la cadena de intercambio en cada fotograma. La presentación puede cambiar qué imagen está disponible, por lo que una textura guardada de un fotograma anterior no es un destino de renderizado de ventana permanente.
tutorial.frame.target.title: Preparar la textura de salida
tutorial.frame.title: Mostrar un color de fondo
tutorial.geometry.data.description: Agregue esta matriz {emphasis}. Los siguientes pasos de creación de recursos también pertenecen a antes de esa devolución de llamada, en el orden mostrado.
tutorial.geometry.data.description.emphasis: antes de {windowRender}
tutorial.geometry.data.details: "Cada entrada de la matriz crea un {vertex}. Las dos expresiones {new} internas crean su posición {vector3} y su color {vector4}. Los vértices describen las esquinas superior, inferior derecha e inferior izquierda. El sombreador de vértices suministrará una cuarta coordenada de posición, {w}. Con w igual a 1, x e y describen directamente coordenadas de dispositivo normalizadas: -1 y +1 son los bordes de la imagen y 0 es el centro. Estas coordenadas no dependen de las dimensiones en píxeles de la ventana."
tutorial.geometry.data.guidance: Cada color contiene componentes rojo, verde, azul y alfa. Alfa es 1 en las tres esquinas. Las tres posiciones tienen z = 0, situándolas en el mismo plano. Estas posiciones no necesitan cámara ni matriz de transformación porque ya describen las coordenadas que queremos renderizar. Para este triángulo plano único, también desactivaremos la mezcla y la prueba de profundidad y omitiremos un búfer de profundidad.
tutorial.geometry.data.title: Elegir las esquinas
tutorial.geometry.description: Un vértice es un punto junto con los datos utilizados para dibujarlo. Nuestro triángulo tiene tres vértices, uno para cada esquina. Cada uno contiene una posición y un color. La GPU interpolará los colores calculando valores intermedios a través del triángulo.
tutorial.geometry.format.description: "Agregue esta declaración {emphasis}:"
tutorial.geometry.format.description.emphasis: al final de {programCs}, después de las instrucciones de limpieza
tutorial.geometry.format.details: "{file} limita este tipo a {programCs}, y el constructor inicializa sus campos de posición y color. {layoutKindSequential} mantiene los campos en el orden de declaración. {position} contiene tres flotantes de 32 bits y {color} contiene cuatro. En esta estructura, la posición comienza en el byte 0, el color comienza en el byte 12 y el vértice completo ocupa 28 bytes. Describiremos ese mismo diseño a la canalización de gráficos."
tutorial.geometry.format.title: Definir un vértice
tutorial.geometry.title: Dar a la GPU tres vértices
tutorial.geometry.upload.context: "{fixed} evita que el recolector de elementos no utilizados mueva la matriz mientras se usa su dirección. Para este búfer al que puede escribir la CPU, {upload} mapea la memoria, copia los datos y deshace el mapeo antes de devolver el control. Por tanto, la matriz no necesita seguir anclada después. El búfer debe permanecer vivo durante todo el renderizado, y basta con cargar los datos una vez porque los vértices no cambian."
tutorial.geometry.upload.description: "La matriz administrada son datos de CPU. Un {buffer} proporciona a la GPU almacenamiento desde el que puede leer los vértices. Después de la matriz, agregue:"
tutorial.geometry.upload.details: "El tamaño total es {sizeofVertexVerticesLength}: 28 bytes por vértice, tres vértices, 84 bytes en total. {bufferUsagesVertex} permite el acceso de entrada de vértices. {cpuWriteOnly} permite a la CPU inicializar este pequeño búfer directamente. El stride del descriptor registra el tamaño del elemento; el diseño de entrada que crearemos a continuación indicará a la captura de vértices cómo leer los atributos individuales."
tutorial.geometry.upload.guidance: Crear un búfer no lo rellena. {upload} copia la matriz en esa asignación comenzando en el desplazamiento de byte de destino 0. Su descripción de origen proporciona un puntero y el número de bytes que se van a copiar.
tutorial.geometry.upload.notes: Agregue {vertexBufferDispose} inmediatamente antes de {swapChainDispose} en la limpieza al final de {programCs}. Para geometrías estáticas más grandes, {link} explica cuándo elegir almacenamiento exclusivo de GPU y transferencias de carga en su lugar.
tutorial.geometry.upload.notes.link: Administración de recursos
tutorial.geometry.upload.title: Asignar un búfer y cargar la matriz
tutorial.input.description: "Los bytes de vértices y los sombreadores están listos. A continuación, describa cómo debe leer la GPU cada vértice. Un atributo es un valor único, como posición o color. El diseño de entrada proporciona a cada atributo un formato y un desplazamiento de bytes; el stride proporciona la distancia en bytes de un vértice al siguiente. Agregue este bloque de inicialización después de la creación del sombreador:"
tutorial.input.details: "{inputLayoutAdd} agrega un elemento en el stride actual y aumenta ese stride en el tamaño del elemento. No inspecciona la estructura de C#. Aquí produce la siguiente concordancia entre la memoria de la CPU y las entradas del sombreador:"
tutorial.input.guidance: "Cambiar el orden de los campos de C# o el relleno sin actualizar esta descripción haría que la GPU leyera los bytes incorrectos. El {semanticIndex} predeterminado es cero, coincidiendo con {pOSITION0} y {cOLOR0}. Ambos elementos pertenecen al mismo búfer, por lo que la canalización contendrá un diseño de entrada y enlazaremos ese búfer a la ranura 0."
tutorial.input.table.headings.byteOffset: Desplazamiento de bytes
tutorial.input.table.headings.cField: "Campo de C#"
tutorial.input.table.headings.format: Formato
tutorial.input.table.headings.shaderInput: Entrada del sombreador
tutorial.input.table.nextVertex.cField: Siguiente vértice
tutorial.input.table.nextVertex.format: "Stride total: 28 bytes"
tutorial.input.table.nextVertex.shaderInput: Siguiente registro de entrada
