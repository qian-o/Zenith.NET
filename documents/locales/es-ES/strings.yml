tutorial.input.title: Describir el diseño de entrada de vértices
tutorial.lifecycle.description: "La aplicación terminada repite esta secuencia:"
tutorial.lifecycle.details: "Cerrar la ventana regresa de {run}. Cada fotograma renderizado ya ha esperado a que se complete su trabajo de GPU, por lo que ahora podemos liberar los recursos que utilizó. La limpieza después de {windowRun} debe ser:"
tutorial.lifecycle.guidance: "Libere la cadena de intercambio antes que su ventana nativa, y el contexto después de todos sus recursos. La cola posee y recicla los búferes de comandos enviados; la cadena de intercambio posee su textura de salida. Esos búferes de comandos y esa textura no necesitan una llamada {dispose} independiente en esta aplicación."
tutorial.lifecycle.title: Seguir el ciclo de vida de un fotograma
tutorial.pipeline.behavior: "Después del diseño de entrada, agregue:"
tutorial.pipeline.context: "{cullNone} rellena el triángulo sin descartarlo por la orientación de sus caras. El orden de los vértices determina esa orientación; desactivar el descarte evita que dicho orden oculte nuestro primer triángulo."
tutorial.pipeline.description: "Ahora tenemos datos de vértices, un diseño de entrada y dos sombreadores. La {graphicsPipeline} los conecta y especifica cómo la GPU ensambla los vértices en primitivas y escribe el resultado en un adjunto."
tutorial.pipeline.details: "Una canalización combina etapas de sombreador programables con configuraciones de función fija, que controlan operaciones de GPU como ensamblado de triángulos, descarte de caras y mezcla. Para este triángulo, elija estas configuraciones:"
tutorial.pipeline.guidance: El formato de color proviene de {swapChainDescFormat}. Debe coincidir con la imagen utilizada por la pasada de renderizado. {count1} significa una muestra por píxel.
tutorial.pipeline.item: "{triangleList} ensambla cada grupo consecutivo de tres vértices en un triángulo. Suministraremos tres vértices y dibujaremos una vez, por lo que no se necesita un búfer de índices."
tutorial.pipeline.notes: "{depthNone} deshabilita la prueba y la escritura de profundidad, coincidiendo con la pasada sin adjunto de profundidad."
tutorial.pipeline.reference: "{opaque} deshabilita la mezcla, por lo que el color del sombreador de fragmentos reemplaza el fondo dentro del triángulo."
tutorial.pipeline.title: Conectar los sombreadores y el diseño de vértices
tutorial.pipeline.usage: Los objetos de sombreador se pueden liberar después de crear la canalización, como se hace en el renderizador de ejemplo. Mantenga viva la canalización en sí para cada fotograma que dibuje con ella. Agregue {pipelineDispose} antes de {vertexBufferDispose} en la limpieza. La creación de la canalización es el paso final de inicialización antes de la devolución de llamada de renderizado.
tutorial.pipeline.validation: "La descripción de la canalización declara la configuración del adjunto; no crea otra imagen. {inputLayouts} tiene una entrada porque la posición y el color se almacenan juntos en un solo búfer."
tutorial.presentation.title: Conectar la GPU a la ventana
tutorial.project.context: Habilite {emphasis} ({allowUnsafeBlocks}) en la configuración de compilación del proyecto. Lo utilizaremos para pasar datos de vértices a la GPU y para las llamadas nativas del asistente de ventanas.
tutorial.project.context.emphasis: Permitir código no seguro
tutorial.project.description: "Cree el proyecto y entre en su directorio:"
tutorial.project.details: "Instale los paquetes:"
tutorial.project.guidance: "{zenithNET} proporciona la API de renderizado compartida. Los tres paquetes de backend permiten que el mismo programa seleccione la implementación para su plataforma. {zenithNETCompiler} compila sombreadores Slang, los pequeños programas de GPU que escribiremos más adelante, para esa implementación. Silk.NET suministra la ventana y el bucle de eventos."
tutorial.project.title: Crear un proyecto de consola
tutorial.requirements.context: Puede seguir esta página desde un proyecto vacío. El {link} y su {detail} están disponibles como referencia para las API de renderizado y ventanas utilizadas aquí.
tutorial.requirements.context.detail: host compartido
tutorial.requirements.context.link: ejemplo Hola triángulo
tutorial.requirements.description: "Necesita el {emphasis}, un editor de código o IDE y un equipo de escritorio con una GPU y un controlador compatibles con un backend de Zenith.NET. Basta con tener conocimientos básicos de C#; los conceptos gráficos se introducen a medida que se utilizan. Este es un proyecto de consola {net10} ordinario. Un backend traduce las operaciones de Zenith.NET en llamadas a una API gráfica, como DirectX 12, Metal o Vulkan. La aplicación elige una al inicio:"
tutorial.requirements.description.emphasis: SDK de .NET 10
tutorial.requirements.details: Linux necesita una sesión de ventanas compatible con X11 para la ruta de ventanas utilizada aquí. Las funciones opcionales de trazado de rayos y sombreado de mallas no son necesarias para este triángulo.
tutorial.requirements.guidance: Zenith.NET renderiza en una superficie suministrada por la aplicación. Silk.NET.Windowing creará la ventana de escritorio y procesará sus eventos. En macOS, el destino de presentación es una capa Metal ({cAMetalLayerCs}); el asistente de ventana del tutorial conecta esa capa por nosotros.
