concepts.resources.memory.title: "Elegir memoria según el acceso de CPU necesario"
concepts.resources.textureUsages.description: "Los indicadores de uso para transferencias describen la dirección de las copias de GPU. El acceso de CPU es una decisión independiente de ubicación de memoria, descrita más abajo."
concepts.resources.textureUsages.details: "Combinar indicadores de uso declara varios roles; no ejecuta las operaciones ni ordena sus accesos. Las texturas siguen necesitando {link} adecuados, y sus formatos deben admitir los usos solicitados en el dispositivo seleccionado."
