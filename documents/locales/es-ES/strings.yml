concepts.execution.queues.title: Elegir una cola para el trabajo que ejecutará
concepts.execution.recording.context: La cola sondea la finalización y recicla los búferes de comandos terminados. Llame a {queueCommandBuffer} para cada nueva grabación; puede devolver una instancia reciclada. No libere un búfer de comandos prestado, no lo envíe dos veces ni continúe grabando en él después del envío. Grabe un búfer de comandos determinado desde un solo subproceso a la vez; el bloqueo interno de la cola no protege contra modificaciones simultáneas en un búfer de comandos.
concepts.execution.recording.description: "{queueCommandBuffer} devuelve un {commandBuffer} con la grabación ya iniciada. Grabe los comandos y sus dependencias, luego llame a {submit} una vez. El envío finaliza la grabación y devuelve un {timelineValue} que identifica un punto de finalización en esa cola."
concepts.execution.recording.details: "Por ejemplo, después de grabar un fotograma en {commandBuffer}, el triángulo lo envía y espera a que se complete con:"
concepts.execution.recording.guidance: "{submit} programa el trabajo; {wait} evita que la CPU continúe hasta que se haya completado ese envío. Grabar un dibujo, finalizar una pasada de renderizado y enviar un búfer de comandos son operaciones independientes. Ni grabar el dibujo ni finalizar la pasada esperan a la GPU."
concepts.execution.recording.title: La grabación no ejecuta comandos
concepts.execution.title: Modelo de ejecución
concepts.platforms.description: Elija si su aplicación posee la ventana nativa y el bucle de fotogramas o si utiliza un control de renderizado de interfaz de usuario. Esa elección determina quién obtiene la textura de salida, envía comandos y presenta el resultado. La textura de salida es la textura utilizada como salida del fotograma actual. El trabajo de gráficos y cálculo fuera de pantalla no necesita una ventana ni una cadena de intercambio.
concepts.platforms.frame.context: Agregue sus enlaces de canalización y comandos de dibujo dentro de esa pasada. Finalice la pasada antes de regresar. No envíe el búfer de comandos suministrado ni presente de forma independiente, y no libere el búfer de comandos ni la textura de salida. Si su controlador utiliza la textura de salida en otro layout, devuélvala a {colorAttachment} para la transición final del control.
concepts.platforms.frame.description: Las integraciones implementan {iZenithView}. La aplicación suministra su {graphicsContext}, actualiza datos de escena en {updateRequested} y graba el renderizado en {renderRequested} mediante {renderEventArgs}.
concepts.platforms.frame.details: "El control gestiona el ciclo completo de cada fotograma. Obtiene la textura de salida y el búfer de comandos, cambia la textura a {colorAttachment}, invoca los controladores de eventos y realiza el envío y la presentación que requiere el framework."
concepts.platforms.frame.guidance: "Para un {iZenithView} inicializado llamado {view}, con un contexto asignado, este controlador graba una pasada de borrado completa. Requiere {usingZenithNET}:"
concepts.platforms.frame.notes: Los controles pasan de {undefined} al inicio de cada fotograma, por lo que las aplicaciones no pueden depender de que se conserve el contenido anterior de la textura de salida. Borre o renderice la imagen requerida en cada fotograma. Mantenga la acumulación persistente o el renderizado almacenado en caché en una textura propiedad de la aplicación y luego muestre esa textura a través de la vista.
concepts.platforms.frame.reference: "{zenithViewHelperDrawableFormat} suministra el formato de color predeterminado de las integraciones. Compruebe la textura de salida real del evento al hacer coincidir los formatos de adjuntos, los recuentos de muestras y las dimensiones."
concepts.platforms.frame.title: Grabar en el fotograma suministrado por un control de interfaz de usuario
concepts.platforms.integration.context: WinForms, WPF y la ruta de WinUI de Windows requieren Windows. Las aplicaciones MAUI necesitan la carga de trabajo de su plataforma de destino y deben registrar el controlador del control con {useZenithView}; consulte {extensionsCs}. Se deben cumplir tanto la compatibilidad del marco como la del backend.
concepts.platforms.integration.description: "Los controles comparten la interfaz de eventos, pero no todos presentan de la misma manera:"
concepts.platforms.integration.details: La lectura de mapas de bits (bitmap readback) copia los píxeles renderizados en la memoria de la CPU antes de que la interfaz de usuario los muestre. La interoperabilidad de texturas compartidas evita esa lectura, pero aún puede requerir copias y sincronización de GPU. Por lo tanto, la interfaz {renderRequested} compartida no implica costos de presentación idénticos o requisitos de interoperabilidad nativa iguales.
concepts.platforms.integration.guidance: "Utilice el paquete para el marco de la aplicación; por ejemplo:"
