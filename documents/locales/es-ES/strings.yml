concepts.resources.bufferUsages.title: 'Usos de búfer'
concepts.resources.description: 'La descripción de un recurso establece cómo puede utilizar la aplicación su almacenamiento. Por ejemplo, una textura que se usa como destino de renderizado, se muestrea en un sombreador y se copia a la CPU necesita los indicadores de uso de las tres operaciones. La ubicación de memoria determina el acceso de la CPU; la sincronización y la gestión de la vida útil determinan cuándo se pueden usar los datos o liberar el almacenamiento.'
concepts.resources.memory.context: 'En los búferes accesibles desde la CPU, {map} proporciona la dirección desde la que se leen o escriben los datos. Ni el mapeo ni {unmap} esperan al trabajo de la GPU: antes de leer un resultado, la aplicación debe esperar a que termine la escritura que lo produce; antes de modificar esos mismos bytes, debe esperar a que terminen los accesos pendientes de la GPU.'
concepts.resources.memory.description: 'El campo {residency} de {bufferDesc} establece el acceso de CPU previsto para la asignación:'
concepts.resources.memory.details: 'La residencia expresa los requisitos de acceso de la CPU, también en sistemas donde CPU y GPU comparten memoria física. El triángulo utiliza {cpuWriteOnly} para inicializar directamente su pequeño búfer de vértices. Para geometría estática de mayor tamaño, puede ser más adecuado cargar los datos en almacenamiento exclusivo de la GPU.'
concepts.resources.memory.guidance: 'Las texturas creadas directamente mediante el contexto utilizan almacenamiento de la GPU. Por eso, {textureDesc} no tiene un campo de residencia; la aplicación intercambia sus datos con la memoria de la CPU mediante cargas y descargas.'
concepts.resources.memory.table.cpuReadOnly.cPUAccess: 'Solo lectura'
concepts.resources.memory.table.cpuReadOnly.typicalRole: 'Datos producidos por la GPU para su lectura en la CPU'
