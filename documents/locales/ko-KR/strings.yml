samples.computeShader.description: 컴퓨팅 디스패치로 이미지를 그레이스케일로 변환하고 결과 텍스처를 표시합니다. 샘플링된 입력 텍스처 및 쓰기 가능한 출력 텍스처를 위한 리소스 핸들, 올림 처리된 스레드 그룹 수, 셰이더 내 경계 검사를 보여줍니다. 포함된 {assetsTexturesShokoPng} 에셋을 유지하세요. 렌더러는 이를 한 번 처리하고 후속 프레임에서 결과를 표시합니다.
samples.computeShader.details: "{computeShaderRendererCs} · {computeShaderSlang}"
