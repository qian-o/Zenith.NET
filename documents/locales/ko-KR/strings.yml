tutorial.context.details: "컨텍스트 초기화를 {emphasis}에 추가합니다."
tutorial.context.details.emphasis: using 지시문 뒤, {iWindowWindow} 앞
tutorial.context.guidance: "각 분기에서 플랫폼에 맞는 백엔드를 선택하고 검증을 요청합니다. {validationMessage} 메시지는 콘솔에 출력합니다."
tutorial.context.imports: "{programCs} 맨 위에 다음 using 지시문을 추가합니다."
tutorial.context.title: "그래픽스 컨텍스트"
tutorial.description: "이 튜토리얼에서는 빈 .NET 콘솔 프로젝트에서 시작해 창을 열고 색상이 있는 삼각형을 그리는 애플리케이션을 만듭니다."
tutorial.details: "튜토리얼에는 세 번의 확인 단계가 있습니다. 먼저 빈 창을 열고, 단색 배경을 표시한 다음, 색상이 있는 삼각형을 그립니다. 각 단계에서 애플리케이션을 실행해 결과를 확인한 뒤 다음 부분을 추가합니다."
tutorial.draw.context: "{draw}의 인수는 다음과 같습니다."
tutorial.draw.description: "{windowRender} 콜백의 {addTheTriangleDrawCommandsHereLater}를 다음 명령으로 바꿉니다. 위치는 {beginRenderPass}와 {endRenderPass} 사이입니다."
tutorial.draw.details: "{setPipeline}은 셰이더와 렌더링 상태를 선택합니다. 정점 바인딩은 파이프라인의 입력 레이아웃으로 해석되므로, 그 전에 호출해야 합니다."
tutorial.draw.guidance: "{setVertexBufferVertexBuffer}는 업로드한 정점 데이터를 바이트 오프셋 0부터 입력 슬롯 0에 바인딩합니다. 이 슬롯은 {inputLayouts}의 유일한 항목과 대응합니다."
tutorial.draw.notes: "이 호출들은 그리기 명령을 기록합니다. 기존의 {submitWait}가 명령을 제출하고 GPU 완료를 기다리면, {present}가 완성된 이미지의 표시를 요청합니다. 삼각형 바깥 영역에도 배경색이 정해지도록 패스 시작 부분의 지우기 작업을 유지합니다."
tutorial.draw.table.firstInstance.meaning: 인스턴스 번호 매기기를 0부터 시작합니다.
tutorial.draw.table.firstVertex.meaning: 버퍼의 첫 번째 정점부터 시작합니다.
tutorial.draw.table.headings.argument: 인수
tutorial.draw.table.headings.description: 값
tutorial.draw.table.headings.meaning: 의미
tutorial.draw.table.instanceCount.meaning: 삼각형 한 개를 그립니다.
tutorial.draw.table.vertexCount.meaning: 세 개의 정점을 읽습니다.
tutorial.draw.title: "그리기 명령"
tutorial.execution.description: "{firstTriangle} 프로젝트를 빌드하고 실행합니다."
tutorial.execution.details: "어두운 배경 위에 위쪽은 빨강, 오른쪽 아래는 초록, 왼쪽 아래는 파랑인 삼각형이 나타나야 합니다. 내부 색상은 정점 색상을 보간한 결과로, 부드럽게 이어집니다."
tutorial.execution.guidance: "창 크기를 바꾸면 이미지의 픽셀 크기가 달라지지만 정점 좌표는 그대로입니다. 뷰포트는 이 좌표를 새로운 너비와 높이에 맞추므로 창의 가로세로 비율이 바뀌면 삼각형도 늘어나거나 줄어듭니다."
tutorial.execution.title: "애플리케이션 실행"
tutorial.frame.commands.context: "{endRenderPass} 뒤의 두 번째 전환은 출력 텍스처를 화면에 표시할 수 있도록 준비합니다. {submit}은 기록을 끝내고 명령 버퍼를 제출하며, {wait}는 해당 제출이 완료될 때까지 CPU 스레드를 대기시킵니다. 이어서 {present}가 렌더링한 이미지의 표시를 요청합니다."
tutorial.frame.commands.description: "렌더 패스는 같은 어태치먼트에 쓰는 그리기 작업을 묶습니다. 이 패스에서는 스왑 체인의 출력 텍스처가 색상 결과를 받습니다. {colorAttachmentClear}는 해당 어태치먼트를 RGBA 색상으로 초기화하고 패스가 끝난 뒤에도 내용을 보존하도록 지정합니다. {beginRenderPass}는 이 설정으로 패스를 시작하는 명령을 기록합니다."
tutorial.frame.commands.details: "컬렉션에는 색상 어태치먼트 하나가 있습니다. {null}은 이 패스에 깊이·스텐실 어태치먼트가 없다는 뜻입니다."
tutorial.frame.commands.guidance: "{beginRenderPass}는 어태치먼트 전체를 덮도록 뷰포트와 시저를 설정합니다. 뷰포트는 렌더링 좌표를 픽셀 위치로 바꾸고 시저는 쓸 수 있는 영역을 제한합니다."
tutorial.frame.commands.title: "지우기, 제출, 표시"
tutorial.frame.description: "먼저 창을 하나의 배경색으로 채웁니다. 이 작업을 지우기라고 합니다. 배경색이 보이면 서피스, 명령 제출, 표시 과정이 연결된 것입니다. 이제 삼각형의 정점과 셰이더를 추가할 수 있습니다."
tutorial.frame.details: "Silk.NET은 프레임을 그릴 시점에 콜백을 호출합니다. 이 예제는 경과 시간 인수를 쓰지 않으므로 매개변수 이름을 {value}로 둡니다. 콜백을 {emphasis}에 등록합니다."
tutorial.frame.details.emphasis: "{windowRun} 앞"
tutorial.frame.target.description: "{graphicsQueueCommandBuffer}는 기록할 준비가 된 명령 버퍼를 반환합니다. 기록은 GPU 작업을 정의하는 단계이며 실행은 제출 후 시작됩니다."
tutorial.frame.target.details: "텍스처 레이아웃은 작업에 필요한 접근 방식을 나타냅니다. 첫 번째 {transition} 호출은 출력 텍스처를 색상 어태치먼트로 사용할 수 있도록 준비합니다. 여기서 {default}는 출력 텍스처의 기본 이미지인 밉 레벨 0과 배열 레이어 0을 선택합니다. 이 패스는 이미지 전체를 지우므로 {undefined}를 지정해 이전 내용을 버릴 수 있습니다."
tutorial.frame.target.guidance: "화면에 표시한 뒤에는 다른 이미지로 넘어갈 수 있으므로 매 프레임 현재 출력 텍스처를 가져옵니다."
tutorial.frame.target.title: "출력 텍스처 준비"
tutorial.frame.title: "첫 프레임"
tutorial.geometry.data.description: "정점 배열을 {emphasis}에 추가합니다. 이후 리소스 초기화도 설명한 순서대로 이 콜백 앞에 둡니다."
tutorial.geometry.data.description.emphasis: "{windowRender} 앞"
tutorial.geometry.data.details: "각 항목은 {vertex}를 생성하고, 안쪽의 두 {new} 표현식은 {vector3} 위치와 {vector4} 색상을 제공합니다. 위치는 위, 오른쪽 아래, 왼쪽 아래 꼭짓점입니다. 정점 셰이더는 네 번째 좌표를 {w}로 설정합니다. w가 1이므로 x와 y는 정규화 장치 좌표이기도 하며, -1과 +1은 이미지 경계, 0은 중앙을 뜻합니다. 이 해석은 픽셀 크기와 무관합니다."
tutorial.geometry.data.guidance: "각 색상은 빨강, 초록, 파랑, 알파 성분을 가지며 알파는 1입니다. 세 정점 모두 z = 0인 같은 평면에 있습니다."
tutorial.geometry.data.title: "정점 위치와 색상"
tutorial.geometry.description: "세 정점은 각각 위치와 색상을 가집니다. GPU는 위치로 삼각형 모양을 정하고 정점 색상을 보간해 내부의 색상을 계산합니다."
tutorial.geometry.format.description: "정점 선언을 {emphasis}에 추가합니다."
tutorial.geometry.format.description.emphasis: "{programCs} 끝부분, 정리 문 뒤"
tutorial.geometry.format.details: "{file}은 형식의 사용 범위를 {programCs}로 제한하고, {layoutKindSequential}은 필드를 선언 순서대로 배치합니다. {position}은 32비트 부동소수점 값 세 개로 구성되며 바이트 오프셋 0에서 시작합니다. {color}는 네 개로 구성되며 바이트 오프셋 12에서 시작합니다. 따라서 정점 하나는 28바이트입니다. GPU가 각 필드를 올바르게 읽을 수 있도록 입력 레이아웃에 이 배치를 기술합니다."
tutorial.geometry.format.imports: "벡터 형식과 구조체 레이아웃 특성을 사용하도록 {programCs} 맨 위에 다음 using 지시문을 추가합니다."
tutorial.geometry.format.title: "정점 표현"
tutorial.geometry.title: "정점 데이터"
tutorial.geometry.upload.context: "{fixed}는 배열의 주소를 사용하는 동안 가비지 수집기가 배열을 옮기지 못하게 고정합니다. 이 버퍼는 CPU 쓰기가 가능하므로 {upload}는 메모리를 매핑하고 바이트를 복사한 뒤 매핑을 해제하고 반환합니다. 배열은 이 호출이 끝날 때까지만 고정하면 됩니다. 정점은 초기화 중에 한 번 업로드하고, 버퍼는 렌더링이 끝날 때까지 유지합니다."
tutorial.geometry.upload.description: "GPU가 그리기 중에 읽을 수 있도록 정점 데이터를 {buffer}에 저장합니다. 배열 바로 뒤에 버퍼 할당과 업로드 코드를 추가합니다."
tutorial.geometry.upload.details: "할당 크기는 {sizeofVertexVerticesLength}로, 28바이트 정점 세 개인 84바이트입니다. {bufferUsagesVertex}는 정점 입력 접근을 선언하고 {cpuWriteOnly}는 CPU 직접 초기화를 허용합니다. 설명의 스트라이드는 요소 크기이며, 뒤에서 정의할 입력 레이아웃이 각 속성을 읽는 방법을 정합니다."
tutorial.geometry.upload.guidance: "할당만으로 버퍼 내용이 초기화되지는 않습니다. {upload}는 데이터 설명의 원본 포인터와 바이트 수를 사용해 배열을 목적지 오프셋 0에 복사합니다."
tutorial.geometry.upload.imports: "Zenith.NET 버퍼 형식을 {systemBuffer}와 구분하기 위해 {programCs}의 using 지시문에 {bufferAlias} 구문을 추가합니다."
tutorial.geometry.upload.notes: "{programCs} 끝의 해제 코드에서 {swapChainDispose} 바로 앞에 {vertexBufferDispose}를 추가합니다. 큰 정적 지오메트리를 위한 GPU 전용 저장과 전송은 {link}에서 설명합니다."
tutorial.geometry.upload.notes.link: 리소스 관리
tutorial.geometry.upload.title: "버퍼 할당과 업로드"
tutorial.input.description: "GPU는 위치와 색상 같은 정점 속성이 어디에 있는지 알아야 합니다. 입력 레이아웃은 각 속성의 포맷과 바이트 오프셋을 지정합니다. 스트라이드는 다음 정점까지의 바이트 거리입니다. 셰이더를 생성한 뒤 다음 코드를 추가합니다."
tutorial.input.details: "{inputLayoutAdd}는 각 속성을 이전 속성 바로 뒤에 배치하고 그 크기를 정점 간 스트라이드에 더합니다. 오프셋은 C# 구조체를 조사하는 대신 여기서 지정한 형식으로 계산합니다. 두 필드의 배치는 다음과 같습니다."
tutorial.input.guidance: "{semanticIndex}의 기본값은 0이며 셰이더의 {pOSITION0}, {cOLOR0}과 일치합니다. 위치와 색상이 하나의 정점 버퍼에 함께 저장되므로 파이프라인은 슬롯 0에 입력 레이아웃 하나를 사용합니다. C# 구조체의 필드 순서나 패딩을 바꾸면 입력 레이아웃도 맞춰 수정합니다."
tutorial.input.table.headings.byteOffset: 바이트 오프셋
tutorial.input.table.headings.cField: "C# 필드"
tutorial.input.table.headings.format: 형식
tutorial.input.table.headings.shaderInput: 셰이더 입력
tutorial.input.table.nextVertex.cField: 다음 정점
tutorial.input.table.nextVertex.format: "총 스트라이드: 28바이트"
tutorial.input.table.nextVertex.shaderInput: 다음 입력 레코드
tutorial.input.table.vertexColor.format: "{float4} (16바이트)"
tutorial.input.table.vertexPosition.format: "{float3} (12바이트)"
tutorial.input.title: "정점 입력 레이아웃"
tutorial.lifecycle.description: "각 프레임은 다음 순서를 따릅니다."
tutorial.lifecycle.details: "창을 닫으면 {run}이 반환하고 정리 코드가 이어서 실행됩니다. 각 프레임에서 제출한 작업이 끝날 때까지 이미 기다렸으므로 명령에 사용한 리소스를 해제할 수 있습니다. {windowRun} 뒤에 들어갈 전체 정리 코드는 다음과 같습니다."
tutorial.lifecycle.guidance: "네이티브 창을 파괴하기 전에 스왑 체인을 해제하고, 컨텍스트는 그 리소스들을 해제한 뒤 정리합니다. 제출한 명령 버퍼는 큐가 재사용하고 출력 텍스처는 스왑 체인이 관리하므로 각각 {dispose}를 호출할 필요가 없습니다."
tutorial.lifecycle.title: "프레임 흐름과 해제"
tutorial.pipeline.behavior: "입력 레이아웃 다음에 파이프라인을 생성합니다."
tutorial.pipeline.context: "{cullNone}은 면 컬링을 끕니다. 따라서 정점이 시계 방향으로 보이든 반시계 방향으로 보이든 삼각형을 그립니다."
tutorial.pipeline.description: "{graphicsPipeline}은 정점 레이아웃, 두 셰이더, 프리미티브 조립과 어태치먼트 출력 설정을 하나로 묶습니다."
tutorial.pipeline.details: "셰이더는 정점과 프래그먼트를 처리합니다. 나머지 파이프라인 설정은 프리미티브 조립, 면 컬링, 깊이 테스트, 색상 블렌딩을 제어합니다."
tutorial.pipeline.guidance: "파이프라인의 색상 포맷은 렌더 패스의 어태치먼트와 같아야 하므로 {swapChainDescFormat}에서 가져옵니다. {count1}은 픽셀당 샘플 하나를 지정합니다."
tutorial.pipeline.item: "{triangleList}는 연속된 정점 세 개를 한 삼각형으로 조립합니다."
tutorial.pipeline.notes: "{depthNone}은 깊이 테스트와 쓰기를 끕니다. 깊이 어태치먼트가 없는 패스와 일치하는 설정입니다."
tutorial.pipeline.reference: "{opaque}는 블렌딩을 끕니다. 따라서 프래그먼트 셰이더 출력이 삼각형 내부의 배경색을 대체합니다."
tutorial.pipeline.title: "그래픽스 파이프라인"
tutorial.pipeline.usage: "셰이더 객체는 파이프라인을 생성한 뒤 해제할 수 있습니다. 파이프라인은 렌더링 동안 유지하고, 해제 코드에서 {vertexBufferDispose} 앞에 {pipelineDispose}를 추가합니다."
tutorial.presentation.title: "그래픽스 컨텍스트와 표시"
tutorial.project.context: "프로젝트 빌드 설정에서 {emphasis}({allowUnsafeBlocks})를 켭니다. 창 보조 코드의 네이티브 호출과 정점 업로드에는 unsafe 코드가 필요합니다."
tutorial.project.context.emphasis: 안전하지 않은 코드 허용
tutorial.project.description: ".NET 10을 대상으로 하는 {firstTriangle} C# 콘솔 프로젝트를 만듭니다."
tutorial.project.details: "다음 NuGet 패키지를 프로젝트에 추가합니다."
tutorial.project.guidance: "{zenithNET}은 공통 렌더링 API를, 백엔드 패키지 세 개는 플랫폼 구현을 제공합니다. {zenithNETCompiler}는 뒤에서 작성할 Slang 셰이더를 선택한 백엔드에 맞게 컴파일합니다. Silk.NET은 창 생성과 이벤트 처리를 담당합니다."
tutorial.project.title: "프로젝트 준비"
tutorial.requirements.context: "{link}와 해당 {detail}에서 이 튜토리얼의 참조 구현을 확인할 수 있습니다."
tutorial.requirements.context.detail: 공유 호스트
tutorial.requirements.context.link: "Hello Triangle 예제"
tutorial.requirements.description: "{emphasis}와 기본 C# 지식이 필요합니다. 애플리케이션의 대상 프레임워크는 {net10}입니다. GPU와 드라이버는 사용 중인 플랫폼에 맞춰 선택한 다음 백엔드를 지원해야 합니다."
tutorial.requirements.description.emphasis: .NET 10 SDK
tutorial.requirements.guidance: "Zenith.NET은 애플리케이션이 제공하는 네이티브 서피스에 렌더링합니다. Silk.NET.Windowing은 창을 만들고 이벤트를 처리합니다. macOS에서는 {cAMetalLayerCs}로 표현되는 Metal 레이어로 표시하며, 창 보조 코드가 이 레이어를 창에 연결합니다."
tutorial.requirements.table.headings.graphicsBackend: 그래픽 백엔드
tutorial.requirements.table.headings.platform: 플랫폼
tutorial.requirements.table.linux.graphicsBackend: Vulkan 1.4
tutorial.requirements.table.linux.platform: "Linux(X11 또는 XWayland)"
tutorial.requirements.table.macOS.graphicsBackend: Metal 4
tutorial.requirements.table.macOS.platform: macOS
tutorial.requirements.table.windows.graphicsBackend: DirectX 12
tutorial.requirements.table.windows.platform: Windows
tutorial.requirements.title: "준비 사항"
tutorial.resize.context: "애플리케이션을 다시 빌드하고 실행합니다. 창 크기를 바꿔도 배경이 창 전체를 채워야 합니다. 새 렌더 패스를 시작할 때마다 변경된 어태치먼트 크기로 뷰포트와 시저가 설정되기 때문입니다. 렌더링 콜백은 그대로 둡니다. 이후 이 패스 안에서 삼각형을 그립니다."
tutorial.resize.description: "프레임버퍼 크기가 바뀌면 스왑 체인도 그에 맞춰야 합니다. 렌더링 콜백 뒤, {windowRun} 앞에 {framebufferResize} 콜백을 등록합니다."
tutorial.resize.details: "창의 논리적 크기 대신 픽셀 단위의 {link}을 처리합니다. 창을 최소화하면서 너비나 높이가 0이 되면 크기 변경 콜백은 스왑 체인을 그대로 둡니다. 렌더링 콜백도 어느 한쪽이 0인 동안에는 바로 반환하므로, 프레임버퍼가 다시 유효한 크기가 될 때까지 렌더링이 중단됩니다."
tutorial.resize.details.link: 프레임버퍼 크기 변경
tutorial.resize.guidance: "렌더링 콜백은 제출한 프레임이 끝날 때까지 기다린 뒤 {present}를 호출합니다. 따라서 크기 변경 콜백은 이전 프레임의 작업을 방해하지 않고 스왑 체인 이미지를 교체할 수 있습니다. 작업 완료와 리소스 수명의 관계는 {link} 문서에서 자세히 설명합니다."
tutorial.resize.guidance.link: 동기화
tutorial.resize.title: "크기 변경"
tutorial.shaders.compilation.context: "{appContextBaseDirectory}를 사용하면 애플리케이션 출력 디렉터리에 복사한 셰이더를 불러옵니다. 다른 작업 디렉터리에서 애플리케이션을 실행하더라도 셰이더를 찾는 위치는 바뀌지 않습니다."
tutorial.shaders.compilation.description: "{triangleSlang}의 파일 속성에서 {emphasis}를 {detail}로 설정합니다. 빌드하면 셰이더가 실행 파일 옆으로 복사됩니다."
tutorial.shaders.compilation.description.detail: 변경된 내용만 복사
tutorial.shaders.compilation.description.emphasis: 출력 디렉터리에 복사
tutorial.shaders.compilation.details: "{programCs}로 돌아와 정점 업로드 뒤, 렌더 콜백 앞에 셰이더 초기화를 추가합니다."
tutorial.shaders.compilation.guidance: "{zenithCompiler}는 {contextGraphicsApi}에 맞게 소스를 컴파일하고, {createShader}는 컴파일 결과의 설명으로 셰이더 객체를 만듭니다. 진입점 이름 {vSMain}과 {fSMain}은 Slang 파일에 정의한 두 함수를 선택합니다."
tutorial.shaders.compilation.title: "셰이더 컴파일"
tutorial.shaders.context: "{fSInput}은 두 셰이더 단계를 연결합니다. 정점 셰이더는 {sVPOSITION}에 클립 공간 위치를 기록하며, GPU는 이 위치를 이용해 삼각형에서 보이는 부분을 결정합니다. {cOLOR0} 필드는 정점 색상을 전달합니다. 이 색상은 삼각형 내부에서 보간된 뒤 프래그먼트 셰이더에 전달되므로 두 단계의 필드 형식과 시맨틱이 일치해야 합니다."
tutorial.shaders.description: "셰이더는 GPU에서 실행하는 프로그램입니다. 정점 셰이더는 각 정점의 위치를 정하고, 프래그먼트 셰이더는 이미지에서 도형이 덮는 각 위치의 색상을 정합니다. 두 단계를 하나의 Slang 파일에 작성하되, 실행을 시작하는 함수인 진입점은 단계별로 따로 둡니다."
tutorial.shaders.details: "{triangleSlang}을 만들고 다음 입력·출력 구조체를 작성합니다."
tutorial.shaders.fragment.description: "같은 파일에 프래그먼트 진입점을 추가합니다."
tutorial.shaders.fragment.details: "래스터화는 삼각형이 이미지의 어느 위치를 덮는지 결정하고 해당 위치에 프래그먼트를 생성합니다. 각 프래그먼트는 세 정점의 색상으로부터 보간된 색상을 받습니다. {fSMain}은 이 색상을 반환하고, {sVTARGET}은 결과를 첫 번째 색상 어태치먼트로 보냅니다."
tutorial.shaders.fragment.title: "프래그먼트 셰이더"
tutorial.shaders.guidance: "{vSInput}은 정점 셰이더의 입력을 정의합니다. {pOSITION0}과 {cOLOR0}이 시맨틱으로 속성을 식별하며, C# 필드 이름만으로는 이 대응 관계가 정해지지 않습니다."
tutorial.shaders.title: "셰이더 단계"
tutorial.shaders.vertex.description: "{triangleSlang}에 정점 진입점을 추가합니다."
tutorial.shaders.vertex.details: "GPU는 입력 정점마다 이 함수를 실행합니다. 함수는 네 번째 동차 좌표를 {w}로 설정하고 색상을 그대로 전달합니다. 정점 처리 후 위치를 w로 나누는데, 여기서는 1이므로 x, y, z가 그대로 유지되어 정규화 장치 좌표로 해석됩니다."
tutorial.shaders.vertex.title: "정점 셰이더"
tutorial.surface.description: "네이티브 표시 대상을 {emphasis}에 지정합니다."
tutorial.surface.description.emphasis: "{windowCenter} 뒤, {windowRun} 앞"
tutorial.surface.details: "프레임버퍼는 창에 표시할 픽셀 이미지입니다. {surface}는 네이티브 표시 대상과 크기를 설명하고 {framebufferSize}는 픽셀 단위 크기를 제공합니다. 화면 배율에 따라 창의 논리 크기와 다를 수 있습니다."
tutorial.surface.guidance: "서피스는 백엔드가 요구하는 네이티브 핸들을 제공합니다. Windows에서는 Win32 창, Linux에서는 X11 디스플레이와 창, macOS에서는 연결한 Metal 레이어를 사용합니다."
tutorial.surface.title: "네이티브 서피스"
tutorial.swapChain.context: "스왑 체인은 컨텍스트와 창 모두에 의존합니다. {programCs} 끝의 {windowDispose}를 다음 해제 순서로 바꿉니다."
tutorial.swapChain.description: "서피스 설명 바로 다음에 스왑 체인을 생성합니다."
tutorial.swapChain.details: "{swapChain}은 창에 표시할 이미지를 관리합니다. {drawable}은 현재 이미지를 API의 이미지 리소스인 {texture}로 제공합니다. 렌더링 후 {present}가 이미지 표시를 요청하고 다음 출력 텍스처로 넘어갑니다."
tutorial.swapChain.guidance: "{b8G8R8A8UNorm}은 파랑, 초록, 빨강, 알파 순서로 8비트 채널 네 개를 저장합니다. {uNorm}은 정수 0–255를 0–1에 대응시킵니다. 셰이더 출력은 논리적인 RGBA 값이며, 포맷은 메모리에 저장하는 방식을 정합니다. 파이프라인의 색상 포맷은 {swapChainDescFormat}을 사용해 어태치먼트와 맞춥니다."
tutorial.swapChain.title: "스왑 체인"
tutorial.title: 첫 번째 삼각형
tutorial.troubleshooting.description: "콘솔 진단과 세 단계의 결과를 이용해 문제가 생긴 지점을 찾습니다."
tutorial.troubleshooting.details: "{link}와 {detail}에서 정점 데이터, 입력 레이아웃, 그리기를 확인할 수 있습니다. 예제는 창과 제출을 공통 호스트로 분리하지만, 이 튜토리얼은 전체 흐름을 {programCs}에 둡니다. {context}에서는 인덱스 그리기, 변환, 깊이 테스트를 소개합니다."
tutorial.troubleshooting.details.context: 회전하는 큐브
tutorial.troubleshooting.details.detail: Slang 셰이더
tutorial.troubleshooting.details.link: "예제 렌더러"
tutorial.troubleshooting.table.backend.check: 선택한 백엔드가 장치 및 설치된 그래픽 드라이버에서 지원되는지 확인합니다.
tutorial.troubleshooting.table.backend.symptom: 백엔드 생성 실패
tutorial.troubleshooting.table.drawing.check: "업로드 크기, 입력 레이아웃, 파이프라인 선택 및 렌더 패스 내부의 그리기 명령 배치를 확인합니다."
tutorial.troubleshooting.table.drawing.symptom: 배경은 나타나지만 삼각형은 나타나지 않음
tutorial.troubleshooting.table.headings.check: 확인 사항
tutorial.troubleshooting.table.headings.symptom: 증상
tutorial.troubleshooting.table.input.check: "스트라이드가 28바이트이고 위치와 색상의 오프셋이 각각 0과 12바이트인지 확인합니다."
tutorial.troubleshooting.table.input.symptom: 정점 위치 또는 색상이 손상됨
tutorial.troubleshooting.table.shaders.check: 복사된 {triangleSlang}, 진입점 철자 및 컴파일러에서 보고된 진단을 확인합니다.
tutorial.troubleshooting.table.shaders.symptom: "배경색은 표시되지만 셰이더를 불러오지 못함"
tutorial.troubleshooting.table.window.check: ".NET 프로젝트가 빌드되고 창 전용 단계가 데스크톱 세션에서 실행되는지 확인합니다. Linux의 경우 X11 또는 XWayland를 사용할 수 있는지 확인합니다."
tutorial.troubleshooting.table.window.symptom: "창이 열리지 않음"
tutorial.troubleshooting.title: "문제 진단"
tutorial.window.description: "{cocoaHelperCs}를 다운로드해 프로젝트에 추가합니다. 이 보조 클래스는 macOS 창에 Metal 레이어를 연결합니다."
tutorial.window.details: "자동 생성된 {programCs} 내용을 다음 코드로 바꿉니다. 최상위 문을 사용하므로 {main} 메서드를 직접 작성하지 않아도 위에서 아래로 실행됩니다. 이후 각 절에서 새 코드를 넣을 위치를 안내합니다."
tutorial.window.guidance: "{graphicsAPINone}은 그래픽스 컨텍스트 생성을 Zenith.NET에 맡깁니다. {initialize}는 네이티브 창을 만들고 창 시스템 핸들을 사용할 수 있게 합니다. {center}는 창을 화면 가운데 놓습니다. {run}이 창을 닫을 때까지 이벤트를 처리한 뒤 {dispose}가 실행되어 창을 해제합니다."
tutorial.window.notes: "애플리케이션을 빌드하고 실행합니다. 창을 열고 닫을 수 있는지, 이동하거나 크기를 바꿀 수 있는지 확인합니다. 아직 렌더링 명령을 제출하지 않아 창 내부의 내용은 정의되지 않았습니다. 다음 단계로 넘어가기 전에 창을 닫습니다."
tutorial.window.title: "창 생성"
