### YamlMime:Resources
concepts.execution.context.description: "{graphicsContext}는 특정 백엔드를 통해 애플리케이션을 GPU 장치에 연결하고 그래픽스, 컴퓨트, 전송 큐를 제공합니다. 함께 사용하는 리소스는 같은 컨텍스트에 속해야 합니다. 버퍼, 텍스처, 셰이더, 파이프라인과 그 핸들은 서로 다른 컨텍스트 사이에서 바인딩할 수 없습니다."
concepts.execution.context.details: "{capabilities}는 장치 이름과 지원 기능을 알려 줍니다. 해당 기능의 리소스를 만들기 전에 {rayTracingSupported}와 {meshShadingSupported}로 지원 여부를 확인합니다. {link} 및 {detail} 예제는 초기화 과정에서 이 검사를 수행합니다."
concepts.execution.context.details.detail: 메시 셰이딩
concepts.execution.context.details.link: 레이 트레이싱
concepts.execution.context.title: "그래픽스 컨텍스트"
concepts.execution.description: "GPU 작업은 CPU에서 준비합니다. 애플리케이션이 리소스를 만들고 이를 사용하는 명령을 기록한 뒤 큐에 제출하면, GPU가 명령을 실행하는 동안 CPU는 다른 작업을 계속할 수 있습니다. 사용 중인 리소스는 GPU 실행이 끝날 때까지 유효하게 유지해야 합니다."
concepts.execution.ownership.description: "소유권은 객체를 해제할 주체를 정하고, GPU 작업의 완료 여부는 해제할 수 있는 시점을 정합니다. C# 참조가 남아 있어도 {dispose}를 호출하면 네이티브 리소스가 해제됩니다. 명령을 제출한다고 해당 리소스의 소유권이 큐로 넘어가지는 않습니다."
concepts.execution.ownership.details: "애플리케이션을 종료할 때는 새 작업 제출을 중단하고, 관련된 모든 큐에서 리소스의 마지막 사용이 끝날 때까지 기다립니다. 그런 다음 애플리케이션 리소스를 해제하고 컨텍스트를 정리합니다. 컨텍스트는 자체 큐와 내부 보조 객체를 해제하므로 애플리케이션 작업이 모두 끝난 뒤 마지막에 정리해야 합니다."
concepts.execution.ownership.guidance: "렌더링 중에는 덮어쓸 데이터나 교체할 리소스를 사용하는 작업의 완료 시점을 추적합니다. 해당 작업이 끝날 때까지 기다린 뒤 저장 공간을 수정하거나 해제합니다. 뷰와 원본 리소스에도 이 수명 관리 원칙을 적용하는 방법은 {link} 문서에서 설명합니다."
concepts.execution.ownership.guidance.link: 리소스 관리
concepts.execution.ownership.table.applicationResources.object: 애플리케이션이 생성한 리소스
concepts.execution.ownership.table.applicationResources.ownership: 애플리케이션이 마지막 GPU 사용 후 해제합니다.
concepts.execution.ownership.table.commandBuffers.object: 대여한 명령 버퍼
concepts.execution.ownership.table.commandBuffers.ownership: 큐가 관리하고 재활용합니다.
concepts.execution.ownership.table.headings.object: "객체"
concepts.execution.ownership.table.headings.ownership: "해제 책임"
concepts.execution.ownership.table.queues.object: 컨텍스트 큐 및 해당 타임라인
concepts.execution.ownership.table.queues.ownership: 컨텍스트와 큐가 관리합니다.
concepts.execution.ownership.table.swapChainDrawable.ownership: 스왑 체인이 관리합니다.
concepts.execution.ownership.title: "소유권과 수명"
concepts.execution.pipelines.description: "그래픽스 파이프라인은 셰이더, 정점 입력 레이아웃, 프리미티브 조립, 어태치먼트의 포맷, 그리기 상태를 정의합니다. 정점, 인덱스, 상수 데이터를 바인딩하기 전에 파이프라인을 선택합니다. 어태치먼트의 포맷과 샘플 수는 렌더 패스와 일치해야 합니다."
concepts.execution.pipelines.details: "컴퓨트 파이프라인은 디스패치가 실행할 셰이더 진입점을 선택합니다. 그래픽스 렌더 패스 밖에서 파이프라인과 상수를 바인딩한 뒤 디스패치합니다."
concepts.execution.pipelines.guidance: "{link}에서는 그래픽스 명령 순서를, {detail}에서는 계산 결과를 표시하는 패스 앞에 컴퓨트 디스패치를 추가하는 구성을 볼 수 있습니다."
concepts.execution.pipelines.guidance.detail: "컴퓨트 예제"
concepts.execution.pipelines.guidance.link: 삼각형의 렌더링 콜백
concepts.execution.pipelines.title: "파이프라인 상태"
concepts.execution.queues.description: "그리기, 계산, 복사를 한 프레임에서 수행한다면 일반적으로 {graphicsQueue}부터 사용합니다. 서로 의존하는 작업을 한 큐에 두면 순서를 관리하기 쉽습니다."
concepts.execution.queues.details: "큐를 나누면 독립적인 작업을 각각 제출할 수 있지만, 각 큐가 반드시 독립된 하드웨어 엔진에 대응하는 것은 아닙니다. 작업을 겹쳐 실행할 때 이점이 있다면 추가 큐를 사용합니다. 한 큐가 다른 큐에서 만든 데이터를 사용한다면 두 제출 사이에 의존성을 명시합니다."
concepts.execution.queues.guidance: "한 큐 안에서도 뒤의 접근이 앞서 쓴 데이터를 볼 수 있도록 배리어나 텍스처 전환이 필요할 수 있습니다. 이러한 메모리 의존성은 제출 순서와 구별됩니다. 구체적인 표현 방법은 {link} 문서에서 설명합니다."
concepts.execution.queues.guidance.link: 동기화
concepts.execution.queues.table.computeQueue.workToRecord: "그래픽 렌더 패스를 제외한 컴퓨트 디스패치 및 호환 가능한 전송 작업."
concepts.execution.queues.table.graphicsQueue.workToRecord: "렌더 패스, 그리기, 컴퓨트 및 전송 작업."
concepts.execution.queues.table.headings.queue: 큐
concepts.execution.queues.table.headings.workToRecord: "지원 작업"
concepts.execution.queues.table.transferQueue.workToRecord: "업로드, 다운로드 및 복사 작업. 그리기나 컴퓨트 디스패치는 지원하지 않습니다."
concepts.execution.queues.title: "큐 선택"
concepts.execution.recording.context: "큐는 완료된 명령 버퍼를 회수해 재사용합니다. 명령을 기록할 때마다 {queueCommandBuffer}로 버퍼를 가져오고, 한 번에 한 스레드에서 기록한 뒤 한 번만 제출합니다. 제출 후에는 큐가 버퍼를 관리하므로 수정하거나 다시 제출하거나 해제하지 않습니다."
concepts.execution.recording.description: "{queueCommandBuffer}가 반환하는 {commandBuffer}는 이미 기록을 시작한 상태입니다. 작업과 의존 관계를 기록한 후 {submit}을 한 번 호출합니다. 기록이 종료되고 명령이 제출되며, 해당 큐의 완료 지점을 나타내는 {timelineValue}가 반환됩니다."
concepts.execution.recording.details: "삼각형 튜토리얼은 {commandBuffer}에 프레임을 기록한 뒤 다음과 같이 제출하고 완료를 기다립니다."
concepts.execution.recording.guidance: "기록은 명령 시퀀스를 구성하고, {submit}은 그 시퀀스의 실행을 예약합니다. 이어서 {wait}를 호출하면 해당 제출이 끝날 때까지 CPU 스레드가 대기합니다. 튜토리얼에서는 각 프레임이 끝난 뒤 다음 프레임을 시작하므로 실행 흐름을 쉽게 따라갈 수 있습니다."
concepts.execution.recording.title: "명령 기록과 제출"
concepts.execution.title: 실행 모델
concepts.platforms.description: "화면 표시는 애플리케이션이나 UI 컨트롤이 관리합니다. 이 선택에 따라 프레임의 출력 텍스처를 얻고 명령을 기록·제출하며 결과를 표시할 주체가 정해집니다. 이 출력 텍스처를 drawable이라고 합니다."
concepts.platforms.frame.context: "패스 안에서 파이프라인 바인딩과 그리기 명령을 기록하고, 핸들러가 반환하기 전에 패스를 끝냅니다. 명령 제출과 결과 표시는 컨트롤이 담당합니다. 핸들러는 명령 버퍼를 직접 제출하거나 제공받은 두 객체를 해제해서는 안 됩니다. 출력 텍스처의 레이아웃을 바꿨다면 반환 전에 {colorAttachment}로 복원해 컨트롤이 마지막 전환을 수행할 수 있도록 합니다."
concepts.platforms.frame.description: "컨트롤은 {iZenithView}를 구현합니다. 애플리케이션은 {graphicsContext}를 지정하고 {updateRequested}에서 장면을 갱신하며, {renderRequested}에서 전달받은 {renderEventArgs}로 명령을 기록합니다."
concepts.platforms.frame.details: "매 프레임 컨트롤은 출력 텍스처와 명령 버퍼를 가져오고, 텍스처를 {colorAttachment}로 전환한 뒤 업데이트와 렌더링 핸들러를 호출합니다. 이어서 기록된 작업을 제출하고 프레임워크의 표시 방식으로 이미지를 화면에 표시합니다."
concepts.platforms.frame.guidance: "파일에 {usingZenithNET} 구문을 추가합니다. {view}라는 {iZenithView} 인스턴스가 초기화되어 있고 그래픽스 컨텍스트가 할당되어 있다면, 다음 핸들러를 등록해 출력 텍스처를 지울 수 있습니다."
concepts.platforms.frame.notes: "초기 전환은 {undefined}를 사용하므로 이전 이미지의 내용은 버릴 수 있습니다. 매 프레임 이미지 전체를 그리거나 지웁니다. 누적 결과나 캐시한 렌더링 결과는 애플리케이션이 소유한 텍스처에 보관한 뒤 컨트롤의 출력 텍스처에 그립니다."
concepts.platforms.frame.reference: "{zenithViewHelperDrawableFormat}은 이 통합들이 사용하는 기본 색상 형식을 제공합니다."
concepts.platforms.frame.title: "UI 컨트롤에서 렌더링"
concepts.platforms.integration.context: "WinForms, WPF, Windows용 WinUI 통합은 Windows에서 실행됩니다. MAUI는 대상 플랫폼의 워크로드를 설치하고, {extensionsCs}에서처럼 {useZenithView}로 컨트롤 핸들러를 등록합니다."
concepts.platforms.integration.description: "이벤트 인터페이스는 공통이지만 표시 방식은 프레임워크마다 다릅니다."
concepts.platforms.integration.details: "각 구현은 GPU 이미지를 UI에 전달하는 방식이 다릅니다. 비트맵 리드백은 표시 전에 픽셀을 CPU 메모리로 복사합니다. 공유 텍스처 상호 운용은 이 CPU 복사를 피하지만 GPU 복사와 동기화는 여전히 필요할 수 있습니다. 통합을 선택할 때는 공통 {renderRequested} 이벤트뿐 아니라 이 표시 경로도 고려합니다."
concepts.platforms.integration.guidance: "NuGet으로 사용하는 UI 프레임워크의 통합 패키지를 추가합니다. Avalonia에는 {avaloniaPackage}를 사용합니다."
concepts.platforms.integration.table.avalonia.integration: Avalonia
concepts.platforms.integration.table.avalonia.presentation: 텍스처에 렌더링하고 픽셀을 {writeableBitmap}으로 다운로드합니다. {zenithViewCs} 및 {surfaceCs}를 참조하세요.
concepts.platforms.integration.table.headings.integration: 통합
concepts.platforms.integration.table.headings.presentation: "표시 방식"
concepts.platforms.integration.table.maui.integration: .NET MAUI
concepts.platforms.integration.table.maui.presentation: "Android, iOS 및 Mac Catalyst에서는 네이티브 서피스를 사용하고 Windows에서는 공유 텍스처를 이용한 합성 방식을 사용합니다. {link}을 참조하세요."
concepts.platforms.integration.table.maui.presentation.link: 플랫폼 구현
concepts.platforms.integration.table.uno.integration: Uno 경로
concepts.platforms.integration.table.uno.presentation: 픽셀을 {writeableBitmap}으로 다운로드합니다. {zenithViewUnoCs}를 참조하세요.
concepts.platforms.integration.table.winForms.integration: WinForms
concepts.platforms.integration.table.winForms.presentation: 컨트롤의 {hWND}에 대한 Zenith.NET 스왑 체인을 생성합니다. {zenithViewCs}를 참조하세요.
concepts.platforms.integration.table.winUI.integration: Windows의 WinUI
concepts.platforms.integration.table.winUI.presentation: "가져온 공유 Direct3D 11 텍스처에 렌더링한 다음 {swapChainPanel}에 연결된 합성용 스왑 체인에 복사합니다. {zenithViewWinUICs}를 참조하세요."
concepts.platforms.integration.table.wpf.integration: WPF
concepts.platforms.integration.table.wpf.presentation: 공유 Direct3D 11 텍스처를 가져온 다음 Direct3D 상호 운용성을 통해 {d3DImage}로 표시되는 서피스에 복사합니다. {surfaceCs}를 참조하세요.
concepts.platforms.integration.title: "프레임워크와 표시 방식"
concepts.platforms.lifecycle.context: "호환되는 어태치먼트를 만들 때는 렌더 이벤트가 제공한 출력 텍스처의 {descWidth}, {descHeight}, {descFormat}, {descSampleCount}를 사용합니다. 이 텍스처의 크기가 렌더 타깃의 실제 크기입니다. 컨트롤의 레이아웃 크기나 화면 배율로 추정하지 않습니다."
concepts.platforms.lifecycle.description: "스왑 체인은 프레임버퍼의 픽셀 너비와 높이를 사용합니다. 화면 배율이 적용되면 이 크기는 창의 논리적 크기와 다를 수 있습니다. 너비나 높이가 0인 동안에는 렌더링과 스왑 체인 크기 변경을 미룹니다. {swapChainDrawable}은 매 프레임 가져옵니다. 이 텍스처는 스왑 체인이 소유하며 화면 표시나 크기 변경 후 교체될 수 있습니다."
concepts.platforms.lifecycle.details: "프레임버퍼 크기가 바뀌면 GPU가 이전 이미지의 사용을 마칠 때까지 기다린 뒤 {swapChainResize}를 호출합니다. 네이티브 표시 대상을 교체할 때도 사용이 끝난 뒤 새 서피스 설명과 핸들을 {swapChainRefresh}에 전달합니다. 종료할 때는 네이티브 표시 대상을 파괴하기 전에 스왑 체인을 해제합니다."
concepts.platforms.lifecycle.guidance: "애플리케이션이 소유한 깊이 텍스처나 오프스크린 텍스처가 창 크기를 따른다면, 크기가 바뀔 때 다시 만들고 해당 핸들을 담은 상수도 갱신합니다. 어태치먼트 형식과 샘플 수가 계속 일치하면 파이프라인은 재사용할 수 있습니다. {link}는 크기가 바뀌는 텍스처와 재사용하는 파이프라인을 분리하는 예를 보여 줍니다."
concepts.platforms.lifecycle.guidance.link: 회전하는 큐브 렌더러
concepts.platforms.lifecycle.title: "스왑 체인의 크기와 수명"
concepts.platforms.ownership.description: "애플리케이션은 할당한 컨텍스트와 자체 렌더링 리소스를 소유하고, 컨트롤은 화면 표시 리소스를 소유합니다. 뷰의 {graphicsContext}가 바뀌면 스케줄러는 새 컨텍스트에 맞게 컨트롤 리소스를 다시 만듭니다. 애플리케이션의 파이프라인, 버퍼, 텍스처도 새 컨텍스트에서 다시 만들어야 합니다."
concepts.platforms.ownership.details: "렌더링 리소스를 교체하기 전에 뷰의 프레임 처리를 중단하고 해당 리소스를 사용하는 GPU 작업이 끝날 때까지 기다립니다. 그런 다음 이전 리소스나 컨텍스트를 해제합니다. 뷰를 제거할 때도 할당한 컨텍스트를 해제할 책임은 애플리케이션에 있습니다."
concepts.platforms.ownership.guidance: "공통 {frameSchedulerCs}는 뷰의 UI 디스패처를 통해 프레임 핸들러를 실행합니다. 핸들러에서는 장면 데이터 갱신과 명령 기록에 집중합니다. 여기서 CPU 작업이 오래 걸리면 인터페이스의 응답도 지연됩니다."
concepts.platforms.ownership.title: "애플리케이션과 컨트롤의 소유권"
concepts.platforms.surface.description: "{link}은 Silk.NET으로 창을 만들고 이벤트를 처리합니다. Zenith.NET은 네이티브 창 핸들과 크기를 {surface} 설명으로 전달받아 {swapChain}을 만듭니다. 운영체제 창의 관리는 애플리케이션이 계속 맡습니다."
concepts.platforms.surface.description.link: "삼각형 튜토리얼"
concepts.platforms.surface.details: "서피스 핸들은 선택한 백엔드와 일치해야 합니다."
concepts.platforms.surface.guidance: "{appCs}의 예제 호스트는 Windows, macOS, X11을 지원합니다. Linux 창에서 Xlib 핸들을 제공하므로 Wayland 세션에서 실행하려면 XWayland가 필요합니다. 네이티브 Wayland 애플리케이션은 {surfaceWayland}로 디스플레이와 서피스 핸들을 전달합니다."
concepts.platforms.surface.table.android.backend: Android의 Vulkan.
concepts.platforms.surface.table.apple.backend: Apple 플랫폼의 Metal.
concepts.platforms.surface.table.headings.backend: "백엔드와 플랫폼"
concepts.platforms.surface.table.headings.factory: 서피스 팩토리
concepts.platforms.surface.table.headings.handles: 호스트에서 제공하는 핸들
concepts.platforms.surface.table.wayland.backend: 네이티브 Wayland 호스트를 사용하는 Vulkan.
concepts.platforms.surface.table.wayland.handles: Wayland 디스플레이 및 서피스
concepts.platforms.surface.table.win32.backend: Windows의 DirectX 12 또는 Vulkan.
concepts.platforms.surface.table.xlib.backend: X11 또는 XWayland를 사용하는 Linux의 Vulkan.
concepts.platforms.surface.table.xlib.handles: "X11 디스플레이 및 창"
concepts.platforms.surface.title: "네이티브 표시 서피스"
concepts.platforms.title: 플랫폼 통합
concepts.resources.allocation.context: "힙에 배치한 리소스는 수명 내내 그 힙의 저장 공간에 의존합니다. GPU의 마지막 사용이 끝난 뒤 리소스를 먼저 해제하고 힙을 해제합니다."
concepts.resources.allocation.description: "애플리케이션이 메모리 할당을 직접 관리해야 한다면 {heap}을 사용합니다. 힙은 리소스를 지정한 바이트 오프셋에 배치할 저장 공간을 제공합니다. 오프셋을 선택하고 어느 영역이 사용 중인지 추적하는 일은 애플리케이션이 맡습니다."
concepts.resources.allocation.details: "리소스를 만들 때 사용할 버퍼 또는 텍스처 설명으로 {contextGetSizeAndAlignment}를 호출합니다. 반환된 정렬 값의 배수인 오프셋에 반환된 크기만큼 공간을 확보하되, 힙의 범위를 벗어나거나 아직 사용 중인 다른 할당과 겹치지 않도록 합니다. 텍스처에는 백엔드별 패딩이 포함될 수 있으므로 픽셀 수와 픽셀당 바이트 수만으로 할당 크기를 계산할 수 없습니다."
concepts.resources.allocation.guidance: "힙에 배치하는 버퍼의 상주 특성은 힙과 같아야 합니다. 텍스처를 저장할 때는 GPU 전용 힙을 사용합니다."
concepts.resources.allocation.title: "힙에 리소스 배치"
concepts.resources.bufferUsages.table.constant.role: 상수 버퍼 바인딩을 통해 읽는 셰이더 매개 변수.
concepts.resources.bufferUsages.table.headings.role: "역할"
concepts.resources.bufferUsages.table.headings.usage: 용도
concepts.resources.bufferUsages.table.index.role: "인덱스 그리기에 사용되는 인덱스."
concepts.resources.bufferUsages.table.indirect.role: "간접 그리기 또는 디스패치 명령이 읽는 인수."
concepts.resources.bufferUsages.table.none.role: "버퍼 용도 플래그를 선언하지 않음."
concepts.resources.bufferUsages.table.storageReadOnly.role: "읽기 전용 셰이더 바인딩으로 접근하는 버퍼 데이터."
concepts.resources.bufferUsages.table.storageReadWrite.role: "읽기 및 쓰기 셰이더 바인딩으로 접근하는 버퍼 데이터."
concepts.resources.bufferUsages.table.transferDst.role: "GPU 복사의 대상 저장 공간."
concepts.resources.bufferUsages.table.transferSrc.role: "GPU 복사의 원본 데이터."
concepts.resources.bufferUsages.table.vertex.role: "그리기에 사용하는 정점 속성."
concepts.resources.bufferUsages.title: 버퍼 용도
concepts.resources.description: "리소스 설명은 애플리케이션이 저장 공간을 어떤 용도로 사용할지 정합니다. 예를 들어 렌더 타깃으로 쓰고, 셰이더에서 샘플링하고, CPU로 다시 복사하는 텍스처에는 세 작업의 용도 플래그가 모두 필요합니다. 메모리 배치는 CPU 접근 방식을 결정하고, 동기화와 수명 관리는 데이터에 접근하거나 저장 공간을 해제할 수 있는 시점을 결정합니다."
concepts.resources.memory.context: "CPU에서 접근할 수 있는 버퍼의 경우 {map}은 데이터를 읽거나 쓸 주소를 제공합니다. 매핑과 {unmap}은 GPU 작업을 기다리지 않습니다. 따라서 GPU가 쓴 결과를 읽으려면 쓰기가 끝날 때까지 기다려야 하고, 같은 바이트를 수정하려면 진행 중인 GPU 접근이 끝날 때까지 기다려야 합니다."
concepts.resources.memory.description: "{bufferDesc}의 {residency} 필드는 할당 영역에 대한 CPU 접근 방식을 지정합니다."
concepts.resources.memory.details: "상주 특성은 CPU와 GPU가 물리 메모리를 공유하는 시스템에서도 CPU 접근 요구 사항을 나타냅니다. 삼각형은 작은 정점 버퍼를 직접 초기화하기 위해 {cpuWriteOnly}를 사용합니다. 더 큰 정적 지오메트리에는 GPU 전용 저장 공간을 만들고 데이터를 업로드하는 방식이 적합할 수 있습니다."
concepts.resources.memory.guidance: "컨텍스트에서 직접 만든 텍스처는 GPU 저장 공간을 사용합니다. 따라서 {textureDesc}에는 상주 특성 필드가 없으며, 애플리케이션은 업로드와 다운로드로 텍스처 데이터를 CPU 메모리와 주고받습니다."
concepts.resources.memory.table.cpuReadOnly.cPUAccess: "읽기 전용"
concepts.resources.memory.table.cpuReadOnly.typicalRole: "GPU가 생성하고 CPU가 읽는 데이터"
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: "쓰기 전용"
concepts.resources.memory.table.cpuWriteOnly.typicalRole: "CPU가 제공하거나 갱신하는 데이터"
concepts.resources.memory.table.gpuOnly.cPUAccess: "없음"
concepts.resources.memory.table.gpuOnly.typicalRole: "정적 지오메트리와 GPU 작업 데이터"
concepts.resources.memory.table.headings.cPUAccess: "의도한 CPU 접근"
concepts.resources.memory.table.headings.residency: "상주 방식"
concepts.resources.memory.table.headings.typicalRole: 일반적인 역할
concepts.resources.memory.title: "CPU 접근과 메모리 배치"
concepts.resources.textureUsages.description: "전송 플래그는 리소스가 GPU 복사의 원본인지 대상인지를 나타냅니다. CPU가 저장 공간에 직접 접근할 수 있는지는 별도로 메모리 배치를 선택할 때 정합니다."
concepts.resources.textureUsages.details: "용도 플래그는 텍스처가 수행할 수 있는 역할을 선언합니다. 역할을 바꿔 사용할 때는 해당 {link} 요구 사항을 따라야 하며, 선택한 장치가 그 텍스처 형식의 용도를 지원해야 합니다."
concepts.resources.textureUsages.details.link: "레이아웃과 동기화"
concepts.resources.textureUsages.table.colorAttachment.role: "렌더 패스의 색상 어태치먼트."
concepts.resources.textureUsages.table.depthStencilAttachment.role: "렌더 패스의 깊이/스텐실 어태치먼트."
concepts.resources.textureUsages.table.headings.role: "역할"
concepts.resources.textureUsages.table.headings.usage: 용도
concepts.resources.textureUsages.table.none.role: "텍스처 용도 플래그를 선언하지 않음."
concepts.resources.textureUsages.table.sampled.role: "샘플링 텍스처 바인딩을 통해 읽는 텍스처 데이터."
concepts.resources.textureUsages.table.storage.role: "스토리지 텍스처 바인딩을 통해 셰이더가 읽거나 쓰는 텍스처 데이터."
concepts.resources.textureUsages.table.transferDst.role: "GPU 복사의 대상 이미지 저장 공간."
concepts.resources.textureUsages.table.transferSrc.role: "GPU 복사의 원본 이미지 데이터."
concepts.resources.textureUsages.title: 텍스처 용도
concepts.resources.title: 리소스 관리
concepts.resources.transfers.context: "다운로드는 먼저 GPU 데이터를 내부 리드백 공간으로 복사합니다. 라이브러리는 완료된 명령 버퍼를 회수할 때 이 데이터를 지정한 CPU 대상으로 복사합니다. 다운로드를 제출해 받은 값에서 {wait}를 호출하면 두 단계가 모두 완료됩니다. 이 호출이 반환할 때까지 대상 메모리를 할당된 상태로 유지하고, 관리형 메모리라면 고정 상태도 유지합니다."
concepts.resources.transfers.description: "업로드는 CPU 데이터를 GPU 리소스로 복사하고, 다운로드는 리소스 데이터를 CPU 메모리로 복사합니다. 버퍼와 텍스처의 메서드는 이 전송을 완료한 뒤 반환합니다."
concepts.resources.transfers.details: "이 메서드들을 호출하기 전에 다른 큐의 충돌하는 접근을 정리해야 합니다. 메서드 내부의 대기는 자체 전송만 대상으로 하며 다른 큐와의 의존성을 설정하지 않습니다. 매핑된 메모리로 직접 복사하는 경로에서는 충돌하는 GPU 접근을 기다리는 일도 전적으로 호출자가 담당합니다."
concepts.resources.transfers.guidance: "전송을 다른 GPU 작업과 함께 제출하려면 {commandBufferUpload} 또는 {commandBufferDownload}로 기록합니다. 업로드 원본과 다운로드 대상은 메모리를 유효하게 유지해야 하는 기간이 서로 다릅니다."
concepts.resources.transfers.item: "업로드를 호출하면 라이브러리가 원본 데이터를 임시 전송 공간인 스테이징 메모리에 복사합니다. 이후 GPU는 이 공간에서 읽으므로 애플리케이션의 원본 포인터는 호출이 반환할 때까지만 필요합니다."
concepts.resources.transfers.notes: "텍스처 전송에서 행 스트라이드는 CPU 데이터의 인접한 행 사이의 바이트 거리이고, 슬라이스 스트라이드는 인접한 깊이 슬라이스 사이의 거리입니다. 이 값으로 CPU에 배치된 데이터와 GPU의 텍스처 저장 공간 사이를 복사할 수 있습니다. GPU 복사 완료와 다운로드 대상에 데이터가 전달되는 시점이 다른 이유는 {link} 문서에서 설명합니다."
concepts.resources.transfers.notes.link: 동기화
concepts.resources.transfers.table.bufferDownload.transfer: "{cpuReadOnly}이면 매핑된 메모리에서 직접 복사합니다. 그 외에는 전송 큐에 다운로드를 제출하고 완료를 기다립니다."
concepts.resources.transfers.table.bufferUpload.transfer: "{cpuWriteOnly}이면 매핑된 메모리에 직접 복사합니다. 그 외에는 전송 큐에 업로드를 제출하고 완료를 기다립니다."
concepts.resources.transfers.table.headings.method: "메서드"
concepts.resources.transfers.table.headings.transfer: "전송 동작"
concepts.resources.transfers.table.textureTransfers.method: "{textureUpload} / {textureDownload}"
concepts.resources.transfers.table.textureTransfers.transfer: "복사와 텍스처 전환을 그래픽스 큐에 제출한 뒤 완료를 기다립니다. 선택한 하위 리소스는 요청한 최종 레이아웃으로 남습니다."
concepts.resources.transfers.title: "즉시 전송과 기록된 전송"
concepts.resources.usages.description: "{bufferUsages}와 {textureUsages}는 리소스 용도를 선언하는 플래그 열거형입니다. 각각 {bufferDescUsages}와 {textureDescUsages}에 지정합니다. 여러 용도가 필요하면 {value}로 해당 멤버를 결합합니다."
concepts.resources.usages.title: "리소스 용도"
concepts.resources.views.description: "{bufferView}는 버퍼의 영역과 그 데이터를 해석하는 방식을 기술합니다. {textureView}는 하위 리소스 범위를 선택하고, 호환되는 텍스처 유형과 포맷을 지정합니다. 둘 다 기존 저장 공간을 참조하며, 생성 시 선언한 용도를 따릅니다. 뷰 범위는 접근 대상을 기술하지만 모든 백엔드에서 동일한 셰이더 범위 검사를 보장하지는 않습니다."
concepts.resources.views.details: "리소스 자체의 핸들은 기본 뷰를 제공합니다. 다른 영역이나 호환되는 다른 해석 방식이 필요하면 별도 뷰를 만듭니다. GPU가 사용을 마칠 때까지 뷰와 원본 리소스를 모두 유지해야 합니다. 핸들만으로는 어느 객체의 수명도 유지되지 않습니다. 둘 중 하나를 교체하면 이전 {link}이 들어 있는 상수도 갱신합니다."
concepts.resources.views.details.link: "리소스 핸들"
concepts.resources.views.title: "뷰와 원본 리소스"
concepts.shaders.binding.context: "컴퓨트 예제는 {input}에 {inputTextureSampledHandle}을, {output}에 {outputTextureStorageHandle}을 지정합니다. Slang의 {descriptorHandle} 형식 인수가 각 리소스의 셰이더 접근 방식을 정합니다."
concepts.shaders.binding.description: "{setConstantBuffer}는 현재 파이프라인이 상수를 읽을 버퍼와 시작 바이트 오프셋을 선택합니다. 셰이더가 사용하기 전에 해당 공간에 매개변수를 업로드합니다. 이전 GPU 작업이 같은 바이트를 아직 읽고 있다면 그 작업이 끝난 뒤 데이터를 갱신합니다."
concepts.shaders.binding.details: "명령 버퍼, 컴퓨트 파이프라인, 데이터가 채워진 상수 버퍼, 스레드 그룹 수를 준비한 뒤 다음 순서로 디스패치를 기록합니다. 상수 버퍼 바인딩은 현재 파이프라인에 적용되므로 파이프라인을 먼저 선택합니다."
concepts.shaders.binding.guidance: "여기서 {commandBuffer}는 {computePipeline}을 사용하는 디스패치를 기록합니다. 셰이더 매개변수는 {constantBuffer}에 저장되어 있습니다. 버퍼에는 {bufferUsagesConstant} 용도가 필요하고, 오프셋 0은 버퍼의 시작을 선택합니다. 여러 상수 레코드가 한 버퍼를 공유한다면 각 레코드의 시작 오프셋도 백엔드의 바인딩 정렬을 따라야 합니다. 이는 레코드 내부의 필드 배치와 별개의 조건입니다."
concepts.shaders.binding.notes: "{resourceHandle}은 32비트 필드 두 개를 포함하며 해석은 백엔드에 따라 다릅니다. 이 값은 리소스를 생성한 컨텍스트에서만 유효합니다."
concepts.shaders.binding.reference: "핸들을 얻은 리소스와 뷰는 셰이더의 마지막 접근이 끝날 때까지 유지합니다. 텍스처나 뷰를 교체하면 이전 핸들을 담은 상수를 갱신합니다. 소유권 규칙은 {link}에서 설명합니다."
concepts.shaders.binding.reference.link: 리소스 관리
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: "셰이더 형식 {t}의 구조화 요소 읽기"
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: "셰이더 형식 {t}의 구조화 요소 읽기 및 쓰기"
concepts.shaders.binding.table.headings.access: 의도된 접근
concepts.shaders.binding.table.headings.cHandle: "C# 핸들"
concepts.shaders.binding.table.headings.slangFieldType: Slang 필드 형식
concepts.shaders.binding.table.samplerHandle.access: "텍스처 샘플링 상태"
concepts.shaders.binding.table.textureSampledHandle.access: "텍스처 읽기"
concepts.shaders.binding.table.textureStorageHandle.access: "스토리지 텍스처 읽기 및 쓰기"
concepts.shaders.binding.title: "상수 버퍼와 리소스 핸들"
concepts.shaders.compilation.description: "{zenithCompiler}는 지정한 Slang 진입점을 {shaderDesc}로 컴파일합니다. 컨텍스트의 {graphicsApi}에 따라 DirectX 12용 DXIL, Metal 라이브러리, Vulkan용 SPIR-V를 생성합니다."
concepts.shaders.compilation.details: "{context}라는 그래픽스 컨텍스트를 이미 만든 상태에서, 실행 파일 옆에 복사해 둔 삼각형 셰이더를 다음과 같이 컴파일합니다."
concepts.shaders.compilation.guidance: "진입점 이름 {vSMain}은 셰이더 파일의 선언과 일치해야 합니다. 초기화 중에 셰이더를 컴파일하고 파이프라인을 만든 뒤, 렌더링 중에는 파이프라인을 재사용합니다. 파이프라인 생성이 끝나면 셰이더 객체를 해제할 수 있습니다. {link} 튜토리얼에서 이 순서를 확인할 수 있습니다."
concepts.shaders.compilation.guidance.link: 첫 번째 삼각형
concepts.shaders.compilation.title: "셰이더 컴파일"
concepts.shaders.description: "C#과 Slang의 선언은 각 값의 위치와 셰이더의 접근 방식이 일치해야 합니다. 정점 입력 레이아웃은 정점 속성을 기술하고, 셰이더의 버퍼 선언은 매개변수와 배열을 기술하며, 리소스 핸들은 셰이더가 사용할 리소스를 가리킵니다."
concepts.shaders.dispatch.description: "{dispatch}는 실행할 스레드 그룹 수를 지정합니다. 컴퓨트 예제는 {numthreads}를 선언하므로 한 그룹은 16 × 16개 스레드로 구성됩니다. 이미지 전체를 처리하려면 너비와 높이를 각각 16으로 나누고 올림합니다. 예를 들어 17 × 19 이미지는 2 × 2개 그룹이 필요합니다. 셰이더는 각 스레드의 좌표를 확인하고 이미지 범위 밖이면 처리를 건너뜁니다."
concepts.shaders.dispatch.details: "선언한 그룹 크기는 {shaderDescThreadGroupSize}에서 확인할 수 있으며, 이 값으로 {dispatch}에 전달할 그룹 수를 계산합니다. 전체 계산은 {computeShaderRendererCs}에 있습니다. 디스패치 이후 결과 이미지에 접근할 때는 {link} 문서의 요구 사항을 따릅니다."
concepts.shaders.dispatch.details.link: 동기화
concepts.shaders.dispatch.title: "스레드 그룹"
concepts.shaders.layout.context: "{link}는 이미지 크기와 텍스처 핸들 두 개로 이 구성을 보여 줍니다. 명시적 오프셋으로 각 필드의 시작 위치를 지정합니다. 다음 선언에는 {systemRuntimeInteropServices}와 {zenithNET} 네임스페이스를 사용합니다."
concepts.shaders.layout.context.link: "컴퓨트 예제의 C# 상수"
concepts.shaders.layout.description: "정점 입력에서 {inputLayout}은 각 속성의 형식, 오프셋, 시맨틱과 정점 간 스트라이드를 기술합니다. 삼각형은 {float3} 위치 뒤에 {float4} 색상을 배치합니다. 색상은 바이트 오프셋 12에서 시작하고 정점 하나는 28바이트를 차지합니다. {inputLayoutAdd}는 요소 형식으로 이 조밀한 배치를 계산합니다. C# 구조체에 패딩이 있다면 이를 반영한 오프셋과 스트라이드를 지정해야 합니다."
concepts.shaders.layout.details: "상수 버퍼에는 셰이더 매개변수를, 구조화 버퍼에는 형식이 지정된 요소의 배열을 저장합니다. 이들의 배치는 {inputLayout}이 아니라 Slang 선언을 따릅니다. C#의 필드 오프셋, 요소 크기, 패딩을 컴파일된 셰이더 레이아웃에 맞춥니다. 관리되지 않는 C# 형식은 바이트로 복사할 수 있지만, 그 메모리 배치가 셰이더의 배치와 반드시 일치하는 것은 아닙니다. 정점에서 촘촘히 배치한 {float3}도 셰이더 버퍼에서는 다른 정렬이 필요할 수 있습니다."
concepts.shaders.layout.guidance: "셰이더 매개변수에는 일반 값뿐 아니라 리소스 핸들도 포함할 수 있습니다. 핸들은 이미 존재하는 저장 공간을 가리키므로 상수 버퍼에 핸들을 복사해도 리소스의 내용까지 복사되지는 않습니다."
concepts.shaders.layout.notes: "{computeShaderSlang}의 대응 선언은 다음과 같습니다."
concepts.shaders.layout.reference: "두 크기 값이 처음 8바이트를 차지하고, 그 뒤에 각각 8바이트인 핸들 두 개가 이어집니다. C# 예제는 전체 레코드에 256바이트를 확보합니다. 다른 레코드의 크기는 그 필드와 레이아웃 및 정렬 요구 사항에 맞춰 정합니다."
concepts.shaders.layout.title: "데이터 배치"
concepts.shaders.matrices.description: "컴파일러는 각 행을 연속으로 저장하는 행 우선 행렬 배치를 사용합니다. {link}에서는 {matrix4x4} 세 개를 오프셋 0, 64, 128에 저장합니다. 해당 {detail}는 {mulVectorMatrix}를 모델, 뷰, 투영 순으로 적용합니다."
concepts.shaders.matrices.description.detail: 셰이더
concepts.shaders.matrices.description.link: 회전하는 큐브 렌더러
concepts.shaders.matrices.details: "저장 순서는 메모리의 행렬 요소 배치를, 곱셈 순서는 변환을 정합니다. C#과 Slang에서 서로 맞는 규약을 사용해야 합니다."
concepts.shaders.matrices.title: "행렬 규약"
concepts.shaders.title: 셰이더 데이터 및 바인딩
concepts.synchronization.backends.description: "DirectX 12와 Vulkan은 텍스처 전환을 레이아웃 및 접근 변경 명령으로 기록합니다. Metal에서는 Zenith.NET의 {transition} 구현이 이에 해당하는 GPU 작업을 수행하지 않습니다. 대신 Metal 백엔드는 명령을 렌더 인코더와 컴퓨트 인코더로 묶고 인코더가 끝날 때 가시성 배리어를 삽입합니다. 연속된 컴퓨트 디스패치처럼 같은 인코더 안에서 의존하는 작업에는 {barrier}를 명시적으로 호출합니다."
concepts.synchronization.backends.details: "{link}에서는 그래픽스 렌더 패스를 시작하면서 컴퓨트 인코더를 끝내므로 그래픽스 작업이 컴퓨트 결과를 볼 수 있습니다. 연속된 두 컴퓨트 디스패치는 같은 인코더에 남아 있으므로 중간에 텍스처 전환을 기록하더라도 의존성을 위한 배리어가 필요합니다. 여러 백엔드에서 사용할 명령 시퀀스는 이처럼 텍스처 레이아웃과 접근 의존성을 함께 고려해야 합니다."
concepts.synchronization.backends.details.link: "컴퓨트 예제"
concepts.synchronization.backends.title: "백엔드별 동작"
concepts.synchronization.barriers.context: "관련 접근을 포함하고 큐에서 지원하는 단계를 선택합니다. {barrierStagesAll}은 지원되는 모든 단계를 포함합니다. 의존성이 일부 단계에만 관련된다면 해당 단계만 선택합니다."
concepts.synchronization.barriers.description: "같은 명령 버퍼에 두 컴퓨트 디스패치를 기록한다고 가정합니다. 첫 번째는 시뮬레이션 데이터를 쓰고 두 번째는 이를 읽습니다. 두 번째가 완료된 쓰기를 볼 수 있도록 디스패치 사이에 배리어를 둡니다. 스토리지 버퍼라면 텍스처 레이아웃을 전환하지 않고 다음과 같이 접근 순서를 정할 수 있습니다."
concepts.synchronization.barriers.details: "첫 번째 인수는 데이터를 만든 단계를, 두 번째는 데이터를 사용할 단계를 지정합니다. 두 인수는 디스패치 사이에 필요한 실행 순서와 메모리 가시성을 기술합니다."
concepts.synchronization.barriers.guidance: "{link}은 시뮬레이션 단계 사이에 이 패턴을 적용합니다. 각 배리어는 데이터를 만드는 디스패치 뒤, 이를 사용하는 디스패치 앞에 놓입니다."
concepts.synchronization.barriers.guidance.link: FluidTank 시뮬레이션
concepts.synchronization.barriers.title: "파이프라인 배리어"
concepts.synchronization.dependencies.description: "각 리소스에서 같은 데이터를 다루는 접근을 확인합니다. 어느 한쪽이라도 쓰기라면 필요한 순서를 지켜야 합니다. 읽기끼리는 충돌하지 않지만 텍스처 레이아웃과 프레젠테이션 요구 사항은 여전히 적용됩니다. CPU가 데이터를 갱신하거나 리소스를 해제할 때도 GPU가 해당 저장 공간을 다 쓸 때까지 기다려야 합니다."
concepts.synchronization.dependencies.details: "작업이 실행되는 위치에 따라 적절한 수단을 선택합니다."
concepts.synchronization.dependencies.guidance: "한 작업에 여러 동기화 수단이 필요할 수 있습니다. 예를 들어 다른 큐에서 만든 텍스처를 사용하려면 제출 간 의존성과 다음 용도에 맞는 레이아웃이 모두 필요합니다. CPU가 직접 데이터에 접근하거나 메모리를 해제해야 하는 경우가 아니라면 이 두 작업 때문에 CPU를 대기시킬 필요는 없습니다."
concepts.synchronization.dependencies.table.cpuAccess.mechanism: 해당 완료 값에 대해 {wait}를 호출합니다.
concepts.synchronization.dependencies.table.cpuAccess.situation: "CPU 접근이나 리소스 해제에 GPU 완료가 필요"
concepts.synchronization.dependencies.table.crossQueue.mechanism: "생산자의 {timelineValue}를 소비자의 {submit}에 전달합니다."
concepts.synchronization.dependencies.table.crossQueue.situation: "한 큐에서 다른 큐가 만든 데이터를 사용"
concepts.synchronization.dependencies.table.headings.mechanism: 메커니즘
concepts.synchronization.dependencies.table.headings.situation: 상황
concepts.synchronization.dependencies.table.layoutChange.mechanism: "이전·다음 레이아웃을 지정한 {commandBufferTransition}."
concepts.synchronization.dependencies.table.layoutChange.situation: 텍스처 하위 리소스 사용 방식 변경
concepts.synchronization.dependencies.table.pipelineStages.mechanism: "생성 단계와 소비 단계를 지정한 {commandBufferBarrier}."
concepts.synchronization.dependencies.table.pipelineStages.situation: 명령 스트림의 종속 GPU 단계
concepts.synchronization.dependencies.title: "접근 의존 관계"
concepts.synchronization.description: "동기화는 공유 데이터에 접근하는 순서를 정하고, 뒤의 작업이 필요한 결과를 볼 수 있게 합니다. 쓰기에서 읽기로 이어지는 의존성에서 쓰는 작업을 생산자, 읽는 작업을 소비자라고 합니다. 배리어와 텍스처 전환은 GPU 접근을 조율하며, 타임라인은 제출 간 의존성을 연결하고 CPU가 GPU 완료를 기다릴 수 있게 합니다."
concepts.synchronization.layouts.context: "새 이미지나 전체를 지울 어태치먼트처럼 기존 내용을 버려도 되는 경우 이전 레이아웃에 {undefined}를 사용합니다. 로드, 샘플링, 누적에 기존 내용이 필요하다면 직전 접근의 레이아웃을 지정합니다."
concepts.synchronization.layouts.description: "용도 플래그는 텍스처에 허용된 역할을 선언합니다. {textureLayout}은 밉 레벨과 배열 레이어로 식별한 하위 리소스를 명령 시퀀스의 특정 지점에서 어떻게 접근하는지 나타냅니다. 접근 방식이 바뀌면 전환을 기록합니다. 예를 들어 컴퓨트 예제는 출력 텍스처를 {storage} 레이아웃에서 쓴 뒤 그래픽스 패스에서 샘플링할 수 있도록 준비합니다."
concepts.synchronization.layouts.details: "여기서는 {outputTexture}를 {sampledStorage} 용도로 만들었고 선택한 하위 리소스는 {storage} 상태입니다. {default}는 mip 레벨 0과 배열 레이어 0을 선택합니다. 다른 레벨이나 레이어에는 영향을 주지 않습니다."
concepts.synchronization.layouts.guidance: "{transition}에는 하위 리소스의 직전 사용 레이아웃을 전달합니다. 애플리케이션은 명령을 기록하고 렌더링 단계 사이에 텍스처를 전달하면서 이 상태를 추적합니다."
concepts.synchronization.layouts.title: "텍스처 레이아웃"
concepts.synchronization.readback.description: "{isCompleted}는 GPU 완료 여부를 알려 줍니다. 기록된 다운로드에는 내부 리드백 공간의 결과를 애플리케이션의 대상 메모리로 복사하는 단계가 하나 더 있습니다."
concepts.synchronization.readback.details: "{commandBufferDownload}는 내부 리드백 공간으로의 GPU 복사를 기록합니다. 제출이 끝나면 라이브러리는 완료된 명령 버퍼를 회수하면서 CPU 복사를 수행합니다. 다운로드를 제출해 받은 값에서 {wait}를 호출하면 GPU 완료를 기다리고 해당 큐의 완료된 버퍼도 처리하므로 두 단계가 모두 끝납니다. 호출이 반환할 때까지 대상 메모리의 할당을 유지하고, 관리형 메모리라면 고정 상태도 유지합니다."
concepts.synchronization.readback.guidance: "{isCompleted}만 조회해서는 마지막 CPU 복사가 수행되지 않습니다. 다른 큐를 기다리는 것 역시 다운로드 큐의 완료된 버퍼를 회수하지 않습니다. 업로드와 다운로드가 직접 메모리 접근이나 스테이징 공간을 사용하는 조건은 {link} 문서에서 설명합니다."
concepts.synchronization.readback.guidance.link: 리소스 관리
concepts.synchronization.readback.title: "리드백 완료"
concepts.synchronization.reuse.description: "삼각형은 각 프레임이 끝난 뒤 데이터를 재사용합니다. 프레임을 겹쳐 실행하려면 진행 중인 프레임마다 별도의 수정 가능한 저장 공간을 두고 언제 다시 사용할 수 있는지 추적합니다. 데이터를 변경하기 전에는 해당 바이트에 아직 접근하는 GPU 작업을 기다리고, 리소스를 해제하기 전에는 그 리소스의 모든 사용이 끝날 때까지 기다립니다."
concepts.synchronization.reuse.details: "크기 변경과 종료에도 같은 원칙이 적용됩니다. 새 사용을 막고 기존 사용이 끝날 때까지 기다린 뒤 리소스를 교체하거나 해제합니다. {swapChainResize}를 호출하거나 리소스 또는 컨텍스트를 해제하기 전에 이 순서를 지켜야 합니다. 삼각형은 매 프레임 기다리므로 콜백 호출 사이에서 크기를 바꿀 수 있습니다."
concepts.synchronization.reuse.guidance: "{swapChainPresent}는 이미지를 표시한 뒤 그래픽스 큐에 신호를 보내고 완료를 기다립니다. 따라서 명시적인 제출 대기를 제거해도 삼각형은 화면 표시 단계에서 여전히 기다립니다. 다른 큐에 독립적으로 제출한 작업은 별도로 완료를 추적해야 합니다."
concepts.synchronization.reuse.title: "리소스 재사용"
concepts.synchronization.timelines.context: "소비자가 끝난 뒤 CPU에서 결과를 읽거나 공유 데이터를 덮어쓰거나 리소스를 해제하려면 해당 제출을 기다립니다."
concepts.synchronization.timelines.description: "타임라인은 증가하는 값으로 큐의 완료를 나타냅니다. {submit}은 타임라인과 제출 값을 담은 {timelineValue}를 반환합니다. 서로 다른 타임라인의 숫자 {value}를 직접 비교할 수는 없습니다."
concepts.synchronization.timelines.details: "같은 컨텍스트의 두 큐에서 기록한 {producer}와 {consumer}가 있고, 소비자가 생산자가 쓴 데이터를 사용한다고 하겠습니다. 다음 의존 관계로 제출합니다."
concepts.synchronization.timelines.guidance: "소비자 큐는 전달받은 완료 값에 도달할 때까지 기다린 뒤 명령을 실행합니다. CPU는 {producedWait}를 호출하지 않고 계속 진행할 수 있습니다. {consumed}가 완료될 때까지 공유 리소스를 유지하고, 소비자의 접근에 필요한 텍스처 전환을 기록합니다."
concepts.synchronization.timelines.notes: "{queueTimelineSignal}이 반환한 값도 {wait}로 기다리거나 다른 큐의 의존성에 사용할 수 있습니다. {signal}은 이미 제출된 작업 뒤에 완료 지점을 넣으며, GPU는 그 작업을 끝낸 뒤 해당 지점에 도달합니다."
concepts.synchronization.timelines.title: "타임라인과 큐 간 의존 관계"
concepts.synchronization.title: 동기화
