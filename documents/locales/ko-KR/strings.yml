samples.workloads.table.cornellBox.whatItDemonstratesAndRequires: 패스 트레이싱, 디노이징, 톤 매핑, 업스케일링 및 ImGui 컨트롤을 보여줍니다. 레이 트레이싱 지원과 데스크톱 백엔드용 셰이더 컴파일러 환경이 필요합니다.
