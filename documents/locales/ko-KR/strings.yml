samples.workloads.table.platformDetection.example: "{link}"
samples.workloads.table.platformDetection.example.link: PlatformDetection
samples.workloads.table.platformDetection.whatItDemonstratesAndRequires: 각 백엔드에 대한 컨텍스트 생성을 시도하고 장치 기능을 보고합니다. 컨텍스트 생성이 실패하면 지원되지 않는 것으로 보고되며, 이 결과는 드라이버 또는 런타임 종속성 누락을 나타낼 수도 있습니다.
samples.workloads.title: 더 큰 규모의 워크로드 살펴보기
tutorial.context.description: 이제 윈도우를 열 수 있지만 윈도우에 렌더링할 GPU 개체는 아직 생성하지 않았습니다. {graphicsContext}는 선택한 그래픽 백엔드 및 해당 명령 큐에 대한 액세스를 제공합니다.
tutorial.context.details: "이 블록을 {emphasis}에 삽입합니다:"
tutorial.context.details.emphasis: using 지시문 뒤, {iWindowWindow} 앞
tutorial.context.guidance: 분기는 Windows에서는 DirectX 12, macOS에서는 Metal, Linux에서는 Vulkan을 선택합니다. 이어지는 렌더링 코드는 공유 Zenith.NET API를 사용합니다. 개발 중에 유효성 검사를 요청하고 {validationMessage}를 통해 보고된 메시지를 출력합니다. 진단은 백엔드 및 컴퓨터에서 사용 가능한 유효성 검사 구성 요소에 따라 다릅니다.
tutorial.context.title: 그래픽스 컨텍스트 생성
tutorial.description: 윈도우를 열고 부드러운 그라데이션이 있는 삼각형을 그리는 .NET 콘솔 애플리케이션을 빌드합니다. 정점 데이터, 셰이더 및 파이프라인 상태가 함께 작동하는 방식을 배우고, 이미지를 생성하는 명령을 기록하고 제출합니다.
tutorial.details: 섹션을 순서대로 진행하세요. 먼저 빈 윈도우를 연 다음 배경색을 표시하고 마지막으로 삼각형을 그립니다. 각 체크포인트는 다음 단계를 추가하기 전에 애플리케이션의 한 부분을 확인합니다. 초기화는 한 번 실행되며, 렌더링 콜백은 호출될 때마다 새 프레임을 기록합니다.
tutorial.draw.context: "{draw}에 대한 인수는 다음과 같습니다:"
tutorial.draw.description: "{windowRender} 콜백에서 {beginRenderPass}와 {endRenderPass} 사이의 {addTheTriangleDrawCommandsHereLater}를 다음 세 가지 명령으로 바꿉니다:"
tutorial.draw.details: "{setPipeline}은 방금 생성한 셰이더와 상태를 선택합니다. 정점 데이터를 바인딩하기 전에 설정하세요. 백엔드는 파이프라인의 입력 레이아웃을 사용하여 바인딩을 해석합니다."
tutorial.draw.guidance: "{setVertexBufferVertexBuffer}는 바이트 오프셋 0부터 시작하는 버퍼를 입력 슬롯 0에 바인딩합니다. 해당 슬롯은 {inputLayouts}의 단일 항목에 해당합니다. 데이터를 다시 복사하거나 업로드하지는 않습니다."
tutorial.draw.notes: 이 시점에서는 명령이 여전히 기록되기만 한 상태입니다. 렌더링 콜백 끝에 이미 있는 {submitWait} 및 {present} 호출이 작업을 실행하고 결과를 표시합니다. 삼각형이 이미지의 일부만 가리기 때문에 클리어 작업은 여전히 필요합니다. 배경 역시 각 프레임마다 정의된 색상을 받아야 합니다.
tutorial.draw.table.firstInstance.meaning: 인스턴스 번호 매기기를 0부터 시작합니다.
tutorial.draw.table.firstVertex.meaning: 버퍼의 첫 번째 정점부터 시작합니다.
tutorial.draw.table.headings.argument: 인수
tutorial.draw.table.headings.description: 값
tutorial.draw.table.headings.meaning: 의미
tutorial.draw.table.instanceCount.meaning: 삼각형 한 개를 그립니다.
tutorial.draw.table.vertexCount.meaning: 세 개의 정점을 읽습니다.
tutorial.draw.title: 패스 내부에서 삼각형 그리기
tutorial.execution.description: "{firstTriangle} 디렉터리에서 빌드하고 실행합니다:"
tutorial.execution.details: 윈도우에는 어두운 배경에 위쪽 모서리는 빨간색, 오른쪽 아래 모서리는 녹색, 왼쪽 아래 모서리는 파란색인 삼각형이 표시되어야 합니다. 내부는 해당 색상 간의 부드러운 그라데이션을 보여야 합니다.
tutorial.execution.guidance: 윈도우 크기를 조정해 보세요. 크기 조정 콜백은 프레임버퍼 치수를 업데이트하고 스왑 체인의 크기를 조정합니다. 렌더 패스는 해당 이미지와 일치하는 뷰포트를 설정합니다. 정점 위치가 정규화된 좌표로 유지되기 때문에 삼각형은 윈도우 너비와 높이의 동일한 비율을 유지합니다. 종횡비를 변경하면 모양이 늘어날 수 있습니다. 개체의 종횡비를 유지하려면 투영 또는 뷰포트 정책이 필요하며, 이는 이 첫 번째 드로잉의 범위를 벗어납니다.
tutorial.execution.title: 실행, 크기 조정 및 닫기
tutorial.frame.commands.context: "{endRenderPass} 후 두 번째 전환은 프레젠테이션을 위해 이미지를 준비합니다. {submit}은 기록을 완료하고 명령 버퍼를 제출하며, {wait}는 GPU가 해당 제출을 완료할 때까지 기다립니다. 그런 다음 {present}는 렌더링된 이미지의 표시를 요청합니다."
tutorial.frame.commands.description: 렌더 패스는 동일한 어태치먼트를 사용하는 드로잉 작업을 그룹화합니다. 여기서 색상 어태치먼트는 스왑 체인의 출력 텍스처, 즉 드로잉을 수신하는 이미지입니다. {colorAttachmentClear}는 지정된 RGBA 색상으로 지우고 패스가 끝날 때 결과를 유지하도록 지시하는 설명을 생성합니다. {beginRenderPass}는 해당 지침을 기록하며, GPU는 명령이 제출된 후 지우기를 수행합니다.
tutorial.frame.commands.details: 대괄호에는 단일 색상 어태치먼트가 포함되어 있습니다. {null} 인수는 깊이 및 스텐실 테스트를 위한 깊이 값과 스텐실 마스크를 저장할 깊이/스텐실 어태치먼트가 없음을 의미합니다.
tutorial.frame.commands.guidance: "{beginRenderPass}는 어태치먼트를 덮는 뷰포트와 시저를 설정합니다. 뷰포트는 렌더링된 좌표를 픽셀에 매핑하고 시저는 쓸 수 있는 픽셀을 제한합니다. 이러한 기본값은 출력 텍스처 전체를 포괄하며, 이는 이 삼각형에 필요한 설정입니다."
tutorial.frame.commands.title: 클리어, 제출 및 프레젠테이션
tutorial.frame.description: 먼저 이미지를 단일 배경색으로 채웁니다. 이 작업을 클리어(clear)라고 합니다. 해당 색상이 윈도우에 나타나면 서피스, 명령 제출 및 프레젠테이션 경로가 함께 작동하고 있는 것입니다. 이 체크포인트를 사용하면 지오메트리와 셰이더를 추가하기 전에 프레임 루프를 확인할 수 있습니다.
tutorial.frame.details: "렌더링 콜백은 프레임을 그릴 때 Silk.NET이 호출하는 코드입니다. 이 콜백은 이벤트의 경과 시간 인수가 필요하지 않으므로 {value}로 지정됩니다. {emphasis}에 등록합니다:"
tutorial.frame.details.emphasis: "{windowRun} 앞"
tutorial.frame.target.description: "{graphicsQueueCommandBuffer}는 기록이 이미 시작된 명령 버퍼를 가져옵니다. 기록은 GPU에 대한 작업을 설명하는 것이며 해당 작업을 즉시 실행하지는 않습니다."
tutorial.frame.target.details: 첫 번째 {transition}은 색상 어태치먼트 접근을 위해 출력 텍스처를 준비합니다. {default}는 밉 레벨 0과 배열 레이어 0을 선택합니다. 전체 이미지를 지우고 이전 내용을 버릴 것이므로 이전 레이아웃으로 {undefined}를 사용합니다. 기존 내용을 보존해야 하는 패스는 대신 실제 이전 레이아웃을 사용해야 합니다.
tutorial.frame.target.guidance: 각 프레임마다 스왑 체인의 현재 출력 텍스처를 사용하세요. 프레젠테이션으로 인해 사용 가능한 이미지가 변경될 수 있으므로 이전 프레임에서 저장된 텍스처는 영구적인 윈도우 렌더 타깃이 아닙니다.
tutorial.frame.target.title: 출력 텍스처 준비
tutorial.frame.title: 배경색 표시
tutorial.geometry.data.description: 이 배열을 {emphasis}에 추가합니다. 다음 리소스 생성 단계도 표시된 순서대로 해당 콜백 앞에 배치됩니다.
tutorial.geometry.data.description.emphasis: "{windowRender} 앞"
tutorial.geometry.data.details: 각 배열 항목은 {vertex}를 생성합니다. 두 개의 내부 {new} 표현식은 해당 {vector3} 위치와 {vector4} 색상을 생성합니다. 정점은 위쪽, 오른쪽 아래, 왼쪽 아래 모서리를 설명합니다. 정점 셰이더는 네 번째 위치 좌표인 {w}를 제공합니다. w가 1이면 x와 y는 정규화된 장치 좌표를 직접 설명합니다. -1과 +1은 이미지 가장자리이고 0은 중심입니다. 이러한 좌표는 윈도우의 픽셀 크기에 의존하지 않습니다.
tutorial.geometry.data.guidance: 각 색상에는 빨강, 초록, 파랑 및 알파 구성 요소가 포함되어 있습니다. 알파는 세 모서리 모두에서 1입니다. 세 위치 모두 z = 0이므로 동일한 평면에 배치됩니다. 이러한 위치는 렌더링하려는 좌표를 이미 설명하고 있으므로 카메라나 변환 행렬이 필요하지 않습니다. 이 단일 평면 삼각형의 경우 블렌딩 및 깊이 테스트도 비활성화하고 깊이 버퍼를 생략합니다.
tutorial.geometry.data.title: 모서리 선택
tutorial.geometry.description: 정점은 그리는 데 사용되는 데이터와 함께 제공되는 점입니다. 우리의 삼각형에는 각 모서리마다 하나씩 세 개의 정점이 있습니다. 각각에는 위치와 색상이 포함되어 있습니다. GPU는 색상을 보간하여 삼각형 전체에 걸쳐 중간 값을 계산합니다.
tutorial.geometry.format.description: "이 선언을 {emphasis}에 추가합니다:"
tutorial.geometry.format.description.emphasis: "{programCs} 끝부분, 정리 문 뒤"
tutorial.geometry.format.details: "{file}은 이 형식을 {programCs}로 제한하며, 생성자는 위치 및 색상 필드를 초기화합니다. {layoutKindSequential}은 필드를 선언 순서대로 유지합니다. {position}에는 32비트 부동소수점 3개가 포함되고 {color}에는 4개가 포함됩니다. 이 구조체에서 위치는 바이트 0에서 시작하고 색상은 바이트 12에서 시작하며 완전한 정점은 28바이트를 차지합니다. 그래픽스 파이프라인에 동일한 레이아웃을 설명할 것입니다."
tutorial.geometry.format.title: 정점 정의
tutorial.geometry.title: GPU에 정점 세 개 제공
tutorial.geometry.upload.context: "{fixed}는 주소가 사용되는 동안 가비지 수집기가 배열을 이동하지 못하도록 방지합니다. 이 CPU 쓰기 가능 버퍼의 경우 {upload}는 반환하기 전에 메모리를 매핑, 복사 및 매핑 해제하므로 나중에 배열을 고정된 상태로 유지할 필요가 없습니다. 버퍼는 렌더링 내내 유지되어야 하며 정점이 변경되지 않으므로 업로드는 한 번만 수행하면 됩니다."
tutorial.geometry.upload.description: "관리되는 배열은 CPU 데이터입니다. {buffer}는 GPU가 정점을 읽을 수 있는 스토리지를 제공합니다. 배열 뒤에 다음을 추가합니다:"
tutorial.geometry.upload.details: "총 크기는 {sizeofVertexVerticesLength}입니다. 정점당 28바이트, 3개의 정점, 총 84바이트입니다. {bufferUsagesVertex}는 정점 입력 접근을 허용합니다. {cpuWriteOnly}를 사용하면 CPU가 이 작은 버퍼를 직접 초기화할 수 있습니다. 설명자의 스트라이드는 요소 크기를 기록합니다. 아래에서 생성할 입력 레이아웃은 개별 속성을 읽는 방법을 정점 가져오기에 알려줍니다."
tutorial.geometry.upload.guidance: 버퍼를 생성해도 채워지지는 않습니다. {upload}는 대상 바이트 오프셋 0부터 시작하여 해당 할당에 배열을 복사합니다. 소스 설명은 포인터와 복사할 바이트 수를 제공합니다.
tutorial.geometry.upload.notes: "{programCs} 하단의 정리에서 {swapChainDispose} 바로 앞에 {vertexBufferDispose}를 추가하세요. 더 큰 정적 지오메트리의 경우 {link}에서 GPU 전용 메모리와 전송 업로드를 대신 선택해야 하는 시점을 설명합니다."
tutorial.geometry.upload.notes.link: 리소스 관리
tutorial.geometry.upload.title: 버퍼 할당 및 배열 업로드
tutorial.input.description: "정점 바이트와 셰이더가 준비되었습니다. 다음으로 GPU가 각 정점을 읽는 방법을 설명합니다. 속성은 위치나 색상과 같은 단일 값입니다. 입력 레이아웃은 각 속성에 형식과 바이트 오프셋을 제공합니다. 스트라이드는 한 정점에서 다음 정점까지의 바이트 단위 거리를 제공합니다. 셰이더 생성 후 이 초기화 블록을 추가합니다:"
tutorial.input.details: "{inputLayoutAdd}는 현재 스트라이드에 요소를 추가하고 해당 스트라이드를 요소 크기만큼 늘립니다. C# 구조체를 검사하지는 않습니다. 여기서는 CPU 메모리와 셰이더 입력 간에 다음과 같은 일치 관계를 생성합니다:"
tutorial.input.guidance: "이 설명을 업데이트하지 않고 C# 필드 순서나 패딩을 변경하면 GPU가 잘못된 바이트를 읽게 됩니다. 기본 {semanticIndex}는 0이며 {pOSITION0} 및 {cOLOR0}과 일치합니다. 두 요소 모두 동일한 버퍼에 속하므로 파이프라인에는 하나의 입력 레이아웃이 포함되며 해당 버퍼를 슬롯 0에 바인딩합니다."
tutorial.input.table.headings.byteOffset: 바이트 오프셋
tutorial.input.table.headings.cField: "C# 필드"
tutorial.input.table.headings.format: 형식
tutorial.input.table.headings.shaderInput: 셰이더 입력
tutorial.input.table.nextVertex.cField: 다음 정점
tutorial.input.table.nextVertex.format: "총 스트라이드: 28바이트"
tutorial.input.table.nextVertex.shaderInput: 다음 입력 레코드
tutorial.input.table.vertexColor.format: "{float4} (16바이트)"
tutorial.input.table.vertexPosition.format: "{float3} (12바이트)"
tutorial.input.title: 정점 입력 레이아웃 설명
tutorial.lifecycle.description: "완성된 애플리케이션은 이 시퀀스를 반복합니다:"
tutorial.lifecycle.details: "윈도우를 닫으면 {run}에서 반환됩니다. 렌더링된 각 프레임은 이미 GPU 작업이 완료될 때까지 기다렸으므로 이제 사용된 리소스를 안전하게 해제할 수 있습니다. {windowRun} 이후의 정리는 다음과 같아야 합니다:"
tutorial.lifecycle.guidance: "네이티브 윈도우보다 먼저 스왑 체인을 해제하고, 모든 리소스를 해제한 후 컨텍스트를 해제하세요. 제출된 명령 버퍼는 큐가 소유하고 재활용하며, 출력 텍스처는 스왑 체인이 소유합니다. 따라서 이 애플리케이션에서는 해당 명령 버퍼와 출력 텍스처에 별도의 {dispose} 호출이 필요하지 않습니다."
tutorial.lifecycle.title: 단일 프레임의 수명 주기 추적
tutorial.pipeline.behavior: "입력 레이아웃 뒤에 다음을 추가합니다:"
tutorial.pipeline.context: "{cullNone}은 면의 방향을 버리지 않고 삼각형을 채웁니다. 정점의 순서에 따라 면의 감기 방향이 결정되므로 컬링을 비활성화하면 해당 순서로 인해 첫 번째 삼각형이 숨겨지는 것을 방지할 수 있습니다."
tutorial.pipeline.description: 이제 정점 데이터, 입력 레이아웃 및 두 개의 셰이더가 준비되었습니다. {graphicsPipeline}은 이들을 연결하고 GPU가 정점을 기본형(primitive)으로 조립하고 결과를 어태치먼트에 쓰는 방법을 지정합니다.
tutorial.pipeline.details: "파이프라인은 프로그래밍 가능한 셰이더 단계와 삼각형 조립, 면 컬링, 블렌딩과 같은 GPU 작업을 제어하는 고정 기능 설정을 결합합니다. 이 삼각형의 경우 다음 설정을 선택합니다:"
tutorial.pipeline.guidance: 색상 형식은 {swapChainDescFormat}에서 가져옵니다. 렌더 패스에서 사용하는 이미지와 일치해야 합니다. {count1}은 픽셀당 하나의 샘플을 의미합니다.
tutorial.pipeline.item: "{triangleList}는 연속된 세 개의 정점 그룹을 하나의 삼각형으로 조립합니다. 세 개의 정점을 제공하고 한 번 그리므로 인덱스 버퍼가 필요하지 않습니다."
tutorial.pipeline.notes: "{depthNone}은 깊이 테스트 및 쓰기를 비활성화하여 깊이 어태치먼트가 없는 패스와 일치시킵니다."
tutorial.pipeline.reference: "{opaque}는 블렌딩을 비활성화하므로 조각 셰이더의 색상이 삼각형 내부의 배경을 대체합니다."
tutorial.pipeline.title: 셰이더 및 정점 레이아웃 연결
tutorial.pipeline.usage: "샘플 렌더러에서와 같이 파이프라인을 생성한 후 셰이더 개체를 해제할 수 있습니다. 파이프라인 자체는 이를 사용하여 그리는 모든 프레임 동안 유지하세요. 정리에서 {vertexBufferDispose} 앞에 {pipelineDispose}를 추가합니다. 파이프라인 생성은 렌더링 콜백 전 마지막 초기화 단계입니다."
tutorial.pipeline.validation: 파이프라인 설명은 어태치먼트 구성을 선언하며 다른 이미지를 생성하지 않습니다. 위치와 색상이 하나의 버퍼에 함께 저장되므로 {inputLayouts}에는 하나의 항목이 있습니다.
tutorial.presentation.title: GPU를 윈도우에 연결
tutorial.project.context: 프로젝트의 빌드 설정에서 {emphasis}({allowUnsafeBlocks})를 사용하도록 설정하세요. 정점 데이터를 GPU에 전달하고 윈도우 도우미의 네이티브 호출에 이를 사용합니다.
tutorial.project.context.emphasis: 안전하지 않은 코드 허용
tutorial.project.description: "프로젝트를 생성하고 해당 디렉터리로 이동합니다:"
tutorial.project.details: "패키지를 설치합니다:"
tutorial.project.guidance: "{zenithNET}은 공유 렌더링 API를 제공합니다. 세 가지 백엔드 패키지를 통해 동일한 프로그램이 해당 플랫폼에 적합한 구현을 선택할 수 있습니다. {zenithNETCompiler}는 나중에 작성할 작은 GPU 프로그램인 Slang 셰이더를 해당 구현을 위해 컴파일합니다. Silk.NET은 윈도우와 이벤트 루프를 제공합니다."
tutorial.project.title: 콘솔 프로젝트 생성
tutorial.requirements.context: 빈 프로젝트에서 이 페이지를 따라갈 수 있습니다. {link} 및 해당 {detail}는 여기서 사용되는 렌더링 및 윈도우 API에 대한 참조로 제공됩니다.
tutorial.requirements.context.detail: 공유 호스트
tutorial.requirements.context.link: Hello Triangle 샘플
tutorial.requirements.description: "{emphasis}, 코드 편집기 또는 IDE, Zenith.NET 백엔드에서 지원하는 GPU 및 드라이버가 장착된 데스크톱 환경이 필요합니다. C#에 대한 기본적인 이해만 있으면 충분하며, 그래픽 개념은 사용될 때마다 설명됩니다. 이것은 일반적인 {net10} 콘솔 프로젝트입니다. 백엔드는 Zenith.NET 작업을 DirectX 12, Metal 또는 Vulkan과 같은 그래픽 API 호출로 변환합니다. 애플리케이션은 시작 시 그중 하나를 선택합니다:"
tutorial.requirements.description.emphasis: .NET 10 SDK
tutorial.requirements.details: Linux는 여기서 사용되는 윈도우 경로에 대해 X11 호환 윈도우 세션이 필요합니다. 이 삼각형을 그리는 데 선택적 레이 트레이싱 및 메시 셰이딩 기능은 필요하지 않습니다.
tutorial.requirements.guidance: Zenith.NET은 애플리케이션에서 제공하는 서피스에 렌더링합니다. Silk.NET.Windowing이 데스크톱 윈도우를 생성하고 해당 이벤트를 처리합니다. macOS에서 프레젠테이션 대상은 Metal 레이어({cAMetalLayerCs})입니다. 튜토리얼의 윈도우 도우미가 해당 레이어를 연결해 줍니다.
