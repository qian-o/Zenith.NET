samples.description: "연구하고자 하는 기능에 맞춘 예제를 선택하세요. 각 예제는 C# 렌더러와 해당 Slang 셰이더로 연결됩니다. 빈 프로젝트부터 전체 애플리케이션에 대한 설명을 원하시면 {link}부터 시작하세요."
samples.description.link: 첫 번째 삼각형
samples.execution.description: "{link}에는 하나의 데스크톱 애플리케이션 내에 6개의 독립적인 렌더러가 포함되어 있습니다. .NET 10 SDK와 아래에 설명된 지원되는 데스크톱 백엔드를 사용하세요. 애플리케이션을 빌드 및 실행한 다음 콘솔 메뉴에서 예제를 선택하세요."
samples.execution.description.link: ZenithTutorials
samples.execution.details: 호스트는 Windows에서 DirectX 12, macOS에서 Metal, Linux에서 Vulkan을 선택합니다. 선택한 백엔드에서 지원하는 장치, 드라이버 및 셰이더 컴파일러 환경을 사용하세요. Linux 윈도우 경로는 X11 또는 XWayland가 필요합니다. {link}는 패키지 종속성을 선언하고 런타임에 필요한 셰이더 및 텍스처 에셋을 복사합니다.
samples.execution.details.link: 프로젝트 파일
samples.execution.guidance: 예제들은 윈도우 처리 및 프레젠테이션 코드를 공유합니다. 연구하려는 기능에 따라 각 예제를 독립적으로 선택할 수 있습니다.
samples.execution.title: 튜토리얼 예제 실행하기
samples.host.description: "{appCs}는 컨텍스트, 윈도우 및 스왑 체인을 생성합니다. 명령 버퍼를 가져오고, 선택한 렌더러를 호출하며, 프레임을 제출하고 표시합니다. {iRendererCs}는 렌더러의 업데이트, 렌더링, 크기 조정 및 해제 메서드를 정의합니다."
samples.host.details: 컴퓨팅 및 레이 트레이싱은 오프스크린 텍스처를 생성합니다. {texturePresenterCs} 및 {presentTextureSlang}은 해당 텍스처를 윈도우의 현재 프레임의 출력 텍스처에 그립니다. 호스트는 여전히 제출 및 스왑 체인 프레젠테이션을 소유합니다.
samples.host.title: 공유 호스트 및 프레젠테이션
samples.indirectDrawing.description: 인덱스화된 간접 인수 버퍼와 구조화된 버퍼의 인스턴스별 데이터를 사용하여 큐브의 여러 복사본을 그립니다. CPU가 드로잉 인수를 제공하고 변환을 업데이트합니다. GPU 생성 인수를 추가하기 전에 간접 인수 레이아웃과 인스턴스 데이터에 대한 셰이더 접근을 이해하는 데 사용하세요.
samples.indirectDrawing.details: "{indirectDrawingRendererCs} · {indirectDrawingSlang}"
samples.indirectDrawing.title: 간접 드로잉
samples.meshShading.description: 태스크 셰이더를 사용하여 구 인스턴스를 컬링하고 지오메트리를 내보내는 메시 셰이더로 인덱스를 전달합니다. 렌더러는 파이프라인을 생성하기 전에 {contextCapabilitiesMeshShadingSupported}를 확인합니다. 태스크 및 메시 단계를 통해 리소스 핸들과 페이로드 데이터를 추적하는 데 사용하세요.
samples.meshShading.details: "{meshShadingRendererCs} · {meshShadingSlang}"
samples.meshShading.title: 메시 셰이딩
samples.rayTracing.description: 지면과 절차적 구체를 위한 하위 및 상위 가속 구조를 구축한 다음 컴퓨팅 셰이더에서 인라인 레이 쿼리를 추적합니다. 렌더러는 워크로드를 구성하기 전에 {contextCapabilitiesRayTracingSupported}를 확인합니다. 가속 구조 입력 및 셰이더 측 광선 순회에 이 예제를 사용하세요.
