samples.cube.description: 상수 버퍼의 모델, 뷰, 프로젝션 행렬, 인덱스 드로잉 및 깊이 테스트를 추가합니다. 크기 조정 시 깊이 텍스처가 다시 생성됩니다. 클립 공간 지오메트리에서 변환된 객체로 전환할 때 사용하세요. 렌더러는 {d32FloatS8UInt} 깊이/스텐실 어태치먼트를 사용합니다.
