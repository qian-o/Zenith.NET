samples.workloads.description: "메인 저장소의 {link}에는 여러 기능을 결합한 애플리케이션이 포함되어 있습니다. 해당 프로젝트는 라이브러리 소스 코드를 참조합니다. Zenith.NET 체크아웃에서 원하는 프로젝트를 실행하세요. 예:"
samples.workloads.description.link: Experiments 디렉터리
samples.workloads.details: 윈도우 기반 실험은 Windows, macOS 및 Linux/X11에 대해 동일한 호스트 선택을 사용합니다. Avalonia, WinForms, WPF, WinUI/Uno 또는 MAUI 내에서의 드로잉, 컨트롤 프레임 수명 주기 및 구현 링크에 대해서는 {link}를 참조하세요.
