### YamlMime:Resources
concepts.execution.context.description: "{graphicsContext}는 하나의 백엔드 장치를 나타내며 그래픽, 컴퓨팅 및 전송 큐를 제공합니다. 동일한 컨텍스트를 통해 워크로드에 대한 버퍼, 텍스처, 셰이더 및 파이프라인을 생성하세요. 다른 컨텍스트에서 생성된 리소스나 핸들은 이 컨텍스트의 명령 버퍼에 단순히 바인딩할 수 없습니다."
concepts.execution.context.details: 플랫폼 및 프레젠테이션 서피스에 적합한 백엔드를 선택하세요. API는 공유되지만 장치 지원 여부는 여전히 중요합니다. {capabilities}는 장치 이름과 {rayTracingSupported} 및 {meshShadingSupported} 플래그를 노출합니다. {link} 및 {detail} 샘플에서처럼 선택적 워크로드를 생성하기 전에 해당 플래그를 확인하세요. 이러한 플래그는 형식, 메모리 또는 플랫폼 제한 사항에 대한 완전한 목록이 아닙니다.
concepts.execution.context.details.detail: 메시 셰이딩
concepts.execution.context.details.link: 레이 트레이싱
concepts.execution.context.title: 컨텍스트는 리소스와 큐를 연결
concepts.execution.description: Zenith.NET 애플리케이션은 GPU 리소스를 생성하고, 이를 사용하는 명령을 기록하며, 해당 명령을 큐에 제출합니다. GPU가 제출된 작업을 실행하는 동안 CPU는 작업을 계속할 수 있습니다. 기록 호출이 반환된 후에도 해당 작업이 완료될 때까지 리소스를 유효하게 유지하세요.
concepts.execution.ownership.description: "여기서 소유권은 해제에 대한 책임을 의미합니다. C# 참조는 관리되는 개체에 대한 도달 가능성을 유지하지만 명시적인 {dispose}가 네이티브 리소스를 파괴하는 것을 막지는 않습니다. 마찬가지로 버퍼를 사용하는 명령을 제출한다고 해서 해당 버퍼의 소유권이 큐로 이전되는 것은 아닙니다."
concepts.execution.ownership.details: "종료 시 새 작업 제출을 중지하고 관련된 모든 큐의 마지막 사용을 기다린 후 애플리케이션의 리소스를 해제한 다음 컨텍스트를 해제하세요. 컨텍스트를 해제하면 자체 큐와 내부 도우미가 해제되며, 모든 애플리케이션 작업을 기다리거나 애플리케이션이 생성한 모든 리소스를 해제하지는 않습니다."
concepts.execution.ownership.guidance: "렌더링 중에도 같은 수명 규칙을 적용하세요. 리소스의 마지막 사용에 대한 완료 값을 보관하여 데이터를 덮어쓰거나 리소스를 교체할 수 있는 시점을 판단하세요. 뷰와 기반 리소스의 수명은 {link}를 참고하세요."
concepts.execution.ownership.guidance.link: 리소스 관리
concepts.execution.ownership.table.applicationResources.object: 애플리케이션이 생성한 리소스
concepts.execution.ownership.table.applicationResources.ownership: 애플리케이션이 마지막 GPU 사용 후 해제합니다.
concepts.execution.ownership.table.commandBuffers.object: 대여한 명령 버퍼
concepts.execution.ownership.table.commandBuffers.ownership: 큐가 관리하고 재활용합니다.
concepts.execution.ownership.table.headings.object: 개체
concepts.execution.ownership.table.headings.ownership: 누가 해제하는가?
concepts.execution.ownership.table.queues.object: 컨텍스트 큐 및 해당 타임라인
concepts.execution.ownership.table.queues.ownership: 컨텍스트와 큐가 관리합니다.
concepts.execution.ownership.table.swapChainDrawable.ownership: 스왑 체인이 관리합니다.
concepts.execution.ownership.title: 소유권과 GPU 완료를 구분하여 유지
concepts.execution.pipelines.description: "그래픽 파이프라인은 셰이더, 정점 입력 레이아웃, 정점을 기본형으로 조립하는 규칙, 어태치먼트 형식과 렌더 상태를 결합합니다. 정점, 인덱스 또는 상수 데이터를 바인딩하고 드로잉 명령을 기록하기 전에 설정하세요. 어태치먼트 형식과 샘플 수는 렌더 패스의 어태치먼트와 일치해야 합니다."
concepts.execution.pipelines.details: 컴퓨팅 파이프라인은 GPU 스레드 그룹을 시작하는 디스패치용 셰이더 진입점을 제공합니다. 디스패치하기 전에 파이프라인과 해당 상수를 설정하세요. 컴퓨팅 디스패치는 그래픽 렌더 패스 외부에 속합니다. 파이프라인 변경은 후속 명령이 입력을 해석하는 방식의 변경을 의미하므로, 선택한 파이프라인에 필요한 데이터를 사용하기 전에 바인딩하세요.
concepts.execution.pipelines.guidance: "{link}는 전체 그래픽 시퀀스를 보여줍니다. {detail}는 디스패치를 기록한 다음 결과를 표시하는 그래픽 패스를 기록합니다."
concepts.execution.pipelines.guidance.detail: 컴퓨팅 샘플
concepts.execution.pipelines.guidance.link: 삼각형의 렌더링 콜백
concepts.execution.pipelines.title: 파이프라인이 명령의 데이터 해석 방식 결정
concepts.execution.queues.description: 한 프레임에서 드로잉, 컴퓨팅 및 복사를 결합하는 경우 {graphicsQueue}로 시작하세요. 종속된 작업을 하나의 큐에 유지하면 순서를 파악하기가 더 쉬워집니다.
concepts.execution.queues.details: 큐는 실행을 위한 명령 배치를 수락합니다. 별도의 큐가 반드시 별도의 하드웨어 엔진에 해당하는 것은 아니므로 작업이 동시에 실행되지 않을 수도 있습니다. 워크로드가 중첩 실행의 이점을 얻을 수 있는 경우 다른 큐를 사용하고, 한 큐가 다른 큐의 결과를 소비할 때 명시적 종속성을 추가하세요.
concepts.execution.queues.guidance: 이후 명령이 이전 쓰기에 의존하는 경우, 애플리케이션은 해당 쓰기가 이후 명령에서 사용 가능한지 확인해야 합니다. 두 명령 버퍼를 동일한 큐에 제출한다고 해서 이러한 모든 종속성이 자동으로 설정되는 것은 아닙니다. 명령은 서로 다른 GPU 단계를 사용할 수 있으며, 이후 접근 시 배리어나 텍스처 전환이 필요할 수 있습니다. {link}에서 제출 순서와 리소스 가시성의 차이를 설명합니다.
concepts.execution.queues.guidance.link: 동기화
concepts.execution.queues.table.computeQueue.workToRecord: 그래픽 렌더 패스를 제외한 컴퓨팅 디스패치 및 호환 가능한 전송 작업.
concepts.execution.queues.table.graphicsQueue.workToRecord: 렌더 패스 및 드로잉, 그리고 프레임에서 사용되는 컴퓨팅 및 전송 작업.
concepts.execution.queues.table.headings.queue: 큐
concepts.execution.queues.table.headings.workToRecord: 기록할 작업
concepts.execution.queues.table.transferQueue.workToRecord: 드로잉이나 컴퓨팅 디스패치를 제외한 업로드, 다운로드 및 복사 작업.
concepts.execution.queues.title: 실행할 작업에 맞는 큐 선택
concepts.execution.recording.context: "큐는 완료를 폴링하고 완료된 명령 버퍼를 재활용합니다. 새로운 각 기록에 대해 {queueCommandBuffer}를 호출하세요. 재활용된 인스턴스가 반환될 수 있습니다. 대여한 명령 버퍼를 직접 해제하거나, 두 번 제출하거나, 제출 후에도 계속 기록하지 마세요. 지정된 명령 버퍼는 한 번에 하나의 스레드에서만 기록하세요. 큐의 내부 잠금은 명령 버퍼에 대한 동시 편집을 보호하지 않습니다."
concepts.execution.recording.description: "{queueCommandBuffer}는 기록이 이미 시작된 {commandBuffer}를 반환합니다. 명령과 해당 종속성을 기록한 다음 {submit}을 한 번 호출합니다. 제출하면 기록이 종료되고 해당 큐의 완료 지점을 식별하는 {timelineValue}가 반환됩니다."
concepts.execution.recording.details: "예를 들어, 프레임을 {commandBuffer}에 기록한 후 삼각형 튜토리얼은 이를 제출하고 다음과 같이 완료를 기다립니다:"
concepts.execution.recording.guidance: "{submit}은 작업을 예약하고, {wait}는 해당 제출이 완료될 때까지 CPU가 계속 진행되지 않도록 유지합니다. 드로잉 기록, 렌더 패스 종료 및 명령 버퍼 제출은 별개의 작업입니다. 드로잉을 기록하거나 패스를 종료하는 작업 모두 GPU를 기다리지 않습니다."
concepts.execution.recording.title: 기록은 명령을 실행하지 않음
concepts.execution.title: 실행 모델
concepts.platforms.description: 애플리케이션이 네이티브 윈도우와 프레임 루프를 소유할지 아니면 UI 렌더링 컨트롤을 사용할지 선택하세요. 이 선택에 따라 출력 텍스처를 얻고, 명령을 제출하며, 결과를 표시하는 주체가 결정됩니다. 출력 텍스처는 현재 프레임의 출력으로 사용되는 텍스처입니다. 오프스크린 그래픽 및 컴퓨팅 작업에는 윈도우나 스왑 체인이 필요하지 않습니다.
concepts.platforms.frame.context: "해당 패스 내에 파이프라인 바인딩과 드로잉 명령을 추가하세요. 반환하기 전에 패스를 종료합니다. 제공된 명령 버퍼를 독립적으로 제출하거나 별도로 표시하지 마세요. 또한 명령 버퍼나 출력 텍스처를 해제하지 마세요. 핸들러가 다른 레이아웃에서 출력 텍스처를 사용하는 경우 컨트롤의 최종 전환을 위해 {colorAttachment}로 되돌립니다."
concepts.platforms.frame.description: 통합 기능은 {iZenithView}를 구현합니다. 애플리케이션은 {graphicsContext}를 제공하고, {updateRequested}에서 장면 데이터를 업데이트하며, {renderEventArgs}를 사용하여 {renderRequested}에서 렌더링을 기록합니다.
concepts.platforms.frame.details: "컨트롤은 각 프레임의 전체 흐름을 관리합니다. 출력 텍스처와 명령 버퍼를 가져오고, 출력 텍스처를 {colorAttachment}로 전환한 뒤 핸들러를 호출합니다. 이후 프레임워크에 필요한 제출과 프레젠테이션 단계를 수행합니다."
concepts.platforms.frame.guidance: "컨텍스트가 할당된 {view}라는 초기화된 {iZenithView}의 경우, 이 핸들러는 완전한 클리어 패스를 기록합니다. {usingZenithNET}이 필요합니다:"
concepts.platforms.frame.notes: 컨트롤은 각 프레임 시작 시 {undefined}에서 전환하므로 애플리케이션은 출력 텍스처의 이전 내용이 보존되는 것에 의존할 수 없습니다. 각 프레임마다 필요한 이미지를 지우거나 렌더링하세요. 지속적인 누적이나 캐시된 렌더링은 애플리케이션 소유의 텍스처에 유지한 다음 뷰를 통해 해당 텍스처를 표시하세요.
concepts.platforms.frame.reference: "{zenithViewHelperDrawableFormat}은 통합의 기본 색상 형식을 제공합니다. 어태치먼트 형식, 샘플 수 및 치수를 일치시킬 때 실제 이벤트의 출력 텍스처를 확인하세요."
concepts.platforms.frame.title: UI 컨트롤이 제공하는 프레임에 기록
concepts.platforms.integration.context: WinForms, WPF 및 Windows WinUI 경로는 Windows가 필요합니다. MAUI 애플리케이션에는 대상 플랫폼의 워크로드가 필요하며 {useZenithView}로 컨트롤 핸들러를 등록해야 합니다. {extensionsCs}를 참조하세요. 프레임워크 지원과 백엔드 지원이 모두 충족되어야 합니다.
concepts.platforms.integration.description: "컨트롤은 이벤트 인터페이스를 공유하지만 모두 동일한 방식으로 표시되지는 않습니다:"
concepts.platforms.integration.details: 비트맵 리드백(bitmap readback)은 UI가 표시하기 전에 렌더링된 픽셀을 CPU 메모리에 복사합니다. 공유 텍스처 상호 운용성은 해당 리드백을 방지하지만 여전히 GPU 복사 및 동기화가 필요할 수 있습니다. 따라서 공유 {renderRequested} 인터페이스가 동일한 프레젠테이션 비용이나 네이티브 상호 운용성 요구 사항을 의미하지는 않습니다.
concepts.platforms.integration.guidance: "애플리케이션 프레임워크에 맞는 패키지를 사용하세요. 예:"
concepts.platforms.integration.table.avalonia.integration: Avalonia
concepts.platforms.integration.table.avalonia.presentation: 텍스처에 렌더링하고 픽셀을 {writeableBitmap}으로 다운로드합니다. {zenithViewCs} 및 {surfaceCs}를 참조하세요.
concepts.platforms.integration.table.headings.integration: 통합
concepts.platforms.integration.table.headings.presentation: 이미지가 UI에 도달하는 방식
concepts.platforms.integration.table.maui.integration: .NET MAUI
concepts.platforms.integration.table.maui.presentation: Android, iOS 및 Mac Catalyst에서는 네이티브 서피스를 사용하고 Windows에서는 공유 텍스처 구성을 사용합니다. {link}를 참조하세요.
concepts.platforms.integration.table.maui.presentation.link: 플랫폼 구현
concepts.platforms.integration.table.uno.integration: Uno 경로
concepts.platforms.integration.table.uno.presentation: 픽셀을 {writeableBitmap}으로 다운로드합니다. {zenithViewUnoCs}를 참조하세요.
concepts.platforms.integration.table.winForms.integration: WinForms
concepts.platforms.integration.table.winForms.presentation: 컨트롤의 {hWND}에 대한 Zenith.NET 스왑 체인을 생성합니다. {zenithViewCs}를 참조하세요.
concepts.platforms.integration.table.winUI.integration: Windows의 WinUI
concepts.platforms.integration.table.winUI.presentation: 가져온 공유 Direct3D 11 텍스처에 렌더링한 다음 {swapChainPanel}에 연결된 구성 스왑 체인에 복사합니다. {zenithViewWinUICs}를 참조하세요.
concepts.platforms.integration.table.wpf.integration: WPF
concepts.platforms.integration.table.wpf.presentation: 공유 Direct3D 11 텍스처를 가져온 다음 Direct3D 상호 운용성을 통해 {d3DImage}로 표시되는 서피스에 복사합니다. {surfaceCs}를 참조하세요.
concepts.platforms.integration.title: 프레임워크뿐만 아니라 프레젠테이션 경로도 선택
concepts.platforms.lifecycle.context: UI 뷰의 경우 일치하는 렌더링 리소스를 생성할 때 이벤트 출력 텍스처의 {descWidth}, {descHeight}, {descFormat} 및 {descSampleCount}를 사용하세요. 컨트롤이 해당 출력 텍스처의 해상도를 결정합니다. 논리적 치수나 디스플레이 배율이 항상 텍스처 치수와 같다고 가정하지 마세요.
concepts.platforms.lifecycle.description: 네이티브 스왑 체인의 경우 프레임버퍼 치수를 픽셀 단위로 전달하세요. 디스플레이 배율이 활성화된 경우 논리 단위로 표현된 윈도우 크기와 다를 수 있습니다. 크기가 0인 프레임버퍼는 건너뛰고, 픽셀 크기가 변경되면 스왑 체인의 크기를 조정하며, 각 프레임마다 {swapChainDrawable}을 가져옵니다. 출력 텍스처는 스왑 체인이 소유하며 프레젠테이션 또는 크기 조정 후에 변경될 수 있습니다.
concepts.platforms.lifecycle.details: "{swapChainResize}는 기존 서피스의 크기를 변경합니다. {swapChainRefresh}는 네이티브 핸들을 포함하여 서피스 설명을 대체합니다. 두 작업 중 하나를 수행하기 전에 영향을 받는 리소스의 미해결 사용을 완료하세요. 네이티브 프레젠테이션 대상을 해제하기 전에 스왑 체인을 해제하세요."
concepts.platforms.lifecycle.guidance: 윈도우 크기를 따르는 애플리케이션 소유의 깊이 또는 오프스크린 텍스처를 다시 생성하고 해당 핸들이 포함된 상수를 업데이트하세요. 파이프라인은 어태치먼트 형식과 샘플 수가 호환되는 한 크기 변경 후에도 계속 사용할 수 있습니다. {link}는 깊이 텍스처를 교체하면서 파이프라인을 유지합니다.
concepts.platforms.lifecycle.guidance.link: 회전하는 큐브 렌더러
concepts.platforms.lifecycle.title: 출력 텍스처의 크기와 수명을 호스트와 함께 유지
concepts.platforms.ownership.description: 애플리케이션은 할당한 컨텍스트와 렌더링을 위해 생성한 리소스를 소유합니다. 컨트롤은 자체 프레젠테이션 리소스를 소유합니다. 뷰의 {graphicsContext} 속성을 변경하면 스케줄러가 컨트롤의 리소스를 다시 생성하지만, 새 컨텍스트를 위해 애플리케이션의 파이프라인, 버퍼 또는 텍스처를 다시 생성하지는 않습니다.
concepts.platforms.ownership.details: "리소스 교체를 뷰의 프레임 수명 주기와 조정하세요. 애플리케이션 리소스 또는 할당된 컨텍스트를 해제하기 전에 뷰의 프레임 활동을 중지하고 미해결 GPU 사용을 완료하세요. 뷰를 제거한다고 해서 컨텍스트 소유권이 컨트롤로 이전되는 것은 아닙니다."
concepts.platforms.ownership.guidance: 공유 {frameSchedulerCs}는 뷰의 UI 디스패처를 통해 프레임 작업을 디스패치합니다. 프레임 핸들러가 프레임 업데이트 및 기록에 집중하도록 유지하세요. 장시간의 CPU 작업은 UI를 지연시킵니다.
concepts.platforms.ownership.title: 애플리케이션 리소스를 컨트롤 소유권 외부에 유지
concepts.platforms.surface.context: 윈도우 라이브러리나 UI 프레임워크가 운영 체제를 지원한다고 해서 선택한 GPU 백엔드를 해당 환경에서 사용할 수 있다는 보장은 없습니다. 장치 기능, 드라이버 및 네이티브 서피스 지원이 여전히 일치해야 합니다. 해당 워크로드를 생성하기 전에 {contextCapabilities}를 통해 선택적 레이 트레이싱 및 메시 셰이딩을 확인하세요.
concepts.platforms.surface.description: "{link}는 Silk.NET을 사용하여 윈도우를 생성하고 이벤트를 처리합니다. Zenith.NET은 {surface} 설명과 {swapChain}을 통해 해당 윈도우에 연결됩니다. 서피스에는 네이티브 핸들과 치수가 포함됩니다. 설명을 구성한다고 해서 운영 체제 윈도우가 생성되거나 소유되는 것은 아닙니다."
concepts.platforms.surface.description.link: 삼각형 튜토리얼
concepts.platforms.surface.details: "핸들은 선택한 백엔드와 일치해야 합니다:"
concepts.platforms.surface.guidance: 튜토리얼의 {appCs}는 Windows, macOS 및 X11 선택 항목을 보여줍니다. Linux 호스트는 Xlib 핸들을 제공하므로 Wayland 세션에서 사용하려면 XWayland가 필요합니다. 네이티브 Wayland 애플리케이션은 {surfaceWayland}를 통해 다른 핸들을 제공합니다.
concepts.platforms.surface.table.android.backend: Android의 Vulkan.
concepts.platforms.surface.table.apple.backend: Apple 플랫폼의 Metal.
concepts.platforms.surface.table.headings.backend: 백엔드 경로
concepts.platforms.surface.table.headings.factory: 서피스 팩토리
concepts.platforms.surface.table.headings.handles: 호스트에서 제공하는 핸들
concepts.platforms.surface.table.wayland.backend: 네이티브 Wayland 호스트를 사용하는 Vulkan.
concepts.platforms.surface.table.wayland.handles: Wayland 디스플레이 및 서피스
concepts.platforms.surface.table.win32.backend: Windows의 DirectX 12 또는 Vulkan.
concepts.platforms.surface.table.xlib.backend: X11 또는 XWayland를 사용하는 Linux의 Vulkan.
concepts.platforms.surface.table.xlib.handles: X11 디스플레이 및 윈도우
concepts.platforms.surface.title: 애플리케이션이 프레젠테이션을 소유할 때 네이티브 서피스 제공
concepts.platforms.title: 플랫폼 통합
concepts.resources.allocation.context: "자체 메모리 할당기가 필요한 경우가 아니라면 컨텍스트에서 생성한 리소스부터 사용하세요. 힙을 사용할 때는 해당 리소스를 사용하는 모든 GPU 작업이 완료된 후 배치된 리소스를 먼저 해제하고, 마지막으로 힙 자체를 해제하세요."
concepts.resources.allocation.description: "{heap}은 명시적인 바이트 오프셋에 리소스를 배치할 메모리를 제공합니다. 애플리케이션이 오프셋을 선택하고 사용 중인 영역을 추적합니다."
concepts.resources.allocation.details: "리소스를 배치하기 전에 정확한 버퍼 또는 텍스처 설명을 사용해 {contextGetSizeAndAlignment}를 호출하세요. 반환된 정렬 값의 배수인 오프셋을 선택하고, 반환된 크기만큼 공간을 확보하며, 리소스가 힙의 전체 바이트 범위 안에 있도록 하세요. 사용 중인 할당 영역은 겹치면 안 됩니다. 텍스처 저장 공간에는 백엔드별 패딩과 정렬이 포함될 수 있으므로 픽셀 수에 픽셀당 바이트 수를 곱한 값으로 할당 크기를 계산할 수는 없습니다."
concepts.resources.allocation.guidance: "배치된 버퍼의 상주 특성은 힙의 상주 특성과 일치시켜야 합니다. 여기서 설명하는 일반 GPU 텍스처에는 GPU 전용 힙을 사용하세요. 크기와 정렬은 배치 요구 사항이며, 모든 백엔드에서 임의의 리소스를 임의의 힙에 배치할 수 있다는 보장은 아닙니다."
concepts.resources.allocation.title: 할당 제어가 필요한 경우 힙에 리소스 배치
concepts.resources.bufferUsages.table.constant.role: 상수 버퍼 바인딩을 통해 읽는 셰이더 매개 변수.
concepts.resources.bufferUsages.table.headings.role: "역할"
concepts.resources.bufferUsages.table.headings.usage: 용도
concepts.resources.bufferUsages.table.index.role: 인덱스 드로잉에 사용되는 인덱스.
concepts.resources.bufferUsages.table.indirect.role: "간접 드로잉 또는 디스패치 명령이 읽는 인수."
concepts.resources.bufferUsages.table.none.role: "버퍼 용도 플래그를 선언하지 않음."
concepts.resources.bufferUsages.table.storageReadOnly.role: "읽기 전용 셰이더 바인딩으로 접근하는 버퍼 데이터."
concepts.resources.bufferUsages.table.storageReadWrite.role: "읽기 및 쓰기 셰이더 바인딩으로 접근하는 버퍼 데이터."
concepts.resources.bufferUsages.table.transferDst.role: "GPU 복사의 대상 저장 공간."
concepts.resources.bufferUsages.table.transferSrc.role: "GPU 복사의 원본 데이터."
concepts.resources.bufferUsages.table.vertex.role: 드로잉을 위해 가져오는 정점 속성.
concepts.resources.bufferUsages.title: 버퍼 용도
concepts.resources.description: "리소스를 사용할 작업에 맞춰 리소스 설명을 선택하세요. 렌더링 대상으로 쓰고, 셰이더에서 샘플링하고, CPU로 읽어 올 텍스처라면 세 가지 용도를 모두 선언하고 작업 사이의 동기화도 처리해야 합니다. 메모리 배치와 리소스 수명은 별도로 결정할 사항입니다."
concepts.resources.memory.context: CPU 접근 가능한 버퍼의 경우 {map}은 CPU에 주소를 제공합니다. GPU가 동일한 바이트에 대한 접근을 중지할 때까지 기다리지 않습니다. {unmap} 역시 작업을 제출하거나 완료를 기다리지 않습니다. CPU 쓰기 가능 데이터를 덮어쓰기 전에 이전 내용이 여전히 필요한 GPU 읽기를 완료하세요.
concepts.resources.memory.description: "{bufferDesc}에는 {residency} 필드가 있습니다. CPU와 GPU가 데이터에 접근하는 방식에 따라 선택하세요:"
concepts.resources.memory.details: 상주 특성은 할당에 대한 의도된 CPU 접근을 설명합니다. 이는 모든 장치가 물리적으로 분리된 CPU 및 GPU 메모리를 갖는다는 것을 의미하지는 않습니다. 삼각형 튜토리얼은 작은 정점 버퍼를 직접 초기화하기 위해 {cpuWriteOnly}를 사용합니다. 대규모 정적 메시는 일회성 업로드를 포함하는 GPU 전용 스토리지의 이점을 얻을 수 있습니다.
concepts.resources.memory.guidance: "{textureDesc}에는 상주 필드가 없습니다. 일반적인 컨텍스트 생성 텍스처는 GPU 스토리지를 사용합니다. 해당 공개 API는 직접 매핑 메서드를 노출하지 않고 CPU 데이터 전송을 위한 업로드 및 다운로드 작업을 제공합니다. 명시적 힙은 아래에 설명된 배치 제어를 제공합니다."
concepts.resources.memory.table.cpuReadOnly.cPUAccess: "GPU 복사가 끝난 후 매핑된 메모리를 읽음."
concepts.resources.memory.table.cpuReadOnly.typicalRole: "GPU가 생성한 리드백 데이터"
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: "이전 GPU 읽기가 끝난 후 매핑된 메모리에 씀."
concepts.resources.memory.table.cpuWriteOnly.typicalRole: "CPU가 제공하거나 갱신하는 데이터"
concepts.resources.memory.table.gpuOnly.cPUAccess: "업로드 또는 리드백 버퍼를 통해 바이트를 전송함."
concepts.resources.memory.table.gpuOnly.typicalRole: "정적 지오메트리와 GPU 작업 데이터"
concepts.resources.memory.table.headings.cPUAccess: CPU 접근
concepts.resources.memory.table.headings.residency: 상주 특성
concepts.resources.memory.table.headings.typicalRole: 일반적인 역할
concepts.resources.memory.title: "필요한 CPU 접근 방식에 맞춰 메모리 선택"
concepts.resources.textureUsages.description: "전송 용도 플래그는 GPU 복사의 방향을 나타냅니다. CPU 접근은 이와 별개인 메모리 배치 선택 사항이며 아래에서 설명합니다."
concepts.resources.textureUsages.details: "용도 플래그를 조합하면 여러 역할을 선언할 수 있지만, 작업을 실행하거나 접근 순서를 지정하지는 않습니다. 텍스처에는 여전히 적절한 {link}가 필요하며, 선택한 장치에서 해당 포맷이 요청한 용도를 지원해야 합니다."
concepts.resources.textureUsages.details.link: "레이아웃과 동기화"
concepts.resources.textureUsages.table.colorAttachment.role: "렌더 패스의 색상 어태치먼트."
concepts.resources.textureUsages.table.depthStencilAttachment.role: "렌더 패스의 깊이/스텐실 어태치먼트."
concepts.resources.textureUsages.table.headings.role: "역할"
concepts.resources.textureUsages.table.headings.usage: 용도
concepts.resources.textureUsages.table.none.role: "텍스처 용도 플래그를 선언하지 않음."
concepts.resources.textureUsages.table.sampled.role: "샘플링 텍스처 바인딩을 통해 읽는 텍스처 데이터."
concepts.resources.textureUsages.table.storage.role: "스토리지 텍스처 바인딩을 통해 셰이더가 읽거나 쓰는 텍스처 데이터."
concepts.resources.textureUsages.table.transferDst.role: "GPU 복사의 대상 이미지 저장 공간."
concepts.resources.textureUsages.table.transferSrc.role: "GPU 복사의 원본 이미지 데이터."
concepts.resources.textureUsages.title: 텍스처 용도
concepts.resources.title: 리소스 관리
concepts.resources.transfers.context: 다운로드는 내부 리드백 스토리지에 GPU 복사를 기록합니다. 라이브러리는 재사용을 위해 완료된 명령 버퍼를 재설정할 때 해당 바이트를 제공된 CPU 대상으로 복사합니다. 제출 값의 {wait}가 반환될 때까지 대상을 할당된 상태로 유지하고 관리 메모리를 고정된 상태로 유지하세요.
concepts.resources.transfers.description: "업로드는 CPU 데이터를 GPU 리소스로 복사하고, 다운로드는 리소스 데이터를 CPU 메모리로 복사합니다. 리소스 자체가 제공하는 메서드는 해당 전송을 완료한 뒤 반환합니다."
concepts.resources.transfers.details: "이러한 대기는 해당 메서드가 제출한 전송만 대상으로 합니다. 다른 큐에서 이미 리소스를 읽거나 쓰고 있던 작업과의 종속성은 찾아내지 않습니다. 리소스의 전송 메서드를 호출하기 전에 종속성을 설정하세요. 매핑된 메모리를 통한 직접 복사도 호출자가 관련 GPU 작업의 완료를 보장해야 합니다."
concepts.resources.transfers.guidance: "복사를 다른 작업과 함께 기록해야 하는 경우 {commandBufferUpload} 또는 {commandBufferDownload}를 사용하세요. 포인터 수명은 서로 다릅니다:"
concepts.resources.transfers.item: "업로드는 호출 중에 CPU 원본 데이터를 내부 업로드 버퍼인 스테이징 메모리로 복사합니다. 원본 포인터는 해당 호출이 진행되는 동안만 유효하면 됩니다."
concepts.resources.transfers.notes: "텍스처의 행 스트라이드는 CPU 데이터의 연속된 두 행 사이의 바이트 거리이며, 슬라이스 스트라이드는 연속된 깊이 슬라이스 사이의 바이트 거리입니다. 이 값은 텍스처 내부의 GPU 메모리 레이아웃이 아닙니다. GPU 완료와 리드백의 차이는 {link}를 참고하세요."
concepts.resources.transfers.notes.link: 동기화
concepts.resources.transfers.table.bufferDownload.transfer: "{cpuReadOnly}의 경우 직접 CPU 복사, 그렇지 않으면 전송 큐 다운로드를 제출하고 대기."
concepts.resources.transfers.table.bufferUpload.transfer: "{cpuWriteOnly}의 경우 직접 CPU 복사, 그렇지 않으면 전송 큐 업로드를 제출하고 대기."
concepts.resources.transfers.table.headings.method: 방법
concepts.resources.transfers.table.headings.transfer: "데이터 전송 방식"
concepts.resources.transfers.table.textureTransfers.method: "{textureUpload} / {textureDownload}"
concepts.resources.transfers.table.textureTransfers.transfer: "그래픽스 큐를 사용하여 선택한 하위 리소스를 복사용 레이아웃으로 전환하고, 복사 후 요청한 최종 레이아웃으로 전환한 다음 전송 완료를 기다림."
concepts.resources.transfers.title: "즉시 완료하는 전송과 명령에 기록하는 전송 중 선택"
concepts.resources.usages.description: "{bufferUsages} 및 {textureUsages}는 리소스의 의도된 역할을 선언하는 플래그 열거형입니다. 각각 {bufferDescUsages} 및 {textureDescUsages}에 할당됩니다. 플래그 열거형을 사용하면 리소스에 둘 이상의 역할이 있을 때 {value}를 사용하여 여러 멤버를 결합할 수 있습니다."
concepts.resources.usages.title: 리소스를 생성하기 전에 필요한 용도 선언
concepts.resources.views.description: "{bufferView}는 버퍼 영역과 그 해석을 설명합니다. {textureView}는 호환 가능한 텍스처 형식, 포맷 및 하위 리소스 범위를 선택합니다. 뷰는 기본 스토리지를 공유하며 데이터를 복사하거나 리소스 생성 시 누락된 용도를 추가하지 않습니다. 해당 범위는 셰이더 경계 검사의 이식 가능한 보장이 아닙니다."
concepts.resources.views.details: "기본 뷰에는 리소스 자체의 핸들을 사용하고, 다른 영역이나 호환되는 다른 해석이 필요하면 뷰를 생성하세요. GPU 작업이 뷰와 기본 리소스를 사용할 수 있는 동안 두 객체에 대한 C# 참조를 유지하세요. 리소스 핸들만으로는 어느 객체의 수명도 유지되지 않습니다. 마지막 GPU 사용이 완료된 뒤에만 해제하세요. 둘 중 하나를 교체하면 이전 {link}을 포함하는 상수도 갱신하세요."
concepts.resources.views.details.link: "리소스 핸들"
concepts.resources.views.guidance: "{link}는 크기 조정 시 교체되는 깊이 텍스처를 보여줍니다. {detail}는 쓰기 가능한 출력과 분리되어 유지되는 입력 텍스처를 보여줍니다. 둘 다 리소스 수명이 실제로 이를 사용하는 작업을 따르도록 합니다."
concepts.resources.views.guidance.detail: 컴퓨팅 샘플
concepts.resources.views.guidance.link: 회전하는 큐브 렌더러
concepts.resources.views.title: "뷰와 기본 리소스를 함께 사용 가능한 상태로 유지"
concepts.shaders.binding.context: "컴퓨팅 샘플에서 {input}은 {inputTextureSampledHandle}로 채워지고 {output}은 {outputTextureStorageHandle}로 채워집니다. Slang의 형식화된 {descriptorHandle}은 각 리소스에 접근하는 방법을 셰이더에 알려줍니다:"
concepts.shaders.binding.description: "{setConstantBuffer}는 현재 파이프라인의 상수 데이터에 사용할 버퍼와 바이트 오프셋을 바인딩합니다. 기존 GPU 가시적 저장 공간을 바인딩할 뿐 C# 값을 업로드하지는 않습니다. 버퍼를 먼저 채우고, 그 바이트를 덮어쓰기 전에 이전 GPU 읽기 작업이 완료되었는지 확인하세요."
concepts.shaders.binding.details: "상수 버퍼 앞에 파이프라인을 설정하세요. 리소스가 이미 생성되고 업로드된 컴퓨팅 워크로드의 경우 기록 시 다음 순서를 사용합니다:"
concepts.shaders.binding.guidance: 이 조각은 기록 중인 {commandBuffer}, {computePipeline}, {bufferUsagesConstant} 용도로 업로드된 {constantBuffer} 및 워크로드의 스레드 그룹 수를 전제로 합니다. 오프셋 0은 버퍼의 시작을 바인딩합니다. 여러 상수 데이터 레코드가 하나의 버퍼를 공유하는 경우 각 레코드의 시작 오프셋은 백엔드의 바인딩 정렬을 충족해야 합니다. 이 요구 사항은 레코드 내부의 필드 레이아웃과 별개입니다.
concepts.shaders.binding.notes: "{resourceHandle}은 두 개의 32비트 필드를 저장하지만 그 해석은 백엔드에 속합니다. 이를 컨텍스트 간에 전송할 수 있는 범용 설명자 인덱스, 주소 또는 값으로 취급하지 마세요. 핸들은 리소스를 생성하거나 누락된 용도를 추가하거나 동기화를 수행하지 않습니다."
concepts.shaders.binding.reference: "리소스 및 핸들을 얻는 데 사용된 모든 뷰에 대한 참조를 유지하고 셰이더의 마지막 사용이 완료된 후에만 해제하세요. 텍스처나 뷰를 교체할 때 이전 핸들이 포함된 상수를 업데이트하세요. {link}에서 해당 수명 관계를 설명합니다."
concepts.shaders.binding.reference.link: 리소스 관리
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: 셰이더 형식 {t}의 구조화된 요소를 읽습니다.
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: 셰이더 형식 {t}의 구조화된 요소를 읽거나 씁니다.
concepts.shaders.binding.table.headings.access: 의도된 접근
concepts.shaders.binding.table.headings.cHandle: "C# 핸들"
concepts.shaders.binding.table.headings.slangFieldType: Slang 필드 형식
concepts.shaders.binding.table.samplerHandle.access: 텍스처 샘플링 상태를 제공합니다.
concepts.shaders.binding.table.textureSampledHandle.access: 텍스처를 읽습니다.
concepts.shaders.binding.table.textureStorageHandle.access: 스토리지 텍스처를 읽거나 씁니다.
concepts.shaders.binding.title: 상수 버퍼 및 해당 버퍼가 설명하는 리소스 바인딩
concepts.shaders.compilation.description: "{zenithCompiler}는 명명된 Slang 진입점을 컴파일하고 {shaderDesc}를 반환합니다. 결과가 셰이더를 생성할 백엔드(DirectX 12의 경우 DXIL, Metal의 경우 Metal 라이브러리, Vulkan의 경우 SPIR-V)를 대상으로 하도록 컨텍스트의 {graphicsApi}를 사용하세요."
concepts.shaders.compilation.details: "예를 들어 기존 {context}가 있고 삼각형 셰이더가 실행 파일 옆에 복사된 경우:"
concepts.shaders.compilation.guidance: "{vSMain}은 셰이더 파일의 진입점 이름과 정확히 일치해야 합니다. 파이프라인을 생성하는 동안 셰이더 개체를 유효하게 유지한 다음, {link}에 표시된 대로 파이프라인 생성 후에 해제하세요. 매 프레임마다 다시 컴파일하는 대신 이 초기화를 한 번 수행하세요."
concepts.shaders.compilation.guidance.link: 첫 번째 삼각형
concepts.shaders.compilation.title: 선택한 컨텍스트를 위한 진입점 컴파일
concepts.shaders.description: "셰이더는 애플리케이션에서 제공하는 데이터를 수신합니다. 정점 속성은 개별 정점을 설명하고, 버퍼는 매개 변수나 배열을 보유하며, 리소스 핸들은 셰이더가 접근할 다른 리소스를 식별합니다. C# 선언과 Slang 선언은 해당 값이 의미하는 바에 대해 일치해야 합니다. 필드 이름을 일치시키는 것만으로는 충분하지 않으며 레이아웃, 리소스 접근 및 바인딩이 모두 일치해야 합니다."
concepts.shaders.dispatch.description: "{dispatch}는 스레드 그룹 수를 받습니다. 컴퓨팅 샘플의 {numthreads} 진입점은 그룹당 16 × 16개의 스레드를 실행합니다. 이미지 치수를 16으로 나누고 올림하여 그룹 수를 계산합니다. 예를 들어 17 × 19 이미지는 2 × 2 그룹이 필요합니다. 마지막 그룹에는 이미지 외부의 스레드가 포함될 수 있으므로 셰이더는 픽셀 좌표를 이미지 크기와 비교하여 검사합니다."
concepts.shaders.dispatch.details: 컴파일러는 진입점의 선언된 그룹 크기를 {shaderDescThreadGroupSize}에 저장하며 {dispatch}에 제공된 픽셀 치수를 그룹 수로 변환하지 않습니다. 완전한 바인딩 및 디스패치 예제에는 셰이더와 함께 {computeShaderRendererCs}를 사용하고 다른 패스가 출력을 사용하기 전에 {link}를 사용하세요.
concepts.shaders.dispatch.details.link: 동기화
concepts.shaders.dispatch.title: 픽셀이 아닌 스레드 그룹 디스패치
concepts.shaders.layout.context: "{link}는 해당 오프셋을 명시적으로 표시합니다. 이 선언에는 범위 내에 {systemRuntimeInteropServices} 및 {zenithNET}이 필요합니다:"
concepts.shaders.layout.context.link: "컴퓨팅 샘플의 C# 상수"
concepts.shaders.layout.description: "정점 입력의 경우 파이프라인의 {inputLayout}은 형식, 오프셋, 스트라이드 및 의미 체계를 설명합니다. 삼각형의 {float3} 위치 뒤에 오는 {float4} 색상은 28바이트를 차지하며 바이트 12에 색상이 있습니다. {inputLayoutAdd}는 이 패킹된 레이아웃을 계산하며 C# 구조체를 검사하지 않습니다. C# 필드에 패딩이 포함된 경우 필드가 패킹되어 있다고 가정하지 말고 일치하는 레이아웃을 제공하세요."
concepts.shaders.layout.details: "상수 버퍼는 셰이더 매개 변수를 보유하는 반면, 구조화된 버퍼는 선언된 형식의 요소 배열을 보유합니다. 둘 다 Slang 선언에 따라 읽힙니다. {inputLayout}을 사용하지 않습니다. 패딩을 포함하여 컴파일된 셰이더 표현에 대한 필드 오프셋과 요소 크기를 확인하세요. 관리되지 않는 C# 형식은 바이트 단위로 복사하기에 적합하지만 그것만으로는 셰이더 형식과 일치함을 입증할 수 없습니다. 특히 정점의 밀접하게 패킹된 {float3} 레이아웃을 모든 셰이더 버퍼에 적용하지 마세요."
concepts.shaders.layout.guidance: 리소스 핸들은 기존 리소스를 참조하는 작은 값입니다. 핸들을 상수 버퍼에 복사한다고 해서 리소스의 내용이 복사되는 것은 아닙니다.
concepts.shaders.layout.notes: "{computeShaderSlang}의 해당 선언은 다음과 같습니다:"
concepts.shaders.layout.reference: "치수는 처음 8바이트를 차지하고 그 뒤에 8바이트 리소스 핸들 2개가 옵니다. C# 샘플은 총 256바이트를 예약합니다. 해당 크기는 샘플이 선택한 스토리지 크기이며 모든 Slang 구조체나 상수 페이로드가 256바이트를 차지해야 한다는 규칙은 아닙니다. 전체 크기를 패딩해도 잘못된 오프셋의 필드가 수정되지는 않습니다."
concepts.shaders.layout.title: 정점 입력과 셰이더 데이터의 서로 다른 레이아웃 규칙
concepts.shaders.matrices.description: 컴파일러는 각 행의 요소를 함께 저장하는 행 우선(row-major) 행렬 스토리지를 요청합니다. {link}는 오프셋 0, 64 및 128에 세 개의 {matrix4x4} 값을 배치합니다. 해당 {detail}는 모델, 뷰 및 프로젝션 순서로 {mulVectorMatrix}를 사용합니다.
concepts.shaders.matrices.description.detail: 셰이더
concepts.shaders.matrices.description.link: 회전하는 큐브 렌더러
concepts.shaders.matrices.details: 저장 순서는 행렬 요소가 메모리를 차지하는 방식을 결정하고 곱셈 순서는 변환을 결정합니다. 양쪽의 일관성을 유지하세요. 두 가지 선택을 확인하지 않고 전치(transpose)를 추가하면 다른 불일치를 유발하면서 한 가지 불일치를 숨길 수 있습니다.
concepts.shaders.matrices.title: 행렬 스토리지 및 곱셈의 일관성 유지
concepts.shaders.title: 셰이더 데이터 및 바인딩
concepts.synchronization.backends.description: DirectX 12 및 Vulkan은 레이아웃 및 접근 정보로 텍스처 전환을 인코딩합니다. Metal은 Zenith.NET의 {transition} 구현에 작업이 없습니다. Metal은 기록된 작업을 렌더 및 컴퓨팅 인코더로 그룹화합니다. 백엔드는 이러한 그룹을 끝낼 때 가시성 배리어를 삽입하여 이후 작업에서 이전 쓰기를 사용할 수 있도록 합니다. 명시적 {barrier} 호출은 동일한 인코더 내에서 연속적인 컴퓨팅 디스패치와 같은 종속성을 처리합니다.
concepts.synchronization.backends.details: 이 차이점은 워크로드를 변경할 때 중요합니다. {link}에서 디스패치 뒤에는 그래픽 렌더 패스가 오며, 이는 Metal에서도 인코더 경계를 생성합니다. 두 개의 종속 컴퓨팅 디스패치는 텍스처의 선언된 레이아웃을 변경하는 것만으로는 해당 경계를 생성하지 않습니다. 공유 API에 필요한 전환을 유지하고 실제 생성 및 소비 명령 간의 종속성을 별도로 식별하세요.
concepts.synchronization.backends.details.link: 컴퓨팅 샘플
concepts.synchronization.backends.title: 전환이 모든 백엔드에서 동일하지는 않음
concepts.synchronization.barriers.context: "{barrierStagesAll}은 더 넓은 범위이며 자동 종속성 감지기가 아닙니다. 작업을 실제로 포괄하는 단계를 선택하고 해당 작업을 지원하는 큐에서만 사용하세요."
concepts.synchronization.barriers.description: "두 개의 컴퓨팅 디스패치를 생각해 보세요. 첫 번째는 시뮬레이션 데이터를 쓰고 두 번째는 다음 단계를 수행하기 위해 해당 데이터를 읽습니다. 둘 다 스토리지 버퍼를 사용하므로 변경할 텍스처 레이아웃이 없습니다. 명령 버퍼의 디스패치 사이에 다음을 삽입합니다:"
concepts.synchronization.barriers.details: 첫 번째 인수는 생산 단계를 식별하고 두 번째 인수는 소비 단계를 식별합니다. 배리어는 GPU에 해당 실행 및 메모리 종속성을 설정합니다. 백엔드는 이러한 단계를 실행 및 메모리 접근 규칙으로 변환합니다. 이 배리어는 텍스처의 레이아웃을 변경하지 않으며 장치의 모든 작업을 대기하지도 않습니다.
concepts.synchronization.barriers.guidance: "{link}는 종속 디스패치 간에 이 패턴을 사용합니다. 종속성이 발생하는 곳에 배리어를 배치하세요. 소비자가 이미 기록된 후의 배리어는 해당 소비자를 이전 생산자 뒤에 순서대로 배치할 수 없습니다."
concepts.synchronization.barriers.guidance.link: FluidTank 시뮬레이션
concepts.synchronization.barriers.title: 배리어로 종속 명령 순서 지정
concepts.synchronization.dependencies.description: 각 공유 리소스에 대해 먼저 접근하는 작업, 그 뒤를 잇는 작업, 둘 중 쓰기 접근이 있는지 식별합니다. 동일한 데이터를 두 번 읽는 것은 내용을 보호하기 위한 순서 지정이 필요하지 않지만, 레이아웃 변경이나 프레젠테이션으로 인해 다른 요구 사항이 적용될 수 있습니다. 쓰기 후 읽기, 읽기 후 덮어쓰기 또는 두 번의 쓰기에는 종속성이 필요할 수 있습니다.
concepts.synchronization.dependencies.details: "그런 다음 해당 작업이 실행되는 위치에 대한 메커니즘을 선택합니다:"
concepts.synchronization.dependencies.guidance: 이러한 메커니즘은 관련되어 있지만 상호 교환할 수 없습니다. 명령을 순서대로 제출한다고 해서 모든 메모리 종속성이 대체되는 것은 아닙니다. 큐 대기는 새 텍스처 레이아웃을 선언하지 않으며 명령 배리어는 호출하는 CPU 스레드에서 대기하지 않습니다.
concepts.synchronization.dependencies.table.cpuAccess.mechanism: 해당 완료 값에 대해 {wait}를 호출합니다.
concepts.synchronization.dependencies.table.cpuAccess.situation: CPU가 데이터에 접근하거나 해제하기 전에 대기해야 하는 경우
concepts.synchronization.dependencies.table.crossQueue.mechanism: 소비하는 명령 버퍼의 {submit}에 해당 {timelineValue}를 전달합니다.
concepts.synchronization.dependencies.table.crossQueue.situation: 다른 큐의 제출이 데이터를 생성하는 경우
concepts.synchronization.dependencies.table.headings.mechanism: 메커니즘
concepts.synchronization.dependencies.table.headings.situation: 상황
concepts.synchronization.dependencies.table.layoutChange.mechanism: 이전 및 다음 레이아웃이 포함된 {commandBufferTransition}.
concepts.synchronization.dependencies.table.layoutChange.situation: 텍스처 하위 리소스 사용 방식 변경
concepts.synchronization.dependencies.table.pipelineStages.mechanism: 생산 및 소비 단계를 포함하는 {commandBufferBarrier}.
concepts.synchronization.dependencies.table.pipelineStages.situation: 명령 스트림의 종속 GPU 단계
concepts.synchronization.dependencies.title: 생산자와 소비자로 시작
concepts.synchronization.description: "이전 명령이 쓴 데이터를 읽는 명령은 쓰기가 완료되어 그 결과를 읽을 수 있어야 합니다. 쓰는 쪽은 생산자이고 읽는 쪽은 소비자입니다. CPU도 공유 데이터를 읽거나 덮어쓰거나 해제하기 전에 완료 지점이 필요합니다. Zenith.NET은 이러한 종속성에 맞춰 배리어, 텍스처 전환과 타임라인을 제공합니다."
concepts.synchronization.layouts.context: "{undefined}는 이전 내용을 보존할 필요가 없음을 의미합니다. 새 이미지나 완전히 지워질 어태치먼트에 적합합니다. 내용을 로드, 샘플링 또는 누적할 이미지의 레이아웃 추적을 피하기 위한 방법이 아닙니다."
concepts.synchronization.layouts.description: "용도 플래그는 텍스처가 지원하는 역할을 설명합니다. {textureLayout}은 작업을 위해 특정 하위 리소스에 접근하는 방식을 설명합니다. 하위 리소스는 선택된 밉 레벨과 배열 레이어입니다. 레이아웃을 변경하면 해당 접근이 준비되지만 텍스처가 다른 픽셀 형식으로 변환되지는 않습니다. 예를 들어 컴퓨팅 샘플은 {storage} 레이아웃으로 출력 텍스처를 작성한 다음 그래픽 패스에서 이를 샘플링합니다. 이러한 사용 사이에 다음을 기록합니다:"
concepts.synchronization.layouts.details: 이 조각은 {outputTexture}가 {sampledStorage} 용도로 생성되었고 선택된 하위 리소스가 {storage} 레이아웃에 있다고 가정합니다. {default}는 밉 레벨 0과 배열 레이어 0을 선택합니다. 이 작업은 텍스처의 모든 밉 또는 레이어를 전환하지는 않습니다.
concepts.synchronization.layouts.guidance: 애플리케이션은 이전 레이아웃을 제공합니다. {transition}은 애플리케이션에 표시되는 레이아웃 추적기를 유지 관리하지 않으며 이전 명령에서 해당 값을 유추하지도 않습니다. 리소스가 렌더링 단계 간에 전달되는 곳마다 레이아웃을 추적하세요.
concepts.synchronization.layouts.title: 각 텍스처 하위 리소스의 레이아웃 추적
concepts.synchronization.readback.description: "{isCompleted}는 GPU 타임라인이 값에 도달했는지만 쿼리합니다. 명령 버퍼를 회수하거나 스테이징된 다운로드를 애플리케이션의 대상 포인터에 복사하지는 않습니다."
concepts.synchronization.readback.details: "{commandBufferDownload}는 먼저 내부 리드백 저장 공간으로의 복사를 기록합니다. 완료된 명령 버퍼를 재사용하도록 재설정할 때 CPU가 데이터를 제공된 포인터로 복사합니다. 해당 다운로드 제출 값의 {wait}가 반환될 때까지 대상 메모리를 유효하게 유지하고 관리 메모리를 고정하세요. 데이터 읽기나 메모리 해제는 그 이후에 해야 합니다. 다른 큐의 후속 제출을 기다리는 것만으로는 다운로드를 관리하는 큐가 폴링되지 않습니다."
concepts.synchronization.readback.guidance: 이것이 {isCompleted}를 폴링하고 비동기 다운로드 대상을 즉시 읽는 것만으로는 충분하지 않은 이유입니다. {link}에서 직접 복사 및 스테이징 전송 경로를 다룹니다.
concepts.synchronization.readback.guidance.link: 리소스 관리
concepts.synchronization.readback.title: GPU 완료와 다운로드된 CPU 데이터는 별개의 단계임
concepts.synchronization.reuse.description: "첫 번째 렌더러의 경우 각 프레임 직후에 대기하는 것이 간단합니다. 작업을 중첩하려면 미해결 프레임에 별도의 가변 데이터를 제공하고 각 프레임의 최종 사용 완료 값을 유지하세요. 상수 버퍼를 업데이트하거나 텍스처를 교체하거나 파이프라인을 해제하기 전에 영향을 받는 리소스에 대한 모든 미해결 접근을 완료하세요."
concepts.synchronization.reuse.details: "크기 조정 또는 종료 시 이전 작업을 기다리기 전에 새 사용을 중지하세요. {swapChainResize}, 리소스 해제 및 컨텍스트 해제는 애플리케이션 작업에 대한 일반적인 대기 역할을 하지 않습니다. 이전 각 프레임이 이미 제출을 완료했으므로 삼각형 튜토리얼은 콜백 간에 안전하게 크기를 조정할 수 있습니다."
concepts.synchronization.reuse.guidance: 현재 {swapChainPresent}도 프레젠테이션 작업 후 그래픽 큐에서 신호를 보내고 대기합니다. 따라서 삼각형의 명시적 제출 대기를 제거한다고 해서 그 자체로 중첩 프레젠테이션 루프가 설정되지는 않습니다. 또한 그래픽 큐 대기는 다른 큐에서 여전히 실행 중인 독립적인 작업에 대해서는 아무것도 보장하지 않습니다.
concepts.synchronization.reuse.title: 최종 접근 후에만 데이터 재사용
concepts.synchronization.timelines.context: "CPU가 이러한 리소스를 읽거나 덮어쓰거나 해제하기 전에 최종 사용을 기다리세요:"
concepts.synchronization.timelines.description: 타임라인은 증가하는 값을 사용하여 큐의 완료를 추적합니다. {submit}은 해당 타임라인과 제출과 관련된 값을 포함하는 {timelineValue}를 반환합니다. 서로 다른 타임라인의 완료 값은 숫자 {value} 필드만으로는 비교할 수 없습니다.
concepts.synchronization.timelines.details: "{producer}와 {consumer}가 동일한 컨텍스트의 두 큐에서 이미 기록된 명령 버퍼라고 가정합니다. 생산자는 소비자가 사용하는 데이터를 씁니다. 다음과 같이 제출하세요:"
concepts.synchronization.timelines.guidance: 생성된 값을 전달하면 소비 큐가 GPU에서 이를 기다립니다. CPU는 여기서 {producedWait}를 호출하지 않습니다. {consumed}가 완료될 때까지 공유 리소스를 유효하게 유지하고 소비자가 요구하는 텍스처 레이아웃 변경 사항을 기록하세요.
concepts.synchronization.timelines.notes: "{wait}는 해당 타임라인 값을 기다린 다음 소유 큐에서 완료된 제출을 확인합니다. 완료된 명령 버퍼는 재사용을 위해 재설정되고 스테이징된 다운로드는 제공된 CPU 대상에 복사됩니다. {queueTimelineSignal}은 해당 큐에 이미 제출된 작업 후에 완료 지점을 큐에 추가할 수도 있습니다. {signal}을 호출한다고 해서 GPU가 이미 해당 지점에 도달했음을 의미하지는 않습니다."
concepts.synchronization.timelines.title: 완료 및 큐 전달에 타임라인 사용
concepts.synchronization.title: 동기화
