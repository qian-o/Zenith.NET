samples.workloads.table.fluidTank.whatItDemonstratesAndRequires: 컴퓨팅 유체 시뮬레이션, 시뮬레이션 단계 간 종속성 및 다중 패스 표면 렌더링을 보여줍니다. 데스크톱 백엔드 및 셰이더 컴파일러 환경이 필요합니다.
samples.workloads.table.headings.example: 예제
