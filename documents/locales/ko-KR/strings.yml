tutorial.requirements.title: 시작하기 전에
tutorial.resize.context: "{dotnetRun}을 다시 실행합니다. 이제 윈도우에는 크기를 조정한 후에도 계속 채워지는 균일한 어두운 배경이 있어야 합니다. 이 콜백을 유지하세요. 삼각형은 기존 렌더 패스 내에 그려집니다."
tutorial.resize.description: "스왑 체인의 이미지는 프레임버퍼 치수를 따라야 합니다. 디스플레이 배율로 인한 변경 사항을 포함하여 픽셀 크기 변경에 응답하려면 {framebufferResize}를 사용하세요. 렌더링 콜백 뒤, 여전히 {windowRun} 앞에 다음을 추가합니다:"
tutorial.resize.details: Silk.NET은 윈도우 크기 변경과 {link}를 구분합니다. 스왑 체인은 픽셀을 저장하므로 후자가 필요합니다. 최소화된 윈도우는 크기가 0인 프레임버퍼를 가질 수 있습니다. 두 콜백 모두 해당 경우 GPU 작업을 건너뜁니다. 크기 조정 후 렌더 패스는 뷰포트 및 시저에 새 어태치먼트 치수를 사용합니다.
tutorial.resize.details.link: 프레임버퍼 크기 변경
tutorial.resize.guidance: 제출할 때마다 기다리므로 크기 조정 핸들러가 이미지를 바꿀 때 이전 프레임이 여전히 해당 이미지를 사용하고 있지 않습니다. 현재 {present} 구현도 그래픽 큐에서 대기합니다. 이 간단한 루프는 다음 프레임이 시작되기 전에 한 프레임의 작업이 완료된 상태를 유지합니다. {link}에서 고급 일정 관리를 다룹니다.
tutorial.resize.guidance.link: 동기화
tutorial.resize.title: 크기 조정에 대응
tutorial.shaders.compilation.context: 컴파일은 초기화 중에 한 번 수행됩니다. {appContextBaseDirectory}는 현재 작업 디렉터리와 관계없이 실행 파일 옆에 복사된 셰이더를 찾습니다. 이러한 셰이더는 정점 입력만 사용하므로 바인딩할 상수 버퍼, 텍스처 또는 리소스 핸들이 아직 없습니다.
tutorial.shaders.compilation.description: "{triangleSlang}의 파일 속성에서 {emphasis}를 {detail}로 설정합니다. 이렇게 하면 실행 파일 옆에서 셰이더를 사용할 수 있습니다."
tutorial.shaders.compilation.description.detail: 변경된 내용만 복사
tutorial.shaders.compilation.description.emphasis: 출력 디렉터리에 복사
tutorial.shaders.compilation.details: "{programCs}로 돌아갑니다. 정점 업로드 후, 렌더링 콜백 앞에 다음 초기화 문을 추가합니다:"
tutorial.shaders.compilation.guidance: "{zenithCompiler}는 요청된 그래픽 API용 코드가 포함된 셰이더 설명을 반환합니다. {createShader}는 해당 백엔드 개체를 생성합니다. 그래픽 API와 진입점 이름이 모두 중요합니다. {contextGraphicsApi}를 사용하고 {vSMain} 및 {fSMain}을 Slang 파일과 정확히 동일한 철자로 작성하세요."
tutorial.shaders.compilation.title: 선택한 백엔드용으로 컴파일
tutorial.shaders.context: "{fSInput}은 정점 셰이더의 출력을 조각 셰이더의 입력에 연결합니다. 정점 셰이더가 쓰는 {sVPOSITION}은 클립 공간 위치를 제공하며, GPU는 이 네 좌표로 가시 영역 안에 있는 내용을 판단합니다. {cOLOR0}은 정점 사이에서 보간할 색상을 전달합니다. 두 단계에서 사용하는 형식과 시맨틱이 일치해야 합니다."
tutorial.shaders.description: 셰이더는 GPU가 실행하는 프로그램입니다. 이 드로잉에는 정점을 배치하기 위한 정점 셰이더와 삼각형 내부의 색상을 생성하기 위한 조각 셰이더가 필요합니다. 우리는 셰이더 언어인 Slang으로 이를 작성하고 동일한 파일에서 두 개의 진입점을 컴파일할 것입니다. 진입점은 셰이더 단계가 실행되기 시작하는 함수입니다.
tutorial.shaders.details: "이 두 구조체로 시작하여 {triangleSlang}을 생성합니다:"
tutorial.shaders.fragment.description: "동일한 파일에 조각 진입점을 추가합니다:"
tutorial.shaders.fragment.details: 래스터화는 삼각형이 포함하는 이미지 위치를 결정합니다. 덮인 영역 전체에 걸쳐 정점 색상이 보간되어 조각 셰이더가 처리하는 데이터인 조각(fragment)을 생성합니다. {fSMain}은 첫 번째 색상 어태치먼트를 식별하는 {sVTARGET}을 통해 이 보간된 색상을 반환합니다.
tutorial.shaders.fragment.guidance: 정점 색상 보간은 어태치먼트 블렌딩과 별개입니다. 블렌딩은 조각의 출력과 어태치먼트에 이미 저장된 색상을 결합합니다. 불투명 블렌드 상태는 해당 결합을 비활성화하므로 보간된 색상이 삼각형 내부의 배경을 대체합니다.
tutorial.shaders.fragment.title: 조각 색상 지정
tutorial.shaders.guidance: "{vSInput}은 정점 셰이더가 정점 버퍼로부터 수신하는 내용을 설명합니다. 의미 체계 {pOSITION0} 및 {cOLOR0}이 입력을 식별합니다. C# 필드 이름만으로는 해당 매핑이 설정되지 않습니다."
tutorial.shaders.title: 두 셰이더 단계 작성
tutorial.shaders.vertex.description: "정점 진입점을 {triangleSlang}에 추가합니다:"
tutorial.shaders.vertex.details: GPU는 각 입력 정점에 대해 이 진입점을 호출합니다. 위치에 동차 좌표 {w}를 추가하고 색상을 전달합니다. 정점 단계 후에 위치는 w로 나누어집니다. 여기서는 해당 나눗셈으로 x, y, z가 변경되지 않은 상태로 유지됩니다. 이것이 위에서 선택한 위치를 정규화된 장치 좌표로 직접 이해할 수 있는 이유입니다.
tutorial.shaders.vertex.title: 각 정점 위치 지정
tutorial.surface.description: "컨텍스트는 출력을 표시할 위치도 알아야 합니다. {emphasis}에 다음을 추가합니다:"
tutorial.surface.description.emphasis: "{windowCenter} 뒤, {windowRun} 앞"
tutorial.surface.details: "{surface}는 네이티브 프레젠테이션 대상 및 픽셀 크기를 설명합니다. 프레임버퍼는 윈도우와 연결된 픽셀 이미지입니다. {framebufferSize}는 픽셀 단위 크기를 제공합니다. 디스플레이 배율이 활성화된 경우 윈도우의 논리적 크기와 다를 수 있습니다."
tutorial.surface.guidance: 서피스는 위에서 선택한 백엔드와 일치합니다. Windows는 윈도우 핸들을 제공하고, Linux는 X11 디스플레이 및 윈도우를 제공하며, macOS 도우미는 연결된 Metal 레이어를 제공합니다. 이것이 윈도우를 렌더링에 연결하는 유일한 플랫폼별 부분입니다.
tutorial.surface.title: 네이티브 서피스 설명
tutorial.swapChain.context: "스왑 체인은 컨텍스트와 네이티브 윈도우를 모두 사용합니다. {programCs} 하단의 {windowDispose} 줄을 다음 정리 순서로 바꿉니다:"
tutorial.swapChain.description: "서피스 설명을 사용하여 표시될 이미지를 생성합니다. 서피스 블록 바로 뒤에 다음을 추가합니다:"
tutorial.swapChain.details: "{swapChain}은 윈도우에 표시되는 이미지를 관리합니다. 각 프레임에서 {drawable}은 현재 이미지를 이미지 데이터용 API 형식인 {texture}로 제공합니다. 드로잉 후 {present}는 결과 표시를 요청하고 다음 drawable로 이동합니다."
tutorial.swapChain.guidance: "{b8G8R8A8UNorm}은 파란색, 녹색, 빨간색 및 알파 순서로 4개의 8비트 색상 채널을 저장합니다. {uNorm}은 0부터 255까지의 정수 값이 0부터 1까지의 값을 나타냄을 의미합니다. 셰이더는 여전히 논리적 RGBA 값을 반환하지만, 이 형식은 해당 채널이 이미지에 저장되는 방식을 결정합니다. 나중에 그래픽스 파이프라인은 {swapChainDescFormat}을 사용하여 이 어태치먼트와 일치시킵니다."
tutorial.swapChain.title: 스왑 체인 생성
tutorial.title: 첫 번째 삼각형
tutorial.troubleshooting.description: "먼저 콘솔에서 오류를 읽은 다음 이전 체크포인트를 사용하여 실패한 단계를 식별하세요:"
tutorial.troubleshooting.details: "{link} 및 {detail}를 사용하여 정점 데이터, 입력 레이아웃 및 드로잉 작업을 비교하세요. 해당 샘플은 윈도우 처리 및 제출을 공유 호스트에 배치하지만, 이 튜토리얼은 애플리케이션 흐름을 {programCs}에 유지합니다. 인덱스 드로잉, 변환 및 깊이 테스트를 배우려면 {context}로 계속 진행하세요."
tutorial.troubleshooting.details.context: 회전하는 큐브
tutorial.troubleshooting.details.detail: Slang 셰이더
tutorial.troubleshooting.details.link: 샘플 렌더러
tutorial.troubleshooting.table.backend.check: 선택한 백엔드가 장치 및 설치된 그래픽 드라이버에서 지원되는지 확인합니다.
tutorial.troubleshooting.table.backend.symptom: 백엔드 생성 실패
tutorial.troubleshooting.table.drawing.check: 업로드 크기, 입력 레이아웃, 파이프라인 선택 및 렌더 패스 내부의 드로잉 명령 배치를 확인합니다.
tutorial.troubleshooting.table.drawing.symptom: 배경은 나타나지만 삼각형은 나타나지 않음
tutorial.troubleshooting.table.headings.check: 확인 사항
tutorial.troubleshooting.table.headings.symptom: 증상
tutorial.troubleshooting.table.input.check: "28바이트 스트라이드와 0 및 12의 위치/색상 오프셋을 확인합니다."
tutorial.troubleshooting.table.input.symptom: 정점 위치 또는 색상이 손상됨
tutorial.troubleshooting.table.shaders.check: 복사된 {triangleSlang}, 진입점 철자 및 컴파일러에서 보고된 진단을 확인합니다.
tutorial.troubleshooting.table.shaders.symptom: 클리어 색상 단계는 작동하지만 셰이더 로드에 실패함
tutorial.troubleshooting.table.window.check: .NET 프로젝트가 빌드되고 윈도우 전용 단계가 데스크톱 세션에서 실행되는지 확인합니다. Linux의 경우 X11 또는 XWayland를 사용할 수 있는지 확인합니다.
tutorial.troubleshooting.table.window.symptom: 윈도우가 열리지 않음
tutorial.troubleshooting.title: 실패한 단계 확인
tutorial.window.context: "{usingZenithTutorials}는 도우미의 네임스페이스를 가져옵니다. 각 C# 파일은 고유한 일반 using 지시문을 사용하므로 상호 운용성 가져오기는 두 파일 모두에 필요합니다. 별칭 {buffer}는 Zenith.NET 버퍼 형식을 나타내며 {systemBuffer}와 구별합니다."
tutorial.window.description: "{cocoaHelperCs}를 네임스페이스를 유지한 상태로 프로젝트에 추가합니다. 해당 파일의 맨 위, 네임스페이스 선언 앞에 {interopUsing}을 추가합니다. 도우미는 macOS에서 윈도우에 Metal 레이어를 연결하며, 다른 플랫폼 분기에서는 이를 호출하지 않습니다."
tutorial.window.details: "생성된 {programCs}를 다음 코드로 교체합니다. 명시적인 {main} 메서드 없이 순서대로 실행되는 최상위 문을 사용합니다. 이후 섹션에서 이 동일한 파일에 코드를 추가할 위치를 안내합니다:"
tutorial.window.guidance: "{graphicsAPINone}은 Silk.NET에 자체 그래픽스 컨텍스트가 없는 윈도우를 생성하도록 요청합니다. 해당 컨텍스트는 Zenith.NET으로 생성합니다. {initialize}는 네이티브 윈도우를 생성하고 핸들을 사용할 수 있게 합니다. 핸들은 윈도우 시스템에서 제공하는 식별자입니다. {center}는 윈도우를 화면 중앙에 배치하고, {run}은 윈도우가 닫힐 때까지 이벤트를 처리합니다. 그런 다음 실행은 윈도우를 해제하는 {dispose}로 계속됩니다."
tutorial.window.notes: "{dotnetRun}을 실행합니다. 빈 윈도우가 열리고 이동, 크기 조정 및 닫기에 응답해야 합니다. 렌더링 명령을 아직 제출하지 않았으므로 해당 내용은 아직 정의되지 않았습니다. 계속하기 전에 닫으세요."
