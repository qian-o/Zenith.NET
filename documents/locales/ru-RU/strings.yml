tutorial.input.table.vertexPosition.format: "{float3} (12 байт)"
tutorial.input.title: Описание разметки входных вершинных данных
tutorial.lifecycle.description: "Готовое приложение повторяет следующую последовательность:"
tutorial.lifecycle.details: "Закрытие окна приводит к выходу из метода {run}. Каждый отрисованный кадр уже дождался завершения работы на GPU, поэтому мы можем освободить использованные ресурсы. Блок очистки после {windowRun} должен выглядеть так:"
tutorial.lifecycle.guidance: "Освобождайте цепочку обмена до её нативного окна, а контекст — после всех его ресурсов. Очередь владеет отправленными командными буферами и повторно использует их; выходной текстурой владеет цепочка обмена. Поэтому для этих командных буферов и выходной текстуры в данном приложении не нужен отдельный вызов {dispose}."
tutorial.lifecycle.title: Жизненный цикл одного кадра
tutorial.pipeline.behavior: "После разметки входных данных добавьте:"
tutorial.pipeline.context: "{cullNone} задаёт заполнение треугольника без отсечения по ориентации грани. Порядок вершин определяет направление обхода, поэтому отключение отсечения не позволит этому порядку скрыть наш первый треугольник."
tutorial.pipeline.description: Теперь у нас есть данные вершин, разметка входных данных и два шейдера. Объект {graphicsPipeline} объединяет их и определяет, как GPU собирает вершины в примитивы и записывает результат во вложение.
tutorial.pipeline.details: "Конвейер объединяет программируемые стадии шейдеров с настройками фиксированных функций, которые управляют такими операциями GPU, как сборка треугольников, отсечение граней и смешивание цветов. Для этого треугольника выберите следующие параметры:"
tutorial.pipeline.guidance: Формат цвета берётся из {swapChainDescFormat}. Он должен совпадать с изображением, используемым проходом рендеринга. Значение {count1} означает один сэмпл на пиксель.
tutorial.pipeline.item: "{triangleList} собирает каждую последовательную тройку вершин в один треугольник. Мы передадим три вершины и выполним одну отрисовку, поэтому индексный буфер не нужен."
tutorial.pipeline.notes: "{depthNone} отключает проверку и запись глубины, что соответствует проходу без вложения глубины."
tutorial.pipeline.reference: "{opaque} отключает смешивание, поэтому цвет фрагментного шейдера заменяет фон внутри треугольника."
tutorial.pipeline.title: Связывание шейдеров и разметки вершин
tutorial.pipeline.usage: Объекты шейдеров можно освободить после создания конвейера, как это сделано в демонстрационном рендерере. Сам конвейер должен оставаться активным для каждого кадра, где он используется для отрисовки. Добавьте {pipelineDispose} перед {vertexBufferDispose} в блоке очистки. Создание конвейера — последний шаг инициализации перед обратным вызовом рендеринга.
tutorial.pipeline.validation: Описание конвейера объявляет конфигурацию вложений; оно не создаёт дополнительного изображения. Массив {inputLayouts} содержит одну запись, так как положение и цвет хранятся вместе в одном буфере.
tutorial.presentation.title: Подключение GPU к окну
tutorial.project.context: Включите {emphasis} ({allowUnsafeBlocks}) в настройках сборки проекта. Это необходимо для передачи данных вершин в GPU и для нативных вызовов вспомогательного класса окна.
tutorial.project.context.emphasis: Разрешить небезопасный код
tutorial.project.description: "Создайте проект и перейдите в его каталог:"
tutorial.project.details: "Установите пакеты:"
tutorial.project.guidance: Пакет {zenithNET} предоставляет общий API рендеринга. Три пакета бэкендов позволяют одной и той же программе выбирать реализацию для своей платформы. {zenithNETCompiler} компилирует шейдеры Slang — небольшие программы GPU, которые мы напишем позже, — для этой реализации. Silk.NET предоставляет окно и цикл обработки событий.
tutorial.project.title: Создание консольного проекта
tutorial.requirements.context: Вы можете следовать инструкциям на этой странице с чистого проекта. Пример {link} и его {detail} доступны в качестве справочника по используемым здесь API рендеринга и окон.
tutorial.requirements.context.detail: общий хост
tutorial.requirements.context.link: Hello Triangle
tutorial.requirements.description: "Вам понадобятся {emphasis}, редактор кода или IDE, а также компьютер с GPU и драйвером, поддерживаемыми бэкендом Zenith.NET. Достаточно базовых знаний C#; графические концепции вводятся по мере их использования. Это обычный консольный проект {net10}. Бэкенд преобразует операции Zenith.NET в вызовы графического API, такого как DirectX 12, Metal или Vulkan. Приложение выбирает один из них при запуске:"
tutorial.requirements.description.emphasis: .NET 10 SDK
tutorial.requirements.details: Для Linux требуется сессия оконного менеджера, совместимая с X11, для используемого здесь оконного пути. Дополнительные возможности трассировки лучей и mesh shading для этого треугольника не требуются.
tutorial.requirements.guidance: Zenith.NET выполняет рендеринг в поверхность, предоставляемую приложением. Silk.NET.Windowing создаёт окно рабочего стола и обрабатывает его события. В macOS целевым объектом вывода является слой Metal ({cAMetalLayerCs}); вспомогательный класс окна из учебника подключает этот слой автоматически.
