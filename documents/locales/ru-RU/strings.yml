### YamlMime:Resources
concepts.execution.context.description: Объект {graphicsContext} представляет устройство бэкенда и предоставляет его очереди графики, вычислений и передачи данных. Создавайте буферы, текстуры, шейдеры и конвейеры для рабочей нагрузки через один и тот же контекст. Ресурс или дескриптор, созданный другим контекстом, нельзя просто привязать к командным буферам текущего контекста.
concepts.execution.context.details: Выберите бэкенд для платформы и поверхности презентации. API остаётся общим, но возможности устройства имеют решающее значение. Объект {capabilities} предоставляет имя устройства и флаги {rayTracingSupported} и {meshShadingSupported}. Проверяйте соответствующий флаг перед созданием опциональной рабочей нагрузки, как это сделано в примерах {link} и {detail}. Эти флаги не представляют собой исчерпывающий список ограничений форматов, памяти или платформы.
concepts.execution.context.details.detail: mesh shading
concepts.execution.context.details.link: трассировки лучей
concepts.execution.context.title: Контекст объединяет ресурсы и очереди
concepts.execution.description: Приложение Zenith.NET создаёт ресурсы GPU, записывает команды, использующие их, и отправляет эти команды в очередь. CPU может продолжать работу, пока GPU выполняет отправленные задачи. Сохраняйте ресурсы активными до завершения этой работы, даже после того, как вызовы записи команд завершились.
concepts.execution.ownership.description: "Здесь владение означает ответственность за освобождение ресурса. Ссылка C# удерживает управляемый объект от сборки мусора; она не препятствует уничтожению нативного ресурса при явном вызове {dispose}. Аналогично, отправка команды, использующей буфер, не передаёт владение этим буфером очереди."
concepts.execution.ownership.details: При завершении работы прекратите отправку новых задач, дождитесь окончания последних операций во всех задействованных очередях, освободите ресурсы приложения и затем освободите контекст. Освобождение контекста очищает его собственные очереди и внутренние вспомогательные структуры; оно не ожидает все задачи приложения и не освобождает каждый ресурс, созданный приложением.
concepts.execution.ownership.guidance: Применяйте те же правила времени жизни и во время рендеринга. Сохраняйте значение завершения для последнего использования ресурса, чтобы знать, когда его байты можно перезаписать или когда ресурс можно заменить. О времени жизни представлений и базовых ресурсов см. в разделе {link}.
concepts.execution.ownership.guidance.link: Управление ресурсами
concepts.execution.ownership.table.applicationResources.object: Ресурсы, созданные приложением
concepts.execution.ownership.table.applicationResources.ownership: Приложение освобождает их после последнего использования на GPU.
concepts.execution.ownership.table.commandBuffers.object: Заимствованные командные буферы
concepts.execution.ownership.table.commandBuffers.ownership: Очередь управляет ими и повторно использует их.
concepts.execution.ownership.table.headings.object: Объект
concepts.execution.ownership.table.headings.ownership: Кто освобождает?
concepts.execution.ownership.table.queues.object: Очереди контекста и их временные шкалы
concepts.execution.ownership.table.queues.ownership: Контекст и очереди управляют ими.
concepts.execution.ownership.table.swapChainDrawable.ownership: Цепочка обмена управляет ею.
concepts.execution.ownership.title: Разделение владения и завершения на GPU
concepts.execution.pipelines.description: Графический конвейер объединяет шейдеры, разметку входных вершин, правила сборки вершин в примитивы, форматы вложений и состояние рендеринга. Установите его перед привязкой данных вершин, индексов или констант и перед вызовом команд отрисовки. Форматы его вложений и число сэмплов должны совпадать со свойствами вложений прохода рендеринга.
concepts.execution.pipelines.details: Вычислительный конвейер предоставляет точку входа шейдера для диспатча, запускающего группы потоков GPU. Установите его и его константы перед вызовом диспатча. Вычислительные диспатчи должны находиться вне графических проходов рендеринга. Смена конвейера меняет то, как последующие команды интерпретируют свои входные данные; привязывайте данные, требуемые выбранным конвейером, перед его использованием.
concepts.execution.pipelines.guidance: В разделе {link} показана полная последовательность графических операций. В {detail} записывается диспатч с последующим графическим проходом, отображающим результат.
concepts.execution.pipelines.guidance.detail: примере вычислений
concepts.execution.pipelines.guidance.link: обратный вызов рендеринга треугольника
concepts.execution.pipelines.title: Конвейер определяет, как команды интерпретируют данные
concepts.execution.queues.description: Начинайте с {graphicsQueue}, если кадр сочетает отрисовку, вычисления и копирование. Размещение зависимых задач в одной очереди упрощает контроль за их очерёдностью.
concepts.execution.queues.details: Очередь принимает пакеты команд для выполнения. Раздельные очереди не обязательно соответствуют отдельным аппаратным движкам, поэтому их работа может не выполняться параллельно. Используйте другую очередь, когда нагрузка может выиграть от перекрытия выполнения, и добавляйте явную зависимость, если одна очередь использует результаты другой.
concepts.execution.queues.guidance: Когда последующие команды зависят от предыдущих записей, приложение должно гарантировать, что эти записи доступны последующим командам. Отправка обоих командных буферов в одну и ту же очередь не устанавливает автоматически каждую такую зависимость. Команды могут выполняться на разных стадиях GPU, и последующим обращениям может потребоваться барьер или переход текстуры. В разделе {link} объясняется различие между порядком отправки и видимостью ресурсов.
concepts.execution.queues.guidance.link: Синхронизация
concepts.execution.queues.table.computeQueue.workToRecord: Вычислительные диспатчи и совместимые операции передачи данных без графических проходов рендеринга.
concepts.execution.queues.table.graphicsQueue.workToRecord: Проходы рендеринга и отрисовка, а также операции вычислений и передачи данных, используемые кадром.
concepts.execution.queues.table.headings.queue: Очередь
concepts.execution.queues.table.headings.workToRecord: Записываемая работа
concepts.execution.queues.table.transferQueue.workToRecord: Операции загрузки, скачивания и копирования данных без отрисовки и вычислительных диспатчей.
concepts.execution.queues.title: Выбор очереди для выполняемой работы
concepts.execution.recording.context: Очередь опрашивает статус завершения и повторно использует завершённые командные буферы. Вызывайте {queueCommandBuffer} для каждой новой записи; метод может вернуть повторно используемый экземпляр. Не освобождайте полученный командный буфер вручную, не отправляйте его дважды и не продолжайте запись в него после отправки. Записывайте данный командный буфер только из одного потока одновременно; внутренние блокировки очереди не защищают от одновременных изменений командного буфера.
concepts.execution.recording.description: Метод {queueCommandBuffer} возвращает {commandBuffer} с уже начатой записью. Запишите команды и их зависимости, затем вызовите {submit} один раз. Отправка завершает запись и возвращает {timelineValue}, определяющий точку завершения на этой очереди.
concepts.execution.recording.details: "Например, после записи кадра в {commandBuffer} учебник отправляет его и ожидает завершения следующим образом:"
concepts.execution.recording.guidance: Метод {submit} ставит работу в расписание; {wait} удерживает CPU от продолжения до завершения этой отправки. Запись отрисовки, завершение прохода рендеринга и отправка командного буфера — это независимые операции. Ни запись отрисовки, ни завершение прохода не ожидают GPU.
concepts.execution.recording.title: Запись не выполняет команды
concepts.execution.title: Модель выполнения
concepts.platforms.description: Выберите, владеет ли ваше приложение нативным окном и циклом кадров самостоятельно или использует элемент управления рендерингом UI. Этот выбор определяет, кто получает выходную текстуру, отправляет команды и выводит результат на экран. Выходная текстура — это текстура, используемая для вывода текущего кадра. Закадровая графика и вычисления не требуют наличия окна или цепочки обмена.
concepts.platforms.frame.context: Добавьте привязки конвейера и команды отрисовки внутри этого прохода. Завершите проход до возврата управления. Не отправляйте предоставленный командный буфер и не вызывайте презентацию самостоятельно, а также не освобождайте командный буфер или выходную текстуру. Если обработчик использует выходную текстуру в другом layout, верните её в состояние {colorAttachment} перед завершающим переходом элемента управления.
concepts.platforms.frame.description: Интеграции реализуют интерфейс {iZenithView}. Приложение предоставляет свой {graphicsContext}, обновляет данные сцены в {updateRequested} и записывает команды рендеринга в {renderRequested} с использованием {renderEventArgs}.
concepts.platforms.frame.details: "Элемент управления отвечает за полный цикл обработки кадра. Он получает выходную текстуру и командный буфер, переводит текстуру в состояние {colorAttachment}, вызывает обработчики, а затем выполняет отправку команд и презентацию, требуемые фреймворком."
concepts.platforms.frame.guidance: "Для инициализированного представления {iZenithView} с именем {view} и назначенным контекстом данный обработчик записывает полный проход очистки. Для него требуется директива {usingZenithNET}:"
concepts.platforms.frame.notes: Элементы управления выполняют переход из {undefined} в начале каждого кадра, поэтому приложения не могут рассчитывать на сохранение предыдущего содержимого выходной текстуры. Очищайте или заново отрисовывайте требуемое изображение в каждом кадре. Храните постоянные накопленные данные или кэшированный рендеринг в текстуре, принадлежащей приложению, и выводите эту текстуру через элемент управления.
concepts.platforms.frame.reference: "{zenithViewHelperDrawableFormat} задаёт формат цвета по умолчанию для интеграций. При согласовании форматов вложений, числа сэмплов и размеров проверяйте фактическую выходную текстуру события."
concepts.platforms.frame.title: Запись команд в кадр, предоставляемый элементом управления UI
concepts.platforms.integration.context: Для WinForms, WPF и варианта WinUI требуется Windows. Приложениям MAUI требуется рабочая нагрузка целевой платформы и регистрация обработчика через {useZenithView}; см. {extensionsCs}. Должны поддерживаться как фреймворк, так и графический бэкенд.
concepts.platforms.integration.description: "Элементы управления используют общий интерфейс событий, но способ вывода изображения у них различается:"
concepts.platforms.integration.details: Считывание растровых изображений (bitmap readback) копирует отрисованные пиксели в память CPU перед их отображением в UI. Взаимодействие через разделяемые текстуры позволяет избежать этого считывания, но всё же может требовать копирования и синхронизации на GPU. Общий интерфейс {renderRequested} не означает одинаковых накладных расходов на презентацию или идентичных требований к взаимодействию.
concepts.platforms.integration.guidance: "Используйте пакет, соответствующий фреймворку приложения, например:"
concepts.platforms.integration.table.avalonia.integration: Avalonia
concepts.platforms.integration.table.avalonia.presentation: Рендерит в текстуру и считывает пиксели в {writeableBitmap}. См. {zenithViewCs} и {surfaceCs}.
