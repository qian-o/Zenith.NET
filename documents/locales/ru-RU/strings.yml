concepts.synchronization.dependencies.title: 'Зависимости обращений'
concepts.synchronization.description: 'Синхронизация задаёт порядок обращений к общим данным и обеспечивает доступ последующих операций к нужным результатам. В зависимости между записью и чтением записывающая операция производит данные, а читающая их потребляет. Барьеры и переходы состояния текстур координируют обращения GPU; временные шкалы связывают отправки и позволяют CPU дождаться завершения работы GPU.'
concepts.synchronization.layouts.context: 'Указывайте {undefined} как предыдущее состояние, когда существующее содержимое можно отбросить, например для нового изображения или вложения, которое будет заполнено целиком. Если содержимое нужно сохранить для загрузки, выборки или накопления, используйте состояние предыдущего обращения.'
concepts.synchronization.layouts.description: 'Флаги назначения текстуры объявляют допустимые способы её использования. {textureLayout} описывает доступ к конкретному подресурсу в определённой точке последовательности команд. Подресурс задаётся mip-уровнем и слоем массива. При смене способа доступа запишите переход. Например, вычислительный пример записывает выходную текстуру в состоянии {storage}, затем подготавливает её к выборке в графическом проходе:'
concepts.synchronization.layouts.details: 'Здесь {outputTexture} создана с назначением {sampledStorage}, а выбранный подресурс находится в {storage}. {default} выбирает уровень mip 0 и слой 0. Остальные уровни и слои переход не затрагивает.'
concepts.synchronization.layouts.guidance: 'В {transition} передавайте состояние предыдущего использования подресурса. Приложение отслеживает это состояние при записи команд и передаче текстур между этапами рендеринга.'
concepts.synchronization.layouts.title: 'Состояния текстур'
concepts.synchronization.readback.description: '{isCompleted} сообщает о завершении работы GPU. У записанного считывания есть ещё один этап: копирование результата из внутренней памяти для считывания в память назначения приложения.'
concepts.synchronization.readback.details: '{commandBufferDownload} записывает копирование на GPU во внутреннюю память. После завершения отправки библиотека выполняет копию на CPU, возвращая командный буфер для повторного использования. Вызов {wait} для значения этой отправки дожидается GPU и обрабатывает завершённые буферы той же очереди, тем самым завершая оба этапа. До возврата память назначения должна оставаться выделенной, а управляемая память — закреплённой.'
concepts.synchronization.readback.guidance: 'Один лишь опрос {isCompleted} не выполняет заключительную копию на CPU. Ожидание другой очереди тоже не обрабатывает завершённые командные буферы очереди считывания. Когда загрузка и считывание используют прямой доступ к памяти, а когда промежуточное хранилище, описано в статье «{link}».'
concepts.synchronization.readback.guidance.link: Управление ресурсами
concepts.synchronization.readback.title: 'Завершение считывания'
concepts.synchronization.reuse.description: 'Треугольник дожидается завершения каждого кадра перед повторным использованием данных. Чтобы выполнение кадров перекрывалось, выделите каждому ещё выполняющемуся кадру собственную изменяемую память и отслеживайте, когда она снова станет доступной. Перед изменением данных дождитесь обращений GPU к тем же байтам, а перед освобождением ресурса — всех его незавершённых использований.'
concepts.synchronization.reuse.details: 'Изменение размера и завершение приложения подчиняются тому же правилу: прекратить новые обращения, дождаться текущих, затем заменить или освободить ресурсы. Соблюдайте этот порядок перед {swapChainResize} и перед освобождением ресурсов или контекста. Треугольник уже ждёт каждый кадр, поэтому может менять размер между вызовами обработчиков.'
concepts.synchronization.reuse.guidance: 'После вывода изображения {swapChainPresent} устанавливает точку завершения в графической очереди и ожидает её. Поэтому треугольник всё равно ждёт при выводе, даже если удалить явное ожидание после отправки команд. Работа, независимо отправленная в другие очереди, требует отдельного отслеживания завершения.'
concepts.synchronization.reuse.title: 'Повторное использование ресурсов'
concepts.synchronization.timelines.context: 'Если после потребителя CPU должен прочитать результат, перезаписать общие данные или освободить ресурсы, дождитесь этой отправки:'
concepts.synchronization.timelines.description: 'Временная шкала отмечает завершение в очереди возрастающими значениями. {submit} возвращает {timelineValue} со шкалой и значением отправки. Числовые поля {value} разных шкал нельзя сравнивать напрямую.'
concepts.synchronization.timelines.details: 'Пусть {producer} и {consumer} — записанные командные буферы двух очередей одного контекста, причём потребитель читает результат производителя. Отправьте их с такой зависимостью:'
concepts.synchronization.timelines.guidance: 'Очередь-потребитель ждёт указанного значения завершения перед выполнением своих команд. CPU может продолжать работу без вызова {producedWait}. Сохраняйте общие ресурсы до завершения {consumed} и записывайте переходы состояния текстур, необходимые для доступа потребителя.'
concepts.synchronization.timelines.notes: 'Значение, возвращённое {queueTimelineSignal}, также можно ожидать через {wait} или передать как зависимость другой очереди. {signal} помещает точку завершения после ранее отправленной работы; GPU достигает её, когда эта работа закончена.'
concepts.synchronization.timelines.title: 'Временные шкалы и зависимости очередей'
concepts.synchronization.title: Синхронизация
