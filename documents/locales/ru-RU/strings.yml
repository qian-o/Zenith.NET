samples.workloads.description.link: "Каталог Experiments"
samples.workloads.details: Оконные эксперименты используют те же варианты хоста для Windows, macOS и Linux/X11. Сведения об отрисовке внутри Avalonia, WinForms, WPF, WinUI/Uno или MAUI, жизненном цикле кадров элемента управления и ссылки на реализации см. в разделе {link}.
