samples.workloads.table.fluidTank.whatItDemonstratesAndRequires: Вычислительное моделирование жидкости, зависимости между стадиями симуляции и многопроходный рендеринг поверхности. Требуется бэкенд настольной платформы и среда компиляции шейдеров.
