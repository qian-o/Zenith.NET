concepts.resources.allocation.context: "Начните с ресурсов, создаваемых контекстом, если вам не нужен собственный аллокатор. При использовании кучи дождитесь завершения всех задач GPU, обращающихся к её ресурсам. Затем освободите размещённые ресурсы и только после этого саму кучу."
concepts.resources.allocation.description: "Объект {heap} предоставляет память для размещения ресурсов по явно заданным смещениям в байтах. Приложение выбирает эти смещения и отслеживает занятые области."
concepts.resources.allocation.details: "Перед размещением вызовите {contextGetSizeAndAlignment} с точным описанием буфера или текстуры. Выберите смещение, кратное возвращённому выравниванию, зарезервируйте возвращённый размер и убедитесь, что ресурс не выходит за общий размер кучи в байтах. Области действующих выделений памяти не должны пересекаться. Хранилище текстуры может включать заполнение и выравнивание, зависящие от бэкенда, поэтому произведение числа пикселей на число байтов на пиксель не даёт размер выделения."
concepts.resources.allocation.guidance: "Для размещённых буферов резидентность буфера должна соответствовать резидентности кучи. Обычные текстуры GPU, описанные здесь, размещайте в кучах только для GPU. Размер и выравнивание — требования к размещению, а не гарантия того, что любой ресурс можно поместить в любую кучу на каждом бэкенде."
concepts.resources.allocation.title: Размещение ресурсов в куче при необходимости контроля выделения памяти
concepts.resources.bufferUsages.table.constant.role: Параметры шейдера, считываемые через привязку буфера констант.
