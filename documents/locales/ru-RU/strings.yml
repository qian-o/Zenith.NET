concepts.shaders.binding.table.headings.slangFieldType: Тип поля Slang
concepts.shaders.binding.table.samplerHandle.access: 'Состояние выборки из текстур'
concepts.shaders.binding.table.textureSampledHandle.access: 'Чтение текстур'
concepts.shaders.binding.table.textureStorageHandle.access: 'Чтение и запись текстур хранения'
concepts.shaders.binding.title: 'Буферы констант и дескрипторы ресурсов'
concepts.shaders.compilation.description: '{zenithCompiler} компилирует точку входа Slang и возвращает {shaderDesc}. Свойство {graphicsApi} контекста определяет формат результата: {dxil} для DirectX 12, {metallib} для Metal или {spirv} для Vulkan.'
concepts.shaders.compilation.details: 'Используя уже созданный графический контекст {context}, скомпилируйте шейдер треугольника из копии рядом с исполняемым файлом:'
concepts.shaders.compilation.guidance: 'Имя точки входа {vSMain} должно совпадать с её объявлением в файле шейдера. Компилируйте шейдеры и создавайте конвейеры при инициализации, а во время рендеринга используйте готовые конвейеры повторно. После создания конвейера объекты шейдеров можно освободить, как показано в {link}.'
concepts.shaders.compilation.guidance.link: 'учебном примере треугольника'
concepts.shaders.compilation.title: 'Компиляция шейдеров'
concepts.shaders.description: 'Объявления C# и Slang должны согласованно определять, где хранится каждое значение и как шейдер к нему обращается. Описания вершинного ввода задают атрибуты вершин, объявления буферов в шейдерах — параметры и массивы, а дескрипторы указывают используемые шейдером ресурсы.'
concepts.shaders.dispatch.description: '{dispatch} задаёт число выполняемых групп потоков. В вычислительном примере объявлено {numthreads}, поэтому каждая группа содержит 16 × 16 потоков. Чтобы обработать всё изображение, разделите ширину и высоту на 16 и округлите каждый результат вверх. Для изображения 17 × 19 пикселей нужны 2 × 2 группы. Шейдер проверяет координаты каждого потока и пропускает те, что выходят за границы изображения.'
concepts.shaders.dispatch.details: 'Объявленный размер группы доступен через {shaderDescThreadGroupSize}. По нему можно рассчитать число групп для {dispatch}; полный расчёт показан в {computeShaderRendererCs}. Последующие обращения к полученному изображению должны соблюдать требования из статьи «{link}».'
concepts.shaders.dispatch.details.link: Синхронизация
concepts.shaders.dispatch.title: 'Группы потоков'
concepts.shaders.layout.context: 'Такая организация показана в {link}: они содержат размеры изображения и два дескриптора текстур. Явные смещения указывают начало каждого поля. Для объявления используются {systemRuntimeInteropServices} и {zenithNET}:'
concepts.shaders.layout.context.link: 'константах C# примера вычислений'
concepts.shaders.layout.description: 'Для вершинного ввода {inputLayout} задаёт формат, смещение и семантику каждого атрибута, а также шаг между вершинами. В треугольнике за позицией {float3} следует цвет {float4}: цвет начинается со смещения 12 байт, а вершина занимает 28 байт. {inputLayoutAdd} рассчитывает эту плотную раскладку по форматам элементов. Если структура C# содержит выравнивающие промежутки, учитывайте их в смещениях и шаге.'
concepts.shaders.layout.details: 'Константные буферы содержат параметры шейдера, а структурированные — массивы типизированных элементов. Их раскладка определяется объявлениями Slang, а не {inputLayout}. Смещения полей C#, размеры элементов и выравнивающие промежутки должны соответствовать раскладке скомпилированного шейдера. Неуправляемый тип C# можно скопировать как последовательность байтов, но его размещение в памяти не обязательно соответствует раскладке шейдера: плотно упакованный {float3} в вершине может требовать другого выравнивания в буфере шейдера.'
concepts.shaders.layout.guidance: 'Параметры шейдера могут содержать дескрипторы ресурсов наряду с обычными значениями. Дескриптор указывает на уже существующую память, поэтому его копирование в константный буфер не копирует содержимое ресурса.'
concepts.shaders.layout.notes: 'Соответствующее объявление в {computeShaderSlang}:'
concepts.shaders.layout.reference: 'Поля C# занимают первые 24 байта: восемь под размеры и восемь под каждый из двух дескрипторов. Размер записи составляет 256 байт; остальные байты служат заполнением. Для другого блока параметров согласуйте смещения полей с раскладкой в шейдере. Если несколько записей размещены в одном буфере, добавьте между ними байты заполнения, чтобы начальное смещение каждой записи соответствовало требуемому выравниванию привязки.'
concepts.shaders.layout.title: 'Размещение данных'
concepts.shaders.matrices.description: 'Компилятор использует построчное хранение матриц: элементы каждой строки расположены подряд. В {link} три значения {matrix4x4} находятся по смещениям 0, 64 и 128 байт. Его {detail} применяет {mulVectorMatrix} в порядке модели, вида и проекции.'
concepts.shaders.matrices.description.detail: 'шейдер'
concepts.shaders.matrices.description.link: 'рендерере вращающегося куба'
concepts.shaders.matrices.details: 'Порядок хранения определяет размещение элементов матрицы в памяти; порядок умножения — преобразование. Используйте согласованные соглашения в C# и Slang.'
concepts.shaders.matrices.title: 'Соглашения о матрицах'
concepts.shaders.title: Данные шейдеров и привязка
concepts.synchronization.backends.description: 'DirectX 12 и Vulkan кодируют переходы текстур как изменения состояния и доступа. В реализации {transition} для Metal в Zenith.NET нет эквивалентной операции. Вместо этого реализация для Metal объединяет команды в графические и вычислительные кодировщики и вставляет барьеры видимости при завершении кодировщика. Для зависимых операций внутри одного кодировщика, например последовательных вычислительных запусков, нужны явные вызовы {barrier}.'
concepts.synchronization.backends.details: "В {link} начало графического прохода завершает вычислительный кодировщик и делает его результат видимым графическим командам. Два последовательных вычислительных запуска остаются в одном кодировщике, поэтому их зависимость требует барьера, даже если между ними записан переход состояния текстуры."
concepts.synchronization.backends.details.link: примере вычислений
concepts.synchronization.backends.title: 'Синхронизация в разных графических API'
concepts.synchronization.barriers.context: 'Выбирайте стадии, которые охватывают нужные обращения и поддерживаются очередью. {barrierStagesAll} включает все поддерживаемые стадии. Если зависимость затрагивает лишь часть из них, можно указать более узкий набор.'
concepts.synchronization.barriers.description: 'Рассмотрим два запуска вычислений в одном командном буфере: первый записывает данные симуляции, второй их читает. Барьер между ними позволяет второму запуску увидеть результаты завершённых записей. Для буфера хранения он упорядочивает обращения без перехода состояния текстуры:'
concepts.synchronization.barriers.details: 'Первый аргумент указывает стадии, которые произвели данные, второй — стадии, которым они понадобятся. Вместе они описывают порядок выполнения и видимость памяти, необходимые между двумя запусками.'
concepts.synchronization.barriers.guidance: 'Этот порядок используется в {link} между шагами симуляции.'
concepts.synchronization.barriers.guidance.link: симуляции FluidTank
concepts.synchronization.barriers.title: 'Барьеры конвейера'
concepts.synchronization.dependencies.description: 'Для каждого ресурса определите обращения к одним и тем же данным. Если хотя бы одно из них записывает, сохраните необходимый порядок. Два чтения не конфликтуют, хотя требования к состоянию текстуры и выводу изображения продолжают действовать. Обновление данных с CPU и освобождение ресурсов тоже должны ждать, пока GPU закончит использовать соответствующую память.'
concepts.synchronization.dependencies.details: 'Выбор механизма зависит от места выполнения операций:'
concepts.synchronization.dependencies.guidance: 'Если одна очередь записывает данные в текстуру, а другая их использует, задайте зависимость между отправками и запишите необходимый переход состояния. Ни одно из этих действий не блокирует CPU. Перед обращением CPU к данным или освобождением ресурса дождитесь завершения работы.'
concepts.synchronization.dependencies.table.cpuAccess.mechanism: Вызов {wait} для соответствующего значения завершения.
concepts.synchronization.dependencies.table.cpuAccess.situation: 'Доступ CPU или освобождение ресурса требует завершения работы GPU'
