samples.computeShader.description: "Преобразует изображение в оттенки серого с помощью вычислительного диспатча и отображает полученную текстуру. Демонстрирует дескрипторы ресурсов для сэмплируемой входной текстуры и записываемой выходной текстуры, округление количества групп потоков в большую сторону и проверку границ в шейдере. Сохраняйте включённый ресурс {assetsTexturesShokoPng}: рендерер обрабатывает его один раз и выводит результат в последующих кадрах."
samples.computeShader.details: "{computeShaderRendererCs} · {computeShaderSlang}"
samples.computeShader.title: Вычислительный шейдер
samples.cube.description: Добавляет индексную отрисовку, матрицы модели, вида и проекции в буфере констант, а также тест глубины. Текстура глубины пересоздаётся при изменении размера. Используйте этот пример при переходе от геометрии в пространстве отсечения к трансформированному объекту; рендерер использует вложение глубины и трафарета формата {d32FloatS8UInt}.
samples.cube.details: "{spinningCubeRendererCs} · {spinningCubeSlang}"
samples.cube.title: Вращающийся куб
samples.description: "Выберите пример для интересующей вас возможности. Каждый пример содержит ссылки на рендерер C# и его шейдер Slang. Если нужно пошаговое объяснение приложения с пустого проекта, начните с учебника «{link}»."
samples.description.link: Первый треугольник
samples.execution.description: "{link} содержит шесть независимых рендереров в одном настольном приложении. Используйте .NET 10 SDK и поддерживаемый бэкенд для настольных систем, как описано ниже. Соберите и запустите приложение, затем выберите пример в меню консоли:"
samples.execution.description.link: ZenithTutorials
samples.execution.details: "Хост выбирает DirectX 12 в Windows, Metal в macOS и Vulkan в Linux. Используйте устройство, драйвер и среду компиляции шейдеров, поддерживаемые выбранным бэкендом. Оконному пути Linux требуется X11 или XWayland. {link} объявляет зависимости пакетов и копирует шейдеры и текстуры, необходимые во время выполнения."
samples.execution.details.link: "Файл проекта"
samples.execution.guidance: Примеры используют общий код создания окна и вывода на экран. Вы можете изучать любой пример независимо в зависимости от интересующей вас темы.
samples.execution.title: Запуск примеров из учебника
samples.host.description: "{appCs} создаёт контекст, окно и цепочку обмена. Он получает командный буфер, вызывает выбранный рендерер, отправляет кадр и выводит его. Интерфейс {iRendererCs} определяет методы обновления, рендеринга, изменения размера и освобождения ресурсов."
samples.host.details: Вычисления и трассировка лучей создают закадровые текстуры. {texturePresenterCs} и {presentTextureSlang} отрисовывают эти текстуры в выходную текстуру текущего кадра окна. Хост сохраняет владение отправкой команд и выводом цепочки обмена.
samples.host.title: Общий хост и презентация
samples.indirectDrawing.description: "Отрисовывает несколько копий куба с помощью буфера аргументов косвенной индексной отрисовки и данных экземпляров в структурированном буфере. CPU предоставляет аргументы и обновляет преобразования. Пример помогает понять разметку косвенных аргументов и доступ шейдера к данным экземпляров перед добавлением аргументов, создаваемых GPU."
samples.indirectDrawing.details: "{indirectDrawingRendererCs} · {indirectDrawingSlang}"
samples.indirectDrawing.title: Косвенная отрисовка
samples.meshShading.description: Использует task-шейдер для отсечения экземпляров сфер и передачи их индексов в mesh-шейдер, который генерирует геометрию. Рендерер проверяет {contextCapabilitiesMeshShadingSupported} перед созданием конвейера. Используйте для изучения передачи дескрипторов ресурсов и полезной нагрузки между стадиями задач и мешей.
samples.meshShading.details: "{meshShadingRendererCs} · {meshShadingSlang}"
samples.meshShading.title: Mesh Shading
samples.rayTracing.description: Строит структуры ускорения нижнего и верхнего уровней для плоскости и процедурных сфер, а затем выполняет встроенные inline-запросы лучей в вычислительном шейдере. Рендерер проверяет {contextCapabilitiesRayTracingSupported} перед формированием рабочей нагрузки. Используйте для изучения структур ускорения и обхода лучей на стороне шейдера.
samples.rayTracing.details: "{rayTracingRendererCs} · {rayTracingSlang}"
samples.rayTracing.title: Трассировка лучей
samples.title: Примеры
samples.triangle.description: Создаёт буфер вершин и соответствующую разметку входных данных, затем отрисовывает три вершины через графический конвейер. Используйте для понимания связи между созданием ресурсов и командами прохода рендеринга.
samples.triangle.details: "{helloTriangleRendererCs} · {helloTriangleSlang} · {link}"
samples.triangle.details.link: Полный учебник
samples.triangle.title: Привет, треугольник
