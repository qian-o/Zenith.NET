concepts.resources.bufferUsages.table.transferSrc.role: 'Исходные данные буфера для копирования средствами GPU.'
concepts.resources.bufferUsages.table.vertex.role: 'Вершинные атрибуты, считываемые для рисования.'
concepts.resources.bufferUsages.title: Назначения буфера
concepts.resources.description: 'Описание ресурса задаёт допустимые способы использования его памяти. Например, текстуре, которая служит целью рендеринга, читается шейдером и копируется на CPU, нужны флаги назначения для всех трёх операций. Размещение памяти определяет доступ CPU, а синхронизация и управление временем жизни — когда можно обращаться к данным и освобождать память.'
concepts.resources.memory.context: 'Для буферов, доступных CPU, {map} возвращает адрес, по которому можно читать или записывать данные. Ни отображение памяти, ни {unmap} не ждут завершения работы GPU. Перед чтением результата приложение должно дождаться его записи на GPU, а перед изменением тех же байтов — всех ещё выполняющихся обращений GPU к ним.'
concepts.resources.memory.description: 'Поле {residency} в {bufferDesc} задаёт предполагаемый доступ CPU к памяти:'
concepts.resources.memory.details: 'Резидентность выражает требования к доступу CPU, в том числе на системах с общей физической памятью CPU и GPU. В примере треугольника {cpuWriteOnly} позволяет напрямую заполнить небольшой вершинный буфер. Для более объёмной статической геометрии может быть предпочтительнее загрузка в память, предназначенную только для GPU.'
concepts.resources.memory.guidance: 'Текстуры, создаваемые непосредственно через контекст, используют память GPU. Поэтому в {textureDesc} нет поля резидентности: приложение обменивается данными с памятью CPU через загрузку и считывание.'
concepts.resources.memory.table.cpuReadOnly.cPUAccess: 'Только чтение'
concepts.resources.memory.table.cpuReadOnly.typicalRole: 'Данные, полученные на GPU для считывания на CPU'
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: 'Только запись'
concepts.resources.memory.table.cpuWriteOnly.typicalRole: 'Данные, предоставляемые или обновляемые CPU'
concepts.resources.memory.table.gpuOnly.cPUAccess: 'Не предусмотрен'
concepts.resources.memory.table.gpuOnly.typicalRole: 'Статическая геометрия и рабочие данные GPU'
concepts.resources.memory.table.headings.cPUAccess: 'Предусмотренный доступ CPU'
concepts.resources.memory.table.headings.residency: 'Резидентность'
concepts.resources.memory.table.headings.typicalRole: Типичная роль
concepts.resources.memory.title: 'Доступ CPU и размещение памяти'
concepts.resources.textureUsages.description: 'Флаги передачи указывают, служит ли ресурс источником или приёмником при копировании средствами GPU. Прямой доступ CPU к его памяти определяется отдельно, при выборе размещения памяти.'
concepts.resources.textureUsages.details: 'Флаги назначения объявляют допустимые способы использования текстуры. Переход между ними требует соблюдения правил, описанных в разделе «{link}». Устройство также должно поддерживать выбранные операции для указанного формата текстуры.'
concepts.resources.textureUsages.details.link: 'состояния доступа и синхронизация'
concepts.resources.textureUsages.table.colorAttachment.role: 'Цветовое вложение в проходе рендеринга.'
concepts.resources.textureUsages.table.depthStencilAttachment.role: 'Вложение глубины и трафарета в проходе рендеринга.'
concepts.resources.textureUsages.table.headings.role: 'Роль'
concepts.resources.textureUsages.table.headings.usage: Назначение
concepts.resources.textureUsages.table.none.role: 'Флаги назначения текстуры не объявлены.'
concepts.resources.textureUsages.table.sampled.role: 'Данные текстуры, считываемые через привязку сэмплируемой текстуры.'
concepts.resources.textureUsages.table.storage.role: 'Данные текстуры, доступные через привязку текстуры хранения для чтения или записи шейдером.'
concepts.resources.textureUsages.table.transferDst.role: 'Память изображения, в которую GPU копирует данные.'
concepts.resources.textureUsages.table.transferSrc.role: 'Исходные данные изображения для копирования средствами GPU.'
concepts.resources.textureUsages.title: Назначения текстуры
concepts.resources.title: Управление ресурсами
concepts.resources.transfers.context: 'При считывании данные GPU сначала копируются во внутреннюю память для считывания. Затем библиотека переносит их в указанную память CPU, когда забирает завершённый командный буфер для повторного использования. Вызов {wait} для значения отправки, содержащей считывание, завершает оба шага. До возврата из этого вызова память назначения должна оставаться выделенной, а управляемая память — закреплённой.'
concepts.resources.transfers.description: 'Загрузка копирует данные CPU в ресурс GPU, а считывание — данные ресурса в память CPU. Методы буферов и текстур завершают передачу до возврата управления:'
concepts.resources.transfers.details: 'Перед вызовом этих методов устраните конфликтующие обращения из других очередей. Внутреннее ожидание метода относится только к его собственной передаче и не создаёт зависимость от другой очереди. При прямом копировании через отображённую память ожидание конфликтующих обращений GPU полностью возлагается на вызывающий код.'
concepts.resources.transfers.guidance: 'Чтобы отправить передачу данных вместе с другой работой GPU, запишите её через {commandBufferUpload} или {commandBufferDownload}. Требования ко времени жизни исходной памяти при загрузке и памяти назначения при считывании различаются:'
concepts.resources.transfers.item: 'Во время вызова загрузки библиотека копирует исходные данные во временную промежуточную память. Позже GPU читает данные именно из неё, поэтому исходный указатель приложения нужен только до возврата из вызова.'
concepts.resources.transfers.layouts: 'Записанные операции передачи текстуры не включают переходы состояния. Для загрузки требуется {copyDst}, для считывания — {copySrc}. Перед копированием запишите переход в соответствующее состояние, а после него — в состояние, необходимое для следующего использования.'
concepts.resources.transfers.notes: "При передаче текстур шаг строки — это расстояние в байтах между соседними строками данных CPU, а шаг среза — расстояние между соседними срезами по глубине. По этим значениям выполняется копирование между памятью CPU и хранилищем текстуры на GPU."
concepts.resources.transfers.table.bufferDownload.transfer: 'Для {cpuReadOnly} копирует непосредственно из отображённой памяти. В остальных случаях отправляет считывание в очередь передачи данных и дожидается его завершения.'
concepts.resources.transfers.table.bufferUpload.transfer: 'Для {cpuWriteOnly} копирует непосредственно в отображённую память. В остальных случаях отправляет загрузку в очередь передачи данных и дожидается её завершения.'
concepts.resources.transfers.table.headings.method: Метод
concepts.resources.transfers.table.headings.transfer: 'Как выполняется передача'
concepts.resources.transfers.table.textureTransfers.method: '{textureUpload} / {textureDownload}'
concepts.resources.transfers.table.textureTransfers.transfer: 'Отправляет копирование и переходы состояния текстуры в графическую очередь, затем ожидает завершения. Выбранный подресурс остаётся в запрошенном конечном состоянии.'
concepts.resources.transfers.title: 'Непосредственная передача и передача через командный буфер'
concepts.resources.usages.description: '{bufferUsages} и {textureUsages} — флаговые перечисления, объявляющие предполагаемые роли ресурса. Они задаются в полях {bufferDescUsages} и {textureDescUsages} соответственно. Если у ресурса несколько ролей, члены флагового перечисления можно объединить с помощью {value}.'
concepts.resources.usages.title: 'Назначения ресурсов'
concepts.resources.views.description: '{bufferView} описывает область буфера и интерпретацию её данных. {textureView} выбирает диапазон подресурсов, совместимые тип и формат текстуры. Оба представления ссылаются на существующую память с назначениями, объявленными при её создании. Диапазоны представлений описывают доступ, но не гарантируют единообразной проверки границ в шейдерах.'
concepts.resources.views.details: 'Собственный дескриптор ресурса предоставляет его представление по умолчанию. Для другой области или совместимого способа интерпретации создайте отдельное представление. Сохраняйте и представление, и исходный ресурс до завершения их использования на GPU: дескриптор сам по себе не удерживает ни один из объектов. При замене любого из них обновите константы, содержащие прежний {link}.'
concepts.resources.views.details.link: 'дескриптор ресурса'
concepts.resources.views.title: 'Представления и исходные ресурсы'
concepts.shaders.binding.context: 'В вычислительном примере {inputTextureSampledHandle} присваивается {input}, а {outputTextureStorageHandle} — {output}. В Slang параметр типа {descriptorHandle} определяет доступ шейдера к ресурсу:'
concepts.shaders.binding.description: '{setConstantBuffer} выбирает существующий буфер и смещение в байтах, с которого текущий конвейер читает константы. Загрузите параметры в эту память до обращения шейдера. Если ранее отправленная работа GPU ещё читает те же байты, дождитесь её завершения перед обновлением.'
concepts.shaders.binding.details: 'Подготовьте командный буфер, вычислительный конвейер, заполненный константный буфер и число групп потоков. Затем запишите запуск вычислений в следующем порядке. Сначала выберите конвейер, поскольку привязка константного буфера относится именно к нему:'
concepts.shaders.binding.guidance: 'Константному буферу нужно назначение {bufferUsagesConstant}. Если в буфере несколько записей констант, начальное смещение каждой должно соответствовать требуемому выравниванию привязки. Это условие не зависит от размещения полей внутри записи.'
concepts.shaders.binding.notes: '{resourceHandle} содержит два 32-битных поля, интерпретация которых зависит от графического API. Их значения действительны только в контексте, где создан ресурс.'
concepts.shaders.binding.reference: 'Сохраняйте ресурс и представление, из которого получен дескриптор, до завершения последнего обращения шейдера. При замене текстуры или представления обновите константы со старым дескриптором. Правила владения изложены в статье «{link}».'
concepts.shaders.binding.reference.link: Управление ресурсами
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: 'Чтение структурированных элементов шейдерного типа {t}'
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: 'Чтение и запись структурированных элементов шейдерного типа {t}'
