concepts.shaders.binding.table.headings.slangFieldType: Тип поля Slang
concepts.shaders.binding.table.samplerHandle.access: Предоставление состояния сэмплирования текстуры.
concepts.shaders.binding.table.textureSampledHandle.access: Чтение текстуры.
concepts.shaders.binding.table.textureStorageHandle.access: Чтение или запись текстуры хранения.
concepts.shaders.binding.title: Привязка буфера констант и описываемых им ресурсов
concepts.shaders.compilation.description: "{zenithCompiler} компилирует именованную точку входа Slang и возвращает {shaderDesc}. Используйте свойство контекста {graphicsApi}, чтобы результат предназначался бэкенду, создающему шейдер: DXIL для DirectX 12, библиотека Metal для Metal или SPIR-V для Vulkan."
concepts.shaders.compilation.details: "Например, при наличии {context} и скопированного рядом с исполняемым файлом шейдера треугольника:"
concepts.shaders.compilation.guidance: "Имя {vSMain} должно точно совпадать с именем точки входа в файле шейдера. Сохраняйте объекты шейдеров действительными при создании конвейера и освобождайте их после его создания, как показано в учебнике «{link}». Выполняйте эту инициализацию один раз, а не компилируйте шейдеры заново для каждого кадра."
concepts.shaders.compilation.guidance.link: Первый треугольник
concepts.shaders.compilation.title: Компиляция точки входа для выбранного контекста
concepts.shaders.description: "Шейдер принимает данные, предоставляемые приложением. Вершинные атрибуты описывают отдельные вершины; буферы хранят параметры или массивы; дескрипторы ресурсов идентифицируют другие ресурсы, к которым обращается шейдер. Объявления C# и объявления Slang должны согласовывать смысл этих значений. Простого совпадения имени поля недостаточно: разметка, доступ к ресурсам и привязка должны полностью совпадать."
concepts.shaders.dispatch.description: Метод {dispatch} принимает количество групп потоков. Точка входа {numthreads} в примере вычислений запускает 16 × 16 потоков на группу. Разделите размеры изображения на 16 с округлением вверх, чтобы получить количество групп. Например, изображению 17 × 19 требуется 2 × 2 группы. Шейдер проверяет пиксельные координаты относительно размеров изображения, поскольку последние группы могут содержать потоки за пределами изображения.
concepts.shaders.dispatch.details: Компилятор сохраняет объявленный размер группы точки входа в {shaderDescThreadGroupSize}; он не пересчитывает размеры в пикселях, переданные в {dispatch}, в количество групп. Полный пример привязки и запуска см. в {computeShaderRendererCs} и его шейдере, а перед чтением вывода в другом проходе используйте {link}.
concepts.shaders.dispatch.details.link: Синхронизация
concepts.shaders.dispatch.title: Запуск групп потоков, а не пикселей
concepts.shaders.layout.context: "В {link} смещения заданы явно. Для этого объявления в области видимости требуются {systemRuntimeInteropServices} и {zenithNET}:"
concepts.shaders.layout.context.link: "константах C# примера вычислений"
concepts.shaders.layout.description: "Для вершинного ввода структура {inputLayout} конвейера описывает форматы, смещения, шаг и семантику. Положение {float3} треугольника, за которым следует цвет {float4}, занимает 28 байт, причём цвет находится со смещения 12. Метод {inputLayoutAdd} рассчитывает эту упакованную разметку; он не анализирует структуру C#. Если поля C# содержат выравнивающие байты, предоставьте соответствующую разметку, а не предполагайте плотную упаковку полей."
concepts.shaders.layout.details: "Буферы констант содержат параметры шейдера, а структурированные буферы — массивы элементов объявленного типа. Оба читаются согласно объявлениям Slang и не используют {inputLayout}. Проверяйте смещения полей и размеры элементов для скомпилированного представления шейдера, включая заполняющие байты. Неуправляемый тип C# подходит для побайтового копирования, но сам по себе не гарантирует совпадения с типом шейдера. В частности, не переносите плотную разметку {float3} вершины на каждый буфер шейдера."
concepts.shaders.layout.guidance: Дескриптор ресурса — это небольшое значение, ссылающееся на существующий ресурс. Копирование дескриптора в буфер констант не копирует содержимое самого ресурса.
concepts.shaders.layout.notes: "Соответствующее объявление в {computeShaderSlang}:"
concepts.shaders.layout.reference: "Размеры занимают первые восемь байт, за ними следуют два восьмибайтовых дескриптора ресурсов. Пример на C# резервирует всего 256 байт. Этот размер выбран автором примера, а не является правилом, требующим, чтобы все структуры Slang или блоки констант занимали 256 байт. Дополнение общего размера также не исправляет поле, расположенное с неверным смещением."
concepts.shaders.layout.title: Различные правила разметки для вершинных входов и данных шейдеров
concepts.shaders.matrices.description: "Компилятор запрашивает хранение матриц по строкам (row-major), где элементы каждой строки хранятся последовательно. В примере {link} три значения {matrix4x4} размещаются со смещениями 0, 64 и 128. В {detail} используется {mulVectorMatrix} в порядке умножения: модель, вид, проекция."
concepts.shaders.matrices.description.detail: шейдере
concepts.shaders.matrices.description.link: рендерера вращающегося куба
concepts.shaders.matrices.details: Порядок хранения определяет расположение элементов матрицы в памяти; порядок умножения определяет преобразование. Обе стороны должны быть согласованы. Добавление транспонирования без проверки обоих аспектов может скрыть одно несоответствие, вызвав другое.
concepts.shaders.matrices.title: Согласованность хранения и умножения матриц
concepts.shaders.title: Данные шейдеров и привязка
concepts.synchronization.backends.description: DirectX 12 и Vulkan кодируют переходы текстур с информацией о layout и доступе. В реализации {transition} для Metal в Zenith.NET операций нет. Metal группирует записанную работу в энкодеры рендеринга и вычислений. Бэкенд вставляет барьеры видимости при завершении этих групп, делая предыдущие записи доступными для последующей работы. Явные вызовы {barrier} обрабатывают зависимости, такие как последовательные вычислительные диспатчи внутри одного энкодера.
concepts.synchronization.backends.details: Это различие важно при изменении рабочей нагрузки. В {link} за диспатчем следует графический проход рендеринга, который также создаёт границу энкодера в Metal. Два зависимых вычислительных диспатча не создают такую границу простым изменением объявленного layout текстуры. Сохраняйте переходы, требуемые общим API, и отдельно определяйте зависимость между фактическими командами производства и потребления данных.
concepts.synchronization.backends.details.link: примере вычислений
concepts.synchronization.backends.title: Переход не идентичен на каждом бэкенде
concepts.synchronization.barriers.context: Значение {barrierStagesAll} представляет собой более широкую область видимости, а не автоматический детектор зависимостей. Выбирайте стадии, которые фактически охватывают выполняемую работу, и используйте их только в очереди, поддерживающей эти операции.
concepts.synchronization.barriers.description: "Рассмотрите два вычислительных диспатча: первый записывает данные симуляции, а второй читает их для выполнения следующего шага. Оба используют буферы хранения, поэтому менять layout текстуры не требуется. Вставьте следующую инструкцию между диспатчами в их командном буфере:"
concepts.synchronization.barriers.details: Первый аргумент определяет стадию-производитель, а второй — стадию-потребитель. Барьер устанавливает соответствующую зависимость выполнения и памяти на GPU. Бэкенд транслирует эти стадии в свои правила выполнения и доступа к памяти. Этот барьер не меняет layout текстуры и не ожидает всю работу на устройстве.
concepts.synchronization.barriers.guidance: В примере {link} этот шаблон используется между зависимыми диспатчами. Размещайте барьер в месте возникновения зависимости. Барьер, расположенный после того, как потребитель уже записан, не может упорядочить этого потребителя относительно более раннего производителя.
concepts.synchronization.barriers.guidance.link: симуляции FluidTank
concepts.synchronization.barriers.title: Упорядочивание зависимых команд с помощью барьера
concepts.synchronization.dependencies.description: "Для каждого разделяемого ресурса определите первую и следующую операции доступа, а также выполняет ли какая-либо из них запись. Два чтения одних данных не требуют упорядочивания для защиты содержимого, хотя смена layout или презентация могут вводить другие требования. Запись с последующим чтением, чтение с последующей перезаписью или две записи могут требовать зависимости."
concepts.synchronization.dependencies.details: "Затем выберите механизм в зависимости от того, где эти операции выполняются:"
concepts.synchronization.dependencies.guidance: Эти механизмы взаимосвязаны, но не взаимозаменяемы. Отправка команд по порядку не заменяет все зависимости памяти. Ожидание очереди не объявляет новое состояние layout текстуры, а барьер команд не блокирует вызывающий поток CPU.
concepts.synchronization.dependencies.table.cpuAccess.mechanism: Вызов {wait} для соответствующего значения завершения.
concepts.synchronization.dependencies.table.cpuAccess.situation: CPU должен подождать перед доступом к данным или их освобождением
concepts.synchronization.dependencies.table.crossQueue.mechanism: Передача {timelineValue} в метод {submit} командного буфера-потребителя.
concepts.synchronization.dependencies.table.crossQueue.situation: Отправка в другой очереди создаёт данные
concepts.synchronization.dependencies.table.headings.mechanism: Механизм
concepts.synchronization.dependencies.table.headings.situation: Ситуация
concepts.synchronization.dependencies.table.layoutChange.mechanism: Вызов {commandBufferTransition} с предыдущим и следующим layout.
concepts.synchronization.dependencies.table.layoutChange.situation: Изменение способа использования подресурса текстуры
concepts.synchronization.dependencies.table.pipelineStages.mechanism: Вызов {commandBufferBarrier} с указанием стадий производителя и потребителя.
concepts.synchronization.dependencies.table.pipelineStages.situation: Зависимые стадии GPU в потоке команд
concepts.synchronization.dependencies.title: Анализ производителей и потребителей
concepts.synchronization.description: Команда, считывающая данные, записанные предыдущей командой, зависит от завершения этих записей и их видимости для неё. Записывающая сторона — это производитель (producer); считывающая — потребитель (consumer). Процессору (CPU) также требуется точка завершения перед чтением, перезаписью или освобождением разделяемых данных. Zenith.NET предоставляет барьеры, переходы текстур и временные шкалы для управления этими зависимостями.
concepts.synchronization.layouts.context: Значение {undefined} означает, что предыдущее содержимое сохранять не требуется. Оно подходит для нового изображения или вложения, которое будет полностью очищено. Это не способ избежать отслеживания layout для изображения, содержимое которого будет загружаться, сэмплироваться или накапливаться.
concepts.synchronization.layouts.description: "Флаги назначения описывают поддерживаемые роли текстуры. {textureLayout} описывает, как конкретный подресурс будет использоваться в операции. Подресурс — выбранный уровень mip и слой массива. Изменение layout подготавливает доступ, но не преобразует формат пикселей. Например, вычислительный пример записывает выходную текстуру в layout {storage}, а затем сэмплирует её в графическом проходе. Между этими операциями записывается:"
concepts.synchronization.layouts.details: Этот фрагмент предполагает, что текстура {outputTexture} была создана с назначением {sampledStorage}, а её выбранный подресурс находится в состоянии {storage}. Значение {default} выбирает уровень mip 0 и слой массива 0. Операция не переводит каждый mip или слой текстуры.
concepts.synchronization.layouts.guidance: Приложение предоставляет предыдущий layout. Метод {transition} не ведёт видимый для приложения трекер состояний и не вычисляет это значение из предыдущих команд. Отслеживайте layout везде, где ресурс передаётся между стадиями рендеринга.
concepts.synchronization.layouts.title: Отслеживание layout каждого подресурса текстуры
concepts.synchronization.readback.description: Свойство {isCompleted} лишь опрашивает, достигла ли временная шкала GPU определённого значения. Оно само по себе не возвращает командные буферы и не копирует промежуточные скачанные данные по целевому указателю приложения.
concepts.synchronization.readback.details: "{commandBufferDownload} сначала записывает копирование во внутреннее хранилище считывания. При сбросе завершённого командного буфера для повторного использования CPU копирует данные по предоставленному указателю. Сохраняйте целевую память выделенной, а управляемую память закреплённой до возврата из {wait} для этой отправки считывания. Читать данные или освобождать память можно только после этого. Ожидание более поздней отправки другой очереди само по себе не опрашивает очередь, управляющую считыванием."
concepts.synchronization.readback.guidance: "Поэтому недостаточно опрашивать {isCompleted} и сразу читать данные по адресу назначения асинхронного считывания. В разделе «{link}» рассматриваются прямое копирование и передача через промежуточное хранилище."
concepts.synchronization.readback.guidance.link: Управление ресурсами
concepts.synchronization.readback.title: Завершение работы GPU и скачанные данные CPU — это разные шаги
concepts.synchronization.reuse.description: Для простого рендерера немедленное ожидание после каждого кадра наиболее прозрачно. Для перекрытия работы выделите для незавершённых кадров раздельные изменяемые данные и сохраняйте значение завершения для последнего использования в каждом кадре. Перед обновлением буфера констант, заменой текстуры или освобождением конвейера завершите все ожидающие обращения к затронутому ресурсу.
concepts.synchronization.reuse.details: При изменении размера или выключении остановите новые операции перед ожиданием старых. Вызовы {swapChainResize}, освобождение ресурсов и освобождение контекста не служат общими операциями ожидания для задач приложения. В учебнике с треугольником размер можно безопасно менять между обратными вызовами, поскольку каждый предыдущий кадр уже завершил свою отправку.
concepts.synchronization.reuse.guidance: Текущий метод {swapChainPresent} также отправляет сигнал и ожидает завершения в графической очереди после операции вывода. Поэтому удаление явного ожидания отправки в примере с треугольником само по себе не создаёт перекрывающийся цикл вывода. Ожидание в очереди графики также ничего не говорит о независимой работе, всё ещё выполняющейся в другой очереди.
concepts.synchronization.reuse.title: Повторное использование данных только после последнего обращения
concepts.synchronization.timelines.context: "Перед тем как CPU прочитает, перезапишет или освободит эти ресурсы, дождитесь их окончательного использования:"
concepts.synchronization.timelines.description: Временная шкала отслеживает завершение операций в очереди с помощью монотонно возрастающих значений. Метод {submit} возвращает {timelineValue}, содержащий эту шкалу и значение, связанное с отправкой. Значения завершения из разных временных шкал нельзя сравнивать только по их числовому полю {value}.
concepts.synchronization.timelines.details: "Предположим, что {producer} и {consumer} — это уже записанные командные буферы из двух очередей одного контекста. Производитель записывает данные, которые использует потребитель. Отправьте их следующим образом:"
concepts.synchronization.timelines.guidance: Передача полученного значения заставляет очередь-потребитель ожидать его на GPU. Процессор в данном случае не вызывает {producedWait}. Поддерживайте разделяемые ресурсы активными до завершения {consumed} и записывайте любые изменения layout текстуры, требуемые потребителем.
concepts.synchronization.timelines.notes: Метод {wait} ожидает достижения этого значения временной шкалы, а затем проверяет завершённые отправки в ответственной очереди. Завершённые командные буферы сбрасываются для повторного использования, а их промежуточные скачанные данные копируются в предоставленные буферы CPU. Метод {queueTimelineSignal} также может поставить в очередь точку завершения после задач, уже отправленных в эту очередь. Вызов {signal} не означает, что GPU уже достиг этой точки.
concepts.synchronization.timelines.title: Использование временной шкалы для завершения и передачи между очередями
concepts.synchronization.title: Синхронизация
