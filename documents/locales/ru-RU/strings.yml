tutorial.requirements.title: Перед началом работы
tutorial.resize.context: "Снова запустите {dotnetRun}. Теперь окно должно иметь равномерный тёмный фон, который сохраняется и при изменении размеров окна. Оставьте этот обратный вызов: треугольник будет отрисован внутри его существующего прохода рендеринга."
tutorial.resize.description: "Изображения цепочки обмена должны соответствовать размерам фреймбуфера. Используйте {framebufferResize} для реагирования на изменения размера в пикселях, включая изменения из-за масштабирования экрана. После обратного вызова рендеринга, перед {windowRun}, добавьте:"
tutorial.resize.details: Silk.NET различает изменение размера окна и {link}. Нам требуется последнее, поскольку цепочка обмена хранит пиксели. У свёрнутого окна фреймбуфер может иметь нулевой размер. В этом случае оба обратных вызова пропускают работу с GPU. После изменения размера проход рендеринга будет использовать новые размеры вложения для области просмотра и отсечения.
tutorial.resize.details.link: изменение размера фреймбуфера
tutorial.resize.guidance: Мы выполняем ожидание после каждой отправки, поэтому ни один из предыдущих кадров не использует изображения в момент, когда обработчик изменения размера заменяет их. Текущая реализация {present} также ожидает завершения в очереди графики. Этот простой цикл гарантирует, что работа одного кадра завершена до начала следующего; в разделе {link} рассматривается более сложное планирование.
tutorial.resize.guidance.link: Синхронизация
tutorial.resize.title: Реакция на изменение размера
tutorial.shaders.compilation.context: Компиляция выполняется один раз во время инициализации. Свойство {appContextBaseDirectory} находит скопированный шейдер рядом с исполняемым файлом независимо от текущего рабочего каталога. Эти шейдеры используют только вершинный ввод, поэтому привязывать буферы констант, текстуры или дескрипторы ресурсов пока не требуется.
tutorial.shaders.compilation.description: В свойствах файла {triangleSlang} установите параметр {emphasis} в значение {detail}. Благодаря этому шейдер будет скопирован рядом с исполняемым файлом.
tutorial.shaders.compilation.description.detail: Копировать более позднюю версию
tutorial.shaders.compilation.description.emphasis: Копировать в выходной каталог
tutorial.shaders.compilation.details: "Вернитесь в {programCs}. После загрузки вершин добавьте эти инструкции инициализации перед обратным вызовом рендеринга:"
tutorial.shaders.compilation.guidance: "{zenithCompiler} возвращает описание шейдера с кодом для запрошенного графического API. {createShader} создаёт соответствующий объект бэкенда. Важны и графический API, и имена точек входа: используйте {contextGraphicsApi} и пишите {vSMain} и {fSMain} точно как в файле Slang."
tutorial.shaders.compilation.title: Компиляция для выбранного бэкенда
tutorial.shaders.context: Структура {fSInput} связывает выход вершинного шейдера со входом фрагментного шейдера. При записи вершинным шейдером семантика {sVPOSITION} задаёт координаты в пространстве отсечения — четыре координаты, по которым GPU определяет, что попадает в видимую область изображения. Семантика {cOLOR0} передаёт цвет для интерполяции между вершинами. Обе стадии должны согласовывать его тип и семантику.
tutorial.shaders.description: Шейдер — это программа, выполняемая на GPU. Для этой отрисовки требуются вершинный шейдер для позиционирования вершин и фрагментный шейдер для формирования цветов внутри треугольника. Мы напишем их на языке шейдеров Slang и скомпилируем две точки входа из одного файла. Точка входа — это функция, с которой начинается выполнение стадии шейдера.
tutorial.shaders.details: "Создайте файл {triangleSlang}, начав со следующих двух структур:"
tutorial.shaders.fragment.description: "Добавьте точку входа фрагментного шейдера в тот же файл:"
tutorial.shaders.fragment.details: Растеризация определяет, какие пиксели изображения покрывает треугольник. Она генерирует фрагменты — данные, обрабатываемые фрагментным шейдером, с цветами вершин, интерполированными по покрытой области. Функция {fSMain} возвращает этот интерполированный цвет через семантику {sVTARGET}, которая идентифицирует первое цветовое вложение.
tutorial.shaders.fragment.guidance: Интерполяция цвета вершин происходит отдельно от смешивания во вложении. Смешивание (blending) комбинирует вывод фрагмента с цветом, уже сохранённым во вложении. Наше непрозрачное состояние смешивания отключает эту комбинацию, поэтому интерполированный цвет заменяет фон внутри треугольника.
tutorial.shaders.fragment.title: Окрашивание фрагментов
tutorial.shaders.guidance: "Структура {vSInput} описывает, что вершинный шейдер получает из буфера вершин. Семантики {pOSITION0} и {cOLOR0} идентифицируют входные данные; одни лишь имена полей C# не задают это сопоставление."
tutorial.shaders.title: Написание двух стадий шейдера
tutorial.shaders.vertex.description: "Добавьте точку входа вершинного шейдера в {triangleSlang}:"
tutorial.shaders.vertex.details: GPU вызывает эту точку входа для каждой входной вершины. Она добавляет однородную координату {w} к положению и передаёт цвет дальше. После стадии вершин координаты делятся на w; в данном случае это деление оставляет x, y и z без изменений. Именно поэтому выбранные выше координаты можно трактовать непосредственно как нормализованные координаты устройства.
tutorial.shaders.vertex.title: Позиционирование каждой вершины
tutorial.surface.description: "Контексту также необходимо знать, куда выводить изображение. Добавьте следующий код {emphasis}:"
tutorial.surface.description.emphasis: после {windowCenter} и перед {windowRun}
tutorial.surface.details: Структура {surface} описывает нативный целевой объект презентации и его размеры в пикселях. Фреймбуфер — это пиксельное изображение, связанное с окном. Свойство {framebufferSize} задаёт его размеры в пикселях; логические размеры окна могут отличаться при включённом масштабировании экрана.
tutorial.surface.guidance: Поверхность соответствует бэкенду, выбранному ранее. Windows предоставляет дескриптор окна, Linux — дисплей и окно X11, а вспомогательный класс macOS — подключённый слой Metal. Это единственная платформа-зависимая часть подключения окна к рендерингу.
tutorial.surface.title: Описание нативной поверхности
tutorial.swapChain.context: "Цепочка обмена использует как контекст, так и нативное окно. Замените строку {windowDispose} в конце {programCs} следующим порядком освобождения ресурсов:"
tutorial.swapChain.description: "Используйте описание поверхности для создания изображений, которые будут выводиться на экран. Сразу после блока поверхности добавьте:"
tutorial.swapChain.details: Объект {swapChain} управляет изображениями, отображаемыми в окне. В каждом кадре {drawable} предоставляет текущее изображение как {texture} — тип API для данных изображений. После отрисовки метод {present} запрашивает отображение результата и переходит к следующему drawable.
tutorial.swapChain.guidance: "Формат {b8G8R8A8UNorm} хранит четыре 8-битных цветовых канала в порядке: синий, зелёный, красный и альфа. Значение {uNorm} означает, что целые числа от 0 до 255 представляют значения от 0 до 1. Шейдер по-прежнему будет возвращать логическое значение RGBA; этот формат определяет, как каналы сохраняются в изображении. Позже графический конвейер использует {swapChainDescFormat} для сопоставления с этим вложением."
tutorial.swapChain.title: Создание цепочки обмена
tutorial.title: Первый треугольник
tutorial.troubleshooting.description: "Сначала проверьте ошибки в консоли, а затем используйте контрольные точки, чтобы определить, на каком этапе произошёл сбой:"
tutorial.troubleshooting.details: Используйте {link} и {detail} для сравнения данных вершин, входной разметки и операций отрисовки. В том примере оконная система и отправка команд вынесены в общий хост, тогда как в этом учебнике логика приложения сохранена в {programCs}. Переходите к разделу {context}, чтобы изучить индексную отрисовку, трансформации и тест глубины.
tutorial.troubleshooting.details.context: Вращающийся куб
tutorial.troubleshooting.details.detail: шейдер Slang
tutorial.troubleshooting.details.link: демонстрационный рендерер
tutorial.troubleshooting.table.backend.check: Убедитесь, что выбранный бэкенд поддерживается устройством и установленным графическим драйвером.
tutorial.troubleshooting.table.backend.symptom: Сбой создания бэкенда
tutorial.troubleshooting.table.drawing.check: Проверьте размер загрузки данных, разметку входа, выбор конвейера и размещение команд отрисовки внутри прохода рендеринга.
tutorial.troubleshooting.table.drawing.symptom: Фон отображается, но треугольника нет
tutorial.troubleshooting.table.headings.check: Что проверить
tutorial.troubleshooting.table.headings.symptom: Симптом
tutorial.troubleshooting.table.input.check: "Проверьте шаг в 28 байт и смещения положения и цвета: 0 и 12."
tutorial.troubleshooting.table.input.symptom: Искажены координаты или цвета вершин
tutorial.troubleshooting.table.shaders.check: Проверьте скопированный файл {triangleSlang}, правильность написания точек входа и сообщения об ошибках от компилятора.
tutorial.troubleshooting.table.shaders.symptom: Очистка цветом работает, но загрузка шейдеров завершается ошибкой
tutorial.troubleshooting.table.window.check: Убедитесь, что проект .NET собирается и шаг с простым окном выполняется в сессии рабочего стола. В Linux проверьте доступность X11 или XWayland.
tutorial.troubleshooting.table.window.symptom: Окно не открывается
tutorial.troubleshooting.title: Поиск и устранение неполадок
tutorial.window.context: "Директива {usingZenithTutorials} импортирует пространство имён вспомогательного класса. Каждый файл C# использует свои обычные директивы using, поэтому импорт взаимодействия требуется в обоих файлах. Псевдоним {buffer} указывает на тип буфера Zenith.NET и отличает его от {systemBuffer}."
tutorial.window.description: Добавьте файл {cocoaHelperCs} в проект, сохранив его пространство имён. Добавьте директиву {interopUsing} в верхней части этого файла перед объявлением пространства имён. Вспомогательный класс подключает слой Metal к окну в macOS; ветки для других платформ его не вызывают.
tutorial.window.details: "Замените сгенерированный файл {programCs} следующим кодом. В нём используются операторы верхнего уровня, которые выполняются по порядку без явного метода {main}. В последующих разделах будет указано, куда добавлять код в этот файл:"
tutorial.window.guidance: "Значение {graphicsAPINone} указывает Silk.NET создать окно без собственного графического контекста. Мы создадим контекст через Zenith.NET. {initialize} создаёт нативное окно и делает его дескрипторы доступными. Дескриптор — идентификатор оконной системы. {center} центрирует окно, а {run} обрабатывает события до его закрытия. Затем выполнение переходит к {dispose}, освобождающему окно."
tutorial.window.notes: Запустите команду {dotnetRun}. Должно открыться пустое окно, реагирующее на перемещение, изменение размера и закрытие. Его содержимое пока не определено, поскольку мы ещё не отправляли команд рендеринга. Закройте его перед продолжением.
