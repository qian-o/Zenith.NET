concepts.platforms.integration.table.winUI.presentation: Рендерит в импортированную разделяемую текстуру Direct3D 11, затем копирует в композиционную цепочку обмена, подключённую к {swapChainPanel}. См. {zenithViewWinUICs}.
concepts.platforms.integration.table.wpf.integration: WPF
concepts.platforms.integration.table.wpf.presentation: Импортирует разделяемую текстуру Direct3D 11, затем копирует через Direct3D interop в поверхность, отображаемую {d3DImage}. См. {surfaceCs}.
concepts.platforms.integration.title: Выбор пути презентации и фреймворка
concepts.platforms.lifecycle.context: "При создании ресурсов для элемента управления UI используйте значения {descWidth}, {descHeight}, {descFormat} и {descSampleCount} выходной текстуры события. Элемент управления определяет разрешение этой текстуры; не предполагайте, что его логические размеры или масштаб экрана всегда соответствуют размерам текстуры."
concepts.platforms.lifecycle.description: Для нативной цепочки обмена передавайте размеры фреймбуфера в пикселях. Размеры окна в логических единицах могут отличаться при включённом масштабировании экрана. Пропускайте фреймбуферы нулевого размера, изменяйте размер цепочки обмена при изменении её пиксельного размера и получайте {swapChainDrawable} для каждого кадра. Выходная текстура принадлежит цепочке обмена и может меняться после вывода на экран или изменения размера.
concepts.platforms.lifecycle.details: Метод {swapChainResize} изменяет размеры существующей поверхности. Метод {swapChainRefresh} заменяет описание поверхности, включая её нативные дескрипторы. Перед любой из этих операций завершите незавершённые операции с затрагиваемыми ресурсами. Освобождайте цепочку обмена до уничтожения её нативного целевого объекта презентации.
concepts.platforms.lifecycle.guidance: Пересоздавайте принадлежащие приложению текстуры глубины или закадровые текстуры, размер которых привязан к окну, и обновляйте константы, содержащие их дескрипторы. Конвейер может продолжать использоваться после изменения размера, если форматы его вложений и число сэмплов остаются совместимыми. В примере {link} конвейер сохраняется при замене текстуры глубины.
concepts.platforms.lifecycle.guidance.link: рендерера вращающегося куба
concepts.platforms.lifecycle.title: Размеры и время жизни выходной текстуры определяются хостом
concepts.platforms.ownership.description: Приложение владеет назначенным им контекстом и ресурсами, созданными для рендеринга. Элемент управления владеет собственными ресурсами презентации. Изменение свойства {graphicsContext} элемента управления заставляет планировщик пересоздать ресурсы элемента управления; это не пересоздаёт конвейеры, буферы или текстуры приложения для нового контекста.
concepts.platforms.ownership.details: Координируйте замену ресурсов с жизненным циклом кадров элемента управления. Остановите формирование кадров в элементе управления и завершите активные операции на GPU перед освобождением ресурсов приложения или назначенного контекста. Удаление элемента управления не передаёт владение контекстом элементу управления.
concepts.platforms.ownership.guidance: Общий планировщик {frameSchedulerCs} отправляет задачи кадра через UI-диспетчер элемента управления. Обработчики кадров должны быть сфокусированы на обновлении и записи кадра; длительная работа CPU в них также задерживает интерфейс пользователя.
concepts.platforms.ownership.title: Ресурсы приложения не принадлежат элементу управления
concepts.platforms.surface.context: Поддержка операционной системы оконной библиотекой или UI-фреймворком не гарантирует, что выбранный бэкенд GPU доступен на ней. Возможности устройства, драйверы и поддержка нативной поверхности должны совпадать. Проверяйте поддержку трассировки лучей и mesh shading через {contextCapabilities} перед созданием соответствующих нагрузок.
concepts.platforms.surface.description: В примере {link} библиотека Silk.NET используется для создания окна и обработки событий. Zenith.NET подключается к этому окну через описание {surface} и цепочку обмена {swapChain}. Поверхность содержит нативные дескрипторы и размеры; создание этого описания не создаёт и не захватывает во владение окно операционной системы.
concepts.platforms.surface.description.link: треугольника
concepts.platforms.surface.details: "Дескриптор должен соответствовать выбранному бэкенду:"
concepts.platforms.surface.guidance: Файл {appCs} из учебника демонстрирует варианты для Windows, macOS и X11. Его хост для Linux предоставляет дескрипторы Xlib; для работы в сессии Wayland требуется XWayland. Нативное приложение Wayland предоставляло бы другие дескрипторы через {surfaceWayland}.
