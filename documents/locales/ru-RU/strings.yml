samples.workloads.table.platformDetection.whatItDemonstratesAndRequires: "Пытается создать контекст для каждого бэкенда и сообщает о возможностях устройства. Ошибка создания контекста отображается как отсутствие поддержки; такой результат может также указывать на отсутствующий драйвер или зависимость среды выполнения."
samples.workloads.title: Изучение более сложных нагрузок
tutorial.context.description: Теперь окно открывается, но мы ещё не создали объекты GPU, которые будут выполнять в него рендеринг. {graphicsContext} обеспечивает доступ к выбранному графическому бэкенду и его очередям команд.
tutorial.context.details: "Вставьте этот блок {emphasis}:"
tutorial.context.details.emphasis: после директив using, перед {iWindowWindow}
tutorial.context.guidance: Ветвления выбирают DirectX 12 в Windows, Metal в macOS и Vulkan в Linux. Последующий код рендеринга использует общий API Zenith.NET. Во время разработки мы запрашиваем валидацию и выводим сообщения, передаваемые через {validationMessage}. Диагностика зависит от бэкенда и компонентов валидации, доступных в системе.
tutorial.context.title: Создание графического контекста
tutorial.description: Создайте консольное приложение .NET, которое открывает окно и отрисовывает треугольник с плавным градиентным переходом цветов. Вы узнаете, как взаимодействуют данные вершин, шейдеры и состояние конвейера, а затем запишете и отправите команды, формирующие изображение.
tutorial.details: Выполняйте разделы по порядку. Сначала вы откроете пустое окно, затем отобразите цвет фона и, наконец, нарисуете треугольник. Каждый контрольный этап подтверждает правильность работы одной части приложения перед добавлением следующей. Инициализация выполняется один раз, а обратный вызов рендеринга записывает новый кадр при каждом вызове.
tutorial.draw.context: "Аргументы метода {draw}:"
tutorial.draw.description: "В обратном вызове {windowRender} замените комментарий {addTheTriangleDrawCommandsHereLater} следующими тремя командами между {beginRenderPass} и {endRenderPass}:"
tutorial.draw.details: "Команда {setPipeline} выбирает созданные шейдеры и состояние конвейера. Установите её перед привязкой данных вершин: бэкенд использует разметку входных данных конвейера для интерпретации привязки."
tutorial.draw.guidance: Команда {setVertexBufferVertexBuffer} привязывает буфер, начиная с байтового смещения 0, к входному слоту 0. Этот слот соответствует единственной записи в {inputLayouts}. Она не копирует и не загружает данные повторно.
tutorial.draw.notes: На этом этапе команды всё ещё только записаны. Вызовы {submitWait} и {present}, уже находящиеся в конце обратного вызова рендеринга, выполняют работу и выводят результат. Очистка остаётся необходимой, так как треугольник покрывает лишь часть изображения; фон также должен получать определённый цвет в каждом кадре.
tutorial.draw.table.firstInstance.meaning: Начать нумерацию экземпляров с нуля.
tutorial.draw.table.firstVertex.meaning: Начать с первой вершины в буфере.
tutorial.draw.table.headings.argument: Аргумент
tutorial.draw.table.headings.description: Значение
tutorial.draw.table.headings.meaning: Назначение
tutorial.draw.table.instanceCount.meaning: Нарисовать одну копию треугольника.
tutorial.draw.table.vertexCount.meaning: Считать три вершины.
tutorial.draw.title: Отрисовка треугольника внутри прохода
tutorial.execution.description: "Соберите и запустите приложение из каталога {firstTriangle}:"
tutorial.execution.details: В окне должен появиться треугольник с красным верхним углом, зелёным правым нижним углом и синим левым нижним углом на тёмном фоне. Внутри треугольника должен быть плавный градиент между этими цветами.
tutorial.execution.guidance: "Измените размер окна. Обратный вызов изменения размера обновляет размеры фреймбуфера и изменяет размер цепочки обмена. Проход рендеринга задаёт область просмотра для этого изображения. Позиции вершин остаются нормализованными, поэтому треугольник занимает ту же долю ширины и высоты окна; смена соотношения сторон может растянуть его форму. Для сохранения пропорций объекта нужна стратегия проекции или области просмотра, что выходит за рамки первой отрисовки."
tutorial.execution.title: Запуск, изменение размера и закрытие
tutorial.frame.commands.context: После {endRenderPass} второй переход подготавливает изображение к презентации. Метод {submit} завершает запись и отправляет командный буфер; {wait} ожидает завершения этой отправки на GPU. Затем {present} запрашивает отображение отрисованного изображения.
tutorial.frame.commands.description: Проход рендеринга группирует операции отрисовки, использующие одни и те же вложения. Здесь цветовым вложением выступает выходная текстура цепочки обмена — изображение, принимающее нашу отрисовку. Метод {colorAttachmentClear} создаёт описание, предписывающее проходу выполнить очистку заданным цветом RGBA и сохранить результат по завершении прохода. Метод {beginRenderPass} записывает эти инструкции; GPU выполняет очистку после отправки команд.
tutorial.frame.commands.details: В квадратных скобках указано наше единственное цветовое вложение. Аргумент {null} означает отсутствие вложения глубины/трафарета, которое хранило бы значения глубины и маски трафарета для соответствующих тестов.
tutorial.frame.commands.guidance: Метод {beginRenderPass} задаёт область просмотра (viewport) и область отсечения (scissor), покрывающие вложение. Область просмотра преобразует координаты рендеринга в пиксели, а область отсечения ограничивает пиксели, доступные для записи. Эти значения по умолчанию покрывают всю выходную текстуру, что и требуется для нашего треугольника.
tutorial.frame.commands.title: Очистка, отправка и презентация
tutorial.frame.description: Сначала заполните изображение одним цветом фона. Эта операция называется очисткой (clear). Если этот цвет появится в окне, значит поверхность, отправка команд и путь вывода работают корректно. Этот контрольный этап позволяет проверить цикл кадров перед добавлением геометрии и шейдеров.
tutorial.frame.details: "Обратный вызов рендеринга — это код, который Silk.NET вызывает, когда наступает время отрисовки кадра. Этому вызову не требуется аргумент прошедшего времени события, поэтому он обозначен как {value}. Зарегистрируйте его {emphasis}:"
tutorial.frame.details.emphasis: перед {windowRun}
tutorial.frame.target.description: Метод {graphicsQueueCommandBuffer} возвращает командный буфер с уже начатой записью. Запись описывает работу для GPU, но не выполняет её немедленно.
tutorial.frame.target.details: Первый переход {transition} подготавливает выходную текстуру для доступа в качестве цветового вложения. Значение {default} выбирает уровень mip 0 и слой массива 0. Мы используем {undefined} в качестве предыдущего layout, поскольку мы очистим всё изображение и отбросим его прежнее содержимое. Проход, которому необходимо сохранить существующее содержимое, должен использовать своё реальное предыдущее состояние layout.
tutorial.frame.target.guidance: В каждом кадре используйте актуальную выходную текстуру цепочки обмена. Презентация может изменить доступное изображение, поэтому текстура, сохранённая из предыдущего кадра, не является постоянной целью рендеринга окна.
tutorial.frame.target.title: Подготовка выходной текстуры
tutorial.frame.title: Отображение цвета фона
tutorial.geometry.data.description: Добавьте этот массив {emphasis}. Последующие шаги создания ресурсов также размещаются перед этим обратным вызовом в указанном порядке.
tutorial.geometry.data.description.emphasis: перед {windowRender}
tutorial.geometry.data.details: "Каждый элемент массива создаёт структуру {vertex}. Два внутренних выражения {new} задают координаты {vector3} и цвет {vector4}. Вершины описывают верхний, правый нижний и левый нижний углы. Вершинный шейдер предоставит четвёртую координату положения, {w}. При w = 1 координаты x и y напрямую соответствуют нормализованным координатам устройства: -1 и +1 соответствуют краям изображения, а 0 — центру. Эти координаты не зависят от размеров окна в пикселях."
tutorial.geometry.data.guidance: "Каждый цвет содержит компоненты: красный, зелёный, синий и альфа. Альфа-канал равен 1 во всех трёх вершинах. Все три положения имеют z = 0, располагаясь в одной плоскости. Для этих координат не требуются камера или матрица преобразования, поскольку они уже заданы в системе координат вывода. Для этого плоского треугольника мы также отключим смешивание цветов и тест глубины, отказавшись от буфера глубины."
tutorial.geometry.data.title: Выбор координат углов
tutorial.geometry.description: Вершина — это точка вместе с данными, необходимыми для её отрисовки. У нашего треугольника три вершины, по одной на каждый угол. Каждая содержит положение и цвет. GPU интерполирует цвета, вычисляя промежуточные значения по всей площади треугольника.
tutorial.geometry.format.description: "Добавьте это объявление {emphasis}:"
tutorial.geometry.format.description.emphasis: в конце {programCs}, после инструкций очистки
tutorial.geometry.format.details: "Модификатор {file} ограничивает тип файлом {programCs}, а конструктор инициализирует поля положения и цвета. {layoutKindSequential} сохраняет порядок объявления полей. {position} содержит три 32-битных числа с плавающей запятой, а {color} — четыре. Положение начинается с байта 0, цвет — с байта 12, и вся вершина занимает 28 байт. Эту же разметку мы зададим графическому конвейеру."
tutorial.geometry.format.title: Определение вершины
tutorial.geometry.title: Передача трёх вершин в GPU
tutorial.geometry.upload.context: Ключевое слово {fixed} предотвращает перемещение массива сборщиком мусора во время использования его адреса. Для этого буфера с возможностью записи CPU метод {upload} отображает, копирует и отменяет отображение памяти до возврата управления, поэтому массив не нужно удерживать закреплённым в дальнейшем. Буфер должен оставаться активным на протяжении всего рендеринга, а загрузку достаточно выполнить один раз, поскольку вершины не меняются.
tutorial.geometry.upload.description: "Управляемый массив — это данные в памяти CPU. Объект {buffer} предоставляет GPU память, из которой можно читать вершины. После массива добавьте:"
tutorial.geometry.upload.details: "Общий размер — {sizeofVertexVerticesLength}: 28 байт на вершину, три вершины, всего 84 байта. {bufferUsagesVertex} разрешает доступ для вершинного ввода. Режим {cpuWriteOnly} позволяет CPU напрямую инициализировать этот небольшой буфер. Шаг в описании буфера задаёт размер элемента; разметка входных данных ниже объяснит механизму выборки вершин, как читать отдельные атрибуты."
tutorial.geometry.upload.guidance: Создание буфера не заполняет его данными. Метод {upload} копирует массив в выделенную память, начиная с байтового смещения 0 в целевом буфере. Его описание источника предоставляет указатель и количество копируемых байт.
tutorial.geometry.upload.notes: Добавьте вызов {vertexBufferDispose} непосредственно перед {swapChainDispose} в блоке очистки в конце {programCs}. Для больших объёмов статической геометрии в руководстве {link} объясняется, когда следует выбирать память только для GPU и передачу данных через промежуточные буферы.
tutorial.geometry.upload.notes.link: Управление ресурсами
tutorial.geometry.upload.title: Выделение буфера и загрузка массива
tutorial.input.description: "Байты вершин и шейдеры готовы. Теперь опишите, как GPU должен считывать каждую вершину. Атрибут — это отдельное значение, например положение или цвет. Разметка входных данных задаёт формат и байтовое смещение каждого атрибута; шаг (stride) задаёт расстояние в байтах от одной вершины до следующей. Добавьте этот блок инициализации после создания шейдеров:"
tutorial.input.details: "Метод {inputLayoutAdd} добавляет элемент с текущим смещением шага и увеличивает шаг на размер этого элемента. Он не анализирует структуру C#. В данном случае формируется следующее соответствие между памятью CPU и входами шейдера:"
tutorial.input.guidance: "Изменение порядка полей C# или выравнивания без обновления этого описания приведёт к тому, что GPU прочитает неверные байты. Значение {semanticIndex} по умолчанию равно нулю, что соответствует {pOSITION0} и {cOLOR0}. Оба элемента принадлежат одному буферу, поэтому конвейер будет содержать одну входную разметку, и мы привяжем этот буфер к слоту 0."
