concepts.resources.bufferUsages.table.storageReadOnly.role: "Данные буфера, доступные через привязку шейдера только для чтения."
concepts.resources.bufferUsages.table.storageReadWrite.role: "Данные буфера, доступные через привязку шейдера для чтения и записи."
concepts.resources.bufferUsages.table.transferDst.role: "Память назначения для копирования на GPU."
concepts.resources.bufferUsages.table.transferSrc.role: "Исходные данные для копирования на GPU."
concepts.resources.bufferUsages.table.vertex.role: Вершинные атрибуты, считываемые для отрисовки.
concepts.resources.bufferUsages.title: Назначения буфера
concepts.resources.description: "Выбирайте описание ресурса исходя из операций, которые будут его использовать. Для текстуры, в которую выполняется рендеринг, из которой делает выборки шейдер и данные которой считываются на CPU, нужно объявить все три назначения и обеспечить синхронизацию между ними. Размещение памяти и время жизни ресурса требуют отдельных решений."
concepts.resources.memory.context: Для буфера, доступного CPU, метод {map} возвращает адрес CPU. Он не ожидает, пока GPU прекратит доступ к тем же байтам. Метод {unmap} аналогично не отправляет задачи и не ожидает завершения. Перед перезаписью данных, доступных для записи CPU, завершите операции чтения GPU, которым всё ещё требуется старое содержимое.
concepts.resources.memory.description: "Структура {bufferDesc} содержит поле {residency}. Выбирайте его в соответствии с тем, как CPU и GPU будут обращаться к данным:"
concepts.resources.memory.details: Резидентность описывает предполагаемый доступ CPU к выделенной памяти. Она не означает, что каждое устройство имеет физически раздельные области памяти CPU и GPU. В треугольнике используется {cpuWriteOnly} для прямой инициализации небольшого буфера вершин. Большой статический меш может получить больше преимуществ от памяти только для GPU с однократной загрузкой.
concepts.resources.memory.guidance: В {textureDesc} нет поля резидентности. Обычные текстуры, создаваемые контекстом, используют память GPU. Их публичный API предоставляет операции загрузки и скачивания для передачи данных CPU без прямого метода отображения. Явные кучи обеспечивают контроль размещения, описанный ниже.
concepts.resources.memory.table.cpuReadOnly.cPUAccess: "Читать отображённую память после завершения копирования на GPU."
concepts.resources.memory.table.cpuReadOnly.typicalRole: "Данные, полученные на GPU для считывания на CPU"
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: "Записывать в отображённую память после завершения предыдущих чтений GPU."
concepts.resources.memory.table.cpuWriteOnly.typicalRole: "Данные, предоставляемые или обновляемые CPU"
concepts.resources.memory.table.gpuOnly.cPUAccess: "Передавать байты через буфер загрузки или считывания."
concepts.resources.memory.table.gpuOnly.typicalRole: "Статическая геометрия и рабочие данные GPU"
concepts.resources.memory.table.headings.cPUAccess: Доступ CPU
concepts.resources.memory.table.headings.residency: Резидентность
concepts.resources.memory.table.headings.typicalRole: Типичная роль
concepts.resources.memory.title: "Выбор памяти с учётом необходимого доступа CPU"
concepts.resources.textureUsages.description: "Флаги назначения для передачи описывают направление копирования на GPU. Доступ CPU — отдельное решение о размещении памяти, рассмотренное ниже."
concepts.resources.textureUsages.details: "Объединение флагов объявляет несколько ролей, но не выполняет операции и не упорядочивает доступ. Для текстур по-прежнему необходимо правильно выбирать {link}, а их форматы должны поддерживать запрошенные назначения на выбранном устройстве."
concepts.resources.textureUsages.details.link: "состояние доступа и синхронизацию"
concepts.resources.textureUsages.table.colorAttachment.role: "Цветовое вложение в проходе рендеринга."
concepts.resources.textureUsages.table.depthStencilAttachment.role: "Вложение глубины и трафарета в проходе рендеринга."
concepts.resources.textureUsages.table.headings.role: "Роль"
concepts.resources.textureUsages.table.headings.usage: Назначение
concepts.resources.textureUsages.table.none.role: "Флаги назначения текстуры не объявлены."
concepts.resources.textureUsages.table.sampled.role: "Данные текстуры, считываемые через привязку сэмплируемой текстуры."
concepts.resources.textureUsages.table.storage.role: "Данные текстуры, доступные через привязку текстуры хранения для чтения или записи шейдером."
concepts.resources.textureUsages.table.transferDst.role: "Память изображения назначения для копирования на GPU."
concepts.resources.textureUsages.table.transferSrc.role: "Данные исходного изображения для копирования на GPU."
concepts.resources.textureUsages.title: Назначения текстуры
concepts.resources.title: Управление ресурсами
concepts.resources.transfers.context: Скачивание данных записывает команду копирования GPU во внутреннее хранилище считывания. Библиотека копирует эти байты в предоставленный буфер CPU при сбросе завершённого командного буфера для повторного использования. Сохраняйте память назначения выделенной, а управляемую память — закреплённой, пока не завершится вызов {wait} для значения отправки.
concepts.resources.transfers.description: "Загрузка копирует данные CPU в ресурс GPU, а считывание возвращает данные ресурса в память CPU. Методы самого ресурса завершают эту передачу до возврата из вызова:"
concepts.resources.transfers.details: "Эти ожидания относятся только к передаче, отправленной данными методами. Они не обнаруживают зависимости от другой очереди, которая уже читала или записывала ресурс. Установите такие зависимости до вызова метода ресурса. При прямом копировании через отображённую память вызывающий код также обязан обеспечить завершение соответствующей работы GPU."
concepts.resources.transfers.guidance: "Используйте {commandBufferUpload} или {commandBufferDownload}, если копирование должно быть записано вместе с другими операциями. Время жизни их указателей различается:"
concepts.resources.transfers.item: "Загрузка во время вызова копирует исходные данные CPU во внутренний буфер загрузки, также называемый промежуточной памятью staging. Исходный указатель должен оставаться действительным только на время этого вызова."
concepts.resources.transfers.notes: "Для текстуры шаг строки — расстояние в байтах между соседними строками данных CPU, а шаг среза — расстояние в байтах между соседними срезами по глубине. Эти значения не описывают внутреннее размещение текстуры в памяти GPU. Различие между завершением GPU и считыванием данных описано в разделе {link}."
concepts.resources.transfers.notes.link: Синхронизация
concepts.resources.transfers.table.bufferDownload.transfer: Прямое копирование CPU для {cpuReadOnly}; иначе отправляет скачивание в очередь передачи и ожидает.
concepts.resources.transfers.table.bufferUpload.transfer: Прямое копирование CPU для {cpuWriteOnly}; иначе отправляет загрузку в очередь передачи и ожидает.
concepts.resources.transfers.table.headings.method: Метод
concepts.resources.transfers.table.headings.transfer: "Способ передачи данных"
concepts.resources.transfers.table.textureTransfers.method: "{textureUpload} / {textureDownload}"
concepts.resources.transfers.table.textureTransfers.transfer: "Использует графическую очередь, переводит выбранный подресурс в состояние для копирования, затем в запрошенное конечное состояние и ожидает завершения передачи."
concepts.resources.transfers.title: "Выбор между немедленной передачей и записью передачи в командный буфер"
concepts.resources.usages.description: "{bufferUsages} и {textureUsages} — флаговые перечисления, объявляющие предполагаемые роли ресурса. Они задаются в полях {bufferDescUsages} и {textureDescUsages} соответственно. Если у ресурса несколько ролей, члены флагового перечисления можно объединить с помощью {value}."
concepts.resources.usages.title: Объявление необходимых назначений перед созданием ресурса
concepts.resources.views.description: Объект {bufferView} описывает область буфера и её интерпретацию. Объект {textureView} выбирает совместимый тип текстуры, формат и диапазон подресурсов. Представление разделяет базовое хранилище; оно не копирует данные и не добавляет назначения, отсутствовавшие при создании ресурса. Его диапазон также не гарантирует переносимую проверку границ в шейдере.
concepts.resources.views.details: "Для представления по умолчанию используйте дескриптор самого ресурса. Если нужна другая область или иная совместимая интерпретация, создайте представление. Сохраняйте ссылки C# на представление и базовый ресурс, пока задачи GPU могут их использовать: один лишь дескриптор ресурса не поддерживает время жизни ни одного из объектов. Освобождайте их только после последнего использования GPU. Заменив любой из объектов, обновите константы, содержащие его прежний {link}."
concepts.resources.views.details.link: "дескриптор ресурса"
concepts.resources.views.guidance: "В {link} показана замена текстуры глубины при изменении размера. В {detail} входная текстура хранится отдельно от доступной для записи выходной. В обоих случаях время жизни ресурса соответствует работе, которая его фактически использует."
concepts.resources.views.guidance.detail: примере вычислений
concepts.resources.views.guidance.link: "примере вращающегося куба"
concepts.resources.views.title: "Сохранение доступности представлений и их базовых ресурсов"
concepts.shaders.binding.context: "В примере вычислений поле {input} заполняется значением {inputTextureSampledHandle}, а {output} — {outputTextureStorageHandle}. Типизированный {descriptorHandle} в Slang указывает шейдеру способ доступа к каждому ресурсу:"
concepts.shaders.binding.description: "Метод {setConstantBuffer} привязывает буфер и байтовое смещение для констант текущего конвейера. Он привязывает существующую видимую для GPU память; он не загружает значение C#. Сначала заполните буфер и убедитесь, что предыдущие читатели GPU завершили работу, прежде чем перезаписывать его байты."
concepts.shaders.binding.details: "Установите конвейер перед его буфером констант. Для вычислительной нагрузки с уже созданными и загруженными ресурсами запись выполняется в следующем порядке:"
concepts.shaders.binding.guidance: Этот фрагмент предполагает записываемый {commandBuffer}, конвейер {computePipeline}, загруженный буфер {constantBuffer} с назначением {bufferUsagesConstant} и количество групп потоков для данной задачи. Смещение 0 привязывает начало буфера. Если несколько записей данных констант делят один буфер, начальное смещение каждой записи должно соответствовать выравниванию привязки бэкенда. Это требование не зависит от разметки полей внутри самой записи.
concepts.shaders.binding.notes: Структура {resourceHandle} хранит два 32-битных поля, но их интерпретация определяется бэкендом. Не рассматривайте её как универсальный индекс дескриптора, адрес или значение, переносимое между контекстами. Дескриптор не создаёт ресурс, не добавляет отсутствующее назначение и не выполняет синхронизацию.
concepts.shaders.binding.reference: "Сохраняйте ссылки на ресурс и любое представление, использованное для получения его дескриптора. Освобождайте их только после завершения последнего использования шейдером. При замене текстуры или представления обновите константы со старым дескриптором. Эта связь времени жизни описана в разделе «{link}»."
concepts.shaders.binding.reference.link: Управление ресурсами
