tutorial.context.description: '{graphicsContext} связывает приложение с GPU через выбранный графический API и предоставляет методы создания ресурсов для рендеринга.'
tutorial.context.details: 'Вставьте инициализацию контекста {emphasis}:'
tutorial.context.details.emphasis: после директив using, перед {iWindowWindow}
tutorial.context.guidance: 'Каждая ветвь запрашивает проверку для выбранного графического API. Если реализация выдаёт диагностические сообщения {validationMessage}, обработчик выводит их в консоль.'
tutorial.context.imports: 'Добавьте следующие директивы using в начало {programCs}:'
tutorial.context.title: 'Графический контекст'
tutorial.description: 'В этом уроке из пустого консольного проекта .NET получится приложение, которое открывает окно и рисует цветной треугольник.'
tutorial.details: 'В уроке три проверочных этапа: пустое окно, однотонный фон и цветной треугольник. Запускайте приложение после каждого этапа, прежде чем добавлять следующую часть.'
tutorial.draw.context: 'Аргументы метода {draw}:'
tutorial.draw.description: 'В обработчике {windowRender} замените {addTheTriangleDrawCommandsHereLater} следующими командами между {beginRenderPass} и {endRenderPass}:'
tutorial.draw.details: '{setPipeline} выбирает шейдеры и состояние рендеринга. Сначала выберите конвейер: его описание вершинного ввода определяет, как читать данные из вершинного буфера.'
tutorial.draw.guidance: '{setVertexBufferVertexBuffer} привязывает загруженные вершинные данные со смещения 0 байт к входному слоту 0, соответствующему единственной записи {inputLayouts}.'
tutorial.draw.notes: 'Сохраните очистку в начале прохода, чтобы область за пределами треугольника имела определённый цвет фона.'
tutorial.draw.table.firstInstance.meaning: Начать нумерацию экземпляров с нуля.
tutorial.draw.table.firstVertex.meaning: Начать с первой вершины в буфере.
tutorial.draw.table.headings.argument: Аргумент
tutorial.draw.table.headings.description: Значение
tutorial.draw.table.headings.meaning: Назначение
tutorial.draw.table.instanceCount.meaning: Нарисовать одну копию треугольника.
tutorial.draw.table.vertexCount.meaning: Считать три вершины.
tutorial.draw.title: 'Команды рисования'
tutorial.execution.description: 'Соберите и запустите проект {firstTriangle}.'
tutorial.execution.details: 'На тёмном фоне должен появиться треугольник: красный сверху, зелёный справа внизу и синий слева внизу. Интерполяция цветов вершин создаёт плавные переходы внутри треугольника.'
tutorial.execution.guidance: 'При изменении размера окна меняются размеры изображения в пикселях, но координаты вершин остаются прежними. Область вывода преобразует эти координаты с учётом новой ширины и высоты. Поэтому изменение соотношения сторон окна растягивает треугольник.'
tutorial.execution.title: 'Запуск приложения'
tutorial.frame.commands.context: 'После {endRenderPass} второй переход подготавливает выходную текстуру к выводу. {submit} завершает запись и отправляет командный буфер; {wait} блокирует поток до завершения этой работы. Затем {present} запрашивает отображение готового изображения.'
tutorial.frame.commands.description: 'Проход рендеринга объединяет команды рисования, которые записывают результаты в одни и те же вложения. В этом проходе цвет записывается в выходную текстуру цепочки обмена. {colorAttachmentClear} задаёт её начальное заполнение цветом RGBA и сохранение содержимого после прохода. {beginRenderPass} записывает начало прохода с этими настройками.'
tutorial.frame.commands.details: 'Коллекция содержит одно цветовое вложение. {null} означает, что у прохода нет вложения глубины и трафарета.'
tutorial.frame.commands.guidance: '{beginRenderPass} задаёт область вывода и прямоугольник отсечения по размеру всего вложения. Область вывода преобразует координаты рендеринга в позиции пикселей, а прямоугольник отсечения ограничивает область, в которой команды рисования могут изменять пиксели.'
tutorial.frame.commands.title: 'Очистка, отправка и вывод'
tutorial.frame.description: 'Сначала заполните окно одним цветом — это очистка. Если цвет появился, отправка команд и вывод работают. Затем добавьте вершины и шейдеры треугольника.'
tutorial.frame.details: 'Silk.NET вызывает обработчик рендеринга, когда нужно отрисовать кадр. Зарегистрируйте обработчик {emphasis}:'
tutorial.frame.details.emphasis: перед {windowRun}
tutorial.frame.target.description: 'Очередь команд принимает записанную работу для выполнения на GPU. {graphicsQueueCommandBuffer} возвращает командный буфер графической очереди, в котором уже начата запись. Записанные команды определяют работу GPU; выполнение начинается только после отправки.'
tutorial.frame.target.details: 'Состояние доступа к текстуре определяет, как операция будет её использовать. Первый вызов {transition} подготавливает выходную текстуру к записи цвета. Значение {default} выбирает mip-уровень 0 и слой массива 0 — базовое изображение этой текстуры. Поскольку проход заполняет всё изображение цветом фона, {undefined} разрешает отбросить прежнее содержимое.'
tutorial.frame.target.guidance: 'Для каждого кадра используйте текущую выходную текстуру: при выводе изображения цепочка обмена может перейти к следующей.'
tutorial.frame.target.title: 'Подготовка выходной текстуры'
tutorial.frame.title: 'Первый кадр'
tutorial.geometry.data.description: 'Добавьте массив вершин {emphasis}. Последующую инициализацию ресурсов также размещайте перед этим обработчиком в указанном порядке.'
tutorial.geometry.data.description.emphasis: перед {windowRender}
tutorial.geometry.data.details: 'Три позиции задают верхнюю, нижнюю правую и нижнюю левую вершины. В этом примере x и y охватывают изображение в диапазоне от -1 до +1: 0 соответствует центру, положительные значения x направлены вправо, а положительные значения y — вверх.'
tutorial.geometry.data.guidance: 'Цвет задаётся красной, зелёной, синей и альфа-компонентами; альфа равна 1. Все три вершины находятся в одной плоскости при z = 0.'
tutorial.geometry.data.title: 'Позиции и цвета вершин'
tutorial.geometry.description: 'У каждой из трёх вершин есть позиция и цвет. По позициям GPU определяет форму треугольника, а его внутренние цвета получает интерполяцией цветов вершин.'
tutorial.geometry.format.description: 'Добавьте объявление вершины {emphasis}:'
tutorial.geometry.format.description.emphasis: 'в конце {programCs}, после кода освобождения ресурсов'
tutorial.geometry.format.details: '{layoutKindSequential} сохраняет порядок объявления полей. Поле {position} содержит три 32-битных числа с плавающей точкой и начинается со смещения 0 байт; поле {color} содержит четыре таких числа и начинается со смещения 12 байт. Одна вершина занимает 28 байт. Описание входных данных укажет GPU, как читать эти поля.'
tutorial.geometry.format.imports: 'Добавьте в начало {programCs} следующие директивы using для векторных типов и атрибута размещения полей структуры:'
tutorial.geometry.format.title: 'Представление вершины'
tutorial.geometry.title: 'Вершинные данные'
tutorial.geometry.upload.context: '{fixed} не позволяет сборщику мусора перемещать массив, пока используется его адрес. Для этого буфера с доступом CPU на запись метод {upload} отображает память, копирует данные и отменяет отображение до возврата. Поэтому массив достаточно закрепить на время вызова. Загрузите вершины один раз при инициализации и сохраняйте буфер до завершения рендеринга.'
tutorial.geometry.upload.description: 'Поместите вершины в {buffer}, чтобы GPU мог читать их при рисовании. Добавьте выделение памяти и загрузку данных сразу после массива:'
tutorial.geometry.upload.details: 'Размер выделения — {sizeofVertexVerticesLength}: три вершины по 28 байт, всего 84 байта. {bufferUsagesVertex} объявляет вершинный ввод, {cpuWriteOnly} разрешает начальное заполнение с CPU. Шаг в описании буфера фиксирует размер элемента. Описание входа ниже определит интерпретацию каждого атрибута.'
tutorial.geometry.upload.guidance: 'Выделение памяти не заполняет буфер. {upload} копирует массив в начало буфера, используя исходный указатель и число байтов из описания данных.'
tutorial.geometry.upload.imports: 'В {programCs} добавьте {bufferAlias} к директивам using, чтобы отличить тип буфера Zenith.NET от {systemBuffer}.'
tutorial.geometry.upload.notes: "В коде освобождения в конце {programCs} вставьте {vertexBufferDispose} непосредственно перед {swapChainDispose}."
tutorial.geometry.upload.title: 'Выделение буфера и загрузка данных'
tutorial.input.description: 'GPU нужно знать, где хранятся атрибуты вершины, например позиция и цвет. Описание входа задаёт их формат и смещение, а также шаг — расстояние в байтах до следующей вершины. Добавьте этот код после создания шейдеров:'
tutorial.input.details: '{inputLayoutAdd} размещает каждый атрибут сразу после предыдущего и увеличивает шаг между вершинами на размер добавленного атрибута. Смещения рассчитываются по указанным форматам, без анализа структуры C#. Для этих двух полей получается следующая раскладка:'
tutorial.input.guidance: 'Значение {semanticIndex} по умолчанию равно нулю и соответствует {pOSITION0} и {cOLOR0} в шейдере. Позиция и цвет хранятся вместе в одном вершинном буфере, поэтому конвейер использует одно описание входных данных в слоте 0. Если порядок полей или выравнивающие промежутки в структуре C# изменятся, измените и это описание.'
tutorial.input.table.headings.byteOffset: Байтовое смещение
tutorial.input.table.headings.cField: 'Поле C#'
tutorial.input.table.headings.format: Формат
tutorial.input.table.headings.shaderInput: Вход шейдера
tutorial.input.table.nextVertex.cField: Следующая вершина
tutorial.input.table.nextVertex.format: 'Полный шаг: 28 байт'
tutorial.input.table.nextVertex.shaderInput: Следующая входная запись
tutorial.input.table.vertexColor.format: '{float4} (16 байт)'
tutorial.input.table.vertexPosition.format: '{float3} (12 байт)'
tutorial.input.title: 'Описание вершинного входа'
tutorial.lifecycle.description: 'В каждом кадре приложение получает текущую выходную текстуру, переводит её в состояние для рендеринга, очищает и рисует треугольник. Затем оно переводит текстуру в состояние для вывода, отправляет команды, дожидается завершения и выводит изображение.'
tutorial.lifecycle.details: 'После закрытия окна {run} возвращает управление, и выполнение продолжается в коде освобождения ресурсов. В цикле рендеринга приложение уже дождалось выполнения команд каждого кадра, поэтому использованные ими ресурсы можно освободить. Полный код после {windowRun} выглядит так:'
tutorial.lifecycle.guidance: 'Освободите цепочку обмена перед уничтожением её окна, а контекст — после его ресурсов. Очередь повторно использует отправленные командные буферы, а цепочка обмена управляет своей выходной текстурой. Отдельный вызов {dispose} для этих объектов не нужен.'
tutorial.pipeline.behavior: 'После описания входа создайте конвейер:'
tutorial.pipeline.context: '{cullNone} отключает отбрасывание граней. Треугольник будет нарисован независимо от того, расположены ли его вершины на экране по часовой стрелке или против неё.'
tutorial.pipeline.description: '{graphicsPipeline} объединяет описание вершин, два шейдера и настройки сборки примитивов и записи во вложения.'
tutorial.pipeline.guidance: 'Цветовой формат конвейера должен совпадать с вложением прохода, поэтому берётся из {swapChainDescFormat}. {count1} задаёт одну выборку на пиксель.'
tutorial.pipeline.item: '{triangleList} собирает каждую последовательную тройку вершин в треугольник.'
tutorial.pipeline.notes: '{depthNone} отключает проверку и запись глубины, что соответствует отсутствию вложения глубины.'
tutorial.pipeline.reference: '{opaque} отключает смешивание. Поэтому результат фрагментного шейдера заменяет фон внутри треугольника.'
tutorial.pipeline.title: 'Графический конвейер'
tutorial.pipeline.usage: 'Объекты шейдеров можно освободить после создания конвейера. Сам конвейер сохраняйте на время рендеринга; в коде освобождения добавьте {pipelineDispose} перед {vertexBufferDispose}.'
tutorial.presentation.title: 'Графический контекст и вывод'
tutorial.project.context: 'В настройках сборки включите «{emphasis}» ({allowUnsafeBlocks}). Небезопасный код нужен для нативных вызовов вспомогательного класса для окна и загрузки вершин.'
tutorial.project.context.emphasis: Разрешить небезопасный код
tutorial.project.description: 'Создайте консольный проект C# с именем {firstTriangle} для .NET 10.'
tutorial.project.details: 'Добавьте в проект следующие пакеты NuGet:'
tutorial.project.guidance: '{zenithNET} предоставляет общий API для графики и вычислений; три пакета для графических API реализуют его. {zenithNETCompiler} компилирует шейдеры Slang для выбранного API.'
tutorial.project.title: 'Настройка проекта'
tutorial.requirements.description: 'Нужны {emphasis} и базовые знания C#. GPU и драйвер должны поддерживать следующие графические возможности для вашей платформы:'
tutorial.requirements.description.emphasis: .NET 10 SDK
tutorial.requirements.guidance: 'Zenith.NET выполняет рендеринг на нативной поверхности, предоставленной приложением. Silk.NET.Windowing создаёт окно и обрабатывает его события.'
tutorial.requirements.table.headings.graphicsBackend: 'Требования к графике'
tutorial.requirements.table.headings.platform: Платформа
tutorial.requirements.table.linux.graphicsBackend: 'Vulkan 1.4 с VK_EXT_descriptor_heap'
tutorial.requirements.table.linux.platform: 'Linux (X11 или XWayland)'
tutorial.requirements.table.macOS.graphicsBackend: Metal 4
tutorial.requirements.table.macOS.platform: macOS
tutorial.requirements.table.windows.graphicsBackend: 'DirectX 12 с Shader Model 6.6'
tutorial.requirements.table.windows.platform: Windows
tutorial.requirements.title: 'Необходимые условия'
tutorial.resize.context: 'Снова соберите и запустите приложение. Фон должен заполнять всё окно и после изменения его размера. Сохраните обработчик рендеринга — в его проход будет добавлено рисование треугольника.'
tutorial.resize.description: 'Размер изображений цепочки обмена должен соответствовать кадровому буферу. Зарегистрируйте обработчик {framebufferResize} после обработчика рендеринга и перед {windowRun}:'
tutorial.resize.details: 'Отслеживайте {link}, измеряемые в пикселях, а не изменения логических размеров окна. Если при сворачивании окна ширина или высота кадрового буфера становится нулевой, обработчик изменения размера оставляет цепочку обмена без изменений. Обработчик рендеринга тоже сразу возвращается, пока хотя бы один размер равен нулю. Рендеринг возобновляется, когда размеры снова позволяют вывести изображение.'
tutorial.resize.details.link: 'изменения размера кадрового буфера'
tutorial.resize.guidance: 'Перед вызовом {present} обработчик рендеринга дожидается завершения команд текущего кадра. Поэтому обработчик изменения размера может заменить изображения цепочки обмена, не прерывая работу предыдущего кадра. Связь завершения команд со временем жизни ресурсов подробнее описана в статье «{link}».'
tutorial.resize.guidance.link: Синхронизация
tutorial.resize.title: 'Изменение размера'
tutorial.shaders.compilation.context: '{appContextBaseDirectory} позволяет загрузить копию шейдера из выходного каталога приложения. Поэтому запуск из другого рабочего каталога не меняет место поиска файла.'
tutorial.shaders.compilation.description: 'В свойствах {triangleSlang} задайте параметру «{emphasis}» значение «{detail}». При сборке шейдер будет скопирован рядом с исполняемым файлом.'
tutorial.shaders.compilation.description.detail: Копировать, если файл новее
tutorial.shaders.compilation.description.emphasis: Копировать в выходной каталог
tutorial.shaders.compilation.details: 'В {programCs} добавьте инициализацию шейдеров после загрузки вершин и до обработчика рендеринга:'
tutorial.shaders.compilation.guidance: '{zenithCompiler} компилирует исходный код для {contextGraphicsApi}, а {createShader} создаёт объект шейдера из полученного описания. Имена точек входа {vSMain} и {fSMain} выбирают две функции, определённые в файле Slang.'
tutorial.shaders.compilation.title: 'Компиляция шейдеров'
tutorial.shaders.context: '{fSInput} связывает две шейдерные стадии. Вершинный шейдер записывает в {sVPOSITION} позицию в пространстве отсечения; по ней GPU определяет видимую часть треугольника. Поле {cOLOR0} передаёт цвет вершины, который интерполируется по треугольнику перед поступлением во фрагментный шейдер. Тип и семантика этого поля должны совпадать между стадиями.'
tutorial.shaders.description: 'Шейдеры — программы, выполняемые на GPU. Вершинный шейдер определяет положение каждой вершины, а фрагментный — цвет в точках изображения, покрытых треугольником. Обе стадии будут записаны в одном файле Slang. Для каждой задаётся отдельная точка входа — функция, с которой начинается выполнение.'
tutorial.shaders.details: 'Создайте {triangleSlang} в корне проекта с этими структурами входа и выхода:'
tutorial.shaders.fragment.description: 'Добавьте в тот же файл точку входа фрагментного шейдера:'
tutorial.shaders.fragment.details: 'Растеризация определяет, какие точки изображения покрывает треугольник, и создаёт для них фрагменты. Каждый фрагмент получает цвет, интерполированный из цветов трёх вершин. {fSMain} возвращает этот цвет, а {sVTARGET} направляет результат в первое цветовое вложение.'
tutorial.shaders.fragment.title: 'Фрагментный шейдер'
tutorial.shaders.guidance: '{vSInput} задаёт вход вершинного шейдера. {pOSITION0} и {cOLOR0} связывают атрибуты по семантикам; одних имён полей C# для этого недостаточно.'
tutorial.shaders.title: 'Стадии шейдеров'
tutorial.shaders.vertex.description: 'Добавьте в {triangleSlang} точку входа вершинного шейдера:'
tutorial.shaders.vertex.details: 'GPU выполняет эту функцию для каждой входной вершины. Функция добавляет четвёртую компоненту позиции, {w}, и передаёт цвет. После обработки вершин GPU делит x, y и z на w, получая нормализованные координаты устройства. При w, равном 1, эти значения не меняются.'
tutorial.shaders.vertex.title: 'Вершинный шейдер'
tutorial.surface.description: 'Задайте нативную поверхность вывода {emphasis}:'
tutorial.surface.description.emphasis: после {windowCenter} и перед {windowRun}
tutorial.surface.details: 'Кадровый буфер — изображение окна в пикселях. {surface} описывает нативный объект вывода и его размеры; {framebufferSize} сообщает размер в пикселях. При масштабировании экрана он может отличаться от логического размера окна.'
tutorial.surface.guidance: 'Поверхность предоставляет нативные дескрипторы для выбранного графического API: окно Win32 в Windows, дисплей и окно X11 в Linux или прикреплённый слой Metal в macOS.'
tutorial.surface.title: 'Нативная поверхность'
tutorial.swapChain.context: 'Цепочка обмена зависит от контекста и окна. Замените {windowDispose} в конце {programCs} следующим порядком освобождения:'
tutorial.swapChain.description: 'Создайте цепочку обмена сразу после описания поверхности:'
tutorial.swapChain.details: '{swapChain} управляет изображениями, выводимыми в окно. {drawable} предоставляет текущее изображение в виде {texture} — ресурса API для изображений. После рендеринга {present} запрашивает его вывод и переходит к следующей выходной текстуре.'
tutorial.swapChain.guidance: '{b8G8R8A8UNorm} хранит четыре 8-битных канала в порядке синий, зелёный, красный, альфа. {uNorm} отображает целые 0–255 в значения 0–1. Шейдер выдаёт логическое значение RGBA, а формат определяет его представление в памяти.'
tutorial.swapChain.title: 'Цепочка обмена'
tutorial.title: Первый треугольник
tutorial.window.description: 'Скачайте {cocoaHelperCs} в проект. Этот вспомогательный класс связывает слой Metal с окном macOS.'
tutorial.window.details: "Замените содержимое {programCs} следующим кодом:"
tutorial.window.guidance: '{graphicsAPINone} отключает создание графического контекста в Silk.NET. Позднее приложение создаёт контекст Zenith.NET. {initialize} создаёт нативное окно и открывает доступ к дескрипторам оконной системы. {center} размещает окно по центру экрана. {run} обрабатывает события до закрытия окна, после чего {dispose} освобождает его.'
tutorial.window.notes: 'Соберите и запустите приложение. Убедитесь, что окно открывается, перемещается, меняет размер и закрывается. Содержимое пока не определено, поскольку команды рендеринга ещё не отправлены. Закройте окно перед продолжением.'
tutorial.window.title: 'Создание окна'
