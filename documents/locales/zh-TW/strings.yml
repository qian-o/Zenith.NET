tutorial.context.description: 視窗現在可以開啟，但我們尚未建立將要渲染至其中的 GPU 物件。{graphicsContext} 提供對所選圖形後端及其命令佇列的存取。
tutorial.context.details: 在{emphasis}插入此區塊：
tutorial.context.details.emphasis: using 指示詞之後、{iWindowWindow} 之前
tutorial.context.guidance: 分支邏輯會在 Windows 上選取 DirectX 12，在 macOS 上選取 Metal，在 Linux 上選取 Vulkan。後續的渲染程式碼皆使用共用的 Zenith.NET API。我們在開發期間要求啟用驗證，並列印透過 {validationMessage} 回報的訊息。診斷資訊取決於後端以及電腦上可用的驗證元件。
