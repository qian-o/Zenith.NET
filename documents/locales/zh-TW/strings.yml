concepts.platforms.surface.title: 當應用程式擁有呈現時提供原生呈現目標
concepts.platforms.title: 平台整合
concepts.resources.allocation.context: "除非需要自行實作記憶體配置器，否則先使用圖形上下文建立的資源。使用堆積時，應先等待所有使用這些資源的 GPU 工作完成，再釋放堆積中放置的資源，最後釋放堆積本身。"
concepts.resources.allocation.description: "{heap} 提供記憶體，供您在指定的位元組位移處放置資源。應用程式負責選擇這些位移，並追蹤哪些區域正在使用。"
concepts.resources.allocation.details: "放置資源前，使用準確的緩衝區或紋理描述呼叫 {contextGetSizeAndAlignment}。所選位移必須是傳回對齊值的整數倍，預留空間必須滿足傳回的大小，資源也必須位於堆積的總位元組範圍內。仍在使用的配置區域不得重疊。紋理儲存空間可能包含後端特有的填補與對齊，因此不能以像素數量乘以每像素位元組數來計算配置大小。"
concepts.resources.allocation.guidance: "對於放置於堆積的緩衝區，其記憶體駐留設定應與堆積一致。這裡介紹的一般 GPU 紋理應使用僅供 GPU 使用的堆積。大小與對齊是放置資源的要求，並不保證所有後端都能將任意資源放入任意堆積。"
concepts.resources.allocation.title: 在需要配置控制時將資源放置於堆積中
