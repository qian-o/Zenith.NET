concepts.platforms.integration.title: 選擇呈現路徑以及架構
concepts.platforms.lifecycle.context: 對於 UI 檢視，在建立相符的渲染資源時，使用事件輸出紋理的 {descWidth}、{descHeight}、{descFormat} 與 {descSampleCount}。控制項決定該輸出紋理的解析度；不要假設其邏輯尺寸或顯示比例一律等於紋理尺寸。
concepts.platforms.lifecycle.description: 對於原生交換鏈，請以像素為單位傳遞畫面緩衝區尺寸。啟用顯示比例縮放時，以邏輯單位表示的視窗大小可能會有所不同。略過零大小的畫面緩衝區，在像素大小變更時調整交換鏈大小，並為每個影格取得 {swapChainDrawable}。輸出紋理歸交換鏈所有，且可能會在呈現或調整大小後變更。
concepts.platforms.lifecycle.details: "{swapChainResize} 會變更現有呈現目標的尺寸。{swapChainRefresh} 會取代呈現目標描述，包括原生控制代碼。在執行任一作業前，應先完成對受影響資源的所有未完成存取。銷毀原生呈現目標前，應先釋放交換鏈。"
concepts.platforms.lifecycle.guidance: "重新建立尺寸跟隨視窗變更的應用程式自身深度或螢幕外紋理，並更新包含其控制代碼的常數。當附件格式與取樣計數維持相容時，管線可以在尺寸變更後繼續使用。{link}在取代深度紋理的同時保留了其管線。"
concepts.platforms.lifecycle.guidance.link: 旋轉立方體渲染器
concepts.platforms.lifecycle.title: "讓輸出紋理的尺寸與生命週期配合宿主"
concepts.platforms.ownership.description: "應用程式擁有其指派的圖形上下文以及為渲染所建立的資源。控制項擁有其自身的呈現資源。變更檢視的 {graphicsContext} 屬性會使排程器重新建立控制項的資源；它不會為新上下文重新建立應用程式的管線、緩衝區或紋理。"
concepts.platforms.ownership.details: 將資源取代與檢視的影格生命週期相互協調。在處置應用程式資源或指派的上下文之前，停止檢視的影格活動並完成未決的 GPU 使用。移除檢視不會將上下文所有權移轉給控制項。
concepts.platforms.ownership.guidance: 共用的 {frameSchedulerCs} 透過檢視的 UI 發送器發送影格工作。保持影格處理常式聚焦於更新與記錄影格；該處過長的 CPU 工作也會延遲 UI。
concepts.platforms.ownership.title: 將應用程式資源保持在控制項所有權之外
concepts.platforms.surface.context: 視窗程式庫或 UI 架構支援作業系統並不保證所選的 GPU 後端在該處可用。裝置功能、驅動程式與原生表面支援仍必須相符。在建立這些工作負載之前，請透過 {contextCapabilities} 檢查選用的光線追蹤與網格著色（mesh shading）。
concepts.platforms.surface.description: "{link}使用 Silk.NET 建立視窗並處理事件。Zenith.NET 透過 {surface} 描述與 {swapChain} 連接至該視窗。表面包含原生控制代碼與尺寸；建構該描述並不會建立或擁有作業系統視窗。"
concepts.platforms.surface.description.link: 三角形教學
concepts.platforms.surface.details: 控制代碼必須與所選後端相符：
concepts.platforms.surface.guidance: "教學的 {appCs} 顯示了 Windows、macOS 與 X11 的選項。其 Linux 宿主程式提供 Xlib 控制代碼；在 Wayland 工作階段中使用它需要 XWayland。原生 Wayland 應用程式將透過 {surfaceWayland} 提供不同的控制代碼。"
