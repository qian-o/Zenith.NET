concepts.platforms.integration.table.winForms.presentation: 為控制項的 {hWND} 建立 Zenith.NET 交換鏈。請參閱 {zenithViewCs}。
concepts.platforms.integration.table.winUI.integration: Windows 上的 WinUI
concepts.platforms.integration.table.winUI.presentation: 渲染至匯入的共用 Direct3D 11 紋理，接著複製到附加至 {swapChainPanel} 的合成交換鏈。請參閱 {zenithViewWinUICs}。
