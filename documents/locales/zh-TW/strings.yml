tutorial.description: 建置一個 .NET 主控台應用程式，開啟視窗並繪製帶有平滑色彩漸層的三角形。您將學習頂點資料、著色器與管線狀態如何協同運作，接著記錄並提交產生影像的命令。
tutorial.details: 請依序閱讀各章節。您將先開啟空白視窗，接著顯示背景色彩，最後繪製三角形。在新增下一部分之前，每個檢查點都會確認應用程式的一部分正常運作。初始化僅執行一次；渲染回呼每次被叫用時都會記錄新的影格。
tutorial.draw.context: "{draw} 的引數如下："
tutorial.draw.description: 在 {windowRender} 回呼中，在 {beginRenderPass} 與 {endRenderPass} 之間，將 {addTheTriangleDrawCommandsHereLater} 取代為下列三個命令：
tutorial.draw.details: "{setPipeline} 選取我們剛建立的著色器與狀態。請在繫結頂點資料之前設定它：後端會使用管線的輸入配置來解譯繫結。"
tutorial.draw.guidance: "{setVertexBufferVertexBuffer} 將從位元組位移 0 開始的緩衝區繫結至輸入插槽 0。該插槽對應於 {inputLayouts} 中的單一項目。它不會再次複製或上傳資料。"
tutorial.draw.notes: 此時命令仍僅處於已記錄狀態。已位於渲染回呼結尾的 {submitWait} 與 {present} 呼叫會執行工作並顯示其結果。清除操作依然必要，因為三角形只覆蓋影像的一部分；背景在每個影格中也必須接收定義好的色彩。
