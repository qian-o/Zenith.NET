concepts.resources.textureUsages.description: '傳輸旗標宣告資源在 GPU 複製中作為來源或目標。CPU 能否直接存取這塊儲存空間，則由記憶體放置方式決定。'
concepts.resources.textureUsages.details: '用途旗標宣告紋理可以發揮的作用。在這些作用之間切換時，需要對應的{link}；所選裝置也必須支援以該紋理格式執行所宣告的操作。'
concepts.resources.textureUsages.details.link: '佈局與同步'
concepts.resources.textureUsages.table.colorAttachment.role: '渲染通道中的色彩附件。'
concepts.resources.textureUsages.table.depthStencilAttachment.role: '渲染通道中的深度／樣板附件。'
