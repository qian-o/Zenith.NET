### YamlMime:Resources
concepts.execution.context.description: '{graphicsContext} 透過所選圖形 API 連接應用程式與 GPU 裝置，並提供圖形、計算與傳輸佇列。一起使用的資源必須屬於同一上下文；緩衝區、紋理、著色器、管線及其控制代碼不能跨上下文繫結。'
concepts.execution.context.details: '{capabilities} 提供裝置名稱與支援的功能。建立光線追蹤或網格著色所需的資源前，分別透過 {rayTracingSupported} 與 {meshShadingSupported} 確認支援情況。{link}與{detail}範例展示了初始化時的檢查方式。'
concepts.execution.context.details.detail: '網格著色'
concepts.execution.context.details.link: '光線追蹤'
concepts.execution.context.title: '圖形上下文'
concepts.execution.description: 'GPU 工作從 CPU 端開始準備：應用程式建立資源，記錄使用這些資源的命令，再提交到佇列。提交後，CPU 可以繼續處理其他工作，同時由 GPU 執行命令。相關資源必須保留到 GPU 執行結束。'
concepts.execution.ownership.description: '所有權決定由誰釋放物件，GPU 完成狀態決定何時可以釋放。即使仍保留物件的 C# 參考，呼叫 {dispose} 也會釋放其原生資源。提交命令不會將資源所有權轉交給佇列。'
concepts.execution.ownership.details: '結束程式時，先停止提交新工作，並等待所有相關佇列完成最後一次資源存取。接著釋放應用程式資源，最後釋放上下文。上下文會釋放自身的佇列與內部輔助物件，因此這一步必須在應用程式工作全部完成後進行。'
concepts.execution.ownership.guidance: '渲染期間，若準備覆寫資料或替換資源，就應追蹤仍在使用它們的工作。等待這些存取完成後，再修改資料或釋放儲存空間。檢視與底層資源如何遵循這個生命週期規則，見{link}。'
concepts.execution.ownership.guidance.link: '資源管理'
concepts.execution.ownership.table.applicationResources.object: '應用程式建立的資源'
concepts.execution.ownership.table.applicationResources.ownership: '最後一次 GPU 使用完成後，由應用程式釋放。'
