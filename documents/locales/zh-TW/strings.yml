concepts.execution.pipelines.description: 圖形管線結合了著色器、頂點輸入配置、將頂點組裝為基本圖元的規則、附件格式與渲染狀態。在繫結頂點、索引或常數資料以及發出繪圖命令之前設定它。其附件格式與取樣計數必須符合渲染通道的附件。
concepts.execution.pipelines.details: 計算管線為分派提供著色器進入點，以啟動 GPU 執行緒群組。在分派之前設定它及其常數。計算分派屬於圖形渲染通道之外。變更管線即代表後續命令解譯其輸入方式的變更；在使用所選管線之前，請繫結該管線所需的資料。
concepts.execution.pipelines.guidance: "{link}展示了完整的圖形執行序列。{detail}記錄了一次分派，隨後透過圖形通道顯示其結果。"
concepts.execution.pipelines.guidance.detail: 計算範例
concepts.execution.pipelines.guidance.link: 三角形的渲染回呼
concepts.execution.pipelines.title: 管線決定命令如何解譯資料
concepts.execution.queues.description: 當單一影格結合了繪圖、計算與複製時，請從 {graphicsQueue} 開始。將相依的工作保持在單一佇列上可讓其順序更容易追蹤。
concepts.execution.queues.details: 佇列接受批次命令以供執行。個別佇列不一定對應到個別的硬體引擎，因此它們的工作可能無法同時執行。當工作負載能從重疊執行中獲益時請使用其他佇列，並在某個佇列耗用另一個佇列的結果時新增明確的相依性。
concepts.execution.queues.guidance: 當後續命令相依於先前的寫入時，應用程式還必須確保這些寫入對後續命令而言可用。將兩個命令緩衝區提交至相同佇列並不會自動建立所有這類相依性。命令可能會使用不同的 GPU 階段，且後續存取可能需要屏障或紋理轉換。{link}說明了提交順序與資源可見度之間的區別。
concepts.execution.queues.guidance.link: 同步
concepts.execution.queues.table.computeQueue.workToRecord: 計算分派與相容的傳輸工作，不包含圖形渲染通道。
concepts.execution.queues.table.graphicsQueue.workToRecord: 渲染通道與繪圖，加上影格所使用的計算與傳輸操作。
concepts.execution.queues.table.headings.queue: 佇列
concepts.execution.queues.table.headings.workToRecord: 要記錄的工作
concepts.execution.queues.table.transferQueue.workToRecord: 上傳、回讀與複製工作，不包含繪圖或計算分派。
concepts.execution.queues.title: 依據欲執行的工作選擇佇列
concepts.execution.recording.context: 佇列會輪詢完成狀態並回收完成的命令緩衝區。為每次新記錄呼叫 {queueCommandBuffer}；它可能會傳回回收的執行個體。請勿處置借用的命令緩衝區、請勿重複提交兩次，也不要在提交後繼續向其中記錄。給定的命令緩衝區一次僅由一個執行緒進行記錄；佇列的內部鎖定無法防止對命令緩衝區的並行編輯。
concepts.execution.recording.description: "{queueCommandBuffer} 會傳回已開始記錄的 {commandBuffer}。記錄命令及其相依性，接著呼叫 {submit} 一次。提交會結束記錄，並傳回識別該佇列上完成點的 {timelineValue}。"
concepts.execution.recording.details: 例如，在將影格記錄至 {commandBuffer} 後，三角形教學會提交它並等待完成：
concepts.execution.recording.guidance: "{submit} 排程工作；{wait} 防止 CPU 繼續執行，直到該提交完成為止。記錄繪製、結束渲染通道與提交命令緩衝區是個別分開的操作。記錄繪製與結束通道皆不會等待 GPU。"
concepts.execution.recording.title: 記錄不會執行命令
concepts.execution.title: 執行模型
concepts.platforms.description: 選擇您的應用程式是自行擁有原生視窗與影格迴圈，還是使用 UI 渲染控制項。該選擇決定了誰取得輸出紋理、提交命令並呈現結果。輸出紋理是用作目前影格輸出的紋理。螢幕外圖形與計算工作不需要視窗或交換鏈。
concepts.platforms.frame.context: 在該通道內部新增您的管線繫結與繪圖命令。在返回之前結束通道。不要獨立提交提供的命令緩衝區或自行呈現，也不要處置命令緩衝區或輸出紋理。如果您的處理常式在另一種配置中使用輸出紋理，請將其恢復為 {colorAttachment} 以進行控制項的最終轉換。
concepts.platforms.frame.description: 這些整合實作了 {iZenithView}。應用程式提供其 {graphicsContext}，在 {updateRequested} 中更新場景資料，並使用 {renderEventArgs} 在 {renderRequested} 中記錄渲染。
concepts.platforms.frame.details: "控制項負責每個影格的完整流程：取得輸出紋理與命令緩衝區，將輸出紋理轉換為 {colorAttachment}，叫用處理常式，然後執行該框架所需的提交與呈現步驟。"
concepts.platforms.frame.guidance: "對於名為 {view}、已完成初始化且已指派圖形上下文的 {iZenithView}，此處理常式會記錄一個完整的清除通道。它需要 {usingZenithNET}："
concepts.platforms.frame.notes: "控制項在每個影格開始時皆從 {undefined} 轉換，因此應用程式不能依賴保留輸出紋理的先前內容。每個影格皆請清除或渲染所需的影像。將持續累加或快取的渲染內容保留在應用程式自身的紋理中，然後透過檢視顯示該紋理。"
concepts.platforms.frame.reference: "{zenithViewHelperDrawableFormat} 提供整合的預設色彩格式。在比對附件格式、取樣計數與尺寸時，請檢查實際事件中的輸出紋理。"
concepts.platforms.frame.title: 記錄至 UI 控制項提供的影格中
concepts.platforms.integration.context: WinForms、WPF 與 Windows 的 WinUI 路徑需要 Windows。MAUI 應用程式需要其目標平台的工作負載，且必須使用 {useZenithView} 註冊控制項處理常式；請參閱 {extensionsCs}。架構支援與後端支援都必須滿足。
concepts.platforms.integration.description: 控制項共用事件介面，但呈現方式並非全部相同：
concepts.platforms.integration.details: 點陣圖回讀（bitmap readback）在 UI 顯示之前將渲染的像素複製至 CPU 記憶體中。共用紋理互通避免了該回讀，但仍可能需要 GPU 複製與同步。因此，共用的 {renderRequested} 介面並不代表相同的呈現成本或原生互通需求。
concepts.platforms.integration.guidance: 使用適合應用程式架構的套件；例如：
