tutorial.execution.details: 視窗應顯示一個三角形，在深色背景下具有紅色的上頂點、綠色的右下角與藍色的左下角。內部應顯示這些色彩之間的平滑漸層。
tutorial.execution.guidance: 調整視窗大小。調整大小回呼會更新畫面緩衝區尺寸並調整交換鏈的大小。渲染通道會建立符合該影像的視口。由於頂點位置保持為標準化座標，三角形保持視窗寬度與高度的相同比例；變更外觀比例可能會拉伸其形狀。保留物件的外觀比例需要投影或視口原則，這超出了此初次繪製的範疇。
tutorial.execution.title: 執行、調整大小與關閉
tutorial.frame.commands.context: 在 {endRenderPass} 之後，第二次轉換會準備影像以供呈現。{submit} 結束記錄並提交命令緩衝區；{wait} 等待 GPU 完成該提交。接著 {present} 要求顯示渲染完成的影像。
tutorial.frame.commands.description: 渲染通道（render pass）將使用相同附件的繪製操作分組在一起。在此，色彩附件是交換鏈的輸出紋理，即接收繪圖的影像。{colorAttachmentClear} 會建立描述，指示通道清除為指定的 RGBA 色彩，並在通道結束時保留結果。{beginRenderPass} 記錄這些指示；GPU 會在命令提交後執行清除。
tutorial.frame.commands.details: 中括號內包含我們唯一的色彩附件。{null} 引數代表沒有深度／樣板附件，該附件通常會儲存用於深度與樣板測試的深度值與樣板遮罩。
tutorial.frame.commands.guidance: "{beginRenderPass} 會設定涵蓋附件的視口與裁剪區域。視口將渲染座標對應至像素，而裁剪區域則限制可寫入的像素。這些預設值涵蓋整個輸出紋理，這正是繪製此三角形所需的。"
tutorial.frame.commands.title: 清除、提交與呈現
tutorial.frame.description: 首先以單一背景色彩填滿影像。此操作稱為清除（clear）。若該色彩出現在視窗中，即表示原生呈現目標、命令提交與呈現路徑正常協同運作。此檢查點可讓您在新增幾何體與著色器之前先驗證影格迴圈。
tutorial.frame.details: 渲染回呼是 Silk.NET 在需要繪製影格時叫用的程式碼。此回呼不需要事件的經過時間引數，因此命名為 {value}。在{emphasis}註冊它：
tutorial.frame.details.emphasis: "{windowRun} 之前"
tutorial.frame.target.description: "{graphicsQueueCommandBuffer} 會取得已開始記錄的命令緩衝區。記錄是為 GPU 描述工作；它不會立即執行該工作。"
tutorial.frame.target.details: 第一個 {transition} 會準備輸出紋理以供色彩附件存取。{default} 選取 Mip 層級 0 與陣列層 0。我們使用 {undefined} 作為前一個配置，因為我們將清除整個影像並捨棄先前的內容。需要保留現有內容的通道則必須改用其實際的前一個配置。
tutorial.frame.target.guidance: 每個影格請使用交換鏈目前的輸出紋理。呈現操作可能會變更可用的影像，因此從較早影格儲存的紋理並非永久的視窗渲染目標。
tutorial.frame.target.title: 準備輸出紋理
tutorial.frame.title: 顯示背景色彩
tutorial.geometry.data.description: 在{emphasis}新增此陣列。後續的資源建立步驟也依所示順序位於該回呼之前。
tutorial.geometry.data.description.emphasis: "{windowRender} 之前"
tutorial.geometry.data.details: 每個陣列項目建立一個 {vertex}。內部的兩個 {new} 運算式建立其 {vector3} 位置與 {vector4} 色彩。頂點描述了頂部、右下角與左下角。頂點著色器將提供第四個位置座標 {w}。當 w 等於 1 時，x 與 y 直接描述標準化裝置座標：-1 與 +1 是影像邊緣，0 是中心。這些座標與視窗的像素尺寸無關。
tutorial.geometry.data.guidance: "每種色彩包含紅、綠、藍與 Alpha 分量。三個頂點的 Alpha 皆為 1，且位置的 z 座標皆為 0，因此位於同一平面上。這些位置已經直接描述要渲染的座標，無需相機或變換矩陣。對於這個單一平面三角形，我們還會停用混合與深度測試，並省略深度緩衝區。"
tutorial.geometry.data.title: 選擇頂點位置
tutorial.geometry.description: "頂點由一個位置以及繪製時使用的資料組成。我們的三角形有三個頂點，每個角各一個。每個頂點都包含位置與色彩。GPU 會對色彩進行插補，計算三角形內部各處的中間值。"
tutorial.geometry.format.description: 在{emphasis}附加此宣告：
tutorial.geometry.format.description.emphasis: "{programCs} 的結尾處、清理陳述式之後"
tutorial.geometry.format.details: "{file} 將此型別限制在 {programCs} 內，建構函式初始化其位置與色彩欄位。{layoutKindSequential} 保持欄位依宣告順序排列。{position} 包含三個 32 位元浮點數，{color} 包含四個。在此結構中，位置始於位元組 0，色彩始於位元組 12，完整的頂點佔用 28 個位元組。我們將向圖形管線描述這完全相同的配置。"
tutorial.geometry.format.title: 定義頂點
tutorial.geometry.title: 向 GPU 提供三個頂點
tutorial.geometry.upload.context: "{fixed} 可防止記憶體回收行程在使用陣列位址時移動該陣列。對於此 CPU 可寫入的緩衝區，{upload} 在返回之前會對應、複製並取消對應記憶體，因此之後無需保持陣列固定。緩衝區在整個渲染過程中必須保持存活，且上傳只需進行一次，因為頂點不會改變。"
tutorial.geometry.upload.description: 受控陣列是 CPU 資料。{buffer} 提供 GPU 可從中讀取頂點的儲存空間。在陣列之後新增：
tutorial.geometry.upload.details: 總大小為 {sizeofVertexVerticesLength}：每個頂點 28 位元組，三個頂點，總共 84 位元組。{bufferUsagesVertex} 允許頂點輸入存取。{cpuWriteOnly} 允許 CPU 直接初始化此小型緩衝區。描述項的跨距記錄了元素大小；我們稍後建立的輸入配置將指示頂點擷取機制如何讀取個別屬性。
tutorial.geometry.upload.guidance: 建立緩衝區並不會填入資料。{upload} 會將陣列複製到該配置中，起始於目標位元組位移 0。其來源描述提供指標與要複製的位元組數。
tutorial.geometry.upload.notes: 在 {programCs} 底部的清理程式碼中，緊接在 {swapChainDispose} 之前新增 {vertexBufferDispose}。對於較大型的靜態幾何體，{link}解釋了何時應選擇僅 GPU 記憶體並改用傳輸上傳。
tutorial.geometry.upload.notes.link: 資源管理
tutorial.geometry.upload.title: 配置緩衝區並上傳陣列
tutorial.input.description: 頂點位元組與著色器皆已就緒。接下來描述 GPU 應該如何讀取每個頂點。屬性是單一值，例如位置或色彩。輸入配置賦予每個屬性格式與位元組位移；跨距提供從一個頂點到下一個頂點的位元組距離。在建立著色器後新增此初始化區塊：
tutorial.input.details: "{inputLayoutAdd} 會在目前跨距處附加元素，並將該跨距增加該元素的大小。它不會檢查 C# 結構。在此處它產生了 CPU 記憶體與著色器輸入之間的下列協議："
tutorial.input.guidance: "變更 C# 欄位順序或填補而未更新此描述會使 GPU 讀取錯誤的位元組。預設的 {semanticIndex} 為零，符合 {pOSITION0} 與 {cOLOR0}。兩個元素屬於同一個緩衝區，因此管線將包含一個輸入配置，且我們會將該緩衝區繫結至插槽 0。"
tutorial.input.table.headings.byteOffset: 位元組位移
tutorial.input.table.headings.cField: "C# 欄位"
tutorial.input.table.headings.format: 格式
tutorial.input.table.headings.shaderInput: 著色器輸入
tutorial.input.table.nextVertex.cField: 下一個頂點
tutorial.input.table.nextVertex.format: 總跨距：28 位元組
tutorial.input.table.nextVertex.shaderInput: 下一筆輸入記錄
tutorial.input.table.vertexColor.format: "{float4}（16 位元組）"
tutorial.input.table.vertexPosition.format: "{float3}（12 位元組）"
tutorial.input.title: 描述頂點輸入配置
tutorial.lifecycle.description: 完成的應用程式會重複此順序：
tutorial.lifecycle.details: 關閉視窗會從 {run} 返回。每個渲染完成的影格都已等待其 GPU 工作完成，因此我們現在可以處置它所使用的資源。{windowRun} 之後的清理程式碼應為：
tutorial.lifecycle.guidance: "在銷毀原生視窗前釋放交換鏈，並在釋放所有資源後釋放圖形上下文。佇列擁有並回收提交的命令緩衝區，交換鏈擁有其輸出紋理。因此，本應用程式不需要個別對這些命令緩衝區或輸出紋理呼叫 {dispose}。"
tutorial.lifecycle.title: 追蹤單一影格的生命週期
tutorial.pipeline.behavior: 在輸入配置之後新增：
tutorial.pipeline.context: "{cullNone} 會填滿三角形而不捨棄任何面朝向。其頂點的順序決定了面的環繞方向，因此停用剔除可防止該順序隱藏我們第一個三角形。"
tutorial.pipeline.description: 我們現在擁有頂點資料、輸入配置與兩個著色器。{graphicsPipeline} 將它們連接起來，並指定 GPU 如何將頂點組裝為基本圖元並將結果寫入附件。
tutorial.pipeline.details: 管線將可程式化著色器階段與固定功能設定結合，後者控制諸如三角形組裝、面剔除與混合等 GPU 操作。對於此三角形，請選取下列設定：
tutorial.pipeline.guidance: 色彩格式取自 {swapChainDescFormat}。它必須符合渲染通道所使用的影像。{count1} 代表每個像素一個取樣。
tutorial.pipeline.item: "{triangleList} 會將每組連續的三個頂點組裝成一個三角形。我們將提供三個頂點並繪製一次，因此不需要索引緩衝區。"
tutorial.pipeline.notes: "{depthNone} 會停用深度測試與寫入，符合沒有深度附件的通道。"
tutorial.pipeline.reference: "{opaque} 會停用混合，因此片元著色器的色彩會取代三角形內部的背景。"
tutorial.pipeline.title: 連接著色器與頂點配置
tutorial.pipeline.usage: 著色器物件可在建立管線後釋放，正如範例渲染器中所做的那樣。對於使用該管線進行繪製的每個影格，請保持管線本身存活。在清理程式碼中將 {pipelineDispose} 加入 {vertexBufferDispose} 之前。管線建立是渲染回呼前的最後一個初始化步驟。
tutorial.pipeline.validation: 管線描述宣告了附件設定；它不會建立另一個影像。{inputLayouts} 只有一個項目，因為位置與色彩一起儲存在單一緩衝區中。
tutorial.presentation.title: 將 GPU 連接至視窗
tutorial.project.context: 在專案建置設定中啟用{emphasis}（{allowUnsafeBlocks}）。我們將用它將頂點資料傳遞給 GPU，並用於視窗協助程式的原生呼叫。
tutorial.project.context.emphasis: 允許不安全的程式碼
tutorial.project.description: 建立專案並進入其目錄：
tutorial.project.details: 安裝套件：
tutorial.project.guidance: "{zenithNET} 提供共用渲染 API。這三個後端套件讓同一個程式能選擇適合其平台的實作。{zenithNETCompiler} 會針對該實作編譯 Slang 著色器（我們稍後將編寫的小型 GPU 程式）。Silk.NET 提供視窗與事件迴圈。"
tutorial.project.title: 建立主控台專案
tutorial.requirements.context: 您可以從空白專案開始跟隨本頁操作。{link}與其{detail}可作為此處使用之渲染與視窗 API 的參考。
tutorial.requirements.context.detail: "共用宿主程式"
tutorial.requirements.context.link: Hello Triangle 範例
tutorial.requirements.description: "您需要 {emphasis}、程式碼編輯器或 IDE，以及配備 Zenith.NET 後端所支援之 GPU 與驅動程式的桌上型電腦。具備基礎 C# 知識即可；圖形概念會在初次使用時一併介紹。這是一個標準的 {net10} 主控台專案。後端負責將 Zenith.NET 操作轉譯為對圖形 API（例如 DirectX 12、Metal 或 Vulkan）的呼叫。應用程式在啟動時選擇其一："
tutorial.requirements.description.emphasis: .NET 10 SDK
tutorial.requirements.details: 在此處使用的視窗路徑中，Linux 需要與 X11 相容的視窗工作階段。此三角形不需要選用的光線追蹤與網格著色（mesh shading）功能。
tutorial.requirements.guidance: Zenith.NET 會渲染至應用程式提供的表面。Silk.NET.Windowing 將建立桌面視窗並處理其事件。在 macOS 上，呈現目標為 Metal 圖層（{cAMetalLayerCs}）；教學的視窗協助程式會為我們附加該圖層。
tutorial.requirements.table.headings.graphicsBackend: 圖形後端
tutorial.requirements.table.headings.platform: 平台
tutorial.requirements.table.headings.windowSurface: 視窗表面
tutorial.requirements.table.linux.graphicsBackend: Vulkan 1.4
tutorial.requirements.table.linux.platform: Linux
tutorial.requirements.table.linux.windowSurface: X11 視窗與顯示；XWayland 亦適用
tutorial.requirements.table.macOS.graphicsBackend: Metal 4
tutorial.requirements.table.macOS.platform: macOS
tutorial.requirements.table.macOS.windowSurface: 附加至視窗的 Metal 圖層
tutorial.requirements.table.windows.graphicsBackend: DirectX 12
tutorial.requirements.table.windows.platform: Windows
tutorial.requirements.table.windows.windowSurface: Win32 視窗控制代碼
tutorial.requirements.title: 開始之前
tutorial.resize.context: 再次執行 {dotnetRun}。視窗現在應該具有均勻的深色背景，並在調整大小後繼續填滿視窗。請保留此回呼：三角形將繪製在其現有的渲染通道內。
tutorial.resize.description: 交換鏈的影像必須遵循畫面緩衝區的尺寸。使用 {framebufferResize} 回應像素大小的變更，包括因顯示比例調整而引起的變更。在渲染回呼之後、仍處於 {windowRun} 之前新增：
tutorial.resize.details: Silk.NET 會區分視窗大小變更與{link}。我們需要後者，因為交換鏈儲存的是像素。最小化的視窗可能具有零大小的畫面緩衝區。在這種情況下，兩個回呼都會略過其 GPU 工作。調整大小後，渲染通道將使用新的附件尺寸作為其視口與裁剪區域。
tutorial.resize.details.link: 畫面緩衝區大小變更
tutorial.resize.guidance: 我們在每次提交後都會等待，因此當調整大小處理常式取代影像時，沒有較早的影格仍在使用這些影像。目前的 {present} 實作也會在圖形佇列上等待。這個簡單的迴圈確保前一個影格的工作完成後下一個影格才會開始；{link}涵蓋了更進階的排程方式。
tutorial.resize.guidance.link: 同步
tutorial.resize.title: 回應視窗大小調整
tutorial.shaders.compilation.context: 編譯會在初始化期間執行一次。{appContextBaseDirectory} 負責在可執行檔旁找出複製的著色器，而與目前工作目錄無關。這些著色器僅使用頂點輸入，因此目前尚無常數緩衝區、紋理或資源控制代碼需要繫結。
tutorial.shaders.compilation.description: "在 {triangleSlang} 的檔案屬性中，將{emphasis}設為{detail}。建置時會將著色器複製到可執行檔旁。"
tutorial.shaders.compilation.description.detail: 有更新時才複製
tutorial.shaders.compilation.description.emphasis: 複製到輸出目錄
tutorial.shaders.compilation.details: 返回 {programCs}。在頂點上傳之後、渲染回呼之前新增這些初始化陳述式：
tutorial.shaders.compilation.guidance: "{zenithCompiler} 會傳回包含所要求圖形 API 程式碼的著色器描述。{createShader} 會建立對應的後端物件。圖形 API 與進入點名稱皆至關重要：使用 {contextGraphicsApi}，並將 {vSMain} 與 {fSMain} 拼寫得與 Slang 檔案完全相同。"
tutorial.shaders.compilation.title: 針對選取的後端進行編譯
tutorial.shaders.context: "{fSInput} 連接頂點著色器的輸出與片元著色器的輸入。由頂點著色器寫入時，{sVPOSITION} 提供裁剪空間位置，即 GPU 用來判斷哪些內容位於可見影像範圍內的四個座標。{cOLOR0} 傳遞要在頂點之間插補的色彩。兩個階段使用的型別與語意必須一致。"
tutorial.shaders.description: 著色器是由 GPU 執行的程式。本次繪圖需要一個頂點著色器來定位頂點，以及一個片元著色器來產生三角形內部的色彩。我們將使用 Slang 著色器語言編寫它們，並從同一個檔案編譯兩個進入點。進入點是著色器階段開始執行的函式。
tutorial.shaders.details: 建立 {triangleSlang}，從以下兩個結構開始：
tutorial.shaders.fragment.description: 將片元進入點附加至同一個檔案：
tutorial.shaders.fragment.details: 光柵化決定三角形涵蓋哪些影像位置。它會產生片元（由片元著色器處理的資料），頂點色彩在涵蓋區域內進行插補。{fSMain} 透過識別第一個色彩附件的 {sVTARGET} 傳回此插補色彩。
tutorial.shaders.fragment.guidance: 頂點色彩插補與附件混合是獨立分開的。混合會將片元的輸出與附件中已儲存的色彩結合。我們的不透明混合狀態停用了該結合，因此插補色彩會直接取代三角形內部的背景。
tutorial.shaders.fragment.title: 為片元著色
tutorial.shaders.guidance: "{vSInput} 描述頂點著色器從頂點緩衝區接收的內容。語意 {pOSITION0} 與 {cOLOR0} 識別輸入；僅憑 C# 欄位名稱無法建立該對應。"
tutorial.shaders.title: 編寫兩個著色器階段
tutorial.shaders.vertex.description: 將頂點進入點附加至 {triangleSlang}：
tutorial.shaders.vertex.details: GPU 會針對每個輸入頂點叫用此進入點。它將齊次座標 {w} 加入位置並轉發色彩。在頂點階段之後，位置會除以 w；在此處該除法保持 x、y 與 z 不變。這就是為何上方選擇的位置可以直接理解為標準化裝置座標的原因。
tutorial.shaders.vertex.title: 定位每個頂點
tutorial.surface.description: 圖形上下文還需要知道要在何處顯示其輸出。在{emphasis}新增下列內容：
tutorial.surface.description.emphasis: "{windowCenter} 之後、{windowRun} 之前"
tutorial.surface.details: "{surface} 描述原生呈現目標及其像素尺寸。畫面緩衝區是與視窗關聯的像素影像。{framebufferSize} 以像素為單位提供其尺寸；啟用顯示比例縮放時，視窗的邏輯尺寸可能會有所不同。"
tutorial.surface.guidance: 此表面與上方選取的後端相符。Windows 提供視窗控制代碼，Linux 提供 X11 顯示與視窗，macOS 協助程式則提供附加的 Metal 圖層。這是將視窗連接至渲染流程中唯一與平台相關的部分。
tutorial.surface.title: 描述原生呈現目標
tutorial.swapChain.context: 交換鏈同時使用圖形上下文與原生視窗。將 {programCs} 底部的 {windowDispose} 行取代為以下清理順序：
tutorial.swapChain.description: 使用表面描述來建立將要呈現的影像。緊接在表面區塊之後新增：
tutorial.swapChain.details: "{swapChain} 管理視窗中顯示的影像。在每個影格中，{drawable} 會以影像資料 API 型別 {texture} 的形式為我們提供目前影像。繪製後，{present} 會要求顯示結果並前進至下一個 drawable。"
tutorial.swapChain.guidance: "{b8G8R8A8UNorm} 依藍、綠、紅與 Alpha 順序儲存四個 8 位元色彩通道。{uNorm} 表示 0 到 255 的整數值對應 0 到 1 的數值。著色器仍會傳回邏輯 RGBA 值；此格式決定這些通道在影像中的儲存方式。稍後圖形管線將使用 {swapChainDescFormat} 來匹配此附件。"
tutorial.swapChain.title: 建立交換鏈
tutorial.title: 第一個三角形
tutorial.troubleshooting.description: 先閱讀主控台中的任何錯誤，然後使用先前的檢查點來找出失敗的階段：
tutorial.troubleshooting.details: "使用 {link} 與 {detail} 來比較頂點資料、輸入配置與繪製操作。該範例將視窗處理與提交放入共用宿主程式；本教學則將應用程式流程保留在 {programCs} 中。請繼續閱讀 {context} 以學習索引繪製、變換與深度測試。"
tutorial.troubleshooting.details.context: 旋轉立方體
tutorial.troubleshooting.details.detail: Slang 著色器
tutorial.troubleshooting.details.link: 範例渲染器
tutorial.troubleshooting.table.backend.check: 檢查選取的後端是否受到裝置與已安裝的圖形驅動程式支援。
tutorial.troubleshooting.table.backend.symptom: 後端建立失敗
tutorial.troubleshooting.table.drawing.check: 檢查上傳大小、輸入配置、管線選取，以及渲染通道內部繪製命令的位置。
tutorial.troubleshooting.table.drawing.symptom: 背景出現但三角形未出現
tutorial.troubleshooting.table.headings.check: 檢查項目
tutorial.troubleshooting.table.headings.symptom: 徵狀
tutorial.troubleshooting.table.input.check: 檢查 28 位元組跨距以及 0 與 12 的位置／色彩位移。
tutorial.troubleshooting.table.input.symptom: 頂點位置或色彩損毀
tutorial.troubleshooting.table.shaders.check: 檢查複製的 {triangleSlang}、進入點拼寫，以及編譯器回報的診斷資訊。
tutorial.troubleshooting.table.shaders.symptom: 清除色彩步驟運作正常，但著色器載入失敗
tutorial.troubleshooting.table.window.check: 確認 .NET 專案可成功建置，且僅含視窗的步驟可在桌面工作階段中執行。在 Linux 上，檢查 X11 或 XWayland 是否可用。
tutorial.troubleshooting.table.window.symptom: 沒有開啟任何視窗
tutorial.troubleshooting.title: 檢查失敗的階段
tutorial.window.context: "{usingZenithTutorials} 會匯入協助程式的命名空間。每個 C# 檔案都使用各自的一般 using 指示詞，因此兩個檔案都需要互通性匯入。別名 {buffer} 是指 Zenith.NET 緩衝區型別，並將其與 {systemBuffer} 區分開來。"
tutorial.window.description: 將 {cocoaHelperCs} 新增至專案，並保留其命名空間。在該檔案頂端、其命名空間宣告之前新增 {interopUsing}。該協助程式會在 macOS 上將 Metal 圖層附加至視窗；其他平台分支不會呼叫它。
tutorial.window.details: 將產生的 {programCs} 取代為下列程式碼。它使用最上層陳述式，依序執行而無需明確的 {main} 方法。後續小節將說明在此同一個檔案中新增程式碼的位置：
tutorial.window.guidance: "{graphicsAPINone} 要求 Silk.NET 建立沒有自身圖形上下文的視窗。我們將使用 Zenith.NET 建立該上下文。{initialize} 建立原生視窗並提供其控制代碼。控制代碼是由視窗系統提供的識別碼。{center} 使視窗置中，而 {run} 會處理事件直到視窗關閉。接著執行會繼續進行至 {dispose}，釋放視窗。"
tutorial.window.notes: 執行 {dotnetRun}。應該會開啟一個空白視窗，並能回應移動、調整大小與關閉操作。由於我們尚未提交任何渲染命令，其內容尚未定義。請先將其關閉再繼續。
tutorial.window.title: 開啟視窗
