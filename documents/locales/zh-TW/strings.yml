concepts.shaders.binding.table.textureSampledHandle.access: 讀取紋理。
concepts.shaders.binding.table.textureStorageHandle.access: 讀取或寫入儲存紋理。
concepts.shaders.binding.title: 繫結常數緩衝區及其描述的資源
concepts.shaders.compilation.description: "{zenithCompiler} 會編譯具名的 Slang 進入點並傳回 {shaderDesc}。使用上下文的 {graphicsApi}，讓結果以將建立著色器的後端為目標：DirectX 12 的 DXIL、Metal 的 Metal 程式庫，或 Vulkan 的 SPIR-V。"
concepts.shaders.compilation.details: 例如，在已有 {context} 且三角形著色器已複製到可執行檔旁的情況下：
concepts.shaders.compilation.guidance: "{vSMain} 必須與著色器檔案中的進入點名稱完全相符。在建立管線期間維持著色器物件有效，接著在管線建立完成後予以處置，如 {link} 所示。請執行一次此初始化，而非在每個影格中重新編譯。"
concepts.shaders.compilation.guidance.link: 第一個三角形
concepts.shaders.compilation.title: 為選取的上下文編譯進入點
concepts.shaders.description: "著色器接收應用程式提供的資料。頂點屬性描述個別頂點；緩衝區保存參數或陣列；資源控制代碼識別著色器將存取的其他資源。C# 宣告與 Slang 宣告必須在這些數值的意義上達成共識。僅比對欄位名稱是不夠的：配置、資源存取與繫結皆必須相符。"
concepts.shaders.dispatch.description: "{dispatch} 接收執行緒群組的數目。計算範例的 {numthreads} 進入點每組執行 16 × 16 個執行緒。將影像尺寸除以 16 並無條件進位即可找出群組計數。例如，17 × 19 的影像需要 2 × 2 組。著色器會比對其像素座標與影像尺寸，因為最後的群組可能包含位於影像外部的執行緒。"
concepts.shaders.dispatch.details: 編譯器將進入點宣告的群組大小儲存在 {shaderDescThreadGroupSize} 中；它不會將提供給 {dispatch} 的像素尺寸轉換為群組計數。完整的繫結與分派範例請結合使用 {computeShaderRendererCs} 及其著色器，並在另一個通道取用輸出前參閱 {link}。
concepts.shaders.dispatch.details.link: 同步
concepts.shaders.dispatch.title: 分派執行緒群組，而非像素
concepts.shaders.layout.context: "{link}明確指出了它們的位移。此宣告的作用範圍需要 {systemRuntimeInteropServices} 與 {zenithNET}："
concepts.shaders.layout.context.link: "計算範例的 C# 常數"
concepts.shaders.layout.description: "對於頂點輸入，管線的 {inputLayout} 描述了格式、位移、跨距與語意。三角形的 {float3} 位置加上隨後的 {float4} 色彩共佔用 28 位元組，色彩位於位元組 12 處。{inputLayoutAdd} 會計算此緊密配置；它不會檢查 C# 結構。如果 C# 欄位包含填補，請提供相符的配置，而不要假設欄位是緊密排列的。"
concepts.shaders.layout.details: "常數緩衝區保存著色器參數，而結構化緩衝區保存宣告型別的元素陣列。兩者皆依據其 Slang 宣告進行讀取。它們不使用 {inputLayout}。請檢查編譯後著色器表示法的欄位位移與元素大小（包含填補）。非受控 C# 型別適合以位元組形式複製，但這本身無法證明它與著色器型別相符。特別是，請勿將頂點緊密排列的 {float3} 配置套用至每個著色器緩衝區。"
concepts.shaders.layout.guidance: 資源控制代碼是參照現有資源的小型數值。將控制代碼複製至常數緩衝區並不會複製資源的內容。
concepts.shaders.layout.notes: "{computeShaderSlang} 中的對應宣告為："
concepts.shaders.layout.reference: "尺寸佔用前八個位元組，後隨兩個八位元組的資源控制代碼。C# 範例總共保留了 256 位元組。該大小是範例選擇的儲存大小，而非所有 Slang 結構或常數裝載皆佔用 256 位元組的規則。填補總大小也無法修正位於錯誤位移處的欄位。"
concepts.shaders.layout.title: 頂點輸入與著色器資料具有不同的配置規則
concepts.shaders.matrices.description: 編譯器要求列優先（row-major）矩陣儲存，這會將每列的元素一起儲存。{link}將三個 {matrix4x4} 數值放置於位移 0、64 與 128 處。其{detail}依模型、檢視與投影順序使用 {mulVectorMatrix}。
concepts.shaders.matrices.description.detail: 著色器
concepts.shaders.matrices.description.link: 旋轉立方體渲染器
concepts.shaders.matrices.details: 儲存順序決定矩陣元素如何佔用記憶體；乘法順序決定變換。請保持兩端一致。在未檢查這兩個選擇的情況下加入轉置可能會掩蓋一個不相符，同時引入另一個不相符。
concepts.shaders.matrices.title: 保持矩陣儲存與乘法順序一致
concepts.shaders.title: 著色器資料與繫結
concepts.synchronization.backends.description: DirectX 12 與 Vulkan 使用配置與存取資訊對紋理轉換進行編碼。Metal 在 Zenith.NET 的 {transition} 實作中沒有對應的操作。Metal 將記錄的工作分組為渲染與計算編碼器。後端在結束這些群組時插入可見度屏障，使先前的寫入可用於後續工作。明確的 {barrier} 呼叫處理相依性，例如同一個編碼器內連續的計算分派。
concepts.synchronization.backends.details: 變更工作負載時此差異至關重要。在{link}中，分派之後接續圖形渲染通道，這在 Metal 上也會建立編碼器邊界。兩個相依的計算分派不會僅透過變更紋理宣告的配置就建立該邊界。保留共用 API 所需的轉換，並單獨識別實際生產與取用命令之間的相依性。
concepts.synchronization.backends.details.link: 計算範例
concepts.synchronization.backends.title: 轉換在每個後端並非完全相同
concepts.synchronization.barriers.context: "{barrierStagesAll} 是較廣泛的範圍，而非自動相依性偵測器。選取實際涵蓋工作的階段，並僅在支援這些操作的佇列上使用它們。"
concepts.synchronization.barriers.description: 考慮兩個計算分派：第一個寫入模擬資料，第二個讀取該資料以執行下一步。兩者皆使用儲存緩衝區，因此沒有要變更的紋理配置。在命令緩衝區中的分派之間插入此內容：
concepts.synchronization.barriers.details: 第一個引數識別生產階段，第二個引數識別取用階段。屏障在 GPU 上建立對應的執行與記憶體相依性。後端將這些階段轉譯為其執行與記憶體存取規則。此屏障不會變更紋理的配置，也不會等待裝置上的所有工作。
concepts.synchronization.barriers.guidance: "{link}在相依分派之間使用了此模式。在發生相依性的位置放置屏障。在取用者已經記錄之後放置屏障無法將該取用者排在較早的生產者之後。"
concepts.synchronization.barriers.guidance.link: FluidTank 模擬
concepts.synchronization.barriers.title: 以屏障為相依命令排序
concepts.synchronization.dependencies.description: 針對每個共用資源，識別首先存取它的操作、接續的操作，以及是否有任何存取進行寫入。兩次讀取相同資料不需要排序來保護其內容，儘管配置變更或呈現可能會施加其他需求。寫入後接續讀取、讀取後接續覆寫或兩次寫入皆可能需要建立相依性。
concepts.synchronization.dependencies.details: 接著依據這些操作執行的位置選擇機制：
concepts.synchronization.dependencies.guidance: 這些機制互相關聯，但不可互換。依序提交命令並不能取代每個記憶體相依性。佇列等待不會宣告新的紋理配置，命令屏障也不會在呼叫端的 CPU 執行緒上等待。
concepts.synchronization.dependencies.table.cpuAccess.mechanism: 針對相關完成值呼叫 {wait}。
concepts.synchronization.dependencies.table.cpuAccess.situation: CPU 在存取或釋放資料之前必須等待
concepts.synchronization.dependencies.table.crossQueue.mechanism: 將其 {timelineValue} 傳遞給取用端命令緩衝區的 {submit}。
concepts.synchronization.dependencies.table.crossQueue.situation: 另一個佇列上的提交產生了資料
concepts.synchronization.dependencies.table.headings.mechanism: 機制
concepts.synchronization.dependencies.table.headings.situation: 情況
concepts.synchronization.dependencies.table.layoutChange.mechanism: 帶有前一個與下一個配置的 {commandBufferTransition}。
concepts.synchronization.dependencies.table.layoutChange.situation: 紋理子資源變更其使用方式
concepts.synchronization.dependencies.table.pipelineStages.mechanism: 帶有生產者與取用者階段的 {commandBufferBarrier}。
concepts.synchronization.dependencies.table.pipelineStages.situation: 命令串流中相依的 GPU 階段
concepts.synchronization.dependencies.title: 從生產者與取用者開始著手
concepts.synchronization.description: 讀取先前命令寫入資料的命令，相依於這些寫入已完成且對其可見。寫入者為生產者（producer）；讀取者為取用者（consumer）。CPU 在讀取、覆寫或釋放共用資料之前也需要完成點。Zenith.NET 針對這些不同的相依性提供了屏障、紋理轉換與時間線。
concepts.synchronization.layouts.context: "{undefined} 代表不需要保留先前的內容。它適用於新影像或將被完全清除的附件。它不是用來避免追蹤需要載入、取樣或累加內容之影像配置的手段。"
concepts.synchronization.layouts.description: 用途旗標描述紋理支援的角色。{textureLayout} 描述特定操作將如何存取特定子資源。子資源是選取的 Mip 層級與陣列層。變更其配置是為該存取做好準備；它不會將紋理轉換為不同的像素格式。例如，計算範例在 {storage} 配置中寫入輸出紋理，接著在圖形通道中對其進行取樣。在這些使用之間，它記錄了：
concepts.synchronization.layouts.details: 此程式碼片段假設 {outputTexture} 是以 {sampledStorage} 用途建立的，且其選取的子資源處於 {storage} 配置。{default} 選取 Mip 層級 0 與陣列層 0。該操作不會轉換紋理的每個 Mip 或層。
concepts.synchronization.layouts.guidance: 應用程式提供先前的配置。{transition} 不會維護應用程式可見的配置追蹤器，也不會從先前的命令推斷該值。只要資源在渲染階段之間傳遞，即應追蹤其配置。
concepts.synchronization.layouts.title: 追蹤每個紋理子資源的配置
concepts.synchronization.readback.description: "{isCompleted} 僅查詢 GPU 時間線是否已達到某個值。它本身不會回收命令緩衝區，也不會將暫存的回讀資料複製至應用程式的目的地指標所指向的記憶體。"
concepts.synchronization.readback.details: "{commandBufferDownload} 首先記錄將資料複製至內部回讀儲存空間的命令。重設已完成的命令緩衝區以供重複使用時，才會由 CPU 將資料複製至提供的指標所指向的記憶體。在該次回讀提交的 {wait} 返回之前，目的地記憶體必須保持有效，受控記憶體必須保持釘選；返回後才能讀取資料或釋放記憶體。等待另一個佇列上的後續提交，本身不會輪詢回讀作業所屬的佇列。"
concepts.synchronization.readback.guidance: "因此，僅輪詢 {isCompleted} 後立即讀取非同步回讀的目的地記憶體並不足夠。{link}介紹了直接複製與透過暫存記憶體傳輸的路徑。"
concepts.synchronization.readback.guidance.link: 資源管理
concepts.synchronization.readback.title: GPU 完成與下載的 CPU 資料是不同的步驟
concepts.synchronization.reuse.description: 對於第一個渲染器，在每個影格之後立即等待最為直截了當。若要重疊工作，請為未決影格提供個別的可變資料，並保留每個影格最終用途的完成值。在更新常數緩衝區、取代紋理或處置管線之前，請完成對受影響資源的所有未決存取。
concepts.synchronization.reuse.details: 調整大小或關閉時，在等待舊工作之前請先停止新用途。{swapChainResize}、資源處置與上下文處置不能用作應用程式工作的通用等待。三角形教學可以在回呼之間安全地調整大小，因為每個先前的影格都已完成其提交。
concepts.synchronization.reuse.guidance: 目前的 {swapChainPresent} 在其呈現操作之後也會在圖形佇列上發出訊號並等待。因此，僅移除三角形明確的提交等待並不會自動建立起重疊的呈現迴圈。圖形佇列等待對仍在另一個佇列上執行的獨立工作也毫無作用。
concepts.synchronization.reuse.title: 僅在最後存取後重複使用資料
concepts.synchronization.timelines.context: 在 CPU 讀取、覆寫或釋放這些資源之前，請等待其最後一次使用：
concepts.synchronization.timelines.description: 時間線使用遞增的數值追蹤佇列上的完成進度。{submit} 傳回包含該時間線與提交關聯數值的 {timelineValue}。來自不同時間線的完成值不能僅透過其數值 {value} 欄位進行比較。
concepts.synchronization.timelines.details: 假設 {producer} 與 {consumer} 是來自相同上下文之兩個佇列中已記錄的命令緩衝區。生產者寫入取用者使用的資料。像這樣提交它們：
concepts.synchronization.timelines.guidance: 傳遞產生的數值會使取用佇列在 GPU 上等待該數值。CPU 在此處不呼叫 {producedWait}。在 {consumed} 完成之前保持共用資源有效，並記錄取用者所需的任何紋理配置變更。
concepts.synchronization.timelines.notes: "{wait} 等待該時間線值，接著檢查其所屬佇列中已完成的提交。完成的命令緩衝區會重設以供重複使用，其中暫存的回讀資料會複製至提供的 CPU 目的地。{queueTimelineSignal} 也可以在已提交至該佇列的工作之後排入完成點。呼叫 {signal} 不代表 GPU 已經到達該點。"
concepts.synchronization.timelines.title: 使用時間線進行完成通知與佇列交接
concepts.synchronization.title: 同步
