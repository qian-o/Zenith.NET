concepts.resources.bufferUsages.table.indirect.role: "間接繪製或分派命令讀取的引數。"
concepts.resources.bufferUsages.table.none.role: "未宣告任何緩衝區用途旗標。"
concepts.resources.bufferUsages.table.storageReadOnly.role: "透過唯讀著色器繫結存取的緩衝區資料。"
concepts.resources.bufferUsages.table.storageReadWrite.role: "透過讀寫著色器繫結存取的緩衝區資料。"
concepts.resources.bufferUsages.table.transferDst.role: "GPU 複製作業的目的地儲存空間。"
concepts.resources.bufferUsages.table.transferSrc.role: "GPU 複製作業的來源資料。"
concepts.resources.bufferUsages.table.vertex.role: 為繪製擷取的頂點屬性。
concepts.resources.bufferUsages.title: 緩衝區用途
concepts.resources.description: "依據將要使用資源的作業選擇資源描述。如果一個紋理既要接收渲染結果，又要供著色器取樣，還要回讀至 CPU，就需要宣告這三種用途，並處理作業之間的同步。記憶體放置位置與資源生命週期則是另外需要考慮的問題。"
concepts.resources.memory.context: 對於 CPU 可存取的緩衝區，{map} 會提供位址給 CPU。它不會等待 GPU 停止存取相同的位元組。{unmap} 同樣不會提交工作或等待完成。在覆寫 CPU 可寫入資料之前，請先完成仍需要其舊內容的 GPU 讀取。
concepts.resources.memory.description: "{bufferDesc} 具有 {residency} 欄位。請依據 CPU 與 GPU 將如何存取資料來選擇："
concepts.resources.memory.details: 記憶體駐留描述對配置預期的 CPU 存取。它並不代表每部裝置皆具有實體獨立的 CPU 與 GPU 記憶體。三角形教學使用 {cpuWriteOnly} 直接初始化小型頂點緩衝區。大型靜態網格則可改為從單次上傳的僅 GPU 儲存空間中獲益。
concepts.resources.memory.guidance: "{textureDesc} 沒有記憶體駐留欄位。由圖形上下文建立的一般紋理使用 GPU 儲存空間。其公用 API 提供上傳與回讀作業來傳輸 CPU 資料，但不提供直接對應記憶體的方法。明確指定的堆積提供記憶體放置控制，下文將介紹。"
concepts.resources.memory.table.cpuReadOnly.cPUAccess: "在 GPU 複製完成後讀取對應的記憶體。"
concepts.resources.memory.table.cpuReadOnly.typicalRole: "GPU 產生的回讀資料"
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: "在先前的 GPU 讀取完成後寫入對應的記憶體。"
concepts.resources.memory.table.cpuWriteOnly.typicalRole: "CPU 提供或更新的資料"
concepts.resources.memory.table.gpuOnly.cPUAccess: "透過上傳緩衝區或回讀緩衝區傳輸位元組。"
concepts.resources.memory.table.gpuOnly.typicalRole: "靜態幾何體與 GPU 工作資料"
concepts.resources.memory.table.headings.cPUAccess: CPU 存取
concepts.resources.memory.table.headings.residency: 記憶體駐留
concepts.resources.memory.table.headings.typicalRole: "典型用途"
concepts.resources.memory.title: "依所需的 CPU 存取方式選擇記憶體"
concepts.resources.textureUsages.description: "傳輸用途旗標描述 GPU 複製的方向。CPU 存取則是另一項記憶體放置選擇，下文將介紹。"
concepts.resources.textureUsages.details: "組合用途旗標只是宣告多個作用，不會執行對應作業，也不會安排存取順序。紋理仍然需要適當的{link}，而且其格式必須在所選裝置上支援要求的用途。"
concepts.resources.textureUsages.details.link: "配置與同步"
concepts.resources.textureUsages.table.colorAttachment.role: "渲染通道中的色彩附件。"
concepts.resources.textureUsages.table.depthStencilAttachment.role: "渲染通道中的深度／樣板附件。"
concepts.resources.textureUsages.table.headings.role: "作用"
concepts.resources.textureUsages.table.headings.usage: 用途
concepts.resources.textureUsages.table.none.role: "未宣告任何紋理用途旗標。"
concepts.resources.textureUsages.table.sampled.role: "透過取樣紋理繫結讀取的紋理資料。"
concepts.resources.textureUsages.table.storage.role: "透過儲存紋理繫結供著色器讀取或寫入的紋理資料。"
concepts.resources.textureUsages.table.transferDst.role: "GPU 複製作業的目的地影像儲存空間。"
concepts.resources.textureUsages.table.transferSrc.role: "GPU 複製作業的來源影像資料。"
concepts.resources.textureUsages.title: 紋理用途
concepts.resources.title: 資源管理
concepts.resources.transfers.context: "回讀作業會記錄一條將 GPU 資料複製至內部回讀儲存空間的命令。當程式庫重設已完成的命令緩衝區以供重複使用時，才會將這些位元組複製至提供的 CPU 目的地。在該提交完成值的 {wait} 返回之前，目的地記憶體必須保持已配置狀態，受控記憶體也必須保持釘選。"
concepts.resources.transfers.description: "上傳將 CPU 資料複製至 GPU 資源，回讀將資源資料複製回 CPU 記憶體。資源本身提供的方法會在返回前完成該次傳輸："
concepts.resources.transfers.details: "這些等待只涵蓋方法本身提交的傳輸。它們不會發現另一個佇列上既有讀寫作業對該資源的相依性。呼叫資源本身的傳輸方法前，應先建立這些相依性。直接透過對應記憶體複製資料時，也需要呼叫端確保相關 GPU 工作已完成。"
concepts.resources.transfers.guidance: 當複製作業應與其他工作一起記錄時，請使用 {commandBufferUpload} 或 {commandBufferDownload}。其指標生命週期各有不同：
concepts.resources.transfers.item: "上傳會在呼叫期間將 CPU 來源資料複製至內部上傳緩衝區，也稱暫存記憶體。來源指標只需在該次呼叫期間保持有效。"
concepts.resources.transfers.notes: "對於紋理，列跨距是 CPU 資料相鄰兩列之間的位元組距離，切片跨距是相鄰深度切片之間的位元組距離。它們並不代表紋理內部的 GPU 記憶體配置。有關工作完成與資料回讀的區別，請參閱{link}。"
concepts.resources.transfers.notes.link: 同步
concepts.resources.transfers.table.bufferDownload.transfer: 針對 {cpuReadOnly} 進行直接 CPU 複製；否則在傳輸佇列上提交下載並等待。
concepts.resources.transfers.table.bufferUpload.transfer: 針對 {cpuWriteOnly} 進行直接 CPU 複製；否則在傳輸佇列上提交上傳並等待。
concepts.resources.transfers.table.headings.method: 方法
concepts.resources.transfers.table.headings.transfer: "資料傳輸方式"
concepts.resources.transfers.table.textureTransfers.method: "{textureUpload} / {textureDownload}"
concepts.resources.transfers.table.textureTransfers.transfer: "使用圖形佇列，將所選子資源轉換為複製所需的配置，完成複製後轉換為要求的最終配置，並等待傳輸完成。"
concepts.resources.transfers.title: "選擇立即完成的傳輸或隨命令記錄的傳輸"
concepts.resources.usages.description: "{bufferUsages} 與 {textureUsages} 是宣告資源預期角色的旗標列舉。它們分別指派給 {bufferDescUsages} 與 {textureDescUsages}。當資源具有多個角色時，旗標列舉允許使用 {value} 組合多個成員。"
concepts.resources.usages.title: 在建立資源之前宣告所需的用途
concepts.resources.views.description: "{bufferView} 描述緩衝區區域及其解譯方式。{textureView} 選取相容的紋理型別、格式與子資源範圍。檢視共用底層儲存空間，不會複製資料，也不會新增建立資源時遺漏的用途。指定檢視範圍也不代表各後端都會進行著色器邊界檢查。"
concepts.resources.views.details: "預設檢視可以直接使用資源本身的控制代碼；若需要不同區域或相容的解譯方式，則建立檢視。在 GPU 工作可能使用檢視及其底層資源期間，應保留兩者的 C# 參考；僅有資源控制代碼並不能維持任一物件存活。只有在最後一次 GPU 使用完成後才能釋放它們。取代其中任一物件後，還應更新包含其舊{link}的常數。"
concepts.resources.views.details.link: "資源控制代碼"
concepts.resources.views.guidance: "{link}展示了在調整大小時取代深度紋理。{detail}展示了輸入紋理與其可寫入輸出分開保持。兩者都讓資源的生命週期遵循實際使用它的工作。"
concepts.resources.views.guidance.detail: 計算範例
concepts.resources.views.guidance.link: 旋轉立方體渲染器
concepts.resources.views.title: "讓檢視及其底層資源在使用期間保持有效"
concepts.shaders.binding.context: 在計算範例中，{input} 會填入 {inputTextureSampledHandle}，而 {output} 會填入 {outputTextureStorageHandle}。Slang 的具型別 {descriptorHandle} 指示著色器如何存取各個資源：
concepts.shaders.binding.description: "{setConstantBuffer} 為目前管線的常數資料繫結緩衝區與位元組位移。它繫結現有的 GPU 可見儲存空間；它不會上傳 C# 數值。請先填入緩衝區，並在覆寫其位元組之前確保先前的 GPU 讀取者已完成。"
concepts.shaders.binding.details: 在設定常數緩衝區之前先設定管線。對於已建立並上傳資源的計算工作負載，記錄使用此順序：
concepts.shaders.binding.guidance: 此程式碼片段假設存在記錄中的 {commandBuffer}、{computePipeline}、具有 {bufferUsagesConstant} 用途的已上傳 {constantBuffer}，以及工作負載的執行緒群組計數。位移 0 繫結緩衝區的起始處。如果多個常數資料記錄共用一個緩衝區，則每個記錄的起始位移必須符合後端的繫結對齊需求。該需求與記錄內部的欄位配置分開獨立。
concepts.shaders.binding.notes: "{resourceHandle} 儲存兩個 32 位元欄位，但其解譯歸後端所有。請勿將其視為通用描述項索引、位址或可在上下文之間傳遞的數值。控制代碼不會建立資源、不會新增遺漏的用途，也不會執行同步。"
concepts.shaders.binding.reference: 保留對資源及用於取得其控制代碼之任何檢視的參考，並僅在著色器的最後一次使用完成後處置它們。取代紋理或檢視時，更新包含其舊控制代碼的常數。{link}解釋了該生命週期關係。
concepts.shaders.binding.reference.link: 資源管理
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: 讀取著色器型別 {t} 的結構化元素。
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: 讀取或寫入著色器型別 {t} 的結構化元素。
