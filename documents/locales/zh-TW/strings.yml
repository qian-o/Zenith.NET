samples.computeShader.description: 透過計算分派將影像轉換為灰階並顯示產生的紋理。展示了用於取樣輸入紋理與可寫入輸出紋理的資源控制代碼、無條件進位的執行緒群組計數，以及著色器內部的邊界檢查。請保留隨附的 {assetsTexturesShokoPng} 資產；渲染器會處理一次並在後續影格中呈現結果。
