concepts.execution.ownership.table.queues.ownership: '由上下文和佇列管理。'
concepts.execution.ownership.table.swapChainDrawable.ownership: '由交換鏈管理。'
concepts.execution.ownership.title: '所有權與生命週期'
concepts.execution.pipelines.description: '圖形管線規定繪製所用的著色器、頂點輸入佈局、圖元組裝方式、附件格式和渲染狀態。繫結頂點、索引或常數資料之前，須先選擇管線；管線宣告的附件格式與取樣數也必須與渲染通道一致。'
concepts.execution.pipelines.details: '計算管線選擇分派所執行的著色器進入點。在圖形渲染通道之外，先繫結管線及其常數，再執行分派。'
concepts.execution.pipelines.guidance: '{link}給出了完整的圖形命令順序。{detail}則先執行計算分派，再透過圖形通道顯示結果。'
concepts.execution.pipelines.guidance.detail: '計算範例'
concepts.execution.pipelines.guidance.link: '三角形的渲染回呼'
concepts.execution.pipelines.title: '管線狀態'
concepts.execution.queues.description: '一個影格同時包含繪製、計算與複製時，通常從 {graphicsQueue} 開始。將彼此相依的操作放在同一佇列，能簡化順序管理。'
concepts.execution.queues.details: '增加佇列有助於讓獨立的工作負載重疊執行，但佇列未必對應獨立的硬體引擎。一個佇列要使用另一個佇列寫入的資料時，應在兩次提交之間建立明確的相依關係。'
concepts.execution.queues.guidance: '即使位於同一佇列，彼此相依的操作也可能需要屏障或紋理轉換，讓後續存取讀到先前寫入的結果。這種記憶體相依關係與提交順序不同，具體指定方式見{link}。'
concepts.execution.queues.guidance.link: '同步'
concepts.execution.queues.table.computeQueue.workToRecord: '計算分派與相容的傳輸工作，不包含圖形渲染通道。'
concepts.execution.queues.table.graphicsQueue.workToRecord: '渲染通道、繪製、計算與傳輸操作。'
concepts.execution.queues.table.headings.queue: '佇列'
concepts.execution.queues.table.headings.workToRecord: '支援的工作'
concepts.execution.queues.table.transferQueue.workToRecord: '上傳、回讀與複製工作，不包含繪製或計算分派。'
concepts.execution.queues.title: '佇列選擇'
concepts.execution.recording.context: '佇列會回收已完成的命令緩衝區以供重複使用。每次記錄時，透過 {queueCommandBuffer} 取得緩衝區，同一時間只由一個執行緒記錄，而且只提交一次。提交後交由佇列管理，不再修改、重複提交或自行釋放。'
concepts.execution.recording.description: '{queueCommandBuffer} 傳回的 {commandBuffer} 已開始記錄。完成操作及其相依關係的記錄後，呼叫一次 {submit}，結束記錄並提交命令。傳回的 {timelineValue} 識別這次提交在佇列上的完成點。'
concepts.execution.recording.details: '三角形教學將一個影格記錄到 {commandBuffer} 後，按如下方式提交並等待完成：'
concepts.execution.recording.guidance: '記錄會建立命令序列，{submit} 則安排該序列執行。接著呼叫 {wait}，CPU 執行緒便會等待這次提交完成。教學因此採用逐影格執行的流程：目前影格完成後，才開始下一個影格。'
concepts.execution.recording.title: '記錄與提交'
concepts.execution.title: '執行模型'
concepts.platforms.description: '呈現流程可以由應用程式管理，也可以交給 UI 渲染控制項。這決定了誰來取得目前影格的輸出紋理、記錄與提交命令，以及顯示渲染結果。'
concepts.platforms.frame.context: '在通道內繫結管線並記錄繪製命令，處理程式返回前須結束通道。處理程式不可自行提交命令緩衝區，也不可釋放傳入的命令緩衝區或輸出紋理。若改變了輸出紋理的佈局，返回前須恢復為 {colorAttachment}，讓控制項能完成最後的轉換。'
concepts.platforms.frame.description: '各控制項實作 {iZenithView} 介面。應用程式設定 {graphicsContext}，在 {updateRequested} 中更新場景，並在 {renderRequested} 中透過傳入的 {renderEventArgs} 記錄命令。'
concepts.platforms.frame.details: '每個影格中，控制項會取得輸出紋理與命令緩衝區，將輸出紋理轉換為 {colorAttachment}，再呼叫更新和渲染處理程式。之後，控制項提交已記錄的工作，並透過對應框架的呈現機制顯示影像。'
concepts.platforms.frame.guidance: '先在檔案中加入 {usingZenithNET}。假定名為 {view} 的 {iZenithView} 執行個體已初始化，且已設定圖形上下文，可註冊以下處理程式來清除其輸出紋理：'
concepts.platforms.frame.notes: '初始轉換使用 {undefined}，允許丟棄先前影像的內容。因此，每個影格都應重新繪製或清除整張影像。需要累積或快取的渲染結果，可儲存在應用程式擁有的紋理中，再將該紋理繪製到控制項的輸出紋理上。'
concepts.platforms.frame.title: '透過 UI 控制項渲染'
concepts.platforms.integration.context: 'WinForms、WPF 與 Windows 版 WinUI 整合在 Windows 上執行。使用 MAUI 時，安裝目標平台的工作負載，並透過 {useZenithView} 註冊控制項處理程式，具體見 {extensionsCs}。'
concepts.platforms.integration.description: '控制項共用事件介面，但呈現機制因框架而異：'
concepts.platforms.integration.details: 'UI 整合呈現 GPU 影像的方式各不相同。點陣圖回讀先將像素複製到 CPU 記憶體再顯示；共用紋理互通可省去這次複製，但仍可能需要 GPU 複製與同步。選擇整合方式時，應同時考量呈現路徑與共用的 {renderRequested} 事件。'
concepts.platforms.integration.table.avalonia.integration: 'Avalonia'
concepts.platforms.integration.table.avalonia.presentation: '渲染到紋理後，將像素回讀到 {writeableBitmap}，實作見 {zenithViewCs} 和 {surfaceCs}。'
concepts.platforms.integration.table.headings.integration: '整合'
concepts.platforms.integration.table.headings.presentation: '呈現機制'
concepts.platforms.integration.table.maui.integration: '.NET MAUI'
concepts.platforms.integration.table.maui.presentation: 'Android、iOS 和 Mac Catalyst 使用原生呈現目標；Windows 使用共用紋理合成，具體見{link}。'
concepts.platforms.integration.table.maui.presentation.link: '平台實作'
concepts.platforms.integration.table.uno.integration: 'Uno Platform'
concepts.platforms.integration.table.uno.presentation: '將像素回讀到 {writeableBitmap}，實作見 {zenithViewUnoCs}。'
concepts.platforms.integration.table.winForms.integration: 'WinForms'
concepts.platforms.integration.table.winForms.presentation: '為控制項的 {hWND} 建立 Zenith.NET 交換鏈，實作見 {zenithViewCs}。'
concepts.platforms.integration.table.winUI.integration: 'Windows 上的 WinUI'
concepts.platforms.integration.table.winUI.presentation: '渲染到匯入的共用 Direct3D 11 紋理，再複製到與 {swapChainPanel} 連線的合成交換鏈，具體見 {zenithViewWinUICs}。'
concepts.platforms.integration.table.wpf.integration: 'WPF'
concepts.platforms.integration.table.wpf.presentation: '匯入共用 Direct3D 11 紋理，再經 Direct3D 互通複製到由 {d3DImage} 顯示的表面，具體見 {surfaceCs}。'
concepts.platforms.integration.title: '框架與呈現路徑'
concepts.platforms.lifecycle.context: '建立配套附件時，使用渲染事件傳入的輸出紋理的 {descWidth}、{descHeight}、{descFormat} 與 {descSampleCount}。該紋理提供渲染目標的實際尺寸，不應依控制項的版面配置尺寸或顯示縮放比例推算。'
concepts.platforms.lifecycle.description: '交換鏈使用以像素計量的畫面緩衝區寬度與高度。啟用顯示縮放時，這些值可能不同於視窗的邏輯尺寸。任一尺寸為零時，暫停渲染與交換鏈尺寸調整。每個影格重新取得 {swapChainDrawable}：這張紋理由交換鏈管理，可能在呈現或調整大小後被替換。'
concepts.platforms.lifecycle.details: '畫面緩衝區尺寸改變時，先等待 GPU 完成對舊影像的存取，再呼叫 {swapChainResize}。替換原生呈現目標時，也應先等待這些存取結束，再將新的目標描述與控制代碼傳給 {swapChainRefresh}。結束程式時，先釋放交換鏈，再銷毀其原生呈現目標。'
concepts.platforms.lifecycle.guidance: '應用程式的深度紋理或離屏紋理若隨視窗尺寸改變，就需要在調整大小時重建，並更新包含其控制代碼的常數。只要附件格式與取樣數仍然相符，管線就可以繼續使用。{link}展示了如何調整紋理尺寸並保留管線。'
concepts.platforms.lifecycle.guidance.link: '旋轉立方體渲染器'
concepts.platforms.lifecycle.title: '交換鏈尺寸與生命週期'
concepts.platforms.ownership.description: '應用程式擁有所設定的上下文及其渲染資源，控制項擁有呈現資源。檢視的 {graphicsContext} 改變後，排程程式會為新上下文重建控制項資源。應用程式也須為該上下文重建自己的管線、緩衝區與紋理。'
concepts.platforms.ownership.details: '替換渲染資源前，先停止檢視的影格迴圈，並等待使用這些資源的 GPU 工作完成，再釋放舊資源。只有當所有檢視都已釋放該上下文對應的呈現資源，且應用程式透過它建立的資源也已全部釋放後，才能釋放上下文。'
concepts.platforms.ownership.guidance: '共用的 {frameSchedulerCs} 透過檢視的 UI 排程器執行影格處理程式。處理程式應專注於場景資料更新與命令記錄，其中耗時的 CPU 工作也會延遲介面回應。'
concepts.platforms.ownership.title: '應用程式與控制項的責任'
concepts.platforms.surface.description: '{link}使用 Silk.NET 建立視窗並處理事件。Zenith.NET 透過 {surface} 描述取得原生視窗控制代碼與尺寸，再據此建立 {swapChain}。作業系統視窗仍由應用程式負責管理。'
concepts.platforms.surface.description.link: '三角形教學'
concepts.platforms.surface.details: '原生控制代碼取決於圖形 API 與視窗系統。常見組合如下：'
concepts.platforms.surface.guidance: '{appCs} 中的範例宿主支援 Windows、macOS 與 X11。Linux 視窗提供 Xlib 控制代碼，因此在 Wayland 工作階段中需要 XWayland。原生 Wayland 應用程式則透過 {surfaceWayland} 提供顯示與表面的控制代碼。'
