tutorial.context.description: '{graphicsContext} 讓應用程式透過所選圖形 API 使用 GPU，並提供建立渲染資源的方法。'
tutorial.context.details: '在{emphasis}插入上下文初始化程式碼：'
tutorial.context.details.emphasis: 'using 指示詞之後、{iWindowWindow} 之前'
tutorial.context.guidance: '各分支為所用圖形 API 請求啟用驗證。處理程式會將透過 {validationMessage} 回報的診斷訊息輸出到主控台。'
tutorial.context.imports: '在 {programCs} 頂端加入以下 using 指示詞：'
tutorial.context.title: '圖形上下文'
tutorial.description: '本教學從空白的 .NET 主控台專案開始，逐步建立視窗，並在其中繪製一個彩色三角形。'
tutorial.details: '本教學分三個階段確認結果：空白視窗、單色背景，以及彩色三角形。每完成一個階段，先執行程式檢查畫面，再繼續下一步。'
tutorial.draw.context: '{draw} 的引數如下：'
tutorial.draw.description: '在 {windowRender} 回呼中，用以下命令替換 {addTheTriangleDrawCommandsHereLater}，位置保持在 {beginRenderPass} 與 {endRenderPass} 之間：'
tutorial.draw.details: '{setPipeline} 選擇著色器與渲染狀態。管線的輸入佈局決定如何讀取頂點資料，因此必須先設定管線，再繫結頂點緩衝區。'
tutorial.draw.guidance: '{setVertexBufferVertexBuffer} 從緩衝區的位元組位移 0 開始，將已上傳的頂點資料繫結到輸入槽 0，對應 {inputLayouts} 中唯一的項目。'
tutorial.draw.notes: '保留通道開始時的清除操作，讓三角形以外的區域也有確定的背景色。'
tutorial.draw.table.firstInstance.meaning: '執行個體編號從零開始。'
tutorial.draw.table.firstVertex.meaning: '從緩衝區中的第一個頂點開始。'
tutorial.draw.table.headings.argument: '引數'
tutorial.draw.table.headings.description: '值'
tutorial.draw.table.headings.meaning: '意義'
tutorial.draw.table.instanceCount.meaning: '繪製一個三角形執行個體。'
tutorial.draw.table.vertexCount.meaning: '讀取三個頂點。'
tutorial.draw.title: '繪製命令'
tutorial.execution.description: '建置並執行 {firstTriangle} 專案。'
tutorial.execution.details: '視窗中應出現一個三角形：上方為紅色，右下方為綠色，左下方為藍色，背景為深色。頂點色彩經過內插，在三角形內形成平滑的漸層。'
tutorial.execution.guidance: '調整視窗大小時，影像的像素尺寸會改變，頂點座標則維持不變。視口將這些座標對應到新的寬度與高度，因此改變視窗的寬高比會拉伸三角形。'
tutorial.execution.title: '執行應用程式'
tutorial.frame.commands.context: '{endRenderPass} 之後的第二次轉換讓輸出紋理進入可呈現的佈局。{submit} 結束記錄並提交命令緩衝區，{wait} 阻塞至本次提交完成，隨後 {present} 請求顯示渲染結果。'
tutorial.frame.commands.description: '渲染通道將寫入同一組附件的繪製操作放在一起。本通道使用交換鏈的輸出紋理接收色彩結果。{colorAttachmentClear} 指定以 RGBA 色彩初始化附件，並在通道結束時保留內容。{beginRenderPass} 依這些設定記錄通道的開始命令。'
tutorial.frame.commands.details: '集合中有一個色彩附件。{null} 表示此通道不使用深度／樣板附件。'
tutorial.frame.commands.guidance: '{beginRenderPass} 預設讓視口與裁剪區域覆蓋整個附件。視口將渲染座標映射為像素位置，裁剪區域則限制繪製可寫入的像素範圍。'
tutorial.frame.commands.title: '清除、提交與呈現'
tutorial.frame.description: '先用一種背景色填滿視窗，這稱為清除。若色彩正常顯示，表示命令提交與畫面呈現已生效。接著再加入三角形的頂點與著色器。'
tutorial.frame.details: 'Silk.NET 在需要繪製一個影格時呼叫渲染回呼。在{emphasis}註冊回呼：'
tutorial.frame.details.emphasis: '{windowRun} 之前'
tutorial.frame.target.description: '命令佇列接收已記錄的工作，交由 GPU 執行。{graphicsQueueCommandBuffer} 從圖形佇列取得已開始記錄的命令緩衝區。記錄描述 GPU 要執行的工作，提交後才開始執行。'
tutorial.frame.target.details: '紋理佈局描述操作如何存取紋理。第一次 {transition} 讓輸出紋理準備好作為色彩附件。這裡的 {default} 選擇 mip 級別 0 與陣列層 0，也就是輸出紋理的基本子資源。由於這個通道會清除整張影像，可以指定 {undefined}，允許丟棄先前內容。'
tutorial.frame.target.guidance: '呈現後可能換用另一張影像，因此每個影格都要重新取得目前的輸出紋理。'
tutorial.frame.target.title: '準備輸出紋理'
tutorial.frame.title: '第一個影格'
tutorial.geometry.data.description: '在{emphasis}新增頂點陣列。後續資源初始化也放在該回呼之前，順序如下。'
tutorial.geometry.data.description.emphasis: '{windowRender} 之前'
tutorial.geometry.data.details: '三個位置分別構成三角形的上角、右下角和左下角。本例中，x、y 在影像內的範圍都是 -1 到 +1：0 對應中心，x 的正方向向右，y 的正方向向上。'
tutorial.geometry.data.guidance: '每個色彩包含紅、綠、藍與 alpha 分量，alpha 設為 1。三個頂點的 z 座標均為 0，位於同一平面。'
tutorial.geometry.data.title: '頂點位置與色彩'
tutorial.geometry.description: '三角形的每個頂點都有位置與色彩。GPU 依三個位置決定三角形的形狀，再對頂點色彩內插，算出內部各處的色彩。'
tutorial.geometry.format.description: '在{emphasis}追加頂點宣告：'
tutorial.geometry.format.description.emphasis: '{programCs} 的結尾處、清理陳述式之後'
tutorial.geometry.format.details: '{layoutKindSequential} 保留欄位的宣告順序。{position} 包含三個 32 位元浮點數，位元組位移為 0；{color} 包含四個，位元組位移為 12。因此，每個頂點占 28 位元組。輸入佈局會描述這個排列，讓 GPU 正確讀取各欄位。'
tutorial.geometry.format.imports: '在 {programCs} 頂端加入以下 using 指示詞，以使用向量型別與結構佈局屬性：'
tutorial.geometry.format.title: '頂點表示'
tutorial.geometry.title: '頂點資料'
tutorial.geometry.upload.context: '{fixed} 可避免記憶體回收行程在位址使用期間移動陣列。對於這個 CPU 可寫緩衝區，{upload} 會映射記憶體、複製資料，再解除映射後返回，因此只需在呼叫期間固定陣列。頂點資料在初始化時上傳一次即可；緩衝區則必須保留到渲染結束。'
tutorial.geometry.upload.description: '將頂點存入 {buffer}，供 GPU 在繪製時讀取。緊接在頂點陣列之後，加入配置與上傳程式碼：'
tutorial.geometry.upload.details: '配置大小為 {sizeofVertexVerticesLength}，即三個 28 位元組頂點，共 84 位元組。{bufferUsagesVertex} 宣告頂點輸入用途，{cpuWriteOnly} 允許 CPU 直接初始化。描述中的跨距記錄元素大小，隨後定義的輸入佈局指定 GPU 如何讀取各個頂點屬性。'
tutorial.geometry.upload.guidance: '配置空間不會初始化緩衝區內容。{upload} 使用資料描述中的來源指標與位元組數，將陣列複製到目標位元組位移 0。'
tutorial.geometry.upload.imports: '在 {programCs} 頂端的 using 指示詞中加入 {bufferAlias}，以區分 Zenith.NET 的緩衝區型別與 {systemBuffer}。'
tutorial.geometry.upload.notes: '在 {programCs} 結尾的清理程式碼中，緊接在 {swapChainDispose} 之前加入 {vertexBufferDispose}。'
tutorial.geometry.upload.title: '緩衝區配置與上傳'
tutorial.input.description: 'GPU 需要知道位置、色彩等頂點屬性儲存在哪裡。輸入佈局指定各屬性的格式與位元組位移，並以跨距表示兩個相鄰頂點相隔多少位元組。在建立著色器之後加入以下程式碼：'
tutorial.input.details: '{inputLayoutAdd} 將屬性依序排列，並將每個屬性的大小加到跨距中。位移是根據這裡提供的格式計算，不是透過檢查 C# 結構取得。這兩個欄位的佈局如下：'
tutorial.input.guidance: '{semanticIndex} 預設為 0，對應著色器中的 {pOSITION0} 與 {cOLOR0}。位置與色彩存放在同一個頂點緩衝區，因此管線只需在槽 0 使用一個輸入佈局。若 C# 結構的欄位順序或填充改變，也要一併調整此佈局。'
tutorial.input.table.headings.byteOffset: '位元組位移'
tutorial.input.table.headings.cField: 'C# 欄位'
tutorial.input.table.headings.format: '格式'
tutorial.input.table.headings.shaderInput: '著色器輸入'
tutorial.input.table.nextVertex.cField: '下一個頂點'
tutorial.input.table.nextVertex.format: '總跨距：28 位元組'
tutorial.input.table.nextVertex.shaderInput: '下一筆輸入記錄'
tutorial.input.table.vertexColor.format: '{float4}（16 位元組）'
tutorial.input.table.vertexPosition.format: '{float3}（12 位元組）'
tutorial.input.title: '頂點輸入佈局'
tutorial.lifecycle.description: '每個影格取得目前的輸出紋理，將其轉換至渲染所需的佈局，清除背景並繪製三角形；再轉換至呈現佈局，提交命令、等待完成並呈現。'
tutorial.lifecycle.details: '關閉視窗後，{run} 返回，程式繼續執行清理程式碼。渲染回呼已等待每個影格提交的工作完成，因此現在可以釋放這些命令使用的資源。{windowRun} 之後完整的清理程式碼如下：'
tutorial.lifecycle.guidance: '先釋放交換鏈，再銷毀其原生視窗；先釋放應用程式資源，再釋放上下文。已提交的命令緩衝區由佇列回收，輸出紋理由交換鏈管理，兩者都不需要單獨呼叫 {dispose}。'
tutorial.pipeline.behavior: '在輸入佈局之後建立管線：'
tutorial.pipeline.context: '{cullNone} 關閉面剔除，因此無論頂點在畫面中呈順時針或逆時針排列，三角形都會被繪製。'
tutorial.pipeline.description: '{graphicsPipeline} 將頂點佈局、兩個著色器，以及圖元組裝和附件輸出所需的設定組合在一起。'
tutorial.pipeline.guidance: '管線色彩格式必須匹配渲染通道附件，因此直接取自 {swapChainDescFormat}。{count1} 表示每像素一個取樣點。'
tutorial.pipeline.item: '{triangleList} 將每組連續的三個頂點組裝成一個三角形。'
tutorial.pipeline.notes: '{depthNone} 關閉深度測試和深度寫入，與通道沒有深度附件的設定一致。'
tutorial.pipeline.reference: '{opaque} 關閉混合，因此片元著色器輸出直接替換三角形內部的背景色。'
tutorial.pipeline.title: '圖形管線'
tutorial.pipeline.usage: '管線建立完成後即可釋放著色器物件。渲染期間保留管線，在清理程式碼中將 {pipelineDispose} 放在 {vertexBufferDispose} 之前。'
tutorial.presentation.title: '圖形上下文與呈現'
tutorial.project.context: '在專案建置設定中啟用{emphasis}（{allowUnsafeBlocks}）。視窗輔助類別中的原生呼叫和頂點上傳需要不安全程式碼。'
tutorial.project.context.emphasis: '允許不安全的程式碼'
tutorial.project.description: '建立名為 {firstTriangle} 的 C# 主控台專案，目標框架設為 .NET 10。'
tutorial.project.details: '為專案加入以下 NuGet 套件：'
tutorial.project.guidance: '{zenithNET} 提供共用的圖形與計算 API，三個圖形 API 套件分別實作它。{zenithNETCompiler} 為所選 API 編譯 Slang 著色器。'
tutorial.project.title: '專案設定'
tutorial.requirements.description: '需要 {emphasis} 與基本 C# 知識。所用 GPU 與驅動程式還須具備下表中的圖形能力：'
tutorial.requirements.description.emphasis: '.NET 10 SDK'
tutorial.requirements.guidance: 'Zenith.NET 渲染到應用程式提供的原生呈現目標。Silk.NET.Windowing 建立視窗並處理事件。'
tutorial.requirements.table.headings.graphicsBackend: '圖形能力'
tutorial.requirements.table.headings.platform: '平台'
tutorial.requirements.table.linux.graphicsBackend: 'Vulkan 1.4 與 VK_EXT_descriptor_heap'
tutorial.requirements.table.linux.platform: 'Linux（X11 或 XWayland）'
tutorial.requirements.table.macOS.graphicsBackend: 'Metal 4'
tutorial.requirements.table.macOS.platform: 'macOS'
tutorial.requirements.table.windows.graphicsBackend: 'DirectX 12 與 Shader Model 6.6'
tutorial.requirements.table.windows.platform: 'Windows'
tutorial.requirements.title: '準備事項'
tutorial.resize.context: '再次建置並執行程式。調整視窗大小後，背景應繼續填滿整個視窗。保留渲染回呼，稍後將在這個通道內繪製三角形。'
tutorial.resize.description: '畫面緩衝區尺寸改變時，交換鏈也要跟著調整。在渲染回呼之後、{windowRun} 之前註冊 {framebufferResize} 回呼：'
tutorial.resize.details: '這裡接收的是以像素為單位的{link}，而不是視窗邏輯尺寸的變化。視窗最小化時，畫面緩衝區的寬度或高度可能變成零。此時，尺寸變更回呼保留現有交換鏈，不進行調整。渲染回呼也會在任一尺寸為零時直接返回，直到畫面緩衝區恢復有效尺寸後才繼續繪製。'
tutorial.resize.details.link: '畫面緩衝區大小變更'
tutorial.resize.guidance: '渲染回呼會等待目前影格的提交完成，再呼叫 {present}。因此，尺寸變更回呼替換交換鏈影像時，先前影格的工作已經結束。完成狀態與資源生命週期的要求，詳見{link}。'
tutorial.resize.guidance.link: '同步'
tutorial.resize.title: '視窗尺寸變化'
tutorial.shaders.compilation.context: '{appContextBaseDirectory} 讓程式從輸出目錄載入已複製的著色器。即使從其他工作目錄啟動程式，尋找檔案的位置也不會改變。'
tutorial.shaders.compilation.description: '將 {triangleSlang} 的檔案屬性{emphasis}設為{detail}，建置時便會將著色器複製到執行檔所在目錄。'
tutorial.shaders.compilation.description.detail: '有更新時才複製'
tutorial.shaders.compilation.description.emphasis: '複製到輸出目錄'
tutorial.shaders.compilation.details: '回到 {programCs}，在頂點上傳之後、渲染回呼之前加入著色器初始化：'
tutorial.shaders.compilation.guidance: '{zenithCompiler} 依 {contextGraphicsApi} 指定的圖形 API 編譯原始碼，{createShader} 再依編譯後的描述建立著色器物件。進入點名稱 {vSMain} 與 {fSMain} 分別選取 Slang 檔案中定義的兩個函式。'
tutorial.shaders.compilation.title: '編譯著色器'
tutorial.shaders.context: '{fSInput} 連接兩個著色器階段。頂點著色器將裁剪空間位置寫入 {sVPOSITION}，GPU 據此判斷三角形的可見部分。{cOLOR0} 欄位傳遞頂點色彩，經過三角形內部的內插後再交給片元著色器。兩個階段必須採用相同的色彩型別與語義。'
tutorial.shaders.description: '著色器是在 GPU 上執行的程式。頂點著色器決定每個頂點的位置，片元著色器則決定影像中被覆蓋位置的色彩。接下來會將兩個階段寫在同一個 Slang 檔案，並分別定義進入點，也就是各階段開始執行的函式。'
tutorial.shaders.details: '在專案根目錄建立 {triangleSlang}，定義以下輸入與輸出結構：'
tutorial.shaders.fragment.description: '在同一檔案中追加片元進入點：'
tutorial.shaders.fragment.details: '光柵化判定三角形在影像中的覆蓋範圍，並在這些位置產生片元。每個片元的色彩由三個頂點的色彩內插而得。{fSMain} 傳回這個色彩，{sVTARGET} 則將結果送到第一個色彩附件。'
tutorial.shaders.fragment.title: '片元著色'
tutorial.shaders.guidance: '{vSInput} 定義頂點著色器輸入。{pOSITION0} 和 {cOLOR0} 按語義識別屬性，C# 欄位名稱本身不建立這一映射。'
tutorial.shaders.title: '著色器階段'
tutorial.shaders.vertex.description: '在 {triangleSlang} 中追加頂點進入點：'
tutorial.shaders.vertex.details: 'GPU 為每個輸入頂點執行這個函式。函式補上第四個位置分量 {w}，並傳遞色彩。頂點處理結束後，GPU 將 x、y、z 分別除以 w，得到正規化裝置座標。本例 w 為 1，因此這些值維持不變。'
tutorial.shaders.vertex.title: '頂點著色'
tutorial.surface.description: '在{emphasis}指定原生呈現目標：'
tutorial.surface.description.emphasis: '{windowCenter} 之後、{windowRun} 之前'
tutorial.surface.details: '畫面緩衝區是視窗用來顯示的像素影像。{surface} 描述原生呈現目標及其尺寸，{framebufferSize} 則提供像素大小。啟用顯示縮放時，這個大小可能與視窗的邏輯尺寸不同。'
tutorial.surface.guidance: '呈現目標提供所選圖形 API 所需的原生控制代碼：Windows 使用 Win32 視窗，Linux 使用 X11 顯示與視窗，macOS 使用已連接的 Metal 圖層。'
tutorial.surface.title: '原生呈現目標'
tutorial.swapChain.context: '交換鏈需要上下文與視窗才能運作。將 {programCs} 結尾的 {windowDispose} 換成以下釋放順序：'
tutorial.swapChain.description: '緊接呈現目標描述，建立交換鏈：'
tutorial.swapChain.details: '{swapChain} 管理視窗呈現的影像。{drawable} 以影像資源 {texture} 的形式提供目前影像。渲染後，{present} 請求顯示該影像，並推進到下一個輸出紋理。'
tutorial.swapChain.guidance: '{b8G8R8A8UNorm} 按藍、綠、紅和 alpha 順序儲存四個 8 位元通道。{uNorm} 將整數 0–255 對應到 0–1。著色器仍輸出邏輯 RGBA 值，格式只規定儲存表示。'
tutorial.swapChain.title: '交換鏈'
tutorial.title: '第一個三角形'
tutorial.window.description: '將 {cocoaHelperCs} 下載至專案中。此輔助類別負責將 Metal 圖層連接到 macOS 視窗。'
tutorial.window.details: '將 {programCs} 的內容換成以下程式碼：'
tutorial.window.guidance: '{graphicsAPINone} 告訴 Silk.NET 不要建立圖形上下文；應用程式稍後會建立 Zenith.NET 上下文。{initialize} 建立原生視窗，讓程式取得視窗系統的控制代碼；{center} 把視窗置於螢幕中央。{run} 持續處理事件直到視窗關閉，之後再執行 {dispose} 釋放視窗。'
tutorial.window.notes: '建置並執行程式，確認視窗可以開啟、移動、調整大小及關閉。此時尚未提交渲染命令，視窗內容還沒有定義。關閉視窗後再繼續。'
tutorial.window.title: '建立視窗'
