concepts.resources.allocation.context: '放置在堆積中的資源，在整個生命週期內都依賴堆積的儲存空間。最後一次 GPU 使用完成後，應先釋放資源，再釋放堆積。'
concepts.resources.allocation.description: '應用程式需要自行管理記憶體配置時，可以使用 {heap}。堆積為資源提供儲存空間，應用程式選擇明確的位元組位移來放置資源，並記錄各區域的使用情況。'
concepts.resources.allocation.details: '對每個資源，使用建立時所需的緩衝區或紋理描述呼叫 {contextGetSizeAndAlignment}。依傳回的大小預留空間，起始位移須為傳回對齊值的整數倍，而且整個區域須位於堆積內，不與其他仍有效的配置重疊。紋理配置可能包含填充，因此不能只依像素數量與每像素位元組數計算配置大小。'
concepts.resources.allocation.guidance: '放置在堆積中的緩衝區，必須使用與堆積相同的駐留設定。紋理儲存使用 GPU 專用堆積。'
concepts.resources.allocation.title: '堆積配置'
concepts.resources.bufferUsages.table.constant.role: '透過常數緩衝區繫結讀取的著色器參數。'
concepts.resources.bufferUsages.table.headings.role: '作用'
concepts.resources.bufferUsages.table.headings.usage: '用途'
concepts.resources.bufferUsages.table.index.role: '索引繪製所使用的索引。'
concepts.resources.bufferUsages.table.indirect.role: '間接繪製或分派命令讀取的引數。'
concepts.resources.bufferUsages.table.none.role: '未宣告任何緩衝區用途旗標。'
concepts.resources.bufferUsages.table.storageReadOnly.role: '透過唯讀著色器繫結存取的緩衝區資料。'
concepts.resources.bufferUsages.table.storageReadWrite.role: '透過讀寫著色器繫結存取的緩衝區資料。'
concepts.resources.bufferUsages.table.transferDst.role: 'GPU 複製作業的目的地儲存空間。'
concepts.resources.bufferUsages.table.transferSrc.role: 'GPU 複製作業的來源資料。'
concepts.resources.bufferUsages.table.vertex.role: '供繪製命令讀取的頂點屬性。'
concepts.resources.bufferUsages.title: '緩衝區用途'
concepts.resources.description: '資源描述規定應用程式如何使用其儲存空間。例如，一張紋理若要作為渲染目標、供著色器取樣，並將內容複製回 CPU，就需要宣告這三種操作的用途。記憶體放置決定 CPU 的存取方式，同步與生命週期管理則決定何時可以存取資料或釋放儲存空間。'
concepts.resources.memory.context: '對於 CPU 可存取的緩衝區，{map} 提供 CPU 讀寫資料所用的位址。映射與 {unmap} 都不會等待 GPU 工作。CPU 讀取 GPU 寫入的結果前，應用程式須先等待寫入完成；修改同一塊記憶體前，也須等待 GPU 對這些位元組的存取結束。'
concepts.resources.memory.description: '{bufferDesc} 的 {residency} 欄位指定 CPU 對所配置記憶體的預期存取方式：'
concepts.resources.memory.details: '駐留設定表達 CPU 的存取需求，即使 CPU 與 GPU 共用實體記憶體也同樣適用。三角形教學使用 {cpuWriteOnly} 直接初始化小型頂點緩衝區。較大的靜態幾何資料，則可考慮上傳到 GPU 專用儲存空間。'
concepts.resources.memory.guidance: '透過上下文直接建立的紋理使用 GPU 儲存空間，因此 {textureDesc} 沒有駐留欄位。應用程式透過上傳與回讀，在紋理與 CPU 記憶體之間交換資料。'
