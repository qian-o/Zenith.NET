### YamlMime:Resources
concepts.execution.context.description: "{graphicsContext} 代表一個後端裝置，並提供其圖形、計算與傳輸佇列。相同工作負載所需的緩衝區、紋理、著色器與管線應透過同一個圖形上下文建立。由另一個圖形上下文建立的資源或控制代碼不能直接繫結至此圖形上下文的命令緩衝區。"
concepts.execution.context.details: 依據平台與呈現表面選取後端。API 保持共用，但裝置支援度仍至關重要。{capabilities} 公開裝置名稱以及 {rayTracingSupported} 與 {meshShadingSupported} 旗標。在建立選用的工作負載之前，請像 {link} 與 {detail} 範例一樣先檢查對應的旗標。這些旗標並非格式、記憶體或平台限制的完整清單。
concepts.execution.context.details.detail: 網格著色（mesh shading）
concepts.execution.context.details.link: 光線追蹤
concepts.execution.context.title: 圖形上下文連接資源與佇列
concepts.execution.description: Zenith.NET 應用程式建立 GPU 資源、記錄使用這些資源的命令，並將這些命令提交至佇列。在 GPU 執行提交項目的同時，CPU 可以繼續執行。即使記錄呼叫已經返回，仍須保持資源有效，直到該工作完成。
concepts.execution.ownership.description: "在此處，所有權代表釋放的責任。C# 參考可保持受控物件可達；但它無法防止明確的 {dispose} 終結原生資源。同樣地，提交使用緩衝區的命令不會將該緩衝區的所有權移轉給佇列。"
concepts.execution.ownership.details: "關閉時，停止提交新工作，等待涉及的每個佇列完成對資源的最後一次使用，再釋放應用程式建立的資源，最後釋放圖形上下文。釋放上下文會釋放它自身的佇列與內部輔助物件；它不會等待所有應用程式工作，也不會釋放應用程式建立的全部資源。"
concepts.execution.ownership.guidance: "渲染期間也要遵循相同的生命週期規則。保留資源最後一次使用的完成值，以判斷何時可以覆寫其資料或取代資源。有關檢視及其底層資源的生命週期，請參閱{link}。"
concepts.execution.ownership.guidance.link: 資源管理
