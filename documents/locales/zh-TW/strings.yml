concepts.resources.textureUsages.table.headings.usage: '用途'
concepts.resources.textureUsages.table.none.role: '未宣告任何紋理用途旗標。'
concepts.resources.textureUsages.table.sampled.role: '透過取樣紋理繫結讀取的紋理資料。'
concepts.resources.textureUsages.table.storage.role: '透過儲存紋理繫結供著色器讀取或寫入的紋理資料。'
concepts.resources.textureUsages.table.transferDst.role: 'GPU 複製作業的目的地影像儲存空間。'
concepts.resources.textureUsages.table.transferSrc.role: 'GPU 複製作業的來源影像資料。'
concepts.resources.textureUsages.title: '紋理用途'
concepts.resources.title: '資源管理'
concepts.resources.transfers.context: '回讀先將 GPU 資料複製到內部回讀空間。程式庫回收已完成的命令緩衝區時，再將資料複製到指定的 CPU 目標。對這次回讀提交的完成值呼叫 {wait}，可以完成這兩個步驟。在呼叫返回前，目標記憶體須保持已配置狀態，受控記憶體須保持固定。'
concepts.resources.transfers.description: '上傳將 CPU 資料複製到 GPU 資源，回讀則將資源資料複製到 CPU 記憶體。緩衝區與紋理上的這些方法會在傳輸完成後返回：'
concepts.resources.transfers.details: '呼叫這些方法前，先處理與其他佇列存取之間的衝突。方法內部的等待只涵蓋自身傳輸，不會建立與其他佇列的相依關係。直接透過映射記憶體複製時，則完全由呼叫端負責等待會產生衝突的 GPU 存取。'
concepts.resources.transfers.guidance: '若要將傳輸與其他 GPU 工作一起提交，可透過 {commandBufferUpload} 或 {commandBufferDownload} 記錄。上傳來源與回讀目標的記憶體生命週期要求不同：'
concepts.resources.transfers.item: '上傳呼叫期間，程式庫會將來源資料複製到內部的臨時上傳空間，也就是暫存記憶體。GPU 隨後從這塊空間讀取，因此應用程式的來源指標只需保持有效到呼叫返回。'
concepts.resources.transfers.layouts: '記錄紋理傳輸命令不會自動處理佈局轉換。上傳需要 {copyDst} 佈局，回讀需要 {copySrc} 佈局。應在複製之前記錄轉換至對應佈局的命令，並在複製之後轉換至下次使用所需的佈局。'
concepts.resources.transfers.notes: '紋理傳輸中的列跨距是 CPU 資料相鄰兩列之間的位元組距離；切片跨距則是相鄰深度切片之間的位元組距離。傳輸操作依這些值，在 CPU 資料與紋理的 GPU 儲存空間之間複製內容。'
concepts.resources.transfers.table.bufferDownload.transfer: '對於 {cpuReadOnly}，直接從映射記憶體複製；否則向傳輸佇列提交回讀，並等待完成。'
concepts.resources.transfers.table.bufferUpload.transfer: '對於 {cpuWriteOnly}，直接複製到映射記憶體；否則向傳輸佇列提交上傳，並等待完成。'
concepts.resources.transfers.table.headings.method: '方法'
concepts.resources.transfers.table.headings.transfer: '傳輸行為'
concepts.resources.transfers.table.textureTransfers.method: '{textureUpload} / {textureDownload}'
concepts.resources.transfers.table.textureTransfers.transfer: '將複製及其紋理轉換提交到圖形佇列，並等待完成。操作結束後，所選子資源處於指定的最終佈局。'
concepts.resources.transfers.title: '即時傳輸與命令緩衝區傳輸'
concepts.resources.usages.description: '{bufferUsages} 與 {textureUsages} 是宣告資源用途的旗標列舉，分別設定於 {bufferDescUsages} 與 {textureDescUsages}。資源需要多種用途時，可透過 {value} 組合對應的成員。'
concepts.resources.usages.title: '資源用途'
concepts.resources.views.description: '{bufferView} 描述緩衝區的一塊區域及其資料解讀方式。{textureView} 選擇子資源範圍，以及相容的紋理型別與格式。兩者都參考既有儲存空間，並遵循建立時宣告的用途。檢視範圍描述存取區域，但無法保證不同實作中的著色器越界檢查一致。'
concepts.resources.views.details: '資源本身的控制代碼提供預設檢視。需要其他區域或相容的解讀方式時，再建立獨立檢視。檢視及其底層資源都必須保留到 GPU 使用結束；僅持有資源控制代碼，無法維持任一物件的存活。替換其中任一物件時，還須更新包含舊{link}的常數。'
concepts.resources.views.details.link: '資源控制代碼'
concepts.resources.views.title: '檢視與底層資源'
concepts.shaders.binding.context: '計算範例將 {inputTextureSampledHandle} 寫入 {input}，將 {outputTextureStorageHandle} 寫入 {output}。在 Slang 中，{descriptorHandle} 的型別引數規定了著色器存取資源的方式：'
concepts.shaders.binding.description: '{setConstantBuffer} 選擇既有緩衝區與位元組位移，目前管線從該位置讀取常數。著色器使用這些參數前，先將資料上傳到對應的儲存空間。如果先前提交的 GPU 工作仍在讀取相同位元組，須等待該工作完成後再更新。'
concepts.shaders.binding.details: '準備好命令緩衝區、計算管線、已填入資料的常數緩衝區及執行緒群組數量後，依以下順序記錄分派。常數緩衝區會繫結到目前管線，因此必須先選擇管線：'
concepts.shaders.binding.guidance: '常數緩衝區需要宣告 {bufferUsagesConstant} 用途。若多筆常數記錄共用緩衝區，每筆記錄的起始位移必須符合繫結對齊要求；這與記錄內部的欄位佈局是兩項不同要求。'
concepts.shaders.binding.notes: '{resourceHandle} 包含兩個 32 位元欄位，具體意義取決於所選圖形 API 的實作；其值只在建立資源的上下文中有效。'
concepts.shaders.binding.reference: '保留資源及用於取得控制代碼的檢視，直到著色器完成最後一次存取。替換紋理或檢視後，應更新仍含舊控制代碼的常數。相關所有權規則見{link}。'
concepts.shaders.binding.reference.link: '資源管理'
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: '讀取著色器型別 {t} 的結構化元素'
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: '讀寫著色器型別 {t} 的結構化元素'
concepts.shaders.binding.table.headings.access: '預期存取'
concepts.shaders.binding.table.headings.cHandle: 'C# 控制代碼'
concepts.shaders.binding.table.headings.slangFieldType: 'Slang 欄位型別'
concepts.shaders.binding.table.samplerHandle.access: '紋理取樣狀態'
concepts.shaders.binding.table.textureSampledHandle.access: '紋理讀取'
concepts.shaders.binding.table.textureStorageHandle.access: '儲存紋理的讀寫'
concepts.shaders.binding.title: '常數緩衝區與資源控制代碼'
concepts.shaders.compilation.description: '{zenithCompiler} 編譯 Slang 進入點並傳回 {shaderDesc}。上下文的 {graphicsApi} 決定輸出格式：DirectX 12 對應 {dxil}，Metal 對應 {metallib}，Vulkan 對應 {spirv}。'
concepts.shaders.compilation.details: '建立名為 {context} 的圖形上下文後，可以編譯已複製到執行檔所在目錄的三角形著色器：'
concepts.shaders.compilation.guidance: '進入點名稱 {vSMain} 必須與著色器檔案中的函式宣告一致。在初始化階段編譯著色器並建立管線，渲染期間重複使用管線。管線建立完成後，即可釋放著色器物件，具體見{link}。'
concepts.shaders.compilation.guidance.link: '第一個三角形'
concepts.shaders.compilation.title: '著色器編譯'
concepts.shaders.description: 'C# 與 Slang 宣告必須約定一致的資料位置與存取方式。頂點輸入佈局描述頂點屬性，著色器緩衝區宣告描述參數與陣列，資源控制代碼則識別著色器使用的資源。'
concepts.shaders.dispatch.description: '{dispatch} 指定要執行多少個執行緒群組。計算範例宣告 {numthreads}，因此每組包含 16 × 16 個執行緒。將影像寬度與高度分別除以 16，並向上取整，即可覆蓋整張影像：17 × 19 的影像需要 2 × 2 組。著色器檢查每個執行緒的座標，並跳過位於影像範圍以外的執行緒。'
concepts.shaders.dispatch.details: '{shaderDescThreadGroupSize} 提供宣告的群組大小，可用來計算傳給 {dispatch} 的群組數量。完整計算過程見 {computeShaderRendererCs}。分派完成後，存取輸出影像時仍須符合{link}中說明的要求。'
concepts.shaders.dispatch.details.link: '同步'
concepts.shaders.dispatch.title: '執行緒群組'
concepts.shaders.layout.context: '{link}透過影像尺寸與兩個紋理控制代碼展示這種排列。各欄位的起始位置由明確位移指定。以下宣告使用 {systemRuntimeInteropServices} 與 {zenithNET} 命名空間：'
concepts.shaders.layout.context.link: '計算範例的 C# 常數'
concepts.shaders.layout.description: '對於頂點輸入，{inputLayout} 描述各屬性的格式、位移與語義，以及相鄰頂點之間的跨距。三角形先儲存 {float3} 位置，再儲存 {float4} 色彩：色彩的位元組位移為 12，每個頂點占 28 位元組。{inputLayoutAdd} 根據元素格式計算這個緊密排列的佈局。若 C# 結構包含填充，就需要在位移與跨距中計入這些空間。'
concepts.shaders.layout.details: '常數緩衝區儲存著色器參數，結構化緩衝區儲存指定型別的元素陣列。它們的佈局由 Slang 宣告決定，不使用 {inputLayout}。C# 欄位位移、元素大小與填充，必須符合編譯後的著色器佈局。即使某個 C# 型別是非受控型別，可以直接依位元組複製，其記憶體排列也未必符合著色器要求；例如，頂點中緊密排列的 {float3}，在著色器緩衝區中可能需要不同的對齊方式。'
concepts.shaders.layout.guidance: '著色器參數除了普通數值，也可以包含資源控制代碼。控制代碼識別的是既有儲存空間，因此將它複製到常數緩衝區，不會複製資源內容。'
concepts.shaders.layout.notes: '{computeShaderSlang} 中對應的宣告為：'
concepts.shaders.layout.reference: 'C# 欄位占用前 24 位元組：兩個尺寸值合計 8 位元組，每個控制代碼各占 8 位元組。整筆記錄預留 256 位元組，其餘位元組用於填充。其他參數區塊的欄位位移也必須符合著色器佈局。若多筆記錄共用緩衝區，還需在記錄之間保留足夠的填充，以符合繫結對齊要求。'
concepts.shaders.layout.title: '資料佈局'
concepts.shaders.matrices.description: '編譯器採用列優先的矩陣儲存方式，使同一列的元素連續排列。{link}在位移 0、64 和 128 處儲存三個 {matrix4x4} 值，其{detail}按模型、檢視和投影順序執行 {mulVectorMatrix}。'
concepts.shaders.matrices.description.detail: '著色器'
concepts.shaders.matrices.description.link: '旋轉立方體渲染器'
concepts.shaders.matrices.details: '儲存順序決定矩陣元素在記憶體中的排列，乘法順序決定變換。C# 與 Slang 應採用相互配合的約定。'
concepts.shaders.matrices.title: '矩陣約定'
concepts.shaders.title: '著色器資料與繫結'
concepts.synchronization.backends.description: 'DirectX 12 與 Vulkan 將紋理轉換記錄為佈局與存取狀態的變更。在 Zenith.NET 的 Metal 實作中，{transition} 沒有對應的 GPU 操作。此實作將命令組織成渲染編碼器與計算編碼器，並在編碼器結束時插入可見性屏障。同一編碼器內彼此相依的操作，例如連續的計算分派，則透過明確呼叫 {barrier} 協調。'
concepts.synchronization.backends.details: '{link}開始圖形渲染通道時，會結束計算編碼器，讓後續圖形工作能讀取計算輸出。連續兩次計算分派仍位於同一編碼器內，即使中間記錄了紋理轉換，也需要屏障來處理相依關係。'
concepts.synchronization.backends.details.link: '計算範例'
concepts.synchronization.backends.title: '不同圖形 API 下的同步行為'
concepts.synchronization.barriers.context: '選擇涵蓋相關存取，且目前佇列支援的階段。{barrierStagesAll} 包含所有支援的階段；若相依關係只涉及其中一部分，可選擇較小的範圍。'
concepts.synchronization.barriers.description: '假設同一個命令緩衝區內有兩次計算分派，第一次寫入模擬資料，第二次讀取這些資料。在兩次分派之間設定屏障，讓第二次分派讀到已完成的寫入結果。對於儲存緩衝區，這樣即可安排存取順序，不需要進行紋理佈局轉換：'
concepts.synchronization.barriers.details: '第一個引數指定產生資料的階段，第二個引數指定使用資料的階段。兩者共同描述兩次分派之間所需的執行順序與記憶體可見性。'
concepts.synchronization.barriers.guidance: '{link}在模擬步驟之間採用這個方式。'
concepts.synchronization.barriers.guidance.link: 'FluidTank 模擬'
concepts.synchronization.barriers.title: '管線屏障'
concepts.synchronization.dependencies.description: '逐一確認每個資源有哪些存取涉及同一份資料。只要其中包含寫入，就必須維持所需的先後順序。兩次讀取本身沒有衝突，但仍需符合紋理佈局與呈現要求。CPU 更新資料或釋放資源前，也須等待 GPU 完成對該儲存空間的使用。'
concepts.synchronization.dependencies.details: '應根據操作執行的位置選擇機制：'
concepts.synchronization.dependencies.guidance: '一個佇列寫入的紋理被另一佇列使用時，應在提交之間建立相依關係，並記錄所需的佈局轉換。這兩步不會阻塞 CPU。CPU 要存取資料或釋放資源前，才需等待相關工作完成。'
concepts.synchronization.dependencies.table.cpuAccess.mechanism: '針對相關完成值呼叫 {wait}。'
concepts.synchronization.dependencies.table.cpuAccess.situation: 'CPU 存取或資源釋放需要等待 GPU 完成'
concepts.synchronization.dependencies.table.crossQueue.mechanism: '將生產者的 {timelineValue} 傳給消費者的 {submit}。'
concepts.synchronization.dependencies.table.crossQueue.situation: '一個佇列使用另一個佇列產生的資料'
concepts.synchronization.dependencies.table.headings.mechanism: '機制'
concepts.synchronization.dependencies.table.headings.situation: '情況'
concepts.synchronization.dependencies.table.layoutChange.mechanism: '呼叫 {commandBufferTransition}，指定先前佈局與目標佈局。'
concepts.synchronization.dependencies.table.layoutChange.situation: '紋理子資源變更其使用方式'
concepts.synchronization.dependencies.table.pipelineStages.mechanism: '呼叫 {commandBufferBarrier}，指定產生資料和使用資料的階段。'
concepts.synchronization.dependencies.table.pipelineStages.situation: '命令串流中相依的 GPU 階段'
concepts.synchronization.dependencies.title: '存取相依關係'
concepts.synchronization.description: '同步確定多個操作存取共用資料的順序，並讓後續操作能讀到所需結果。在寫後讀相依關係中，寫入端稱為生產者，讀取端稱為消費者。屏障與紋理轉換協調 GPU 存取；時間線連接不同提交，並讓 CPU 等待 GPU 工作完成。'
concepts.synchronization.layouts.context: '現有內容可以丟棄時，可將先前佈局設為 {undefined}，例如新建影像或即將完整清除的附件。若要保留內容以供載入、取樣或累積，則應使用前次存取時的佈局。'
concepts.synchronization.layouts.description: '紋理的用途旗標宣告允許的作用。{textureLayout} 描述命令序列中某個時點對子資源的存取方式，子資源由 mip 級別與陣列層識別。存取方式改變時，需要記錄轉換。例如，計算範例在 {storage} 佈局中寫入輸出紋理，再為圖形通道中的取樣做準備：'
concepts.synchronization.layouts.details: '這裡的 {outputTexture} 已宣告 {sampledStorage} 用途，所選子資源處於 {storage} 佈局。{default} 選擇 mip 級別 0 和陣列層 0，其他級別和層不受這次轉換影響。'
concepts.synchronization.layouts.guidance: '呼叫 {transition} 時，提供子資源上一次使用時的佈局。應用程式在記錄命令，以及在渲染階段之間傳遞紋理時，負責追蹤這個狀態。'
concepts.synchronization.layouts.title: '紋理佈局'
concepts.synchronization.readback.description: '{isCompleted} 回報 GPU 的完成狀態。透過命令記錄的回讀還需要一個步驟：將結果從內部回讀空間複製到應用程式的目標記憶體。'
concepts.synchronization.readback.details: '{commandBufferDownload} 記錄向內部回讀空間複製資料的 GPU 命令。提交完成後，程式庫在回收命令緩衝區時執行最後的 CPU 複製。對這次回讀提交的完成值呼叫 {wait}，會等待 GPU 完成，並處理該佇列已完成的緩衝區，從而完成這兩個步驟。呼叫返回前，目標記憶體須保持已配置狀態，受控記憶體須保持固定。'
concepts.synchronization.readback.guidance: '只輪詢 {isCompleted} 不會執行最後的 CPU 複製；等待其他佇列，也不會回收回讀佇列中已完成的緩衝區。上傳與回讀何時使用直接記憶體存取或暫存空間，見{link}。'
concepts.synchronization.readback.guidance.link: '資源管理'
concepts.synchronization.readback.title: '回讀完成'
concepts.synchronization.reuse.description: '三角形教學在每個影格完成後才重複使用資料。若要讓影格重疊執行，應為每個尚未完成的影格準備獨立的可變儲存空間，並追蹤何時可以再次使用。修改資料前，須等待 GPU 完成對相關位元組的存取；釋放資源前，則須等待它的所有使用結束。'
concepts.synchronization.reuse.details: '調整大小與結束程式遵循相同順序：先停止新的資源存取，等待既有存取結束，再替換或釋放資源。呼叫 {swapChainResize} 或釋放資源、上下文前，須先完成上述等待。三角形教學已經逐影格等待，因此可以在回呼之間調整大小。'
concepts.synchronization.reuse.guidance: '{swapChainPresent} 在呈現後向圖形佇列發出訊號並等待。因此，即使移除明確的提交等待，三角形教學仍會在呈現時等待。獨立提交到其他佇列的工作，需要另外追蹤其完成狀態。'
concepts.synchronization.reuse.title: '資源重複使用'
concepts.synchronization.timelines.context: 'CPU 若要在消費者完成後讀取結果、覆寫共用資料或釋放資源，須先等待這次提交完成：'
concepts.synchronization.timelines.description: '時間線用遞增值識別佇列進度。{submit} 傳回的 {timelineValue} 同時包含時間線和本次提交的值。不同時間線上的 {value} 數值不能直接比較。'
concepts.synchronization.timelines.details: '設 {producer} 與 {consumer} 是同一上下文中兩個佇列上已記錄的命令緩衝區，後者使用前者寫入的資料。提交時傳入以下相依關係：'
concepts.synchronization.timelines.guidance: '消費者所在的佇列會先等待傳入的完成值，再執行命令。CPU 不必呼叫 {producedWait}，可以繼續處理其他工作。共用資源須保留到 {consumed} 完成，同時仍需記錄消費者存取所要求的紋理轉換。'
concepts.synchronization.timelines.notes: '{queueTimelineSignal} 傳回的值，同樣可以透過 {wait} 等待，也可以作為另一個佇列的相依條件。{signal} 將完成點排在先前已提交的工作之後，GPU 完成這些工作後就會到達該點。'
concepts.synchronization.timelines.title: '時間線與佇列相依關係'
concepts.synchronization.title: '同步'
