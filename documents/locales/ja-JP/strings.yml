samples.host.details: コンピュートとレイトレーシングはオフスクリーンテクスチャを生成します。{texturePresenterCs} と {presentTextureSlang} は、それらのテクスチャをウィンドウの現在のフレームの出力テクスチャに描画します。ホストは引き続きサブミットとスワップチェーンのプレゼンテーションを所有します。
