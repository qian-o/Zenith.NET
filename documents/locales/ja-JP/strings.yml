### YamlMime:Resources
concepts.execution.context.description: "{graphicsContext} は 1 つのバックエンドデバイスを表し、そのグラフィックス、コンピュート、転送の各キューを提供します。ワークロード用のバッファー、テクスチャ、シェーダー、パイプラインは同じコンテキストを通じて作成してください。別のコンテキストによって作成されたリソースやハンドルを、このコンテキストのコマンドバッファーにそのままバインドすることはできません。"
concepts.execution.context.details: プラットフォームとプレゼンテーションサーフェスに適したバックエンドを選択してください。API は共有されますが、デバイスのサポート状況は依然として重要です。{capabilities} はデバイス名と、{rayTracingSupported} および {meshShadingSupported} フラグを公開します。{link} や {detail} サンプルのように、オプションのワークロードを作成する前に対応するフラグを確認してください。これらのフラグは、フォーマット、メモリ、またはプラットフォームの制限に関する完全なリストではありません。
concepts.execution.context.details.detail: メッシュシェーディング
concepts.execution.context.details.link: レイトレーシング
concepts.execution.context.title: コンテキストがリソースとキューを接続する
concepts.execution.description: Zenith.NET アプリケーションは GPU リソースを作成し、それらを使用するコマンドを記録して、それらのコマンドをキューにサブミットします。GPU がサブミットを実行している間も CPU は処理を続行できます。記録呼び出しが戻った後でも、その処理が終了するまでリソースを有効に保ってください。
concepts.execution.ownership.description: "ここでの所有権とは、破棄に対する責任を意味します。C# の参照はマネージドオブジェクトへの到達可能性を維持しますが、明示的な {dispose} がネイティブリソースを破棄することを防ぐわけではありません。同様に、バッファーを使用するコマンドをサブミットしても、そのバッファーの所有権がキューに移るわけではありません。"
concepts.execution.ownership.details: シャットダウン時には、新しい作業のサブミットを停止し、関係するすべてのキューでの最後の使用を待機し、アプリケーションのリソースを解放してから、コンテキストを破棄してください。コンテキストの破棄はその独自のキューや内部ヘルパーを解放しますが、アプリケーションのすべての作業を待機したり、アプリケーションが作成したすべてのリソースを解放したりするわけではありません。
concepts.execution.ownership.guidance: レンダリング中も同じライフサイクルのルールを適用してください。リソースの最後の使用に対する完了値を保持し、そのバイトがいつ上書き可能になるか、またはリソースがいつ交換可能になるかを把握できるようにします。ビューと基盤となるリソースの有効期間については、{link} を参照してください。
concepts.execution.ownership.guidance.link: リソース管理
concepts.execution.ownership.table.applicationResources.object: アプリケーションが作成したリソース
concepts.execution.ownership.table.applicationResources.ownership: アプリケーションが最後の GPU 使用後に解放します。
concepts.execution.ownership.table.commandBuffers.object: 借用したコマンドバッファー
concepts.execution.ownership.table.commandBuffers.ownership: キューが管理およびリサイクルします。
