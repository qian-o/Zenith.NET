### YamlMime:Resources
concepts.execution.context.description: "{graphicsContext} は特定のバックエンドを介してアプリケーションを GPU デバイスに接続し、描画、計算、転送のキューを提供します。一緒に使うリソースは同じコンテキストに属している必要があります。バッファー、テクスチャ、シェーダー、パイプラインとそのハンドルを、コンテキストをまたいでバインドすることはできません。"
concepts.execution.context.details: "{capabilities} はデバイス名と対応機能を提供します。レイトレーシングやメッシュシェーディング用のリソースを作成する前に、{rayTracingSupported} と {meshShadingSupported} で対応を確認します。{link}と{detail}のサンプルでは、初期化時にこの確認を行っています。"
concepts.execution.context.details.detail: "メッシュシェーディング"
concepts.execution.context.details.link: "レイトレーシング"
concepts.execution.context.title: "グラフィックスコンテキスト"
concepts.execution.description: "GPU の処理は CPU 側で準備します。アプリケーションがリソースを作成し、それらを使うコマンドを記録して、キューに送信します。送信後は GPU がコマンドを実行する間も CPU が処理を続けられます。リソースは GPU の実行が終わるまで保持する必要があります。"
concepts.execution.ownership.description: "所有権は誰がオブジェクトを解放するかを、GPU の完了はいつ解放できるかを決めます。C# の参照が残っていても、{dispose} を呼ぶとネイティブリソースは解放されます。コマンドを送信しても、そのリソースの所有権はキューへ移りません。"
concepts.execution.ownership.details: "終了時は新しい送信を止め、関係するすべてのキューでリソースの最後の使用が終わるのを待ちます。その後、アプリケーションのリソースを解放し、最後にコンテキストを解放します。コンテキストは自身のキューと内部の補助オブジェクトを解放するため、この処理はアプリケーションの作業が終わってから行います。"
concepts.execution.ownership.guidance: "描画中にデータを上書きしたりリソースを置き換えたりする場合は、それを使う処理の完了を追跡します。その使用が終わるのを待ってから、データを変更するか記憶領域を解放します。ビューとその参照先リソースの寿命は、{link}で説明します。"
concepts.execution.ownership.guidance.link: "リソース管理"
concepts.execution.ownership.table.applicationResources.object: "アプリケーションが作成したリソース"
concepts.execution.ownership.table.applicationResources.ownership: "アプリケーションが最後の GPU 使用後に解放します。"
concepts.execution.ownership.table.commandBuffers.object: "借用したコマンドバッファー"
concepts.execution.ownership.table.commandBuffers.ownership: "キューが管理して再利用します。"
concepts.execution.ownership.table.headings.object: "オブジェクト"
concepts.execution.ownership.table.headings.ownership: "解放の責任"
concepts.execution.ownership.table.queues.object: "コンテキストキューとそのタイムライン"
concepts.execution.ownership.table.queues.ownership: "コンテキストとキューが管理します。"
concepts.execution.ownership.table.swapChainDrawable.ownership: "スワップチェーンが管理します。"
concepts.execution.ownership.title: "所有権と寿命"
concepts.execution.pipelines.description: "グラフィックスパイプラインは、シェーダー、頂点入力レイアウト、プリミティブの組み立て、アタッチメントのフォーマット、描画状態を定義します。頂点、インデックス、定数のデータをバインドする前に選択してください。アタッチメントのフォーマットとサンプル数は、レンダーパスと一致させる必要があります。"
concepts.execution.pipelines.details: "コンピュートパイプラインは、ディスパッチで実行するシェーダーのエントリーポイントを選びます。グラフィックスのレンダーパス外で、パイプラインと定数をバインドしてからディスパッチします。"
concepts.execution.pipelines.guidance: "{link}ではグラフィックスの手順を、{detail}では計算結果を表示するパスの前にディスパッチを加える手順を確認できます。"
concepts.execution.pipelines.guidance.detail: "コンピュートサンプル"
concepts.execution.pipelines.guidance.link: "三角形の描画コールバック"
concepts.execution.pipelines.title: "パイプラインの状態"
concepts.execution.queues.description: "描画、計算、コピーを含むフレームでは、通常は {graphicsQueue} から始めます。依存する操作を同じキューにまとめると、順序を扱いやすくなります。"
concepts.execution.queues.details: "独立した処理を別々のキューに送信できますが、各キューが独立したハードウェア実行ユニットに対応するとは限りません。処理を並行して実行する利点がある場合に、キューを追加します。一方のキューがもう一方の生成データを使う場合は、送信間に明示的な依存関係を設定します。"
concepts.execution.queues.guidance: "同じキュー内でも、依存する操作にはバリアやテクスチャ遷移が必要になる場合があります。後のアクセスで、それ以前の書き込み結果を読み取れるようにするためです。このメモリ依存関係は送信順序とは別の要件であり、指定方法は{link}で説明します。"
concepts.execution.queues.guidance.link: "同期"
concepts.execution.queues.table.computeQueue.workToRecord: "コンピュートディスパッチと対応する転送操作。グラフィックスのレンダーパスは含みません。"
concepts.execution.queues.table.graphicsQueue.workToRecord: "レンダーパス、描画、計算、転送の操作。"
concepts.execution.queues.table.headings.queue: "キュー"
concepts.execution.queues.table.headings.workToRecord: "対応する操作"
concepts.execution.queues.table.transferQueue.workToRecord: "アップロード、リードバック、コピー。描画とコンピュートディスパッチは含みません。"
concepts.execution.queues.title: "キューの選択"
concepts.execution.recording.context: "キューは完了したコマンドバッファーを回収して再利用します。記録ごとに {queueCommandBuffer} で取得し、同時に記録するスレッドを一つに限定して、一度だけ送信します。送信後はキューに管理を任せ、変更、再送信、解放を行わないでください。"
concepts.execution.recording.description: "{queueCommandBuffer} が返す {commandBuffer} は、既に記録を開始しています。操作と依存関係を記録した後、一度だけ {submit} を呼びます。記録が終了して送信され、そのキューの完了点を示す {timelineValue} が返ります。"
concepts.execution.recording.details: "三角形のチュートリアルでは、{commandBuffer} にフレームを記録した後、次のように送信して完了を待ちます。"
concepts.execution.recording.guidance: "記録によってコマンド列を構築し、{submit} でその実行をスケジュールします。続いて {wait} を呼ぶと、送信した処理が完了するまで CPU スレッドが待機します。チュートリアルでは次のフレームを始める前に現在のフレームが終わるため、処理の順序を追いやすくなります。"
concepts.execution.recording.title: "記録と送信"
concepts.execution.title: "実行モデル"
concepts.platforms.description: "画面への提示は、アプリケーションまたは UI コントロールが管理します。この選択によって、フレームの出力テクスチャを取得し、コマンドを記録・送信して結果を提示する担当が決まります。この出力テクスチャを drawable と呼びます。"
concepts.platforms.frame.context: "パス内でパイプラインのバインドと描画を記録し、ハンドラーから戻る前にパスを終了します。コントロールがコマンドを送信し、結果を提示します。ハンドラーでは送信を行わず、渡されたコマンドバッファーや drawable を解放しないでください。drawable のレイアウトを変更した場合は、コントロールが最後の遷移を行えるよう、戻る前に {colorAttachment} に戻します。"
concepts.platforms.frame.description: "コントロールは {iZenithView} を実装します。アプリケーションは {graphicsContext} を設定し、{updateRequested} でシーンを更新し、{renderRequested} で渡された {renderEventArgs} を使ってコマンドを記録します。"
concepts.platforms.frame.details: "各フレームで、コントロールは drawable とコマンドバッファーを取得し、drawable を {colorAttachment} に遷移させてから、更新と描画のハンドラーを呼びます。その後、記録した処理を送信し、フレームワークの提示方式に従って画像を表示します。"
concepts.platforms.frame.guidance: "ファイルに {usingZenithNET} を追加します。{view} という名前の {iZenithView} が初期化され、グラフィックスコンテキストも設定済みなら、次のハンドラーで drawable をクリアできます。"
concepts.platforms.frame.notes: "最初の遷移は {undefined} を使うため、以前の画像内容は破棄できます。毎フレーム、画像全体を描画するかクリアしてください。蓄積する描画結果やキャッシュはアプリケーション所有のテクスチャに保存し、そのテクスチャをコントロールの drawable に描画します。"
concepts.platforms.frame.reference: "{zenithViewHelperDrawableFormat} は、これらの統合で使う既定のカラーフォーマットを提供します。"
concepts.platforms.frame.title: "UI コントロールでの描画"
concepts.platforms.integration.context: "WinForms、WPF、Windows 向け WinUI の統合は Windows 上で動作します。MAUI では対象プラットフォームのワークロードをインストールし、{extensionsCs} のように {useZenithView} でコントロールハンドラーを登録します。"
concepts.platforms.integration.description: "イベントのインターフェースは共通ですが、提示方式はフレームワークごとに異なります。"
concepts.platforms.integration.details: "GPU の画像を UI に届ける方法は、実装によって異なります。ビットマップへのリードバックでは、表示前にピクセルを CPU メモリへコピーします。共有テクスチャの相互運用では、この CPU コピーを省けますが、GPU コピーや同期が必要な場合があります。統合を選ぶ際は、共通の {renderRequested} イベントだけでなく、提示方法も検討してください。"
concepts.platforms.integration.guidance: "使用する UI フレームワークの統合パッケージを NuGet から追加します。Avalonia では {avaloniaPackage} を使います。"
concepts.platforms.integration.table.avalonia.integration: "Avalonia"
concepts.platforms.integration.table.avalonia.presentation: "テクスチャにレンダリングし、ピクセルを {writeableBitmap} にリードバックします。{zenithViewCs} および {surfaceCs} を参照してください。"
concepts.platforms.integration.table.headings.integration: "統合"
concepts.platforms.integration.table.headings.presentation: "提示方式"
concepts.platforms.integration.table.maui.integration: ".NET MAUI"
concepts.platforms.integration.table.maui.presentation: "Android、iOS、Mac Catalyst ではネイティブサーフェスを使用し、Windows では共有テクスチャコンポジションを使用します。{link} を参照してください。"
concepts.platforms.integration.table.maui.presentation.link: "プラットフォーム実装"
concepts.platforms.integration.table.uno.integration: "Uno パス"
concepts.platforms.integration.table.uno.presentation: "ピクセルを {writeableBitmap} にリードバックします。{zenithViewUnoCs} を参照してください。"
concepts.platforms.integration.table.winForms.integration: "WinForms"
concepts.platforms.integration.table.winForms.presentation: "コントロールの {hWND} 用に Zenith.NET スワップチェーンを作成します。{zenithViewCs} を参照してください。"
concepts.platforms.integration.table.winUI.integration: "Windows 上の WinUI"
concepts.platforms.integration.table.winUI.presentation: "インポートされた共有 Direct3D 11 テクスチャにレンダリングし、{swapChainPanel} に接続されたコンポジションスワップチェーンにコピーします。{zenithViewWinUICs} を参照してください。"
concepts.platforms.integration.table.wpf.integration: "WPF"
concepts.platforms.integration.table.wpf.presentation: "共有 Direct3D 11 テクスチャをインポートし、Direct3D 相互運用を介して {d3DImage} によって表示されるサーフェスにコピーします。{surfaceCs} を参照してください。"
concepts.platforms.integration.title: "フレームワークと提示方式"
concepts.platforms.lifecycle.context: "対応するアタッチメントを作るときは、描画イベントから渡された drawable の {descWidth}、{descHeight}、{descFormat}、{descSampleCount} を使います。このテクスチャの寸法が、実際の描画先の寸法です。コントロールのレイアウト上のサイズや表示倍率から推測しないでください。"
concepts.platforms.lifecycle.description: "スワップチェーンのサイズには、フレームバッファーの幅と高さをピクセル単位で使います。表示倍率によっては、ウィンドウの論理寸法とは異なります。どちらかの寸法がゼロの間は、描画もスワップチェーンのリサイズも行いません。{swapChainDrawable} は毎フレーム取得します。このテクスチャはスワップチェーンが所有し、提示やリサイズの後に置き換わることがあります。"
concepts.platforms.lifecycle.details: "フレームバッファーの寸法が変わったら、古い画像への GPU アクセスが終わるのを待ってから {swapChainResize} を呼びます。ネイティブの提示先を置き換える場合も、アクセスの完了後に、新しいサーフェス記述とハンドルを {swapChainRefresh} に渡します。終了時は、ネイティブの提示先を破棄する前にスワップチェーンを解放します。"
concepts.platforms.lifecycle.guidance: "アプリケーションの深度テクスチャやオフスクリーンテクスチャがウィンドウと同じ寸法を使う場合は、リサイズ時に再作成し、それらのハンドルを含む定数も更新します。アタッチメントのフォーマットとサンプル数が合っていれば、パイプラインは再利用できます。{link}では、テクスチャをリサイズしながらパイプラインを保持する構成を確認できます。"
concepts.platforms.lifecycle.guidance.link: "回転する立方体のレンダラー"
concepts.platforms.lifecycle.title: "スワップチェーンの寸法と寿命"
concepts.platforms.ownership.description: "設定したコンテキストと描画リソースはアプリケーションが、提示用リソースはコントロールが所有します。ビューの {graphicsContext} を変えると、スケジューラーは新しいコンテキストでコントロールのリソースを再作成します。アプリケーションのパイプライン、バッファー、テクスチャも、同じコンテキストで作り直してください。"
concepts.platforms.ownership.details: "描画リソースを置き換える前にビューのフレーム処理を止め、そのリソースを使う GPU 処理の完了を待ちます。その後、古いリソースやコンテキストを解放します。ビューを削除した場合も、設定したコンテキストの解放はアプリケーションが担当します。"
concepts.platforms.ownership.guidance: "共通の {frameSchedulerCs} は、ビューの UI ディスパッチャーを通してフレームハンドラーを実行します。ハンドラーはシーンデータの更新とコマンドの記録に集中させてください。そこで長い CPU 処理を行うと、UI の応答も遅れます。"
concepts.platforms.ownership.title: "アプリケーションとコントロールの所有権"
concepts.platforms.surface.description: "{link}では、Silk.NET がウィンドウを作成してイベントを処理します。Zenith.NET は {surface} 記述を通じてネイティブウィンドウのハンドルと寸法を受け取り、それを使って {swapChain} を作成します。OS のウィンドウは引き続きアプリケーションが管理します。"
concepts.platforms.surface.description.link: "三角形のチュートリアル"
concepts.platforms.surface.details: "サーフェスのハンドルはバックエンドと対応させます。"
concepts.platforms.surface.guidance: "{appCs} のサンプルホストは Windows、macOS、X11 に対応しています。Linux のウィンドウは Xlib ハンドルを渡すため、Wayland セッションで実行するには XWayland が必要です。ネイティブ Wayland アプリケーションでは、{surfaceWayland} にディスプレイとサーフェスのハンドルを渡します。"
