concepts.platforms.integration.table.wpf.presentation: 共有 Direct3D 11 テクスチャをインポートし、Direct3D 相互運用を介して {d3DImage} によって表示されるサーフェスにコピーします。{surfaceCs} を参照してください。
concepts.platforms.integration.title: フレームワークだけでなくプレゼンテーションパスも選択する
concepts.platforms.lifecycle.context: UI ビューの場合、一致するレンダリングリソースを作成する際に、イベントの出力テクスチャの {descWidth}、{descHeight}、{descFormat}、{descSampleCount} を使用してください。コントロールがその出力テクスチャの解像度を決定します。論理寸法やディスプレイスケールが常にテクスチャ寸法と等しいとは仮定しないでください。
concepts.platforms.lifecycle.description: ネイティブスワップチェーンの場合、ピクセル単位のフレームバッファーサイズを渡してください。ディスプレイのスケーリングが有効な場合、論理単位で表されたウィンドウサイズとは異なることがあります。サイズがゼロのフレームバッファーはスキップし、ピクセルサイズが変化したときにスワップチェーンをリサイズし、フレームごとに {swapChainDrawable} を取得してください。出力テクスチャはスワップチェーンが所有しており、プレゼンテーションやリサイズ後に変更される可能性があります。
concepts.platforms.lifecycle.details: "{swapChainResize} は既存のサーフェスの寸法を変更します。{swapChainRefresh} はネイティブハンドルを含むサーフェス記述を置き換えます。どちらの操作の前にも、影響を受けるリソースの未完了の使用を完了させてください。ネイティブプレゼンテーションターゲットを破棄する前に、スワップチェーンを解放してください。"
concepts.platforms.lifecycle.guidance: ウィンドウに従ってサイズが変わるアプリケーション所有の深度テクスチャやオフスクリーンテクスチャを再作成し、そのハンドルを含む定数を更新してください。アタッチメントフォーマットとサンプル数に互換性が維持されている場合、サイズ変更をまたいでパイプラインを使い続けることができます。{link} は深度テクスチャを置き換えながらパイプラインを維持します。
concepts.platforms.lifecycle.guidance.link: 回転する立方体のレンダラー
concepts.platforms.lifecycle.title: 出力テクスチャのサイズとライフサイクルをホストに委ねる
concepts.platforms.ownership.description: アプリケーションは、割り当てたコンテキストおよびレンダリングのために作成したリソースを所有します。コントロールは独自のプレゼンテーションリソースを所有します。ビューの {graphicsContext} プロパティを変更すると、スケジューラはコントロールのリソースを再作成しますが、新しいコンテキスト用にアプリケーションのパイプライン、バッファー、テクスチャを再作成するわけではありません。
concepts.platforms.ownership.details: リソースの置き換えはビューのフレームライフサイクルと協調させてください。アプリケーションのリソースや割り当てられたコンテキストを破棄する前に、ビューのフレームアクティビティを停止し、未完了の GPU 使用を終了させてください。ビューを削除しても、コンテキストの所有権がコントロールに移るわけではありません。
concepts.platforms.ownership.guidance: 共有の {frameSchedulerCs} は、ビューの UI ディスパッチャーを介してフレーム処理をディスパッチします。フレームハンドラーはフレームの更新と記録に集中させてください。そこでの長時間の CPU 処理は UI の遅延にもつながります。
concepts.platforms.ownership.title: アプリケーションリソースをコントロールの所有権外に保つ
concepts.platforms.surface.context: ウィンドウライブラリや UI フレームワークが特定のオペレーティングシステムをサポートしていても、そこで選択した GPU バックエンドが利用可能であるとは限りません。デバイス機能、ドライバー、およびネイティブサーフェスのサポートが一致している必要があります。オプションのレイトレーシングやメッシュシェーディングのワークロードを作成する前に、{contextCapabilities} で確認してください。
concepts.platforms.surface.description: "{link} は Silk.NET を使用してウィンドウを作成し、イベントを処理します。Zenith.NET は、{surface} の記述と {swapChain} を介してそのウィンドウに接続します。サーフェスにはネイティブハンドルとサイズが含まれます。その記述を構築しても、オペレーティングシステムのウィンドウが作成または所有されるわけではありません。"
concepts.platforms.surface.description.link: 三角形チュートリアル
concepts.platforms.surface.details: "ハンドルは選択したバックエンドと一致している必要があります:"
concepts.platforms.surface.guidance: チュートリアルの {appCs} は Windows、macOS、X11 の選択肢を示しています。その Linux ホストは Xlib ハンドルを提供するため、Wayland セッションで使用するには XWayland が必要です。ネイティブ Wayland アプリケーションの場合は、{surfaceWayland} を通じて異なるハンドルを提供することになります。
