samples.computeShader.description: コンピュートディスパッチで画像をグレースケールに変換し、結果のテクスチャを表示します。サンプリングされる入力テクスチャと書き込み可能な出力テクスチャのリソースハンドル、切り上げられたスレッドグループ数、シェーダー内の境界チェックを示します。付属の {assetsTexturesShokoPng} アセットを保持してください。レンダラーはこれを一度処理し、以降のフレームで結果を提示します。
