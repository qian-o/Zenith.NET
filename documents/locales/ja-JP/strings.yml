concepts.execution.ownership.table.headings.ownership: 誰が解放するか？
concepts.execution.ownership.table.queues.object: コンテキストキューとそのタイムライン
concepts.execution.ownership.table.queues.ownership: コンテキストとキューが管理します。
concepts.execution.ownership.table.swapChainDrawable.ownership: スワップチェーンが管理します。
concepts.execution.ownership.title: 所有権と GPU 完了を明確に区別する
concepts.execution.pipelines.description: グラフィックスパイプラインは、シェーダー、頂点入力レイアウト、頂点をプリミティブに組み立てるルール、アタッチメントフォーマット、レンダー状態を結合します。頂点、インデックス、定数データをバインドし、描画コマンドを発行する前に設定してください。そのアタッチメントフォーマットとサンプル数は、レンダーパスのアタッチメントと一致している必要があります。
concepts.execution.pipelines.details: コンピュートパイプラインは、GPU スレッドのグループを起動するディスパッチ用のシェーダーエントリポイントを提供します。ディスパッチの前に、パイプラインとその定数を設定してください。コンピュートディスパッチはグラフィックスレンダーパスの外側に配置します。パイプラインの変更は、後続のコマンドがその入力を解釈する方法の変更を意味します。選択したパイプラインに必要なデータは、使用する前にバインドしてください。
concepts.execution.pipelines.guidance: "{link} は完全なグラフィックスシーケンスを示しています。{detail} はディスパッチを記録し、その後に結果を表示するグラフィックスパスを記録します。"
concepts.execution.pipelines.guidance.detail: コンピュートサンプル
concepts.execution.pipelines.guidance.link: 三角形の描画コールバック
concepts.execution.pipelines.title: パイプラインがコマンドによるデータの解釈方法を決定する
concepts.execution.queues.description: 1 つのフレームで描画、コンピュート、コピーを組み合わせる場合は、{graphicsQueue} から始めてください。依存する作業を 1 つのキューにまとめることで、その順序付けを追跡しやすくなります。
concepts.execution.queues.details: "キューは、まとめられたコマンドを受け付けて実行します。別々のキューが別々のハードウェアエンジンに対応するとは限らないため、同時に実行されるとは限りません。処理を重ねて進める利点がある場合に別のキューを使い、一方のキューが他方の結果を使う場合は明示的な依存関係を設定してください。"
concepts.execution.queues.guidance: 後続のコマンドが先行の書き込みに依存する場合、アプリケーションはそれらの書き込みが後続のコマンドから利用可能であることも保証しなければなりません。両方のコマンドバッファーを同じキューにサブミットするだけでは、そのような依存関係が自動的にすべて確立されるわけではありません。コマンドは異なる GPU ステージを使用する可能性があり、後続のアクセスにはバリアやテクスチャ遷移が必要になる場合があります。{link} で、サブミットの順序とリソースの可視性の違いについて説明しています。
concepts.execution.queues.guidance.link: 同期
concepts.execution.queues.table.computeQueue.workToRecord: グラフィックスレンダーパスを含まない、コンピュートディスパッチおよび互換性のある転送作業。
concepts.execution.queues.table.graphicsQueue.workToRecord: レンダーパスと描画、およびフレームで使用されるコンピュート操作と転送操作。
concepts.execution.queues.table.headings.queue: キュー
concepts.execution.queues.table.headings.workToRecord: 記録する作業
concepts.execution.queues.table.transferQueue.workToRecord: 描画やコンピュートディスパッチを含まない、アップロード、ダウンロード、コピーの作業。
concepts.execution.queues.title: 実行する作業に応じたキューを選択する
concepts.execution.recording.context: キューは完了をポーリングし、終了したコマンドバッファーをリサイクルします。新しい記録ごとに {queueCommandBuffer} を呼び出してください。リサイクルされたインスタンスが返される場合があります。借用したコマンドバッファーを独自に破棄したり、2 回サブミットしたり、サブミット後も記録を続けたりしないでください。特定のコマンドバッファーへの記録は一度に 1 つのスレッドから行ってください。キューの内部ロックは、コマンドバッファーへの同時編集を保護しません。
concepts.execution.recording.description: "{queueCommandBuffer} は、すでに記録が開始された {commandBuffer} を返します。コマンドとその依存関係を記録し、一度 {submit} を呼び出します。サブミットにより記録が終了し、そのキュー上の完了ポイントを識別する {timelineValue} が返されます。"
concepts.execution.recording.details: "たとえば、{commandBuffer} にフレームを記録した後、三角形のチュートリアルでは次のようにサブミットして完了を待機します:"
concepts.execution.recording.guidance: "{submit} は作業をスケジュールし、{wait} はそのサブミットが完了するまで CPU の続行を待機させます。描画の記録、レンダーパスの終了、コマンドバッファーのサブミットはそれぞれ別の操作です。描画の記録もパスの終了も、GPU を待機することはありません。"
concepts.execution.recording.title: 記録してもコマンドは実行されない
concepts.execution.title: 実行モデル
concepts.platforms.description: アプリケーションがネイティブウィンドウとフレームループを自ら所有するか、UI レンダリングコントロールを使用するかを選択します。その選択によって、誰が出力テクスチャを取得し、コマンドをサブミットし、結果を提示するかが決まります。出力テクスチャとは、現在のフレームの出力として使用されるテクスチャのことです。オフスクリーンのグラフィックスやコンピュート処理には、ウィンドウやスワップチェーンは不要です。
concepts.platforms.frame.context: そのパスの内部にパイプラインバインディングと描画コマンドを追加してください。戻る前にパスを終了します。提供されたコマンドバッファーを独自にサブミットしたり個別に提示したりしないでください。また、コマンドバッファーや出力テクスチャを破棄しないでください。ハンドラーが出力テクスチャを別のレイアウトで使用する場合は、コントロールの最終遷移のために {colorAttachment} に戻してください。
concepts.platforms.frame.description: 各統合機能は {iZenithView} を実装しています。アプリケーションはその {graphicsContext} を提供し、{updateRequested} でシーンデータを更新し、{renderEventArgs} を使用して {renderRequested} でレンダリングを記録します。
concepts.platforms.frame.details: "コントロールが各フレームの一連の処理を管理します。出力テクスチャとコマンドバッファーを取得し、出力テクスチャを {colorAttachment} に遷移させ、ハンドラーを呼び出した後、そのフレームワークで必要なサブミットとプレゼンテーションを行います。"
concepts.platforms.frame.guidance: "コンテキストが割り当てられた {view} という名前の初期化済み {iZenithView} の場合、このハンドラーは完全なクリアパスを記録します。これには {usingZenithNET} が必要です:"
concepts.platforms.frame.notes: 各コントロールは各フレームの開始時に {undefined} から遷移するため、アプリケーションは出力テクスチャの以前の内容が保持されることに依存できません。フレームごとに必要な画像をクリアまたはレンダリングしてください。持続的な累積やキャッシュされたレンダリングはアプリケーションが所有するテクスチャに保持し、そのテクスチャをビュー経由で表示してください。
concepts.platforms.frame.reference: "{zenithViewHelperDrawableFormat} は統合のデフォルトのカラーフォーマットを提供します。アタッチメントフォーマット、サンプル数、寸法を一致させる際は、実際のイベントの出力テクスチャを確認してください。"
concepts.platforms.frame.title: UI コントロールから提供されたフレームに記録する
concepts.platforms.integration.context: WinForms、WPF、および Windows の WinUI パスには Windows が必要です。MAUI アプリケーションにはターゲットプラットフォームのワークロードが必要であり、{useZenithView} を使用してコントロールハンドラーを登録する必要があります。{extensionsCs} を参照してください。フレームワークのサポートとバックエンドのサポートの両方が満たされている必要があります。
concepts.platforms.integration.description: "各コントロールはイベントインターフェイスを共有していますが、すべてが同じ方法で提示されるわけではありません:"
concepts.platforms.integration.details: ビットマップリードバックは、UI が表示する前にレンダリングされたピクセルを CPU メモリにコピーします。共有テクスチャの相互運用はそのリードバックを回避しますが、GPU コピーと同期が依然として必要になる場合があります。したがって、共有の {renderRequested} インターフェイスが同じプレゼンテーションコストやネイティブ相互運用要件を意味するわけではありません。
concepts.platforms.integration.guidance: "アプリケーションのフレームワーク用のパッケージを使用してください。例:"
concepts.platforms.integration.table.avalonia.integration: Avalonia
concepts.platforms.integration.table.avalonia.presentation: テクスチャにレンダリングし、ピクセルを {writeableBitmap} にダウンロードします。{zenithViewCs} および {surfaceCs} を参照してください。
