tutorial.context.description: "{graphicsContext} はバックエンドを介してアプリケーションを GPU に接続し、描画リソースを作成するためのメソッドを提供します。"
tutorial.context.details: "コンテキストの初期化を{emphasis}に追加します。"
tutorial.context.details.emphasis: "using ディレクティブの後、{iWindowWindow} の前"
tutorial.context.guidance: "各分岐でプラットフォームに応じたバックエンドを選び、検証を要求します。{validationMessage} のメッセージはコンソールに出力します。"
tutorial.context.imports: "{programCs} の先頭に、次の using ディレクティブを追加します。"
tutorial.context.title: "グラフィックスコンテキスト"
tutorial.description: "このチュートリアルでは、空の .NET コンソールプロジェクトから始め、ウィンドウを開いて色付きの三角形を描くアプリケーションを作成します。"
tutorial.details: "このチュートリアルでは、空のウィンドウ、単色の背景、色付きの三角形の三段階で結果を確認します。各段階でアプリケーションを実行し、表示を確かめてから次へ進んでください。"
tutorial.draw.context: "{draw} の引数は次のとおりです。"
tutorial.draw.description: "{windowRender} コールバックの {addTheTriangleDrawCommandsHereLater} を、次のコマンドで置き換えます。位置は {beginRenderPass} と {endRenderPass} の間です。"
tutorial.draw.details: "{setPipeline} はシェーダーと描画状態を選択します。頂点のバインドはパイプラインの入力レイアウトに従って解釈されるため、その前に呼びます。"
tutorial.draw.guidance: "{setVertexBufferVertexBuffer} は、転送済みの頂点データをバイトオフセット 0 から入力スロット 0 にバインドします。これは {inputLayouts} の唯一の要素に対応します。"
tutorial.draw.notes: "これらの呼び出しは描画コマンドを記録します。既存の {submitWait} がコマンドを送信して GPU の完了を待ち、その後 {present} が完成した画像の表示を要求します。三角形の外側にも決まった背景色を表示するため、パスの先頭のクリア処理は残します。"
tutorial.draw.table.firstInstance.meaning: "インスタンスの番号付けをゼロから開始します。"
tutorial.draw.table.firstVertex.meaning: "バッファー内の最初の頂点から開始します。"
tutorial.draw.table.headings.argument: "引数"
tutorial.draw.table.headings.description: "値"
tutorial.draw.table.headings.meaning: "意味"
tutorial.draw.table.instanceCount.meaning: "三角形を一つ描きます。"
tutorial.draw.table.vertexCount.meaning: "3 つの頂点を読み取ります。"
tutorial.draw.title: "描画コマンド"
tutorial.execution.description: "{firstTriangle} プロジェクトをビルドして実行します。"
tutorial.execution.details: "暗い背景の上に、上が赤、右下が緑、左下が青の三角形が表示されます。内部の色は頂点色を補間したもので、滑らかなグラデーションになります。"
tutorial.execution.guidance: "リサイズすると画像のピクセル寸法が変わりますが、頂点座標は変わりません。ビューポートは同じ座標を新しい幅と高さに対応付けるため、ウィンドウの縦横比を変えると三角形が伸縮します。"
tutorial.execution.title: "アプリケーションの実行"
tutorial.frame.commands.context: "{endRenderPass} の後、二回目の遷移で出力テクスチャを提示可能な状態にします。{submit} は記録を終えてコマンドを送信し、{wait} はその完了まで待機します。続く {present} が描画済み画像の表示を要求します。"
tutorial.frame.commands.description: "レンダーパスは、同じアタッチメントに書き込む描画操作をまとめます。このパスではスワップチェーンの drawable が色の出力先です。{colorAttachmentClear} は、アタッチメントを RGBA 色で初期化し、パス終了時に内容を保持するよう指定します。{beginRenderPass} は、この設定でパスを開始するコマンドを記録します。"
tutorial.frame.commands.details: "コレクションにはカラーアタッチメントを一つ入れます。{null} は深度ステンシルアタッチメントを使わない指定です。"
tutorial.frame.commands.guidance: "{beginRenderPass} は、アタッチメント全体を覆うビューポートとシザーを設定します。ビューポートは描画座標をピクセル位置に変換し、シザーは書き込める範囲を制限します。"
tutorial.frame.commands.title: "クリア、送信、提示"
tutorial.frame.description: "まず、ウィンドウを単色の背景で埋めます。この操作をクリアと呼びます。背景が表示されれば、サーフェス、コマンド送信、提示の流れが動いています。ここに三角形の頂点とシェーダーを加えていきます。"
tutorial.frame.details: "Silk.NET は描画のタイミングでコールバックを呼びます。この例では経過時間の引数を使わないため、パラメーター名を {value} にしています。コールバックを{emphasis}に登録します。"
tutorial.frame.details.emphasis: "{windowRun} の前"
tutorial.frame.target.description: "{graphicsQueueCommandBuffer} は記録可能なコマンドバッファーを返します。記録は GPU の処理を定義する段階であり、実行は送信後に始まります。"
tutorial.frame.target.details: "テクスチャレイアウトは、操作がテクスチャにどうアクセスするかを表します。最初の {transition} で、出力テクスチャをカラーアタッチメントとして使える状態にします。ここでの {default} は mip レベル 0 と配列レイヤー 0、つまり出力テクスチャの基本画像を選びます。このパスでは画像全体をクリアするため、{undefined} を指定して以前の内容を破棄できます。"
tutorial.frame.target.guidance: "提示すると別の画像に切り替わることがあるため、毎フレーム、現在の drawable を取得します。"
tutorial.frame.target.title: "drawable の準備"
tutorial.frame.title: "最初のフレーム"
tutorial.geometry.data.description: "頂点配列を{emphasis}に追加します。以後のリソース初期化も、説明する順序でこのコールバックの前に置きます。"
tutorial.geometry.data.description.emphasis: "{windowRender} の前"
tutorial.geometry.data.details: "各要素は {vertex} を作り、内側の二つの {new} が {vector3} の位置と {vector4} の色を渡します。位置は上、右下、左下の頂点です。頂点シェーダーで第四成分 {w} を加えます。w が 1 なので x と y は正規化デバイス座標でもあり、-1 と +1 が画像の端、0 が中央を表します。この意味はピクセル寸法に依存しません。"
tutorial.geometry.data.guidance: "各色は赤、緑、青、アルファの成分を持ち、アルファは 1 です。三つの頂点はすべて z = 0 で、同じ平面上にあります。"
tutorial.geometry.data.title: "頂点の位置と色"
tutorial.geometry.description: "三角形の各頂点には位置と色があります。GPU は三つの位置から形を決め、頂点色を補間して内部の色を求めます。"
tutorial.geometry.format.description: "頂点の宣言を{emphasis}に追加します。"
tutorial.geometry.format.description.emphasis: "{programCs} の末尾、解放処理の後"
tutorial.geometry.format.details: "{file} は型の使用範囲を {programCs} に限定し、{layoutKindSequential} はフィールドの宣言順を保ちます。{position} は三つの 32 ビット浮動小数点数を含み、バイトオフセット 0 から始まります。{color} は四つを含み、バイトオフセット 12 から始まります。したがって、頂点一つの大きさは 28 バイトです。後で入力レイアウトにこの配置を指定し、GPU が各フィールドを正しく読めるようにします。"
tutorial.geometry.format.imports: "ベクトル型と構造体のレイアウト属性を使うため、{programCs} の先頭に次の using ディレクティブを追加します。"
tutorial.geometry.format.title: "頂点の表現"
tutorial.geometry.title: "頂点データ"
tutorial.geometry.upload.context: "{fixed} は、配列のアドレスを使用している間、ガベージコレクターが配列を移動しないようにします。この CPU 書き込み可能なバッファーでは、{upload} がメモリをマッピングし、データをコピーして、マッピングを解除してから戻ります。そのため、配列の固定が必要なのは呼び出し中だけです。頂点は初期化時に一度アップロードし、バッファーは描画が終わるまで保持します。"
tutorial.geometry.upload.description: "描画時に GPU が読み取れるよう、頂点を {buffer} に格納します。配列の直後に、バッファーの確保とアップロードを追加します。"
tutorial.geometry.upload.details: "サイズは {sizeofVertexVerticesLength}、つまり 28 バイトの頂点三つで 84 バイトです。{bufferUsagesVertex} は頂点入力用途、{cpuWriteOnly} は CPU による直接初期化を許可します。記述のストライドは要素サイズを表します。各属性の読み方は、後で作る入力レイアウトが定めます。"
tutorial.geometry.upload.guidance: "確保しただけではデータは入りません。{upload} が、データ記述に渡した元ポインターとバイト数を使い、配列をバッファーのオフセット 0 にコピーします。"
tutorial.geometry.upload.imports: "Zenith.NET のバッファー型を {systemBuffer} と区別するため、{programCs} の using ディレクティブに {bufferAlias} を追加します。"
tutorial.geometry.upload.notes: "{programCs} 末尾の解放処理で、{swapChainDispose} の直前に {vertexBufferDispose} を加えます。大きな静的ジオメトリ向けの GPU 専用メモリと転送は{link}で説明します。"
tutorial.geometry.upload.notes.link: "リソース管理"
tutorial.geometry.upload.title: "バッファーの確保と転送"
tutorial.input.description: "GPU は位置や色などの頂点属性がどこにあるかを知る必要があります。入力レイアウトで各属性のフォーマットとバイトオフセットを指定し、ストライドで次の頂点までのバイト数を示します。シェーダー作成後に次のコードを加えます。"
tutorial.input.details: "{inputLayoutAdd} は属性を順番に並べ、各属性のサイズをストライドに加算します。オフセットは C# の構造体を調べて得るのではなく、ここで指定したフォーマットから計算されます。この二つのフィールドでは、次の配置になります。"
tutorial.input.guidance: "{semanticIndex} の既定値は 0 で、シェーダーの {pOSITION0} と {cOLOR0} に対応します。位置と色は一つの頂点バッファーに格納するため、パイプラインにはスロット 0 の入力レイアウトを一つ指定します。C# のフィールド順やパディングを変えた場合は、入力レイアウトも合わせて変更してください。"
tutorial.input.table.headings.byteOffset: "バイトオフセット"
tutorial.input.table.headings.cField: "C# フィールド"
tutorial.input.table.headings.format: "フォーマット"
tutorial.input.table.headings.shaderInput: "シェーダー入力"
tutorial.input.table.nextVertex.cField: "次の頂点"
tutorial.input.table.nextVertex.format: "合計ストライド：28 バイト"
tutorial.input.table.nextVertex.shaderInput: "次の入力レコード"
tutorial.input.table.vertexColor.format: "{float4} (16 バイト)"
tutorial.input.table.vertexPosition.format: "{float3} (12 バイト)"
tutorial.input.title: "頂点入力レイアウト"
tutorial.lifecycle.description: "各フレームは次の順で進みます。"
tutorial.lifecycle.details: "ウィンドウを閉じると {run} が戻り、解放処理へ進みます。各フレームで送信した処理の完了を待っているため、その処理で使用したリソースは解放できます。{windowRun} の後に置く解放処理の全体は次のとおりです。"
tutorial.lifecycle.guidance: "スワップチェーンはネイティブウィンドウを破棄する前に、コンテキストはそのリソースを解放した後に解放します。送信済みコマンドバッファーはキューが回収し、drawable はスワップチェーンが管理するため、どちらにも個別の {dispose} 呼び出しは不要です。"
tutorial.lifecycle.title: "フレームの流れと終了処理"
tutorial.pipeline.behavior: "入力レイアウトの後にパイプラインを作成します。"
tutorial.pipeline.context: "{cullNone} は面のカリングを無効にします。頂点が画面上で時計回りに並んでいても、反時計回りに並んでいても、三角形を描画します。"
tutorial.pipeline.description: "{graphicsPipeline} は、頂点レイアウト、二つのシェーダー、プリミティブの組み立てとアタッチメントへの出力設定をまとめます。"
tutorial.pipeline.details: "頂点とフラグメントの処理はシェーダーが担当します。パイプラインの残りの設定では、プリミティブの組み立て、面のカリング、深度テスト、ブレンドを指定します。"
tutorial.pipeline.guidance: "パイプラインのカラーフォーマットはパスのアタッチメントに合わせ、{swapChainDescFormat} から取得します。{count1} は一ピクセル一サンプルです。"
tutorial.pipeline.item: "{triangleList} は連続する三つの頂点を一組として、三角形を組み立てます。"
tutorial.pipeline.notes: "{depthNone} は深度テストと深度書き込みを無効にします。深度アタッチメントを使わないパスと対応します。"
tutorial.pipeline.reference: "{opaque} はブレンドを無効にします。三角形の内部では、フラグメントシェーダーの色が背景を置き換えます。"
tutorial.pipeline.title: "グラフィックスパイプライン"
tutorial.pipeline.usage: "シェーダーオブジェクトはパイプライン作成後に解放できます。パイプラインは描画中保持し、終了処理で {vertexBufferDispose} の前に {pipelineDispose} を加えます。"
tutorial.presentation.title: "グラフィックスコンテキストと提示"
tutorial.project.context: "プロジェクトのビルド設定で {emphasis}（{allowUnsafeBlocks}）を有効にします。ウィンドウ補助コードのネイティブ呼び出しと頂点の転送に unsafe コードが必要です。"
tutorial.project.context.emphasis: "アンセーフコードの許可"
tutorial.project.description: ".NET 10 を対象とする、{firstTriangle} という名前の C# コンソールプロジェクトを作成します。"
tutorial.project.details: "プロジェクトに次の NuGet パッケージを追加します。"
tutorial.project.guidance: "{zenithNET} が共通の描画 API を、三つのバックエンドパッケージが各実装を提供します。{zenithNETCompiler} は後で作る Slang シェーダーを対象バックエンド向けにコンパイルします。Silk.NET はウィンドウの作成とイベント処理を担当します。"
tutorial.project.title: "プロジェクトの準備"
tutorial.requirements.context: "{link}とその{detail}が、このチュートリアルの参照実装です。"
tutorial.requirements.context.detail: "共有ホスト"
tutorial.requirements.context.link: "Hello Triangle サンプル"
tutorial.requirements.description: "{emphasis} と C# の基礎知識が必要です。アプリケーションの対象フレームワークは {net10} です。GPU とドライバーは、プラットフォームごとに選ぶ次のバックエンドに対応している必要があります。"
tutorial.requirements.description.emphasis: ".NET 10 SDK"
tutorial.requirements.guidance: "Zenith.NET はアプリケーションから渡されたネイティブサーフェスへ描画します。Silk.NET.Windowing がウィンドウとイベントを管理します。macOS の提示には {cAMetalLayerCs} で表される Metal レイヤーを使い、補助コードがウィンドウへ取り付けます。"
tutorial.requirements.table.headings.graphicsBackend: "グラフィックスバックエンド"
tutorial.requirements.table.headings.platform: "プラットフォーム"
tutorial.requirements.table.linux.graphicsBackend: "Vulkan 1.4"
tutorial.requirements.table.linux.platform: "Linux（X11 または XWayland）"
tutorial.requirements.table.macOS.graphicsBackend: "Metal 4"
tutorial.requirements.table.macOS.platform: "macOS"
tutorial.requirements.table.windows.graphicsBackend: "DirectX 12"
tutorial.requirements.table.windows.platform: "Windows"
tutorial.requirements.title: "前提条件"
tutorial.resize.context: "アプリケーションをもう一度ビルドして実行します。リサイズしても背景がウィンドウ全体を覆うことを確認してください。新しいレンダーパスでは、変更後のアタッチメントの寸法からビューポートとシザーが設定されます。描画コールバックはそのまま残し、後でこのパスに三角形の描画を加えます。"
tutorial.resize.description: "フレームバッファーの寸法が変わったら、スワップチェーンも合わせて変更します。描画コールバックの後、{windowRun} の前に {framebufferResize} のコールバックを登録します。"
tutorial.resize.details: "ウィンドウの論理寸法ではなく、ピクセル単位の{link}を受け取ります。最小化によって幅か高さがゼロになった場合、リサイズコールバックはスワップチェーンを変更しません。描画コールバックも、どちらかの寸法がゼロの間はそのまま戻ります。有効な寸法に戻るまで描画を中断するためです。"
tutorial.resize.details.link: "フレームバッファーサイズの変化"
tutorial.resize.guidance: "描画コールバックは、送信したフレームの完了を待ってから {present} を呼びます。そのため、リサイズコールバックがスワップチェーンの画像を置き換える時点では、以前のフレームによる処理は終わっています。完了とリソースの寿命に関する条件は、{link}で詳しく説明します。"
tutorial.resize.guidance.link: "同期"
tutorial.resize.title: "リサイズ"
tutorial.shaders.compilation.context: "{appContextBaseDirectory} を使うと、コピーしたシェーダーをアプリケーションの出力ディレクトリから読み込みます。別の作業ディレクトリから起動しても、ファイルを探す場所は変わりません。"
tutorial.shaders.compilation.description: "{triangleSlang} のファイルプロパティで {emphasis} を {detail} に設定します。ビルド時にシェーダーが実行ファイルの隣へコピーされます。"
tutorial.shaders.compilation.description.detail: "新しい場合はコピーする"
tutorial.shaders.compilation.description.emphasis: "出力ディレクトリにコピー"
tutorial.shaders.compilation.details: "{programCs} に戻り、頂点のアップロード後、描画コールバック前にシェーダーの初期化を追加します。"
tutorial.shaders.compilation.guidance: "{zenithCompiler} は {contextGraphicsApi} のバックエンド向けにソースをコンパイルします。{createShader} は、コンパイル済みの記述からシェーダーオブジェクトを作成します。エントリーポイント名 {vSMain} と {fSMain} は、Slang ファイルに定義した二つの関数を選択します。"
tutorial.shaders.compilation.title: "シェーダーのコンパイル"
tutorial.shaders.context: "{fSInput} は二つのシェーダーステージをつなぎます。頂点シェーダーはクリップ空間の位置を {sVPOSITION} に書き込み、GPU はその位置から三角形の見える範囲を判断します。{cOLOR0} は頂点色を渡すフィールドです。色は三角形の内部で補間されてから、フラグメントシェーダーに届きます。両ステージで色の型とセマンティクスを一致させる必要があります。"
tutorial.shaders.description: "シェーダーは GPU 上で実行するプログラムです。頂点シェーダーは各頂点の位置を決め、フラグメントシェーダーは画像の覆われた位置の色を決めます。両ステージを一つの Slang ファイルに書き、それぞれにエントリーポイントを定義します。エントリーポイントは、そのステージの実行が始まる関数です。"
tutorial.shaders.details: "{triangleSlang} を作成し、次の入出力構造体を書きます。"
tutorial.shaders.fragment.description: "同じファイルにフラグメントのエントリーポイントを追加します。"
tutorial.shaders.fragment.details: "ラスタライズは三角形が画像を覆う範囲を調べ、その位置にフラグメントを生成します。各フラグメントの色は、三つの頂点色を補間して求めます。{fSMain} がその色を返し、{sVTARGET} が最初のカラーアタッチメントへの出力を指定します。"
tutorial.shaders.fragment.title: "フラグメントシェーダー"
tutorial.shaders.guidance: "{vSInput} は頂点シェーダーの入力です。{pOSITION0} と {cOLOR0} はセマンティクスによって属性を対応付けます。C# のフィールド名だけでは、この対応は決まりません。"
tutorial.shaders.title: "シェーダーステージ"
tutorial.shaders.vertex.description: "{triangleSlang} に頂点のエントリーポイントを追加します。"
tutorial.shaders.vertex.details: "GPU は入力頂点ごとにこの関数を呼びます。同次座標 {w} を追加し、色をそのまま渡します。頂点処理後に位置を w で割りますが、ここでは 1 なので x、y、z は変わらず、正規化デバイス座標として直接解釈できます。"
tutorial.shaders.vertex.title: "頂点シェーダー"
tutorial.surface.description: "ネイティブの提示先を{emphasis}に指定します。"
tutorial.surface.description.emphasis: "{windowCenter} の後、{windowRun} の前"
tutorial.surface.details: "フレームバッファーは、ウィンドウが表示するピクセル画像です。{surface} はネイティブの提示先と寸法を記述し、{framebufferSize} はピクセル単位のサイズを返します。表示倍率によっては、ウィンドウの論理サイズと異なります。"
tutorial.surface.guidance: "サーフェスにはバックエンドが必要とするネイティブハンドルを渡します。Windows は Win32 ウィンドウ、Linux は X11 のディスプレイとウィンドウ、macOS は取り付けた Metal レイヤーを使います。"
tutorial.surface.title: "ネイティブサーフェス"
tutorial.swapChain.context: "スワップチェーンはコンテキストとウィンドウの両方に依存します。{programCs} 末尾の {windowDispose} を次の解放順序に置き換えます。"
tutorial.swapChain.description: "サーフェス記述の直後にスワップチェーンを作成します。"
tutorial.swapChain.details: "{swapChain} はウィンドウが提示する画像を管理します。{drawable} は現在の画像を、API の画像リソースである {texture} として返します。描画後に {present} が表示を要求し、次の drawable へ進みます。"
tutorial.swapChain.guidance: "{b8G8R8A8UNorm} は青、緑、赤、アルファの順に各 8 ビットを格納します。{uNorm} は整数 0～255 を 0～1 に対応付けます。シェーダー出力は論理的な RGBA のままで、フォーマットは保存表現を定めます。パイプラインは {swapChainDescFormat} でこのアタッチメントに合わせます。"
tutorial.swapChain.title: "スワップチェーン"
tutorial.title: "最初の三角形"
tutorial.troubleshooting.description: "コンソールの診断と三段階の結果を使い、問題のある箇所を特定します。"
tutorial.troubleshooting.details: "{link}と{detail}で頂点データ、入力レイアウト、描画操作を照合できます。サンプルはウィンドウと送信を共通ホストへ分離していますが、このチュートリアルの処理は {programCs} にまとめています。{context}ではインデックス付き描画、変換、深度テストへ進みます。"
tutorial.troubleshooting.details.context: "回転する立方体"
tutorial.troubleshooting.details.detail: "Slang シェーダー"
tutorial.troubleshooting.details.link: "サンプルレンダラー"
tutorial.troubleshooting.table.backend.check: "選択したバックエンドがデバイスおよびインストールされているグラフィックスドライバーでサポートされていることを確認してください。"
tutorial.troubleshooting.table.backend.symptom: "バックエンドの作成に失敗する"
tutorial.troubleshooting.table.drawing.check: "アップロードサイズ、入力レイアウト、パイプラインの選択、およびレンダーパス内の描画コマンドの配置を確認してください。"
tutorial.troubleshooting.table.drawing.symptom: "背景は表示されるが三角形が表示されない"
tutorial.troubleshooting.table.headings.check: "確認事項"
tutorial.troubleshooting.table.headings.symptom: "症状"
tutorial.troubleshooting.table.input.check: "ストライドが 28 バイト、位置と色のオフセットがそれぞれ 0 と 12 バイトであることを確認します。"
tutorial.troubleshooting.table.input.symptom: "頂点の位置や色が破損している"
tutorial.troubleshooting.table.shaders.check: "コピーされた {triangleSlang}、エントリーポイントのスペル、およびコンパイラーが報告した診断情報を確認してください。"
tutorial.troubleshooting.table.shaders.symptom: "背景色は表示されるがシェーダーを読み込めない"
tutorial.troubleshooting.table.window.check: ".NET プロジェクトがビルドされ、ウィンドウ単体のステップがデスクトップセッションで実行されることを確認してください。Linux では、X11 または XWayland が利用可能であることを確認してください。"
tutorial.troubleshooting.table.window.symptom: "ウィンドウが開かない"
tutorial.troubleshooting.title: "問題の切り分け"
tutorial.window.description: "{cocoaHelperCs} をダウンロードしてプロジェクトに追加します。この補助クラスが macOS のウィンドウに Metal レイヤーを取り付けます。"
tutorial.window.details: "自動生成された {programCs} の内容を、次のコードに置き換えます。トップレベルステートメントを使うため、明示的な {main} メソッドを書かずに、上から順に実行できます。続く各節でコードを追加する位置を示します。"
tutorial.window.guidance: "{graphicsAPINone} で、グラフィックスコンテキストの作成を Zenith.NET に任せます。{initialize} はネイティブウィンドウを作り、ウィンドウシステムのハンドルを利用可能にします。{center} で画面中央に置き、{run} で閉じるまでイベントを処理します。その後、{dispose} でウィンドウを解放します。"
tutorial.window.notes: "アプリケーションをビルドして実行し、ウィンドウを開く、移動する、リサイズする、閉じるという操作を確認します。描画コマンドはまだ送信していないため、表示内容は未定義です。次へ進む前にウィンドウを閉じてください。"
tutorial.window.title: "ウィンドウの作成"
