tutorial.requirements.title: 始める前に
tutorial.resize.context: "{dotnetRun} を再度実行してください。ウィンドウは均一な暗い背景色になり、リサイズ後も塗りつぶされた状態が維持されるはずです。このコールバックは保持してください。三角形はこの既存のレンダーパス内で描画されます。"
tutorial.resize.description: "スワップチェーンの画像はフレームバッファーのサイズに従う必要があります。{framebufferResize} を使用して、ディスプレイのスケーリングによる変化を含め、ピクセルサイズの変化に対応します。描画コールバックの後、引き続き {windowRun} の前に次を追加します:"
tutorial.resize.details: Silk.NET はウィンドウサイズの変化と {link} を区別します。スワップチェーンはピクセルを格納するため、後者が必要です。最小化されたウィンドウではフレームバッファーのサイズがゼロになることがあります。その場合、両方のコールバックは GPU の処理をスキップします。リサイズ後、レンダーパスはそのビューポートとシザーに新しいアタッチメントサイズを使用します。
tutorial.resize.details.link: フレームバッファーサイズの変化
tutorial.resize.guidance: サブミットごとに待機するため、リサイズハンドラーが画像を置き換える際に、以前のフレームがその画像を使用していることはありません。現在の {present} 実装もグラフィックスキューで待機します。このシンプルなループにより、次のフレームが開始する前に 1 つのフレームの処理が確実に完了します。より高度なスケジューリングについては {link} で解説しています。
tutorial.resize.guidance.link: 同期
tutorial.resize.title: リサイズに対応する
tutorial.shaders.compilation.context: コンパイルは初期化中に 1 回だけ行われます。{appContextBaseDirectory} は現在の作業ディレクトリに関係なく、実行可能ファイルの横にあるコピーされたシェーダーを見つけます。これらのシェーダーは頂点入力のみを消費するため、定数バッファー、テクスチャ、リソースハンドルをバインドする必要はまだありません。
tutorial.shaders.compilation.description: "{triangleSlang} のファイルプロパティで、{emphasis} を {detail} に設定します。これにより、シェーダーが実行可能ファイルの横で使用可能になります。"
tutorial.shaders.compilation.description.detail: 新しい場合はコピーする
tutorial.shaders.compilation.description.emphasis: 出力ディレクトリにコピー
tutorial.shaders.compilation.details: "{programCs} に戻ります。頂点アップロードの後、描画コールバックの前にこれらの初期化ステートメントを追加します:"
tutorial.shaders.compilation.guidance: "{zenithCompiler} は要求されたグラフィックス API 用のコードを含むシェーダー記述を返します。{createShader} は対応するバックエンドオブジェクトを作成します。グラフィックス API とエントリポイント名の両方が重要です。{contextGraphicsApi} を使用し、{vSMain} と {fSMain} は Slang ファイルと完全に同じスペルで指定してください。"
tutorial.shaders.compilation.title: 選択したバックエンド用にコンパイルする
tutorial.shaders.context: "{fSInput} は、頂点シェーダーの出力とフラグメントシェーダーの入力を接続します。頂点シェーダーによって書き込まれた場合、{sVPOSITION} はクリップ空間の位置を提供します。これは、GPU が可視画像の内側にあるものを判定するために使用する 4 つの座標です。{cOLOR0} は頂点間で補間する色を伝達します。2 つのステージはその型とセマンティクスで一致している必要があります。"
tutorial.shaders.description: シェーダーは GPU によって実行されるプログラムです。この描画には、頂点を配置する頂点シェーダーと、三角形の内側の色を生成するフラグメントシェーダーが必要です。これらをシェーダー言語である Slang で記述し、同じファイルから 2 つのエントリポイントをコンパイルします。エントリポイントとは、シェーダーステージの実行が開始される関数です。
tutorial.shaders.details: "次の 2 つの構造体から始めて、{triangleSlang} を作成します:"
tutorial.shaders.fragment.description: "同じファイルにフラグメントエントリポイントを追加します:"
tutorial.shaders.fragment.details: ラスタライズによって、三角形がカバーする画像領域が決定されます。カバーされた領域全体にわたって頂点色が補間され、フラグメントシェーダーによって処理されるデータであるフラグメントが生成されます。{fSMain} は {sVTARGET} を介してこの補間された色を返します。これは最初のカラーアタッチメントを識別します。
tutorial.shaders.fragment.guidance: 頂点色の補間はアタッチメントのブレンディングとは別個の処理です。ブレンディングは、フラグメントの出力とアタッチメントにすでに格納されている色を結合します。今回の不透明ブレンド状態はその結合を無効にするため、三角形の内側では補間された色が背景を置き換えます。
tutorial.shaders.fragment.title: フラグメントを着色する
tutorial.shaders.guidance: "{vSInput} は、頂点シェーダーが頂点バッファーから受け取る内容を記述します。セマンティクス {pOSITION0} と {cOLOR0} が入力を識別します。C# のフィールド名だけではそのマッピングは確立されません。"
tutorial.shaders.title: 2 つのシェーダーステージを作成する
tutorial.shaders.vertex.description: "頂点エントリポイントを {triangleSlang} に追加します:"
tutorial.shaders.vertex.details: "GPU は入力頂点ごとにこのエントリポイントを呼び出します。位置に同次座標 {w} を加え、色を引き渡します。頂点ステージの後で位置は w で除算されますが、ここでは x、y、z は変化しません。そのため、上で選んだ位置を正規化デバイス座標として直接理解できます。"
tutorial.shaders.vertex.title: 各頂点を配置する
tutorial.surface.description: "コンテキストは、出力を表示する場所も認識する必要があります。以下を {emphasis} に追加します:"
tutorial.surface.description.emphasis: "{windowCenter} の後、{windowRun} の前"
tutorial.surface.details: "{surface} はネイティブプレゼンテーションターゲットとそのピクセルサイズを記述します。フレームバッファーは、ウィンドウに関連付けられたピクセル画像です。{framebufferSize} はそのピクセル単位のサイズを示します。ディスプレイのスケーリングが有効な場合、ウィンドウの論理サイズとは異なることがあります。"
tutorial.surface.guidance: サーフェスは上で選択したバックエンドと一致します。Windows はウィンドウハンドルを提供し、Linux は X11 ディスプレイとウィンドウを提供し、macOS ヘルパーは接続された Metal レイヤーを提供します。これはウィンドウをレンダリングに接続するための唯一のプラットフォーム固有の部分です。
tutorial.surface.title: ネイティブサーフェスを記述する
tutorial.swapChain.context: "スワップチェーンはコンテキストとネイティブウィンドウの両方を使用します。{programCs} の末尾にある {windowDispose} の行を、次のクリーンアップ順序に置き換えます:"
tutorial.swapChain.description: "サーフェスの記述を使用して、表示される画像を作成します。サーフェスブロックの直後に以下を追加してください:"
tutorial.swapChain.details: "{swapChain} はウィンドウに表示される画像を管理します。各フレームで、{drawable} は画像データの API 型である {texture} として現在の画像を提供します。描画後、{present} は結果の表示を要求し、次の drawable へ進みます。"
tutorial.swapChain.guidance: "{b8G8R8A8UNorm} は、青、緑、赤、アルファの順序で 4 つの 8 ビットカラーチャンネルを格納します。{uNorm} は、0 から 255 の整数値が 0 から 1 の値を表すことを意味します。シェーダーは論理的な RGBA 値を返しますが、この形式によって画像内でのチャンネルの格納方法が決まります。後ほどグラフィックスパイプラインは {swapChainDescFormat} を使用してこのアタッチメントと一致させます。"
tutorial.swapChain.title: スワップチェーンを作成する
tutorial.title: 最初の三角形
tutorial.troubleshooting.description: "まずコンソールでエラーを確認し、前のチェックポイントを使用して失敗したステージを特定します:"
tutorial.troubleshooting.details: "{link} と {detail} を使用して、頂点データ、入力レイアウト、描画操作を比較してください。そのサンプルではウィンドウ処理とサブミットを共有ホストに配置していますが、このチュートリアルではアプリケーションフローを {programCs} 内に保持しています。インデックス描画、変換、深度テストを学習するには、{context} に進んでください。"
tutorial.troubleshooting.details.context: 回転する立方体
tutorial.troubleshooting.details.detail: Slang シェーダー
tutorial.troubleshooting.details.link: サンプルレンダラー
tutorial.troubleshooting.table.backend.check: 選択したバックエンドがデバイスおよびインストールされているグラフィックスドライバーでサポートされていることを確認してください。
tutorial.troubleshooting.table.backend.symptom: バックエンドの作成に失敗する
tutorial.troubleshooting.table.drawing.check: アップロードサイズ、入力レイアウト、パイプラインの選択、およびレンダーパス内の描画コマンドの配置を確認してください。
tutorial.troubleshooting.table.drawing.symptom: 背景は表示されるが三角形が表示されない
tutorial.troubleshooting.table.headings.check: 確認事項
tutorial.troubleshooting.table.headings.symptom: 症状
tutorial.troubleshooting.table.input.check: "28 バイトの ストライド と、0 および 12 の位置／色のオフセットを確認してください。"
tutorial.troubleshooting.table.input.symptom: 頂点の位置や色が破損している
tutorial.troubleshooting.table.shaders.check: コピーされた {triangleSlang}、エントリポイントのスペル、およびコンパイラが報告した診断情報を確認してください。
tutorial.troubleshooting.table.shaders.symptom: クリア色のステップは機能するが、シェーダーの読み込みに失敗する
tutorial.troubleshooting.table.window.check: .NET プロジェクトがビルドされ、ウィンドウ単体のステップがデスクトップセッションで実行されることを確認してください。Linux では、X11 または XWayland が利用可能であることを確認してください。
tutorial.troubleshooting.table.window.symptom: ウィンドウが開かない
tutorial.troubleshooting.title: 失敗したステージを確認する
tutorial.window.context: "{usingZenithTutorials} はヘルパーの名前空間をインポートします。各 C# ファイルは通常の using ディレクティブを使用するため、相互運用機能のインポートは両方のファイルで必要です。エイリアス {buffer} は Zenith.NET のバッファー型を指し、{systemBuffer} と区別します。"
tutorial.window.description: "{cocoaHelperCs} を名前空間を維持したままプロジェクトに追加します。そのファイルの先頭、名前空間宣言の前に {interopUsing} を追加してください。このヘルパーは macOS で Metal レイヤーをウィンドウに接続します。他のプラットフォームブランチではこれを呼び出しません。"
tutorial.window.details: "生成された {programCs} を次のコードに置き換えます。明示的な {main} メソッドなしで順番に実行される最上位レベルのステートメントを使用しています。以降のセクションで、この同じファイルにコードを追加する場所を説明します:"
tutorial.window.guidance: "{graphicsAPINone} は、Silk.NET に独自のグラフィックスコンテキストを持たないウィンドウを作成するよう要求します。そのコンテキストは Zenith.NET で作成します。{initialize} はネイティブウィンドウを作成し、そのハンドルを使用可能にします。ハンドルとは、ウィンドウシステムによって提供される識別子です。{center} はウィンドウを中央に配置し、{run} はウィンドウが閉じるまでイベントを処理します。その後、実行はウィンドウを解放する {dispose} に進みます。"
tutorial.window.notes: "{dotnetRun} を実行してください。空のウィンドウが開き、移動、サイズ変更、閉じる操作に応答するはずです。レンダリングコマンドをまだサブミットしていないため、内容はまだ定義されていません。確認したら閉じて次に進んでください。"
