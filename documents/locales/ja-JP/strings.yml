concepts.platforms.surface.table.wayland.backend: "ネイティブ Wayland ホストを使用した Vulkan。"
concepts.platforms.surface.table.wayland.handles: "Wayland ディスプレイおよびサーフェス"
concepts.platforms.surface.table.win32.backend: "Windows 上の DirectX 12 または Vulkan。"
concepts.platforms.surface.table.xlib.backend: "X11 または XWayland を使用した Linux 上の Vulkan。"
concepts.platforms.surface.table.xlib.handles: "X11 ディスプレイおよびウィンドウ"
concepts.platforms.surface.title: "ネイティブの提示サーフェス"
concepts.platforms.title: "プラットフォーム統合"
concepts.resources.allocation.context: "ヒープに配置したリソースは、その寿命全体にわたってヒープの記憶領域を使います。最後の GPU 使用が終わったら、リソースを先に解放し、その後ヒープを解放します。"
concepts.resources.allocation.description: "アプリケーションでメモリ割り当てを管理する場合は、{heap} を使います。ヒープは、指定したバイトオフセットにリソースを配置する記憶領域です。オフセットの選択と使用領域の管理はアプリケーションが行います。"
concepts.resources.allocation.details: "各リソースの作成に使うバッファーまたはテクスチャ記述を渡して、{contextGetSizeAndAlignment} を呼びます。返されたアラインメントの倍数となるオフセットに、返されたサイズ分の領域を確保します。領域はヒープ内に収め、使用中の別の割り当てと重ねてはいけません。テクスチャにはバックエンド固有のパディングが含まれる場合があるため、ピクセル数とピクセル当たりのバイト数だけでは割り当てサイズを算出できません。"
concepts.resources.allocation.guidance: "ヒープに配置するバッファーは、そのヒープと同じ常駐区分を指定します。テクスチャの格納には GPU 専用ヒープを使います。"
concepts.resources.allocation.title: "ヒープへの配置"
concepts.resources.bufferUsages.table.constant.role: "定数バッファーバインドを介して読み取られるシェーダーパラメーター。"
concepts.resources.bufferUsages.table.headings.role: "役割"
concepts.resources.bufferUsages.table.headings.usage: "用途"
concepts.resources.bufferUsages.table.index.role: "インデックス描画で使用されるインデックス。"
concepts.resources.bufferUsages.table.indirect.role: "間接描画または間接ディスパッチのコマンドが読み取る引数。"
concepts.resources.bufferUsages.table.none.role: "バッファーの用途フラグは宣言されていません。"
concepts.resources.bufferUsages.table.storageReadOnly.role: "読み取り専用のシェーダーバインドを介してアクセスするバッファーデータ。"
concepts.resources.bufferUsages.table.storageReadWrite.role: "読み書き可能なシェーダーバインドを介してアクセスするバッファーデータ。"
concepts.resources.bufferUsages.table.transferDst.role: "GPU コピーの転送先ストレージ。"
concepts.resources.bufferUsages.table.transferSrc.role: "GPU コピーの転送元データ。"
concepts.resources.bufferUsages.table.vertex.role: "描画のためにフェッチされる頂点属性。"
concepts.resources.bufferUsages.title: "バッファーの用途"
concepts.resources.description: "リソース記述は、アプリケーションが記憶領域をどう使えるかを定めます。例えば、描画先にし、シェーダーでサンプリングし、CPU に読み戻すテクスチャには、三つの操作に対応する用途フラグが必要です。メモリ配置は CPU のアクセス方法を決めます。データにアクセスできる時点や記憶領域を解放できる時点は、同期と寿命の管理によって決まります。"
concepts.resources.memory.context: "CPU からアクセスできるバッファーでは、{map} がデータを読み書きするためのアドレスを提供します。マッピングも {unmap} も、GPU の処理を待機しません。GPU が書いた結果を CPU で読む前にはその書き込みを待ち、同じバイトを書き換える前には、その領域への GPU アクセスが終わるのを待ちます。"
concepts.resources.memory.description: "{bufferDesc} の {residency} は、想定する CPU アクセスを指定します。"
concepts.resources.memory.details: "常駐区分は CPU アクセスの要件を表します。CPU と GPU が物理メモリを共有するシステムでも、この区分を使います。三角形では {cpuWriteOnly} を使い、小さな頂点バッファーを直接初期化します。大きな静的ジオメトリでは、GPU 専用の記憶領域へアップロードする方が適している場合があります。"
concepts.resources.memory.guidance: "コンテキストから直接作成したテクスチャは GPU の記憶領域を使うため、{textureDesc} に常駐区分のフィールドはありません。CPU メモリとのデータ交換には、アップロードとリードバックを使います。"
concepts.resources.memory.table.cpuReadOnly.cPUAccess: "読み取りのみ"
concepts.resources.memory.table.cpuReadOnly.typicalRole: "CPU へ読み戻すために GPU が生成したデータ"
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: "書き込みのみ"
concepts.resources.memory.table.cpuWriteOnly.typicalRole: "CPU が供給または更新するデータ"
concepts.resources.memory.table.gpuOnly.cPUAccess: "なし"
concepts.resources.memory.table.gpuOnly.typicalRole: "静的ジオメトリと GPU の作業用データ"
concepts.resources.memory.table.headings.cPUAccess: "想定する CPU アクセス"
concepts.resources.memory.table.headings.residency: "常駐区分"
concepts.resources.memory.table.headings.typicalRole: "典型的な役割"
concepts.resources.memory.title: "CPU アクセスとメモリ配置"
concepts.resources.textureUsages.description: "転送フラグは、リソースを GPU コピーの転送元または転送先として使うことを宣言します。CPU から直接アクセスできるかどうかは、メモリ配置によって別途決まります。"
concepts.resources.textureUsages.details: "用途フラグは、テクスチャを何に使えるかを宣言します。用途を切り替える際は、それに応じた{link}が必要です。また、使用するデバイスが、指定したテクスチャフォーマットでその用途をサポートしている必要があります。"
concepts.resources.textureUsages.details.link: "レイアウトと同期"
concepts.resources.textureUsages.table.colorAttachment.role: "レンダーパスのカラーアタッチメント。"
concepts.resources.textureUsages.table.depthStencilAttachment.role: "レンダーパスの深度／ステンシルアタッチメント。"
concepts.resources.textureUsages.table.headings.role: "役割"
concepts.resources.textureUsages.table.headings.usage: "用途"
concepts.resources.textureUsages.table.none.role: "テクスチャの用途フラグは宣言されていません。"
concepts.resources.textureUsages.table.sampled.role: "サンプリング用テクスチャのバインドを介して読み取るテクスチャデータ。"
concepts.resources.textureUsages.table.storage.role: "ストレージテクスチャのバインドを介してシェーダーが読み書きするテクスチャデータ。"
concepts.resources.textureUsages.table.transferDst.role: "GPU コピーの転送先画像ストレージ。"
concepts.resources.textureUsages.table.transferSrc.role: "GPU コピーの転送元画像データ。"
concepts.resources.textureUsages.title: "テクスチャの用途"
concepts.resources.title: "リソース管理"
concepts.resources.transfers.context: "リードバックでは、まず GPU データを内部の読み戻し領域へコピーします。ライブラリは完了したコマンドバッファーを回収するときに、そのデータを指定した CPU の宛先へコピーします。リードバックの送信値に対して {wait} を呼ぶと、両方の処理が完了します。戻るまで宛先を確保したままにし、管理対象メモリは固定してください。"
concepts.resources.transfers.description: "アップロードは CPU データを GPU リソースへコピーし、リードバックはリソースのデータを CPU メモリへコピーします。バッファーとテクスチャの次のメソッドは、転送を完了してから戻ります。"
concepts.resources.transfers.details: "呼び出す前に、他のキューとの競合するアクセスを解消します。メソッド内の待機は自身の転送だけを対象とし、他のキューとの依存関係を設定するものではありません。マッピングしたメモリを直接コピーする場合は、競合する GPU アクセスの完了を呼び出し側で待つ必要があります。"
concepts.resources.transfers.guidance: "他の GPU 処理とまとめて転送を送信するには、{commandBufferUpload} または {commandBufferDownload} で記録します。アップロードの転送元とリードバックの転送先では、メモリを有効に保つ必要のある期間が異なります。"
concepts.resources.transfers.item: "アップロードの呼び出し中に、ライブラリは元データをステージングメモリと呼ばれる内部の一時領域へコピーします。GPU は後でこの領域を読むため、アプリケーションの元ポインターが必要なのは、呼び出しが戻るまでです。"
concepts.resources.transfers.notes: "テクスチャ転送の行ストライドは、CPU データの隣り合う行の間隔をバイトで表します。スライスストライドは、深さ方向に隣り合うスライスの間隔です。転送処理はこれらの値を使い、CPU データとテクスチャの GPU 記憶領域との間でコピーします。GPU の完了と宛先へのコピーが別の段階になる理由は、{link}で説明します。"
concepts.resources.transfers.notes.link: "同期"
concepts.resources.transfers.table.bufferDownload.transfer: "{cpuReadOnly} では、マッピングしたメモリから直接コピーします。それ以外は転送キューにリードバックを送信し、完了を待ちます。"
concepts.resources.transfers.table.bufferUpload.transfer: "{cpuWriteOnly} では、マッピングしたメモリへ直接コピーします。それ以外は転送キューにアップロードを送信し、完了を待ちます。"
concepts.resources.transfers.table.headings.method: "方法"
concepts.resources.transfers.table.headings.transfer: "転送の動作"
concepts.resources.transfers.table.textureTransfers.method: "{textureUpload} / {textureDownload}"
concepts.resources.transfers.table.textureTransfers.transfer: "コピーとテクスチャ遷移をグラフィックスキューに送信し、完了を待ちます。終了時には、選択したサブリソースが指定した最終レイアウトになります。"
concepts.resources.transfers.title: "即時転送とコマンドへの記録"
concepts.resources.usages.description: "{bufferUsages} と {textureUsages} は、リソースの用途を宣言するフラグ列挙型です。それぞれ {bufferDescUsages} と {textureDescUsages} に設定します。複数の用途には、必要なメンバーを {value} で組み合わせます。"
concepts.resources.usages.title: "リソースの用途"
concepts.resources.views.description: "{bufferView} はバッファーの範囲とデータの解釈方法を記述します。{textureView} はサブリソース範囲と、互換性のあるテクスチャ種別やフォーマットを選択します。どちらも既存の記憶領域を参照し、その作成時に宣言した用途に従います。ビューの範囲はアクセス範囲を示すものであり、シェーダーの境界検査が全バックエンドで同じように働くことを保証するものではありません。"
concepts.resources.views.details: "リソース自身のハンドルは既定のビューを提供します。別の範囲や互換性のある解釈方法を選ぶ場合は、独立したビューを作成します。ビューと元リソースはどちらも、GPU が使い終わるまで保持してください。ハンドルだけでは、どちらのオブジェクトも保持されません。いずれかを置き換えたら、古い{link}を含む定数も更新します。"
concepts.resources.views.details.link: "リソースハンドル"
concepts.resources.views.title: "ビューと参照先リソース"
concepts.shaders.binding.context: "コンピュートのサンプルでは、{input} に {inputTextureSampledHandle}、{output} に {outputTextureStorageHandle} を設定します。Slang の {descriptorHandle} の型引数が、各リソースへのアクセス方法を定めます。"
concepts.shaders.binding.description: "{setConstantBuffer} は、現在のパイプラインが定数を読み取るバッファーとバイトオフセットを選択します。シェーダーが使う前に、パラメーターのデータをその領域へアップロードします。以前の GPU 処理が同じ領域をまだ読んでいる場合は、完了を待ってから更新してください。"
concepts.shaders.binding.details: "コマンドバッファー、コンピュートパイプライン、データを設定した定数バッファー、スレッドグループ数が用意できたら、次の順にディスパッチを記録します。定数バッファーは選択中のパイプラインにバインドされるため、先にパイプラインを選択します。"
concepts.shaders.binding.guidance: "ここでは {commandBuffer} に、{computePipeline} と {constantBuffer} のパラメーターを使うディスパッチを記録しています。定数バッファーには {bufferUsagesConstant} の用途が必要で、オフセット 0 はその先頭を指定します。一つのバッファーを複数の定数レコードで共有する場合、各開始オフセットはバックエンドのバインド時アラインメント要件にも従います。これは、レコード内部のフィールド配置とは別の要件です。"
concepts.shaders.binding.notes: "{resourceHandle} は二つの 32 ビットフィールドを持ち、解釈はバックエンドに依存します。値はリソースを作成したコンテキスト内でのみ有効です。"
concepts.shaders.binding.reference: "ハンドルの取得元リソースとビューは、シェーダーの最後のアクセスが完了するまで保持します。テクスチャやビューの置換後は、古いハンドルを含む定数を更新してください。所有権の規則は{link}で説明します。"
concepts.shaders.binding.reference.link: "リソース管理"
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: "シェーダー型 {t} の構造化要素の読み取り"
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: "シェーダー型 {t} の構造化要素の読み書き"
concepts.shaders.binding.table.headings.access: "想定されるアクセス"
concepts.shaders.binding.table.headings.cHandle: "C# ハンドル"
concepts.shaders.binding.table.headings.slangFieldType: "Slang フィールド型"
concepts.shaders.binding.table.samplerHandle.access: "テクスチャのサンプリング状態"
concepts.shaders.binding.table.textureSampledHandle.access: "テクスチャの読み取り"
concepts.shaders.binding.table.textureStorageHandle.access: "ストレージテクスチャの読み書き"
concepts.shaders.binding.title: "定数バッファーとリソースハンドル"
concepts.shaders.compilation.description: "{zenithCompiler} は Slang の指定エントリーポイントを {shaderDesc} にコンパイルします。コンテキストの {graphicsApi} に応じ、DirectX 12 には DXIL、Metal には Metal ライブラリ、Vulkan には SPIR-V を生成します。"
concepts.shaders.compilation.details: "{context} という名前のグラフィックスコンテキストを作成してから、実行ファイルと同じディレクトリにコピーした三角形のシェーダーをコンパイルします。"
concepts.shaders.compilation.guidance: "エントリーポイント名 {vSMain} は、シェーダーファイル内の宣言と一致させます。シェーダーのコンパイルとパイプラインの作成は初期化時に行い、描画中はパイプラインを再利用します。作成が終われば、{link}で示すようにシェーダーオブジェクトを解放できます。"
concepts.shaders.compilation.guidance.link: "最初の三角形"
concepts.shaders.compilation.title: "シェーダーのコンパイル"
concepts.shaders.description: "C# と Slang の宣言では、各値をどこに格納し、シェーダーがどうアクセスするかを一致させます。頂点入力レイアウトは頂点属性を、シェーダーバッファーの宣言はパラメーターや配列を記述します。リソースハンドルは、シェーダーが使うリソースを識別します。"
concepts.shaders.dispatch.description: "{dispatch} は、実行するスレッドグループ数を指定します。コンピュートサンプルでは {numthreads} を宣言しているため、一グループは 16 × 16 スレッドです。画像の幅と高さをそれぞれ 16 で割って切り上げると、画像全体を覆えます。17 × 19 の画像には 2 × 2 グループが必要です。シェーダーで各スレッドの座標を調べ、画像の外側なら処理を省きます。"
concepts.shaders.dispatch.details: "宣言したグループサイズは {shaderDescThreadGroupSize} から取得でき、{dispatch} に渡すグループ数の計算に使えます。計算の全体は {computeShaderRendererCs} で確認できます。ディスパッチ後の画像へのアクセスは、{link}の要件に従います。"
concepts.shaders.dispatch.details.link: "同期"
concepts.shaders.dispatch.title: "スレッドグループ"
concepts.shaders.layout.context: "{link}では、画像の寸法と二つのテクスチャハンドルを使ってこの配置を示しています。各フィールドの開始位置はオフセットで明示します。次の宣言では {systemRuntimeInteropServices} と {zenithNET} の名前空間を使用します。"
concepts.shaders.layout.context.link: "コンピュートサンプルの C# 定数"
concepts.shaders.layout.description: "頂点入力の {inputLayout} は、各属性のフォーマット、オフセット、セマンティクスと、頂点間のストライドを記述します。三角形では {float3} の位置の後に {float4} の色を置きます。色のバイトオフセットは 12、頂点一つのサイズは 28 バイトです。{inputLayoutAdd} は属性のフォーマットからこの密な配置を計算します。C# の構造体にパディングがある場合は、それを含めたオフセットとストライドを指定してください。"
concepts.shaders.layout.details: "定数バッファーはシェーダーのパラメーターを、構造化バッファーは型付き要素の配列を格納します。これらの配置は {inputLayout} ではなく、Slang の宣言に従います。C# のフィールドオフセット、要素サイズ、パディングを、コンパイル済みシェーダーの配置に合わせてください。C# のアンマネージ型はバイト列としてコピーできますが、そのメモリ配置がシェーダーの配置と一致するとは限りません。頂点内で密に格納した {float3} も、シェーダーバッファーでは別のアラインメントが必要になる場合があります。"
concepts.shaders.layout.guidance: "シェーダーのパラメーターには、数値とともにリソースハンドルを含められます。ハンドルは既存の記憶領域を指すため、定数バッファーにコピーしてもリソースの内容はコピーされません。"
concepts.shaders.layout.notes: "{computeShaderSlang} の対応する宣言は次のとおりです。"
concepts.shaders.layout.reference: "二つの寸法値が先頭の 8 バイトを占め、その後に二つの 8 バイトのハンドルが続きます。C# サンプルはレコード全体に 256 バイトを確保します。別のレコードでは、フィールドの内容と必要な配置、アラインメントからサイズを決めます。"
concepts.shaders.layout.title: "データ配置"
concepts.shaders.matrices.description: "コンパイラーは行ごとに連続する行優先の行列配置を選択します。{link}では三つの {matrix4x4} をオフセット 0、64、128 に格納します。対応する{detail}では、{mulVectorMatrix} をモデル、ビュー、投影の順に適用します。"
concepts.shaders.matrices.description.detail: "シェーダー"
concepts.shaders.matrices.description.link: "回転する立方体のレンダラー"
concepts.shaders.matrices.details: "格納順序はメモリ内の行列要素の配置を、乗算順序は変換を定めます。C# と Slang で対応する規約を使います。"
concepts.shaders.matrices.title: "行列の規約"
concepts.shaders.title: "シェーダーデータとバインド"
concepts.synchronization.backends.description: "DirectX 12 と Vulkan は、テクスチャ遷移をレイアウトとアクセスの変更として記録します。Zenith.NET の Metal バックエンドでは、{transition} に相当する GPU 操作はありません。代わりにコマンドを描画・計算エンコーダーにまとめ、エンコーダー終了時に可視性バリアを挿入します。連続するコンピュートディスパッチなど、同じエンコーダー内の依存には明示的な {barrier} 呼び出しを使います。"
concepts.synchronization.backends.details: "{link}では、グラフィックスのレンダーパスを開始すると計算エンコーダーが終了し、計算結果を描画処理から読み取れるようになります。連続する二つのコンピュートディスパッチは同じエンコーダー内にとどまるため、間にテクスチャ遷移を記録しても、依存を指定するバリアが必要です。このため、複数のバックエンドで使うコマンド列では、レイアウトとアクセス依存の両方を扱います。"
concepts.synchronization.backends.details.link: "コンピュートサンプル"
concepts.synchronization.backends.title: "バックエンドごとの動作"
concepts.synchronization.barriers.context: "関係するアクセスを含み、キューが対応しているステージを選びます。{barrierStagesAll} は対応するすべてのステージを含みます。依存関係が一部のステージだけに関わる場合は、その範囲に限定できます。"
concepts.synchronization.barriers.description: "同じコマンドバッファーに記録した二つのコンピュートディスパッチで、最初がシミュレーションデータを書き、次がそれを読む場合を考えます。その間にバリアを置くと、後のディスパッチが完了済みの書き込み結果を読み取れます。ストレージバッファーでは、テクスチャレイアウトを遷移させずにアクセスを順序付けられます。"
concepts.synchronization.barriers.details: "最初の引数はデータを生成したステージ、二つ目はそれを使用するステージを指定します。この二つで、ディスパッチ間に必要な実行順序とメモリの可視性を表します。"
concepts.synchronization.barriers.guidance: "{link}では、シミュレーションの各段階の間にこの形のバリアを置きます。どのバリアも、データを生成するディスパッチの後、使用するディスパッチの前に記録します。"
concepts.synchronization.barriers.guidance.link: "FluidTank シミュレーション"
concepts.synchronization.barriers.title: "パイプラインバリア"
concepts.synchronization.dependencies.description: "各リソースで、同じデータに触れるアクセスを確認します。一方でも書き込みを行う場合は、必要な順序を保ちます。二つの読み取りは競合しませんが、テクスチャレイアウトや提示の要件は満たす必要があります。CPU からの更新やリソースの解放も、対象領域を GPU が使い終わるまで待ちます。"
concepts.synchronization.dependencies.details: "操作の実行場所に応じて、使う仕組みを選びます。"
concepts.synchronization.dependencies.guidance: "一つの処理に複数の同期手段が必要な場合もあります。例えば、別のキューで生成したテクスチャには、送信間の依存関係と、次の用途に適したレイアウトの両方が必要です。どちらも、それ自体は CPU の待機を必要としません。CPU がデータにアクセスしたり解放したりする場合に、CPU 側で待機します。"
concepts.synchronization.dependencies.table.cpuAccess.mechanism: "該当する完了値に対して {wait} を呼び出します。"
concepts.synchronization.dependencies.table.cpuAccess.situation: "CPU のアクセスやリソース解放に GPU の完了が必要な場合"
concepts.synchronization.dependencies.table.crossQueue.mechanism: "生成側の {timelineValue} を使用側の {submit} に渡します。"
concepts.synchronization.dependencies.table.crossQueue.situation: "別のキューで生成したデータを使用する場合"
concepts.synchronization.dependencies.table.headings.mechanism: "メカニズム"
concepts.synchronization.dependencies.table.headings.situation: "状況"
concepts.synchronization.dependencies.table.layoutChange.mechanism: "以前のレイアウトと次のレイアウトを指定した {commandBufferTransition}。"
concepts.synchronization.dependencies.table.layoutChange.situation: "テクスチャサブリソースの使用方法の変更"
concepts.synchronization.dependencies.table.pipelineStages.mechanism: "生成側ステージと使用側ステージを指定した {commandBufferBarrier}。"
concepts.synchronization.dependencies.table.pipelineStages.situation: "コマンドストリーム内の依存する GPU ステージ"
concepts.synchronization.dependencies.title: "アクセス間の依存"
concepts.synchronization.description: "同期は、共有データへのアクセス順序を定め、後の操作が必要な結果を読み取れるようにします。書き込みから読み取りへの依存では、書き込む側を生成側、読む側を使用側と呼びます。バリアとテクスチャ遷移は GPU のアクセスを調整し、タイムラインは送信間の依存を設定したり、CPU で GPU の完了を待ったりするために使います。"
concepts.synchronization.layouts.context: "以前の内容を破棄できる場合は、遷移前のレイアウトに {undefined} を指定できます。例えば、新しい画像や全体をクリアするアタッチメントが該当します。ロード、サンプリング、蓄積のために内容を保持する場合は、直前のアクセスのレイアウトを使います。"
concepts.synchronization.layouts.description: "用途フラグは、テクスチャの許可された用途を宣言します。{textureLayout} は、コマンド列のある時点で、mip レベルと配列レイヤーで特定したサブリソースにどうアクセスするかを表します。アクセス方法が変わるときに遷移を記録します。例えばコンピュートサンプルでは、{storage} レイアウトで出力テクスチャへ書き込んだ後、グラフィックスパスでサンプリングする準備をします。"
concepts.synchronization.layouts.details: "ここでは {outputTexture} を {sampledStorage} 用途で作成し、対象サブリソースは {storage} です。{default} は mip レベル 0 と配列レイヤー 0 を選びます。他のレベルとレイヤーには影響しません。"
concepts.synchronization.layouts.guidance: "{transition} には、サブリソースを前回使用したときのレイアウトを渡します。アプリケーションはコマンドを記録し、テクスチャを描画ステージ間で渡す際に、この状態を追跡します。"
concepts.synchronization.layouts.title: "テクスチャレイアウト"
concepts.synchronization.readback.description: "{isCompleted} は GPU の完了を報告します。記録したリードバックには、その後にもう一つの処理があります。内部の読み戻し領域からアプリケーションの宛先メモリへ結果をコピーする処理です。"
concepts.synchronization.readback.details: "{commandBufferDownload} は、この内部領域への GPU コピーを記録します。送信完了後、ライブラリはコマンドバッファーの回収時に CPU コピーを行います。リードバックの送信値に対して {wait} を呼ぶと、GPU を待機した後、そのキューの完了済みバッファーを処理し、両方のコピーが完了します。戻るまで宛先を確保し、管理対象メモリは固定したままにしてください。"
concepts.synchronization.readback.guidance: "{isCompleted} の確認だけでは、最後の CPU コピーは行われません。別のキューで待機しても、リードバックを管理するキューのバッファーは回収されません。アップロードとリードバックが直接アクセスや一時領域を使う条件は、{link}で説明します。"
concepts.synchronization.readback.guidance.link: "リソース管理"
concepts.synchronization.readback.title: "リードバックの完了"
concepts.synchronization.reuse.description: "三角形では、各フレームの完了を待ってからデータを再利用します。フレームの処理を並行して進める場合は、処理中の各フレームに個別の変更可能な記憶領域を用意し、再び使える時点を追跡します。データを変更する前にはその領域への GPU アクセスを、リソースを解放する前にはそのすべての使用を待ちます。"
concepts.synchronization.reuse.details: "リサイズと終了も、同じ順序で処理します。新しい使用を止め、既存の使用が終わるのを待ってから、リソースを置き換えるか解放します。{swapChainResize} やリソース、コンテキストの解放を呼ぶ前に、この順序を確保してください。三角形では毎フレーム待機しているため、コールバックの間でリサイズできます。"
concepts.synchronization.reuse.guidance: "{swapChainPresent} は提示後にグラフィックスキューへシグナルを送り、完了を待ちます。そのため、明示的な送信待ちを除いても、三角形は提示時に待機します。別キューへ独立して送信した処理は、完了を個別に追跡する必要があります。"
concepts.synchronization.reuse.title: "リソースの再利用"
concepts.synchronization.timelines.context: "使用側の処理後に CPU で結果を読んだり、共有データを上書きしたり、リソースを解放したりする場合は、その送信を待ちます。"
concepts.synchronization.timelines.description: "タイムラインは増加する値でキューの完了を表します。{submit} が返す {timelineValue} はタイムラインと送信の値を含みます。異なるタイムラインの数値 {value} は直接比較できません。"
concepts.synchronization.timelines.details: "同じコンテキストの二つのキューで記録した {producer} と {consumer} があり、後者が前者の書いたデータを使うとします。次の依存関係で送信します。"
concepts.synchronization.timelines.guidance: "使用側のキューは、渡された完了値に到達するのを待ってからコマンドを実行します。CPU は {producedWait} を呼ばずに処理を続けられます。共有リソースは {consumed} が完了するまで保持し、使用側のアクセスに必要なテクスチャ遷移も記録します。"
concepts.synchronization.timelines.notes: "{queueTimelineSignal} の戻り値も、{wait} で待機したり、別キューの依存関係に使ったりできます。{signal} は、それまでに送信した処理の後に完了点を置きます。GPU がその処理を終えると、完了点に到達します。"
concepts.synchronization.timelines.title: "タイムラインとキュー間の依存"
concepts.synchronization.title: "同期"
