samples.execution.description: "{link} には、1 つのデスクトップアプリケーション内に 6 つの独立したレンダラーが含まれています。.NET 10 SDK と、以下で説明するサポート対象のデスクトップバックエンドを使用してください。アプリケーションをビルドして実行し、コンソールメニューからサンプルを選択します。"
samples.execution.description.link: ZenithTutorials
samples.execution.details: ホストは Windows では DirectX 12、macOS では Metal、Linux では Vulkan を選択します。選択したバックエンドでサポートされているデバイス、ドライバー、シェーダーコンパイラ環境を使用してください。Linux のウィンドウパスには X11 または XWayland が必要です。{link} はパッケージの依存関係を宣言し、実行時に必要なシェーダーとテクスチャのアセットをコピーします。
samples.execution.details.link: プロジェクトファイル
samples.execution.guidance: 各サンプルはウィンドウ処理とプレゼンテーションのコードを共有しています。学習したい機能に応じて、任意のサンプルを個別に選択できます。
