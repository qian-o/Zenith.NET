tutorial.context.description: これでウィンドウを開くことができるようになりましたが、ウィンドウ内にレンダリングを行う GPU オブジェクトはまだ作成していません。{graphicsContext} は、選択したグラフィックスバックエンドとそのコマンドキューへのアクセスを提供します。
tutorial.context.details: "このブロックを {emphasis} に挿入します:"
tutorial.context.details.emphasis: using ディレクティブの後、{iWindowWindow} の前
tutorial.context.guidance: 分岐処理により、Windows では DirectX 12、macOS では Metal、Linux では Vulkan が選択されます。その後のレンダリングコードは共通の Zenith.NET API を使用します。開発中は検証を要求し、{validationMessage} を通じて報告されるメッセージを出力します。診断情報は、バックエンドおよびマシンで利用可能な検証コンポーネントによって異なります。
tutorial.context.title: グラフィックスコンテキストを作成する
tutorial.description: ウィンドウを開き、滑らかなグラデーションの三角形を描画する .NET コンソールアプリケーションを作成します。頂点データ、シェーダー、パイプライン状態がどのように連携するかを学び、画像を生成するコマンドを記録してサブミットします。
tutorial.details: 各セクションを順番に進めてください。まず空のウィンドウを開き、次に背景色を表示し、最後に三角形を描画します。各チェックポイントで、次の段階に進む前にアプリケーションの一部が正しく動作することを確認します。初期化は 1 回実行され、描画コールバックは呼び出されるたびに新しいフレームを記録します。
tutorial.draw.context: "{draw} の引数は次のとおりです:"
tutorial.draw.description: "{windowRender} コールバックで、{beginRenderPass} と {endRenderPass} の間にある {addTheTriangleDrawCommandsHereLater} を次の 3 つのコマンドに置き換えます:"
tutorial.draw.details: "{setPipeline} は、先ほど作成したシェーダーと状態を選択します。頂点データをバインドする前に設定してください。バックエンドはパイプラインの入力レイアウトを使用してバインディングを解釈します。"
tutorial.draw.guidance: "{setVertexBufferVertexBuffer} は、バイトオフセット 0 から始まるバッファーを入力スロット 0 にバインドします。そのスロットは {inputLayouts} の単一エントリに対応します。これによりデータが再コピーされたり再アップロードされたりすることはありません。"
tutorial.draw.notes: この時点では、コマンドはまだ記録されただけです。描画コールバックの最後にある {submitWait} と {present} の呼び出しが処理を実行し、その結果を表示します。三角形は画像の一部しか覆わないため、クリア操作は引き続き必要です。背景も各フレームで定義された色を受け取る必要があります。
tutorial.draw.table.firstInstance.meaning: インスタンスの番号付けをゼロから開始します。
tutorial.draw.table.firstVertex.meaning: バッファー内の最初の頂点から開始します。
tutorial.draw.table.headings.argument: 引数
tutorial.draw.table.headings.description: 値
tutorial.draw.table.headings.meaning: 意味
tutorial.draw.table.instanceCount.meaning: 三角形のコピーを 1 つ描画します。
tutorial.draw.table.vertexCount.meaning: 3 つの頂点を読み取ります。
tutorial.draw.title: パス内で三角形を描画する
tutorial.execution.description: "{firstTriangle} ディレクトリからビルドして実行します:"
tutorial.execution.details: 暗い背景に対して、上が赤、右下が緑、左下が青の角を持つ三角形がウィンドウに表示されるはずです。内部はこれらの色間で滑らかなグラデーションを示す必要があります。
tutorial.execution.guidance: ウィンドウのサイズを変更してください。リサイズコールバックがフレームバッファーのサイズを更新し、スワップチェーンをリサイズします。レンダーパスはその画像に一致するビューポートを確立します。頂点位置は正規化座標のままであるため、三角形はウィンドウの幅と高さに対する同じ比率を維持します。アスペクト比を変更すると形状が引き伸ばされることがあります。オブジェクトのアスペクト比を維持するには、この最初の描画の範囲を超えるプロジェクションまたはビューポートポリシーが必要です。
tutorial.execution.title: 実行、リサイズ、および閉じる
tutorial.frame.commands.context: "{endRenderPass} の後、2 つ目の遷移によって画像がプレゼンテーション用に準備されます。{submit} は記録を完了してコマンドバッファーをサブミットし、{wait} は GPU がそのサブミットを完了するのを待機します。その後、{present} はレンダリングされた画像の表示を要求します。"
tutorial.frame.commands.description: レンダーパスは、同じアタッチメントを使用する描画操作をグループ化します。ここでは、カラーアタッチメントはスワップチェーンの出力テクスチャ、すなわち描画を受け取る画像です。{colorAttachmentClear} は、指定した RGBA カラーでクリアし、パスの終了時に結果を保持するよう指示する記述を作成します。{beginRenderPass} はこれらの命令を記録し、コマンドがサブミットされた後に GPU がクリアを実行します。
tutorial.frame.commands.details: 角括弧には単一のカラーアタッチメントが含まれています。引数 {null} は、深度およびステンシルテスト用の深度値とステンシルマスクを格納する深度／ステンシルアタッチメントが存在しないことを意味します。
tutorial.frame.commands.guidance: "{beginRenderPass} は、アタッチメントをカバーするビューポートとシザーを設定します。ビューポートはレンダリング座標をピクセルにマッピングし、シザーは書き込み可能なピクセルを制限します。これらのデフォルト設定は出力テクスチャ全体をカバーし、この三角形の描画に適しています。"
tutorial.frame.commands.title: クリア、サブミット、およびプレゼンテーション
tutorial.frame.description: まず画像を単一の背景色で塗りつぶします。この操作はクリアと呼ばれます。その色がウィンドウに表示されれば、サーフェス、コマンドのサブミット、およびプレゼンテーションパスが正常に連携しています。このチェックポイントにより、ジオメトリやシェーダーを追加する前にフレームループを検証できます。
tutorial.frame.details: "描画コールバックは、フレームを描画するタイミングで Silk.NET が呼び出すコードです。このコールバックではイベントの経過時間引数は不要なため、{value} と命名されています。これを {emphasis} に登録します:"
tutorial.frame.details.emphasis: "{windowRun} の前"
tutorial.frame.target.description: "{graphicsQueueCommandBuffer} は、すでに記録が開始されたコマンドバッファーを取得します。記録は GPU に対する処理を記述するものであり、その処理を即時に実行するわけではありません。"
tutorial.frame.target.details: 最初の {transition} は、カラーアタッチメントとしてのアクセスのために出力テクスチャを準備します。{default} はミップレベル 0 と配列レイヤー 0 を選択します。画像全体をクリアして以前の内容を破棄するため、以前のレイアウトとして {undefined} を使用します。既存の内容を保持する必要があるパスでは、代わりに実際の以前のレイアウトを使用する必要があります。
tutorial.frame.target.guidance: 各フレームでスワップチェーンの現在の出力テクスチャを使用してください。プレゼンテーションによって利用可能な画像が変わる可能性があるため、以前のフレームから保存したテクスチャは永続的なウィンドウのレンダーターゲットにはなりません。
tutorial.frame.target.title: 出力テクスチャを準備する
tutorial.frame.title: 背景色を表示する
tutorial.geometry.data.description: この配列を {emphasis} に追加します。後続のリソース作成ステップも、示された順序でこのコールバックの前に配置します。
tutorial.geometry.data.description.emphasis: "{windowRender} の前"
tutorial.geometry.data.details: 配列の各エントリが 1 つの {vertex} を作成します。内側の 2 つの {new} 式は、その {vector3} 位置と {vector4} 色を作成します。頂点は上、右下、左下のコーナーを記述します。頂点シェーダーは 4 番目の位置座標 {w} を提供します。w が 1 の場合、x と y は正規化デバイス座標を直接表します。-1 と +1 が画像の端で、0 が中心です。これらの座標はウィンドウのピクセルサイズに依存しません。
tutorial.geometry.data.guidance: 各色には赤、緑、青、アルファの成分が含まれます。3 つのコーナーすべてでアルファは 1 です。3 つの位置はすべて z = 0 であり、同じ平面上に配置されます。これらの位置はレンダリングしたい座標をすでに直接記述しているため、カメラや変換行列は不要です。この単一の平坦な三角形では、ブレンディングと深度テストも無効にし、深度バッファーも省略します。
tutorial.geometry.data.title: コーナーの位置を選択する
tutorial.geometry.description: 頂点は、描画に使用されるデータと結びついた点です。この三角形には、各コーナーに 1 つずつ、計 3 つの頂点があります。各頂点には位置と色が含まれます。GPU は色を補間し、三角形全体の中間値を計算します。
tutorial.geometry.format.description: "この宣言を {emphasis} に追加します:"
tutorial.geometry.format.description.emphasis: "{programCs} の末尾、クリーンアップステートメントの後"
tutorial.geometry.format.details: "{file} はこの型を {programCs} に限定し、コンストラクターがその位置と色のフィールドを初期化します。{layoutKindSequential} はフィールドを宣言順に維持します。{position} は 3 つの 32 ビット浮動小数点数を含み、{color} は 4 つを含みます。この構造体では、位置はバイト 0 から、色はバイト 12 から始まり、完全な頂点は 28 バイトを占めます。この同じレイアウトをグラフィックスパイプラインに記述します。"
tutorial.geometry.format.title: 頂点を定義する
tutorial.geometry.title: GPU に 3 つの頂点を提供する
tutorial.geometry.upload.context: "{fixed} は、アドレスが使用されている間にガベージコレクターが配列を移動するのを防ぎます。この CPU 書き込み可能バッファーの場合、{upload} は戻る前にメモリをマップ、コピー、アンマップするため、その後配列を固定したままにする必要はありません。バッファーはレンダリング全体を通じて存続する必要があり、頂点は変化しないためアップロードは 1 回だけ行えば十分です。"
tutorial.geometry.upload.description: "マネージド配列は CPU データです。{buffer} は、GPU が頂点を読み取るためのストレージを提供します。配列の後に次を追加します:"
tutorial.geometry.upload.details: "合計サイズは {sizeofVertexVerticesLength} です。頂点あたり 28 バイト、3 つの頂点で合計 84 バイトになります。{bufferUsagesVertex} は頂点入力アクセスを許可します。{cpuWriteOnly} は、CPU がこの小さなバッファーを直接初期化することを可能にします。記述子の ストライド は要素サイズを記録し、後で作成する入力レイアウトが個々の属性の読み取り方法を頂点フェッチに伝えます。"
tutorial.geometry.upload.guidance: バッファーを作成しただけではデータは格納されません。{upload} は、宛先のバイトオフセット 0 から始まる割り当てに配列をコピーします。そのソース記述はポインターとコピーするバイト数を提供します。
tutorial.geometry.upload.notes: "{programCs} の末尾のクリーンアップで、{swapChainDispose} の直前に {vertexBufferDispose} を追加します。より大規模な静的ジオメトリについては、GPU 専用メモリと転送アップロードを選択する基準について {link} で説明しています。"
tutorial.geometry.upload.notes.link: リソース管理
tutorial.geometry.upload.title: バッファーを割り当てて配列をアップロードする
tutorial.input.description: "頂点バイトとシェーダーの準備が整いました。次に、GPU が各頂点をどのように読み取るかを記述します。属性とは、位置や色などの 1 つの値です。入力レイアウトは各属性にフォーマットとバイトオフセットを与え、ストライド は 1 つの頂点から次の頂点までのバイト単位の距離を与えます。シェーダー作成後に次の初期化ブロックを追加します:"
tutorial.input.details: "{inputLayoutAdd} は現在の ストライド に要素を追加し、その ストライド を要素のサイズ分だけ増加させます。C# の構造体を検査するわけではありません。ここでは、CPU メモリとシェーダー入力との間で次の一致関係を生成します:"
tutorial.input.guidance: "この記述を更新せずに C# フィールドの順序やパディングを変更すると、GPU は間違ったバイトを読み取ることになります。デフォルトの {semanticIndex} はゼロで、{pOSITION0} および {cOLOR0} と一致します。両方の要素は同じバッファーに属するため、パイプラインには 1 つの入力レイアウトが含まれ、そのバッファーをスロット 0 にバインドします。"
tutorial.input.table.headings.byteOffset: バイトオフセット
tutorial.input.table.headings.cField: "C# フィールド"
tutorial.input.table.headings.format: フォーマット
tutorial.input.table.headings.shaderInput: シェーダー入力
tutorial.input.table.nextVertex.cField: 次の頂点
tutorial.input.table.nextVertex.format: "合計 ストライド: 28 バイト"
tutorial.input.table.nextVertex.shaderInput: 次の入力レコード
tutorial.input.table.vertexColor.format: "{float4} (16 バイト)"
tutorial.input.table.vertexPosition.format: "{float3} (12 バイト)"
tutorial.input.title: 頂点入力レイアウトを記述する
tutorial.lifecycle.description: "完成したアプリケーションはこのシーケンスを繰り返します:"
tutorial.lifecycle.details: "ウィンドウを閉じると {run} から戻ります。描画された各フレームはすでに GPU 処理の完了を待機しているため、使用されたリソースを安全に破棄できます。{windowRun} 後のクリーンアップは次のようになります:"
tutorial.lifecycle.guidance: "ネイティブウィンドウより先にスワップチェーンを解放し、すべてのリソースを解放した後にコンテキストを解放してください。サブミットされたコマンドバッファーはキューが所有して再利用し、出力テクスチャはスワップチェーンが所有します。このアプリケーションでは、それらのコマンドバッファーと出力テクスチャに個別の {dispose} 呼び出しは不要です。"
tutorial.lifecycle.title: 1 つのフレームのライフサイクルを追跡する
tutorial.pipeline.behavior: "入力レイアウトの後に次を追加します:"
tutorial.pipeline.context: "{cullNone} は、どちらの面の向きも破棄せずに三角形を塗りつぶします。頂点の順序が面の巻き方向を決定するため、カリングを無効にすることで、その順序によって最初の三角形が隠れてしまうのを防ぎます。"
tutorial.pipeline.description: これで頂点データ、入力レイアウト、2 つのシェーダーが揃いました。{graphicsPipeline} はこれらを接続し、GPU が頂点をプリミティブに組み立てて結果をアタッチメントに書き込む方法を指定します。
tutorial.pipeline.details: "パイプラインは、プログラム可能なシェーダーステージと、三角形の組み立て、面カリング、ブレンディングなどの GPU 操作を制御する固定機能設定を結合します。この三角形には、以下の設定を選択します:"
tutorial.pipeline.guidance: カラーフォーマットは {swapChainDescFormat} から取得します。これはレンダーパスで使用される画像と一致している必要があります。{count1} はピクセルあたり 1 つのサンプルを意味します。
tutorial.pipeline.item: "{triangleList} は、連続する 3 つの頂点ごとに 1 つの三角形を組み立てます。3 つの頂点を提供して 1 回描画するため、インデックスバッファーは不要です。"
tutorial.pipeline.notes: "{depthNone} は深度テストと書き込みを無効にし、深度アタッチメントのないパスと一致させます。"
tutorial.pipeline.reference: "{opaque} はブレンディングを無効にするため、三角形の内側ではフラグメントシェーダーの色が背景を置き換えます。"
tutorial.pipeline.title: シェーダーと頂点レイアウトを接続する
tutorial.pipeline.usage: シェーダーオブジェクトは、サンプルレンダラーのようにパイプラインを作成した後に破棄できます。パイプライン自体は、これを使用して描画するすべてのフレームで有効に保ってください。クリーンアップで {vertexBufferDispose} の前に {pipelineDispose} を追加します。パイプラインの作成は、描画コールバック前の最後の初期化ステップです。
tutorial.pipeline.validation: パイプライン記述はアタッチメント構成を宣言するものであり、別の画像を作成するわけではありません。位置と色が 1 つのバッファーにまとめて格納されているため、{inputLayouts} には 1 つのエントリがあります。
tutorial.presentation.title: GPU をウィンドウに接続する
tutorial.project.context: プロジェクトのビルド設定で {emphasis} ({allowUnsafeBlocks}) を有効にしてください。これは頂点データを GPU に渡す際や、ウィンドウヘルパーのネイティブ呼び出しに使用します。
tutorial.project.context.emphasis: アンセーフコードの許可
tutorial.project.description: "プロジェクトを作成し、そのディレクトリに移動します:"
tutorial.project.details: "パッケージをインストールします:"
tutorial.project.guidance: "{zenithNET} は共通のレンダリング API を提供します。3 つのバックエンドパッケージにより、同じプログラムがそのプラットフォームに適した実装を選択できます。{zenithNETCompiler} は、後で作成する小さな GPU プログラムである Slang シェーダーをその実装用にコンパイルします。Silk.NET はウィンドウとイベントループを提供します。"
tutorial.project.title: コンソールプロジェクトを作成する
tutorial.requirements.context: 空のプロジェクトからこのページに沿って進めることができます。ここで使用するレンダリング API とウィンドウ処理 API のリファレンスとして、{link} とその {detail} を参照できます。
tutorial.requirements.context.detail: 共有ホスト
tutorial.requirements.context.link: Hello Triangle サンプル
tutorial.requirements.description: "{emphasis}、コードエディターまたは IDE、および Zenith.NET バックエンドでサポートされている GPU とドライバーを備えたデスクトップ環境が必要です。C# の基礎知識があれば十分です。グラフィックスの概念は使用する場面で説明します。これは通常の {net10} コンソールプロジェクトです。バックエンドは、Zenith.NET の操作を DirectX 12、Metal、Vulkan などのグラフィックス API の呼び出しに変換します。アプリケーションは起動時にそのうちの 1 つを選択します:"
tutorial.requirements.description.emphasis: .NET 10 SDK
tutorial.requirements.details: Linux では、ここで使用するウィンドウパスに X11 互換のウィンドウセッションが必要です。この三角形を描画するにあたり、オプションのレイトレーシングやメッシュシェーディング機能は不要です。
tutorial.requirements.guidance: Zenith.NET は、アプリケーションが提供するサーフェスに描画します。Silk.NET.Windowing がデスクトップウィンドウを作成し、そのイベントを処理します。macOS では、プレゼンテーションターゲットは Metal レイヤー ({cAMetalLayerCs}) です。チュートリアルのウィンドウヘルパーがそのレイヤーを自動的に接続します。
