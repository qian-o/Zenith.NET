concepts.platforms.surface.title: アプリケーションがプレゼンテーションを所有する場合はネイティブサーフェスを提供する
concepts.platforms.title: プラットフォーム統合
concepts.resources.allocation.context: "独自のアロケーターが必要でなければ、まずコンテキストで作成するリソースを使ってください。ヒープを使う場合は、それらを使用するすべての GPU 処理が完了してから、配置したリソースを先に解放し、最後にヒープ自体を解放します。"
concepts.resources.allocation.description: "{heap} は、明示したバイトオフセットにリソースを配置するためのメモリを提供します。アプリケーションがオフセットを選び、使用中の領域を追跡します。"
concepts.resources.allocation.details: "配置前に、正確なバッファーまたはテクスチャの記述を指定して {contextGetSizeAndAlignment} を呼び出します。返されたアライメントの倍数をオフセットに選び、返されたサイズを確保して、リソースがヒープの総バイト数の範囲内に収まるようにしてください。使用中の割り当て領域は重ねないでください。テクスチャの格納にはバックエンド固有のパディングやアライメントが含まれることがあるため、ピクセル数と 1 ピクセル当たりのバイト数の積では割り当てサイズを求められません。"
concepts.resources.allocation.guidance: "配置したバッファーの常駐特性は、ヒープの常駐特性と一致させてください。ここで扱う通常の GPU テクスチャには GPU 専用ヒープを使います。サイズとアライメントは配置の要件であり、すべてのバックエンドで任意のリソースを任意のヒープに配置できるという保証ではありません。"
concepts.resources.allocation.title: 割り当て制御が必要な場合はヒープにリソースを配置する
concepts.resources.bufferUsages.table.constant.role: 定数バッファーバインディングを介して読み取られるシェーダーパラメーター。
concepts.resources.bufferUsages.table.headings.role: "役割"
concepts.resources.bufferUsages.table.headings.usage: 用途
concepts.resources.bufferUsages.table.index.role: インデックス描画で使用されるインデックス。
concepts.resources.bufferUsages.table.indirect.role: "間接描画または間接ディスパッチのコマンドが読み取る引数。"
concepts.resources.bufferUsages.table.none.role: "バッファーの用途フラグは宣言されていません。"
concepts.resources.bufferUsages.table.storageReadOnly.role: "読み取り専用のシェーダーバインディングを介してアクセスするバッファーデータ。"
concepts.resources.bufferUsages.table.storageReadWrite.role: "読み書き可能なシェーダーバインディングを介してアクセスするバッファーデータ。"
concepts.resources.bufferUsages.table.transferDst.role: "GPU コピーの転送先ストレージ。"
concepts.resources.bufferUsages.table.transferSrc.role: "GPU コピーの転送元データ。"
concepts.resources.bufferUsages.table.vertex.role: 描画のためにフェッチされる頂点属性。
concepts.resources.bufferUsages.title: バッファーの用途
concepts.resources.description: "リソースを使用する処理に合わせて、その記述を選びます。描画先となり、シェーダーでサンプリングされ、さらに CPU に読み戻されるテクスチャには、3 つすべての用途の宣言と、それらの処理間の同期が必要です。メモリの配置とリソースの有効期間も別途検討します。"
concepts.resources.memory.context: CPU アクセス可能なバッファーの場合、{map} は CPU にアドレスを与えます。GPU が同じバイトへのアクセスを停止するのを待つことはありません。同様に {unmap} も作業をサブミットしたり完了を待ったりしません。CPU 書き込み可能なデータを上書きする前に、以前の内容を必要とする GPU 読み取りを終了させてください。
concepts.resources.memory.description: "{bufferDesc} には {residency} フィールドがあります。CPU と GPU がデータにどのようにアクセスするかに応じて選択してください:"
concepts.resources.memory.details: 常駐特性は、割り当てに対する想定された CPU アクセスを記述します。これは、すべてのデバイスが物理的に分離された CPU および GPU メモリを持つことを意味するわけではありません。三角形チュートリアルでは、小さな頂点バッファーを直接初期化するために {cpuWriteOnly} を使用します。大規模な静的メッシュは、代わりに 1 回限りのアップロードを伴う GPU 専用ストレージの恩恵を受けることができます。
concepts.resources.memory.guidance: "{textureDesc} には常駐特性フィールドがありません。通常のコンテキスト作成テクスチャは GPU ストレージを使用します。その公開 API は CPU データ転送のためのアップロードおよびダウンロード操作を提供し、直接マッピングメソッドは公開しません。明示的なヒープは、以下で説明するように配置の制御を提供します。"
concepts.resources.memory.table.cpuReadOnly.cPUAccess: "GPU コピーの完了後にマップされたメモリを読み取る。"
concepts.resources.memory.table.cpuReadOnly.typicalRole: "GPU が生成したリードバックデータ"
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: "先行する GPU 読み取りの完了後にマップされたメモリへ書き込む。"
concepts.resources.memory.table.cpuWriteOnly.typicalRole: "CPU が供給または更新するデータ"
concepts.resources.memory.table.gpuOnly.cPUAccess: "アップロードバッファーまたはリードバックバッファーを介してバイトを転送する。"
concepts.resources.memory.table.gpuOnly.typicalRole: "静的ジオメトリと GPU の作業用データ"
concepts.resources.memory.table.headings.cPUAccess: CPU アクセス
concepts.resources.memory.table.headings.residency: 常駐特性
concepts.resources.memory.table.headings.typicalRole: 典型的な役割
concepts.resources.memory.title: "必要な CPU アクセスに合わせてメモリを選ぶ"
concepts.resources.textureUsages.description: "転送用の用途フラグは GPU コピーの方向を表します。CPU アクセスは、それとは別のメモリ配置の選択であり、後で説明します。"
concepts.resources.textureUsages.details: "用途フラグの組み合わせは複数の役割を宣言するだけで、処理の実行やアクセス順序の制御は行いません。テクスチャには適切な{link}が引き続き必要であり、選択したデバイス上でそのフォーマットが要求する用途をサポートしている必要があります。"
concepts.resources.textureUsages.details.link: "レイアウトと同期"
concepts.resources.textureUsages.table.colorAttachment.role: "レンダーパスのカラーアタッチメント。"
concepts.resources.textureUsages.table.depthStencilAttachment.role: "レンダーパスの深度／ステンシルアタッチメント。"
concepts.resources.textureUsages.table.headings.role: "役割"
concepts.resources.textureUsages.table.headings.usage: 用途
concepts.resources.textureUsages.table.none.role: "テクスチャの用途フラグは宣言されていません。"
concepts.resources.textureUsages.table.sampled.role: "サンプリング用テクスチャのバインディングを介して読み取るテクスチャデータ。"
concepts.resources.textureUsages.table.storage.role: "ストレージテクスチャのバインディングを介してシェーダーが読み書きするテクスチャデータ。"
concepts.resources.textureUsages.table.transferDst.role: "GPU コピーの転送先画像ストレージ。"
concepts.resources.textureUsages.table.transferSrc.role: "GPU コピーの転送元画像データ。"
concepts.resources.textureUsages.title: テクスチャの用途
concepts.resources.title: リソース管理
concepts.resources.transfers.context: ダウンロードは、内部のリードバックストレージへの GPU コピーを記録します。ライブラリは、完了したコマンドバッファーを再利用のためにリセットするときに、それらのバイトを指定された CPU 転送先にコピーします。サブミット値の {wait} が戻るまで、転送先の割り当てを維持し、マネージドメモリを固定したままにしてください。
concepts.resources.transfers.description: "アップロードは CPU データを GPU リソースへコピーし、ダウンロードはリソースのデータを CPU メモリへコピーします。リソース自体のメソッドは、その転送が完了してから戻ります。"
concepts.resources.transfers.details: "これらの待機が対象とするのは、各メソッドがサブミットした転送です。別のキューですでにリソースを読み書きしていた処理との依存関係は検出しません。リソースのメソッドを呼ぶ前に、その依存関係を設定してください。マップされたメモリ経由の直接コピーでも、関連する GPU 処理の完了を確認するのは呼び出し側の責任です。"
concepts.resources.transfers.guidance: "コピーを他の作業と一緒に記録する必要がある場合は、{commandBufferUpload} または {commandBufferDownload} を使用してください。ポインターの有効期間はそれぞれ異なります:"
concepts.resources.transfers.item: "アップロードは呼び出し中に CPU 側の転送元を内部のアップロードバッファー、別名ステージングメモリへコピーします。転送元ポインターは、その呼び出しの間だけ有効であれば十分です。"
concepts.resources.transfers.notes: "テクスチャの行ストライドは CPU データの隣接する行の間のバイト距離であり、スライスストライドは隣接する深度スライスの間のバイト距離です。これらはテクスチャ内部の GPU メモリレイアウトを表しません。GPU 処理の完了とリードバックの違いは{link}を参照してください。"
concepts.resources.transfers.notes.link: 同期
concepts.resources.transfers.table.bufferDownload.transfer: "{cpuReadOnly} の直接 CPU コピー。それ以外の場合は転送キューのダウンロードをサブミットして待機します。"
concepts.resources.transfers.table.bufferUpload.transfer: "{cpuWriteOnly} の直接 CPU コピー。それ以外の場合は転送キューのアップロードをサブミットして待機します。"
concepts.resources.transfers.table.headings.method: 方法
concepts.resources.transfers.table.headings.transfer: "データの転送方法"
concepts.resources.transfers.table.textureTransfers.method: "{textureUpload} / {textureDownload}"
concepts.resources.transfers.table.textureTransfers.transfer: "グラフィックスキューを使い、選択したサブリソースをコピー用のレイアウトへ遷移させ、コピー後に指定された最終レイアウトへ遷移させて、完了を待ちます。"
concepts.resources.transfers.title: "即時に完了する転送とコマンドに記録する転送を選ぶ"
concepts.resources.usages.description: "{bufferUsages} と {textureUsages} は、リソースの想定される役割を宣言するフラグ列挙型です。これらはそれぞれ {bufferDescUsages} と {textureDescUsages} に割り当てられます。フラグ列挙型を使用すると、リソースに複数の役割がある場合に {value} を使用して複数のメンバーを組み合わせることができます。"
concepts.resources.usages.title: リソースを作成する前に必要な用途を宣言する
concepts.resources.views.description: "{bufferView} は、バッファー領域とその解釈を記述します。{textureView} は、互換性のあるテクスチャタイプ、フォーマット、およびサブリソース範囲を選択します。ビューは基盤となるストレージを共有します。データをコピーしたり、リソース作成時に欠落していた用途を追加したりすることはありません。また、その範囲はシェーダーの境界チェックのポータブルな保証にはなりません。"
concepts.resources.views.details: "デフォルトビューにはリソース自体のハンドルを使い、別の領域や互換性のある別の解釈が必要ならビューを作成します。GPU 処理が利用する可能性がある間は、ビューとその基になるリソースの両方への C# 参照を保持してください。リソースハンドルだけでは、どちらのオブジェクトも存続しません。最後の GPU 使用が完了してから解放してください。どちらかを置き換えたら、その古い{link}を含む定数も更新します。"
concepts.resources.views.details.link: "リソースハンドル"
concepts.resources.views.guidance: "{link} はリサイズ時に置き換えられる深度テクスチャを示しています。{detail} は、書き込み可能な出力から分離して保持される入力テクスチャを示しています。どちらも、リソースの有効期間をそれを実際に使用する処理に従わせています。"
concepts.resources.views.guidance.detail: コンピュートサンプル
concepts.resources.views.guidance.link: 回転する立方体のレンダラー
concepts.resources.views.title: "ビューとその基になるリソースを共に使用可能に保つ"
concepts.shaders.binding.context: "コンピュートサンプルでは、{input} には {inputTextureSampledHandle} が、{output} には {outputTextureStorageHandle} が入力されます。Slang の型付き {descriptorHandle} は、各リソースへのアクセス方法をシェーダーに伝えます:"
concepts.shaders.binding.description: "{setConstantBuffer} は、現在のパイプラインの定数データ用にバッファーとバイトオフセットをバインドします。これは既存の GPU から見えるストレージをバインドするものであり、C# の値をアップロードするわけではありません。最初にバッファーを埋め、以前の GPU 読み取り側が終了していることを確認してから、そのバイトを上書きしてください。"
concepts.shaders.binding.details: "定数バッファーの前にパイプラインを設定してください。リソースがすでに作成およびアップロードされているコンピュートワークロードの場合、記録はこの順序を使用します:"
concepts.shaders.binding.guidance: このコード片は、記録中の {commandBuffer}、{computePipeline}、{bufferUsagesConstant} 用途でアップロードされた {constantBuffer}、およびワークロードのスレッドグループ数を前提としています。オフセット 0 はバッファーの先頭をバインドします。複数の定数データレコードが 1 つのバッファーを共有する場合、各レコードの開始オフセットはバックエンドのバインディングアライメントを満たす必要があります。その要件は、レコード内のフィールドレイアウトとは別個のものです。
concepts.shaders.binding.notes: "{resourceHandle} は 2 つの 32 ビットフィールドを格納しますが、その解釈はバックエンドに属します。これをコンテキスト間で転送可能なユニバーサル記述子インデックス、アドレス、または値として扱わないでください。ハンドルはリソースを作成せず、欠落している用途を追加せず、同期も実行しません。"
concepts.shaders.binding.reference: リソースおよびそのハンドルの取得に使用したビューへの参照を保持し、シェーダーの最後の使用が完了した後にのみ破棄してください。テクスチャまたはビューを交換する際は、その古いハンドルを含む定数を更新してください。{link} でそのライフサイクルの関係について説明しています。
concepts.shaders.binding.reference.link: リソース管理
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: シェーダー型 {t} の構造化要素を読み取ります。
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: シェーダー型 {t} の構造化要素の読み取りまたは書き込みを行います。
concepts.shaders.binding.table.headings.access: 想定されるアクセス
concepts.shaders.binding.table.headings.cHandle: "C# ハンドル"
concepts.shaders.binding.table.headings.slangFieldType: Slang フィールド型
concepts.shaders.binding.table.samplerHandle.access: テクスチャサンプリング状態を提供します。
concepts.shaders.binding.table.textureSampledHandle.access: テクスチャを読み取ります。
concepts.shaders.binding.table.textureStorageHandle.access: ストレージテクスチャの読み取りまたは書き込みを行います。
concepts.shaders.binding.title: 定数バッファーとそれが記述するリソースをバインドする
concepts.shaders.compilation.description: "{zenithCompiler} は指定された Slang エントリポイントをコンパイルし、{shaderDesc} を返します。コンテキストの {graphicsApi} を使用して、シェーダーを作成するバックエンド (DirectX 12 用の DXIL、Metal 用の Metal ライブラリ、Vulkan 用の SPIR-V) をターゲットにします。"
concepts.shaders.compilation.details: "たとえば、既存の {context} があり、三角形のシェーダーが実行可能ファイルの横にコピーされている場合は次のようになります:"
concepts.shaders.compilation.guidance: "{vSMain} はシェーダーファイル内のエントリポイント名と完全に一致している必要があります。パイプライン作成中はシェーダーオブジェクトを有効に維持し、{link} に示されているようにパイプライン作成後に破棄してください。フレームごとに再コンパイルするのではなく、この初期化を 1 回実行します。"
concepts.shaders.compilation.guidance.link: 最初の三角形
concepts.shaders.compilation.title: 選択したコンテキスト用にエントリポイントをコンパイルする
concepts.shaders.description: "シェーダーはアプリケーションから提供されたデータを受け取ります。頂点属性は個々の頂点を記述し、バッファーはパラメーターや配列を保持し、リソースハンドルはシェーダーがアクセスする他のリソースを識別します。C# の宣言と Slang の宣言は、それらの値の意味について一致している必要があります。フィールド名を一致させるだけでは不十分です。レイアウト、リソースアクセス、バインディングのすべてが一致している必要があります。"
concepts.shaders.dispatch.description: "{dispatch} はスレッドグループの数を受け取ります。コンピュートサンプルの {numthreads} エントリポイントは、グループあたり 16 × 16 スレッドを実行します。画像寸法を 16 で除算し、切り上げてグループ数を求めます。たとえば、17 × 19 の画像には 2 × 2 のグループが必要です。最後のグループに画像外のスレッドが含まれる可能性があるため、シェーダーはそのピクセル座標を画像寸法と照合してチェックします。"
concepts.shaders.dispatch.details: コンパイラは、宣言されたエントリポイントのグループサイズを {shaderDescThreadGroupSize} に格納します。{dispatch} に指定されたピクセル寸法をグループ数に変換することはありません。完全なバインディングとディスパッチの例については、シェーダー付きの {computeShaderRendererCs} を使用し、別のパスが出力を消費する前には {link} を使用してください。
concepts.shaders.dispatch.details.link: 同期
concepts.shaders.dispatch.title: ピクセルではなくスレッドグループをディスパッチする
concepts.shaders.layout.context: "{link} はそのオフセットを明示しています。この宣言にはスコープ内に {systemRuntimeInteropServices} と {zenithNET} が必要です:"
concepts.shaders.layout.context.link: "コンピュートサンプルの C# 定数"
concepts.shaders.layout.description: "頂点入力の場合、パイプラインの {inputLayout} がフォーマット、オフセット、ストライド、セマンティクスを記述します。三角形の {float3} 位置に続く {float4} 色は 28 バイトを占め、色はバイト 12 にあります。{inputLayoutAdd} はこのパックされたレイアウトを計算します。C# の構造体を検査するわけではありません。C# フィールドにパディングが含まれている場合は、フィールドがパックされていると仮定せずに、一致するレイアウトを提供してください。"
concepts.shaders.layout.details: "定数バッファーはシェーダーパラメーターを保持し、構造化バッファーは宣言された型の要素の配列を保持します。どちらも Slang の宣言に従って読み取られます。{inputLayout} は使用しません。パディングを含め、コンパイルされたシェーダー表現のフィールドオフセットと要素サイズを確認してください。アンマネージド C# 型はバイト単位でのコピーに適していますが、それだけでシェーダー型と一致することが証明されるわけではありません。特に、頂点の密集した {float3} レイアウトをすべてのシェーダーバッファーに適用しないでください。"
concepts.shaders.layout.guidance: リソースハンドルは、既存のリソースを参照する小さな値です。ハンドルを定数バッファーにコピーしても、リソースの内容はコピーされません。
concepts.shaders.layout.notes: "{computeShaderSlang} 内の対応する宣言は次のとおりです:"
concepts.shaders.layout.reference: "寸法が最初の 8 バイトを占め、その後に 2 つの 8 バイトリソースハンドルが続きます。C# サンプルは合計 256 バイトを予約しています。そのサイズはサンプルが選択したストレージサイズであり、すべての Slang 構造体や定数ペイロードが 256 バイトを占めるという規則ではありません。合計サイズをパディングしても、間違ったオフセットにあるフィールドは修正されません。"
concepts.shaders.layout.title: 頂点入力とシェーダーデータには異なるレイアウト規則がある
concepts.shaders.matrices.description: コンパイラは、各行の要素をまとめて格納する行優先 (row-major) の行列ストレージを要求します。{link} は 3 つの {matrix4x4} 値をオフセット 0、64、128 に配置します。その {detail} は、モデル、ビュー、プロジェクションの順序で {mulVectorMatrix} を使用します。
concepts.shaders.matrices.description.detail: シェーダー
concepts.shaders.matrices.description.link: 回転する立方体のレンダラー
concepts.shaders.matrices.details: 格納順序は行列要素がどのようにメモリを占有するかを決定し、乗算順序は変換を決定します。両側の一貫性を維持してください。これら 2 つの選択を確認せずに転置を追加すると、別の不一致を招きながら 1 つの不一致を覆い隠してしまう可能性があります。
concepts.shaders.matrices.title: 行列の格納と乗算の一貫性を維持する
concepts.shaders.title: シェーダーデータとバインディング
concepts.synchronization.backends.description: DirectX 12 と Vulkan は、レイアウトおよびアクセス情報とともにテクスチャ遷移をエンコードします。Metal は Zenith.NET の {transition} 実装において操作を持ちません。Metal は記録された作業をレンダーエンコーダーおよびコンピュートエンコーダーにグループ化します。バックエンドはこれらのグループを終了するときに可視性バリアを挿入し、先行の書き込みを後続の作業で利用可能にします。明示的な {barrier} 呼び出しは、同じエンコーダー内の連続するコンピュートディスパッチなどの依存関係を処理します。
concepts.synchronization.backends.details: この違いはワークロードを変更する際に重要になります。{link} では、ディスパッチの後にグラフィックスレンダーパスが続き、Metal 上でもエンコーダー境界が作成されます。2 つの依存するコンピュートディスパッチは、テクスチャの宣言されたレイアウトを変更するだけではその境界を作成しません。共有 API で要求される遷移を維持し、実際のプロデューサーコマンドとコンシューマーコマンドの間の依存関係を個別に特定してください。
concepts.synchronization.backends.details.link: コンピュートサンプル
concepts.synchronization.backends.title: 遷移はすべてのバックエンドで同一ではない
concepts.synchronization.barriers.context: "{barrierStagesAll} はより広いスコープであり、自動依存関係検出機能ではありません。処理を実際にカバーするステージを選択し、それらの操作をサポートするキューでのみ使用してください。"
concepts.synchronization.barriers.description: "2 つのコンピュートディスパッチを考えてみましょう。1 つ目がシミュレーションデータを書き込み、2 つ目が次のステップを実行するためにそのデータを読み取ります。両方ともストレージバッファーを使用するため、変更すべきテクスチャレイアウトはありません。コマンドバッファー上のディスパッチの間に次を挿入します:"
concepts.synchronization.barriers.details: 第 1 引数はプロデューサーステージを識別し、第 2 引数はコンシューマーステージを識別します。バリアは、GPU 上に対応する実行およびメモリの依存関係を確立します。バックエンドはそれらのステージを実行規則およびメモリアクセス規則に変換します。このバリアはテクスチャのレイアウトを変更せず、デバイス上のすべての処理を待機するわけでもありません。
concepts.synchronization.barriers.guidance: "{link} は依存するディスパッチ間でこのパターンを使用しています。依存関係が発生する場所にバリアを配置してください。コンシューマーがすでに記録された後に配置されたバリアは、そのコンシューマーを先行のプロデューサーの後に順序付けることはできません。"
concepts.synchronization.barriers.guidance.link: FluidTank シミュレーション
concepts.synchronization.barriers.title: バリアで依存するコマンドを順序付ける
concepts.synchronization.dependencies.description: 共有リソースごとに、最初にアクセスする操作、それに続く操作、およびいずれかのアクセスが書き込みを行うかどうかを特定します。同じデータを 2 回読み取る場合、内容を保護するための順序付けは不要ですが、レイアウト変更やプレゼンテーションによって他の要件が課されることがあります。書き込みに続く読み取り、読み取りに続く上書き、または 2 回の書き込みには依存関係が必要になる場合があります。
concepts.synchronization.dependencies.details: "次に、それらの操作が実行される場所に応じたメカニズムを選択します:"
concepts.synchronization.dependencies.guidance: "これらの仕組みは関連していますが、互いの代わりにはなりません。コマンドを順にサブミットするだけでは、すべてのメモリ依存関係を満たせません。キューの待機は新しいテクスチャレイアウトを宣言せず、コマンドバリアは呼び出し元の CPU スレッドを待機させません。"
concepts.synchronization.dependencies.table.cpuAccess.mechanism: 該当する完了値に対して {wait} を呼び出します。
concepts.synchronization.dependencies.table.cpuAccess.situation: データへのアクセスまたは解放の前に CPU が待機する必要がある場合
concepts.synchronization.dependencies.table.crossQueue.mechanism: その {timelineValue} をコンシューマー側のコマンドバッファーの {submit} に渡します。
concepts.synchronization.dependencies.table.crossQueue.situation: 別のキューでのサブミットがデータを生成する場合
concepts.synchronization.dependencies.table.headings.mechanism: メカニズム
concepts.synchronization.dependencies.table.headings.situation: 状況
concepts.synchronization.dependencies.table.layoutChange.mechanism: 以前のレイアウトと次のレイアウトを指定した {commandBufferTransition}。
concepts.synchronization.dependencies.table.layoutChange.situation: テクスチャサブリソースの使用方法の変更
concepts.synchronization.dependencies.table.pipelineStages.mechanism: プロデューサーステージとコンシューマーステージを指定した {commandBufferBarrier}。
concepts.synchronization.dependencies.table.pipelineStages.situation: コマンドストリーム内の依存する GPU ステージ
concepts.synchronization.dependencies.title: プロデューサーとコンシューマーから始める
concepts.synchronization.description: 先行のコマンドによって書き込まれたデータを読み取るコマンドは、それらの書き込みが完了し、自身に対して可視化されていることに依存します。書き込み側がプロデューサーであり、読み取り側がコンシューマーです。CPU も共有データの読み取り、上書き、解放の前に完了ポイントを必要とします。Zenith.NET は、これらの異なる依存関係のためにバリア、テクスチャ遷移、タイムラインを提供します。
concepts.synchronization.layouts.context: "{undefined} は、以前の内容を保持する必要がないことを意味します。これは新しい画像や完全にクリアされるアタッチメントに適しています。内容が読み込まれたり、サンプリングされたり、蓄積されたりする画像のレイアウト追跡を回避するための手段ではありません。"
concepts.synchronization.layouts.description: "用途フラグはテクスチャがサポートする役割を記述します。{textureLayout} は、特定の操作のために特定のサブリソースがどのようにアクセスされるかを記述します。サブリソースとは、選択されたミップレベルと配列レイヤーです。そのレイアウトを変更することでそのアクセスの準備が行われますが、テクスチャが異なるピクセルフォーマットに変換されるわけではありません。たとえば、コンピュートサンプルは {storage} レイアウトで出力テクスチャを書き込み、その後グラフィックスパスでそれをサンプリングします。それらの使用の間に次を記録します:"
concepts.synchronization.layouts.details: このコード片は、{outputTexture} が {sampledStorage} 用途で作成され、その選択されたサブリソースが {storage} レイアウトにあることを前提としています。{default} はミップレベル 0 と配列レイヤー 0 を選択します。この操作は、テクスチャのすべてのミップやレイヤーを遷移させるわけではありません。
concepts.synchronization.layouts.guidance: アプリケーションが以前のレイアウトを提供します。{transition} はアプリケーションから見えるレイアウトトラッカーを保持せず、先行のコマンドからその値を推測することもありません。リソースがレンダリングステージ間を通過する場所では、常にレイアウトを追跡してください。
concepts.synchronization.layouts.title: 各テクスチャサブリソースのレイアウトを追跡する
concepts.synchronization.readback.description: "{isCompleted} は、GPU タイムラインが値に達したかどうかのみを問い合わせます。それ自体がコマンドバッファーを回収したり、ステージングされたダウンロードをアプリケーションの宛先ポインターにコピーしたりするわけではありません。"
concepts.synchronization.readback.details: "{commandBufferDownload} は、まず内部リードバックストレージへのコピーを記録します。完了したコマンドバッファーを再利用のためにリセットすると、指定されたポインターへの CPU コピーが行われます。そのダウンロードのサブミット値に対する {wait} が戻るまで、転送先を有効に保ち、マネージドメモリを固定してください。データの読み取りやメモリの解放はその後に行います。別のキューの後続サブミットを待っても、ダウンロードを管理するキュー自体はポーリングされません。"
concepts.synchronization.readback.guidance: そのため、{isCompleted} をポーリングして非同期ダウンロードの宛先を直ちに読み取るだけでは不十分です。{link} で直接コピーパスとステージング転送パスについて説明しています。
concepts.synchronization.readback.guidance.link: リソース管理
concepts.synchronization.readback.title: GPU 完了とダウンロードされた CPU データは別のステップである
concepts.synchronization.reuse.description: "最初のレンダラーでは、毎フレーム直後に待機する方法がわかりやすいでしょう。複数フレームの処理を重ねて進めるには、未完了のフレームごとに変更可能なデータを分け、各フレームの最終使用の完了値を保持してください。定数バッファーの更新、テクスチャの交換、パイプラインの破棄の前に、対象リソースへのすべての未完了アクセスを終わらせてください。"
concepts.synchronization.reuse.details: リサイズ時やシャットダウン時には、古い作業を待機する前に新しい使用を停止してください。{swapChainResize}、リソースの破棄、コンテキストの破棄は、アプリケーションの作業に対する一般的な待機の役割を果たしません。前の各フレームがすでにサブミットを完了しているため、三角形チュートリアルはコールバック間で安全にリサイズできます。
concepts.synchronization.reuse.guidance: "現在の {swapChainPresent} も、プレゼンテーション操作の後にグラフィックスキューでシグナルを送って待機します。そのため、三角形の明示的なサブミット待機を削除するだけでは、複数フレームの処理を重ねて進める表示ループにはなりません。グラフィックスキューでの待機は、別のキューで実行中の独立した処理の完了も保証しません。"
concepts.synchronization.reuse.title: 最後のアクセス後にのみデータを再利用する
concepts.synchronization.timelines.context: "CPU がこれらのリソースの読み取り、上書き、解放を行う前に、その最後の使用を待機してください:"
concepts.synchronization.timelines.description: タイムラインは増加する値を使用してキュー上の完了を追跡します。{submit} はそのタイムラインとサブミットに関連付けられた値を含む {timelineValue} を返します。異なるタイムラインの完了値は、数値の {value} フィールドだけで比較することはできません。
concepts.synchronization.timelines.details: "{producer} と {consumer} が同じコンテキストの 2 つのキューからすでに記録されたコマンドバッファーであると仮定します。プロデューサーはコンシューマーが使用するデータを書き込みます。次のようにサブミットします:"
concepts.synchronization.timelines.guidance: 生成された値を渡すと、コンシューマーキューは GPU 上でそれを待機します。CPU はここで {producedWait} を呼び出しません。{consumed} が完了するまで共有リソースを有効に保ち、コンシューマーに必要なテクスチャレイアウトの変更を記録してください。
concepts.synchronization.timelines.notes: "{wait} はそのタイムライン値を待機し、完了したサブミットがないか所有キューを確認します。完了したコマンドバッファーは再利用のためにリセットされ、ステージングされたダウンロードは指定された CPU 宛先にコピーされます。{queueTimelineSignal} は、すでにそのキューにサブミットされた作業の後に完了ポイントをエンキューすることもできます。{signal} を呼び出しても、GPU がすでにそのポイントに達したことを意味するわけではありません。"
concepts.synchronization.timelines.title: 完了およびキューの引き渡しにタイムラインを使用する
concepts.synchronization.title: 同期
