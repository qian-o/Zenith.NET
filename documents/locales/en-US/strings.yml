concepts.execution.ownership.table.commandBuffers.ownership: The queue manages and recycles them.
concepts.execution.ownership.table.headings.object: Object
concepts.execution.ownership.table.headings.ownership: Who releases it?
concepts.execution.ownership.table.queues.object: Context queues and their timelines
concepts.execution.ownership.table.queues.ownership: The context and queues manage them.
concepts.execution.ownership.table.swapChainDrawable.ownership: The swap chain manages it.
concepts.execution.ownership.title: Keep ownership separate from GPU completion
concepts.execution.pipelines.description: A graphics pipeline combines shaders, the vertex input layout, the rule
  for assembling vertices into primitives, attachment formats and render state. Set it before binding vertex, index
  or constant data and issuing draw commands. Its attachment formats and sample count must match the render pass's
  attachments.
concepts.execution.pipelines.details: A compute pipeline supplies the shader entry point for a dispatch, which launches
  groups of GPU threads. Set it and its constants before dispatching. Compute dispatches belong outside graphics
  render passes. Changing the pipeline is a change in how subsequent commands interpret their inputs; bind the data
  required by the selected pipeline before using it.
concepts.execution.pipelines.guidance: The {link} shows the full graphics sequence. The {detail} records a dispatch
  followed by a graphics pass that displays the result.
concepts.execution.pipelines.guidance.detail: compute sample
concepts.execution.pipelines.guidance.link: triangle's render callback
concepts.execution.pipelines.title: A pipeline determines how commands interpret data
concepts.execution.queues.description: Start with {graphicsQueue} when a frame combines drawing, compute and copies.
  Keeping dependent work on one queue makes its ordering easier to follow.
concepts.execution.queues.details: A queue accepts batches of recorded commands for execution. It does not necessarily
  correspond to a dedicated hardware engine. Separate queue properties do not guarantee that their work runs simultaneously.
  Use another queue when there is useful work to overlap, and make the handoff explicit when it shares resources
  with the first queue.
concepts.execution.queues.guidance: When later commands depend on earlier writes, the application must also ensure
  that those writes are available to the later commands. Submitting both command buffers to the same queue does
  not establish every such dependency automatically. Commands can use different GPU stages, and later accesses may
  need a barrier or texture transition. {link} explains the distinction between submission order and resource visibility.
concepts.execution.queues.guidance.link: Synchronization
concepts.execution.queues.table.computeQueue.workToRecord: Compute dispatches and compatible transfer work, without
  graphics render passes.
concepts.execution.queues.table.graphicsQueue.workToRecord: Render passes and drawing, plus compute and transfer
  operations used by the frame.
concepts.execution.queues.table.headings.queue: Queue
concepts.execution.queues.table.headings.workToRecord: Work to record
concepts.execution.queues.table.transferQueue.workToRecord: Upload, download and copy work, without drawing or compute
  dispatches.
concepts.execution.queues.title: Choose a queue for the work it will execute
concepts.execution.recording.context: The queue polls for completion and recycles finished command buffers. Call
  {queueCommandBuffer} for each new recording; it may return a recycled instance. Do not dispose a borrowed command
  buffer, submit it twice, or keep recording into it after submission. Record a given command buffer from one thread
  at a time; the queue's internal locking does not protect concurrent edits to a command buffer.
concepts.execution.recording.description: '{queueCommandBuffer} returns a {commandBuffer} with recording already
  begun. Record the commands and their dependencies, then call {submit} once. Submission ends recording and returns
  a {timelineValue} identifying a completion point on that queue.'
concepts.execution.recording.details: 'For example, after recording a frame into {commandBuffer}, the triangle submits
  it and waits for completion with:'
concepts.execution.recording.guidance: '{submit} schedules the work; {wait} keeps the CPU from continuing until
  that submission has completed. Recording a draw, ending a render pass and submitting a command buffer are separate
  operations. Neither recording the draw nor ending the pass waits for the GPU.'
concepts.execution.recording.title: Recording does not execute commands
concepts.execution.title: Execution Model
concepts.platforms.description: A renderer can present directly into a native window or draw through a UI framework's
  control. The host is the application code or UI framework responsible for displaying frames. It determines who
  manages the drawable—the texture rendered into for the current frame—as well as submission, presentation and resize.
  Offscreen graphics and compute work do not require a window or swap chain.
concepts.platforms.frame.context: Add your pipeline bindings and draw commands inside that pass. End the pass before
  returning. Do not submit the supplied command buffer or present independently, and do not dispose the command
  buffer or drawable. If your handler uses the drawable in another layout, return it to {colorAttachment} for the
  control's final transition.
concepts.platforms.frame.description: The integrations implement {iZenithView}. The application supplies its {graphicsContext},
  updates scene data in {updateRequested}, and records rendering in {renderRequested} using {renderEventArgs}.
concepts.platforms.frame.details: The control owns the frame boundary. It obtains the drawable and command buffer,
  transitions the drawable to {colorAttachment}, invokes the handlers, then performs the submission and presentation
  steps required by that framework.
concepts.platforms.frame.guidance: 'For an initialized {iZenithView} named {view}, with a context assigned, this
  handler records a complete clear pass. It requires {usingZenithNET}:'
concepts.platforms.frame.notes: The controls transition from {undefined} at the start of each frame, so applications
  cannot rely on the drawable's previous contents being preserved. Clear or render the required image each frame.
  Keep persistent accumulation or cached rendering in an application-owned texture, then display that texture through
  the view.
concepts.platforms.frame.reference: '{zenithViewHelperDrawableFormat} supplies the integrations'' default color
  format. Check the actual event drawable when matching attachment formats, sample counts and dimensions.'
concepts.platforms.frame.title: Record into the frame supplied by a UI control
concepts.platforms.integration.context: WinForms, WPF and the Windows WinUI path require Windows. MAUI applications
  need their target platform's workload and must register the control handler with {useZenithView}; see {extensionsCs}.
  Framework support and backend support must both be satisfied.
concepts.platforms.integration.description: 'The controls share the event interface, but they do not all present
  in the same way:'
concepts.platforms.integration.details: Bitmap readback copies rendered pixels from GPU storage into CPU memory
  before the UI displays them. Shared-texture interop avoids that pixel readback path but can still perform GPU
  copies and synchronization. Do not assume a shared {renderRequested} interface implies the same presentation cost
  or native interop requirements.
concepts.platforms.integration.guidance: 'Use the package for the application''s framework; for example:'
concepts.platforms.integration.table.avalonia.integration: Avalonia
concepts.platforms.integration.table.avalonia.presentation: Renders to a texture and downloads pixels into a {writeableBitmap}.
  See {zenithViewCs} and {surfaceCs}.
concepts.platforms.integration.table.headings.integration: Integration
concepts.platforms.integration.table.headings.presentation: How its image reaches the UI
concepts.platforms.integration.table.maui.integration: .NET MAUI
concepts.platforms.integration.table.maui.presentation: Uses native surfaces on Android, iOS and Mac Catalyst, and
  shared-texture composition on Windows. See the {link}.
concepts.platforms.integration.table.maui.presentation.link: platform implementations
concepts.platforms.integration.table.uno.integration: Uno path
concepts.platforms.integration.table.uno.presentation: Downloads pixels into a {writeableBitmap}. See {zenithViewUnoCs}.
concepts.platforms.integration.table.winForms.integration: WinForms
concepts.platforms.integration.table.winForms.presentation: Creates a Zenith.NET swap chain for the control's {hWND}.
  See {zenithViewCs}.
concepts.platforms.integration.table.winUI.integration: WinUI on Windows
concepts.platforms.integration.table.winUI.presentation: Renders into an imported shared Direct3D 11 texture, then
  copies to a composition swap chain attached to {swapChainPanel}. See {zenithViewWinUICs}.
concepts.platforms.integration.table.wpf.integration: WPF
concepts.platforms.integration.table.wpf.presentation: Imports a shared Direct3D 11 texture, then copies through
  Direct3D interop to a surface displayed by {d3DImage}. See {surfaceCs}.
concepts.platforms.integration.title: Choose the presentation path as well as the framework
concepts.platforms.lifecycle.context: For a UI view, use the event drawable's {descWidth}, {descHeight}, {descFormat}
  and {descSampleCount} when creating matching rendering resources. The control determines that drawable's resolution;
  do not assume its logical dimensions or display scale always equal the texture dimensions.
concepts.platforms.lifecycle.description: For a native swap chain, pass framebuffer dimensions in pixels. Window
  sizes expressed in logical units can differ when display scaling is enabled. Skip zero-size framebuffers, resize
  the swap chain when its pixel size changes, and obtain {swapChainDrawable} for each frame. The drawable is owned
  by the swap chain and can change after presentation or resize.
concepts.platforms.lifecycle.details: '{swapChainResize} changes the dimensions of the existing surface. {swapChainRefresh}
  replaces the surface description, including its native handles. Before either operation, complete outstanding
  uses of the affected resources. Dispose the swap chain before destroying its native presentation target.'
concepts.platforms.lifecycle.guidance: Recreate application-owned depth or offscreen textures whose size follows
  the window, and update constants containing their handles. A pipeline can remain in use across a size change when
  its attachment formats and sample count remain compatible. The {link} keeps its pipeline while replacing its depth
  texture.
concepts.platforms.lifecycle.guidance.link: spinning cube renderer
concepts.platforms.lifecycle.title: Keep the drawable's size and lifetime with its host
concepts.platforms.ownership.description: The application owns the context it assigns and the resources it creates
  for rendering. The control owns its own presentation resources. Changing {graphicsContext} makes the scheduler
  recreate the control's resources; it does not recreate the application's pipelines, buffers or textures for the
  new context.
concepts.platforms.ownership.details: Coordinate resource replacement with the view's frame lifecycle. Stop the
  view's frame activity and finish outstanding GPU uses before disposing application resources or the assigned context.
  Removing a view does not transfer context ownership to the control.
concepts.platforms.ownership.guidance: The shared {frameSchedulerCs} dispatches frame work through the view's UI
  dispatcher. Keep frame handlers focused on updating and recording the frame; lengthy CPU work there also delays
  the UI.
concepts.platforms.ownership.title: Keep application resources outside the control's ownership
concepts.platforms.surface.context: A windowing library or UI framework supporting an operating system does not
  guarantee that the selected GPU backend is available there. Device features, drivers and native surface support
  still have to match. Check optional ray tracing and mesh shading through {contextCapabilities} before creating
  those workloads.
concepts.platforms.surface.description: The {link} uses Silk.NET to create a window and process events. Zenith.NET
  connects to that window through a {surface} description and a {swapChain}. A surface contains native handles and
  dimensions; constructing the description does not create or own the operating-system window.
concepts.platforms.surface.description.link: triangle
concepts.platforms.surface.details: 'The handle must match the selected backend:'
concepts.platforms.surface.guidance: The tutorial's {appCs} shows the Windows, macOS and X11 choices. Its Linux
  host supplies Xlib handles; using it in a Wayland session requires XWayland. A native Wayland application would
  supply different handles through {surfaceWayland}.
concepts.platforms.surface.table.android.backend: Vulkan on Android.
concepts.platforms.surface.table.apple.backend: Metal on Apple platforms.
concepts.platforms.surface.table.headings.backend: Backend path
concepts.platforms.surface.table.headings.factory: Surface factory
concepts.platforms.surface.table.headings.handles: Handles supplied by the host
concepts.platforms.surface.table.wayland.backend: Vulkan with a native Wayland host.
concepts.platforms.surface.table.wayland.handles: Wayland display and surface
concepts.platforms.surface.table.win32.backend: DirectX 12 or Vulkan on Windows.
concepts.platforms.surface.table.xlib.backend: Vulkan on Linux with X11 or XWayland.
concepts.platforms.surface.table.xlib.handles: X11 display and window
concepts.platforms.surface.title: Supply a native surface when the application owns presentation
concepts.platforms.title: Platform Integration
concepts.resources.allocation.context: Start with context-created resources unless you need an allocator of your
  own. When using a heap, dispose its placed resources before the heap itself, after all GPU work that uses them
  finishes.
concepts.resources.allocation.description: A {heap} supplies memory in which you place resources at explicit byte
  offsets. The application chooses those offsets and tracks which regions are in use.
concepts.resources.allocation.details: Use {contextGetSizeAndAlignment} with the exact buffer or texture description
  before placing it. Choose an offset that is a multiple of the returned alignment, reserve the returned size, and
  keep the resource inside the heap's total byte size. Keep live allocations in non-overlapping regions. Texture
  storage can include backend-specific padding and alignment, so pixel count multiplied by bytes per pixel is not
  an allocation-size calculation.
concepts.resources.allocation.guidance: For placed buffers, keep the buffer's residency consistent with the heap's
  residency. Use GPU-only heaps for the ordinary GPU textures described here. Size and alignment are placement requirements,
  not a promise that any resource can be placed into any heap on every backend.
concepts.resources.allocation.title: Place resources in a heap when allocation control is needed
concepts.resources.bufferUsages.table.constant.role: Shader parameters read through a constant-buffer binding.
concepts.resources.bufferUsages.table.headings.role: Role
concepts.resources.bufferUsages.table.headings.usage: Usage
concepts.resources.bufferUsages.table.index.role: Indices used by indexed drawing.
concepts.resources.bufferUsages.table.indirect.role: Arguments read by indirect draw or dispatch commands.
concepts.resources.bufferUsages.table.none.role: No buffer usage flags are declared.
concepts.resources.bufferUsages.table.storageReadOnly.role: Buffer data accessed through a read-only shader binding.
concepts.resources.bufferUsages.table.storageReadWrite.role: Buffer data accessed through a read/write shader binding.
concepts.resources.bufferUsages.table.transferDst.role: Destination storage for a GPU copy.
concepts.resources.bufferUsages.table.transferSrc.role: Source data for a GPU copy.
concepts.resources.bufferUsages.table.vertex.role: Vertex attributes fetched for drawing.
concepts.resources.bufferUsages.title: Buffer usages
concepts.resources.description: Choose a resource description from the operations that will use it. A texture rendered
  into, sampled by a shader and downloaded to the CPU needs all three uses declared, along with the synchronization
  between them. Memory placement and resource lifetime are additional decisions.
concepts.resources.memory.context: For a CPU-accessible buffer, {map} gives the CPU an address. It does not wait
  for the GPU to stop accessing the same bytes. {unmap} likewise does not submit work or wait for completion. Before
  overwriting CPU-writable data, finish the GPU reads that still need its old contents.
concepts.resources.memory.description: 'A {bufferDesc} has a {residency} field. Choose it according to how the CPU
  and GPU will access the data:'
concepts.resources.memory.details: Residency describes the intended CPU access to the allocation. It does not imply
  that every device has separate physical CPU and GPU memory. The triangle uses {cpuWriteOnly} to initialize a small
  vertex buffer directly. A large static mesh may instead benefit from GPU-only storage with a one-time upload.
concepts.resources.memory.guidance: '{textureDesc} has no residency field. Ordinary context-created textures use
  GPU storage in the backends; the public texture API provides upload and download operations rather than a {map}
  method. Explicit heaps provide placement control, described below.'
concepts.resources.memory.table.cpuReadOnly.cPUAccess: Read mapped memory after the GPU copy finishes.
concepts.resources.memory.table.cpuReadOnly.typicalRole: Readback data produced by the GPU
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: Write mapped memory after previous GPU readers finish.
concepts.resources.memory.table.cpuWriteOnly.typicalRole: Data supplied or updated by the CPU
concepts.resources.memory.table.gpuOnly.cPUAccess: Transfer bytes through an upload or readback buffer.
concepts.resources.memory.table.gpuOnly.typicalRole: Static geometry and GPU working data
concepts.resources.memory.table.headings.cPUAccess: CPU access
concepts.resources.memory.table.headings.residency: Residency
concepts.resources.memory.table.headings.typicalRole: Typical role
concepts.resources.memory.title: Choose memory for the CPU access you need
concepts.resources.textureUsages.description: '{transferSrc} and {transferDst} describe the direction of GPU copies.
  CPU access is a separate memory-placement choice, described below.'
concepts.resources.textureUsages.details: Combining usage flags declares several roles; it does not perform the
  operations or order their accesses. Textures still need the appropriate {link}, and their formats must support
  the requested uses on the selected device.
concepts.resources.textureUsages.details.link: layout and synchronization
concepts.resources.textureUsages.table.colorAttachment.role: A color attachment in a render pass.
concepts.resources.textureUsages.table.depthStencilAttachment.role: A depth/stencil attachment in a render pass.
concepts.resources.textureUsages.table.headings.role: Role
concepts.resources.textureUsages.table.headings.usage: Usage
concepts.resources.textureUsages.table.none.role: No texture usage flags are declared.
concepts.resources.textureUsages.table.sampled.role: Texture data read through a sampled-texture binding.
concepts.resources.textureUsages.table.storage.role: Texture data accessed through a storage-texture binding for
  shader reads or writes.
concepts.resources.textureUsages.table.transferDst.role: Destination image storage for a GPU copy.
concepts.resources.textureUsages.table.transferSrc.role: Source image data for a GPU copy.
concepts.resources.textureUsages.title: Texture usages
concepts.resources.title: Resource Management
concepts.resources.transfers.context: A download records a GPU copy into internal readback storage. The library
  copies those bytes into the supplied CPU destination when it resets the completed command buffer for reuse. Keep
  the destination allocated, and keep managed memory pinned, until the submission value's {wait} returns.
concepts.resources.transfers.description: 'An upload copies CPU data toward a GPU resource; a download copies resource
  data back to CPU memory. The resource-level methods complete that transfer before returning:'
concepts.resources.transfers.details: Those waits cover the transfer they submit. They do not discover dependencies
  on a different queue that was already reading or writing the resource. Establish those dependencies before calling
  the resource-level method. A direct mapped copy also relies on the caller to ensure GPU completion.
concepts.resources.transfers.guidance: 'Use {commandBufferUpload} or {commandBufferDownload} when copies should
  be recorded with other work. Their pointer lifetimes differ:'
concepts.resources.transfers.item: An upload copies the CPU source into an internal upload buffer, also called staging
  memory, during the call. The source pointer only needs to remain valid for that call.
concepts.resources.transfers.notes: For a texture, a row stride is the byte distance between successive rows of
  CPU data, and a slice stride is the byte distance between successive depth slices. They are not the texture's
  internal GPU memory layout. See {link} for the completion and readback distinction.
concepts.resources.transfers.notes.link: Synchronization
concepts.resources.transfers.table.bufferDownload.transfer: Direct CPU copy for {cpuReadOnly}; otherwise submits
  a transfer-queue download and waits.
concepts.resources.transfers.table.bufferUpload.transfer: Direct CPU copy for {cpuWriteOnly}; otherwise submits
  a transfer-queue upload and waits.
concepts.resources.transfers.table.headings.method: Method
concepts.resources.transfers.table.headings.transfer: How it transfers data
concepts.resources.transfers.table.textureTransfers.method: '{textureUpload} / {textureDownload}'
concepts.resources.transfers.table.textureTransfers.transfer: Use the graphics queue, transition the selected subresource
  for the copy, transition to the requested final layout, and wait.
concepts.resources.transfers.title: Choose between an immediate transfer and recorded transfers
concepts.resources.usages.description: '{bufferUsages} and {textureUsages} are flag enums that declare a resource''s
  intended roles. They are assigned to {bufferDescUsages} and {textureDescUsages}, respectively. A flag enum allows
  several members to be combined with {value} when a resource has more than one role.'
concepts.resources.usages.title: Declare the required uses before creating a resource
concepts.resources.views.description: A {bufferView} describes a buffer region and its interpretation. A {textureView}
  selects a compatible texture type, format and subresource range. A view shares the backing storage; it does not
  copy the data or add usages that were missing when the resource was created. Its range is also not a portable
  guarantee of shader bounds checking.
concepts.resources.views.details: Use the resource's own handle for its default view, or create a view when a different
  region or compatible interpretation is needed. Keep C# references to the view and its backing resource while GPU
  work can use them; a resource handle alone does not keep either object alive. Dispose them only after their last
  GPU use has completed. After replacing either one, update constants that contain its old {link}.
concepts.resources.views.details.link: resource handle
concepts.resources.views.guidance: The {link} shows a depth texture replaced on resize. The {detail} shows an input
  texture kept separate from its writable output. Both make the resource's lifetime follow the work that actually
  uses it.
concepts.resources.views.guidance.detail: compute sample
concepts.resources.views.guidance.link: spinning cube
concepts.resources.views.title: Keep views and their backing resources usable together
concepts.shaders.binding.context: 'In the compute sample, {input} is filled with {inputTextureSampledHandle} and
  {output} with {outputTextureStorageHandle}. Slang''s typed {descriptorHandle} tells the shader how to access each
  resource:'
concepts.shaders.binding.description: '{setConstantBuffer} binds a buffer and byte offset for the current pipeline''s
  constant data. It binds existing GPU-visible storage; it does not upload a C# value. Fill the buffer first, and
  ensure earlier GPU readers have finished before overwriting its bytes.'
concepts.shaders.binding.details: 'Set the pipeline before its constant buffer. For a compute workload with resources
  already created and uploaded, recording uses this order:'
concepts.shaders.binding.guidance: This fragment assumes an already-recording {commandBuffer}, a {computePipeline},
  an uploaded {constantBuffer} with {bufferUsagesConstant}, and the thread-group counts for the workload. Offset
  0 binds the beginning of the buffer. If several constant-data records share a buffer, each record's starting offset
  must satisfy the backend's binding alignment. That requirement is separate from the layout of fields inside each
  record.
concepts.shaders.binding.notes: '{resourceHandle} stores two 32-bit fields, but its interpretation belongs to the
  backend. Do not treat it as a universal descriptor index, address or value that can be transferred between contexts.
  A handle does not create a resource, add a missing usage or perform synchronization.'
concepts.shaders.binding.reference: Keep references to the resource and any view used to obtain its handle, and
  dispose them only after the shader's last use completes. When replacing a texture or view, update the constants
  that contain its old handle. {link} explains that lifetime relationship.
concepts.shaders.binding.reference.link: Resource Management
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: Read structured elements of shader type {t}.
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: Read or write structured elements of shader
  type {t}.
concepts.shaders.binding.table.headings.access: Intended access
concepts.shaders.binding.table.headings.cHandle: C# handle
concepts.shaders.binding.table.headings.slangFieldType: Slang field type
concepts.shaders.binding.table.samplerHandle.access: Supply texture sampling state.
concepts.shaders.binding.table.textureSampledHandle.access: Read a texture.
concepts.shaders.binding.table.textureStorageHandle.access: Read or write a storage texture.
concepts.shaders.binding.title: Bind the constant buffer and the resources it describes
concepts.shaders.compilation.description: '{zenithCompiler} compiles a named Slang entry point and returns a {shaderDesc}.
  Use the context''s {graphicsApi} so the result targets the backend that will create the shader: DXIL for DirectX
  12, a Metal library for Metal, or SPIR-V for Vulkan.'
concepts.shaders.compilation.details: 'For example, with an existing {context} and the triangle''s shader copied
  beside the executable:'
concepts.shaders.compilation.guidance: '{vSMain} must match the entry-point name in the file. Create the pipeline
  while its shader objects are valid; they can be disposed after pipeline creation, as shown in {link}. Compile
  shaders and create pipelines during initialization rather than repeating that work for every frame.'
concepts.shaders.compilation.guidance.link: First Triangle
concepts.shaders.compilation.title: Compile an entry point for the selected context
concepts.shaders.description: 'A shader receives data supplied by the application. Vertex attributes describe individual
  vertices; buffers hold parameters or arrays; resource handles identify other resources the shader will access.
  The C# declarations and Slang declarations must agree on what those values mean. Matching a field name is not
  enough: layout, resource access and binding all need to match.'
concepts.shaders.dispatch.description: '{dispatch} takes the number of thread groups. The compute sample''s {numthreads}
  entry point runs 16 × 16 threads per group. Divide the image dimensions by 16 and round up to find the group counts.
  For example, a 17 × 19 image needs 2 × 2 groups. The shader checks its pixel coordinates against the image dimensions
  because the last groups can contain threads outside the image.'
concepts.shaders.dispatch.details: The compiler stores the entry point's declared group size in {shaderDescThreadGroupSize};
  it does not convert pixel dimensions supplied to {dispatch} into group counts. Use {computeShaderRendererCs} with
  its shader for the complete binding and dispatch example, and {link} before another pass consumes the output.
concepts.shaders.dispatch.details.link: Synchronization
concepts.shaders.dispatch.title: Dispatch thread groups, not pixels
concepts.shaders.layout.context: 'The {link} make their offsets explicit. This declaration needs {systemRuntimeInteropServices}
  and {zenithNET} in scope:'
concepts.shaders.layout.context.link: compute sample's C# constants
concepts.shaders.layout.description: For vertex input, the pipeline's {inputLayout} describes formats, offsets,
  stride and semantics. The triangle's {float3} position followed by a {float4} color occupies 28 bytes, with color
  at byte 12. {inputLayoutAdd} computes this packed layout; it does not inspect the C# struct. If the C# fields
  contain padding, supply a matching layout instead of assuming the fields are packed.
concepts.shaders.layout.details: Constant buffers hold shader parameters, while structured buffers hold arrays of
  elements of a declared type. Both are read according to their Slang declarations. They do not use {inputLayout}.
  Verify field offsets and element sizes for the compiled shader representation, including padding. An unmanaged
  C# type is suitable for copying as bytes, but that alone does not prove it matches a shader type. In particular,
  do not apply a vertex's tightly packed {float3} layout to every shader buffer.
concepts.shaders.layout.guidance: A resource handle is a small value that refers to an existing resource. Copying
  the handle into a constant buffer does not copy the resource's contents.
concepts.shaders.layout.notes: 'The corresponding declaration in {computeShaderSlang} is:'
concepts.shaders.layout.reference: The dimensions occupy the first eight bytes, followed by two eight-byte resource
  handles. The C# sample reserves 256 bytes in total. That size is the sample's chosen storage size, not a rule
  that all Slang structs or constant payloads occupy 256 bytes. Padding the total size also does not correct a field
  at the wrong offset.
concepts.shaders.layout.title: Vertex input and shader data have different layout rules
concepts.shaders.matrices.description: The compiler requests row-major matrix storage, which stores each row's elements
  together. The {link} places three {matrix4x4} values at offsets 0, 64 and 128. Its {detail} uses {mulVectorMatrix}
  in model, view and projection order.
concepts.shaders.matrices.description.detail: shader
concepts.shaders.matrices.description.link: spinning cube renderer
concepts.shaders.matrices.details: Storage order determines how matrix elements occupy memory; multiplication order
  determines the transformation. Keep both sides consistent. Adding a transpose without checking those two choices
  can conceal one mismatch while introducing another.
concepts.shaders.matrices.title: Keep matrix storage and multiplication consistent
concepts.shaders.title: Shader Data and Binding
concepts.synchronization.backends.description: DirectX 12 and Vulkan encode texture transitions with layout and
  access information. Metal has no operation in Zenith.NET's {transition} implementation. Metal groups recorded
  work into render and compute encoders. The backend inserts visibility barriers when it ends these groups, making
  earlier writes available to later work. Explicit {barrier} calls handle dependencies such as successive compute
  dispatches within the same encoder.
concepts.synchronization.backends.details: This distinction matters when changing a workload. In the {link}, the
  dispatch is followed by a graphics render pass, which also creates an encoder boundary on Metal. Two dependent
  compute dispatches do not create that boundary merely by changing the texture's declared layout. Keep the transitions
  required by the shared API, and separately identify the dependency between the actual producing and consuming
  commands.
concepts.synchronization.backends.details.link: compute sample
concepts.synchronization.backends.title: A transition is not identical on every backend
concepts.synchronization.barriers.context: '{barrierStagesAll} is a broader scope, not an automatic dependency detector.
  Select stages that actually cover the work, and use them only on a queue that supports those operations.'
concepts.synchronization.barriers.description: 'Consider two compute dispatches: the first writes simulation data,
  and the second reads that data to perform the next step. Both use storage buffers, so there is no texture layout
  to change. Insert this between the dispatches on their command buffer:'
concepts.synchronization.barriers.details: The first argument identifies the producing stage and the second the
  consuming stage. The barrier establishes the corresponding execution and memory dependency on the GPU. The backend
  translates those stages into its execution and memory-access rules. This barrier does not change a texture's layout
  or wait for all work on the device.
concepts.synchronization.barriers.guidance: The {link} uses this pattern between dependent dispatches. Place a barrier
  where the dependency occurs. A barrier after the consumer has already been recorded cannot order that consumer
  after an earlier producer.
concepts.synchronization.barriers.guidance.link: FluidTank simulation
concepts.synchronization.barriers.title: Order dependent commands with a barrier
concepts.synchronization.dependencies.description: For each shared resource, identify the operation that accesses
  it first, the operation that follows, and whether either access writes. Reading the same data twice does not require
  ordering to protect its contents, although layout changes or presentation can impose other requirements. A write
  followed by a read, a read followed by an overwrite, or two writes can require a dependency.
concepts.synchronization.dependencies.details: 'Then choose the mechanism for where those operations execute:'
concepts.synchronization.dependencies.guidance: These mechanisms are related, but not interchangeable. Submitting
  commands in order does not replace every memory dependency. A queue wait does not declare a new texture layout,
  and a command barrier does not wait on the calling CPU thread.
concepts.synchronization.dependencies.table.cpuAccess.mechanism: Call {wait} on the relevant completion value.
concepts.synchronization.dependencies.table.cpuAccess.situation: The CPU must wait before accessing or releasing
  data
concepts.synchronization.dependencies.table.crossQueue.mechanism: Pass its {timelineValue} to the consuming command
  buffer's {submit}.
concepts.synchronization.dependencies.table.crossQueue.situation: A submission on another queue produces the data
concepts.synchronization.dependencies.table.headings.mechanism: Mechanism
concepts.synchronization.dependencies.table.headings.situation: Situation
concepts.synchronization.dependencies.table.layoutChange.mechanism: '{commandBufferTransition} with its previous
  and next layouts.'
concepts.synchronization.dependencies.table.layoutChange.situation: A texture subresource changes how it is used
concepts.synchronization.dependencies.table.pipelineStages.mechanism: '{commandBufferBarrier} with the producing
  and consuming stages.'
concepts.synchronization.dependencies.table.pipelineStages.situation: Dependent GPU stages in a command stream
concepts.synchronization.dependencies.title: Start with the producer and the consumer
concepts.synchronization.description: 'When one operation uses data written by another, the later operation must
  wait for the writes it depends on and be able to read their results. This is a data dependency: the operation
  writing the data is the producer, and the operation using it is the consumer. The CPU also needs to know when
  it can read, overwrite or release that data. Zenith.NET exposes command barriers, texture transitions and queue
  timelines for these different dependencies.'
concepts.synchronization.layouts.context: '{undefined} means the previous contents need not be preserved. It is
  suitable for a new image or an attachment that will be fully cleared. It is not a way to avoid tracking the layout
  of an image whose contents will be loaded, sampled or accumulated into.'
concepts.synchronization.layouts.description: 'Usage flags describe which roles a texture supports. {textureLayout}
  describes how a particular subresource will be accessed for an operation. A subresource is a selected mip level
  and array layer. Changing its layout prepares that access; it does not convert the texture to a different pixel
  format. For example, the compute sample writes an output texture in {storage} layout and then samples it in a
  graphics pass. Between those uses it records:'
concepts.synchronization.layouts.details: This fragment assumes that {outputTexture} was created with {sampledStorage}
  usage and that its selected subresource is in {storage} layout. {default} selects mip level 0 and array layer
  0. The operation does not transition every mip or layer of a texture.
concepts.synchronization.layouts.guidance: The application supplies the previous layout. {transition} does not maintain
  an application-visible layout tracker or infer that value from earlier commands. Track the layout wherever a resource
  passes between rendering stages.
concepts.synchronization.layouts.title: Track the layout of each texture subresource
concepts.synchronization.readback.description: '{isCompleted} only queries whether the GPU timeline has reached
  a value. It does not itself reclaim command buffers or copy staged downloads into the application''s destination
  pointer.'
concepts.synchronization.readback.details: '{commandBufferDownload} first records a copy into internal readback
  storage. Resetting the completed command buffer for reuse performs the CPU copy to the supplied pointer. Keep
  that destination valid, and managed storage pinned, through the download submission''s {wait} before reading it
  or releasing the memory. Waiting on another queue''s later submission does not itself poll the download''s owning
  queue.'
concepts.synchronization.readback.guidance: This is why polling {isCompleted} and immediately reading an asynchronous
  download destination is insufficient. {link} covers the direct-copy and staged-transfer paths.
concepts.synchronization.readback.guidance.link: Resource Management
concepts.synchronization.readback.title: GPU completion and downloaded CPU data are separate steps
concepts.synchronization.reuse.description: For a first renderer, an immediate wait after each frame is straightforward.
  To overlap work, give outstanding frames separate mutable data and retain the completion value of each frame's
  final use. Before updating a constant buffer, replacing a texture or disposing a pipeline, finish every outstanding
  access to the affected resource.
concepts.synchronization.reuse.details: On resize or shutdown, stop new uses before waiting for old ones. {swapChainResize},
  resource disposal and context disposal do not serve as general waits for application work. The triangle can resize
  safely between callbacks because each preceding frame has already completed its submission.
concepts.synchronization.reuse.guidance: The current {swapChainPresent} also signals and waits on the graphics queue
  after its presentation operation. Removing the triangle's explicit submission wait therefore does not by itself
  establish an overlapping presentation loop. A graphics-queue wait also says nothing about independent work still
  running on another queue.
concepts.synchronization.reuse.title: Reuse data only after its final access
concepts.synchronization.timelines.context: 'Before the CPU reads, overwrites or releases those resources, wait
  for their final use:'
concepts.synchronization.timelines.description: A timeline tracks completion on a queue using increasing values.
  {submit} returns a {timelineValue} containing that timeline and the value associated with the submission. Completion
  values from different timelines are not comparable just by their numeric {value} fields.
concepts.synchronization.timelines.details: 'Suppose {producer} and {consumer} are already-recorded command buffers
  from two queues of the same context. The producer writes data that the consumer uses. Submit them like this:'
concepts.synchronization.timelines.guidance: The supplied value becomes a GPU-side queue wait before the consuming
  work. The CPU does not call {producedWait} in this sequence. Keep the shared resources valid until {consumed}
  has completed, and still record any texture layout changes required by the consumer.
concepts.synchronization.timelines.notes: '{wait} waits for that timeline value and then checks its owning queue
  for completed submissions. Finished command buffers are reset for reuse, and their staged downloads are copied
  into the supplied CPU destinations. {queueTimelineSignal} can also enqueue a completion point after work already
  submitted to that queue. Calling {signal} does not mean the GPU has already reached the point.'
concepts.synchronization.timelines.title: Use a timeline for completion and queue handoffs
concepts.synchronization.title: Synchronization
