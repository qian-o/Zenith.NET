### YamlMime:Resources
concepts.execution.context.description: A {graphicsContext} represents one backend device and provides its graphics,
  compute and transfer queues. Create the buffers, textures, shaders and pipelines for a workload through the same
  context. A resource or handle created by another context cannot simply be bound to this one's command buffers.
concepts.execution.context.details: Choose the backend for the platform and presentation surface. The API remains
  shared, but device support still matters. {capabilities} exposes the device name and the {rayTracingSupported}
  and {meshShadingSupported} flags. Check the corresponding flag before creating an optional workload, as the {link}
  and {detail} samples do. These flags are not a complete list of format, memory or platform restrictions.
concepts.execution.context.details.detail: mesh shading
concepts.execution.context.details.link: ray tracing
concepts.execution.context.title: The context connects resources and queues
concepts.execution.description: A Zenith.NET application creates GPU resources, such as buffers and textures, records
  commands that use them, and submits those commands to a queue. The CPU can continue while the GPU executes the
  submission. Understanding where that boundary lies tells you when data may be changed and when resources may be
  released.
concepts.execution.ownership.description: Here, ownership means responsibility for disposal. A C# reference keeps
  a managed object reachable; it does not prevent an explicit {dispose} from destroying the native resource. Likewise,
  submitting a command that uses a buffer does not transfer ownership of that buffer to the queue.
concepts.execution.ownership.details: On shutdown, stop submitting new work, wait for the last uses on every queue
  involved, release the application's resources, then dispose the context. Context disposal releases its own queues
  and internal helpers; it does not wait for all application work or dispose every resource the application created.
concepts.execution.ownership.guidance: The same rule applies during normal rendering. A completion value can tell
  you when a frame's buffer is safe to overwrite or a resized texture is safe to replace. Resource lifetime is covered
  further in {link}.
concepts.execution.ownership.guidance.link: Resource Management
concepts.execution.ownership.table.applicationResources.object: Resources created by the application
concepts.execution.ownership.table.applicationResources.ownership: The application disposes them after their last
  GPU use.
