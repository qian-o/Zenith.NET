samples.computeShader.description: Converts an image to grayscale with a compute dispatch and displays the resulting
  texture. It shows resource handles for a sampled input texture and a writable output texture, rounded-up thread-group
  counts and a shader bounds check. Keep the included {assetsTexturesShokoPng} asset; the renderer processes it
  once and presents the result on subsequent frames.
samples.computeShader.details: '{computeShaderRendererCs} · {computeShaderSlang}'
samples.computeShader.title: Compute Shader
samples.cube.description: Adds indexed drawing, model, view and projection matrices in a constant buffer and depth
  testing. The depth texture is recreated on resize. Use it when moving from clip-space geometry to a transformed
  object; the renderer uses a {d32FloatS8UInt} depth/stencil attachment.
samples.cube.details: '{spinningCubeRendererCs} · {spinningCubeSlang}'
samples.cube.title: Spinning Cube
samples.description: Use these examples to see how a particular rendering or compute workload fits together. The
  focused examples link to both the C# code that creates resources and records commands and the Slang code executed
  by the GPU. For a step-by-step application from an empty project, start with {link}.
samples.description.link: First Triangle
samples.execution.description: '{link} contains six independent renderers in one desktop application. Use the .NET
  10 SDK and a supported desktop backend as described below. Build and run the application, then select a sample
  from the console menu:'
samples.execution.description.link: ZenithTutorials
samples.execution.details: The host selects DirectX 12 on Windows, Metal on macOS and Vulkan on Linux. Use a device,
  driver and shader compiler environment supported by the selected backend. The Linux window path requires X11 or
  XWayland. The {link} declares package dependencies and copies the shader and texture assets needed at runtime.
samples.execution.details.link: project file
samples.execution.guidance: The samples share windowing and presentation code. You can choose any example independently
  according to the feature you want to study.
samples.execution.title: Run the tutorial samples
samples.host.description: '{appCs} creates the context, window and swap chain. It obtains a command buffer, calls
  the selected renderer, submits the frame and presents it. {iRendererCs} defines the renderer''s update, render,
  resize and disposal methods.'
samples.host.details: Compute and ray tracing produce offscreen textures. {texturePresenterCs} and {presentTextureSlang}
  draw those textures into the window's drawable. The host still owns submission and swap-chain presentation.
samples.host.title: Shared host and presentation
samples.indirectDrawing.description: Draws several copies of a cube using an indexed indirect argument buffer and
  per-instance data in a structured buffer. The CPU supplies the draw arguments and updates the transforms. Use
  it to understand the indirect argument layout and shader access to instance data before adding GPU-generated arguments.
samples.indirectDrawing.details: '{indirectDrawingRendererCs} · {indirectDrawingSlang}'
samples.indirectDrawing.title: Indirect Drawing
samples.meshShading.description: Uses a task shader to cull sphere instances and pass their indices to a mesh shader
  that emits geometry. The renderer checks {contextCapabilitiesMeshShadingSupported} before creating its pipeline.
  Use it to follow resource handles and payload data through the task and mesh stages.
samples.meshShading.details: '{meshShadingRendererCs} · {meshShadingSlang}'
samples.meshShading.title: Mesh Shading
samples.rayTracing.description: Builds bottom-level and top-level acceleration structures for a floor and procedural
  spheres, then traces inline ray queries in a compute shader. The renderer checks {contextCapabilitiesRayTracingSupported}
  before constructing the workload. Use this example for acceleration-structure inputs and shader-side ray traversal.
samples.rayTracing.details: '{rayTracingRendererCs} · {rayTracingSlang}'
samples.rayTracing.title: Ray Tracing
samples.title: Samples
samples.triangle.description: Creates a vertex buffer and matching input layout, then draws three vertices through
  a graphics pipeline. Use it to connect resource creation with the commands in a render pass.
samples.triangle.details: '{helloTriangleRendererCs} · {helloTriangleSlang} · {link}'
samples.triangle.details.link: Complete tutorial
samples.triangle.title: Hello Triangle
