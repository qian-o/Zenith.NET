samples.host.description: "{appCs} initializes the context, window, and swap chain. On each frame it obtains a command
  buffer, invokes the selected renderer, submits the commands, and presents the result. {iRendererCs} defines the
  renderer's update, render, resize, and disposal operations."
samples.host.details: The compute and ray tracing renderers produce offscreen textures. {texturePresenterCs} and
  {presentTextureSlang} draw those textures into the current drawable; the shared host then submits the commands
  and presents the frame.
samples.host.title: Host and presentation
samples.indirectDrawing.description: Indirect drawing renders multiple cube instances from a buffer of indexed draw
