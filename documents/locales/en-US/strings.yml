tutorial.input.title: Describe the vertex input layout
tutorial.lifecycle.description: 'The finished application repeats this sequence:'
tutorial.lifecycle.details: 'Closing the window returns from {run}. Each rendered frame has already waited for its
  GPU work to complete, so we can now dispose the resources it used. The cleanup after {windowRun} should be:'
tutorial.lifecycle.guidance: Release the swap chain before its native window and the context after all of its resources.
  The queue owns and recycles submitted command buffers, and the swap chain owns its drawable; neither needs a separate
  {dispose} call in this application.
tutorial.lifecycle.title: Follow the lifetime of one frame
tutorial.pipeline.behavior: 'After the input layout, add:'
tutorial.pipeline.context: '{cullNone} fills the triangle without discarding either face orientation. The order
  of its vertices determines the face winding, so disabling culling prevents that order from hiding our first triangle.'
tutorial.pipeline.description: We now have vertex data, an input layout and two shaders. The {graphicsPipeline}
  connects them and specifies how the GPU assembles vertices into primitives and writes the result to an attachment.
tutorial.pipeline.details: 'A pipeline combines programmable shader stages with fixed-function settings, which control
  GPU operations such as triangle assembly, face culling and blending. For this triangle, choose these settings:'
tutorial.pipeline.guidance: The color format comes from {swapChainDescFormat}. It must match the image used by the
  render pass. {count1} means one sample per pixel.
tutorial.pipeline.item: '{triangleList} assembles each consecutive group of three vertices into one triangle. We
  will supply three vertices and draw once, so no index buffer is needed.'
tutorial.pipeline.notes: '{depthNone} disables depth testing and writing, matching the pass without a depth attachment.'
tutorial.pipeline.reference: '{opaque} disables blending, so the fragment shader''s color replaces the background
  inside the triangle.'
tutorial.pipeline.title: Connect the shaders and vertex layout
tutorial.pipeline.usage: The shader objects can be disposed after creating the pipeline, as they are in the sample
  renderer. Keep the pipeline itself alive for every frame that draws with it. Add {pipelineDispose} before {vertexBufferDispose}
  in the cleanup. Pipeline creation is the final initialization step before the render callback.
tutorial.pipeline.validation: The pipeline description declares the attachment configuration; it does not create
  another image. {inputLayouts} has one entry because position and color are stored together in one buffer.
tutorial.presentation.title: Connect the GPU to the window
tutorial.project.context: Enable {emphasis} ({allowUnsafeBlocks}) in the project's build settings. We will use it
  to pass vertex data to the GPU and for the window helper's native calls.
tutorial.project.context.emphasis: Allow unsafe code
tutorial.project.description: 'Create the project and enter its directory:'
tutorial.project.details: 'Install the packages:'
tutorial.project.guidance: '{zenithNET} supplies the shared rendering API. The three backend packages let the same
  program select the implementation for its platform. {zenithNETCompiler} compiles Slang shaders, the small GPU
  programs we will write later, for that implementation. Silk.NET supplies the window and event loop.'
tutorial.project.title: Create a console project
tutorial.requirements.context: You can follow this page from an empty project. The {link} and its {detail} are available
  as a reference for the rendering and windowing APIs used here.
tutorial.requirements.context.detail: shared host
tutorial.requirements.context.link: Hello Triangle sample
tutorial.requirements.description: 'You need the {emphasis}, a code editor or IDE, and a desktop with a GPU and
  driver supported by a Zenith.NET backend. Basic familiarity with C# is enough; the graphics concepts are introduced
  as they are used. This is an ordinary {net10} console project. A backend translates Zenith.NET operations into
  calls to a graphics API, such as DirectX 12, Metal or Vulkan. The application chooses one at startup:'
tutorial.requirements.description.emphasis: .NET 10 SDK
tutorial.requirements.details: Linux needs an X11-compatible window session for the windowing path used here. Optional
  ray tracing and mesh shading features are not needed for this triangle.
tutorial.requirements.guidance: Zenith.NET renders into a surface supplied by the application. Silk.NET.Windowing
  will create the desktop window and process its events. On macOS, the presentation target is a Metal layer ({cAMetalLayerCs});
  the tutorial's window helper attaches that layer for us.
tutorial.requirements.table.headings.graphicsBackend: Graphics backend
tutorial.requirements.table.headings.platform: Platform
tutorial.requirements.table.headings.windowSurface: Window surface
tutorial.requirements.table.linux.graphicsBackend: Vulkan 1.4
tutorial.requirements.table.linux.platform: Linux
tutorial.requirements.table.linux.windowSurface: X11 window and display; XWayland is also suitable
tutorial.requirements.table.macOS.graphicsBackend: Metal 4
tutorial.requirements.table.macOS.platform: macOS
tutorial.requirements.table.macOS.windowSurface: Metal layer attached to the window
tutorial.requirements.table.windows.graphicsBackend: DirectX 12
tutorial.requirements.table.windows.platform: Windows
tutorial.requirements.table.windows.windowSurface: Win32 window handle
tutorial.requirements.title: Before you begin
tutorial.resize.context: 'Run {dotnetRun} again. The window should now have a uniform dark background that continues
  to fill it after resizing. Keep this callback: the triangle will be drawn inside its existing render pass.'
tutorial.resize.description: 'The swap chain''s images must follow the framebuffer dimensions. Use {framebufferResize}
  to respond to changes in pixel size, including changes caused by display scaling. After the render callback, still
  before {windowRun}, add:'
tutorial.resize.details: Silk.NET distinguishes window-size changes from {link}. We need the latter because the
  swap chain stores pixels. A minimized window can have a zero-size framebuffer. Both callbacks skip their GPU work
  in that case. After a resize, the render pass will use the new attachment dimensions for its viewport and scissor.
tutorial.resize.details.link: framebuffer-size changes
tutorial.resize.guidance: We wait after every submission, so no earlier frame is still using the images when the
  resize handler replaces them. The current {present} implementation also waits on the graphics queue. This simple
  loop keeps one frame's work complete before the next begins; {link} covers more advanced scheduling.
tutorial.resize.guidance.link: Synchronization
tutorial.resize.title: Respond to resizing
tutorial.shaders.compilation.context: Compilation happens once during initialization. {appContextBaseDirectory}
  locates the copied shader beside the executable, independently of the current working directory. These shaders
  only consume vertex input, so there are no constant buffers, textures or resource handles to bind yet.
tutorial.shaders.compilation.description: In the file properties for {triangleSlang}, set {emphasis} to {detail}.
  This makes the shader available beside the executable.
tutorial.shaders.compilation.description.detail: Copy if newer
tutorial.shaders.compilation.description.emphasis: Copy to Output Directory
tutorial.shaders.compilation.details: 'Return to {programCs}. After the vertex upload, add these initialization
  statements before the render callback:'
tutorial.shaders.compilation.guidance: '{zenithCompiler} returns a shader description containing code for the requested
  graphics API. {createShader} creates the corresponding backend object. Both the graphics API and entry-point names
  matter: use {contextGraphicsApi}, and spell {vSMain} and {fSMain} exactly as in the Slang file.'
tutorial.shaders.compilation.title: Compile for the selected backend
tutorial.shaders.context: '{fSInput} connects the vertex shader''s output to the fragment shader''s input. When
  written by the vertex shader, {sVPOSITION} supplies a clip-space position: the four coordinates the GPU uses to
  determine what lies inside the visible image. {cOLOR0} carries the color to interpolate between vertices. The
  two stages must agree on its type and semantic.'
tutorial.shaders.description: A shader is a program executed by the GPU. This draw needs a vertex shader to position
  vertices and a fragment shader to produce the colors inside the triangle. We will write them in Slang, a shader
  language, and compile two entry points from the same file. An entry point is the function where a shader stage
  begins executing.
tutorial.shaders.details: 'Create {triangleSlang}, starting with these two structures:'
tutorial.shaders.fragment.description: 'Append the fragment entry point to the same file:'
tutorial.shaders.fragment.details: Rasterization determines which image locations the triangle covers. It produces
  fragments, the data processed by the fragment shader, with vertex colors interpolated across the covered area.
  {fSMain} returns this interpolated color through {sVTARGET}, which identifies the first color attachment.
tutorial.shaders.fragment.guidance: Vertex-color interpolation is separate from attachment blending. Blending combines
  a fragment's output with the color already stored in the attachment. Our opaque blend state disables that combination,
  so the interpolated color replaces the background inside the triangle.
tutorial.shaders.fragment.title: Color the fragments
tutorial.shaders.guidance: '{vSInput} describes what the vertex shader receives from the vertex buffer. The semantics
  {pOSITION0} and {cOLOR0} identify the inputs; C# field names alone do not establish that mapping.'
tutorial.shaders.title: Write the two shader stages
tutorial.shaders.vertex.description: 'Append the vertex entry point to {triangleSlang}:'
tutorial.shaders.vertex.details: The GPU invokes this entry point for each input vertex. It adds the homogeneous
  coordinate {w} to the position and forwards the color. After the vertex stage, position is divided by w; here
  that division leaves x, y and z unchanged. This is why the positions chosen above can be understood directly in
  normalized device coordinates.
tutorial.shaders.vertex.title: Position each vertex
tutorial.surface.description: 'The context also needs to know where to display its output. Add the following {emphasis}:'
tutorial.surface.description.emphasis: after {windowCenter} and before {windowRun}
tutorial.surface.details: '{surface} describes a native presentation target and its pixel dimensions. The framebuffer
  is the pixel image associated with the window. {framebufferSize} gives its dimensions in pixels; the window''s
  logical dimensions can differ when display scaling is enabled.'
tutorial.surface.guidance: The surface matches the backend selected above. Windows supplies a window handle, Linux
  supplies an X11 display and window, and the macOS helper supplies the attached Metal layer. This is the only platform-specific
  part of connecting our window to rendering.
tutorial.surface.title: Describe the native surface
tutorial.swapChain.context: 'The swap chain uses both the context and the native window. Replace the {windowDispose}
  line at the bottom of {programCs} with this cleanup order:'
tutorial.swapChain.description: 'Use the surface description to create the images that will be presented. Immediately
  after the surface block, add:'
tutorial.swapChain.details: The {swapChain} manages the images displayed in the window. Each frame, {drawable} gives
  us the current image as a {texture}, the API type for image data. After drawing, {present} requests display of
  the result and advances to the next drawable.
tutorial.swapChain.guidance: '{b8G8R8A8UNorm} stores four 8-bit color channels in blue, green, red and alpha order.
  {uNorm} means integer values from 0 to 255 represent values from 0 to 1. The shader will still return a logical
  RGBA value; this format determines how those channels are stored in the image. Later, the graphics pipeline will
  use {swapChainDescFormat} to match this attachment.'
tutorial.swapChain.title: Create the swap chain
tutorial.title: First Triangle
tutorial.troubleshooting.description: 'Read any error in the console first, then use the earlier checkpoints to
  identify the stage that failed:'
tutorial.troubleshooting.details: For comparison, the {link} and {detail} use the same vertex data, input layout
  and draw. The sample factors windowing and submission into its shared host; on this page, you have assembled those
  parts in {programCs} as well. Continue with {context} for indexed geometry, transformations and depth testing.
tutorial.troubleshooting.details.context: Spinning Cube
tutorial.troubleshooting.details.detail: Slang shader
tutorial.troubleshooting.details.link: sample renderer
tutorial.troubleshooting.table.backend.check: Check that the selected backend is supported by the device and installed
  graphics driver.
tutorial.troubleshooting.table.backend.symptom: Backend creation fails
tutorial.troubleshooting.table.drawing.check: Check the upload size, input layout, pipeline selection and the placement
  of the draw commands inside the render pass.
tutorial.troubleshooting.table.drawing.symptom: The background appears but the triangle does not
tutorial.troubleshooting.table.headings.check: Check
tutorial.troubleshooting.table.headings.symptom: Symptom
tutorial.troubleshooting.table.input.check: Check the 28-byte stride and the position/color offsets of 0 and 12.
tutorial.troubleshooting.table.input.symptom: Vertex positions or colors are corrupted
tutorial.troubleshooting.table.shaders.check: Check the copied {triangleSlang}, entry-point spelling and the compiler's
  reported diagnostic.
tutorial.troubleshooting.table.shaders.symptom: The clear-color step works, but shader loading fails
tutorial.troubleshooting.table.window.check: Confirm the .NET project builds and the window-only step runs in a
  desktop session. On Linux, check that X11 or XWayland is available.
tutorial.troubleshooting.table.window.symptom: No window opens
tutorial.troubleshooting.title: Check the stage that failed
tutorial.window.context: '{usingZenithTutorials} imports the helper''s namespace. The global using supplies its
  interop attributes, and the {buffer} alias distinguishes Zenith.NET''s GPU buffer from {systemBuffer}.'
tutorial.window.description: Add {cocoaHelperCs} to the project. It handles the Metal layer on macOS; the program
  calls it only on that platform.
tutorial.window.details: 'Replace the generated {programCs} with the following code. It uses top-level statements,
  which execute in order without an explicit {main} method. Later sections will tell you where to add code to this
  same file:'
tutorial.window.guidance: '{graphicsAPINone} asks Silk.NET to create a window without its own graphics context.
  We will create that context with Zenith.NET. {initialize} creates the native window and makes its handles available.
  A handle is an identifier supplied by the windowing system. {center} centers the window, and {run} processes events
  until it closes. Execution then continues to {dispose}, which releases the window.'
tutorial.window.notes: Run {dotnetRun}. An empty window should open and respond to moving, resizing and closing.
  Its contents are not defined yet because we have not submitted any rendering commands. Close it before continuing.
tutorial.window.title: Open a window
