tutorial.context.description: The window is ready, but it has no connection to a GPU yet. A {graphicsContext} provides
  that connection and the queues that accept recorded commands for execution on the GPU.
tutorial.context.details: 'Insert this block {emphasis}:'
tutorial.context.details.emphasis: after the using directives, before {iWindowWindow}
tutorial.context.guidance: For the three desktop platforms covered here, this chooses DirectX 12 on Windows, Metal
  on macOS and Vulkan on Linux. The operations after initialization use the same Zenith.NET API. We request validation
  during development and print diagnostics reported through {validationMessage}. The available diagnostics depend
  on the backend and installed validation components.
tutorial.context.title: Create the graphics context
tutorial.description: In this tutorial, you will build a .NET console application that opens a window and draws
  a triangle with a smooth color gradient between its corners. You will create the resources it needs, describe
  how the GPU reads them, and record the commands that turn three vertices into a displayed image.
tutorial.details: The application has two parts. Initialization creates the window and the resources needed to draw.
  The frame loop records drawing commands and presents the result repeatedly. Resources that stay the same between
  frames are created once, before that loop.
tutorial.draw.context: 'The arguments to {draw} are:'
tutorial.draw.description: 'In the {windowRender} callback, replace {addTheTriangleDrawCommandsHereLater} with these
  three commands, between {beginRenderPass} and {endRenderPass}:'
tutorial.draw.details: '{setPipeline} selects the shaders and state we just created. Set it before binding vertex
  data: the backend uses the pipeline''s input layout to interpret the binding.'
tutorial.draw.guidance: '{setVertexBufferVertexBuffer} binds the buffer starting at byte offset 0 to input slot
  0. That slot corresponds to the single entry in {inputLayouts}. It does not copy or upload the data again.'
tutorial.draw.notes: The commands are still only recorded at this point. The {submitWait} and {present} calls already
  at the end of the render callback execute the work and display its result. Clearing remains necessary because
  the triangle covers only part of the image; the background must also receive a defined color each frame.
tutorial.draw.table.firstInstance.meaning: Start instance numbering at zero.
tutorial.draw.table.firstVertex.meaning: Start with the first vertex in the buffer.
tutorial.draw.table.headings.argument: Argument
tutorial.draw.table.headings.description: Value
tutorial.draw.table.headings.meaning: Meaning
tutorial.draw.table.instanceCount.meaning: Draw one copy of the triangle.
tutorial.draw.table.vertexCount.meaning: Read three vertices.
tutorial.draw.title: Draw the triangle inside the pass
tutorial.execution.description: 'Build and run from the {firstTriangle} directory:'
tutorial.execution.details: The window should display a triangle with a red upper corner, green lower-right corner
  and blue lower-left corner against a dark background. The interior should show a smooth gradient between those
  colors.
tutorial.execution.guidance: Resize the window. The resize callback updates the framebuffer dimensions and resizes
  the swap chain. The render pass establishes a viewport matching that image. Because the vertex positions remain
  in normalized coordinates, the triangle keeps the same fraction of the window's width and height; changing the
  aspect ratio can stretch its shape. Preserving an object's aspect ratio requires a projection or viewport policy,
  which is beyond this first draw.
tutorial.execution.title: Run, resize and close
tutorial.frame.commands.context: After {endRenderPass}, the second transition prepares the image for presentation.
  {submit} finishes recording and submits the command buffer; {wait} waits for the GPU to complete that submission.
  {present} then requests display of the rendered image.
tutorial.frame.commands.description: A render pass groups drawing operations that use the same attachments. Here,
  the color attachment is the swap chain's drawable, the image that receives our drawing. {colorAttachmentClear}
  creates a description telling the pass to clear to the given RGBA color and keep the result when the pass ends.
  {beginRenderPass} records those instructions; the GPU performs the clear after the commands are submitted.
tutorial.frame.commands.details: The brackets contain our single color attachment. The {null} argument means that
  there is no depth/stencil attachment, which would store depth values and stencil masks for depth and stencil tests.
tutorial.frame.commands.guidance: '{beginRenderPass} sets a viewport and scissor covering the attachment. The viewport
  maps the rendered coordinates to pixels, and the scissor limits which pixels can be written. These defaults cover
  the whole drawable, which is what this triangle needs.'
tutorial.frame.commands.title: Clear, submit and present
tutorial.frame.description: Start by filling the image with one background color, an operation called a clear. Seeing
  that color confirms that the context, surface, command submission and swap chain work together before we add geometry.
tutorial.frame.details: 'A render callback is code that Silk.NET calls when it is time to draw a frame. This callback
  does not need the event''s elapsed-time argument, so it is named {value}. Register it {emphasis}:'
tutorial.frame.details.emphasis: before {windowRun}
tutorial.frame.target.description: '{graphicsQueueCommandBuffer} obtains a command buffer with recording already
  begun. Recording describes work for the GPU; it does not execute that work immediately.'
tutorial.frame.target.details: The first {transition} prepares the drawable for color-attachment access. {default}
  selects mip level 0 and array layer 0. We use {undefined} as the previous layout because we will clear the entire
  image and discard its previous contents. A pass that needs to preserve existing content must use its actual previous
  layout instead.
tutorial.frame.target.guidance: Use the swap chain's current drawable each frame. Presentation can change which
  image is available, so a texture saved from an earlier frame is not a permanent window render target.
tutorial.frame.target.title: Prepare the drawable
tutorial.frame.title: Display a background color
tutorial.geometry.data.description: Add this array {emphasis}. The following resource-creation steps also belong
  before that callback, in the order shown.
tutorial.geometry.data.description.emphasis: before {windowRender}
tutorial.geometry.data.details: Each array entry creates a {vertex}; the two inner {new} expressions create its
  {vector3} position and {vector4} color. These are the top, lower-right and lower-left corners. The vertex shader
  will give each position a fourth coordinate, {w}, so x and y directly correspond to normalized device coordinates.
  -1 and +1 are the image edges, and 0 is the center. The coordinates do not depend on the number of pixels in the
  window.
tutorial.geometry.data.guidance: Each color contains red, green, blue and alpha components. Alpha is 1 at all three
  corners. All three positions have z = 0, placing them in the same plane. These positions need no camera or transformation
  matrix because they already describe the coordinates we want to render. For this single flat triangle, we will
  also disable blending and depth testing and omit a depth buffer.
tutorial.geometry.data.title: Choose the corners
tutorial.geometry.description: A vertex is a point together with the data used to draw it. Our triangle has three
  vertices, one for each corner. Each contains a position and a color. The GPU will interpolate the colors, calculating
  intermediate values across the triangle.
tutorial.geometry.format.description: 'Append this declaration {emphasis}:'
tutorial.geometry.format.description.emphasis: at the end of {programCs}, after the cleanup statements
tutorial.geometry.format.details: '{file} limits this type to {programCs}, and the constructor initializes its position
  and color fields. {layoutKindSequential} keeps the fields in declaration order. {position} contains three 32-bit
  floats and {color} contains four. In this struct, position begins at byte 0, color begins at byte 12, and the
  complete vertex occupies 28 bytes. We will describe that same layout to the graphics pipeline.'
tutorial.geometry.format.title: Define a vertex
tutorial.geometry.title: Give the GPU three vertices
tutorial.geometry.upload.context: '{fixed} prevents the garbage collector from moving the array while its address
  is used. For this CPU-writable buffer, {upload} maps, copies and unmaps the memory before returning, so the array
  does not need to stay pinned afterward. The buffer must remain alive throughout rendering, and the upload only
  needs to happen once because the vertices do not change.'
tutorial.geometry.upload.description: 'The managed array is CPU data. A {buffer} gives the GPU storage from which
  it can read the vertices. After the array, add:'
tutorial.geometry.upload.details: 'The total size is {sizeofVertexVerticesLength}: 28 bytes per vertex, three vertices,
  84 bytes in all. {bufferUsagesVertex} permits vertex-input access. {cpuWriteOnly} lets the CPU initialize this
  small buffer directly. The descriptor''s stride records the element size; the input layout we create below will
  tell vertex fetching how to read the individual attributes.'
tutorial.geometry.upload.guidance: Creating a buffer does not populate it. {upload} copies the array into that allocation
  starting at destination byte offset 0. Its source description supplies a pointer and the number of bytes to copy.
tutorial.geometry.upload.notes: Add {vertexBufferDispose} immediately before {swapChainDispose} in the cleanup at
  the bottom of {programCs}. For larger static geometry, {link} explains when to choose GPU-only memory and transfer
  uploads instead.
tutorial.geometry.upload.notes.link: Resource Management
tutorial.geometry.upload.title: Allocate a buffer and upload the array
tutorial.input.description: 'The GPU now has the bytes and shader code, but it still needs to know how to interpret
  each vertex. An attribute is one value carried by a vertex, such as its position or color. The layout identifies
  each attribute''s format and byte offset, and the stride is the distance in bytes from one vertex to the next.
  Add the following initialization block after shader creation:'
tutorial.input.details: '{inputLayoutAdd} appends an element at the current stride and increases that stride by
  the element''s size. It does not inspect the C# struct. Here it produces the following agreement between CPU memory
  and shader inputs:'
tutorial.input.guidance: Changing the C# field order or padding without updating this description would make the
  GPU read the wrong bytes. The default {semanticIndex} is zero, matching {pOSITION0} and {cOLOR0}. Both elements
  belong to the same buffer, so the pipeline will contain one input layout and we will bind that buffer to slot
  0.
tutorial.input.table.headings.byteOffset: Byte offset
tutorial.input.table.headings.cField: C# field
tutorial.input.table.headings.format: Format
tutorial.input.table.headings.shaderInput: Shader input
tutorial.input.table.nextVertex.cField: Next vertex
tutorial.input.table.nextVertex.format: 'Total stride: 28 bytes'
