### YamlMime:Resources
concepts.execution.context.description:
  A {graphicsContext} connects the application to a GPU device through the selected graphics API and provides
  graphics, compute, transfer, and present queues. Resources used together must belong to the same context; buffers,
  textures, shaders, pipelines, and their handles cannot be bound across contexts.
concepts.execution.context.details:
  '{capabilities} reports the device name and supported features. Use {rayTracingSupported}
  and {meshShadingSupported} to check support before creating the resources for those workloads. The {link} and
  {detail} samples show these checks during initialization.'
concepts.execution.context.details.detail: mesh shading
concepts.execution.context.details.link: ray tracing
concepts.execution.context.title: Graphics context
concepts.execution.description: 'GPU work begins on the CPU: the application creates resources, records commands
  that use them, and submits those commands to a queue. Submission allows the CPU to continue while the GPU executes
  the work. The resources must remain available until that execution finishes.'
concepts.execution.ownership.description: Ownership determines who releases an object; GPU completion determines
  when it can be released. Calling {dispose} releases native resources even if C# references to the object remain.
  Submitting commands does not transfer ownership of their resources to the queue.
concepts.execution.ownership.details: At shutdown, stop submitting work and wait for the final resource use on every
  participating queue. Dispose the application's resources first, then dispose the context, which releases its queues.
concepts.execution.ownership.guidance: During rendering, track the completion of work that uses data you intend
  to overwrite or resources you intend to replace. Wait for those uses to finish before modifying or releasing the
  affected storage. {link} describes how views and their backing resources fit into this lifetime model.
concepts.execution.ownership.guidance.link: Resource Management
concepts.execution.ownership.table.applicationResources.disposalResponsibility: The application disposes them after
  their last GPU use.
concepts.execution.ownership.table.applicationResources.object: Resources created by the application
concepts.execution.ownership.table.commandBuffers.disposalResponsibility: The queue manages and recycles them.
concepts.execution.ownership.table.commandBuffers.object: Borrowed command buffers
concepts.execution.ownership.table.headings.disposalResponsibility: Disposal responsibility
concepts.execution.ownership.table.headings.object: Object
concepts.execution.ownership.table.queues.disposalResponsibility: The context and queues manage them.
concepts.execution.ownership.table.queues.object: Context queues and their timelines
concepts.execution.ownership.table.swapChainDrawable.disposalResponsibility: The swap chain manages it.
concepts.execution.ownership.title: Ownership and lifetime
concepts.execution.pipelines.description: A graphics pipeline defines the shaders, vertex input layout, primitive
  assembly, attachment formats, and render state used by draw commands. Select the pipeline before binding vertex,
  index, or constant data. Its attachment formats and sample count must agree with those of the render pass.
concepts.execution.pipelines.details: A compute pipeline selects the shader entry point for a dispatch. Bind the
  pipeline and its constants before dispatching, outside a graphics render pass.
concepts.execution.pipelines.guidance: The {link} illustrates the graphics sequence. The {detail} adds a compute
  dispatch before the graphics pass that displays its output.
concepts.execution.pipelines.guidance.detail: compute sample
concepts.execution.pipelines.guidance.link: triangle's render callback
concepts.execution.pipelines.title: Pipeline state
concepts.execution.queues.description: '{graphicsQueue} is the usual starting point for a frame that combines drawing,
  computation, and copies. Keeping dependent operations on one queue simplifies their ordering.'
concepts.execution.queues.details: Use additional queues to overlap independent workloads. When one queue consumes
  data produced by another, connect their submissions with an explicit dependency.
concepts.execution.queues.guidance:
  Within a queue, dependent operations can also require barriers or texture transitions
  so that later accesses observe earlier writes. These memory dependencies are distinct from submission order; {link}
  explains how to express them.
concepts.execution.queues.guidance.link: Synchronization
concepts.execution.queues.table.computeQueue.supportedWork: Compute dispatches and compatible transfer work, without
  graphics render passes.
concepts.execution.queues.table.graphicsQueue.supportedWork: Render passes and drawing, plus compute and transfer
  operations used by the frame.
concepts.execution.queues.table.headings.queue: Queue
concepts.execution.queues.table.headings.supportedWork: Supported work
concepts.execution.queues.table.presentQueue.supportedWork: The same operations as the graphics queue, used to write
  and present drawables when {swapChainDescIsPresentQueueEnabled} is {true}.
concepts.execution.queues.table.transferQueue.supportedWork: Upload, download and copy work, without drawing or compute
  dispatches.
concepts.execution.queues.title: Queue selection
concepts.execution.recording.context:
  'The queue reclaims completed command buffers for reuse. Obtain one with {queueCommandBuffer}
  for each recording, record from one thread at a time, and submit it once. After submission, leave the buffer to
  the queue: do not modify, resubmit, or dispose it.'
concepts.execution.recording.description: '{queueCommandBuffer} returns a {commandBuffer} with recording already
  in progress. After recording the operations and their dependencies, call {submit} once. Submission ends recording
  and returns a {timelineValue} that identifies the completion point on that queue.'
concepts.execution.recording.details: 'After recording a frame in {commandBuffer}, the triangle tutorial submits
  it and waits for completion:'
concepts.execution.recording.guidance: '{submit} schedules the recorded commands for execution, and {wait} blocks
  the calling thread until that submission finishes so each frame completes before the next begins.'
concepts.execution.recording.title: Recording and submission
concepts.execution.title: Execution Model
concepts.platforms.description: Presentation can be managed directly by the application or by a UI rendering control.
  That choice determines who acquires each frame's drawable (output texture), submits commands, and presents the
  result.
concepts.platforms.frame.context: End any render pass before the handler returns, and do not submit or dispose
  the supplied command buffer or drawable. If the handler transitions the drawable to another layout, restore
  {colorAttachment} before returning.
concepts.platforms.frame.description: The controls implement {iZenithView}. The application assigns {graphicsContext},
  updates scene data in {updateRequested}, and records commands in {renderRequested} using the supplied {renderEventArgs}.
concepts.platforms.frame.details: On each frame, the control acquires a command buffer and a drawable, transitions
  the drawable to {colorAttachment}, and invokes the update and render handlers before submitting and presenting
  the frame.
concepts.platforms.frame.guidance: 'Add {usingZenithNET} to the file. For an initialized {iZenithView} named {view}
  with a graphics context assigned, register this handler to clear its drawable:'
concepts.platforms.frame.notes: The initial transition uses {undefined}, which allows the previous image contents
  to be discarded. Draw or clear the full image on each frame. Keep accumulated or cached rendering in an application-owned
  texture, then draw that texture into the control's drawable.
concepts.platforms.frame.reference: Use {descFormat}, {descWidth}, {descHeight}, and {descSampleCount} from the
  drawable supplied by the render event when creating matching attachments. The event texture gives the render target's
  actual dimensions; they should not be inferred from the control's layout size or display scale.
concepts.platforms.frame.title: Rendering through a UI control
concepts.platforms.lifecycle.description: "The swap chain uses the framebuffer's width and height in pixels, which
  can differ from the window's logical dimensions under display scaling. Defer rendering and swap-chain resizing
  while either dimension is zero. Obtain {swapChainDrawable} for each frame: the swap chain owns this texture and
  may replace it after presentation or resizing."
concepts.platforms.lifecycle.details: When the framebuffer size changes, wait for in-flight GPU work using the old
  images to finish before calling {swapChainResize}. If the native presentation target itself is replaced, wait for
  those uses to finish and pass the new surface description to {swapChainRefresh}. At shutdown, dispose the swap
  chain before destroying its native presentation target.
concepts.platforms.lifecycle.guidance: If application-owned depth or offscreen textures follow the window size,
  recreate them when that size changes and update constants that contain their handles. The pipeline can be reused
  as long as the attachment formats and sample counts still match. The {link} demonstrates this separation between
  resized textures and a reusable pipeline.
concepts.platforms.lifecycle.guidance.link: spinning cube renderer
concepts.platforms.lifecycle.title: Swap-chain dimensions and lifetime
concepts.platforms.ownership.description: The application owns the assigned context and its rendering resources,
  while the control owns its presentation resources. When {graphicsContext} changes, the control recreates its
  presentation resources; recreate the application's buffers, textures, and pipelines for the new context as well.
concepts.platforms.ownership.details: Before replacing rendering resources, stop the view's frame loop
  and wait for the GPU work that uses them. Then release the old resources. Release the context only after
  every view has released its presentation resources for that context and all application resources created
  from it have been released.
concepts.platforms.ownership.guidance:
  The control runs frame handlers through its UI dispatcher. Keep those handlers focused on updating scene data
  and recording commands; lengthy CPU work there also delays the interface.
concepts.platforms.ownership.title: Application and control ownership
concepts.platforms.presentQueue.context: '{swapChainPresent} waits only on {swapChainQueue}. Track rendering
  submissions separately before reusing or disposing their resources, and stop presenting before calling
  {swapChainResize} or disposing the swap chain.'
concepts.platforms.presentQueue.description: By default, a swap chain presents on {graphicsQueue}. Setting
  {swapChainDescIsPresentQueueEnabled} to {true} assigns it to {presentQueue} instead, decoupling presentation from
  later work on {graphicsQueue} so a dedicated thread can pace rendered and generated frames independently.
concepts.platforms.presentQueue.details: '{swapChainQueue} returns the swap chain''s presentation queue. Record all
  writes to {swapChainDrawable} on that queue, submit them with a dependency on the rendering submission, wait for
  completion, and present:'
concepts.platforms.presentQueue.guidance: Here, {rendered} is the completion value of the submission that produced
  {frame} in {copySrc} layout, and {extent} matches the drawable's size. Waiting on the copy submission covers both
  the rendering dependency and the copy itself without blocking on later graphics-queue work.
concepts.platforms.presentQueue.title: Using the present queue
concepts.platforms.surface.description: The {link} uses Silk.NET to create the window and process its events. Zenith.NET
  receives the native window handles and dimensions through a {surface} description, which it uses to create a {swapChain}.
  The application remains responsible for the operating-system window.
concepts.platforms.surface.description.link: triangle tutorial
concepts.platforms.surface.details: 'Surface handles depend on the graphics API and window system. Common combinations are:'
concepts.platforms.surface.guidance: The sample host in {appCs} supports Windows, macOS, and X11. Its Linux window
  supplies Xlib handles, so a Wayland session needs XWayland to run it. A native Wayland application supplies its
  display and surface handles through {surfaceWayland}.
concepts.platforms.surface.table.android.graphicsApiAndPlatform: Vulkan on Android.
concepts.platforms.surface.table.apple.graphicsApiAndPlatform: Metal on Apple platforms.
concepts.platforms.surface.table.headings.factory: Surface factory
concepts.platforms.surface.table.headings.graphicsApiAndPlatform: Graphics API and platform
concepts.platforms.surface.table.headings.handles: Handles supplied by the host
concepts.platforms.surface.table.wayland.graphicsApiAndPlatform: Vulkan with a native Wayland host.
concepts.platforms.surface.table.wayland.handles: Wayland display and surface
concepts.platforms.surface.table.win32.graphicsApiAndPlatform: DirectX 12 or Vulkan on Windows.
concepts.platforms.surface.table.xlib.graphicsApiAndPlatform: Vulkan on Linux with X11 or XWayland.
concepts.platforms.surface.table.xlib.handles: X11 display and window
concepts.platforms.surface.title: Native presentation surfaces
concepts.platforms.title: Platform Integration
concepts.platforms.verticalSync.description: Vertical synchronization aligns presentation with the display's refresh
  cycle to prevent tearing. {swapChainDescIsVerticalSyncEnabled} is {false} by default, allowing {swapChainPresent}
  to present without waiting for the next refresh; set it to {true} to synchronize presentation and pace
  {swapChainPresent} to the refresh rate.
concepts.platforms.verticalSync.details: This setting is fixed when the swap chain is created. To change it, wait
  for outstanding GPU work on the drawables to finish—as before {swapChainResize}—then dispose the swap chain and
  create a new one.
concepts.platforms.verticalSync.title: Vertical synchronization
concepts.resources.allocation.context: Resources placed in a heap depend on its storage for their entire lifetime.
  After their final GPU use, release the resources before releasing the heap.
concepts.resources.allocation.description: Use a {heap} when the application needs to manage allocation itself.
  A heap provides storage in which resources are placed at explicit byte offsets; the application chooses those
  offsets and tracks the occupied regions.
concepts.resources.allocation.details: For each resource, call {contextGetSizeAndAlignment} with the buffer or texture
  description that will be used to create it. Reserve the returned size at an offset that is a multiple of the returned
  alignment, within the heap's bounds and without overlapping another live allocation. Texture sizes may include
  padding, so pixel count and bytes per pixel alone are insufficient to calculate their allocation size.
concepts.resources.allocation.guidance: A buffer placed in a heap must specify the same residency as that heap.
  For texture storage, use a GPU-only heap.
concepts.resources.allocation.title: Heap allocation
concepts.resources.bufferUsages.table.constant.role: Shader parameters read through a constant-buffer binding.
concepts.resources.bufferUsages.table.headings.role: Role
concepts.resources.bufferUsages.table.headings.usage: Usage
concepts.resources.bufferUsages.table.index.role: Indices used by indexed drawing.
concepts.resources.bufferUsages.table.indirect.role: Arguments read by indirect draw or dispatch commands.
concepts.resources.bufferUsages.table.none.role: No buffer usage flags are declared.
concepts.resources.bufferUsages.table.storageReadOnly.role: Buffer data accessed through a read-only shader binding.
concepts.resources.bufferUsages.table.storageReadWrite.role: Buffer data accessed through a read/write shader binding.
concepts.resources.bufferUsages.table.transferDst.role: Destination storage for a GPU copy.
concepts.resources.bufferUsages.table.transferSrc.role: Source data for a GPU copy.
concepts.resources.bufferUsages.table.vertex.role: Vertex attributes fetched for drawing.
concepts.resources.bufferUsages.title: Buffer usages
concepts.resources.description: A resource's description establishes how the application may use its storage. For
  example, a texture used as a render target, sampled by a shader, and copied back to the CPU needs the usage flags
  for all three operations. Memory placement determines CPU access, while synchronization and lifetime management
  determine when the data can be accessed or the storage released.
concepts.resources.memory.context: 'For CPU-accessible buffers, {map} provides the address through which the CPU
  reads or writes data. Mapping and {unmap} do not wait for GPU work: the application must wait for a GPU write
  before reading its result, or for outstanding GPU accesses before modifying the same bytes.'
concepts.resources.memory.description: 'The {residency} field of {bufferDesc} specifies the intended CPU access
  to the allocation:'
concepts.resources.memory.details: The triangle uses {cpuWriteOnly} to initialize its small vertex buffer directly;
  for static resources used primarily by the GPU, upload into GPU-only storage instead.
concepts.resources.memory.guidance: Textures created directly through the context use GPU storage. {textureDesc}
  therefore has no residency field; the application exchanges texture data with CPU memory through uploads and downloads.
concepts.resources.memory.table.cpuReadOnly.cpuAccess: Read-only
concepts.resources.memory.table.cpuReadOnly.typicalRole: Readback data produced by the GPU
concepts.resources.memory.table.cpuWriteOnly.cpuAccess: Write-only
concepts.resources.memory.table.cpuWriteOnly.typicalRole: Data supplied or updated by the CPU
concepts.resources.memory.table.gpuOnly.cpuAccess: None
concepts.resources.memory.table.gpuOnly.typicalRole: Static geometry and GPU working data
concepts.resources.memory.table.headings.cpuAccess: Intended CPU access
concepts.resources.memory.table.headings.residency: Residency
concepts.resources.memory.table.headings.typicalRole: Typical role
concepts.resources.memory.title: CPU access and memory placement
concepts.resources.textureUsages.description: The transfer flags describe a resource's role as the source or destination
  of a GPU copy. Whether the CPU can access the storage directly is a separate memory-placement choice.
concepts.resources.textureUsages.details: Usage flags declare the roles a texture may serve; switching between those
  roles requires the corresponding {link}.
concepts.resources.textureUsages.details.link: layout and synchronization
concepts.resources.textureUsages.table.colorAttachment.role: A color attachment in a render pass.
concepts.resources.textureUsages.table.depthStencilAttachment.role: A depth/stencil attachment in a render pass.
concepts.resources.textureUsages.table.headings.role: Role
concepts.resources.textureUsages.table.headings.usage: Usage
concepts.resources.textureUsages.table.none.role: No texture usage flags are declared.
concepts.resources.textureUsages.table.sampled.role: Texture data read through a sampled-texture binding.
concepts.resources.textureUsages.table.storage.role: Texture data accessed through a storage-texture binding for
  shader reads or writes.
concepts.resources.textureUsages.table.transferDst.role: Destination image storage for a GPU copy.
concepts.resources.textureUsages.table.transferSrc.role: Source image data for a GPU copy.
concepts.resources.textureUsages.title: Texture usages
concepts.resources.title: Resource Management
concepts.resources.transfers.context: Recorded texture transfers do not include layout transitions. Uploads
  require {copyDst}; downloads require {copySrc}. Record transitions to these layouts before the copy and to
  the layout required by the next use afterward.
concepts.resources.transfers.description: 'Uploads copy CPU data into a GPU resource; downloads copy resource data
  into CPU memory. The methods on buffers and textures complete this transfer before returning:'
concepts.resources.transfers.details: Before calling these methods, resolve any conflicting accesses on other queues.
  A wait inside the method covers its own transfer; it does not establish a dependency on another queue. The direct
  mapped-memory paths rely entirely on the caller to wait for conflicting GPU accesses.
concepts.resources.transfers.guidance: 'To submit transfers together with other GPU work, record them with
  {commandBufferUpload} or {commandBufferDownload}. {commandBufferUpload} reads the source memory before returning,
  so the source pointer only needs to remain valid during the call. {commandBufferDownload} writes the destination
  memory when {wait} is called on that submission''s completion value; keep the destination allocated and managed
  memory pinned until {wait} returns.'
concepts.resources.transfers.notes: For texture transfers, row stride is the byte distance between successive
  rows of CPU data; slice stride is the distance between successive depth slices. These values let the transfer
  copy the CPU data into or out of the texture's GPU storage.
concepts.resources.transfers.table.bufferDownload.transfer: Copies directly from mapped memory for {cpuReadOnly}.
  Otherwise, submits the download to the transfer queue and waits for it to finish.
concepts.resources.transfers.table.bufferUpload.transfer: Copies directly into mapped memory for {cpuWriteOnly}.
  Otherwise, submits the upload to the transfer queue and waits for it to finish.
concepts.resources.transfers.table.headings.method: Method
concepts.resources.transfers.table.headings.transfer: Transfer behavior
concepts.resources.transfers.table.textureTransfers.transfer: Submits the copy and its texture transitions to the
  graphics queue, then waits for completion. The selected subresource is left in the requested final layout.
concepts.resources.transfers.title: Immediate and command buffer transfers
concepts.resources.usages.description: '{bufferUsages} and {textureUsages} are flag enums for declaring resource
  roles. Assign them to {bufferDescUsages} and {textureDescUsages}, respectively. When a resource serves several
  roles, combine the required members with {bitwiseOr}.'
concepts.resources.usages.title: Resource usages
concepts.resources.views.description: A {bufferView} selects a byte range and element stride within a buffer; a
  {textureView} selects a compatible texture type, pixel format, and subresource range. Both reference existing storage
  and inherit the usages declared when that storage was created.
concepts.resources.views.details: A resource's own handle provides its default view. Create a separate view to select
  a different region or compatible interpretation. Keep both the view and its backing resource alive until the GPU
  has finished using them; a resource handle does not retain either object. When replacing either one, update any
  constants containing the old {link}.
concepts.resources.views.details.link: resource handle
concepts.resources.views.title: Views and backing resources
concepts.shaders.binding.context:
  'The compute sample assigns {inputTextureSampledHandle} to {input} and {outputTextureStorageHandle}
  to {output}. In Slang, the type parameter of {descriptorHandle} defines how the shader accesses each resource:'
concepts.shaders.binding.description: '{setConstantBuffer} selects an existing buffer and byte offset from which
  the current pipeline reads its constants. Upload the parameter data into that storage before it is used by the
  shader. If the same bytes are still being read by earlier GPU work, wait for that work before updating them.'
concepts.shaders.binding.details: 'With a command buffer, compute pipeline, populated constant buffer, and thread-group
  counts ready, record the dispatch in this order. Select the pipeline first, because the constant-buffer binding
  applies to that pipeline:'
concepts.shaders.binding.guidance: The constant buffer requires {bufferUsagesConstant} usage. If several constant
  records share one buffer, each record's starting offset must meet the required binding alignment. This is separate
  from the layout of fields within each record.
concepts.shaders.binding.notes: '{resourceHandle} is an opaque handle valid only within the context that created
  the resource.'
concepts.shaders.binding.reference: Retain the resource and any view used to obtain its handle until the shader's
  final access completes. Replacing a texture or view requires updating constants that still contain the old handle.
  The ownership rules are described in {link}.
concepts.shaders.binding.reference.link: Resource Management
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: Reads of structured elements of shader type {t}
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: Reads and writes of structured elements of shader
  type {t}
concepts.shaders.binding.table.headings.access: Intended access
concepts.shaders.binding.table.headings.cHandle: C# handle
concepts.shaders.binding.table.headings.slangFieldType: Slang field type
concepts.shaders.binding.table.samplerHandle.access: Texture sampling state
concepts.shaders.binding.table.textureSampledHandle.access: Texture reads
concepts.shaders.binding.table.textureStorageHandle.access: Storage-texture reads and writes
concepts.shaders.binding.title: Constant buffers and resource handles
concepts.shaders.compilation.description: "{zenithCompiler} compiles a Slang entry point and returns a {shaderDesc}.
  The context's {graphicsApi} selects the output format: {dxil} for DirectX 12, {metallib} for Metal, or {spirv}
  for Vulkan."
concepts.shaders.compilation.details: 'With a graphics context named {context} already created, compile the triangle
  shader from the copy placed beside the executable:'
concepts.shaders.compilation.guidance: The entry-point name {vSMain} must match the declaration in the shader file.
  Compile shaders and create pipelines during initialization, then reuse the pipelines while rendering. Once pipeline
  creation has completed, the shader objects may be released, as shown in {link}.
concepts.shaders.compilation.guidance.link: First Triangle
concepts.shaders.compilation.title: Shader compilation
concepts.shaders.description: The C# and Slang declarations must agree on where each value is stored and how the
  shader accesses it. Vertex input layouts describe vertex attributes; shader buffer declarations describe parameters
  and arrays; resource handles identify the resources used by a shader.
concepts.shaders.dispatch.description: "{dispatch} specifies how many thread groups to execute. The compute sample
  declares {numthreads}, so each group contains 16 × 16 threads. To cover an image, divide its width and height
  by 16 and round each result up: a 17 × 19 image requires 2 × 2 groups. The shader checks each thread's coordinates
  and skips those outside the image."
concepts.shaders.dispatch.details: The declared group size is available in {shaderDescThreadGroupSize} and can be
  used to calculate the group counts passed to {dispatch}. {computeShaderRendererCs} shows the complete calculation.
  After the dispatch, access to the resulting image must follow the requirements described in {link}.
concepts.shaders.dispatch.details.link: Synchronization
concepts.shaders.dispatch.title: Thread groups
concepts.shaders.layout.context: 'The {link} illustrate this arrangement with image dimensions and two texture handles.
  Explicit offsets specify where each field begins. The declaration uses {systemRuntimeInteropServices} and {zenithNET}:'
concepts.shaders.layout.context.link: compute sample's C# constants
concepts.shaders.layout.description: "For vertex input, {inputLayout} defines each attribute's format, semantic,
  and byte offset, along with the vertex stride. In the triangle, a {float3} position precedes a {float4} color,
  placing color at byte offset 12 with a 28-byte stride. {inputLayoutAdd} computes this tightly packed layout from
  the element formats; if a C# struct includes padding, set the offsets and stride explicitly."
concepts.shaders.layout.details: "Constant buffers hold shader parameters, and structured buffers hold arrays of typed elements. Their layouts follow the Slang declarations rather than {inputLayout}. Match the C# field offsets, element sizes, and padding to the compiled shader layout. A C# unmanaged type can be copied as bytes, but its memory layout does not necessarily match the shader's layout; the tightly packed {float3} used for a vertex may require different alignment in a shader buffer."
concepts.shaders.layout.guidance: Shader parameters can include resource handles as well as ordinary values. A handle
  identifies storage that already exists, so copying the handle into a constant buffer does not copy the resource's
  contents.
concepts.shaders.layout.notes: 'The matching declaration in {computeShaderSlang} is:'
concepts.shaders.layout.reference: 'The C# fields occupy the first 24 bytes: eight for the dimensions and eight
  for each handle. The 256-byte record leaves the remaining bytes as padding. For a different parameter block,
  match the field offsets to its shader layout. If multiple records share a buffer, include enough padding
  between them to meet the required binding alignment.'
concepts.shaders.layout.title: Data layout
concepts.shaders.matrices.description: The compiler selects row-major matrix storage, keeping each row contiguous.
  The {link} stores three {matrix4x4} values at offsets 0, 64, and 128. Its {detail} applies {mulVectorMatrix} in
  model, view, and projection order.
concepts.shaders.matrices.description.detail: shader
concepts.shaders.matrices.description.link: spinning cube renderer
concepts.shaders.matrices.details: Storage order specifies how matrix elements are arranged in memory; multiplication
  order specifies the transformation. Use matching conventions in C# and Slang.
concepts.shaders.matrices.title: Matrix conventions
concepts.shaders.title: Shader Data and Binding
concepts.synchronization.barriers.context: Choose stages that include the relevant accesses and are supported by
  the queue. {barrierStagesAll} includes every supported stage; select a narrower set when the dependency only involves
  those stages.
concepts.synchronization.barriers.description: 'Consider two compute dispatches recorded into the same command buffer,
  where the first writes simulation data and the second reads it. Place a barrier between them so that the second
  dispatch sees the completed writes. For a storage buffer, this orders the accesses without a texture layout transition:'
concepts.synchronization.barriers.details: The first argument identifies the stages that produced the data; the
  second identifies the stages that will consume it. Together they describe the execution order and memory visibility
  required between the two dispatches.
concepts.synchronization.barriers.guidance: The {link} uses this pattern between simulation steps.
concepts.synchronization.barriers.guidance.link: FluidTank simulation
concepts.synchronization.barriers.title: Pipeline barriers
concepts.synchronization.dependencies.description: For each resource, identify the accesses that touch the same
  data. If either access writes, preserve the required order between them. Two reads do not conflict, although texture
  layout and presentation requirements still apply. CPU updates and resource disposal also need to wait until the
  GPU has finished using the affected storage.
concepts.synchronization.dependencies.details: 'The appropriate mechanism depends on where the operations execute:'
concepts.synchronization.dependencies.guidance: When one queue writes a texture that another uses, submit the consumer
  with a dependency and record any required layout transition. Neither blocks the CPU. Wait for completion before
  the CPU accesses the data or releases the resource.
concepts.synchronization.dependencies.table.cpuAccess.mechanism: Call {wait} on the relevant completion value.
concepts.synchronization.dependencies.table.cpuAccess.situation: CPU access or resource release depends on GPU completion
concepts.synchronization.dependencies.table.crossQueue.mechanism: Pass the producer's {timelineValue} to the consumer's
  {submit}.
concepts.synchronization.dependencies.table.crossQueue.situation: One queue consumes data produced on another queue
concepts.synchronization.dependencies.table.headings.mechanism: Mechanism
concepts.synchronization.dependencies.table.headings.situation: Situation
concepts.synchronization.dependencies.table.layoutChange.mechanism: '{commandBufferTransition} with its previous
  and next layouts.'
concepts.synchronization.dependencies.table.layoutChange.situation: A texture subresource changes how it is used
concepts.synchronization.dependencies.table.pipelineStages.mechanism: '{commandBufferBarrier} with the producing
  and consuming stages.'
concepts.synchronization.dependencies.table.pipelineStages.situation: Dependent GPU stages in a command stream
concepts.synchronization.dependencies.title: Access dependencies
concepts.synchronization.description: Synchronization establishes the order in which operations access shared data
  and ensures that later operations see the results they need. In a write-to-read dependency, the writer is the
  producer and the reader is the consumer. Barriers and texture transitions coordinate GPU accesses; timelines connect
  submissions and let the CPU wait for GPU work to finish.
concepts.synchronization.layouts.context: Use {undefined} as the previous layout when the existing contents can
  be discarded, such as for a new image or an attachment that will be cleared completely. To preserve the contents
  for loading, sampling, or accumulation, use the layout from the preceding access.
concepts.synchronization.layouts.description: "A texture's usage flags declare its permitted roles. {textureLayout}
  describes how a particular subresource, identified by a mip level and array layer, is accessed at a given point
  in the command sequence. When that access changes, record a transition. For example, the compute sample writes
  an output texture in {storage} layout, then prepares it for sampling in a graphics pass:"
concepts.synchronization.layouts.details: Here, {outputTexture} was created with {sampledStorage} usage and the
  selected subresource is in {storage} layout. {default} selects mip level 0 and array layer 0. Other mip levels
  and layers are unaffected by this transition.
concepts.synchronization.layouts.guidance: For {transition}, supply the layout from the subresource's previous use.
  The application tracks this state as it records commands and passes textures between rendering stages.
concepts.synchronization.layouts.title: Texture layouts
concepts.synchronization.reuse.description: The triangle waits for each frame to finish before reusing its data.
  To overlap frames, give each in-flight frame its own mutable storage and track when that storage becomes available
  again. Before changing data, wait for GPU work that still accesses the affected bytes; before releasing a resource,
  wait for all of its outstanding uses.
concepts.synchronization.reuse.details: 'Resizing and shutdown follow the same rule: stop new uses, wait for existing
  uses to finish, then replace or release the resources. Establish this order before calling {swapChainResize} or
  disposing resources or the context. The triangle already waits for each frame, so it can resize between callbacks.'
concepts.synchronization.reuse.guidance: '{swapChainPresent} signals and waits on {swapChainQueue} after presenting.
  Because the triangle tutorial presents on the graphics queue, presentation still waits for the frame even without
  an explicit submission wait. Work on other queues—including graphics-queue rendering when the swap chain uses the
  present queue—must be tracked separately.'
concepts.synchronization.reuse.title: Resource reuse
concepts.synchronization.timelines.context: 'If the CPU needs to read the result, overwrite the shared data, or
  release the resources after the consumer finishes, wait for that submission:'
concepts.synchronization.timelines.description: A timeline identifies queue completion with increasing values. {submit}
  returns a {timelineValue} containing the timeline and the submission's value. Numeric {value} fields from different
  timelines cannot be compared directly.
concepts.synchronization.timelines.details: 'Let {producer} and {consumer} be recorded command buffers from two
  queues in the same context, with the consumer using data written by the producer. Submit them with this dependency:'
concepts.synchronization.timelines.guidance: The consuming queue waits for the supplied completion value before
  executing its commands. The CPU can continue without calling {producedWait}. Keep the shared resources alive until
  {consumed} completes, and record the texture transitions required by the consumer's access.
concepts.synchronization.timelines.notes: The value returned by {queueTimelineSignal} can likewise be waited on
  with {wait} or used as a dependency for another queue. {signal} places this completion point after previously
  submitted work; the GPU reaches it once that work has finished.
concepts.synchronization.timelines.title: Timelines and queue dependencies
concepts.synchronization.title: Synchronization
