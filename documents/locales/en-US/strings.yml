tutorial.context.description: A {graphicsContext} connects the application to the GPU through a backend and provides
  the methods used to create rendering resources.
tutorial.context.details: 'Insert the context initialization {emphasis}:'
tutorial.context.details.emphasis: after the using directives, before {iWindowWindow}
tutorial.context.guidance: Each branch selects a backend for the current platform and requests validation. Messages
  from {validationMessage} are printed in the console.
tutorial.context.imports: 'Add the following using directives at the top of {programCs}:'
tutorial.context.title: Graphics context
tutorial.description: In this tutorial, you will build a .NET console application that opens a window and draws
  a colored triangle, starting from an empty project.
tutorial.details: 'The tutorial has three checkpoints: an empty window, a solid background color, and the colored
  triangle. Run the application at each checkpoint before adding the next part.'
tutorial.draw.context: 'The arguments to {draw} are:'
tutorial.draw.description: 'In the {windowRender} callback, replace {addTheTriangleDrawCommandsHereLater} with the
  following commands, between {beginRenderPass} and {endRenderPass}:'
tutorial.draw.details: "{setPipeline} selects the shaders and render state. It must precede vertex binding because
  the backend interprets that binding using the pipeline's input layout."
tutorial.draw.guidance: '{setVertexBufferVertexBuffer} binds the uploaded vertex data at byte offset 0 to input
  slot 0, corresponding to the single entry in {inputLayouts}.'
tutorial.draw.notes: These calls record the draw commands. The existing {submitWait} submits them and waits for
  the GPU to finish; {present} then requests display of the completed image. Keep the clear operation at the start
  of the pass so the area outside the triangle has a defined background color.
tutorial.draw.table.firstInstance.meaning: Start instance numbering at zero.
tutorial.draw.table.firstVertex.meaning: Start with the first vertex in the buffer.
tutorial.draw.table.headings.argument: Argument
tutorial.draw.table.headings.description: Value
tutorial.draw.table.headings.meaning: Meaning
tutorial.draw.table.instanceCount.meaning: Draw one copy of the triangle.
tutorial.draw.table.vertexCount.meaning: Read three vertices.
tutorial.draw.title: Drawing commands
tutorial.execution.description: Build and run the {firstTriangle} project.
tutorial.execution.details: You should see a triangle on a dark background, with red at the top, green at the lower
  right, and blue at the lower left. Interpolation creates smooth transitions between the vertex colors across the
  triangle.
tutorial.execution.guidance: Resizing changes the image's pixel dimensions while the vertex coordinates stay the
  same. The viewport maps those coordinates to the new width and height, so the triangle stretches when the window's
  width-to-height ratio changes.
tutorial.execution.title: Running the application
tutorial.frame.commands.context: After {endRenderPass}, the second transition prepares the drawable for presentation.
  {submit} ends recording and submits the command buffer; {wait} blocks until that submission completes. {present}
  then requests display of the rendered image.
tutorial.frame.commands.description: A render pass groups drawing operations that write to the same attachments.
  In this pass, the swap chain's drawable receives the color output. {colorAttachmentClear} describes how to initialize
  that attachment with an RGBA clear color and preserve its contents when the pass ends. {beginRenderPass} records
  the start of the pass with those settings.
tutorial.frame.commands.details: The collection contains one color attachment. {null} specifies that the pass has
  no depth/stencil attachment.
tutorial.frame.commands.guidance: '{beginRenderPass} sets the viewport and scissor to cover the whole attachment.
  The viewport maps rendering coordinates to pixel positions; the scissor limits where pixels can be written.'
tutorial.frame.commands.title: Clear, submission, and presentation
tutorial.frame.description: Start by filling the window with a single background color. This operation is called
  clearing. Once the background appears, the surface, command submission, and presentation are working together,
  ready for the triangle's geometry and shaders.
tutorial.frame.details: 'Silk.NET invokes the render callback when a frame is due. This example does not use the
  elapsed-time argument, so the parameter is named {value}. Register the callback {emphasis}:'
tutorial.frame.details.emphasis: before {windowRun}
tutorial.frame.target.description: '{graphicsQueueCommandBuffer} returns a command buffer ready for recording. Recording
  defines the GPU workload; execution begins only after submission.'
tutorial.frame.target.details:
  A texture layout describes the kind of access an operation requires. The first {transition}
  prepares the drawable for use as a color attachment. Here, {default} selects mip level 0 and array layer 0, the
  drawable's base image. Specifying {undefined} allows the previous contents to be discarded because this pass clears
  the entire image.
tutorial.frame.target.guidance: Use the current drawable on each frame because presentation can advance to a different
  image.
tutorial.frame.target.title: Drawable preparation
tutorial.frame.title: The first frame
tutorial.geometry.data.description: Add the vertex array {emphasis}. Keep the subsequent resource initialization
  before this callback as well, in the order presented.
tutorial.geometry.data.description.emphasis: before {windowRender}
tutorial.geometry.data.details: 'Each entry constructs a {vertex}; the two inner {new} expressions provide its {vector3}
  position and {vector4} color. The positions form the upper, lower-right, and lower-left corners. The vertex shader
  adds {w} as the fourth position coordinate. With w equal to 1, x and y are also normalized device coordinates:
  -1 and +1 mark the image boundaries, and 0 marks the center. Their interpretation is independent of pixel dimensions.'
tutorial.geometry.data.guidance: Each color has red, green, blue, and alpha components, with alpha set to 1. All
  three vertices have z = 0 and lie in the same plane.
tutorial.geometry.data.title: Vertex positions and colors
tutorial.geometry.description: Each of the triangle's three vertices has a position and a color. The GPU uses the
  positions to determine the triangle's shape and interpolates the colors across its surface.
tutorial.geometry.format.description: 'Append the vertex declaration {emphasis}:'
tutorial.geometry.format.description.emphasis: at the end of {programCs}, after the cleanup statements
tutorial.geometry.format.details: '{file} limits the type to {programCs}, and {layoutKindSequential} keeps its fields
  in declaration order. {position} contains three 32-bit floats and starts at byte offset 0; {color} contains four
  and starts at byte offset 12. Each vertex therefore occupies 28 bytes. The input layout will describe this arrangement
  so the GPU can read the fields correctly.'
tutorial.geometry.format.imports: 'Add these using directives at the top of {programCs} for the vector types and the struct layout attribute:'
tutorial.geometry.format.title: Vertex representation
tutorial.geometry.title: Vertex data
tutorial.geometry.upload.context: '{fixed} prevents the garbage collector from moving the array while its address
  is in use. For this CPU-writable buffer, {upload} maps the memory, copies the bytes, and unmaps it before returning,
  so the array only needs to remain pinned during the call. Upload these vertices once during initialization, and
  keep the buffer alive until rendering has finished.'
tutorial.geometry.upload.description: 'Store the vertices in a {buffer} so the GPU can read them during drawing.
  Add the allocation and upload immediately after the array:'
tutorial.geometry.upload.details: "The allocation size is {sizeofVertexVerticesLength}: three 28-byte vertices,
  or 84 bytes. {bufferUsagesVertex} declares vertex-input access, while {cpuWriteOnly} permits direct initialization
  by the CPU. The descriptor's stride records the element size. The input layout defined below specifies how vertex
  fetching interprets each attribute."
tutorial.geometry.upload.guidance: Allocation does not initialize the buffer's contents. {upload} copies the array
  to destination byte offset 0 using the source pointer and byte count supplied in the data description.
tutorial.geometry.upload.imports: 'In {programCs}, add {bufferAlias} to the using directives to distinguish the Zenith.NET buffer type from {systemBuffer}.'
tutorial.geometry.upload.notes: Add {vertexBufferDispose} immediately before {swapChainDispose} in the cleanup at
  the end of {programCs}. For larger static geometry, {link} discusses GPU-only storage and transfer uploads.
tutorial.geometry.upload.notes.link: Resource Management
tutorial.geometry.upload.title: Buffer allocation and upload
tutorial.input.description: 'The GPU needs to know where each vertex attribute, such as position or color, is stored.
  The input layout supplies its format and byte offset. It also sets the stride: the number of bytes from one vertex
  to the next. Add this code after creating the shaders:'
tutorial.input.details: '{inputLayoutAdd} appends each attribute after the previous one and adds its size to the
  stride. The offsets come from the formats supplied here, rather than from inspection of the C# struct. For these
  two fields, the resulting layout is:'
tutorial.input.guidance: The default {semanticIndex} is zero, matching {pOSITION0} and {cOLOR0} in the shader. Position
  and color are stored together in one vertex buffer, so the pipeline uses one input layout at slot 0. Keep this
  layout consistent with the C# struct if its field order or padding changes.
tutorial.input.table.headings.byteOffset: Byte offset
tutorial.input.table.headings.cField: C# field
tutorial.input.table.headings.format: Format
tutorial.input.table.headings.shaderInput: Shader input
tutorial.input.table.nextVertex.cField: Next vertex
tutorial.input.table.nextVertex.format: 'Total stride: 28 bytes'
tutorial.input.table.nextVertex.shaderInput: Next input record
tutorial.input.table.vertexColor.format: '{float4} (16 bytes)'
tutorial.input.table.vertexPosition.format: '{float3} (12 bytes)'
tutorial.input.title: Vertex input layout
tutorial.lifecycle.description: 'Each frame follows this sequence:'
tutorial.lifecycle.details: 'When the window closes, {run} returns and execution continues to the cleanup code.
  Each frame has already waited for its submitted work to finish, so the resources used by those commands can now
  be released. The complete cleanup after {windowRun} is:'
tutorial.lifecycle.guidance: Release the swap chain before destroying its native window, and release the context
  after its resources. Submitted command buffers are recycled by the queue, and the drawable is managed by the swap
  chain, so neither needs a separate {dispose} call.
tutorial.lifecycle.title: Frame lifecycle and cleanup
tutorial.pipeline.behavior: 'After the input layout, create the pipeline:'
tutorial.pipeline.context: '{cullNone} disables face culling, so the triangle is drawn whether its vertices appear
  clockwise or counterclockwise.'
tutorial.pipeline.description: A {graphicsPipeline} brings together the vertex layout, the two shaders, and the
  settings that determine how primitives are assembled and written to attachments.
tutorial.pipeline.details: 'The shaders process vertices and fragments. The other pipeline settings control primitive
  assembly, face culling, depth testing, and blending:'
tutorial.pipeline.guidance: The pipeline's color format must match the render-pass attachment, so it is taken from
  {swapChainDescFormat}. {count1} specifies one sample per pixel.
tutorial.pipeline.item: '{triangleList} assembles each consecutive group of three vertices into a triangle.'
tutorial.pipeline.notes: '{depthNone} disables depth testing and depth writes, consistent with the absence of a
  depth attachment.'
tutorial.pipeline.reference: "{opaque} disables blending. The fragment shader's output therefore replaces the background
  color inside the triangle."
tutorial.pipeline.title: Graphics pipeline
tutorial.pipeline.usage:
  Shader objects may be released after pipeline creation. Keep the pipeline alive while rendering,
  and add {pipelineDispose} before {vertexBufferDispose} in the cleanup.
tutorial.presentation.title: Graphics context and presentation
tutorial.project.context: Enable {emphasis} ({allowUnsafeBlocks}) in the project's build settings. Native calls
  in the window helper and the vertex upload require unsafe code.
tutorial.project.context.emphasis: Allow unsafe code
tutorial.project.description: Create a C# console project named {firstTriangle} targeting .NET 10.
tutorial.project.details: 'Add the following NuGet packages to the project:'
tutorial.project.guidance: '{zenithNET} provides the shared rendering API, and the three backend packages supply
  its platform implementations. {zenithNETCompiler} compiles the Slang shaders introduced below for the selected
  backend. Silk.NET provides window creation and event processing.'
tutorial.project.title: Project setup
tutorial.requirements.description: 'You need the {emphasis} and basic C# knowledge. The application targets {net10}.
  Your GPU and driver must support the backend selected for your platform:'
tutorial.requirements.description.emphasis: .NET 10 SDK
tutorial.requirements.guidance: Zenith.NET renders into a native surface provided by the application. Silk.NET.Windowing
  creates the window and processes its events. On macOS, presentation uses a Metal layer, represented by {cAMetalLayerCs};
  the window helper attaches it to the window.
tutorial.requirements.table.headings.graphicsBackend: Graphics backend
tutorial.requirements.table.headings.platform: Platform
tutorial.requirements.table.linux.graphicsBackend: Vulkan 1.4
tutorial.requirements.table.linux.platform: Linux (X11 or XWayland)
tutorial.requirements.table.macOS.graphicsBackend: Metal 4
tutorial.requirements.table.macOS.platform: macOS
tutorial.requirements.table.windows.graphicsBackend: DirectX 12
tutorial.requirements.table.windows.platform: Windows
tutorial.requirements.title: Prerequisites
tutorial.resize.context: 'Build and run the application again. The background should continue to fill the window
  when you resize it: each new render pass sets its viewport and scissor from the resized attachment. Keep the render
  callback in place; the triangle will be drawn inside this pass.'
tutorial.resize.description:
  "The swap chain must follow changes to the framebuffer's size. Register a {framebufferResize}
  callback after the render callback and before {windowRun}:"
tutorial.resize.details: Listen for {link}, which are measured in pixels, rather than changes to the window's logical
  size. If minimizing the window sets either framebuffer dimension to zero, the resize callback leaves the swap
  chain unchanged. The render callback also returns while either dimension is zero, pausing rendering until the
  framebuffer has a usable size again.
tutorial.resize.details.link: framebuffer-size changes
tutorial.resize.guidance: The render callback waits for each submitted frame to finish before calling {present}.
  The resize callback can therefore replace the swap-chain images without interrupting work from an earlier frame.
  The {link} article explains these completion and resource-lifetime requirements in more detail.
tutorial.resize.guidance.link: Synchronization
tutorial.resize.title: Resizing
tutorial.shaders.compilation.context: Using {appContextBaseDirectory} loads the copied shader from the application's
  output directory, so launching the application from another working directory does not change where it looks for
  the file.
tutorial.shaders.compilation.description: For {triangleSlang}, set the file property {emphasis} to {detail}. The
  build will then copy the shader beside the executable.
tutorial.shaders.compilation.description.detail: Copy if newer
tutorial.shaders.compilation.description.emphasis: Copy to Output Directory
tutorial.shaders.compilation.details: 'Return to {programCs} and add shader initialization after the vertex upload,
  before the render callback:'
tutorial.shaders.compilation.guidance:
  '{zenithCompiler} compiles the source for {contextGraphicsApi}, and {createShader}
  creates a shader object from the compiled description. The entry-point names {vSMain} and {fSMain} select the
  two functions defined in the Slang file.'
tutorial.shaders.compilation.title: Compiling the shaders
tutorial.shaders.context: '{fSInput} connects the two shader stages. The vertex shader writes a clip-space position
  to {sVPOSITION}; the GPU uses this position to determine which part of the triangle is visible. The {cOLOR0} field
  carries the vertex color, which is interpolated across the triangle before reaching the fragment shader. Its type
  and semantic must agree between the two stages.'
tutorial.shaders.description: Shaders are programs that run on the GPU. The vertex shader determines each vertex's
  position, and the fragment shader determines the color at each covered image location. Both stages will be written
  in one Slang file, with a separate entry point—the function where execution begins—for each stage.
tutorial.shaders.details: 'Create {triangleSlang} with these input and output structures:'
tutorial.shaders.fragment.description: 'Append the fragment entry point to the same file:'
tutorial.shaders.fragment.details: Rasterization determines where the triangle covers the image and generates fragments
  for those locations. Each fragment receives a color interpolated from the three vertex colors. {fSMain} returns
  this color, and {sVTARGET} directs the result to the first color attachment.
tutorial.shaders.fragment.title: Fragment shading
tutorial.shaders.guidance: "{vSInput} defines the vertex shader's inputs. {pOSITION0} and {cOLOR0} identify the
  attributes by semantic; the C# field names alone do not establish this mapping."
tutorial.shaders.title: Shader stages
tutorial.shaders.vertex.description: 'Append the vertex entry point to {triangleSlang}:'
tutorial.shaders.vertex.details: The GPU invokes this entry point for each input vertex. It adds the homogeneous
  coordinate {w} and forwards the color. After vertex processing, position is divided by w. Since w is 1 here, x,
  y, and z are unchanged and may be interpreted directly as normalized device coordinates.
tutorial.shaders.vertex.title: Vertex shading
tutorial.surface.description: 'Specify the native presentation target {emphasis}:'
tutorial.surface.description.emphasis: after {windowCenter} and before {windowRun}
tutorial.surface.details: The framebuffer is the window's image in pixels. {surface} describes the native presentation
  target and its dimensions, and {framebufferSize} gives the size in pixels. With display scaling, this can differ
  from the window's logical size.
tutorial.surface.guidance: 'The surface supplies the native handles needed by the selected backend: a Win32 window
  on Windows, an X11 display and window on Linux, or the attached Metal layer on macOS.'
tutorial.surface.title: Native surface
tutorial.swapChain.context: 'The swap chain depends on both the context and the window. Replace {windowDispose}
  at the end of {programCs} with this disposal order:'
tutorial.swapChain.description: 'Create the swap chain immediately after the surface description:'
tutorial.swapChain.details: The {swapChain} manages the images presented by the window. {drawable} supplies the
  current image as a {texture}, the API's image resource. After rendering, {present} requests display of that image
  and advances to the next drawable.
tutorial.swapChain.guidance: '{b8G8R8A8UNorm} stores four 8-bit channels in blue, green, red, and alpha order. {uNorm}
  maps integer values 0–255 to values 0–1. Shader output remains a logical RGBA value; the format specifies its
  storage representation. The pipeline will use {swapChainDescFormat} to match this attachment.'
tutorial.swapChain.title: Swap chain
tutorial.title: First Triangle
tutorial.troubleshooting.description: 'Use console diagnostics and the three checkpoints to identify the failing
  stage:'
tutorial.troubleshooting.details: The {link} and {detail} provide a reference for the vertex data, input layout,
  and draw operation. That example separates windowing and submission into a shared host; this tutorial retains
  the application flow in {programCs}. {context} introduces indexed drawing, transformations, and depth testing.
tutorial.troubleshooting.details.context: Spinning Cube
tutorial.troubleshooting.details.detail: Slang shader
tutorial.troubleshooting.details.link: sample renderer
tutorial.troubleshooting.table.backend.check: Check that the selected backend is supported by the device and installed
  graphics driver.
tutorial.troubleshooting.table.backend.symptom: Backend creation fails
tutorial.troubleshooting.table.drawing.check: Check the upload size, input layout, pipeline selection and the placement
  of the draw commands inside the render pass.
tutorial.troubleshooting.table.drawing.symptom: The background appears but the triangle does not
tutorial.troubleshooting.table.headings.check: Check
tutorial.troubleshooting.table.headings.symptom: Symptom
tutorial.troubleshooting.table.input.check: Check the 28-byte stride and the position/color offsets of 0 and 12.
tutorial.troubleshooting.table.input.symptom: Vertex positions or colors are corrupted
tutorial.troubleshooting.table.shaders.check: Check the copied {triangleSlang}, entry-point spelling and the compiler's
  reported diagnostic.
tutorial.troubleshooting.table.shaders.symptom: The clear-color step works, but shader loading fails
tutorial.troubleshooting.table.window.check: Confirm the .NET project builds and the window-only step runs in a
  desktop session. On Linux, check that X11 or XWayland is available.
tutorial.troubleshooting.table.window.symptom: No window opens
tutorial.troubleshooting.title: Troubleshooting
tutorial.window.description: 'Download {cocoaHelperCs} into the project. This helper class attaches the Metal layer to the macOS window.'
tutorial.window.details: 'Replace the generated {programCs} with the code below. It uses top-level statements, which
  run in order without an explicit {main} method. Each later section will show where to add its code:'
tutorial.window.guidance: '{graphicsAPINone} leaves graphics-context creation to Zenith.NET. {initialize} creates
  the native window and makes its window-system handles available. {center} places the window in the center of the
  screen. {run} processes events until the window closes, then execution continues to {dispose} to release it.'
tutorial.window.notes: Build and run the application, then check that the window opens, moves, resizes, and closes.
  Its contents are not yet defined because no rendering commands have been submitted. Close the window before continuing.
tutorial.window.title: Window creation
