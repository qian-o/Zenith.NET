  Their projects reference the library source. From a checkout of Zenith.NET, run the chosen project, for example:'
samples.workloads.description.link: Experiments directory
samples.workloads.details: The windowed experiments use the same Windows, macOS and Linux/X11 host choices. For
  drawing inside Avalonia, WinForms, WPF, WinUI/Uno or MAUI, see {link} for the control's frame lifecycle and implementation
  links.
