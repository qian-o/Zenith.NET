samples.computeShader.description: The sample loads {assetsTexturesShokoPng}, converts it to grayscale in a compute
  dispatch, and displays the output texture. The conversion runs once; later frames display the same result. The
  renderer shows how to bind sampled and writable textures, round up thread-group counts to cover the image, and
  check image bounds in the shader.
samples.computeShader.details: '{computeShaderRendererCs} · {computeShaderSlang}'
samples.computeShader.title: Compute Shader
samples.cube.description: The cube adds indexed drawing, model, view, and projection matrices in a constant buffer,
  and depth testing. Its {d32FloatS8UInt} depth/stencil texture is recreated on resize.
