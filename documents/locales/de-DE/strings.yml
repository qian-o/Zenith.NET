samples.description: "Wählen Sie ein zielgerichtetes Beispiel für die Funktion, die Sie untersuchen möchten. Jedes Beispiel verlinkt auf den C#-Renderer und seinen Slang-Shader. Beginnen Sie mit {link}, wenn Sie eine vollständige Anwendung von einem leeren Projekt an erklärt haben möchten."
samples.description.link: Erstes Dreieck
samples.execution.description: "{link} enthält sechs unabhängige Renderer in einer Desktop-Anwendung. Verwenden Sie das .NET 10 SDK und ein unterstütztes Desktop-Backend, wie unten beschrieben. Erstellen Sie die Anwendung und führen Sie sie aus, und wählen Sie dann ein Beispiel aus dem Konsolenmenü:"
samples.execution.description.link: ZenithTutorials
samples.execution.details: Der Host wählt DirectX 12 unter Windows, Metal unter macOS und Vulkan unter Linux. Verwenden Sie ein Gerät, einen Treiber und eine Shader-Compiler-Umgebung, die vom ausgewählten Backend unterstützt werden. Der Linux-Fensterpfad erfordert X11 oder XWayland. Die {link} deklariert Paketabhängigkeiten und kopiert die zur Laufzeit benötigten Shader- und Textur-Assets.
samples.execution.details.link: Projektdatei
samples.execution.guidance: Die Beispiele teilen sich den Code für Fensterverwaltung und Präsentation. Sie können jedes Beispiel unabhängig danach auswählen, welche Funktion Sie untersuchen möchten.
samples.execution.title: Tutorial-Beispiele ausführen
samples.host.description: "{appCs} erstellt den Kontext, das Fenster und die Swapchain. Es bezieht einen Befehlspuffer, ruft den ausgewählten Renderer auf, reicht den Frame ein und präsentiert ihn. {iRendererCs} definiert die Update-, Render-, Resize- und Freigabemethoden des Renderers."
samples.host.details: Compute und Raytracing erzeugen Offscreen-Texturen. {texturePresenterCs} und {presentTextureSlang} zeichnen diese Texturen in die Ausgabetextur des aktuellen Frames des Fensters. Der Host besitzt weiterhin das Einreichen und die Swapchain-Präsentation.
samples.host.title: Gemeinsamer Host und Präsentation
samples.indirectDrawing.description: Zeichnet mehrere Kopien eines Würfels unter Verwendung eines indexierten indirekten Argumentpuffers und Instanzdaten in einem strukturierten Puffer. Die CPU liefert die Zeichenargumente und aktualisiert die Transformationen. Nutzen Sie dies, um das Layout indirekter Argumente und den Shader-Zugriff auf Instanzdaten zu verstehen, bevor Sie GPU-generierte Argumente hinzufügen.
samples.indirectDrawing.details: "{indirectDrawingRendererCs} · {indirectDrawingSlang}"
samples.indirectDrawing.title: Indirektes Zeichnen
samples.meshShading.description: "Verwendet einen Task-Shader, um Kugelinstanzen für das Zeichnen auszusortieren und die Indizes der verbleibenden Instanzen an einen Mesh-Shader weiterzugeben, der Geometrie ausgibt. Der Renderer prüft {contextCapabilitiesMeshShadingSupported}, bevor er seine Pipeline erstellt. Nutzen Sie das Beispiel, um Ressourcen-Handles und Nutzdaten durch die Task- und Mesh-Stufen zu verfolgen."
