concepts.resources.bufferUsages.title: Puffernutzungen
concepts.resources.description: 'Die Ressourcenbeschreibung legt fest, wie die Anwendung den Speicher verwenden darf. Soll eine Textur als Renderziel dienen, im Shader abgetastet und zur CPU zurückgelesen werden, benötigt sie die Nutzungsflags für alle drei Vorgänge. Die Speicherplatzierung bestimmt den CPU-Zugriff. Synchronisation und Lebensdauerverwaltung bestimmen dagegen, wann Daten zugänglich sind und Speicher freigegeben werden darf.'
concepts.resources.memory.context: 'Bei CPU-zugänglichen Puffern liefert {map} die Adresse zum Lesen oder Schreiben der Daten. Weder das Mapping noch {unmap} wartet auf GPU-Arbeit. Vor dem Lesen eines GPU-Ergebnisses muss die Anwendung auf den Schreibvorgang warten. Bevor sie dieselben Bytes verändert, muss sie alle noch ausstehenden GPU-Zugriffe darauf abwarten.'
concepts.resources.memory.description: 'Das Feld {residency} von {bufferDesc} beschreibt den vorgesehenen CPU-Zugriff auf die Allokation:'
concepts.resources.memory.details: 'Das Dreieck verwendet {cpuWriteOnly}, um seinen kleinen Vertexpuffer direkt zu initialisieren; für hauptsächlich von der GPU genutzte statische Ressourcen empfiehlt sich stattdessen ein Upload in GPU-only-Speicher.'
concepts.resources.memory.guidance: 'Direkt über den Kontext erstellte Texturen verwenden GPU-Speicher. {textureDesc} enthält deshalb kein Residenzfeld; Daten werden über Uploads und Downloads mit dem CPU-Speicher ausgetauscht.'
concepts.resources.memory.table.cpuReadOnly.cpuAccess: 'Nur Lesen'
concepts.resources.memory.table.cpuReadOnly.typicalRole: 'Von der GPU erzeugte Rücklesedaten'
