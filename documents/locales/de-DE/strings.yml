concepts.platforms.surface.title: 'Native Präsentationsziele'
concepts.platforms.title: Plattformintegration
concepts.platforms.verticalSync.description: 'Vertikale Synchronisation richtet die Präsentation am Bildwiederholzyklus des Bildschirms aus, um Tearing zu verhindern. {swapChainDescIsVerticalSyncEnabled} ist standardmäßig {false}, sodass {swapChainPresent} ohne Warten auf die nächste Bildwiederholung präsentieren kann; setzen Sie den Wert auf {true}, um die Präsentation zu synchronisieren und {swapChainPresent} an die Bildwiederholrate zu koppeln.'
concepts.platforms.verticalSync.details: 'Diese Einstellung wird beim Erstellen der Swapchain festgelegt. Um sie zu ändern, warten Sie wie vor {swapChainResize} auf den Abschluss laufender GPU-Arbeit auf den Ausgabetexturen, geben Sie dann die Swapchain frei und erstellen Sie eine neue.'
concepts.platforms.verticalSync.title: 'Vertikale Synchronisation'
concepts.resources.allocation.context: 'Platzierte Ressourcen benötigen den Speicher ihres Heaps während ihrer gesamten Lebensdauer. Warten Sie auf ihre letzte GPU-Nutzung und geben Sie anschließend zuerst die Ressourcen und dann den Heap frei.'
concepts.resources.allocation.description: 'Verwenden Sie einen {heap}, wenn die Anwendung die Speicherzuteilung selbst verwalten soll. Ressourcen werden darin an expliziten Byte-Offsets platziert. Die Anwendung legt diese Offsets fest und verfolgt die belegten Bereiche.'
concepts.resources.allocation.details: 'Rufen Sie für jede Ressource {contextGetSizeAndAlignment} mit der Puffer- oder Texturbeschreibung auf, die auch für die Erstellung verwendet wird. Reservieren Sie die zurückgegebene Größe an einem Offset, der ein Vielfaches der angegebenen Ausrichtung ist. Die Allokation muss innerhalb des Heaps liegen und darf keine andere noch aktive Allokation überlappen. Texturen können Auffüllung benötigen; ihre Allokationsgröße lässt sich deshalb nicht allein aus Pixelzahl und Bytes pro Pixel berechnen.'
concepts.resources.allocation.guidance: 'Ein in einem Heap platzierter Puffer muss dieselbe Residenz wie der Heap angeben. Verwenden Sie für Texturen einen Heap mit GPU-only-Residenz.'
concepts.resources.allocation.title: 'Heap-Allokation'
