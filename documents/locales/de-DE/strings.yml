tutorial.context.description: Das Fenster kann sich nun öffnen, aber wir haben noch nicht die GPU-Objekte erstellt, die darin rendern werden. Ein {graphicsContext} bietet Zugriff auf das ausgewählte Grafik-Backend und seine Befehlswarteschlangen.
tutorial.context.details: "Fügen Sie diesen Block {emphasis} ein:"
tutorial.context.details.emphasis: nach den using-Direktiven, vor {iWindowWindow}
tutorial.context.guidance: Die Verzweigungen wählen DirectX 12 unter Windows, Metal unter macOS und Vulkan unter Linux aus. Der nachfolgende Rendering-Code verwendet die gemeinsame Zenith.NET-API. Wir fordern die Validierung während der Entwicklung an und geben über {validationMessage} gemeldete Meldungen aus. Die Diagnose hängt vom Backend und den auf dem Computer verfügbaren Validierungskomponenten ab.
tutorial.context.title: Grafikkontext erstellen
tutorial.description: Erstellen Sie eine .NET-Konsolenanwendung, die ein Fenster öffnet und ein Dreieck mit einem weichen Farbverlauf zeichnet. Sie lernen, wie Scheitelpunktdaten, Shader und Pipeline-Zustände zusammenwirken, und zeichnen anschließend die Befehle auf und reichen sie ein, die das Bild erzeugen.
tutorial.details: Arbeiten Sie die Abschnitte der Reihe nach durch. Sie öffnen zuerst ein leeres Fenster, zeigen dann eine Hintergrundfarbe an und zeichnen schließlich das Dreieck. Jeder Kontrollpunkt bestätigt einen Teil der Anwendung, bevor Sie den nächsten hinzufügen. Die Initialisierung wird einmal ausgeführt; der Render-Callback zeichnet bei jedem Aufruf einen neuen Frame auf.
tutorial.draw.context: "Die Argumente für {draw} sind:"
tutorial.draw.description: "Ersetzen Sie im Callback {windowRender} den Platzhalter {addTheTriangleDrawCommandsHereLater} durch diese drei Befehle zwischen {beginRenderPass} und {endRenderPass}:"
tutorial.draw.details: "{setPipeline} wählt die soeben erstellten Shader und Zustände aus. Setzen Sie sie vor dem Binden von Scheitelpunktdaten: Das Backend verwendet das Eingabelayout der Pipeline, um die Bindung zu interpretieren."
tutorial.draw.guidance: "{setVertexBufferVertexBuffer} bindet den Puffer ab Byte-Offset 0 an Eingabeslot 0. Dieser Slot entspricht dem einzelnen Eintrag in {inputLayouts}. Die Daten werden dadurch nicht erneut kopiert oder hochgeladen."
tutorial.draw.notes: Die Befehle sind an dieser Stelle immer noch nur aufgezeichnet. Die Aufrufe von {submitWait} und {present}, die sich bereits am Ende des Render-Callbacks befinden, führen die Arbeit aus und zeigen ihr Ergebnis an. Das Löschen bleibt notwendig, da das Dreieck nur einen Teil des Bildes abdeckt; der Hintergrund muss ebenfalls in jedem Frame eine definierte Farbe erhalten.
tutorial.draw.table.firstInstance.meaning: Instanznummerierung bei null beginnen.
tutorial.draw.table.firstVertex.meaning: Mit dem ersten Scheitelpunkt im Puffer beginnen.
tutorial.draw.table.headings.argument: Argument
tutorial.draw.table.headings.description: Wert
tutorial.draw.table.headings.meaning: Bedeutung
tutorial.draw.table.instanceCount.meaning: Eine Kopie des Dreiecks zeichnen.
tutorial.draw.table.vertexCount.meaning: Drei Scheitelpunkte lesen.
tutorial.draw.title: Das Dreieck innerhalb des Passes zeichnen
tutorial.execution.description: "Erstellen Sie die Anwendung und führen Sie sie aus dem Verzeichnis {firstTriangle} aus:"
tutorial.execution.details: Das Fenster sollte ein Dreieck mit einer roten oberen Ecke, einer grünen unteren rechten Ecke und einer blauen unteren linken Ecke vor einem dunklen Hintergrund anzeigen. Das Innere sollte einen weichen Übergang zwischen diesen Farben aufweisen.
tutorial.execution.guidance: Ändern Sie die Fenstergröße. Der Resize-Callback aktualisiert die Framebuffer-Abmessungen und passt die Größe der Swapchain an. Der Renderpass richtet einen Viewport ein, der diesem Bild entspricht. Da die Scheitelpunktpositionen in normalisierten Koordinaten verbleiben, behält das Dreieck denselben Bruchteil der Fensterbreite und -höhe bei; eine Änderung des Seitenverhältnisses kann seine Form verzerren. Die Beibehaltung des Seitenverhältnisses eines Objekts erfordert eine Projektions- oder Viewport-Strategie, die über diesen ersten Zeichenvorgang hinausgeht.
tutorial.execution.title: Ausführen, Größe ändern und schließen
tutorial.frame.commands.context: Nach {endRenderPass} bereitet der zweite Übergang das Bild auf die Präsentation vor. {submit} beendet die Aufzeichnung und reicht den Befehlspuffer ein; {wait} wartet darauf, dass die GPU diese Übermittlung abschließt. {present} fordert dann die Anzeige des gerenderten Bildes an.
tutorial.frame.commands.description: Ein Renderpass gruppiert Zeichenoperationen, die dieselben Attachments verwenden. Hier ist das Farb-Attachment die Ausgabetextur der Swapchain, also das Bild, das unsere Zeichnung empfängt. {colorAttachmentClear} erstellt eine Beschreibung, die den Pass anweist, auf die angegebene RGBA-Farbe zu löschen und das Ergebnis nach Beendigung des Passes beizubehalten. {beginRenderPass} zeichnet diese Anweisungen auf; die GPU führt das Löschen aus, nachdem die Befehle eingereicht wurden.
tutorial.frame.commands.details: Die eckigen Klammern enthalten unser einzelnes Farb-Attachment. Das Argument {null} bedeutet, dass kein Tiefen-/Stencil-Attachment vorhanden ist, das Tiefenwerte und Stencil-Masken für Tiefen- und Stencil-Tests speichern würde.
tutorial.frame.commands.guidance: "{beginRenderPass} legt einen Viewport und einen Scissor fest, die das Attachment abdecken. Der Viewport bildet die gerenderten Koordinaten auf Pixel ab, und der Scissor schränkt ein, welche Pixel beschrieben werden dürfen. Diese Standardeinstellungen decken die gesamte Ausgabetextur ab, was für dieses Dreieck genau richtig ist."
tutorial.frame.commands.title: Löschen, einreichen und präsentieren
tutorial.frame.description: Füllen Sie das Bild zunächst mit einer einzigen Hintergrundfarbe. Dieser Vorgang wird als Löschen (Clear) bezeichnet. Wenn diese Farbe im Fenster erscheint, arbeiten die Oberfläche, das Einreichen von Befehlen und der Präsentationspfad zusammen. Mit diesem Kontrollpunkt können Sie die Frame-Schleife überprüfen, bevor Sie Geometrie und Shader hinzufügen.
tutorial.frame.details: "Ein Render-Callback ist Code, den Silk.NET aufruft, wenn ein Frame gezeichnet werden soll. Dieser Callback benötigt das Argument für die vergangene Zeit des Ereignisses nicht, daher wird es {value} genannt. Registrieren Sie ihn {emphasis}:"
tutorial.frame.details.emphasis: vor {windowRun}
tutorial.frame.target.description: "{graphicsQueueCommandBuffer} bezieht einen Befehlspuffer, dessen Aufzeichnung bereits begonnen hat. Das Aufzeichnen beschreibt Arbeit für die GPU; es führt diese Arbeit nicht sofort aus."
tutorial.frame.target.details: Der erste {transition}-Aufruf bereitet die Ausgabetextur für den Zugriff als Farb-Attachment vor. {default} wählt Mip-Level 0 und Array-Layer 0 aus. Wir verwenden {undefined} als vorheriges Layout, da wir das gesamte Bild löschen und seinen vorherigen Inhalt verwerfen. Ein Pass, der vorhandene Inhalte beibehalten muss, muss stattdessen sein tatsächliches vorheriges Layout verwenden.
tutorial.frame.target.guidance: Verwenden Sie in jedem Frame die aktuelle Ausgabetextur der Swapchain. Die Präsentation kann ändern, welches Bild verfügbar ist; daher ist eine aus einem früheren Frame gespeicherte Textur kein dauerhaftes Fenster-Renderziel.
tutorial.frame.target.title: Ausgabetextur vorbereiten
tutorial.frame.title: Eine Hintergrundfarbe anzeigen
tutorial.geometry.data.description: Fügen Sie dieses Array {emphasis} hinzu. Die folgenden Schritte zur Ressourcenerstellung gehören ebenfalls vor diesen Callback, in der gezeigten Reihenfolge.
tutorial.geometry.data.description.emphasis: vor {windowRender}
tutorial.geometry.data.details: "Jeder Array-Eintrag erstellt einen {vertex}. Die beiden inneren {new}-Ausdrücke erstellen seine {vector3}-Position und {vector4}-Farbe. Die Scheitelpunkte beschreiben die obere, untere rechte und untere linke Ecke. Der Vertex-Shader liefert eine vierte Positionskoordinate, {w}. Wenn w gleich 1 ist, beschreiben x und y direkt normalisierte Gerätekoordinaten: -1 und +1 sind die Bildränder und 0 ist das Zentrum. Diese Koordinaten hängen nicht von den Pixelabmessungen des Fensters ab."
tutorial.geometry.data.guidance: Jede Farbe enthält Rot-, Grün-, Blau- und Alpha-Komponenten. Alpha ist an allen drei Ecken 1. Alle drei Positionen haben z = 0 und liegen damit in derselben Ebene. Diese Positionen benötigen keine Kamera- oder Transformationsmatrix, da sie bereits die Koordinaten beschreiben, die wir rendern möchten. Für dieses einzelne flache Dreieck deaktivieren wir außerdem Blending und Tiefentests und verzichten auf einen Tiefenpuffer.
tutorial.geometry.data.title: Die Ecken auswählen
tutorial.geometry.description: Ein Scheitelpunkt (Vertex) ist ein Punkt zusammen mit den zu seinem Zeichnen verwendeten Daten. Unser Dreieck hat drei Scheitelpunkte, einen für jede Ecke. Jeder enthält eine Position und eine Farbe. Die GPU interpoliert die Farben und berechnet Zwischenwerte über das gesamte Dreieck hinweg.
tutorial.geometry.format.description: "Fügen Sie diese Deklaration {emphasis} an:"
tutorial.geometry.format.description.emphasis: am Ende von {programCs}, nach den Bereinigungsanweisungen
tutorial.geometry.format.details: "{file} beschränkt diesen Typ auf {programCs}, und der Konstruktor initialisiert seine Positions- und Farbfelder. {layoutKindSequential} behält die Deklarationsreihenfolge der Felder bei. {position} enthält drei 32-Bit-Gleitkommazahlen und {color} vier. In dieser Struktur beginnt die Position bei Byte 0, die Farbe bei Byte 12, und der gesamte Scheitelpunkt belegt 28 Bytes. Dasselbe Layout werden wir der Grafikpipeline beschreiben."
tutorial.geometry.format.title: Einen Scheitelpunkt definieren
tutorial.geometry.title: Der GPU drei Scheitelpunkte übergeben
tutorial.geometry.upload.context: "{fixed} verhindert, dass der Garbage Collector das Array verschiebt, während seine Adresse verwendet wird. Bei diesem CPU-beschreibbaren Puffer mappt {upload} den Speicher, kopiert die Daten und hebt das Mapping vor der Rückkehr auf. Das Array muss danach nicht fixiert bleiben. Der Puffer muss während des gesamten Renderings gültig bleiben. Da sich die Scheitelpunkte nicht ändern, genügt ein einmaliger Upload."
tutorial.geometry.upload.description: "Das verwaltete Array besteht aus CPU-Daten. Ein {buffer} stellt der GPU Speicherplatz zur Verfügung, aus dem sie die Scheitelpunkte lesen kann. Fügen Sie nach dem Array Folgendes hinzu:"
tutorial.geometry.upload.details: "Die Gesamtgröße beträgt {sizeofVertexVerticesLength}: 28 Bytes pro Scheitelpunkt, drei Scheitelpunkte, insgesamt 84 Bytes. {bufferUsagesVertex} erlaubt den Zugriff als Scheitelpunkteingabe. {cpuWriteOnly} ermöglicht es der CPU, diesen kleinen Puffer direkt zu initialisieren. Der Stride des Deskriptors erfasst die Elementgröße; das weiter unten erstellte Eingabelayout teilt dem Scheitelpunktabruf mit, wie die einzelnen Attribute zu lesen sind."
tutorial.geometry.upload.guidance: Das Erstellen eines Puffers befüllt ihn nicht. {upload} kopiert das Array ab dem Ziel-Byte-Offset 0 in diese Zuweisung. Seine Quellbeschreibung liefert einen Zeiger und die Anzahl der zu kopierenden Bytes.
tutorial.geometry.upload.notes: Fügen Sie {vertexBufferDispose} unmittelbar vor {swapChainDispose} in die Bereinigung am Ende von {programCs} ein. Für größere statische Geometrien erklärt {link}, wann stattdessen reiner GPU-Speicher und Transfer-Uploads gewählt werden sollten.
tutorial.geometry.upload.notes.link: Ressourcenverwaltung
tutorial.geometry.upload.title: Einen Puffer zuweisen und das Array hochladen
tutorial.input.description: "Die Scheitelpunkt-Bytes und Shader sind bereit. Beschreiben Sie als Nächstes, wie die GPU jeden Scheitelpunkt lesen soll. Ein Attribut ist ein einzelner Wert, wie etwa Position oder Farbe. Das Eingabelayout weist jedem Attribut ein Format und einen Byte-Offset zu; der Stride gibt den Abstand in Bytes von einem Scheitelpunkt zum nächsten an. Fügen Sie diesen Initialisierungsblock nach der Shader-Erstellung ein:"
tutorial.input.details: "{inputLayoutAdd} hängt ein Element am aktuellen Stride an und erhöht diesen Stride um die Größe des Elements. Es überprüft die C#-Struktur nicht. Hier erzeugt es die folgende Übereinstimmung zwischen CPU-Speicher und Shader-Eingaben:"
tutorial.input.guidance: "Eine Änderung der C#-Feldreihenfolge oder des Paddings ohne Anpassung dieser Beschreibung würde die GPU falsche Bytes lesen lassen. Der Standardwert von {semanticIndex} ist 0 und entspricht {pOSITION0} und {cOLOR0}. Beide Elemente gehören zum selben Puffer. Deshalb enthält die Pipeline ein Eingabelayout, und wir binden den Puffer an Slot 0."
