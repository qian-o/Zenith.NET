concepts.platforms.integration.title: Sowohl den Präsentationspfad als auch das Framework auswählen
concepts.platforms.lifecycle.context: Verwenden Sie bei einer UI-Ansicht die Eigenschaften {descWidth}, {descHeight}, {descFormat} und {descSampleCount} der Ausgabetextur des Ereignisses, wenn Sie passende Rendering-Ressourcen erstellen. Das Steuerelement bestimmt die Auflösung dieser Ausgabetextur; gehen Sie nicht davon aus, dass seine logischen Abmessungen oder die Anzeigeskalierung stets den Texturabmessungen entsprechen.
concepts.platforms.lifecycle.description: Übergeben Sie bei einer nativen Swapchain Framebuffer-Abmessungen in Pixeln. In logischen Einheiten ausgedrückte Fenstergrößen können abweichen, wenn die Anzeigeskalierung aktiviert ist. Überspringen Sie Framebuffer der Größe null, passen Sie die Größe der Swapchain an, wenn sich ihre Pixelgröße ändert, und fordern Sie {swapChainDrawable} für jeden Frame an. Die Ausgabetextur gehört der Swapchain und kann sich nach der Präsentation oder Größenänderung ändern.
concepts.platforms.lifecycle.details: "{swapChainResize} ändert die Abmessungen der vorhandenen Oberfläche. {swapChainRefresh} ersetzt die Oberflächenbeschreibung einschließlich ihrer nativen Handles. Schließen Sie vor beiden Operationen ausstehende Verwendungen der betroffenen Ressourcen ab. Geben Sie die Swapchain frei, bevor Sie ihr natives Präsentationsziel zerstören."
concepts.platforms.lifecycle.guidance: "Erstellen Sie anwendungseigene Tiefen- oder Offscreen-Texturen, deren Größe dem Fenster folgt, neu und aktualisieren Sie Konstanten, die ihre Handles enthalten. Eine Pipeline kann bei einer Größenänderung erhalten bleiben, wenn ihre Attachment-Formate und die Sample-Anzahl kompatibel bleiben. Der {link} behält seine Pipeline bei, während er seine Tiefentextur ersetzt."
concepts.platforms.lifecycle.guidance.link: Renderer des rotierenden Würfels
concepts.platforms.lifecycle.title: Größe und Lebensdauer der Ausgabetextur beim Host belassen
concepts.platforms.ownership.description: Die Anwendung besitzt den von ihr zugewiesenen Kontext und die Ressourcen, die sie für das Rendering erstellt. Das Steuerelement besitzt seine eigenen Präsentationsressourcen. Eine Änderung der Eigenschaft {graphicsContext} der Ansicht veranlasst den Scheduler, die Ressourcen des Steuerelements neu zu erstellen; die Pipelines, Puffer oder Texturen der Anwendung werden für den neuen Kontext nicht neu erstellt.
concepts.platforms.ownership.details: Stimmen Sie den Ressourcenersatz mit dem Frame-Lebenszyklus der Ansicht ab. Stoppen Sie die Frame-Aktivität der Ansicht und schließen Sie ausstehende GPU-Verwendungen ab, bevor Sie Anwendungsressourcen oder den zugewiesenen Kontext freigeben. Das Entfernen einer Ansicht überträgt den Kontextbesitz nicht auf das Steuerelement.
concepts.platforms.ownership.guidance: Der gemeinsame {frameSchedulerCs} verteilt die Frame-Arbeit über den UI-Dispatcher der Ansicht. Halten Sie Frame-Handler auf das Aktualisieren und Aufzeichnen des Frames fokussiert; langwierige CPU-Arbeiten dort verzögern auch die Benutzeroberfläche.
concepts.platforms.ownership.title: Anwendungsressourcen außerhalb des Besitzes des Steuerelements halten
concepts.platforms.surface.context: Die Unterstützung eines Betriebssystems durch eine Fensterbibliothek oder ein UI-Framework garantiert nicht, dass das ausgewählte GPU-Backend dort verfügbar ist. Gerätefunktionen, Treiber und native Oberflächenunterstützung müssen dennoch zusammenpassen. Überprüfen Sie optionales Raytracing und Mesh-Shading über {contextCapabilities}, bevor Sie diese Arbeitslasten erstellen.
concepts.platforms.surface.description: Das {link} verwendet Silk.NET, um ein Fenster zu erstellen und Ereignisse zu verarbeiten. Zenith.NET verbindet sich mit diesem Fenster über eine {surface}-Beschreibung und eine {swapChain}. Eine Oberfläche enthält native Handles und Abmessungen; das Erstellen der Beschreibung erstellt oder besitzt das Betriebssystemfenster nicht.
concepts.platforms.surface.description.link: Dreieck
concepts.platforms.surface.details: "Das Handle muss zum ausgewählten Backend passen:"
concepts.platforms.surface.guidance: Die Datei {appCs} des Tutorials zeigt die Auswahlmöglichkeiten für Windows, macOS und X11. Ihr Linux-Host liefert Xlib-Handles; die Verwendung in einer Wayland-Sitzung erfordert XWayland. Eine native Wayland-Anwendung würde andere Handles über {surfaceWayland} bereitstellen.
