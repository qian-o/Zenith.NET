samples.computeShader.description: Konvertiert ein Bild mit einem Compute-Dispatch in Graustufen und zeigt die resultierende Textur an. Es demonstriert Ressourcen-Handles für eine abgetastete Eingabetextur und eine schreibbare Ausgabetextur, aufgerundete Threadgruppen-Anzahlen sowie eine Bereichsprüfung im Shader. Behalten Sie das enthaltene Asset {assetsTexturesShokoPng} bei; der Renderer verarbeitet es einmal und präsentiert das Ergebnis in nachfolgenden Frames.
