concepts.resources.bufferUsages.title: Puffernutzungen
concepts.resources.description: "Wählen Sie die Ressourcenbeschreibung anhand der geplanten Operationen. Eine Textur, in die gerendert wird, die ein Shader abtastet und deren Daten zur CPU zurückgelesen werden, benötigt alle drei Nutzungen sowie die Synchronisation zwischen ihnen. Speicherplatzierung und Ressourcenlebensdauer sind zusätzliche Entscheidungen."
concepts.resources.memory.context: Für einen CPU-zugänglichen Puffer liefert {map} der CPU eine Adresse. Es wartet nicht darauf, dass die GPU den Zugriff auf dieselben Bytes beendet. {unmap} reicht ebenfalls keine Arbeit ein und wartet nicht auf den Abschluss. Bevor Sie CPU-beschreibbare Daten überschreiben, schließen Sie die GPU-Lesevorgänge ab, die noch den alten Inhalt benötigen.
concepts.resources.memory.description: "Ein {bufferDesc} besitzt ein {residency}-Feld. Wählen Sie es danach aus, wie CPU und GPU auf die Daten zugreifen werden:"
concepts.resources.memory.details: Residenz beschreibt den beabsichtigten CPU-Zugriff auf die Allokation. Sie bedeutet nicht, dass jedes Gerät über separaten physischen CPU- und GPU-Speicher verfügt. Das Dreieck verwendet {cpuWriteOnly}, um einen kleinen Scheitelpunktpuffer direkt zu initialisieren. Ein großes statisches Mesh kann stattdessen von reinem GPU-Speicher mit einem einmaligen Upload profitieren.
concepts.resources.memory.guidance: "{textureDesc} besitzt kein Residenzfeld. Gewöhnliche vom Kontext erstellte Texturen verwenden GPU-Speicher. Ihre öffentliche API bietet Upload- und Download-Operationen für CPU-Datenübertragungen, ohne eine direkte Mapping-Methode offenzulegen. Explizite Heaps bieten Platzierungskontrolle, wie unten beschrieben."
concepts.resources.memory.table.cpuReadOnly.cPUAccess: "Zugeordneten Speicher nach Abschluss der GPU-Kopie lesen."
concepts.resources.memory.table.cpuReadOnly.typicalRole: "Von der GPU erzeugte Rücklesedaten"
concepts.resources.memory.table.cpuWriteOnly.cPUAccess: "Zugeordneten Speicher erst beschreiben, wenn frühere GPU-Lesezugriffe beendet sind."
concepts.resources.memory.table.cpuWriteOnly.typicalRole: "Von der CPU bereitgestellte oder aktualisierte Daten"
concepts.resources.memory.table.gpuOnly.cPUAccess: "Bytes über einen Upload- oder Rücklesepuffer übertragen."
concepts.resources.memory.table.gpuOnly.typicalRole: "Statische Geometrie und GPU-Arbeitsdaten"
concepts.resources.memory.table.headings.cPUAccess: CPU-Zugriff
concepts.resources.memory.table.headings.residency: Residenz
concepts.resources.memory.table.headings.typicalRole: Typische Rolle
concepts.resources.memory.title: "Speicher nach dem benötigten CPU-Zugriff wählen"
concepts.resources.textureUsages.description: "Transfer-Nutzungsflags beschreiben die Richtung von GPU-Kopien. Der CPU-Zugriff ist eine eigene Entscheidung zur Speicherplatzierung, die weiter unten erläutert wird."
concepts.resources.textureUsages.details: "Die Kombination von Nutzungsflags deklariert mehrere Rollen; sie führt die Operationen weder aus noch ordnet sie deren Zugriffe. Für Texturen müssen außerdem {link} stimmen, und ihre Formate müssen die angeforderten Nutzungen auf dem ausgewählten Gerät unterstützen."
concepts.resources.textureUsages.details.link: "Layout und Synchronisation"
concepts.resources.textureUsages.table.colorAttachment.role: "Ein Farb-Attachment in einem Renderpass."
concepts.resources.textureUsages.table.depthStencilAttachment.role: "Ein Tiefen-/Stencil-Attachment in einem Renderpass."
concepts.resources.textureUsages.table.headings.role: "Rolle"
concepts.resources.textureUsages.table.headings.usage: Nutzung
concepts.resources.textureUsages.table.none.role: "Es sind keine Texturnutzungsflags deklariert."
concepts.resources.textureUsages.table.sampled.role: "Texturdaten, die über eine Bindung für abgetastete Texturen gelesen werden."
concepts.resources.textureUsages.table.storage.role: "Texturdaten, auf die Shader über eine Storage-Textur-Bindung lesend oder schreibend zugreifen."
concepts.resources.textureUsages.table.transferDst.role: "Zielbildspeicher für eine GPU-Kopie."
concepts.resources.textureUsages.table.transferSrc.role: "Quellbilddaten für eine GPU-Kopie."
concepts.resources.textureUsages.title: Texturnutzungen
concepts.resources.title: Ressourcenverwaltung
concepts.resources.transfers.context: Ein Download zeichnet eine GPU-Kopie in internen Rücklesespeicher auf. Die Bibliothek kopiert diese Bytes in das angegebene CPU-Ziel, wenn sie den abgeschlossenen Befehlspuffer zur Wiederverwendung zurücksetzt. Halten Sie das Ziel alloziiert und verwalteten Speicher fixiert, bis das {wait} des Übermittlungswerts zurückkehrt.
concepts.resources.transfers.description: "Ein Upload kopiert CPU-Daten zu einer GPU-Ressource; ein Download liest Ressourcendaten in den CPU-Speicher zurück. Die Methoden direkt an der Ressource schließen ihre Übertragung vor der Rückkehr ab:"
concepts.resources.transfers.details: "Diese Warteoperationen decken nur die von der jeweiligen Methode eingereichte Übertragung ab. Sie erkennen keine Abhängigkeiten von einer anderen Warteschlange, die bereits auf die Ressource liest oder schreibt. Stellen Sie diese Abhängigkeiten vor dem Aufruf der Ressourcenmethode her. Auch bei einer direkten Kopie über zugeordneten Speicher muss der Aufrufer sicherstellen, dass die betreffende GPU-Arbeit abgeschlossen ist."
concepts.resources.transfers.guidance: "Verwenden Sie {commandBufferUpload} oder {commandBufferDownload}, wenn Kopiervorgänge zusammen mit anderer Arbeit aufgezeichnet werden sollen. Die Lebensdauern ihrer Zeiger unterscheiden sich:"
concepts.resources.transfers.item: "Ein Upload kopiert die CPU-Quelldaten während des Aufrufs in einen internen Upload-Puffer, auch Staging-Speicher genannt. Der Quellzeiger muss nur für die Dauer dieses Aufrufs gültig bleiben."
concepts.resources.transfers.notes: "Bei Texturen bezeichnet der Zeilenabstand den Byte-Abstand zwischen aufeinanderfolgenden Zeilen der CPU-Daten, der Schichtabstand den Byte-Abstand zwischen aufeinanderfolgenden Tiefenschichten. Beide beschreiben nicht das interne GPU-Speicherlayout der Textur. {link} erläutert den Unterschied zwischen Abschluss und Rücklesen."
concepts.resources.transfers.notes.link: Synchronisation
concepts.resources.transfers.table.bufferDownload.transfer: Direkte CPU-Kopie für {cpuReadOnly}; andernfalls reicht es einen Download auf der Transferwarteschlange ein und wartet.
concepts.resources.transfers.table.bufferUpload.transfer: Direkte CPU-Kopie für {cpuWriteOnly}; andernfalls reicht es einen Upload auf der Transferwarteschlange ein und wartet.
concepts.resources.transfers.table.headings.method: Methode
concepts.resources.transfers.table.headings.transfer: "Art der Datenübertragung"
concepts.resources.transfers.table.textureTransfers.method: "{textureUpload} / {textureDownload}"
concepts.resources.transfers.table.textureTransfers.transfer: "Verwendet die Grafikwarteschlange, überführt die gewählte Unterressource in das Kopierlayout und anschließend in das angeforderte Endlayout und wartet auf den Abschluss."
concepts.resources.transfers.title: "Zwischen sofort abgeschlossenen und aufgezeichneten Übertragungen wählen"
concepts.resources.usages.description: "{bufferUsages} und {textureUsages} sind Flag-Enums, die die vorgesehenen Rollen einer Ressource deklarieren. Sie werden {bufferDescUsages} beziehungsweise {textureDescUsages} zugewiesen. Ein Flag-Enum ermöglicht es, mehrere Member mit {value} zu kombinieren, wenn eine Ressource mehr als eine Rolle hat."
concepts.resources.usages.title: Deklarieren Sie die erforderlichen Verwendungen vor dem Erstellen einer Ressource
concepts.resources.views.description: "Eine {bufferView} beschreibt einen Pufferbereich und dessen Interpretation. Eine {textureView} wählt einen kompatiblen Texturtyp, ein Format und einen Unterressourcenbereich. Eine Ansicht teilt den zugrunde liegenden Speicher; sie kopiert keine Daten und ergänzt keine bei der Ressourcenerstellung fehlenden Nutzungen. Ihr Bereich garantiert auch nicht auf allen Backends eine Prüfung der Shader-Zugriffsgrenzen."
concepts.resources.views.details: "Verwenden Sie das Handle der Ressource für ihre Standardansicht oder erstellen Sie eine Ansicht, wenn Sie einen anderen Bereich oder eine andere kompatible Interpretation benötigen. Halten Sie C#-Referenzen auf die Ansicht und ihre zugrunde liegende Ressource, solange GPU-Arbeit darauf zugreifen kann; ein Ressourcenhandle allein hält keines der Objekte am Leben. Geben Sie beide erst nach ihrer letzten GPU-Verwendung frei. Aktualisieren Sie nach dem Ersetzen eines der Objekte auch die Konstanten mit dessen altem {link}."
concepts.resources.views.details.link: "Ressourcenhandle"
concepts.resources.views.guidance: "Das {link} zeigt, wie eine Tiefentextur bei einer Größenänderung ersetzt wird. Das {detail} hält die Eingabetextur von der beschreibbaren Ausgabe getrennt. In beiden Fällen richtet sich die Lebensdauer der Ressource nach der Arbeit, die sie tatsächlich verwendet."
concepts.resources.views.guidance.detail: "Compute-Beispiel"
concepts.resources.views.guidance.link: "Beispiel des rotierenden Würfels"
concepts.resources.views.title: "Ansichten und zugrunde liegende Ressourcen gemeinsam gültig halten"
concepts.shaders.binding.context: "Im Compute-Beispiel wird {input} mit {inputTextureSampledHandle} und {output} mit {outputTextureStorageHandle} befüllt. Das typisierte {descriptorHandle} von Slang teilt dem Shader mit, wie auf die jeweilige Ressource zugegriffen werden soll:"
concepts.shaders.binding.description: "{setConstantBuffer} bindet einen Puffer und einen Byte-Offset für die Konstantendaten der aktuellen Pipeline. Es bindet vorhandenen GPU-sichtbaren Speicher; es lädt keinen C#-Wert hoch. Füllen Sie zuerst den Puffer und stellen Sie sicher, dass frühere GPU-Leser fertig sind, bevor Sie dessen Bytes überschreiben."
concepts.shaders.binding.details: "Setzen Sie die Pipeline vor ihrem Konstantenpuffer. Bei einer Compute-Arbeitslast mit bereits erstellten und hochgeladenen Ressourcen verwendet die Aufzeichnung diese Reihenfolge:"
concepts.shaders.binding.guidance: Dieses Fragment setzt einen aufzeichnenden {commandBuffer}, eine {computePipeline}, einen hochgeladenen {constantBuffer} mit der Nutzung {bufferUsagesConstant} und die Threadgruppen-Anzahlen für die Arbeitslast voraus. Offset 0 bindet den Anfang des Puffers. Wenn sich mehrere Konstantendatensätze einen Puffer teilen, muss der Start-Offset jedes Datensatzes die Bindungsausrichtung des Backends erfüllen. Diese Anforderung ist unabhängig vom Feldlayout innerhalb des Datensatzes.
concepts.shaders.binding.notes: "{resourceHandle} speichert zwei 32-Bit-Felder, seine Interpretation obliegt jedoch dem Backend. Behandeln Sie es nicht als universellen Deskriptorindex, Adresse oder Wert, der zwischen Kontexten übertragen werden kann. Ein Handle erstellt keine Ressource, fügt keine fehlende Verwendung hinzu und führt keine Synchronisation durch."
concepts.shaders.binding.reference: Behalten Sie Referenzen auf die Ressource und jede Ansicht, die zum Beziehen ihres Handles verwendet wurde, und geben Sie sie erst frei, nachdem die letzte Verwendung durch den Shader abgeschlossen ist. Wenn Sie eine Textur oder Ansicht ersetzen, aktualisieren Sie die Konstanten, die ihr altes Handle enthalten. {link} erläutert diese Lebensdauerbeziehung.
concepts.shaders.binding.reference.link: Ressourcenverwaltung
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: Strukturierte Elemente des Shader-Typs {t} lesen.
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: Strukturierte Elemente des Shader-Typs {t} lesen oder schreiben.
concepts.shaders.binding.table.headings.access: Beabsichtigter Zugriff
concepts.shaders.binding.table.headings.cHandle: "C#-Handle"
concepts.shaders.binding.table.headings.slangFieldType: Slang-Feldtyp
concepts.shaders.binding.table.samplerHandle.access: Textur-Abtastzustand bereitstellen.
concepts.shaders.binding.table.textureSampledHandle.access: Eine Textur lesen.
concepts.shaders.binding.table.textureStorageHandle.access: Eine Speichertextur lesen oder schreiben.
concepts.shaders.binding.title: Den Konstantenpuffer und die darin beschriebenen Ressourcen binden
concepts.shaders.compilation.description: "{zenithCompiler} kompiliert einen benannten Slang-Einstiegspunkt und gibt eine {shaderDesc} zurück. Verwenden Sie {graphicsApi} des Kontexts, damit das Ergebnis auf das Backend abzielt, das den Shader erstellen wird: DXIL für DirectX 12, eine Metal-Bibliothek für Metal oder SPIR-V für Vulkan."
concepts.shaders.compilation.details: "Zum Beispiel mit einem vorhandenen {context} und dem neben der ausführbaren Datei kopierten Dreieck-Shader:"
concepts.shaders.compilation.guidance: "{vSMain} muss exakt mit dem Namen des Einstiegspunkts in der Shader-Datei übereinstimmen. Halten Sie Shader-Objekte während der Erstellung der Pipeline gültig und geben Sie sie nach der Pipeline-Erstellung frei, wie in {link} gezeigt. Führen Sie diese Initialisierung einmalig durch, anstatt für jeden Frame neu zu kompilieren."
concepts.shaders.compilation.guidance.link: Erstes Dreieck
concepts.shaders.compilation.title: Einen Einstiegspunkt für den ausgewählten Kontext kompilieren
concepts.shaders.description: "Ein Shader empfängt von der Anwendung bereitgestellte Daten. Scheitelpunktattribute beschreiben einzelne Scheitelpunkte; Puffer enthalten Parameter oder Arrays; Ressourcen-Handles identifizieren andere Ressourcen, auf die der Shader zugreift. Die C#-Deklarationen und Slang-Deklarationen müssen darin übereinstimmen, was diese Werte bedeuten. Das bloße Übereinstimmen eines Feldnamens reicht nicht aus: Layout, Ressourcenzugriff und Bindung müssen alle übereinstimmen."
concepts.shaders.dispatch.description: "{dispatch} nimmt die Anzahl der Threadgruppen entgegen. Der Einstiegspunkt {numthreads} des Compute-Beispiels führt 16 × 16 Threads pro Gruppe aus. Teilen Sie die Bildabmessungen durch 16 und runden Sie auf, um die Gruppenanzahlen zu ermitteln. Ein 17 × 19 Bild benötigt beispielsweise 2 × 2 Gruppen. Der Shader vergleicht seine Pixelkoordinaten mit den Bildabmessungen, da die letzten Gruppen Threads außerhalb des Bildes enthalten können."
concepts.shaders.dispatch.details: Der Compiler speichert die deklarierte Gruppengröße des Einstiegspunkts in {shaderDescThreadGroupSize}; er rechnet die an {dispatch} übergebenen Pixelabmessungen nicht in Gruppenanzahlen um. Verwenden Sie {computeShaderRendererCs} mit seinem Shader für das vollständige Binde- und Dispatch-Beispiel und {link}, bevor ein anderer Pass die Ausgabe verbraucht.
concepts.shaders.dispatch.details.link: Synchronisation
concepts.shaders.dispatch.title: Threadgruppen dispatchen, nicht Pixel
concepts.shaders.layout.context: "Die {link} machen ihre Offsets explizit. Diese Deklaration benötigt {systemRuntimeInteropServices} und {zenithNET} im Gültigkeitsbereich:"
concepts.shaders.layout.context.link: "C#-Konstanten des Compute-Beispiels"
concepts.shaders.layout.description: "Für Scheitelpunkteingaben beschreibt das {inputLayout} der Pipeline Formate, Offsets, Stride und Semantiken. Die {float3}-Position des Dreiecks gefolgt von einer {float4}-Farbe belegt 28 Bytes, wobei die Farbe bei Byte 12 liegt. {inputLayoutAdd} berechnet dieses gepackte Layout; es überprüft die C#-Struktur nicht. Wenn die C#-Felder Padding enthalten, stellen Sie ein passendes Layout bereit, anstatt davon auszugehen, dass die Felder gepackt sind."
concepts.shaders.layout.details: "Konstantenpuffer enthalten Shader-Parameter, während strukturierte Puffer Arrays von Elementen eines deklarierten Typs enthalten. Beide werden gemäß ihren Slang-Deklarationen gelesen. Sie verwenden kein {inputLayout}. Überprüfen Sie Feldoffsets und Elementgrößen für die kompilierte Shader-Repräsentation einschließlich Padding. Ein nicht verwalteter C#-Typ eignet sich zum Kopieren als Bytes, dies allein beweist jedoch nicht, dass er mit einem Shader-Typ übereinstimmt. Wenden Sie insbesondere nicht das dicht gepackte {float3}-Layout eines Scheitelpunkts auf jeden Shader-Puffer an."
concepts.shaders.layout.guidance: Ein Ressourcen-Handle ist ein kleiner Wert, der auf eine vorhandene Ressource verweist. Das Kopieren des Handles in einen Konstantenpuffer kopiert nicht den Inhalt der Ressource.
concepts.shaders.layout.notes: "Die entsprechende Deklaration in {computeShaderSlang} lautet:"
concepts.shaders.layout.reference: "Die Dimensionen belegen die ersten acht Bytes, gefolgt von zwei Acht-Byte-Ressourcen-Handles. Das C#-Beispiel reserviert insgesamt 256 Bytes. Diese Größe ist die vom Beispiel gewählte Speichergröße und keine Regel, dass alle Slang-Strukturen oder Konstanten-Nutzlasten 256 Bytes belegen müssen. Das Auffüllen der Gesamtgröße korrigiert auch kein Feld an einem falschen Offset."
concepts.shaders.layout.title: Scheitelpunkteingabe und Shader-Daten haben unterschiedliche Layout-Regeln
concepts.shaders.matrices.description: Der Compiler fordert zeilenweise Matrixspeicherung (row-major) an, bei der die Elemente jeder Zeile zusammenhängend gespeichert werden. Der {link} platziert drei {matrix4x4}-Werte an den Offsets 0, 64 und 128. Sein {detail} verwendet {mulVectorMatrix} in der Reihenfolge Modell, Ansicht und Projektion.
concepts.shaders.matrices.description.detail: Shader
concepts.shaders.matrices.description.link: Renderer des rotierenden Würfels
concepts.shaders.matrices.details: Die Speicherreihenfolge bestimmt, wie Matrixelemente den Speicher belegen; die Multiplikationsreihenfolge bestimmt die Transformation. Halten Sie beide Seiten konsistent. Das Hinzufügen einer Transposition ohne Überprüfung dieser beiden Optionen kann eine Nichtübereinstimmung verbergen, während eine andere eingeführt wird.
concepts.shaders.matrices.title: Matrixspeicherung und -multiplikation konsistent halten
concepts.shaders.title: Shader-Daten und Bindung
concepts.synchronization.backends.description: DirectX 12 und Vulkan kodieren Texturübergänge mit Layout- und Zugriffsinformationen. Metal hat keine Operation in der {transition}-Implementierung von Zenith.NET. Metal gruppiert aufgezeichnete Arbeiten in Render- und Compute-Encoder. Das Backend fügt Sichtbarkeitsbarrieren ein, wenn es diese Gruppen beendet, wodurch frühere Schreibvorgänge für spätere Arbeiten verfügbar werden. Explizite {barrier}-Aufrufe behandeln Abhängigkeiten wie aufeinanderfolgende Compute-Dispatches innerhalb desselben Encoders.
concepts.synchronization.backends.details: Dieser Unterschied ist wichtig, wenn eine Arbeitslast geändert wird. Im {link} folgt auf den Dispatch ein Grafik-Renderpass, der auch auf Metal eine Encoder-Grenze erzeugt. Zwei abhängige Compute-Dispatches erzeugen diese Grenze nicht allein durch Ändern des deklarierten Layouts der Textur. Behalten Sie die von der gemeinsamen API geforderten Übergänge bei und identifizieren Sie separat die Abhängigkeit zwischen den tatsächlichen erzeugenden und verbrauchenden Befehlen.
concepts.synchronization.backends.details.link: Compute-Beispiel
concepts.synchronization.backends.title: Ein Übergang ist nicht auf jedem Backend identisch
concepts.synchronization.barriers.context: "{barrierStagesAll} ist ein breiterer Gültigkeitsbereich, kein automatischer Abhängigkeitsdetektor. Wählen Sie Stufen aus, die die Arbeit tatsächlich abdecken, und verwenden Sie sie nur auf einer Warteschlange, die diese Operationen unterstützt."
concepts.synchronization.barriers.description: "Betrachten Sie zwei Compute-Dispatches: Der erste schreibt Simulationsdaten, und der zweite liest diese Daten, um den nächsten Schritt durchzuführen. Beide verwenden Speicherpuffer, sodass kein Texturlayout zu ändern ist. Fügen Sie Folgendes zwischen den Dispatches in deren Befehlspuffer ein:"
concepts.synchronization.barriers.details: Das erste Argument identifiziert die Erzeugerstufe und das zweite die Verbraucherstufe. Die Barriere stellt die entsprechende Ausführungs- und Speicherabhängigkeit auf der GPU her. Das Backend übersetzt diese Stufen in seine Ausführungs- und Speicherzugriffsregeln. Diese Barriere ändert nicht das Layout einer Textur und wartet nicht auf alle Arbeiten auf dem Gerät.
concepts.synchronization.barriers.guidance: Die {link} verwendet dieses Muster zwischen abhängigen Dispatches. Platzieren Sie eine Barriere dort, wo die Abhängigkeit auftritt. Eine Barriere, nachdem der Verbraucher bereits aufgezeichnet wurde, kann diesen Verbraucher nicht nach einem früheren Erzeuger ordnen.
concepts.synchronization.barriers.guidance.link: FluidTank-Simulation
concepts.synchronization.barriers.title: Abhängige Befehle mit einer Barriere ordnen
concepts.synchronization.dependencies.description: Identifizieren Sie für jede gemeinsam genutzte Ressource die Operation, die zuerst darauf zugreift, die nachfolgende Operation und ob einer der Zugriffe ein Schreibzugriff ist. Das zweimalige Lesen derselben Daten erfordert keine Ordnung zum Schutz ihres Inhalts, obwohl Layoutänderungen oder Präsentationen andere Anforderungen auferlegen können. Ein Schreibvorgang gefolgt von einem Lesevorgang, ein Lesevorgang gefolgt von einem Überschreiben oder zwei Schreibvorgänge können eine Abhängigkeit erfordern.
concepts.synchronization.dependencies.details: "Wählen Sie dann den Mechanismus dafür aus, wo diese Operationen ausgeführt werden:"
concepts.synchronization.dependencies.guidance: Diese Mechanismen hängen zusammen, sind aber nicht austauschbar. Das Einreichen von Befehlen in der richtigen Reihenfolge ersetzt nicht jede Speicherabhängigkeit. Ein Warten auf einer Warteschlange deklariert kein neues Texturlayout, und eine Befehlsbarriere wartet nicht auf dem aufrufenden CPU-Thread.
concepts.synchronization.dependencies.table.cpuAccess.mechanism: "{wait} auf dem relevanten Fertigstellungswert aufrufen."
concepts.synchronization.dependencies.table.cpuAccess.situation: Die CPU muss vor dem Zugriff auf oder der Freigabe von Daten warten
concepts.synchronization.dependencies.table.crossQueue.mechanism: Seinen {timelineValue} an das {submit} des verbrauchenden Befehlspuffers übergeben.
concepts.synchronization.dependencies.table.crossQueue.situation: Eine Übermittlung auf einer anderen Warteschlange erzeugt die Daten
concepts.synchronization.dependencies.table.headings.mechanism: Mechanismus
concepts.synchronization.dependencies.table.headings.situation: Situation
concepts.synchronization.dependencies.table.layoutChange.mechanism: "{commandBufferTransition} mit vorherigem und folgendem Layout."
concepts.synchronization.dependencies.table.layoutChange.situation: Eine Textur-Unterressource ändert ihre Verwendungsart
concepts.synchronization.dependencies.table.pipelineStages.mechanism: "{commandBufferBarrier} mit den Erzeuger- und Verbraucherstufen."
concepts.synchronization.dependencies.table.pipelineStages.situation: Abhängige GPU-Stufen in einem Befehlsstrom
concepts.synchronization.dependencies.title: Mit dem Erzeuger und dem Verbraucher beginnen
concepts.synchronization.description: Ein Befehl, der von einem früheren Befehl geschriebene Daten liest, hängt davon ab, dass diese Schreibvorgänge abgeschlossen und für ihn sichtbar sind. Der Schreiber ist der Erzeuger (Producer); der Leser ist der Verbraucher (Consumer). Auch die CPU benötigt einen Fertigstellungspunkt, bevor sie gemeinsame Daten liest, überschreibt oder freigibt. Zenith.NET stellt Barrieren, Texturübergänge und Zeitleisten für diese unterschiedlichen Abhängigkeiten bereit.
concepts.synchronization.layouts.context: "{undefined} bedeutet, dass die vorherigen Inhalte nicht beibehalten werden müssen. Es eignet sich für ein neues Bild oder ein Attachment, das vollständig gelöscht wird. Es ist keine Möglichkeit, die Nachverfolgung des Layouts eines Bildes zu vermeiden, dessen Inhalte geladen, abgetastet oder akkumuliert werden sollen."
concepts.synchronization.layouts.description: "Verwendungs-Flags beschreiben, welche Rollen eine Textur unterstützt. {textureLayout} beschreibt, wie auf eine bestimmte Unterressource für eine Operation zugegriffen wird. Eine Unterressource ist ein ausgewählter Mip-Level und Array-Layer. Das Ändern ihres Layouts bereitet diesen Zugriff vor; es konvertiert die Textur nicht in ein anderes Pixelformat. Das Compute-Beispiel schreibt beispielsweise eine Ausgabetextur im Layout {storage} und tastet sie dann in einem Grafikpass ab. Zwischen diesen Verwendungen zeichnet es Folgendes auf:"
concepts.synchronization.layouts.details: Dieses Fragment setzt voraus, dass {outputTexture} mit der Nutzung {sampledStorage} erstellt wurde und sich seine ausgewählte Unterressource im Layout {storage} befindet. {default} wählt Mip-Level 0 und Array-Layer 0 aus. Die Operation überführt nicht jeden Mip-Level oder Layer einer Textur.
concepts.synchronization.layouts.guidance: Die Anwendung stellt das vorherige Layout bereit. {transition} führt keinen für die Anwendung sichtbaren Layout-Tracker und leitet diesen Wert nicht aus früheren Befehlen ab. Verfolgen Sie das Layout überall dort nach, wo eine Ressource zwischen Rendering-Stufen übergeben wird.
concepts.synchronization.layouts.title: Das Layout jeder Textur-Unterressource nachverfolgen
concepts.synchronization.readback.description: "{isCompleted} fragt nur ab, ob die GPU-Zeitleiste einen Wert erreicht hat. Es fordert nicht selbst Befehlspuffer zurück und kopiert keine zwischengespeicherten Downloads in den Zielzeiger der Anwendung."
concepts.synchronization.readback.details: "{commandBufferDownload} zeichnet zunächst eine Kopie in den internen Rücklesespeicher auf. Beim Zurücksetzen des abgeschlossenen Befehlspuffers zur Wiederverwendung werden die Daten per CPU-Kopie an den angegebenen Zeiger übertragen. Halten Sie das Ziel gültig und verwalteten Speicher fixiert, bis {wait} für die Download-Übermittlung zurückkehrt. Erst danach dürfen Sie die Daten lesen oder den Speicher freigeben. Das Warten auf eine spätere Übermittlung einer anderen Warteschlange fragt die zuständige Warteschlange des Downloads nicht selbst ab."
concepts.synchronization.readback.guidance: Aus diesem Grund reicht das Abfragen von {isCompleted} und das sofortige Lesen eines asynchronen Download-Ziels nicht aus. {link} behandelt die direkten Kopier- und gestuften Transferpfade.
concepts.synchronization.readback.guidance.link: Ressourcenverwaltung
concepts.synchronization.readback.title: GPU-Fertigstellung und heruntergeladene CPU-Daten sind getrennte Schritte
concepts.synchronization.reuse.description: Für einen ersten Renderer ist ein sofortiges Warten nach jedem Frame unkompliziert. Um Arbeiten zu überlappen, weisen Sie ausstehenden Frames separate veränderliche Daten zu und behalten Sie den Fertigstellungswert der letzten Verwendung jedes Frames bei. Schließen Sie vor dem Aktualisieren eines Konstantenpuffers, dem Ersetzen einer Textur oder dem Freigeben einer Pipeline jeden ausstehenden Zugriff auf die betroffene Ressource ab.
concepts.synchronization.reuse.details: Stoppen Sie bei Größenänderungen oder beim Herunterfahren neue Verwendungen, bevor Sie auf alte warten. {swapChainResize}, Ressourcenfreigabe und Kontextfreigabe dienen nicht als allgemeine Warteoperationen für Anwendungsarbeiten. Das Dreieck kann die Größe zwischen Callbacks sicher anpassen, da jeder vorherige Frame seine Übermittlung bereits abgeschlossen hat.
concepts.synchronization.reuse.guidance: Das aktuelle {swapChainPresent} signalisiert und wartet nach seiner Präsentationsoperation ebenfalls auf der Grafikwarteschlange. Das Entfernen des expliziten Übermittlungswartens des Dreiecks stellt daher für sich allein noch keine überlappende Präsentationsschleife her. Ein Warten auf der Grafikwarteschlange sagt zudem nichts über unabhängige Arbeiten aus, die noch auf einer anderen Warteschlange laufen.
concepts.synchronization.reuse.title: Daten erst nach ihrem letzten Zugriff wiederverwenden
concepts.synchronization.timelines.context: "Bevor die CPU diese Ressourcen liest, überschreibt oder freigibt, warten Sie auf deren letzte Verwendung:"
concepts.synchronization.timelines.description: Eine Zeitleiste verfolgt die Fertigstellung auf einer Warteschlange anhand aufsteigender Werte. {submit} gibt einen {timelineValue} zurück, der diese Zeitleiste und den mit der Übermittlung verknüpften Wert enthält. Fertigstellungswerte aus verschiedenen Zeitleisten sind nicht allein anhand ihrer numerischen {value}-Felder vergleichbar.
concepts.synchronization.timelines.details: "Angenommen, {producer} und {consumer} sind bereits aufgezeichnete Befehlspuffer aus zwei Warteschlangen desselben Kontexts. Der Erzeuger schreibt Daten, die der Verbraucher verwendet. Reichen Sie sie wie folgt ein:"
concepts.synchronization.timelines.guidance: Das Übergeben des erzeugten Werts veranlasst die verbrauchende Warteschlange, auf der GPU darauf zu warten. Die CPU ruft hier nicht {producedWait} auf. Halten Sie die gemeinsam genutzten Ressourcen gültig, bis {consumed} abgeschlossen ist, und zeichnen Sie alle vom Verbraucher benötigten Texturlayoutänderungen auf.
concepts.synchronization.timelines.notes: "{wait} wartet auf diesen Zeitleistenwert und prüft dann die besitzende Warteschlange auf abgeschlossene Übermittlungen. Fertige Befehlspuffer werden zur Wiederverwendung zurückgesetzt, und ihre zwischengespeicherten Downloads werden in die bereitgestellten CPU-Ziele kopiert. {queueTimelineSignal} kann auch einen Fertigstellungspunkt nach bereits an diese Warteschlange übermittelter Arbeit einreihen. Das Aufrufen von {signal} bedeutet nicht, dass die GPU den Punkt bereits erreicht hat."
concepts.synchronization.timelines.title: Eine Zeitleiste für Fertigstellung und Warteschlangenübergaben verwenden
concepts.synchronization.title: Synchronisation
