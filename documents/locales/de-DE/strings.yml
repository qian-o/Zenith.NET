samples.cube.description: Fügt indexiertes Zeichnen, Modell-, Ansichts- und Projektionsmatrizen in einem Konstantenpuffer sowie Tiefentests hinzu. Die Tiefentextur wird bei Größenänderungen neu erstellt. Nutzen Sie dieses Beispiel beim Übergang von Clip-Space-Geometrie zu einem transformierten Objekt; der Renderer verwendet ein {d32FloatS8UInt}-Tiefen-/Stencil-Attachment.
