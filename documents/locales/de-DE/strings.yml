concepts.resources.textureUsages.table.storage.role: 'Texturdaten, auf die Shader über eine Storage-Textur-Bindung lesend oder schreibend zugreifen.'
concepts.resources.textureUsages.table.transferDst.role: 'Zielbildspeicher für eine GPU-Kopie.'
concepts.resources.textureUsages.table.transferSrc.role: 'Quellbilddaten für eine GPU-Kopie.'
concepts.resources.textureUsages.title: Texturnutzungen
concepts.resources.title: Ressourcenverwaltung
concepts.resources.transfers.context: 'Ein Download kopiert GPU-Daten zunächst in einen internen Rücklesespeicher. Wenn die Bibliothek den abgeschlossenen Befehlspuffer zur Wiederverwendung zurücknimmt, kopiert sie die Daten an das bereitgestellte CPU-Ziel. Ein Aufruf von {wait} auf dem Abschlusswert der Download-Einreichung beendet beide Schritte. Bis zur Rückkehr muss der Zielspeicher erhalten und verwalteter Speicher fixiert bleiben.'
concepts.resources.transfers.description: 'Uploads kopieren CPU-Daten in eine GPU-Ressource, Downloads kopieren Ressourcendaten in CPU-Speicher. Die Methoden auf Puffern und Texturen schließen diesen Transfer vor ihrer Rückkehr ab:'
concepts.resources.transfers.details: 'Stellen Sie vor diesen Aufrufen die erforderlichen Abhängigkeiten zu Zugriffen auf anderen Warteschlangen her. Eine Warteoperation innerhalb der Methode deckt nur ihren eigenen Transfer ab; sie stellt keine Abhängigkeit zu einer anderen Warteschlange her. Bei direktem Zugriff auf gemappten Speicher muss der Aufrufer selbst auf GPU-Zugriffe warten, die mit dem Transfer in Konflikt stehen.'
concepts.resources.transfers.guidance: 'Mit {commandBufferUpload} oder {commandBufferDownload} lassen sich Transfers zusammen mit anderer GPU-Arbeit aufzeichnen und einreichen. Für den Quellspeicher eines Uploads und den Zielspeicher eines Downloads gelten unterschiedliche Anforderungen an die Lebensdauer:'
concepts.resources.transfers.item: 'Während des Upload-Aufrufs kopiert die Bibliothek die Quelldaten in einen temporären Upload-Speicher, den Staging-Speicher. Die GPU liest später aus diesem Zwischenspeicher. Der Quellzeiger der Anwendung wird deshalb nur bis zur Rückkehr des Aufrufs benötigt.'
concepts.resources.transfers.notes: 'Bei Texturtransfers bezeichnet der Zeilen-Stride den Byte-Abstand zwischen aufeinanderfolgenden Zeilen der CPU-Daten, der Schicht-Stride den Abstand zwischen Tiefenschichten. Mithilfe dieser Werte kopiert der Transfer Daten zwischen CPU-Speicher und GPU-Textur. Warum GPU-Abschluss und Bereitstellung am Download-Ziel getrennte Schritte sind, erläutert {link}.'
concepts.resources.transfers.notes.link: Synchronisation
concepts.resources.transfers.table.bufferDownload.transfer: 'Kopiert bei {cpuReadOnly} direkt aus dem gemappten Speicher. Andernfalls reicht die Methode den Download bei der Transferwarteschlange ein und wartet auf dessen Abschluss.'
concepts.resources.transfers.table.bufferUpload.transfer: 'Kopiert bei {cpuWriteOnly} direkt in den gemappten Speicher. Andernfalls reicht die Methode den Upload bei der Transferwarteschlange ein und wartet auf dessen Abschluss.'
concepts.resources.transfers.table.headings.method: Methode
concepts.resources.transfers.table.headings.transfer: 'Übertragungsverhalten'
concepts.resources.transfers.table.textureTransfers.method: '{textureUpload} / {textureDownload}'
concepts.resources.transfers.table.textureTransfers.transfer: 'Reicht die Kopie und ihre Texturübergänge bei der Grafikwarteschlange ein und wartet auf den Abschluss. Die ausgewählte Unterressource bleibt im angeforderten abschließenden Layout.'
concepts.resources.transfers.title: 'Sofortige und aufgezeichnete Übertragungen'
concepts.resources.usages.description: '{bufferUsages} und {textureUsages} sind Flag-Enums für die vorgesehenen Ressourcenrollen. Sie werden {bufferDescUsages} beziehungsweise {textureDescUsages} zugewiesen. Für mehrere Rollen lassen sich die benötigten Member mit {value} kombinieren.'
concepts.resources.usages.title: 'Ressourcennutzungen'
concepts.resources.views.description: 'Eine {bufferView} beschreibt einen Pufferbereich und die Interpretation seiner Daten. Eine {textureView} wählt einen Unterressourcenbereich sowie einen kompatiblen Texturtyp und ein passendes Format. Beide beziehen sich auf vorhandenen Speicher mit den bei seiner Erstellung angegebenen Nutzungen. Ansichtsbereiche beschreiben den Zugriff, gewährleisten aber keine einheitliche shaderseitige Bereichsprüfung über alle Backends hinweg.'
concepts.resources.views.details: 'Der eigene Handle einer Ressource stellt ihre Standardansicht bereit. Erstellen Sie eine separate Ansicht, wenn ein anderer Bereich oder eine andere kompatible Interpretation benötigt wird. Ansicht und zugrunde liegende Ressource müssen bis zum Ende ihrer GPU-Nutzung erhalten bleiben; ein Ressourcenhandle hält keines dieser Objekte am Leben. Wird eines ersetzt, aktualisieren Sie alle Konstanten mit dem bisherigen {link}.'
concepts.resources.views.details.link: 'Ressourcenhandle'
concepts.resources.views.title: 'Ansichten und zugrunde liegende Ressourcen'
concepts.shaders.binding.context: 'Im Compute-Beispiel erhält {input} den Wert {inputTextureSampledHandle} und {output} den Wert {outputTextureStorageHandle}. In Slang bestimmt der Typparameter von {descriptorHandle} den Ressourcenzugriff:'
concepts.shaders.binding.description: '{setConstantBuffer} wählt einen vorhandenen Puffer und den Byte-Offset, ab dem die aktuelle Pipeline ihre Konstanten liest. Laden Sie die Parameterdaten in diesen Speicher, bevor der Shader darauf zugreift. Liest frühere GPU-Arbeit noch dieselben Bytes, muss sie vor der Aktualisierung abgeschlossen sein.'
concepts.shaders.binding.details: 'Der Befehlspuffer, die Compute-Pipeline, der mit Daten gefüllte Konstantenpuffer und die Anzahl der Threadgruppen müssen bereits vorliegen. Zeichnen Sie den Dispatch dann in dieser Reihenfolge auf. Wählen Sie zuerst die Pipeline, da die Konstantenpufferbindung für diese Pipeline gilt:'
concepts.shaders.binding.guidance: 'Hier zeichnet {commandBuffer} einen Dispatch mit {computePipeline} und den Parametern aus {constantBuffer} auf. Der Puffer benötigt die Nutzung {bufferUsagesConstant}; Offset 0 wählt seinen Anfang. Teilen sich mehrere Konstantendatensätze einen Puffer, muss jeder Anfangsoffset zusätzlich die Bindungsausrichtung des Backends erfüllen. Diese Anforderung gilt unabhängig von der Feldanordnung innerhalb des Datensatzes.'
concepts.shaders.binding.notes: '{resourceHandle} enthält zwei 32-Bit-Felder, deren Interpretation vom Backend abhängt. Die Werte gelten nur innerhalb des Kontexts, in dem die Ressource erstellt wurde.'
concepts.shaders.binding.reference: 'Ressource und zugehörige Ansicht müssen bis zum Abschluss des letzten Shader-Zugriffs erhalten bleiben. Ihr Ersatz erfordert eine Aktualisierung der Konstanten mit alten Handles. Die Besitzregeln erläutert {link}.'
concepts.shaders.binding.reference.link: Ressourcenverwaltung
concepts.shaders.binding.table.bufferStorageReadOnlyHandle.access: 'Lesen strukturierter Elemente des im Shader verwendeten Datentyps {t}'
concepts.shaders.binding.table.bufferStorageReadWriteHandle.access: 'Lesen und Schreiben strukturierter Elemente des im Shader verwendeten Datentyps {t}'
concepts.shaders.binding.table.headings.access: Beabsichtigter Zugriff
concepts.shaders.binding.table.headings.cHandle: 'C#-Handle'
concepts.shaders.binding.table.headings.slangFieldType: Slang-Feldtyp
concepts.shaders.binding.table.samplerHandle.access: 'Zustand für die Texturabtastung'
concepts.shaders.binding.table.textureSampledHandle.access: 'Lesen von Texturdaten'
concepts.shaders.binding.table.textureStorageHandle.access: 'Lese- und Schreibzugriff auf Speichertexturen'
concepts.shaders.binding.title: 'Konstantenpuffer und Ressourcenhandles'
concepts.shaders.compilation.description: '{zenithCompiler} kompiliert einen benannten Slang-Einstiegspunkt zu einer {shaderDesc}. Die Eigenschaft {graphicsApi} bestimmt das Ziel: DXIL für DirectX 12, eine Metal-Bibliothek für Metal oder SPIR-V für Vulkan.'
concepts.shaders.compilation.details: 'Mit einem bereits erstellten Grafikkontext namens {context} wird der Dreieck-Shader aus der Kopie neben der ausführbaren Datei kompiliert:'
concepts.shaders.compilation.guidance: 'Der Einstiegspunktname {vSMain} muss mit der Deklaration in der Shader-Datei übereinstimmen. Kompilieren Sie Shader und erstellen Sie Pipelines während der Initialisierung; beim Rendering werden die Pipelines wiederverwendet. Nach Abschluss der Pipeline-Erstellung dürfen die Shader-Objekte freigegeben werden, wie im Tutorial {link} gezeigt.'
concepts.shaders.compilation.guidance.link: Erstes Dreieck
concepts.shaders.compilation.title: 'Shader-Kompilierung'
concepts.shaders.description: 'C#- und Slang-Deklarationen müssen darin übereinstimmen, wo Werte gespeichert werden und wie der Shader darauf zugreift. Vertex-Eingabelayouts beschreiben Vertexattribute, Shader-Pufferdeklarationen beschreiben Parameter und Arrays, und Ressourcenhandles identifizieren die vom Shader verwendeten Ressourcen.'
concepts.shaders.dispatch.description: '{dispatch} gibt die Anzahl der auszuführenden Threadgruppen an. Das Compute-Beispiel deklariert {numthreads}, sodass jede Gruppe 16 × 16 Threads enthält. Teilen Sie Breite und Höhe des Bildes jeweils durch 16 und runden Sie auf, um es vollständig abzudecken: Ein Bild mit 17 × 19 Pixeln benötigt 2 × 2 Gruppen. Der Shader prüft die Koordinaten jedes Threads und überspringt Positionen außerhalb des Bildes.'
concepts.shaders.dispatch.details: 'Die deklarierte Gruppengröße ist über {shaderDescThreadGroupSize} verfügbar und kann zur Berechnung der an {dispatch} übergebenen Gruppenanzahl dienen. {computeShaderRendererCs} zeigt die vollständige Berechnung. Für Zugriffe auf das erzeugte Bild gelten anschließend die in {link} beschriebenen Anforderungen.'
concepts.shaders.dispatch.details.link: Synchronisation
concepts.shaders.dispatch.title: 'Threadgruppen'
concepts.shaders.layout.context: 'Die {link} zeigen diese Anordnung anhand von Bildabmessungen und zwei Texturhandles. Explizite Offsets legen den Beginn jedes Feldes fest. Die Deklaration verwendet {systemRuntimeInteropServices} und {zenithNET}:'
concepts.shaders.layout.context.link: 'C#-Konstanten des Compute-Beispiels'
concepts.shaders.layout.description: 'Für Vertexeingaben beschreibt {inputLayout} das Format, den Offset und die Semantik jedes Attributs sowie den Stride zwischen Vertices. Beim Dreieck folgt auf eine {float3}-Position eine {float4}-Farbe. Die Farbe beginnt am Byte-Offset 12; jeder Vertex belegt 28 Bytes. {inputLayoutAdd} berechnet diese dicht gepackte Anordnung aus den Elementformaten. Enthält die C#-Struktur Auffüllungen, müssen Offsets und Stride diese berücksichtigen.'
concepts.shaders.layout.details: 'Konstantenpuffer enthalten Shader-Parameter, strukturierte Puffer Arrays typisierter Elemente. Ihre Anordnung folgt den Slang-Deklarationen und nicht {inputLayout}. Stimmen Sie C#-Feldoffsets, Elementgrößen und Auffüllungen mit dem kompilierten Shader-Layout ab. Ein nicht verwalteter C#-Typ lässt sich als Bytes kopieren, doch seine Speicheranordnung entspricht nicht zwangsläufig dem Shader-Layout. Ein im Vertex dicht gepacktes {float3} kann in einem Shader-Puffer eine andere Ausrichtung benötigen.'
concepts.shaders.layout.guidance: 'Shader-Parameter können neben gewöhnlichen Werten auch Ressourcenhandles enthalten. Ein Handle bezeichnet bereits vorhandenen Speicher. Wird er in einen Konstantenpuffer kopiert, werden deshalb nicht die Inhalte der Ressource mitkopiert.'
concepts.shaders.layout.notes: 'Die zugehörige Deklaration in {computeShaderSlang} lautet:'
concepts.shaders.layout.reference: 'Die beiden Abmessungen belegen die ersten acht Bytes; darauf folgen zwei Handles mit je acht Bytes. Das C#-Beispiel reserviert insgesamt 256 Bytes für den Datensatz. Die Größe anderer Datensätze ist anhand ihrer eigenen Felder sowie der benötigten Anordnung und Ausrichtung zu bestimmen.'
concepts.shaders.layout.title: 'Datenlayout'
concepts.shaders.matrices.description: 'Der Compiler wählt zeilenweise Matrixspeicherung mit zusammenhängenden Zeilen. Der {link} speichert drei {matrix4x4}-Werte an den Byte-Offsets 0, 64 und 128. Sein {detail} führt {mulVectorMatrix} in Modell-, View- und Projektionsreihenfolge aus.'
concepts.shaders.matrices.description.detail: Shader
concepts.shaders.matrices.description.link: Renderer des rotierenden Würfels
concepts.shaders.matrices.details: 'Die Speicherreihenfolge bestimmt die Anordnung der Matrixelemente; die Multiplikationsreihenfolge bestimmt die Transformation. C# und Slang müssen aufeinander abgestimmte Konventionen verwenden.'
concepts.shaders.matrices.title: 'Matrixkonventionen'
concepts.shaders.title: Shader-Daten und Bindung
concepts.synchronization.backends.description: 'DirectX 12 und Vulkan setzen Texturübergänge als Layout- und Zugriffsänderungen um. Für Metal führt die Implementierung von {transition} in Zenith.NET keine entsprechende Operation aus. Das Metal-Backend fasst Befehle stattdessen in Render- und Compute-Encodern zusammen und fügt beim Ende eines Encoders Sichtbarkeitsbarrieren ein. Abhängige Operationen innerhalb desselben Encoders, etwa aufeinanderfolgende Compute-Dispatches, verwenden explizite Aufrufe von {barrier}.'
concepts.synchronization.backends.details: 'Im {link} beendet der Beginn des Grafik-Renderpasses den Compute-Encoder und macht dessen Ausgabe für die Grafikbefehle sichtbar. Zwei aufeinanderfolgende Compute-Dispatches bleiben dagegen im selben Encoder. Ihre Abhängigkeit benötigt deshalb eine Barriere, auch wenn dazwischen ein Texturübergang aufgezeichnet wird. Portable Befehlsfolgen berücksichtigen daher sowohl Zugriffsabhängigkeiten als auch Texturlayouts.'
concepts.synchronization.backends.details.link: Compute-Beispiel
concepts.synchronization.backends.title: 'Backend-Verhalten'
concepts.synchronization.barriers.context: 'Wählen Sie Stufen, die die relevanten Zugriffe umfassen und von der Warteschlange unterstützt werden. {barrierStagesAll} schließt alle unterstützten Stufen ein. Beschränken Sie die Auswahl, wenn die Abhängigkeit nur einen Teil davon betrifft.'
concepts.synchronization.barriers.description: 'Angenommen, zwei Compute-Dispatches stehen im selben Befehlspuffer: Der erste schreibt Simulationsdaten, der zweite liest sie. Eine Barriere dazwischen stellt sicher, dass der zweite Dispatch die abgeschlossenen Schreibvorgänge sieht. Bei einem Speicherpuffer genügt es, die Zugriffe zu ordnen; ein Texturlayoutübergang ist nicht erforderlich:'
concepts.synchronization.barriers.details: 'Das erste Argument benennt die Stufen, die die Daten erzeugt haben; das zweite die Stufen, die sie verwenden werden. Gemeinsam beschreiben sie die benötigte Ausführungsreihenfolge und Speichersichtbarkeit zwischen den beiden Dispatches.'
concepts.synchronization.barriers.guidance: 'Die {link} verwendet dieses Muster zwischen Simulationsschritten. Jede Barriere steht nach dem Dispatch, der die Daten erzeugt, und vor dem Dispatch, der sie verwendet.'
concepts.synchronization.barriers.guidance.link: FluidTank-Simulation
concepts.synchronization.barriers.title: 'Pipeline-Barrieren'
concepts.synchronization.dependencies.description: 'Ermitteln Sie für jede Ressource, welche Zugriffe dieselben Daten betreffen. Sobald einer davon schreibt, muss die benötigte Reihenfolge erhalten bleiben. Zwei Lesezugriffe stehen nicht im Konflikt; Anforderungen an Texturlayout und Präsentation gelten dennoch. Auch CPU-Aktualisierungen und Ressourcenfreigaben müssen warten, bis die GPU den betroffenen Speicher nicht mehr verwendet.'
concepts.synchronization.dependencies.details: 'Der Mechanismus richtet sich nach dem Ausführungsort der Operationen:'
concepts.synchronization.dependencies.guidance: 'Eine Aufgabe kann mehrere Mechanismen benötigen. Stammt eine Textur etwa aus einer anderen Warteschlange, sind sowohl eine Einreichungsabhängigkeit als auch das passende Layout für den nächsten Zugriff erforderlich. Die CPU muss dafür nur blockiert werden, wenn sie selbst auf die Daten zugreifen oder deren Speicher freigeben soll.'
concepts.synchronization.dependencies.table.cpuAccess.mechanism: '{wait} auf dem relevanten Abschlusswert aufrufen.'
concepts.synchronization.dependencies.table.cpuAccess.situation: 'CPU-Zugriff oder Ressourcenfreigabe erfordert den Abschluss der GPU-Arbeit'
concepts.synchronization.dependencies.table.crossQueue.mechanism: 'Den {timelineValue} der erzeugenden Einreichung an {submit} der weiterverarbeitenden Einreichung übergeben.'
concepts.synchronization.dependencies.table.crossQueue.situation: 'Eine Warteschlange verwendet Daten aus einer anderen Warteschlange'
concepts.synchronization.dependencies.table.headings.mechanism: Mechanismus
concepts.synchronization.dependencies.table.headings.situation: Situation
concepts.synchronization.dependencies.table.layoutChange.mechanism: '{commandBufferTransition} mit vorherigem und folgendem Layout.'
concepts.synchronization.dependencies.table.layoutChange.situation: Eine Textur-Unterressource ändert ihre Verwendungsart
concepts.synchronization.dependencies.table.pipelineStages.mechanism: '{commandBufferBarrier} mit den Erzeuger- und Verbraucherstufen.'
concepts.synchronization.dependencies.table.pipelineStages.situation: Abhängige GPU-Stufen in einem Befehlsstrom
concepts.synchronization.dependencies.title: 'Zugriffsabhängigkeiten'
concepts.synchronization.description: 'Synchronisation legt die Reihenfolge von Zugriffen auf gemeinsam verwendete Daten fest und stellt sicher, dass spätere Operationen die benötigten Ergebnisse sehen. Bei einer Schreib-Lese-Abhängigkeit ist die schreibende Operation der Erzeuger und die lesende der Verbraucher. Barrieren und Texturübergänge koordinieren GPU-Zugriffe; Timelines verbinden Einreichungen und ermöglichen es der CPU, auf GPU-Arbeit zu warten.'
concepts.synchronization.layouts.context: 'Verwenden Sie {undefined} als vorheriges Layout, wenn der bestehende Inhalt verworfen werden darf, etwa bei einem neuen Bild oder einem vollständig neu gefüllten Attachment. Soll der Inhalt geladen, abgetastet oder zur Akkumulation weiterverwendet werden, ist das Layout des vorherigen Zugriffs anzugeben.'
concepts.synchronization.layouts.description: 'Die Nutzungsflags einer Textur geben ihre erlaubten Rollen an. {textureLayout} beschreibt den Zugriff auf eine bestimmte Unterressource zu einem bestimmten Zeitpunkt der Befehlsfolge. Diese Unterressource wird durch Mip-Level und Array-Layer bestimmt. Ändert sich der Zugriff, zeichnen Sie einen Übergang auf. Das Compute-Beispiel schreibt etwa in eine Ausgabetextur mit dem Layout {storage} und bereitet sie anschließend für die Abtastung in einem Grafikpass vor:'
concepts.synchronization.layouts.details: '{outputTexture} wurde mit {sampledStorage} erstellt; die gewählte Unterressource liegt in {storage}. {default} bezeichnet Mip-Level 0 und Array-Layer 0. Andere Level und Layer bleiben unverändert.'
concepts.synchronization.layouts.guidance: 'Geben Sie bei {transition} das Layout der vorherigen Unterressourcennutzung an. Die Anwendung verfolgt diesen Zustand beim Aufzeichnen der Befehle und bei der Übergabe von Texturen zwischen Rendering-Stufen.'
concepts.synchronization.layouts.title: 'Texturlayouts'
concepts.synchronization.readback.description: '{isCompleted} meldet den GPU-Abschluss. Bei einem aufgezeichneten Download steht danach noch ein Schritt aus: die Kopie aus dem internen Rücklesespeicher in den Zielspeicher der Anwendung.'
concepts.synchronization.readback.details: '{commandBufferDownload} zeichnet die GPU-Kopie in diesen internen Speicher auf. Nach Abschluss der Einreichung führt die Bibliothek die CPU-Kopie aus, während sie den fertigen Befehlspuffer zurücknimmt. {wait} auf dem Abschlusswert der Download-Einreichung wartet auf die GPU und verarbeitet die abgeschlossenen Puffer dieser Warteschlange. Dadurch werden beide Schritte abgeschlossen. Bis zur Rückkehr muss der Zielspeicher erhalten und verwalteter Speicher fixiert bleiben.'
concepts.synchronization.readback.guidance: 'Allein das Abfragen von {isCompleted} führt die abschließende CPU-Kopie nicht aus. Auch das Warten auf eine andere Warteschlange nimmt die abgeschlossenen Puffer der Download-Warteschlange nicht zurück. Wann Uploads und Downloads direkt auf Speicher zugreifen oder einen Zwischenspeicher nutzen, beschreibt {link}.'
concepts.synchronization.readback.guidance.link: Ressourcenverwaltung
concepts.synchronization.readback.title: 'Abschluss des Rücklesens'
concepts.synchronization.reuse.description: 'Das Dreieck wartet auf den Abschluss jedes Frames, bevor es dessen Daten wiederverwendet. Sollen sich Frames in der Ausführung überlappen, benötigt jeder noch laufende Frame eigenen veränderlichen Speicher. Verfolgen Sie, wann dieser Speicher wieder verfügbar ist. Vor Datenänderungen müssen noch laufende GPU-Zugriffe auf dieselben Bytes, vor einer Ressourcenfreigabe alle ausstehenden Nutzungen der Ressource abgeschlossen sein.'
concepts.synchronization.reuse.details: 'Für Größenänderungen und das Beenden gilt dieselbe Reihenfolge: neue Nutzungen stoppen, bestehende abwarten und erst dann Ressourcen ersetzen oder freigeben. Halten Sie dies vor {swapChainResize} sowie vor der Freigabe von Ressourcen oder Kontext ein. Da das Dreieck jeden Frame abwartet, kann es die Größe zwischen den Callbacks ändern.'
concepts.synchronization.reuse.guidance: '{swapChainPresent} setzt nach der Präsentation einen Abschlusspunkt in der Grafikwarteschlange und wartet darauf. Das Dreieck wartet daher auch dann bei der Präsentation, wenn die ausdrückliche Warteoperation nach der Einreichung entfällt. Unabhängig eingereichte Arbeit anderer Warteschlangen benötigt eine eigene Abschlussverfolgung.'
concepts.synchronization.reuse.title: 'Ressourcenwiederverwendung'
concepts.synchronization.timelines.context: 'Soll die CPU nach der Weiterverarbeitung das Ergebnis lesen, gemeinsame Daten überschreiben oder Ressourcen freigeben, wartet sie auf diese Einreichung:'
concepts.synchronization.timelines.description: 'Eine Timeline kennzeichnet den Warteschlangenfortschritt durch steigende Werte. {submit} liefert die Timeline und den Einreichungswert gemeinsam als {timelineValue}. Die numerischen {value}-Felder verschiedener Timelines sind nicht unmittelbar vergleichbar.'
concepts.synchronization.timelines.details: '{producer} und {consumer} seien aufgezeichnete Befehlspuffer zweier Warteschlangen desselben Kontexts; der Verbraucher nutzt die Daten des Erzeugers. Ihre Einreichung erhält diese Abhängigkeit:'
concepts.synchronization.timelines.guidance: 'Die weiterverarbeitende Warteschlange wartet vor der Ausführung ihrer Befehle auf den übergebenen Abschlusswert. Die CPU kann ohne {producedWait} weiterarbeiten. Erhalten Sie die gemeinsam verwendeten Ressourcen bis zum Abschluss von {consumed} und zeichnen Sie die für den nachfolgenden Zugriff erforderlichen Texturübergänge auf.'
concepts.synchronization.timelines.notes: 'Der Rückgabewert von {queueTimelineSignal} kann ebenso mit {wait} abgewartet oder als Abhängigkeit an eine andere Warteschlange übergeben werden. {signal} setzt diesen Abschlusspunkt hinter die zuvor eingereichte Arbeit. Die GPU erreicht ihn, sobald diese Arbeit beendet ist.'
concepts.synchronization.timelines.title: 'Timelines und Warteschlangenabhängigkeiten'
concepts.synchronization.title: Synchronisation
