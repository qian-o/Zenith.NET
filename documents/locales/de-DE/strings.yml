concepts.execution.ownership.table.queues.ownership: Der Kontext und die Warteschlangen verwalten sie.
concepts.execution.ownership.table.swapChainDrawable.ownership: Die Swapchain verwaltet sie.
concepts.execution.ownership.title: Besitz von der GPU-Fertigstellung trennen
concepts.execution.pipelines.description: Eine Grafikpipeline kombiniert Shader, das Scheitelpunkteingabelayout, die Regel für das Zusammensetzen von Scheitelpunkten zu Primitiven, Attachment-Formate und den Renderzustand. Legen Sie sie fest, bevor Sie Scheitelpunkt-, Index- oder Konstantendaten binden und Zeichenbefehle ausgeben. Ihre Attachment-Formate und die Sample-Anzahl müssen mit den Attachments des Renderpasses übereinstimmen.
concepts.execution.pipelines.details: Eine Compute-Pipeline stellt den Shader-Einstiegspunkt für einen Dispatch bereit, der Gruppen von GPU-Threads startet. Legen Sie sie und ihre Konstanten vor dem Dispatching fest. Compute-Dispatches gehören außerhalb von Grafik-Renderpässen. Das Ändern der Pipeline ändert die Art und Weise, wie nachfolgende Befehle ihre Eingaben interpretieren; binden Sie die für die ausgewählte Pipeline erforderlichen Daten vor deren Verwendung.
concepts.execution.pipelines.guidance: Der {link} zeigt die vollständige Grafiksequenz. Das {detail} zeichnet einen Dispatch gefolgt von einem Grafikpass auf, der das Ergebnis anzeigt.
concepts.execution.pipelines.guidance.detail: Compute-Beispiel
concepts.execution.pipelines.guidance.link: Render-Callback des Dreiecks
concepts.execution.pipelines.title: Eine Pipeline bestimmt, wie Befehle Daten interpretieren
concepts.execution.queues.description: Beginnen Sie mit {graphicsQueue}, wenn ein Frame Zeichnen, Compute und Kopiervorgänge kombiniert. Wenn abhängige Arbeiten auf einer einzigen Warteschlange verbleiben, lässt sich deren Reihenfolge leichter nachvollziehen.
concepts.execution.queues.details: Eine Warteschlange nimmt Batches von Befehlen zur Ausführung entgegen. Getrennte Warteschlangen entsprechen nicht zwangsläufig getrennten Hardware-Engines, sodass ihre Arbeiten möglicherweise nicht gleichzeitig ausgeführt werden. Verwenden Sie eine andere Warteschlange, wenn die Arbeitslast von Überlappung profitieren kann, und fügen Sie eine explizite Abhängigkeit hinzu, wenn eine Warteschlange die Ergebnisse einer anderen Warteschlange verbraucht.
concepts.execution.queues.guidance: Wenn spätere Befehle von früheren Schreibvorgängen abhängen, muss die Anwendung auch sicherstellen, dass diese Schreibvorgänge für die späteren Befehle verfügbar sind. Das Übermitteln beider Befehlspuffer an dieselbe Warteschlange stellt nicht automatisch jede solche Abhängigkeit her. Befehle können unterschiedliche GPU-Stufen verwenden, und spätere Zugriffe erfordern möglicherweise eine Barriere oder einen Texturübergang. {link} erläutert den Unterschied zwischen Übermittlungsreihenfolge und Ressourcensichtbarkeit.
concepts.execution.queues.guidance.link: Synchronisation
concepts.execution.queues.table.computeQueue.workToRecord: Compute-Dispatches und kompatible Transferarbeiten, ohne Grafik-Renderpässe.
concepts.execution.queues.table.graphicsQueue.workToRecord: Renderpässe und Zeichnen sowie vom Frame verwendete Compute- und Transferoperationen.
concepts.execution.queues.table.headings.queue: Warteschlange
concepts.execution.queues.table.headings.workToRecord: Aufzuzeichnende Arbeit
concepts.execution.queues.table.transferQueue.workToRecord: Upload-, Download- und Kopierarbeiten, ohne Zeichnen oder Compute-Dispatches.
concepts.execution.queues.title: Wählen Sie eine Warteschlange für die auszuführende Arbeit
concepts.execution.recording.context: Die Warteschlange fragt die Fertigstellung ab und recycelt fertige Befehlspuffer. Rufen Sie {queueCommandBuffer} für jede neue Aufzeichnung auf; dies kann eine recycelte Instanz zurückgeben. Geben Sie einen geliehenen Befehlspuffer nicht frei, reichen Sie ihn nicht zweimal ein und zeichnen Sie nach dem Einreichen nicht weiter darin auf. Zeichnen Sie einen bestimmten Befehlspuffer jeweils nur von einem Thread aus auf; die interne Sperre der Warteschlange schützt nicht vor gleichzeitigen Bearbeitungen eines Befehlspuffers.
concepts.execution.recording.description: "{queueCommandBuffer} gibt einen {commandBuffer} zurück, dessen Aufzeichnung bereits begonnen hat. Zeichnen Sie die Befehle und deren Abhängigkeiten auf und rufen Sie dann einmal {submit} auf. Das Einreichen beendet die Aufzeichnung und gibt einen {timelineValue} zurück, der einen Fertigstellungspunkt auf dieser Warteschlange identifiziert."
concepts.execution.recording.details: "Nachdem beispielsweise ein Frame in {commandBuffer} aufgezeichnet wurde, reicht das Dreieck diesen ein und wartet auf die Fertigstellung mit:"
concepts.execution.recording.guidance: "{submit} plant die Arbeit ein; {wait} hindert die CPU daran fortzufahren, bis diese Übermittlung abgeschlossen ist. Das Aufzeichnen eines Zeichenbefehls, das Beenden eines Renderpasses und das Einreichen eines Befehlspuffers sind getrennte Operationen. Weder das Aufzeichnen des Zeichenbefehls noch das Beenden des Passes wartet auf die GPU."
concepts.execution.recording.title: Aufzeichnen führt Befehle nicht aus
concepts.execution.title: Ausführungsmodell
concepts.platforms.description: Wählen Sie, ob Ihre Anwendung das native Fenster und die Frame-Schleife selbst besitzt oder ein UI-Rendering-Steuerelement verwendet. Diese Wahl bestimmt, wer die Ausgabetextur bezieht, Befehle einreicht und das Ergebnis präsentiert. Die Ausgabetextur ist die Textur, die als Ausgabe des aktuellen Frames dient. Offscreen-Grafik- und Compute-Arbeiten benötigen weder ein Fenster noch eine Swapchain.
concepts.platforms.frame.context: Fügen Sie Ihre Pipeline-Bindungen und Zeichenbefehle innerhalb dieses Passes hinzu. Beenden Sie den Pass vor der Rückgabe. Reichen Sie den bereitgestellten Befehlspuffer nicht unabhängig ein, präsentieren Sie nicht selbst und geben Sie weder den Befehlspuffer noch die Ausgabetextur frei. Wenn Ihr Handler die Ausgabetextur in einem anderen Layout verwendet, überführen Sie sie für den abschließenden Übergang des Steuerelements zurück in {colorAttachment}.
concepts.platforms.frame.description: Die Integrationen implementieren {iZenithView}. Die Anwendung stellt ihren {graphicsContext} bereit, aktualisiert Szenendaten in {updateRequested} und zeichnet das Rendering in {renderRequested} unter Verwendung von {renderEventArgs} auf.
concepts.platforms.frame.details: "Das Steuerelement steuert den Ablauf eines Frames. Es bezieht die Ausgabetextur und den Befehlspuffer, überführt die Ausgabetextur in {colorAttachment}, ruft die Handler auf und übernimmt dann die für das Framework erforderliche Einreichung und Präsentation."
concepts.platforms.frame.guidance: "Für ein initialisiertes {iZenithView} namens {view}, dem ein Kontext zugewiesen ist, zeichnet dieser Handler einen vollständigen Löschpass auf. Er erfordert {usingZenithNET}:"
concepts.platforms.frame.notes: Die Steuerelemente gehen zu Beginn jedes Frames von {undefined} aus, sodass Anwendungen sich nicht darauf verlassen können, dass vorherige Inhalte der Ausgabetextur erhalten bleiben. Löschen oder rendern Sie das erforderliche Bild in jedem Frame. Halten Sie persistente Akkumulationen oder zwischengespeichertes Rendering in einer anwendungseigenen Textur und zeigen Sie diese Textur über die Ansicht an.
concepts.platforms.frame.reference: "{zenithViewHelperDrawableFormat} liefert das Standardfarbformat der Integrationen. Überprüfen Sie die tatsächliche Ausgabetextur des Ereignisses beim Abgleich von Attachment-Formaten, Sample-Anzahlen und Abmessungen."
concepts.platforms.frame.title: In den von einem UI-Steuerelement bereitgestellten Frame aufzeichnen
concepts.platforms.integration.context: WinForms, WPF und der Windows-WinUI-Pfad erfordern Windows. MAUI-Anwendungen benötigen die Arbeitslast ihrer Zielplattform und müssen den Steuerelement-Handler mit {useZenithView} registrieren; siehe {extensionsCs}. Sowohl die Framework-Unterstützung als auch die Backend-Unterstützung müssen erfüllt sein.
concepts.platforms.integration.description: "Die Steuerelemente teilen sich die Ereignisschnittstelle, präsentieren jedoch nicht alle auf dieselbe Weise:"
concepts.platforms.integration.details: Bitmap-Rücklesen kopiert gerenderte Pixel in den CPU-Speicher, bevor die Benutzeroberfläche sie anzeigt. Die Interoperabilität über geteilte Texturen vermeidet dieses Rücklesen, kann jedoch weiterhin GPU-Kopien und Synchronisation erfordern. Die gemeinsame Schnittstelle {renderRequested} bedeutet daher nicht identische Präsentationskosten oder native Interop-Anforderungen.
concepts.platforms.integration.guidance: "Verwenden Sie das Paket für das Framework der Anwendung; zum Beispiel:"
