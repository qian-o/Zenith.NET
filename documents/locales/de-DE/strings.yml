concepts.resources.bufferUsages.table.storageReadOnly.role: 'Pufferdaten, auf die über eine schreibgeschützte Shader-Bindung zugegriffen wird.'
concepts.resources.bufferUsages.table.storageReadWrite.role: 'Pufferdaten, auf die über eine Shader-Bindung mit Lese- und Schreibzugriff zugegriffen wird.'
