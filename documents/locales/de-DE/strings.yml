### YamlMime:Resources
concepts.execution.context.description: "Ein {graphicsContext} repräsentiert ein Backend-Gerät und stellt dessen Grafik-, Compute- und Transferwarteschlangen bereit. Erstellen Sie die Puffer, Texturen, Shader und Pipelines für eine Arbeitslast über denselben Kontext. Ressourcen oder Handles aus einem anderen Kontext können nicht einfach an die Befehlspuffer dieses Kontexts gebunden werden."
concepts.execution.context.details: Wählen Sie das Backend für die Plattform und die Präsentationsoberfläche. Die API bleibt gemeinsam, aber die Geräteunterstützung spielt weiterhin eine Rolle. {capabilities} macht den Gerätenamen sowie die Flags {rayTracingSupported} und {meshShadingSupported} verfügbar. Überprüfen Sie das entsprechende Flag, bevor Sie eine optionale Arbeitslast erstellen, wie es die Beispiele {link} und {detail} tun. Diese Flags sind keine vollständige Liste von Format-, Speicher- oder Plattformbeschränkungen.
concepts.execution.context.details.detail: Mesh-Shading
concepts.execution.context.details.link: Raytracing
concepts.execution.context.title: Der Kontext verbindet Ressourcen und Warteschlangen
concepts.execution.description: Eine Zenith.NET-Anwendung erstellt GPU-Ressourcen, zeichnet Befehle auf, die diese verwenden, und reicht diese Befehle bei einer Warteschlange ein. Die CPU kann fortfahren, während die GPU die Übermittlung ausführt. Halten Sie Ressourcen gültig, bis diese Arbeit abgeschlossen ist, selbst nachdem die Aufzeichnungsaufrufe zurückgekehrt sind.
concepts.execution.ownership.description: "Hier bedeutet Besitz die Verantwortung für die Freigabe. Eine C#-Referenz hält ein verwaltetes Objekt erreichbar; sie verhindert nicht, dass ein explizites {dispose} die native Ressource zerstört. Ebenso überträgt das Einreichen eines Befehls, der einen Puffer verwendet, nicht den Besitz dieses Puffers an die Warteschlange."
concepts.execution.ownership.details: "Stoppen Sie beim Herunterfahren das Einreichen neuer Arbeit, warten Sie auf die letzten Verwendungen in jeder beteiligten Warteschlange, geben Sie die Ressourcen der Anwendung frei und anschließend den Kontext. Die Kontextfreigabe gibt dessen Warteschlangen und interne Hilfsobjekte frei; sie wartet nicht auf alle Anwendungsarbeiten und gibt nicht jede von der Anwendung erstellte Ressource frei."
concepts.execution.ownership.guidance: Wenden Sie beim Rendern dieselben Lebensdauerregeln an. Behalten Sie den Fertigstellungswert für die letzte Verwendung einer Ressource bei, damit Sie wissen, wann ihre Bytes überschrieben werden können oder die Ressource ersetzt werden kann. Siehe {link} für Ansichten und die Lebensdauer von zugrunde liegenden Ressourcen.
concepts.execution.ownership.guidance.link: Ressourcenverwaltung
concepts.execution.ownership.table.applicationResources.object: Von der Anwendung erstellte Ressourcen
concepts.execution.ownership.table.applicationResources.ownership: Die Anwendung gibt sie nach ihrer letzten GPU-Verwendung frei.
