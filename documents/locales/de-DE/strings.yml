concepts.resources.memory.table.headings.typicalRole: Typische Rolle
concepts.resources.memory.title: 'CPU-Zugriff und Speicherplatzierung'
concepts.resources.textureUsages.description: 'Transferflags geben an, ob eine Ressource als Quelle oder Ziel einer GPU-Kopie dient. Ob die CPU direkt auf ihren Speicher zugreifen kann, wird unabhängig davon durch die Speicherplatzierung festgelegt.'
concepts.resources.textureUsages.details: 'Nutzungsflags geben die vorgesehenen Rollen einer Textur an. Für den Wechsel zwischen diesen Rollen gelten die unter {link} beschriebenen Anforderungen. Außerdem muss das Gerät die gewählten Verwendungszwecke für das Texturformat unterstützen.'
concepts.resources.textureUsages.details.link: 'Layout und Synchronisation'
