concepts.platforms.title: Plattformintegration
concepts.resources.allocation.context: "Verwenden Sie zunächst über den Kontext erstellte Ressourcen, sofern Sie keinen eigenen Speicherallokator benötigen. Warten Sie bei einem Heap zunächst auf alle GPU-Arbeiten, die seine Ressourcen verwenden. Geben Sie dann die platzierten Ressourcen und erst danach den Heap selbst frei."
concepts.resources.allocation.description: "Ein {heap} stellt Speicher bereit, in dem Ressourcen an ausdrücklich gewählten Byte-Offsets platziert werden. Die Anwendung wählt diese Offsets und verfolgt, welche Bereiche belegt sind."
concepts.resources.allocation.details: "Verwenden Sie vor dem Platzieren {contextGetSizeAndAlignment} mit der genauen Puffer- oder Texturbeschreibung. Wählen Sie einen Offset, der ein Vielfaches der zurückgegebenen Ausrichtung ist, reservieren Sie die zurückgegebene Größe und halten Sie die Ressource innerhalb der Gesamtgröße des Heaps. Noch verwendete Allokationen dürfen sich nicht überlappen. Texturspeicher kann backendabhängige Auffüllung und Ausrichtung enthalten; Pixelzahl mal Bytes pro Pixel ergibt daher nicht die benötigte Allokationsgröße."
concepts.resources.allocation.guidance: "Bei platzierten Puffern muss die Speicherresidenz des Puffers mit der des Heaps übereinstimmen. Verwenden Sie GPU-only-Heaps für die hier beschriebenen gewöhnlichen GPU-Texturen. Größe und Ausrichtung sind Platzierungsanforderungen; sie garantieren nicht, dass jede Ressource auf jedem Backend in jeden Heap passt."
concepts.resources.allocation.title: Ressourcen in einem Heap platzieren, wenn Allokationskontrolle erforderlich ist
