tutorial.description: 'In diesem Tutorial entsteht aus einem leeren .NET-Konsolenprojekt eine Anwendung, die ein Fenster öffnet und ein farbiges Dreieck zeichnet.'
tutorial.details: 'Das Tutorial führt über drei überprüfbare Zwischenstände zum Ergebnis: ein leeres Fenster, eine einfarbige Fläche und schließlich das farbige Dreieck. Führen Sie die Anwendung nach jedem dieser Schritte aus, bevor Sie den nächsten Teil ergänzen.'
tutorial.draw.context: 'Die Argumente für {draw} sind:'
tutorial.draw.description: 'Ersetzen Sie im Callback {windowRender} den Kommentar {addTheTriangleDrawCommandsHereLater} durch folgende Befehle zwischen {beginRenderPass} und {endRenderPass}:'
tutorial.draw.details: '{setPipeline} wählt Shader und Renderzustand aus. Binden Sie die Pipeline vor dem Vertexpuffer, damit ihr Eingabelayout bestimmt, wie die Vertexdaten gelesen werden.'
tutorial.draw.guidance: '{setVertexBuffer} bindet die hochgeladenen Vertexdaten ab Byte-Offset 0 an Eingabeslot 0. Dieser entspricht dem einzigen Eintrag in {inputLayouts}.'
tutorial.draw.notes: 'Behalten Sie das Füllen mit der Hintergrundfarbe am Anfang des Passes bei, damit die Fläche außerhalb des Dreiecks eine definierte Hintergrundfarbe hat.'
tutorial.draw.table.firstInstance.meaning: Instanznummerierung bei null beginnen.
tutorial.draw.table.firstVertex.meaning: 'Mit dem ersten Vertex im Puffer beginnen.'
tutorial.draw.table.headings.argument: Argument
tutorial.draw.table.headings.meaning: Bedeutung
tutorial.draw.table.headings.value: Wert
tutorial.draw.table.instanceCount.meaning: Eine Kopie des Dreiecks zeichnen.
tutorial.draw.table.vertexCount.meaning: 'Drei Vertices lesen.'
tutorial.draw.title: 'Zeichenbefehle'
tutorial.execution.context: 'Nach dem Schließen des Fensters kehrt {run} zurück, und die Ausführung wird mit der Bereinigung fortgesetzt. Da der Render-Callback bereits auf den Abschluss der Befehle jedes Frames gewartet hat, können die dafür verwendeten Ressourcen nun freigegeben werden. Nach {windowRun} steht die vollständige Bereinigung:'
tutorial.execution.description: 'Erstellen und starten Sie das Projekt {firstTriangle}.'
tutorial.execution.details: 'Auf dem dunklen Hintergrund erscheint ein Dreieck: oben rot, rechts unten grün und links unten blau. Durch Interpolation gehen die Vertexfarben im Inneren fließend ineinander über.'
tutorial.execution.guidance: 'Beim Ändern der Fenstergröße ändern sich die Pixelmaße des Bildes, während die Vertexkoordinaten gleich bleiben. Der Viewport bildet sie auf die neue Breite und Höhe ab. Das Dreieck wird deshalb gestreckt, wenn sich das Seitenverhältnis des Fensters ändert.'
tutorial.execution.notes: 'Geben Sie die Swapchain vor ihrem nativen Fenster und den Kontext nach seinen Ressourcen frei. Eingereichte Befehlspuffer werden von der Warteschlange wiederverwendet; die Ausgabetextur wird von der Swapchain verwaltet. Beide benötigen daher keinen eigenen {dispose}-Aufruf.'
tutorial.execution.title: 'Anwendung ausführen'
tutorial.frame.commands.context: 'Nach {endRenderPass} bereitet der zweite Übergang die Präsentation vor. {submit} beendet die Aufzeichnung und reicht den Befehlspuffer ein; {wait} blockiert bis zu dessen Abschluss. Danach fordert {present} die Bildanzeige an.'
tutorial.frame.commands.description: 'Ein Renderpass fasst Zeichenoperationen zusammen, die in dieselben Attachments schreiben. Hier nimmt die Ausgabetextur der Swapchain die Farbausgabe auf. {colorAttachmentClear} legt fest, dass dieses Attachment zu Beginn mit einer RGBA-Farbe gefüllt und sein Inhalt am Ende erhalten wird. {beginRenderPass} zeichnet den Beginn des Passes mit diesen Einstellungen auf.'
tutorial.frame.commands.details: 'Die Sammlung enthält ein Farb-Attachment. {null} gibt an, dass der Pass kein Tiefen-/Stencil-Attachment verwendet.'
tutorial.frame.commands.guidance: '{beginRenderPass} setzt Viewport und Scissor auf die gesamte Attachment-Fläche. Der Viewport bildet Renderkoordinaten auf Pixelpositionen ab; der Scissor begrenzt den Pixelbereich, den Zeichenoperationen verändern können.'
tutorial.frame.commands.title: 'Löschen, Einreichung und Präsentation'
tutorial.frame.description: 'Füllen Sie das Fenster zunächst mit einer einheitlichen Farbe. Diese Operation heißt Löschen. Erscheint die Farbe, funktionieren Befehlseinreichung und Präsentation. Danach fügen Sie die Vertices und Shader des Dreiecks hinzu.'
tutorial.frame.details: 'Silk.NET ruft den Render-Callback auf, sobald ein Frame ansteht. Registrieren Sie den Callback {emphasis}:'
tutorial.frame.details.emphasis: vor {windowRun}
tutorial.frame.target.description: 'Eine Befehlswarteschlange nimmt aufgezeichnete Arbeit zur Ausführung auf der GPU entgegen. {graphicsQueueCommandBuffer} liefert einen Befehlspuffer aus der Grafikwarteschlange, in dem die Aufzeichnung bereits läuft. Die aufgezeichneten Befehle legen die GPU-Arbeit fest; ihre Ausführung beginnt erst nach der Einreichung.'
tutorial.frame.target.details: 'Ein Texturlayout beschreibt, welchen Zugriff eine Operation benötigt. Der erste Aufruf von {transition} bereitet die Ausgabetextur als Farb-Attachment vor. {default} wählt Mip-Level 0 und Array-Layer 0, also das Basisbild dieser Textur. Da der Pass das gesamte Bild mit einer Hintergrundfarbe füllt, darf {undefined} den bisherigen Inhalt verwerfen.'
tutorial.frame.target.guidance: 'Verwenden Sie in jedem Frame die aktuelle Ausgabetextur, da die Präsentation zum nächsten Bild wechseln kann.'
tutorial.frame.target.title: Ausgabetextur vorbereiten
tutorial.frame.title: 'Der erste Frame'
tutorial.geometry.data.description: 'Fügen Sie das Vertexarray {emphasis} ein. Auch die anschließende Ressourceninitialisierung steht in der angegebenen Reihenfolge vor diesem Callback.'
tutorial.geometry.data.description.emphasis: vor {windowRender}
tutorial.geometry.data.details: 'Die drei Positionen bilden die obere, rechte untere und linke untere Ecke. In diesem Beispiel erstrecken sich x und y von -1 bis +1 über das Bild: 0 liegt in der Mitte, positive x-Werte zeigen nach rechts und positive y-Werte nach oben.'
tutorial.geometry.data.guidance: 'Jede Farbe hat Rot-, Grün-, Blau- und Alpha-Komponenten; Alpha ist 1. Alle drei Vertices liegen mit z = 0 in derselben Ebene.'
tutorial.geometry.data.title: 'Vertexpositionen und Farben'
tutorial.geometry.description: 'Jeder der drei Vertices besitzt eine Position und eine Farbe. Aus den Positionen ergibt sich die Form des Dreiecks; die GPU interpoliert die Farben über dessen Fläche.'
tutorial.geometry.format.description: 'Ergänzen Sie die Vertexdeklaration {emphasis}:'
tutorial.geometry.format.description.emphasis: am Ende von {programCs}, nach den Bereinigungsanweisungen
tutorial.geometry.format.details: '{layoutKindSequential} erhält die Deklarationsreihenfolge der Felder. {position} enthält drei 32-Bit-Gleitkommazahlen und beginnt am Byte-Offset 0; {color} enthält vier und beginnt am Byte-Offset 12. Ein Vertex belegt damit 28 Bytes. Das Eingabelayout beschreibt diese Anordnung, damit die GPU die Felder korrekt liest.'
tutorial.geometry.format.imports: 'Ergänzen Sie am Anfang von {programCs} diese using-Direktiven für die Vektortypen und das Attribut zur Festlegung des Strukturlayouts:'
tutorial.geometry.format.title: 'Vertexdarstellung'
tutorial.geometry.title: 'Vertexdaten'
tutorial.geometry.upload.context: '{fixed} verhindert, dass die Garbage Collection das Array verschiebt, solange dessen Adresse verwendet wird. Bei diesem CPU-beschreibbaren Puffer mappt {upload} den Speicher, kopiert die Daten und hebt das Mapping vor der Rückkehr auf. Das Array muss daher nur während des Aufrufs fixiert bleiben. Laden Sie die Vertices einmal bei der Initialisierung hoch und geben Sie den Puffer erst nach Abschluss des Renderings frei.'
tutorial.geometry.upload.description: 'Speichern Sie die Vertices in einem {buffer}, damit die GPU sie beim Zeichnen lesen kann. Fügen Sie Allokation und Upload direkt nach dem Array ein:'
tutorial.geometry.upload.details: 'Die Allokationsgröße beträgt {sizeofVertexVerticesLength} (drei Vertices zu 28 Bytes, also 84 Bytes), und der Stride der Beschreibung gibt die Elementgröße an. {bufferUsagesVertex} aktiviert die Bindung als Vertexpuffer, während {cpuWriteOnly} direktes Schreiben durch die CPU erlaubt.'
tutorial.geometry.upload.guidance: 'Die Allokation initialisiert den Inhalt nicht. {upload} kopiert das Array ab Ziel-Byte-Offset 0 mit dem Quellzeiger und der Bytezahl der Datenbeschreibung.'
tutorial.geometry.upload.imports: 'Ergänzen Sie {bufferAlias} bei den using-Direktiven in {programCs}, um den Puffertyp von Zenith.NET von {systemBuffer} zu unterscheiden.'
tutorial.geometry.upload.notes: 'Setzen Sie {vertexBufferDispose} direkt vor {swapChainDispose} in die Bereinigung am Ende von {programCs}.'
tutorial.geometry.upload.title: 'Pufferallokation und Upload'
tutorial.input.description: 'Ein Eingabelayout beschreibt Format, Semantik und Byte-Offset jedes Vertexattributs sowie den Byte-Stride zwischen den Vertices. Fügen Sie diesen Code nach der Shader-Erstellung ein:'
tutorial.input.details: '{inputLayoutAdd} fügt jedes Attribut unmittelbar nach dem vorherigen ein und erhöht den Stride um dessen Größe, sodass über beide Felder ein Stride von 28 Bytes entsteht:'
tutorial.input.guidance: 'Der Standardwert von {semanticIndex} ist 0 und entspricht damit {pOSITION0} und {cOLOR0} im Shader. Position und Farbe stehen gemeinsam in einem Vertexpuffer, weshalb die Pipeline ein Eingabelayout an Slot 0 verwendet. Passen Sie dieses Layout an, wenn sich Feldreihenfolge oder Auffüllung der C#-Struktur ändern.'
tutorial.input.table.headings.byteOffset: Byte-Offset
tutorial.input.table.headings.cField: 'C#-Feld'
tutorial.input.table.headings.format: Format
tutorial.input.table.headings.shaderInput: Shader-Eingabe
tutorial.input.table.vertexColor.format: '{float4} (16 Bytes)'
tutorial.input.table.vertexPosition.format: '{float3} (12 Bytes)'
tutorial.input.title: 'Vertex-Eingabelayout'
tutorial.pipeline.context: 'Shader-Objekte dürfen nach der Pipeline-Erstellung freigegeben werden. Geben Sie die Pipeline dagegen erst nach Abschluss des Renderings frei und ergänzen Sie dafür {pipelineDispose} vor {vertexBufferDispose} in der Bereinigung.'
tutorial.pipeline.description: 'Eine {graphicsPipeline} fasst Shader-Stufen, Vertex-Eingabelayout, Primitivtopologie, Attachment-Formate und Renderzustand zusammen. Erstellen Sie nach dem Eingabelayout die Pipeline:'
tutorial.pipeline.details: '{triangleList} setzt jeweils drei aufeinanderfolgende Vertices zu einem Dreieck zusammen. Das Farbformat wird aus {swapChainDescFormat} übernommen, damit es dem Renderpass-Attachment entspricht, und {count1} legt ein Sample pro Pixel fest.'
tutorial.pipeline.guidance: '{cullNone} deaktiviert das Face-Culling, sodass das Dreieck unabhängig von der Umlaufreihenfolge gezeichnet wird. {depthNone} deaktiviert Tiefentest und Tiefenschreiben, da der Pass kein Tiefen-Attachment besitzt, und {opaque} deaktiviert Blending, sodass die Fragmentfarbe den Hintergrund ersetzt.'
tutorial.pipeline.title: 'Grafikpipeline'
tutorial.presentation.title: 'Grafikkontext und Präsentation'
tutorial.project.context: 'Aktivieren Sie {emphasis} ({allowUnsafeBlocks}) in den Buildeinstellungen. Die nativen Aufrufe der Fensterhilfsklasse und der Vertexupload benötigen unsicheren Code.'
tutorial.project.context.emphasis: Unsicheren Code zulassen
tutorial.project.description: 'Erstellen Sie ein C#-Konsolenprojekt namens {firstTriangle} mit .NET 10 als Zielframework.'
tutorial.project.details: 'Fügen Sie dem Projekt die folgenden NuGet-Pakete hinzu:'
tutorial.project.guidance: '{zenithNET} liefert die gemeinsame Grafik- und Compute-API; die drei Grafik-API-Pakete implementieren sie. {zenithNETCompiler} kompiliert Slang-Shader für die gewählte API.'
tutorial.project.title: 'Projekteinrichtung'
tutorial.requirements.description: 'Sie benötigen das {emphasis} und C#-Grundkenntnisse. GPU und Treiber müssen für Ihre Plattform folgende Grafikfunktionen unterstützen:'
tutorial.requirements.description.emphasis: .NET 10 SDK
tutorial.requirements.guidance: 'Zenith.NET rendert in ein von der Anwendung bereitgestelltes natives Präsentationsziel. Silk.NET.Windowing erstellt das Fenster und verarbeitet seine Ereignisse.'
tutorial.requirements.table.headings.graphicsSupport: 'Grafikunterstützung'
tutorial.requirements.table.headings.platform: Plattform
tutorial.requirements.table.linux.graphicsSupport: 'Vulkan 1.4 mit VK_EXT_descriptor_heap'
tutorial.requirements.table.linux.platform: 'Linux (X11 oder XWayland)'
tutorial.requirements.table.macOS.graphicsSupport: Metal 4
tutorial.requirements.table.macOS.platform: macOS
tutorial.requirements.table.windows.graphicsSupport: 'DirectX 12 mit Shader Model 6.6'
tutorial.requirements.table.windows.platform: Windows
tutorial.requirements.title: 'Voraussetzungen'
tutorial.resize.context: 'Erstellen und starten Sie die Anwendung erneut. Auch beim Ändern der Fenstergröße sollte der Hintergrund das gesamte Fenster ausfüllen. Behalten Sie den Render-Callback bei; in diesem Pass wird später das Dreieck gezeichnet.'
tutorial.resize.description: 'Die Swapchain muss Änderungen der Framebuffer-Größe übernehmen. Registrieren Sie nach dem Render-Callback und vor {windowRun} einen Callback für {framebufferResize}:'
tutorial.resize.details: 'Reagieren Sie auf {link}, die in Pixeln angegeben werden, statt auf Änderungen der logischen Fenstergröße. Wird beim Minimieren eine der beiden Framebuffer-Abmessungen null, lässt der Resize-Callback die Swapchain unverändert. Auch der Render-Callback kehrt bei einer Nullgröße sofort zurück. Das Rendering wird erst fortgesetzt, wenn wieder eine nutzbare Größe vorliegt.'
tutorial.resize.details.link: Framebuffer-Größenänderungen
tutorial.resize.guidance: 'Der Render-Callback wartet vor {present}, bis die eingereichten Befehle des Frames abgeschlossen sind. Der Resize-Callback kann die Swapchain-Bilder daher ersetzen, ohne noch laufende Arbeit eines früheren Frames zu beeinträchtigen. Der Artikel {link} erläutert den Zusammenhang zwischen GPU-Abschluss und Ressourcenlebensdauer.'
tutorial.resize.guidance.link: Synchronisation
tutorial.resize.title: 'Größenänderungen'
tutorial.shaders.compilation.context: 'Mit {appContextBaseDirectory} wird die kopierte Shader-Datei aus dem Ausgabeverzeichnis der Anwendung geladen. Ihr Speicherort wird deshalb auch dann korrekt ermittelt, wenn die Anwendung aus einem anderen Arbeitsverzeichnis gestartet wird.'
tutorial.shaders.compilation.description: 'Setzen Sie für {triangleSlang} die Dateieigenschaft {emphasis} auf {detail}. Der Build kopiert die Shader-Datei damit neben die ausführbare Datei.'
tutorial.shaders.compilation.description.detail: Kopieren, wenn neuer
tutorial.shaders.compilation.description.emphasis: In Ausgabeverzeichnis kopieren
tutorial.shaders.compilation.details: 'Fügen Sie in {programCs} nach dem Vertexupload und vor dem Render-Callback die Shader-Initialisierung ein:'
tutorial.shaders.compilation.guidance: '{zenithCompiler} kompiliert den Quelltext für {contextGraphicsApi}; {createShader} erstellt aus der kompilierten Beschreibung ein Shader-Objekt. Die Einstiegspunktnamen {vSMain} und {fSMain} wählen die beiden Funktionen aus der Slang-Datei aus.'
tutorial.shaders.compilation.title: 'Shader kompilieren'
tutorial.shaders.context: '{fSInput} verbindet die beiden Shader-Stufen. Der Vertex-Shader schreibt eine Position im Clipraum nach {sVPOSITION}; daraus ermittelt die GPU den sichtbaren Teil des Dreiecks. {cOLOR0} enthält die Vertexfarbe, die vor der Übergabe an den Fragment-Shader über das Dreieck interpoliert wird. Typ und Semantik dieses Feldes müssen zwischen den Stufen übereinstimmen.'
tutorial.shaders.description: 'Der Vertex-Shader gibt die Clipraum-Position jedes Vertex aus, und der Fragment-Shader gibt die Farbe für jedes bedeckte Pixel aus. Beide Stufen befinden sich mit eigenen Einstiegspunkten in einer Slang-Datei.'
tutorial.shaders.details: 'Erstellen Sie {triangleSlang} im Projektstamm mit diesen Eingabe- und Ausgabestrukturen:'
tutorial.shaders.fragment.description: 'Ergänzen Sie den Fragment-Einstiegspunkt in derselben Datei:'
tutorial.shaders.fragment.details: 'Die Rasterisierung ermittelt die vom Dreieck bedeckten Bildpositionen und erzeugt dort Fragmente. Jedes Fragment erhält eine aus den drei Vertexfarben interpolierte Farbe. {fSMain} gibt diese Farbe zurück; {sVTARGET} leitet das Ergebnis an das erste Farb-Attachment weiter.'
tutorial.shaders.fragment.title: 'Fragment-Shading'
tutorial.shaders.guidance: '{vSInput} definiert die Vertex-Shader-Eingaben. {pOSITION0} und {cOLOR0} identifizieren Attribute über ihre Semantik; C#-Feldnamen stellen diese Zuordnung nicht her.'
tutorial.shaders.title: 'Shader-Stufen'
tutorial.shaders.vertex.description: 'Ergänzen Sie den Vertex-Einstiegspunkt in {triangleSlang}:'
tutorial.shaders.vertex.details: 'Dieser Einstiegspunkt wird einmal pro Vertex ausgeführt, setzt {w} für eine 4D-Position im Clipraum und reicht die Vertexfarbe weiter. Die anschließende perspektivische Division durch w lässt x, y und z in normalisierten Gerätekoordinaten unverändert.'
tutorial.shaders.vertex.title: 'Vertex-Shading'
tutorial.surface.description: 'Laden Sie {cocoaHelperCs} in das Projekt herunter. Die Hilfsklasse bindet den Metal-Layer an das macOS-Fenster.'
tutorial.surface.details: 'Definieren Sie das native Präsentationsziel {emphasis}:'
tutorial.surface.details.emphasis: nach {windowCenter} und vor {windowRun}
tutorial.surface.guidance: 'Der Framebuffer ist das Pixelbild des Fensters, dessen {framebufferSize} bei aktiver Anzeigeskalierung von der logischen Fenstergröße abweichen kann. {surface} fasst diese Pixelmaße mit den nativen Handles für die gewählte Grafik-API zusammen: einem Win32-Fenster unter Windows, dem angebundenen Metal-Layer unter macOS oder einem X11-Display und -Fenster unter Linux.'
tutorial.surface.title: 'Native Oberfläche'
tutorial.swapChain.context: 'Die Swapchain hängt von Kontext und Fenster ab. Ersetzen Sie {windowDispose} am Ende von {programCs} durch diese Freigabereihenfolge:'
tutorial.swapChain.description: 'Erstellen Sie unmittelbar nach der Oberflächenbeschreibung die Swapchain:'
tutorial.swapChain.details: 'Die {swapChain} verwaltet die Präsentationsbilder des Fensters. {drawable} stellt den aktuellen Backbuffer als {texture} bereit, und {present} zeigt ihn an und wechselt zum nächsten Bild.'
tutorial.swapChain.guidance: '{b8G8R8A8UNorm} speichert vier 8-Bit-Kanäle in Blau-, Grün-, Rot- und Alpha-Reihenfolge. {uNorm} bildet die Ganzzahlen von 0 bis 255 auf den Bereich von 0 bis 1 ab. Der Shader gibt die Farbe weiterhin in der logischen RGBA-Reihenfolge aus; das Format bestimmt ihre Speicherung.'
tutorial.swapChain.title: 'Swapchain'
tutorial.title: Erstes Dreieck
tutorial.window.description: 'Ersetzen Sie den Inhalt von {programCs} durch den folgenden Code:'
tutorial.window.details: '{graphicsAPINone} verhindert, dass Silk.NET einen eigenen Grafikkontext für das Fenster erstellt; die Anwendung erstellt später einen Zenith.NET-Kontext. {initialize} erstellt das native Fenster und macht die Handles des Fenstersystems verfügbar. {center} platziert es in der Bildschirmmitte. {run} verarbeitet Ereignisse bis zum Schließen; danach gibt {dispose} das Fenster frei.'
tutorial.window.guidance: 'Erstellen und starten Sie die Anwendung. Prüfen Sie, ob sich das Fenster öffnen, verschieben, in der Größe ändern und schließen lässt. Sein Inhalt ist noch nicht definiert, da keine Renderbefehle eingereicht wurden. Schließen Sie das Fenster, bevor Sie fortfahren.'
tutorial.window.title: 'Fenstererstellung'
