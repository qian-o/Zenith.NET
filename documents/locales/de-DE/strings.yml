tutorial.input.title: Das Scheitelpunkteingabelayout beschreiben
tutorial.lifecycle.description: "Die fertige Anwendung wiederholt diese Abfolge:"
tutorial.lifecycle.details: "Das Schließen des Fensters beendet {run}. Jeder gerenderte Frame hat bereits darauf gewartet, dass seine GPU-Arbeit abgeschlossen ist, sodass wir nun die von ihm verwendeten Ressourcen freigeben können. Die Bereinigung nach {windowRun} sollte wie folgt aussehen:"
tutorial.lifecycle.guidance: "Geben Sie die Swapchain vor ihrem nativen Fenster und den Kontext nach all seinen Ressourcen frei. Die Warteschlange besitzt und recycelt eingereichte Befehlspuffer; die Swapchain besitzt ihre Ausgabetextur. Für diese Befehlspuffer und die Ausgabetextur ist in dieser Anwendung kein eigener {dispose}-Aufruf nötig."
tutorial.lifecycle.title: Den Lebenszyklus eines Frames verfolgen
tutorial.pipeline.behavior: "Fügen Sie nach dem Eingabelayout Folgendes hinzu:"
tutorial.pipeline.context: "{cullNone} füllt das Dreieck aus, ohne eine der beiden Flächenorientierungen zu verwerfen. Die Reihenfolge seiner Scheitelpunkte bestimmt die Flächenwindung; durch Deaktivieren des Cullings wird verhindert, dass diese Reihenfolge unser erstes Dreieck verbirgt."
tutorial.pipeline.description: Wir haben nun Scheitelpunktdaten, ein Eingabelayout und zwei Shader. Die {graphicsPipeline} verbindet sie und gibt an, wie die GPU Scheitelpunkte zu Primitiven zusammensetzt und das Ergebnis in ein Attachment schreibt.
tutorial.pipeline.details: "Eine Pipeline kombiniert programmierbare Shader-Stufen mit Festfunktionseinstellungen, die GPU-Operationen wie Dreieckszusammensetzung, Face-Culling und Blending steuern. Wählen Sie für dieses Dreieck die folgenden Einstellungen:"
tutorial.pipeline.guidance: Das Farbformat stammt aus {swapChainDescFormat}. Es muss mit dem vom Renderpass verwendeten Bild übereinstimmen. {count1} bedeutet ein Sample pro Pixel.
tutorial.pipeline.item: "{triangleList} setzt jeweils drei aufeinanderfolgende Scheitelpunkte zu einem Dreieck zusammen. Wir übergeben drei Scheitelpunkte und zeichnen einmal, sodass kein Indexpuffer benötigt wird."
tutorial.pipeline.notes: "{depthNone} deaktiviert Tiefentests und -schreiben, passend zum Pass ohne Tiefen-Attachment."
tutorial.pipeline.reference: "{opaque} deaktiviert das Blending, sodass die Farbe des Fragment-Shaders den Hintergrund innerhalb des Dreiecks ersetzt."
tutorial.pipeline.title: Shader und Scheitelpunktlayout verbinden
tutorial.pipeline.usage: Die Shader-Objekte können nach dem Erstellen der Pipeline freigegeben werden, wie im Beispiel-Renderer gezeigt. Halten Sie die Pipeline selbst für jeden Frame gültig, der mit ihr zeichnet. Fügen Sie {pipelineDispose} vor {vertexBufferDispose} in die Bereinigung ein. Die Pipeline-Erstellung ist der letzte Initialisierungsschritt vor dem Render-Callback.
tutorial.pipeline.validation: Die Pipeline-Beschreibung deklariert die Attachment-Konfiguration; sie erstellt kein weiteres Bild. {inputLayouts} enthält einen Eintrag, da Position und Farbe zusammen in einem Puffer gespeichert sind.
tutorial.presentation.title: Die GPU mit dem Fenster verbinden
tutorial.project.context: Aktivieren Sie {emphasis} ({allowUnsafeBlocks}) in den Buildeinstellungen des Projekts. Wir verwenden dies, um Scheitelpunktdaten an die GPU zu übergeben, sowie für die nativen Aufrufe des Fenster-Helpers.
tutorial.project.context.emphasis: Unsicheren Code zulassen
tutorial.project.description: "Erstellen Sie das Projekt und wechseln Sie in dessen Verzeichnis:"
tutorial.project.details: "Installieren Sie die Pakete:"
tutorial.project.guidance: "{zenithNET} stellt die gemeinsame Rendering-API bereit. Die drei Backend-Pakete ermöglichen es demselben Programm, die Implementierung für seine Plattform auszuwählen. {zenithNETCompiler} kompiliert Slang-Shader – die kleinen GPU-Programme, die wir später schreiben – für diese Implementierung. Silk.NET liefert das Fenster und die Ereignisschleife."
tutorial.project.title: Konsolenprojekt erstellen
tutorial.requirements.context: Sie können dieser Seite von einem leeren Projekt aus folgen. Das {link} und sein {detail} stehen als Referenz für die hier verwendeten Rendering- und Fenster-APIs zur Verfügung.
tutorial.requirements.context.detail: gemeinsamer Host
tutorial.requirements.context.link: Hallo-Dreieck-Beispiel
tutorial.requirements.description: "Sie benötigen das {emphasis}, einen Code-Editor oder eine IDE sowie einen Desktop-PC mit einer GPU und einem Treiber, die von einem Zenith.NET-Backend unterstützt werden. Grundlegende Vertrautheit mit C# genügt; die Grafikkonzepte werden bei ihrer ersten Verwendung eingeführt. Dies ist ein gewöhnliches {net10}-Konsolenprojekt. Ein Backend übersetzt Zenith.NET-Operationen in Aufrufe einer Grafik-API wie DirectX 12, Metal oder Vulkan. Die Anwendung wählt beim Start eines davon aus:"
tutorial.requirements.description.emphasis: .NET 10 SDK
tutorial.requirements.details: Linux benötigt eine X11-kompatible Fenstersitzung für den hier verwendeten Fensterpfad. Optionale Raytracing- und Mesh-Shading-Funktionen sind für dieses Dreieck nicht erforderlich.
tutorial.requirements.guidance: Zenith.NET rendert in eine von der Anwendung bereitgestellte Oberfläche. Silk.NET.Windowing erstellt das Desktop-Fenster und verarbeitet dessen Ereignisse. Unter macOS ist das Präsentationsziel ein Metal-Layer ({cAMetalLayerCs}); der Fenster-Helper des Tutorials bindet diesen Layer für uns ein.
