tutorial.requirements.title: Bevor Sie beginnen
tutorial.resize.context: "Führen Sie {dotnetRun} erneut aus. Das Fenster sollte nun einen einheitlichen dunklen Hintergrund haben, der es auch nach einer Größenänderung weiterhin vollständig ausfüllt. Behalten Sie diesen Callback bei: Das Dreieck wird innerhalb seines bestehenden Renderpasses gezeichnet."
tutorial.resize.description: "Die Bilder der Swapchain müssen den Framebuffer-Abmessungen folgen. Verwenden Sie {framebufferResize}, um auf Änderungen der Pixelgröße zu reagieren, einschließlich Änderungen durch Anzeigeskalierung. Fügen Sie nach dem Render-Callback, weiterhin vor {windowRun}, Folgendes hinzu:"
tutorial.resize.details: Silk.NET unterscheidet Fenstergrößenänderungen von {link}. Wir benötigen Letzteres, da die Swapchain Pixel speichert. Ein minimiertes Fenster kann einen Framebuffer der Größe null haben. Beide Callbacks überspringen in diesem Fall ihre GPU-Arbeit. Nach einer Größenänderung verwendet der Renderpass die neuen Attachment-Abmessungen für seinen Viewport und Scissor.
tutorial.resize.details.link: Framebuffer-Größenänderungen
tutorial.resize.guidance: Wir warten nach jeder Übermittlung, sodass kein früherer Frame die Bilder mehr verwendet, wenn der Resize-Handler sie ersetzt. Die aktuelle Implementierung von {present} wartet ebenfalls auf der Grafikwarteschlange. Diese einfache Schleife stellt sicher, dass die Arbeit eines Frames abgeschlossen ist, bevor der nächste beginnt; {link} behandelt fortgeschrittenere Ablaufsteuerungen.
tutorial.resize.guidance.link: Synchronisation
tutorial.resize.title: Auf Größenänderungen reagieren
tutorial.shaders.compilation.context: Die Kompilierung erfolgt einmalig während der Initialisierung. {appContextBaseDirectory} findet den kopierten Shader neben der ausführbaren Datei, unabhängig vom aktuellen Arbeitsverzeichnis. Diese Shader verarbeiten nur Scheitelpunkteingaben, daher müssen noch keine Konstantenpuffer, Texturen oder Ressourcen-Handles gebunden werden.
tutorial.shaders.compilation.description: Legen Sie in den Dateieigenschaften für {triangleSlang} die Option {emphasis} auf {detail} fest. Dadurch wird der Shader neben der ausführbaren Datei verfügbar gemacht.
tutorial.shaders.compilation.description.detail: Kopieren, wenn neuer
tutorial.shaders.compilation.description.emphasis: In Ausgabeverzeichnis kopieren
tutorial.shaders.compilation.details: "Kehren Sie zu {programCs} zurück. Fügen Sie nach dem Scheitelpunkt-Upload diese Initialisierungsanweisungen vor dem Render-Callback ein:"
tutorial.shaders.compilation.guidance: "{zenithCompiler} gibt eine Shader-Beschreibung zurück, die Code für die angeforderte Grafik-API enthält. {createShader} erstellt das entsprechende Backend-Objekt. Sowohl die Grafik-API als auch die Namen der Einstiegspunkte sind wichtig: Verwenden Sie {contextGraphicsApi} und schreiben Sie {vSMain} und {fSMain} exakt so wie in der Slang-Datei."
tutorial.shaders.compilation.title: Für das ausgewählte Backend kompilieren
tutorial.shaders.context: "{fSInput} verbindet die Ausgabe des Vertex-Shaders mit der Eingabe des Fragment-Shaders. Wenn es vom Vertex-Shader geschrieben wird, liefert {sVPOSITION} eine Clip-Space-Position: die vier Koordinaten, anhand derer die GPU bestimmt, was innerhalb des sichtbaren Bildes liegt. {cOLOR0} überträgt die zwischen den Scheitelpunkten zu interpolierende Farbe. Beide Stufen müssen hinsichtlich Typ und Semantik übereinstimmen."
tutorial.shaders.description: Ein Shader ist ein von der GPU ausgeführtes Programm. Dieser Zeichenvorgang benötigt einen Vertex-Shader zur Positionierung der Scheitelpunkte und einen Fragment-Shader zur Erzeugung der Farben innerhalb des Dreiecks. Wir werden sie in Slang schreiben, einer Shader-Sprache, und zwei Einstiegspunkte aus derselben Datei kompilieren. Ein Einstiegspunkt ist die Funktion, an der die Ausführung einer Shader-Stufe beginnt.
tutorial.shaders.details: "Erstellen Sie {triangleSlang}, beginnend mit diesen beiden Strukturen:"
tutorial.shaders.fragment.description: "Fügen Sie den Fragment-Einstiegspunkt an dieselbe Datei an:"
tutorial.shaders.fragment.details: Die Rasterung bestimmt, welche Bildbereiche das Dreieck abdeckt. Sie erzeugt Fragmente – die vom Fragment-Shader verarbeiteten Daten – mit über den abgedeckten Bereich interpolierten Scheitelpunktfarben. {fSMain} gibt diese interpolierte Farbe über {sVTARGET} zurück, was das erste Farb-Attachment identifiziert.
tutorial.shaders.fragment.guidance: Die Interpolation der Scheitelpunktfarben ist getrennt vom Blending der Attachments zu betrachten. Blending kombiniert die Ausgabe eines Fragments mit der bereits im Attachment gespeicherten Farbe. Unser opaker Blend-Zustand deaktiviert diese Kombination, sodass die interpolierte Farbe den Hintergrund innerhalb des Dreiecks ersetzt.
tutorial.shaders.fragment.title: Die Fragmente einfärben
tutorial.shaders.guidance: "{vSInput} beschreibt, was der Vertex-Shader aus dem Scheitelpunktpuffer empfängt. Die Semantiken {pOSITION0} und {cOLOR0} identifizieren die Eingaben; C#-Feldnamen allein begründen diese Zuordnung nicht."
tutorial.shaders.title: Die beiden Shader-Stufen schreiben
tutorial.shaders.vertex.description: "Fügen Sie den Vertex-Einstiegspunkt an {triangleSlang} an:"
tutorial.shaders.vertex.details: Die GPU ruft diesen Einstiegspunkt für jeden Eingabescheitelpunkt auf. Er fügt der Position die homogene Koordinate {w} hinzu und leitet die Farbe weiter. Nach der Vertex-Stufe wird die Position durch w geteilt; hier lässt diese Division x, y und z unverändert. Aus diesem Grund können die oben gewählten Positionen direkt als normalisierte Gerätekoordinaten verstanden werden.
tutorial.shaders.vertex.title: Jeden Scheitelpunkt positionieren
tutorial.surface.description: "Der Kontext muss auch wissen, wo er seine Ausgabe anzeigen soll. Fügen Sie Folgendes {emphasis} hinzu:"
tutorial.surface.description.emphasis: nach {windowCenter} und vor {windowRun}
tutorial.surface.details: "{surface} beschreibt ein natives Präsentationsziel und seine Pixelabmessungen. Der Framebuffer ist das mit dem Fenster verknüpfte Pixelbild. {framebufferSize} gibt seine Abmessungen in Pixeln an; die logischen Abmessungen des Fensters können abweichen, wenn die Anzeigeskalierung aktiviert ist."
tutorial.surface.guidance: Die Oberfläche entspricht dem oben ausgewählten Backend. Windows liefert ein Fenster-Handle, Linux liefert ein X11-Display und -Fenster, und der macOS-Helper stellt den angebundenen Metal-Layer bereit. Dies ist der einzige plattformspezifische Teil der Verbindung unseres Fensters mit dem Rendering.
tutorial.surface.title: Die native Oberfläche beschreiben
tutorial.swapChain.context: "Die Swapchain verwendet sowohl den Kontext als auch das native Fenster. Ersetzen Sie die Zeile {windowDispose} am Ende von {programCs} durch diese Bereinigungsreihenfolge:"
tutorial.swapChain.description: "Verwenden Sie die Oberflächenbeschreibung, um die Bilder zu erstellen, die präsentiert werden sollen. Fügen Sie unmittelbar nach dem Oberflächenblock Folgendes hinzu:"
tutorial.swapChain.details: Die {swapChain} verwaltet die im Fenster angezeigten Bilder. In jedem Frame liefert uns {drawable} das aktuelle Bild als {texture}, den API-Typ für Bilddaten. Nach dem Zeichnen fordert {present} die Anzeige des Ergebnisses an und wechselt zum nächsten Drawable.
tutorial.swapChain.guidance: "{b8G8R8A8UNorm} speichert vier 8-Bit-Farbkanäle in der Reihenfolge Blau, Grün, Rot und Alpha. {uNorm} bedeutet, dass ganzzahlige Werte von 0 bis 255 Werte von 0 bis 1 darstellen. Der Shader gibt weiterhin einen logischen RGBA-Wert zurück; dieses Format bestimmt, wie diese Kanäle im Bild gespeichert werden. Später wird die Grafikpipeline {swapChainDescFormat} verwenden, um dieses Attachment abzugleichen."
tutorial.swapChain.title: Die Swapchain erstellen
tutorial.title: Erstes Dreieck
tutorial.troubleshooting.description: "Lesen Sie zuerst jeden Fehler in der Konsole und nutzen Sie dann die früheren Kontrollpunkte, um die fehlgeschlagene Stufe zu identifizieren:"
tutorial.troubleshooting.details: "Verwenden Sie den {link} und den {detail}, um Scheitelpunktdaten, Eingabelayout und Zeichenoperation zu vergleichen. Das Beispiel organisiert Fensterverwaltung und Einreichung in einem gemeinsamen Host; dieses Tutorial hält den Anwendungsablauf in {programCs}. Fahren Sie mit {context} fort, um indexiertes Zeichnen, Transformationen und Tiefentests kennenzulernen."
tutorial.troubleshooting.details.context: Rotierender Würfel
tutorial.troubleshooting.details.detail: Slang-Shader
tutorial.troubleshooting.details.link: Beispiel-Renderer
tutorial.troubleshooting.table.backend.check: Überprüfen Sie, ob das ausgewählte Backend vom Gerät und dem installierten Grafiktreiber unterstützt wird.
tutorial.troubleshooting.table.backend.symptom: Backend-Erstellung schlägt fehl
tutorial.troubleshooting.table.drawing.check: Überprüfen Sie die Upload-Größe, das Eingabelayout, die Pipeline-Auswahl und die Platzierung der Zeichenbefehle innerhalb des Renderpasses.
tutorial.troubleshooting.table.drawing.symptom: Der Hintergrund erscheint, aber das Dreieck nicht
tutorial.troubleshooting.table.headings.check: Prüfung
tutorial.troubleshooting.table.headings.symptom: Symptom
tutorial.troubleshooting.table.input.check: Überprüfen Sie den Stride von 28 Bytes und die Positions-/Farboffsets von 0 und 12.
tutorial.troubleshooting.table.input.symptom: Scheitelpunktpositionen oder -farben sind fehlerhaft
tutorial.troubleshooting.table.shaders.check: Überprüfen Sie die kopierte Datei {triangleSlang}, die Schreibweise des Einstiegspunkts und die vom Compiler gemeldete Diagnose.
tutorial.troubleshooting.table.shaders.symptom: Der Schritt mit der Hintergrundfarbe funktioniert, aber das Laden der Shader schlägt fehl
tutorial.troubleshooting.table.window.check: Bestätigen Sie, dass das .NET-Projekt kompiliert wird und der reine Fensterschritt in einer Desktop-Sitzung ausgeführt wird. Überprüfen Sie unter Linux, ob X11 oder XWayland verfügbar ist.
tutorial.troubleshooting.table.window.symptom: Es öffnet sich kein Fenster
tutorial.troubleshooting.title: Die fehlgeschlagene Stufe überprüfen
tutorial.window.context: "{usingZenithTutorials} importiert den Namespace des Helpers. Jede C#-Datei verwendet ihre eigenen gewöhnlichen using-Direktiven, sodass der Interop-Import in beiden Dateien benötigt wird. Der Alias {buffer} verweist auf den Zenith.NET-Puffertyp und unterscheidet ihn von {systemBuffer}."
tutorial.window.description: Fügen Sie dem Projekt {cocoaHelperCs} hinzu und behalten Sie dessen Namespace bei. Fügen Sie {interopUsing} ganz oben in dieser Datei vor der Namespace-Deklaration ein. Der Helper bindet unter macOS einen Metal-Layer an das Fenster an; die anderen Plattformzweige rufen ihn nicht auf.
tutorial.window.details: "Ersetzen Sie die generierte {programCs} durch den folgenden Code. Sie verwendet Top-Level-Anweisungen, die der Reihe nach ohne explizite {main}-Methode ausgeführt werden. Spätere Abschnitte erläutern, an welchen Stellen Sie dieser Datei weiteren Code hinzufügen:"
tutorial.window.guidance: "{graphicsAPINone} weist Silk.NET an, ein Fenster ohne eigenen Grafikkontext zu erstellen. Wir werden diesen Kontext mit Zenith.NET erstellen. {initialize} erstellt das native Fenster und macht dessen Handles verfügbar. Ein Handle ist ein vom Fenstersystem bereitgestellter Bezeichner. {center} zentriert das Fenster, und {run} verarbeitet Ereignisse, bis es geschlossen wird. Die Ausführung fährt dann mit {dispose} fort, wodurch das Fenster freigegeben wird."
tutorial.window.notes: Führen Sie {dotnetRun} aus. Ein leeres Fenster sollte sich öffnen und auf Verschieben, Größenänderungen und Schließen reagieren. Sein Inhalt ist noch nicht definiert, da wir noch keine Rendering-Befehle eingereicht haben. Schließen Sie es, bevor Sie fortfahren.
tutorial.window.title: Ein Fenster öffnen
