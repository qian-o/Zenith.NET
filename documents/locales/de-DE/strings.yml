### YamlMime:Resources
concepts.execution.context.description: 'Ein {graphicsContext} verbindet die Anwendung über die gewählte Grafik-API mit einem GPU-Gerät und stellt dessen Grafik-, Compute-, Transfer- und Präsentationswarteschlangen bereit. Gemeinsam verwendete Ressourcen müssen demselben Kontext angehören: Puffer, Texturen, Shader, Pipelines und ihre Handles lassen sich nicht über Kontextgrenzen hinweg binden.'
concepts.execution.context.details: '{capabilities} liefert den Gerätenamen und die unterstützten Funktionen. Prüfen Sie mit {rayTracingSupported} und {meshShadingSupported}, ob die jeweilige Funktion verfügbar ist, bevor Sie ihre Ressourcen erstellen. Die Beispiele für {link} und {detail} zeigen diese Prüfung bei der Initialisierung.'
concepts.execution.context.details.detail: Mesh-Shading
concepts.execution.context.details.link: Raytracing
concepts.execution.context.title: 'Grafikkontext'
concepts.execution.description: 'GPU-Arbeit beginnt auf der CPU: Die Anwendung erstellt Ressourcen, zeichnet Befehle zu ihrer Verwendung auf und reicht diese bei einer Warteschlange ein. Danach kann die CPU weiterarbeiten, während die GPU die Befehle ausführt. Die benötigten Ressourcen müssen bis zum Ende dieser Ausführung verfügbar bleiben.'
concepts.execution.ownership.description: 'Der Besitz legt fest, wer ein Objekt freigibt; der GPU-Abschluss bestimmt, wann dies zulässig ist. {dispose} gibt native Ressourcen auch dann frei, wenn noch C#-Referenzen auf das Objekt bestehen. Das Einreichen von Befehlen überträgt den Besitz ihrer Ressourcen nicht an die Warteschlange.'
concepts.execution.ownership.details: 'Stoppen Sie beim Beenden neue Einreichungen und warten Sie auf die letzte Ressourcennutzung in allen beteiligten Warteschlangen. Geben Sie zuerst die Anwendungsressourcen und anschließend den Kontext frei, der seine Warteschlangen freigibt.'
concepts.execution.ownership.guidance: 'Verfolgen Sie während des Renderings den Abschluss aller Zugriffe auf Daten, die überschrieben, oder Ressourcen, die ersetzt werden sollen. Warten Sie auf diese Zugriffe, bevor Sie den betreffenden Speicher ändern oder freigeben. Wie Ansichten und ihre zugrunde liegenden Ressourcen in dieses Lebensdauermodell passen, beschreibt {link}.'
concepts.execution.ownership.guidance.link: Ressourcenverwaltung
concepts.execution.ownership.table.applicationResources.disposalResponsibility: Die Anwendung gibt sie nach ihrer letzten GPU-Verwendung frei.
concepts.execution.ownership.table.applicationResources.object: Von der Anwendung erstellte Ressourcen
concepts.execution.ownership.table.commandBuffers.disposalResponsibility: Die Warteschlange verwaltet und recycelt sie.
concepts.execution.ownership.table.commandBuffers.object: Geliehene Befehlspuffer
concepts.execution.ownership.table.headings.disposalResponsibility: 'Verantwortung für die Freigabe'
concepts.execution.ownership.table.headings.object: Objekt
concepts.execution.ownership.table.queues.disposalResponsibility: Der Kontext und die Warteschlangen verwalten sie.
concepts.execution.ownership.table.queues.object: 'Kontextwarteschlangen und ihre Timelines'
concepts.execution.ownership.table.swapChainDrawable.disposalResponsibility: Die Swapchain verwaltet diese Textur.
concepts.execution.ownership.title: 'Besitz und Lebensdauer'
concepts.execution.pipelines.description: 'Eine Grafikpipeline legt Shader, Vertex-Eingabelayout, Primitivzusammensetzung, Attachment-Formate und Renderzustand für Zeichenbefehle fest. Wählen Sie die Pipeline, bevor Sie Vertex-, Index- oder Konstantendaten binden. Attachment-Formate und Sample-Anzahl müssen mit dem Renderpass übereinstimmen.'
concepts.execution.pipelines.details: 'Eine Compute-Pipeline wählt den Shader-Einstiegspunkt für einen Dispatch. Binden Sie Pipeline und Konstanten vor dem Dispatch, außerhalb eines Grafik-Renderpasses.'
concepts.execution.pipelines.guidance: 'Der {link} zeigt die Grafiksequenz. Das {detail} ergänzt einen Compute-Dispatch vor dem Grafikpass, der dessen Ausgabe darstellt.'
concepts.execution.pipelines.guidance.detail: Compute-Beispiel
concepts.execution.pipelines.guidance.link: Render-Callback des Dreiecks
concepts.execution.pipelines.title: 'Pipeline-Zustand'
concepts.execution.queues.description: '{graphicsQueue} ist der übliche Ausgangspunkt für Frames mit Zeichnen, Berechnungen und Kopien. Abhängige Operationen auf einer Warteschlange lassen sich einfacher anordnen.'
concepts.execution.queues.details: 'Nutzen Sie zusätzliche Warteschlangen, um unabhängige Aufgaben überlappend auszuführen. Verwendet eine Warteschlange Daten aus einer anderen, verbinden Sie ihre Einreichungen durch eine explizite Abhängigkeit.'
concepts.execution.queues.guidance: 'Auch innerhalb einer Warteschlange können abhängige Operationen Barrieren oder Texturübergänge benötigen, damit spätere Zugriffe die Ergebnisse früherer Schreibvorgänge sehen. Diese Speicherabhängigkeiten sind von der Einreichungsreihenfolge zu unterscheiden. Wie sie angegeben werden, erläutert {link}.'
concepts.execution.queues.guidance.link: Synchronisation
concepts.execution.queues.table.computeQueue.supportedWork: Compute-Dispatches und kompatible Transferarbeiten, ohne Grafik-Renderpässe.
concepts.execution.queues.table.graphicsQueue.supportedWork: 'Renderpässe, Zeichenbefehle sowie Compute- und Transferoperationen.'
concepts.execution.queues.table.headings.queue: Warteschlange
concepts.execution.queues.table.headings.supportedWork: 'Unterstützte Operationen'
concepts.execution.queues.table.presentQueue.supportedWork: 'Dieselben Operationen wie die Grafikwarteschlange, genutzt zum Beschreiben und Präsentieren von Ausgabetexturen, wenn {swapChainDescIsPresentQueueEnabled} auf {true} gesetzt ist.'
concepts.execution.queues.table.transferQueue.supportedWork: Upload-, Download- und Kopierarbeiten, ohne Zeichnen oder Compute-Dispatches.
concepts.execution.queues.title: 'Wahl der Warteschlange'
concepts.execution.recording.context: 'Die Warteschlange nimmt abgeschlossene Befehlspuffer zur Wiederverwendung zurück. Fordern Sie für jede Aufzeichnung mit {queueCommandBuffer} einen Puffer an, zeichnen Sie jeweils nur von einem Thread aus auf und reichen Sie den Puffer einmal ein. Nach der Einreichung übernimmt die Warteschlange seine Verwaltung; ändern Sie ihn nicht mehr, reichen Sie ihn nicht erneut ein und geben Sie ihn nicht selbst frei.'
concepts.execution.recording.description: '{queueCommandBuffer} liefert einen {commandBuffer} mit bereits begonnener Aufzeichnung. Zeichnen Sie die Operationen und ihre Abhängigkeiten auf und rufen Sie anschließend einmal {submit} auf. Dadurch endet die Aufzeichnung; der zurückgegebene {timelineValue} bezeichnet den Abschlusspunkt in dieser Warteschlange.'
concepts.execution.recording.details: 'Nach der Aufzeichnung eines Frames in {commandBuffer} reicht das Dreieck-Tutorial die Befehle ein und wartet:'
concepts.execution.recording.guidance: '{submit} plant die aufgezeichneten Befehle zur Ausführung ein, und {wait} blockiert den aufrufenden Thread bis zum Abschluss dieser Einreichung, sodass jeder Frame vor Beginn des nächsten abgeschlossen ist.'
concepts.execution.recording.title: 'Aufzeichnung und Einreichung'
concepts.execution.title: Ausführungsmodell
concepts.platforms.description: 'Die Präsentation übernimmt entweder direkt die Anwendung oder ein UI-Steuerelement. Diese Wahl bestimmt, wer für jeden Frame die Ausgabetextur (Drawable) bezieht, Befehle einreicht und das Ergebnis präsentiert.'
concepts.platforms.frame.context: 'Beenden Sie jeden begonnenen Renderpass vor der Rückkehr des Handlers und reichen Sie den übergebenen Befehlspuffer oder die Ausgabetextur weder selbst ein noch geben Sie sie frei. Ändert der Handler das Layout der Ausgabetextur, stellen Sie vor der Rückkehr {colorAttachment} wieder her.'
concepts.platforms.frame.description: 'Die Steuerelemente implementieren {iZenithView}. Die Anwendung weist {graphicsContext} zu, aktualisiert die Szene in {updateRequested} und zeichnet in {renderRequested} anhand der übergebenen {renderEventArgs} auf.'
concepts.platforms.frame.details: 'In jedem Frame bezieht das Steuerelement einen Befehlspuffer und eine Ausgabetextur, überführt die Ausgabetextur nach {colorAttachment}, ruft die Update- und Render-Handler auf und reicht den Frame anschließend ein und präsentiert ihn.'
concepts.platforms.frame.guidance: 'Ergänzen Sie {usingZenithNET} in der Datei. Für ein initialisiertes {iZenithView} namens {view} mit zugewiesenem Grafikkontext registrieren Sie diesen Handler, der die Ausgabetextur mit einer Farbe füllt:'
concepts.platforms.frame.notes: 'Der anfängliche Übergang verwendet {undefined} und erlaubt damit, den bisherigen Bildinhalt zu verwerfen. Füllen oder zeichnen Sie deshalb in jedem Frame das gesamte Bild neu. Speichern Sie akkumulierte oder zwischengespeicherte Ergebnisse in einer anwendungseigenen Textur und zeichnen Sie diese anschließend in die Ausgabetextur des Steuerelements.'
concepts.platforms.frame.reference: 'Verwenden Sie {descFormat}, {descWidth}, {descHeight} und {descSampleCount} der im Render-Ereignis bereitgestellten Ausgabetextur, um passende Attachments zu erstellen. Diese Textur liefert die tatsächlichen Maße des Renderziels. Richten Sie sich nach diesen Maßen, statt sie aus der Layoutgröße des Steuerelements oder der Anzeigeskalierung zu berechnen.'
concepts.platforms.frame.title: 'Rendering über UI-Steuerelemente'
concepts.platforms.lifecycle.description: 'Die Swapchain verwendet Breite und Höhe des Framebuffers in Pixeln. Bei Anzeigeskalierung können sie von den logischen Fenstermaßen abweichen. Setzen Sie Rendering und die Größenanpassung der Swapchain aus, solange eine Abmessung null ist. Beziehen Sie {swapChainDrawable} für jeden Frame neu: Diese Textur gehört der Swapchain und kann nach Präsentation oder Größenänderung ersetzt werden.'
concepts.platforms.lifecycle.details: 'Ändert sich die Framebuffer-Größe, warten Sie vor {swapChainResize} auf alle noch laufenden GPU-Zugriffe auf die alten Bilder. Wird das native Präsentationsziel selbst ersetzt, warten Sie ebenfalls auf den Abschluss dieser Zugriffe und übergeben Sie die neue Oberflächenbeschreibung an {swapChainRefresh}. Geben Sie beim Beenden die Swapchain vor ihrem nativen Präsentationsziel frei.'
concepts.platforms.lifecycle.guidance: 'Richten sich anwendungseigene Tiefen- oder Offscreen-Texturen nach der Fenstergröße, erstellen Sie sie bei einer Größenänderung neu und aktualisieren Sie Konstanten mit ihren Handles. Die Pipeline bleibt verwendbar, solange Attachment-Formate und Sample-Anzahlen weiterhin übereinstimmen. Der {link} zeigt, wie angepasste Texturen und eine wiederverwendete Pipeline zusammenarbeiten.'
concepts.platforms.lifecycle.guidance.link: Renderer des rotierenden Würfels
concepts.platforms.lifecycle.title: 'Swapchain-Abmessungen und Lebensdauer'
concepts.platforms.ownership.description: 'Die Anwendung besitzt den zugewiesenen Kontext und ihre Rendering-Ressourcen, das Steuerelement seine Präsentationsressourcen. Ändert sich {graphicsContext}, erstellt das Steuerelement seine Präsentationsressourcen neu; erstellen Sie auch die Puffer, Texturen und Pipelines der Anwendung für den neuen Kontext neu.'
concepts.platforms.ownership.details: 'Halten Sie vor dem Ersetzen von Rendering-Ressourcen die Frame-Schleife der Ansicht an und warten Sie auf die GPU-Arbeit, die diese Ressourcen verwendet. Geben Sie danach die alten Ressourcen frei. Der Kontext darf erst freigegeben werden, wenn jede Ansicht ihre Präsentationsressourcen für diesen Kontext freigegeben hat und alle daraus erstellten Anwendungsressourcen freigegeben wurden.'
concepts.platforms.ownership.guidance: 'Das Steuerelement führt die Frame-Handler über seinen UI-Dispatcher aus. Beschränken Sie diese Handler auf Szenenaktualisierung und Befehlsaufzeichnung; aufwendige CPU-Arbeit verzögert dort auch die Benutzeroberfläche.'
concepts.platforms.ownership.title: 'Verantwortung von Anwendung und Steuerelement'
concepts.platforms.presentQueue.context: '{swapChainPresent} wartet nur auf {swapChainQueue}. Verfolgen Sie Render-Einreichungen gesondert, bevor Sie deren Ressourcen wiederverwenden oder freigeben, und beenden Sie die Präsentation vor dem Aufruf von {swapChainResize} oder der Freigabe der Swapchain.'
concepts.platforms.presentQueue.description: 'Standardmäßig präsentiert eine Swapchain über {graphicsQueue}. Wird {swapChainDescIsPresentQueueEnabled} auf {true} gesetzt, nutzt sie stattdessen {presentQueue}; dadurch ist die Präsentation von späterer Arbeit in {graphicsQueue} entkoppelt, sodass ein eigener Thread gerenderte und generierte Frames unabhängig takten kann.'
concepts.platforms.presentQueue.details: '{swapChainQueue} liefert die Präsentationswarteschlange der Swapchain. Zeichnen Sie alle Schreibzugriffe auf {swapChainDrawable} in dieser Warteschlange auf, reichen Sie sie mit einer Abhängigkeit von der Render-Einreichung ein, warten Sie auf den Abschluss und präsentieren Sie anschließend:'
concepts.platforms.presentQueue.guidance: 'Hier ist {rendered} der Abschlusswert der Einreichung, die {frame} im Layout {copySrc} erzeugt hat, und {extent} entspricht der Größe der Ausgabetextur. Das Warten auf die Kopiereinreichung deckt sowohl die Renderabhängigkeit als auch die Kopie selbst ab, ohne auf spätere Arbeit in der Grafikwarteschlange zu warten.'
concepts.platforms.presentQueue.title: 'Verwendung der Präsentationswarteschlange'
concepts.platforms.surface.description: 'Das {link} verwendet Silk.NET für Fenstererstellung und Ereignisverarbeitung. Zenith.NET erhält die nativen Fensterhandles und Abmessungen in einer {surface}-Beschreibung und erstellt damit eine {swapChain}. Für das Betriebssystemfenster bleibt die Anwendung verantwortlich.'
concepts.platforms.surface.description.link: 'Dreieck-Tutorial'
concepts.platforms.surface.details: 'Die benötigten Oberflächenhandles hängen von der Grafik-API und dem Fenstersystem ab. Häufige Kombinationen sind:'
concepts.platforms.surface.guidance: 'Der Beispielhost in {appCs} unterstützt Windows, macOS und X11. Unter Linux liefert sein Fenster Xlib-Handles; eine Wayland-Sitzung benötigt deshalb XWayland. Eine native Wayland-Anwendung übergibt Display- und Surface-Handles über {surfaceWayland}.'
concepts.platforms.surface.table.android.graphicsApiAndPlatform: Vulkan unter Android.
concepts.platforms.surface.table.apple.graphicsApiAndPlatform: Metal auf Apple-Plattformen.
