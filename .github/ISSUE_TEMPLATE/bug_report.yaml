name: Bug report
description: Create a report to help us improve
title: "Bug Report: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please make sure you are using the latest version of Zenith.NET.

  - type: textarea
    validations:
      required: true
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: E.g. When initializing a DirectX12 context, an exception is thrown on integrated graphics.

  - type: textarea
    validations:
      required: true
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior. Include a minimal code example if possible.
      placeholder: |
        1. Create a GraphicsContext with DirectX12
        2. Call CreateSwapChain()
        3. See exception

  - type: textarea
    validations:
      required: true
    attributes:
      label: Expected behavior
      description: What you expected to happen.
      placeholder: DirectX12 context should initialize successfully.

  - type: textarea
    validations:
      required: true
    attributes:
      label: Environment
      description: Please provide your environment details.
      placeholder: |
        - OS: Windows 11 / macOS 15 / Ubuntu 24.04 / etc.
        - Graphics API: DirectX12 / Metal / Vulkan
        - Zenith.NET Version: 1.0.0
        - GPU: NVIDIA RTX 4090 / Apple M3 / etc.

  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context, screenshots, logs, or code snippets.
      placeholder: Any additional information that might help us understand and fix the issue.
