name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:
    branches: ["*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build-args: ""
          - os: macos-latest
            build-args: "/p:EnableWindowsTargeting=true"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Workload
        run: dotnet workload install maui

      - name: Build
        run: dotnet build -c Release ${{ matrix.build-args }}
